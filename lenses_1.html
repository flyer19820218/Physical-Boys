<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 光學｜光的直進與針孔成像 黑板模擬器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1300px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 2.1rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 780px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-family: 'Kalam', cursive; font-size: 1.25rem; margin: 0 0 14px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.92rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
    }
    .mode-switch button span.sub { font-size: 0.75rem; font-weight: 400; opacity: 0.7; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.4); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.85; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 14px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--chalk-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 5px; background: transparent; cursor: pointer; }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 10px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--chalk-yellow); font-weight: 600; margin-top: 3px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 14px 18px; }
    .explain-box h3 { font-family: 'Kalam', cursive; color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.1rem; }
    .explain-box p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; }

    .quiz-box { background: rgba(95, 176, 255, 0.1); border: 1px dashed var(--x-color); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .quiz-box h4 { margin: 0 0 8px 0; color: var(--x-color); font-size: 1rem; }
    .quiz-box p { margin: 4px 0; font-size: 0.9rem; }
    
    footer { text-align: center; color: var(--chalk-dim); font-size: 0.8rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 1-1 & 1-2</div>
      <h1>光學一：光的直進與針孔成像</h1>
      <p>從影子的形成，到針孔的縮放與移動。拖拉滑桿，帶領學生視覺化破解考卷上的經典題型！</p>
    </header>

    <div class="board">
      <h2>① 選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="shadow">
          <span>🌑 1. 光的直進與影子</span>
          <span class="sub">光線到不了的地方</span>
        </button>
        <button data-mode="pinhole_basic">
          <span>🕯️ 2. 針孔成像原理</span>
          <span class="sub">物距與像距的正比關係</span>
        </button>
        <button data-mode="pinhole_move">
          <span>🕳️ 3. 考題：針孔的移動</span>
          <span class="sub">固定物與屏，單獨移動孔</span>
        </button>
        <button data-mode="quiz_pdf">
          <span>📝 4. 講義實戰演練</span>
          <span class="sub">講義 Ex1 與 Ex2 隨堂測驗</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="visual-card">
        <svg id="visualSvg" viewBox="-300 -160 600 320"></svg>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>② 課堂重點與原理解析</h2>
      <div id="quizContainer"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer>國中理化 光學單元 · 視覺化互動教學教材 · 設計：彥君老師</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const visualSvg = document.getElementById('visualSvg');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const quizContainer = document.getElementById('quizContainer');

      let currentMode = 'shadow';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const params = {
        shadow: { lightSize: 5, objHeight: 60, dist: 100 },
        pinhole_basic: { p: 100, q: 100, h: 40, holes: '1' },
        pinhole_move: { totalL: 200, pinholeX: 0, h: 40 },
        quiz_pdf: { pinholeX: -100 } // 對應講義題目的動態針孔位置
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { for (let key in attrs) el.setAttribute(key, attrs[key]); }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal') {
          const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC' });
          t.textContent = txt;
          parent.appendChild(t);
      }

      function initUI() {
        quizContainer.innerHTML = '';
        renderControls();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, label, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${label} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            const newVal = parseFloat(e.target.value);
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            onChange(newVal);
            updateSimulation();
          });
        };

        if (m === 'shadow') {
          addSlider('lightSize', '光源大小 (點光源 ↔ 擴展光源)', 2, 40, 2, p.lightSize, 'cm', v => p.lightSize = v);
          addSlider('objHeight', '障礙物大小', 20, 100, 5, p.objHeight, 'cm', v => p.objHeight = v);
        } else if (m === 'pinhole_basic') {
          addSlider('p', '物距 (物體到針孔)', 40, 200, 10, p.p, 'cm', v => p.p = v);
          addSlider('q', '像距 (屏幕到針孔)', 40, 200, 10, p.q, 'cm', v => p.q = v);
          
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>考題情境：紙板孔洞 <span class="val">點擊切換</span></label>
            <div style="display:flex; gap:6px; margin-top:4px;">
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === '1' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '1' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer;" onclick="setHole('1')">1洞</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === '2' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '2' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer;" onclick="setHole('2')">2洞</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === '3' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '3' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer;" onclick="setHole('3')">3洞</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === 'large' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === 'large' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer;" onclick="setHole('large')">大洞</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setHole = (val) => { p.holes = val; renderControls(); updateSimulation(); };
        } else if (m === 'pinhole_move') {
          addSlider('pinholeX', '移動針孔 (左 ↔ 右)', -120, 120, 5, p.pinholeX, 'cm', v => p.pinholeX = v);
        } else if (m === 'quiz_pdf') {
          addSlider('pinholeX', '拖拉針孔驗證解答', -120, 80, 2, p.quiz_pdf?.pinholeX || -100, 'cm', v => p.quiz_pdf.pinholeX = v);
          
          quizContainer.innerHTML = `
            <div class="quiz-box">
              <h4>📖 講義實戰題 (配合上方互動驗證)</h4>
              <p><b>Ex1：</b>針孔成像的實驗中，原本物體長 8cm，距離小孔 10cm。請問把屏幕放在另一側距離針孔多少距離時，成像大小會變成 24cm？</p>
              <p><b>Ex2：</b>承上題請問你，針孔要如何移動，成像的大小會變成物體的 4 倍大？</p>
            </div>
          `;
        }
      }

      function updateSimulation() {
        visualSvg.innerHTML = '';
        statsGrid.innerHTML = '';
        const m = currentMode;
        
        // 畫主光軸
        visualSvg.appendChild(createSvgEl('line', { x1: -280, y1: 0, x2: 280, y2: 0, stroke: 'var(--chalk-dim)', 'stroke-width': 1, 'stroke-dasharray': '5 5', opacity: 0.5 }));
        
        const addStat = (k, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'shadow') {
          const p = params.shadow;
          const lightX = -200, objX = -50, screenX = 200;
          
          // 光源
          visualSvg.appendChild(createSvgEl('circle', { cx: lightX, cy: 0, r: p.lightSize, fill: '#f2d675', filter: 'drop-shadow(0 0 10px rgba(242, 214, 117, 0.8))' }));
          addText(visualSvg, lightX, p.lightSize + 20, '光源', 'middle', '#f2d675', 12, 'bold');
          
          // 障礙物
          visualSvg.appendChild(createSvgEl('rect', { x: objX - 10, y: -p.objHeight/2, width: 20, height: p.objHeight, fill: '#5c4a33' }));
          addText(visualSvg, objX, p.objHeight/2 + 20, '不透明物體', 'middle', '#c9c2ab', 12);
          
          // 屏幕
          visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: -140, x2: screenX, y2: 140, stroke: '#ffffff', 'stroke-width': 6 }));
          
          // 計算邊界射線 (交叉與外側)
          const topLight = -p.lightSize, botLight = p.lightSize;
          const topObj = -p.objHeight/2, botObj = p.objHeight/2;
          
          // 光線繪製
          const drawRay = (y1, y2, opacity) => {
            const slope = (y2 - y1) / (objX - lightX);
            const yAtScreen = y1 + slope * (screenX - lightX);
            visualSvg.appendChild(createSvgEl('line', { x1: lightX, y1: y1, x2: screenX, y2: yAtScreen, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));
            return yAtScreen;
          };

          const s1 = drawRay(topLight, topObj, 0.4); // 上對上
          const s2 = drawRay(botLight, botObj, 0.4); // 下對下
          const s3 = drawRay(topLight, botObj, 0.4); // 上對下 (交叉)
          const s4 = drawRay(botLight, topObj, 0.4); // 下對上 (交叉)

          // 本影區 (Umbra) - 兩邊光線都照不到
          const umbraTop = Math.max(s1, s4);
          const umbraBot = Math.min(s2, s3);
          
          if (umbraTop < umbraBot) {
             visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: umbraTop, x2: screenX, y2: umbraBot, stroke: '#000000', 'stroke-width': 8 }));
             addText(visualSvg, screenX + 15, (umbraTop+umbraBot)/2 + 4, '本影區', 'start', 'var(--v-color)', 12, 'bold');
          }
          
          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：影子的形成</h3>
            <p>影子：眼睛看不到光線的區域，這是<b>光直線前進的最好例子</b>[cite: 1]。<br>
            當光源越大（擴展光源），除了完全黑暗的「本影區」，邊緣還會產生部分光線能到達的灰色地帶，稱為「半影區」[cite: 1]。</p>
          `;
          
        } else if (m === 'pinhole_basic' || m === 'pinhole_move' || m === 'quiz_pdf') {
          
          let pVal, qVal, objH, holePositions = [0], isLargeHole = false;
          let objX, screenX, holeX;

          if (m === 'pinhole_basic') {
            pVal = params.pinhole_basic.p; qVal = params.pinhole_basic.q; objH = params.pinhole_basic.h;
            objX = -pVal; holeX = 0; screenX = qVal;
            const hType = params.pinhole_basic.holes;
            if (hType === '2') holePositions = [-25, 25];
            else if (hType === '3') holePositions = [-30, 0, 30];
            else if (hType === 'large') { isLargeHole = true; holePositions = [-15, -10, -5, 0, 5, 10, 15]; }
          } else if (m === 'pinhole_move') {
            const p = params.pinhole_move;
            objX = -150; screenX = 150; holeX = p.pinholeX;
            pVal = holeX - objX; qVal = screenX - holeX; objH = p.h;
          } else if (m === 'quiz_pdf') {
            const p = params.quiz_pdf;
            // 講義題意設定：物屏總距固定，物體長 8cm。
            // EX1: p=10, 像=24 (放大3倍) -> q=30。總距離 = 40。
            // 我們把比例放大 4 倍畫在畫面上 (總距 160)
            const SCALE = 4;
            objH = 8 * SCALE; 
            objX = -80; screenX = 80; holeX = p.pinholeX; // Total L = 160 (對應真實 40cm)
            pVal = holeX - objX; qVal = screenX - holeX;
          }

          // 畫紙板
          visualSvg.appendChild(createSvgEl('line', { x1: holeX, y1: -140, x2: holeX, y2: 140, stroke: '#8f8a80', 'stroke-width': 4 }));
          holePositions.forEach(hy => {
              const hs = isLargeHole ? 35 : 12;
              visualSvg.appendChild(createSvgEl('line', { x1: holeX, y1: hy - hs/2, x2: holeX, y2: hy + hs/2, stroke: 'var(--board-dark)', 'stroke-width': 6 }));
          });
          addText(visualSvg, holeX - 5, -120, '針孔', 'end', '#8f8a80', 12, 'bold');

          // 畫屏幕
          visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: -140, x2: screenX, y2: 140, stroke: '#ffffff', 'stroke-width': 6, opacity: 0.9 }));
          
          // 畫物體
          visualSvg.appendChild(createSvgEl('line', { x1: objX, y1: 0, x2: objX, y2: -objH, stroke: '#ef6a5a', 'stroke-width': 6, 'stroke-linecap': 'round' }));
          visualSvg.appendChild(createSvgEl('polygon', { points: `${objX},-${objH+8} ${objX-6},-${objH-2} ${objX+6},-${objH-2}`, fill: '#ef6a5a' }));
          
          // 成像繪製
          let mainImgH = 0;
          holePositions.forEach((hy, idx) => {
              const opacity = isLargeHole ? 0.15 : 0.6;
              const topSlope = (hy - (-objH)) / (holeX - objX);
              const topImgY = hy + topSlope * (screenX - holeX);
              visualSvg.appendChild(createSvgEl('line', { x1: objX, y1: -objH, x2: screenX, y2: topImgY, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));

              const botSlope = (hy - 0) / (holeX - objX);
              const botImgY = hy + botSlope * (screenX - holeX);
              visualSvg.appendChild(createSvgEl('line', { x1: objX, y1: 0, x2: screenX, y2: botImgY, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));

              const imgColor = isLargeHole ? 'rgba(95, 176, 255, 0.2)' : '#5fb0ff';
              visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: botImgY, x2: screenX, y2: topImgY, stroke: imgColor, 'stroke-width': 6, 'stroke-linecap': 'round' }));
              visualSvg.appendChild(createSvgEl('polygon', { points: `${screenX},${topImgY+8} ${screenX-6},${topImgY-2} ${screenX+6},${topImgY-2}`, fill: imgColor }));
              
              if (hy === 0 || idx === 0) mainImgH = Math.abs(topImgY - botImgY);
          });

          // 距離標示
          visualSvg.appendChild(createSvgEl('path', { d: `M ${objX},130 L ${holeX},130`, stroke: 'var(--chalk-dim)', 'stroke-width': 1, fill: 'none', 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)' }));
          visualSvg.appendChild(createSvgEl('path', { d: `M ${holeX},130 L ${screenX},130`, stroke: 'var(--chalk-dim)', 'stroke-width': 1, fill: 'none', 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)' }));
          
          let trueP = pVal, trueQ = qVal, trueObjH = objH, trueImgH = mainImgH;
          if (m === 'quiz_pdf') {
             trueP = pVal / 4; trueQ = qVal / 4; trueObjH = 8; trueImgH = mainImgH / 4;
          }

          addText(visualSvg, (objX+holeX)/2, 145, `物距 p = ${trueP.toFixed(1)}`, 'middle', 'var(--chalk-dim)', 11);
          addText(visualSvg, (holeX+screenX)/2, 145, `像距 q = ${trueQ.toFixed(1)}`, 'middle', 'var(--chalk-dim)', 11);

          visualSvg.innerHTML += `
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 2 L 10 5 L 0 8 z" fill="var(--chalk-dim)" />
                </marker>
            </defs>
          `;

          // 更新數據板與解析
          const mag = (trueQ / trueP).toFixed(2);
          addStat('物距 p', `${trueP.toFixed(1)} cm`);
          addStat('像距 q', `${trueQ.toFixed(1)} cm`);
          addStat('物高 $h_o$', `${trueObjH.toFixed(1)} cm`);
          addStat('像高 $h_i$', `${trueImgH.toFixed(1)} cm`);
          addStat('倍率 M', `${mag} 倍`);

          if (m === 'pinhole_basic') {
            explainBox.innerHTML = `
              <h3>💡 老師精闢解析：物距與像距</h3>
              <p>利用相似三角形，我們得到必考公式：<span class="formula-highlight"> $\\frac{h_i}{h_o} = \\frac{q}{p}$ </span>。<br>
              切換不同孔洞時請注意：「多個孔就會形成多個像」，而大孔洞因為光線無限重疊交錯，會導致成像<b>模糊且明亮</b>！</p>
            `;
          } else if (m === 'pinhole_move') {
            explainBox.innerHTML = `
              <h3>💡 老師精闢解析：考卷最愛考的「移動針孔」</h3>
              <p>當物體與屏幕的距離固定時，<b>把針孔「往物體推（p 變小、q 變大）」</b>，成像倍率 $\\frac{q}{p}$ 就會急速上升，成像變大！<br>
              相反地，針孔靠近屏幕時，成像就會縮小。拉動滑桿感受一下這個動態變化！</p>
            `;
          } else if (m === 'quiz_pdf') {
            explainBox.innerHTML = `
              <h3>💡 講義解答與解析</h3>
              <p><b>[解析 Ex1]</b> 根據公式 $\\frac{h_i}{h_o} = \\frac{q}{p}$，已知物長 $h_o=8$，物距 $p=10$，要求像長 $h_i=24$ 時的像距 $q$[cite: 1]。代入得 $\\frac{24}{8} = \\frac{q}{10}$，所以 <span class="formula-highlight"> $q = 30$ cm </span>[cite: 1]。</p>
              <p><b>[解析 Ex2]</b> 承上題，物屏總距離為 $p+q = 10+30 = 40$ cm[cite: 1]。若要成像為 4 倍大，代表 $q = 4p$[cite: 1]。<br>
              代入總長度：$p + 4p = 40 \\Rightarrow 5p = 40 \\Rightarrow$ <span class="formula-highlight"> $p = 8$ cm </span>。<br>
              原本 $p=10$，現在 $p=8$，所以<b>針孔要向物體移動 2 cm</b>[cite: 1]！(可將上方滑桿拉至物距 $p=8$ 驗證)</p>
            `;
          }
        }
      }

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
