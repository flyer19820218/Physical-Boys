<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中理化 - 黑板互動教學目錄</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chilanka&family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            background-color: #1a3322;
            background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #fdf6e3;
            font-family: 'Noto Sans TC', 'Chilanka', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .blackboard {
            width: 800px;
            border: 15px solid #5d4037;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .main-title {
            text-align: center;
            font-size: 3em;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 3px dashed #a5d6a7;
            padding-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .unit-container {
            margin-bottom: 30px;
            background: rgba(0,0,0,0.15);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .unit-title {
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .chalk-yellow { color: #ffe082; }
        .chalk-blue { color: #40c4ff; }
        .chalk-green { color: #69f0ae; }
        .chalk-red { color: #ff5252; }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .lesson-link {
            display: block;
            text-decoration: none;
            color: #213c2c;
            background-color: #a5d6a7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }

        .lesson-link:hover {
            transform: translateY(-3px) translateX(-3px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
            background-color: #c8e6c9;
        }

        .lesson-link:active {
            transform: translateY(0) translateX(0);
            box-shadow: 1px 1px 0 rgba(0,0,0,0.4);
        }

        /* 針對不同單元設定按鈕顏色 */
        .optics-btn { background-color: #81d4fa; }
        .optics-btn:hover { background-color: #b3e5fc; }
        
        .thermo-btn { background-color: #ffab91; }
        .thermo-btn:hover { background-color: #ffccbc; }

    </style>
</head>
<body>

<div class="blackboard">
    <h1 class="main-title">👨‍🏫 國中理化互動教學系統</h1>

    <!-- 光與顏色單元 -->
    <div class="unit-container">
        <h2 class="unit-title chalk-yellow">🌈 光與顏色 (Optics)</h2>
        <div class="link-grid">
            <a href="optics_1.html" class="lesson-link optics-btn">光學單元 1</a>
            <a href="optics_2.html" class="lesson-link optics-btn">光學單元 2</a>
            <a href="optics_3.html" class="lesson-link optics-btn">光學單元 3</a>
            <a href="optics_4.html" class="lesson-link optics-btn">光學單元 4</a>
            <a href="optics_5.html" class="lesson-link optics-btn">光學單元 5</a>
        </div>
    </div>

    <!-- 熱力學單元 -->
    <div class="unit-container">
        <h2 class="unit-title chalk-red">🔥 熱力學 (Thermodynamics)</h2>
        <div class="link-grid">
            <a href="thermo_1.html" class="lesson-link thermo-btn">熱學一：溫度與溫度計</a>
            <a href="thermo_2.html" class="lesson-link thermo-btn">熱學二：熱量與熱平衡</a>
        </div>
    </div>

</div>

</body>
</html>
