<!doctype html>
<html><head><meta charset="utf-8"><title>work_5 cover generator</title>
<style>html,body{margin:0;background:#081611}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
/* work_5 封面（無字）：左邊一顆鈾核剛剛分裂，右邊是一顆巨大的太陽。
   用 Canvas 程式畫成，固定亂數種子，輸出 1280×720。要換成 AI 插圖時，只要用同檔名覆蓋 JPG。 */
(function () {
  const cv = document.getElementById('c'), c = cv.getContext('2d'), W = 1280, H = 720, TAU = Math.PI * 2;
  function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = rng(20261103);
  const rad = (x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; };

  /* 夜空 */
  let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#06130f'); g.addColorStop(1, '#0d2820');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 300; i++) {
    const x = R() * W, y = R() * H, r = R() * 1.4 + 0.3, a = R() * 0.55 + 0.15;
    c.fillStyle = 'rgba(246,243,234,' + a + ')'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }

  /* 太陽 */
  const SX = 1020, SY = 330, SR = 250;
  c.fillStyle = rad(SX, SY, SR * 0.8, 900, [[0, 'rgba(255,150,40,0.50)'], [0.35, 'rgba(255,120,30,0.18)'], [1, 'rgba(255,100,20,0)']]); c.fillRect(0, 0, W, H);
  c.fillStyle = rad(SX, SY, SR, SR * 1.9, [[0, 'rgba(255,214,90,0.55)'], [1, 'rgba(255,170,50,0)']]); c.beginPath(); c.arc(SX, SY, SR * 1.9, 0, TAU); c.fill();
  /* 日冕光芒 */
  c.save(); c.translate(SX, SY);
  for (let i = 0; i < 110; i++) {
    const a = R() * TAU, r0 = SR * 0.98, r1 = SR * (1.12 + R() * 0.55);
    const lg = c.createLinearGradient(Math.cos(a) * r0, Math.sin(a) * r0, Math.cos(a) * r1, Math.sin(a) * r1);
    lg.addColorStop(0, 'rgba(255,225,130,0.22)'); lg.addColorStop(1, 'rgba(255,200,90,0)');
    c.strokeStyle = lg; c.lineWidth = 1 + R() * 3; c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke();
  }
  c.restore();
  /* 日珥 */
  c.save(); c.translate(SX, SY); c.lineCap = 'round'; c.shadowColor = '#ff7a2f'; c.shadowBlur = 28;
  [[-2.62, 0.50, 46, 12], [2.30, 0.56, 54, 13], [-0.95, 0.44, 40, 10]].forEach(p => {
    const a0 = p[0], a1 = p[0] + p[1], mid = (a0 + a1) / 2, out = SR + p[2];
    const x0 = Math.cos(a0) * (SR - 6), y0 = Math.sin(a0) * (SR - 6), x1 = Math.cos(a1) * (SR - 6), y1 = Math.sin(a1) * (SR - 6);
    const cx = Math.cos(mid) * (out + p[2] * 0.9), cy = Math.sin(mid) * (out + p[2] * 0.9);
    const lg = c.createLinearGradient(x0, y0, cx, cy); lg.addColorStop(0, 'rgba(255,170,60,0.95)'); lg.addColorStop(1, 'rgba(255,90,40,0.55)');
    c.strokeStyle = lg; c.lineWidth = p[3]; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); c.stroke();
    c.lineWidth = p[3] * 0.34; c.strokeStyle = 'rgba(255,225,150,0.6)'; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); c.stroke();
  });
  c.restore();
  /* 日面 */
  c.fillStyle = rad(SX - 40, SY - 40, 10, SR, [[0, '#fff6c8'], [0.35, '#ffd449'], [0.72, '#ff9a2e'], [1, '#e2561b']]);
  c.beginPath(); c.arc(SX, SY, SR, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.arc(SX, SY, SR, 0, TAU); c.clip();
  for (let i = 0; i < 520; i++) {
    const a = R() * TAU, d = Math.sqrt(R()) * SR, x = SX + Math.cos(a) * d, y = SY + Math.sin(a) * d, r = 4 + R() * 16;
    c.fillStyle = R() < 0.5 ? 'rgba(255,248,200,0.10)' : 'rgba(190,60,10,0.10)'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  c.fillStyle = rad(SX, SY, SR * 0.55, SR, [[0, 'rgba(120,30,0,0)'], [1, 'rgba(150,40,5,0.55)']]); c.fillRect(SX - SR, SY - SR, SR * 2, SR * 2);
  c.restore();

  /* 核分裂：中心閃光、衝擊波 */
  const NX = 400, NY = 410;
  c.fillStyle = rad(NX, NY, 0, 330, [[0, 'rgba(255,255,235,0.95)'], [0.12, 'rgba(255,230,140,0.75)'], [0.4, 'rgba(255,150,50,0.28)'], [1, 'rgba(255,120,30,0)']]);
  c.beginPath(); c.arc(NX, NY, 330, 0, TAU); c.fill();
  [[170, 0.38, 3.5], [225, 0.22, 3], [285, 0.12, 2.5]].forEach(r => { c.strokeStyle = 'rgba(255,224,102,' + r[1] + ')'; c.lineWidth = r[2]; c.beginPath(); c.arc(NX, NY, r[0], 0, TAU); c.stroke(); });

  /* 碎片拖尾 */
  function trail(x0, y0, x1, y1, w, col) {
    const lg = c.createLinearGradient(x0, y0, x1, y1); lg.addColorStop(0, 'rgba(255,255,230,0)'); lg.addColorStop(1, col);
    c.strokeStyle = lg; c.lineCap = 'round'; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  }
  const FA = { x: 238, y: 502, r: 74, n: 30 }, FB = { x: 566, y: 318, r: 58, n: 20 };
  trail(NX, NY, FA.x, FA.y, 34, 'rgba(255,170,60,0.55)'); trail(NX, NY, FB.x, FB.y, 28, 'rgba(255,170,60,0.55)');
  trail(NX, NY, FA.x, FA.y, 10, 'rgba(255,245,200,0.75)'); trail(NX, NY, FB.x, FB.y, 8, 'rgba(255,245,200,0.75)');
  for (let i = 0; i < 70; i++) {
    const t = R(), side = R() < 0.55 ? FA : FB, sx = NX + (side.x - NX) * t + (R() - 0.5) * 60, sy = NY + (side.y - NY) * t + (R() - 0.5) * 60;
    c.fillStyle = 'rgba(255,' + (190 + (R() * 60 | 0)) + ',90,' + (0.35 + R() * 0.5) + ')'; c.beginPath(); c.arc(sx, sy, 1 + R() * 3, 0, TAU); c.fill();
  }

  /* 小球：質子橘、中子淺灰白 */
  function ball(x, y, r, col) {
    const gr = c.createRadialGradient(x - r * 0.35, y - r * 0.38, r * 0.08, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.32, col); gr.addColorStop(1, col === '#ff8040' ? '#7a2c0e' : '#59675f');
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  function cluster(F, seed) {
    const rr = rng(seed); c.save(); c.shadowColor = 'rgba(255,170,60,0.9)'; c.shadowBlur = 38;
    c.fillStyle = 'rgba(255,170,60,0.35)'; c.beginPath(); c.arc(F.x, F.y, F.r * 1.02, 0, TAU); c.fill(); c.restore();
    const ga = Math.PI * (3 - Math.sqrt(5)), br = F.r / Math.sqrt(F.n) * 0.98;
    for (let i = F.n - 1; i >= 0; i--) {
      const d = Math.sqrt((i + 0.5) / F.n) * (F.r - br * 0.7), a = i * ga + seed;
      ball(F.x + Math.cos(a) * d + (rr() - 0.5) * 3, F.y + Math.sin(a) * d + (rr() - 0.5) * 3, br * (0.95 + rr() * 0.12), rr() < 0.46 ? '#ff8040' : '#d9e2dd');
    }
  }
  cluster(FA, 3); cluster(FB, 11);

  /* 3 顆快中子 */
  [[188, 205, 8], [668, 598, 8], [468, 150, 8]].forEach((n, i) => {
    trail(NX, NY, n[0], n[1], 7, 'rgba(217,226,221,0.8)');
    c.save(); c.shadowColor = 'rgba(255,255,255,0.9)'; c.shadowBlur = 20; ball(n[0], n[1], 14, '#d9e2dd'); c.restore();
  });

  /* 暗角（影片版封面會再疊底部漸層，所以這裡只做輕量暗角） */
  c.fillStyle = rad(W / 2, H / 2, H * 0.45, W * 0.75, [[0, 'rgba(6,19,15,0)'], [1, 'rgba(6,19,15,0.6)']]); c.fillRect(0, 0, W, H);
  document.title = 'done';
})();
</script></body></html>
