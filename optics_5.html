<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-zh="國中自然 光學｜光與顏色的世界 黑板模擬器" data-en="Optics | Light & Colors Simulator">國中自然 光學｜光與顏色的世界 黑板模擬器</title>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --board: #1c3d34;
      --board-dark: #11261f;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #fde047;
      --chalk-green: #4ade80;
      --chalk-pink: #f472b6;
      --chalk-blue: #38bdf8;
      --chalk-gray: #9fb0a8;
      --chalk-orange: #fb923c;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 20px;
      padding: 20px 14px 60px;
      padding-top: 80px; 
    }

    body.intro-locked { overflow: hidden; }
    .intro-screen {
      position: fixed; inset: 0; z-index: 12000; cursor: pointer;
      background: url("optics_5_cover.jpg") center / cover no-repeat;
      animation: introZoom 11s ease-out both;
      transform-origin: center;
      overflow: hidden;
    }
    .intro-screen::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(5, 18, 16, 0.48) 100%), linear-gradient(to bottom, rgba(5, 18, 16, 0.05) 55%, rgba(5, 18, 16, 0.78));
    }
    .intro-screen.exiting { opacity: 0; transform: scale(1.035); transition: opacity .8s ease, transform .8s ease; pointer-events: none; }
    @keyframes introZoom { from { transform: scale(1); } to { transform: scale(1.075); } }

    .hook-box, .mission-box, .principle-box {
      display: flex; align-items: flex-start; gap: 14px; margin: 0 0 20px;
      padding: 16px 18px; border-radius: 12px; background: rgba(7, 28, 24, 0.76);
      border: 2px solid rgba(56, 189, 248, 0.5); box-shadow: 0 0 22px rgba(56, 189, 248, 0.12);
    }
    .xiaozhen-logo { flex: 0 0 56px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: rgba(56, 189, 248, 0.18); font-size: 34px; }
    .hook-content, .mission-content { min-width: 0; }
    .hook-title, .mission-title { color: var(--chalk-blue); font-weight: 700; font-size: 20px; }
    .hook-text, .mission-text { color: var(--chalk); font-size: 20px; line-height: 1.65; }
    .mission-box { margin-top: 14px; border-color: rgba(244, 114, 182, 0.55); background: rgba(45, 13, 40, 0.32); }
    .mission-title { color: var(--chalk-pink); }
    .mission-icon { flex: 0 0 48px; width: 48px; height: 48px; display: grid; place-items: center; font-size: 30px; }
    .principle-box { display: block; border-color: rgba(253, 224, 71, .62); background: rgba(49, 43, 11, .30); }
    .principle-title { color: var(--chalk-yellow); font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .principle-text { color: var(--chalk); font-size: 20px; line-height: 1.7; }
    .principle-core { display: inline-block; margin-top: 7px; padding: 5px 10px; border-radius: 7px; background: rgba(253,224,71,.13); color: var(--chalk-yellow); font-weight: 700; }
    .principle-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; margin-top: 14px; }
    .principle-step { position: relative; padding: 10px 8px; text-align: center; border-radius: 8px; background: rgba(7,28,24,.72); color: var(--chalk); font-weight: 700; }
    .principle-step:not(:last-child)::after { content: '→'; position: absolute; right: -18px; top: 50%; transform: translateY(-50%); color: var(--chalk-yellow); font-size: 22px; }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 2px solid var(--chalk-blue);
      border-radius: 12px;
      background: rgba(17, 38, 31, 0.95);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .lang-label {
      color: var(--chalk-blue);
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      user-select: none;
      margin-left: 4px;
    }
    .lang-options {
      display: flex;
      flex-direction: row;
      gap: 4px;
    }
    .lang-pill {
      min-width: 60px;
      min-height: 48px; /* 觸控防禦 */
      padding: 6px 12px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .lang-pill.active {
      background: var(--chalk-blue) !important;
      color: #0b1a15 !important;
      border-color: var(--chalk-blue) !important;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.15em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 40px; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); color: var(--chalk-yellow); }
    header p { color: var(--chalk-green); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 21px; font-weight: bold; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-family: 'Kalam', cursive; font-size: 28px; margin: 0 0 16px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 700;
    }

    /* 模式切換按鈕 */
    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 20px; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.25);
      padding: 14px 12px; min-height: 64px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
      touch-action: manipulation;
    }
    .mode-switch button span.sub { font-size: 16px; font-weight: 400; opacity: 0.8; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.5); color: var(--chalk); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); border-style: solid;
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.9; font-weight: 600; }
    .mode-switch button.gifted-tab { border: 3px solid #c084fc; background: rgba(88, 28, 135, .26); color: #f3e8ff; box-shadow: 0 0 18px rgba(192,132,252,.32), inset 0 0 16px rgba(192,132,252,.12); }
    .mode-switch button.gifted-tab.active { background: #c084fc; color: #1f102d; border-color: #e9d5ff; box-shadow: 0 0 30px rgba(192,132,252,.72); }
    .mode-switch button.gifted-tab.active span.sub { color: #1f102d; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 16px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 20px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 8px; background: transparent; cursor: pointer; min-height: 44px; touch-action: manipulation; }

    .btn-group { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .c-btn { flex: 1; min-width: 80px; min-height: 48px; padding: 10px 8px; border-radius: 8px; border: 2px solid var(--chalk-dim); cursor: pointer; font-weight: bold; font-size: 18px; transition: all 0.2s; touch-action: manipulation; display: flex; align-items: center; justify-content: center; }
    .c-btn:hover { transform: translateY(-2px); }
    
    select { height: 48px; font-size: 20px; font-weight: bold; cursor: pointer; }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; margin-top: 16px; min-height: 350px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; aspect-ratio: 600 / 300; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 14px 10px; text-align: center; border: 1px dashed var(--chalk-dim); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--chalk-yellow); font-weight: 700; margin-top: 8px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 16px 20px; }
    .explain-box h3 { color: var(--chalk-yellow); margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 4px 12px; border-radius: 6px; color: var(--chalk-yellow); font-weight: 700; display: inline-block; margin: 4px 0; }

    /* RGB 混色專用 CSS */
    .rgb-container { position: relative; width: 300px; height: 300px; background: #071713; border-radius: 50%; }
    .spotlight { position: absolute; border-radius: 50%; width: 160px; height: 160px; mix-blend-mode: screen; filter: blur(4px); transition: all 0.2s; }
    .spot-r { background: rgb(255, 0, 0); top: 20px; left: 70px; }
    .spot-g { background: rgb(0, 255, 0); bottom: 30px; left: 20px; }
    .spot-b { background: rgb(0, 0, 255); bottom: 30px; right: 20px; }

    .phone-lab { width: min(760px, 100%); display: grid; grid-template-columns: minmax(220px, 320px) 1fr; align-items: center; gap: 28px; }
    .phone-shell { width: 230px; height: 330px; margin: auto; padding: 14px; border: 4px solid var(--chalk-dim); border-radius: 34px; background: #091713; box-shadow: 0 18px 34px rgba(3, 12, 10, .55); }
    .phone-screen { height: 100%; border-radius: 22px; display: grid; place-items: center; color: rgba(255,255,255,.92); font-family: 'Kalam', cursive; font-size: 34px; text-shadow: 0 2px 10px rgba(3,12,10,.6); transition: background .2s; }
    .pixel-loupe { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; padding: 18px; border-radius: 50%; border: 4px solid var(--chalk); background: rgba(4,16,13,.72); box-shadow: 0 0 24px rgba(242,236,217,.18); }
    .subpixel { aspect-ratio: 1 / 2.3; border-radius: 4px; }
    .target-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .mission-status { padding: 10px 14px; border-radius: 8px; background: rgba(74,222,128,.12); color: var(--chalk-green); font-weight: 700; text-align: center; }
    .fitting-room { width: min(760px, 100%); min-height: 330px; position: relative; display: grid; place-items: center; overflow: hidden; border-radius: 18px; background: linear-gradient(135deg, #15382f, #081d18); }
    .light-cone { position: absolute; top: -40px; width: 340px; height: 390px; clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); opacity: .34; pointer-events: none; }
    .shirt { position: relative; width: 190px; height: 210px; clip-path: polygon(28% 8%, 8% 28%, 25% 43%, 33% 34%, 33% 100%, 67% 100%, 67% 34%, 75% 43%, 92% 28%, 72% 8%, 61% 0, 39% 0); border: 3px solid rgba(255,255,255,.65); filter: drop-shadow(0 18px 18px rgba(3,12,10,.45)); transition: background .25s, opacity .25s; }
    .color-card-stage { width: min(720px, 100%); min-height: 330px; display: grid; place-items: center; position: relative; border-radius: 18px; background: radial-gradient(circle at 50% 15%, rgba(242,236,217,.08), transparent 48%), #071713; overflow: hidden; }
    .love-card { width: min(430px, 78%); aspect-ratio: 1.55; border-radius: 16px; background: #101b18; border: 2px solid rgba(242,236,217,.28); display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 24px; box-shadow: 0 20px 45px rgba(3,12,10,.5); }
    .love-heart { font-size: 120px; line-height: 1; transition: color .2s, opacity .2s; }
    .love-word { font-family: 'JetBrains Mono', monospace; font-size: 42px; font-weight: 700; letter-spacing: .18em; transition: color .2s; }

    .rainbow-lab-grid { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .rainbow-panel { min-width: 0; overflow: hidden; border: 2px solid rgba(192,132,252,.36); border-radius: 14px; background: #081d18; box-shadow: inset 0 0 24px rgba(56,189,248,.05); }
    .rainbow-panel.wide { grid-column: 1 / -1; }
    .rainbow-panel-head { padding: 13px 15px 10px; border-bottom: 1px solid rgba(242,236,217,.14); background: linear-gradient(90deg, rgba(88,28,135,.30), rgba(8,29,24,.35)); }
    .rainbow-panel-title { color: var(--chalk); font-size: 20px; font-weight: 700; line-height: 1.45; }
    .rainbow-panel-note { margin-top: 3px; color: var(--chalk-dim); font-size: 16px; line-height: 1.5; }
    .rainbow-panel svg { width: 100%; height: auto; aspect-ratio: auto; }
    .rainbow-panel:not(.wide) svg { aspect-ratio: 480 / 390; }
    .rainbow-panel.wide svg { max-width: 720px; margin: 0 auto; aspect-ratio: 480 / 430; }
    .rainbow-answer { width: 100%; margin: 14px 0 0; padding: 13px 16px; border: 2px solid rgba(253,224,71,.62); border-radius: 11px; background: rgba(49,43,11,.34); color: var(--chalk); font-size: 20px; line-height: 1.65; }
    .rainbow-answer b { color: var(--chalk-yellow); }
    footer { text-align: center; color: var(--chalk-dim); font-size: 20px; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; font-weight: bold; }

    @media (max-width: 768px) {
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
      .mode-switch { grid-template-columns: 1fr 1fr; }
      .phone-lab { grid-template-columns: 1fr; }
      .pixel-loupe { max-width: 300px; margin: auto; }
      .principle-flow { grid-template-columns: 1fr 1fr; gap: 10px; }
      .principle-step:not(:last-child)::after { display: none; }
      .rainbow-lab-grid { grid-template-columns: 1fr; }
      .rainbow-panel.wide { grid-column: auto; }
      .rainbow-panel.wide svg { aspect-ratio: 480 / 430; }
    }
    @media (prefers-reduced-motion: reduce) { .intro-screen { animation: none; } }
  </style>
</head>
<body class="intro-locked">

  <div id="introScreen" class="intro-screen" role="button" tabindex="0" aria-label="進入光與顏色課程"></div>

  <!-- 🌟 右上角橫向懸浮雙語切換器 -->
  <div class="floating-lang-container">
    <span class="lang-label">Language</span>
    <div class="lang-options">
      <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
      <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 4-5</div>
      <h1 data-zh="光學五：光與顏色的世界" data-en="Optics 5: The World of Light & Colors">光學五：光與顏色的世界</h1>
      <p data-zh="從彩虹、手機像素、演唱會燈光到試衣間，化身顏色偵探，破解光線如何決定我們看見的顏色。" data-en="From rainbows and phone pixels to concert lights and fitting rooms, become a color detective and discover how light determines what we see.">從彩虹、手機像素、演唱會燈光到試衣間，化身顏色偵探，破解光線如何決定我們看見的顏色。</p>
    </header>

    <div class="board">
      <h2 data-zh="選擇互動教學模式" data-en="Select Interactive Mode">選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="prism">
          <span data-zh="🌈 彩虹解碼站" data-en="🌈 Rainbow Decoder">🌈 彩虹解碼站</span>
          <span class="sub" data-zh="把一道白光拆成完整色帶" data-en="Split one white beam into a spectrum">把一道白光拆成完整色帶</span>
        </button>
        <button data-mode="rgb">
          <span data-zh="📱 手機像素調色台" data-en="📱 Phone Pixel Mixer">📱 手機像素調色台</span>
          <span class="sub" data-zh="放大 RGB 子像素，接受調色任務" data-en="Zoom into RGB subpixels and mix a target">放大 RGB 子像素，接受調色任務</span>
        </button>
        <button data-mode="object_color">
          <span data-zh="👕 試衣間燈光偵探" data-en="👕 Fitting-Room Light Detective">👕 試衣間燈光偵探</span>
          <span class="sub" data-zh="同一件衣服，換盞燈就變色？" data-en="Can one shirt change under another lamp?">同一件衣服，換盞燈就變色？</span>
        </button>
        <button data-mode="quiz_love">
          <span data-zh="🎭 顏色消失密室" data-en="🎭 Vanishing-Color Escape Room">🎭 顏色消失密室</span>
          <span class="sub" data-zh="找出能讓紅愛心隱形的兩盞燈" data-en="Find two lights that hide the red heart">找出能讓紅愛心隱形的兩盞燈</span>
        </button>
        <button class="gifted-tab" data-mode="rainbow_lab">
          <span data-zh="🔮 資優補充：虹與霓" data-en="🔮 Advanced: Primary & Secondary Rainbows">🔮 資優補充：虹與霓</span>
          <span class="sub" data-zh="追蹤雨滴內一次與兩次反射" data-en="Trace one and two reflections inside a raindrop">追蹤雨滴內一次與兩次反射</span>
        </button>
      </div>

      <div class="hook-box" id="hookBox" aria-live="polite"></div>
      <div class="principle-box" id="principleBox" aria-live="polite"></div>
      <div class="mission-box" id="missionBox" aria-live="polite"></div>

      <div class="controls" id="controlsBox"></div>
      <div class="visual-card" id="visualContainer">
        <!-- SVG 或 HTML 內容會動態生成於此 -->
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2 data-zh="實驗後的科學統整" data-en="Science Wrap-Up After the Experiment">實驗後的科學統整</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer data-zh="國中理化 光學單元 · 視覺化互動教學教材" data-en="Junior High Science Optics · Interactive Blackboard">國中理化 光學單元 · 視覺化互動教學教材</footer>
  </div>

  <script>
    (function() {
      const introScreen = document.getElementById('introScreen');
      let introClosed = false;
      function enterLesson() {
        if (introClosed) return;
        introClosed = true;
        introScreen.classList.add('exiting');
        document.body.classList.remove('intro-locked');
        setTimeout(() => introScreen.remove(), 800);
      }
      introScreen.addEventListener('click', enterLesson);
      introScreen.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          enterLesson();
        }
      });

      let currentLang = 'zh';
      let currentMode = 'prism';
      let rainbowRafId = null;
      let rainbowLastTime = 0;
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const controlsBox = document.getElementById('controlsBox');
      const visualContainer = document.getElementById('visualContainer');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const hookBox = document.getElementById('hookBox');
      const principleBox = document.getElementById('principleBox');
      const missionBox = document.getElementById('missionBox');

      const params = {

      function createSvgEl(tag, attrs) {

      function addText(parent, x, y, txt, anchor, color, size, weight='normal') {

      function unitVector(vector) {
        const length = Math.hypot(vector.x, vector.y) || 1;
        return { x: vector.x / length, y: vector.y / length };
      }

      function vectorDot(a, b) {
        return a.x * b.x + a.y * b.y;
      }

      function refractVector(incident, normal, ratio) {
        const cosine = -vectorDot(normal, incident);
        const discriminant = 1 - ratio * ratio * (1 - cosine * cosine);
        if (discriminant < 0) return unitVector(incident);
        return unitVector({
          x: ratio * incident.x + (ratio * cosine - Math.sqrt(discriminant)) * normal.x,
          y: ratio * incident.y + (ratio * cosine - Math.sqrt(discriminant)) * normal.y
        });
      }

      function reflectVector(incident, normal) {
        const projection = 2 * vectorDot(incident, normal);
        return unitVector({ x: incident.x - projection * normal.x, y: incident.y - projection * normal.y });
      }

      function nextCircleHit(point, direction, cx, cy) {
        const local = { x: point.x - cx, y: point.y - cy };
        const distance = -2 * vectorDot(local, direction);
        return { x: point.x + direction.x * distance, y: point.y + direction.y * distance };
      }

      function rayEndAtBounds(point, direction, bounds) {
        const candidates = [];
        const addCandidate = (distance) => {
          if (!Number.isFinite(distance) || distance <= 0) return;
          const candidate = { x: point.x + direction.x * distance, y: point.y + direction.y * distance };
          if (candidate.x >= bounds.minX - .1 && candidate.x <= bounds.maxX + .1 && candidate.y >= bounds.minY - .1 && candidate.y <= bounds.maxY + .1) {
            candidates.push({ distance, point: candidate });
          }
        };
        if (Math.abs(direction.x) > 1e-6) {
          addCandidate((bounds.minX - point.x) / direction.x);
          addCandidate((bounds.maxX - point.x) / direction.x);
        }
        if (Math.abs(direction.y) > 1e-6) {
          addCandidate((bounds.minY - point.y) / direction.y);
          addCandidate((bounds.maxY - point.y) / direction.y);
        }
        candidates.sort((a, b) => a.distance - b.distance);
        return candidates.length ? candidates[0].point : point;
      }

      function rainbowIncidenceAngle(reflections, waterBendingValue=1.337) {
        const order = reflections + 1;
        const sineSquared = (order * order - waterBendingValue * waterBendingValue) / (order * order - 1);
        return Math.asin(Math.sqrt(Math.max(0, Math.min(1, sineSquared))));
      }

      function calculateRainbowRay(reflections, waterBendingValue, cx, cy, radius, bounds) {
        const incidence = rainbowIncidenceAngle(reflections);
        const impact = radius * Math.sin(incidence);
        // 採用鏡像等價的入射側，讓虹與霓都朝畫面左下方出射，
        // 與下一張「光進入觀察者眼睛」的圖保持同方向，降低認知負荷。
        const teachingSide = reflections % 2 === 0 ? 1 : -1;
        const entry = { x: cx - Math.sqrt(radius * radius - impact * impact), y: cy + teachingSide * impact };
        const incoming = { x: 1, y: 0 };
        const entryNormal = unitVector({ x: entry.x - cx, y: entry.y - cy });
        let direction = refractVector(incoming, entryNormal, 1 / waterBendingValue);
        let current = entry;
        const reflectionPoints = [];
        const innerPoints = [entry];

        for (let index = 0; index < reflections; index++) {
          current = nextCircleHit(current, direction, cx, cy);
          reflectionPoints.push(current);
          innerPoints.push(current);
          const normal = unitVector({ x: current.x - cx, y: current.y - cy });
          direction = reflectVector(direction, normal);
        }

        const exit = nextCircleHit(current, direction, cx, cy);
        innerPoints.push(exit);
        const exitNormal = unitVector({ x: exit.x - cx, y: exit.y - cy });
        const outgoing = refractVector(direction, { x: -exitNormal.x, y: -exitNormal.y }, waterBendingValue);
        const end = rayEndAtBounds(exit, outgoing, bounds);
        const start = { x: bounds.minX, y: entry.y };
        const viewingAngle = Math.atan2(Math.abs(outgoing.y), -outgoing.x) * 180 / Math.PI;

        return {
          start, entry, exit, outgoing, end, reflectionPoints,
          innerPoints,
          interactionPoints: [entry, ...reflectionPoints, exit],
          coloredPoints: [entry, ...reflectionPoints, exit, end],
          viewingAngle
        };
      }

      function updateSimulation() {
        visualContainer.replaceChildren();

          const namesZh = ['紅', '橙', '黃', '綠', '藍', '靛', '紫'];
          const namesEn = ['Red', 'Org', 'Yel', 'Grn', 'Blu', 'Ind', 'Vio'];
          
          colors.forEach((col, idx) => {

             svg.appendChild(createSvgEl('line', { x1: -50, y1: 0, x2: 50, y2: rightY, stroke: col, 'stroke-width': 2, opacity: 0.8 }));
             
             const spread = 20 + idx * 10 + angle * 1.5;
             svg.appendChild(createSvgEl('line', { x1: 50, y1: rightY, x2: 250, y2: rightY + spread, stroke: col, 'stroke-width': 3 }));
             
             addText(svg, 260, rightY + spread + 6, tr(namesZh[idx], namesEn[idx]), 'start', col, 18, 'bold');
          });

          visualContainer.appendChild(svg);

          addStat('紅光偏折', 'Red Refraction', tr(`最小`, `Min`));
          addStat('紫光偏折', 'Violet Refraction', tr(`最大`, `Max`));
          addStat('光速(玻璃中)', 'Speed in Glass', tr(`紅光 > 紫光`, `Red > Violet`));

          explainBox.innerHTML = tr(`
            <h3>🌈 白光不是單一顏色，而是由各種色光組成</h3>
            <p>牛頓用三稜鏡證明白光可以被分散成連續色帶。原因是不同色光在玻璃中的行進速率不同，所以改變方向的程度也不同。<br>
            在一般玻璃的可見光正常色散範圍中，紅光在玻璃內的速度較快、偏折較少；紫光速度較慢、偏折較多。<br>
            <span class="formula-highlight">玻璃中：紅光偏折較少，紫光偏折較多</span></p>
          `, `
            <h3>🌈 White Light Is Made of Many Colors</h3>
            <p>Newton used a prism to show that white light can spread into a continuous spectrum. Different colors travel at different speeds in glass, so their directions change by different amounts.<br>
            In the visible range of ordinary glass under normal dispersion, red light travels faster and bends less, while violet travels slower and bends more.<br>
            <span class="formula-highlight">In glass: red bends less; violet bends more</span></p>
          `);

        } else if (m === 'rgb') {
          const p = params.rgb;
          const target = rgbTargets[p.target];
          const distance = Math.hypot(p.r-target.rgb[0], p.g-target.rgb[1], p.b-target.rgb[2]);
          const accuracy = Math.max(0, Math.round(100 - distance / Math.sqrt(3 * 255 * 255) * 100));
          const screenTextColor = (p.r * .299 + p.g * .587 + p.b * .114) > 165 ? '#10221c' : '#f2ecd9';
          const phoneLab = document.createElement('div');
          phoneLab.className = 'phone-lab';
          const pixels = Array.from({ length: 27 }, (_, index) => {

          explainBox.innerHTML = tr(`
            <h3>📱 為什麼手機只有三種發光小點，卻能顯示百萬種顏色？</h3>
            <p>螢幕上一個像素其實由紅、綠、藍三個微小的<b>子像素</b>組成。眼睛距離夠遠時，三束光會在視覺中混合，這就是「加法混色」：光加得越多，畫面通常越亮。<br>
            <span class="formula-highlight">紅＋綠 ＝ 黃</span><br>
            <span class="formula-highlight">紅＋藍 ＝ 洋紅</span><br>
            <span class="formula-highlight">藍＋綠 ＝ 青</span><br>

          `, `
            <h3>📱 How Can a Phone Show Millions of Colors with Only Three Kinds of Light?</h3>
            <p>Each screen pixel contains tiny red, green, and blue <b>subpixels</b>. From normal viewing distance, their light blends in our vision. This is additive mixing: adding light generally makes the result brighter.<br>

            <span class="formula-highlight">Red + Blue = Magenta</span><br>
            <span class="formula-highlight">Blue + Green = Cyan</span><br>

          microSvg.appendChild(createSvgEl('rect', { x: 16, y: 340, width: 448, height: 40, rx: 9, fill: 'rgba(7,28,24,.92)', stroke: 'rgba(143,220,255,.25)' }));

            skySvg.appendChild(createSvgEl('rect', { x: 286, y: 368, width: 176, height: 43, rx: 10, fill: 'rgba(192,132,252,.16)', stroke: '#c084fc', 'stroke-width': 2 }));
            addText(skySvg, 374, 394, tr('下方也有水滴 → 圓補完整', 'Drops below complete it'), 'middle', '#f3e8ff', 15, 'bold');
            skySvg.appendChild(createSvgEl('rect', { x: 14, y: 368, width: 248, height: 43, rx: 10, fill: 'rgba(7,28,24,.86)', stroke: selectedTrackColor, 'stroke-width': 1.6 }));
            addText(skySvg, 26, 395, tr(`● 標記水滴＝送光進${observerName}眼睛`, `● Marked drops → ${observerName}`), 'start', '#fff7d6', 14, 'bold');
          }

          const primaryMark = isPrimary ? '▶ ' : '';
          const secondaryMark = isPrimary ? '' : '▶ ';
          skySvg.appendChild(createSvgEl('rect', { x: 258, y: 12, width: 206, height: 112, rx: 10, fill: 'rgba(7,28,24,.90)', stroke: 'rgba(242,236,217,.24)' }));
          addText(skySvg, 452, 34, tr(`${secondaryMark}霓較暗｜50°～54°`, `${secondaryMark}Fainter secondary | 50°–54°`), 'end', '#c9b8d9', 13, 'bold');
          addText(skySvg, 452, 56, tr('中間｜亞歷山大暗帶', "Between | Alexander's band"), 'end', '#c9c2ab', 13, 'bold');
          addText(skySvg, 452, 78, tr(`${primaryMark}虹較亮｜40°～42°`, `${primaryMark}Brighter primary | 40°–42°`), 'end', '#fff7d6', 13, 'bold');
          addText(skySvg, 452, 102, tr('白虛線＝追蹤，不代表變亮', 'Dash = tracked, not brighter'), 'end', '#8fdcff', 12, 'bold');

          const answer = document.createElement('div');
          answer.className = 'rainbow-answer';
          answer.innerHTML = angleMatches
            ? `<b>${tr('角度探測成功：', 'Angle lock acquired:')}</b>${tr(`你選的 ${p.scanAngle.toFixed(1)}° 落在 ${minAngle.toFixed(1)}°～${maxAngle.toFixed(1)}° 亮帶內；這個角度附近的光線會集中到相近方向。`, `Your ${p.scanAngle.toFixed(1)}° scan lies inside the ${minAngle.toFixed(1)}°–${maxAngle.toFixed(1)}° bright band, where many ray paths bunch into similar directions.`)}<br><b>${tr('每滴都會，不是每滴都被你看見：', 'Every drop does it, but you do not see every drop:')}</b>${tr(`所有小水滴都在讓陽光折射、反射、分色；畫面亮起的水滴，只是剛好把所選彩虹送進${observerName}眼睛的那一組。`, `All drops refract, reflect, and disperse sunlight. The lit markers are just the set sending the selected bow into ${observerName}'s eye.`)}<br><b>${tr('換人為什麼會換一圈？', 'Why does changing observer change the ring?')}</b>${tr('以每個人的眼睛為頂點，同樣角度繞反太陽方向形成各自的圓錐；人一移動，圓錐跟著移動，貢獻彩虹的水滴便主要換成另一組。這不是固定距離的一個水滴圓環，而是角度圓錐投影到天空後看成的圓。', 'Each eye is the tip of its own angular cone. Move the observer and the cone moves, so a mostly different set of drops contributes. It is not one ring of drops at a fixed distance, but the sky projection of an angular cone.')}`
            : `<b>${tr('角度還沒對準：', 'Angle not locked yet:')}</b>${tr(`你選的 ${p.scanAngle.toFixed(1)}° 不在 ${minAngle.toFixed(1)}°～${maxAngle.toFixed(1)}° 亮帶內。繼續拖曳，直到探測器變綠。`, `Your ${p.scanAngle.toFixed(1)}° scan is outside the ${minAngle.toFixed(1)}°–${maxAngle.toFixed(1)}° bright band. Keep dragging until the detector turns green.`)}<br><b>${tr('別誤會暗的地方：', 'Do not misread the dark region:')}</b>${tr('水滴沒有停止折射與反射；只是這個方向沒有那麼多虹或霓的光線集中進眼睛。角度要從反太陽方向量，不是從地面量。', 'The droplets have not stopped refracting or reflecting; fewer primary- or secondary-bow rays concentrate toward the eye in that direction. Measure from the antisolar direction, not the ground.')}`;
          answer.innerHTML += `<br><b>${tr('同一滴水的雙重身分：', 'One drop, two roles:')}</b>${tr('同一顆雨滴可以把一次反射的虹光送進一雙眼睛，同時把兩次反射的霓光送往另一雙眼睛。所以你霓上的某些水滴，可能在別人眼中成為虹上的水滴；不是整條霓直接變成別人的整條虹。', 'One drop can send a one-reflection primary ray into one pair of eyes while sending a two-reflection secondary ray toward another pair. So some drops in your secondary bow may appear in another observer’s primary bow; your entire secondary does not simply become their entire primary.')}`;
          visualContainer.appendChild(answer);

          addStat('雨滴內部反射', 'Internal Reflections', isPrimary ? tr('1 次', '1') : tr('2 次', '2'));
          addStat('進眼睛的角度（紅／紫）', 'Eye Angle (Red / Violet)', `${redAngle.toFixed(1)}° / ${violetAngle.toFixed(1)}°`);
          addStat('亮度', 'Brightness', isPrimary ? tr('較亮', 'Brighter') : tr('較暗', 'Fainter'));
          addStat('色序', 'Color Order', isPrimary ? tr('紅外、紫內', 'Red outer, violet inner') : tr('紫外、紅內', 'Violet outer, red inner'));
          addStat('目前觀察者與視野', 'Observer and View', p.viewpoint === 'aircraft' ? tr(`${observerName}｜可能看到完整圓`, `${observerName} | possible full circle`) : tr(`${observerName}｜地面只露出弧`, `${observerName} | ground arc`));

          explainBox.innerHTML = tr(`
            <h3>🔮 資優統整：每滴都在做光學，但只有「你的角度圓錐」形成彩虹</h3>
            <p><b>不是只有一圈水滴才會折射：</b>每一顆被陽光照到、近似球形的水滴，都會讓陽光折射、在滴內反射、分色，也會把光送往許多方向。畫面的亮點是「教學標記」，表示這些水滴剛好把所選彩虹送進目前觀察者的眼睛；不是其他水滴沒有發生光學現象。<br>
            <b>為什麼某些角度特別亮：</b>陽光打在同一顆水滴的不同位置，離開時方向不完全相同；但在虹、霓的特定角度附近，許多光路會擠在相近方向，形成光線集中帶，所以眼睛收到的光較強。<br>
            <b>先找基準線：</b>太陽在背後時，從眼睛往太陽正反方向延伸，就是「反太陽方向」，把它定為 0°。這裡的角度<b>不是從地面量</b>。<br>
            <b>虹（主虹）：</b>一次內部反射；本模型算得紅光約 ${primaryReference.red.toFixed(1)}°、紫光約 ${primaryReference.violet.toFixed(1)}°。所以紅色在較外側，紫色在較內側。<br>
            <b>霓（副虹）：</b>兩次內部反射；紅光約 ${secondaryReference.red.toFixed(1)}°、紫光約 ${secondaryReference.violet.toFixed(1)}°。紫光角度更大，因此色序反轉；多反射一次也讓霓更淡。<br>
            <b>亞歷山大暗帶不是「沒有水滴」：</b>虹外緣與霓內緣之間，較少一次或兩次反射的彩虹光線集中朝向觀察者，所以只會<b>相對較暗</b>，不是完全沒有光。圖中虹永遠畫得較亮、霓永遠較暗；白色虛線只表示目前追蹤哪一道，不會改變物理亮度。<br>
            <b>每個人都有自己的彩虹：</b>能以相同角度把色光送進某雙眼睛的水滴，在三維空間形成以那雙眼睛為頂點的圓錐。觀察者一移動，圓錐就移動，貢獻彩虹的水滴也主要換成另一組；甚至同一條彩虹的紅、紫兩色，也分別來自角度稍不同的水滴。<br>
            <b>「你的霓」可能用到「別人的虹」那顆水滴：</b>同一顆雨滴同時接收一整束平行陽光，其中不同的入射光會走一次或兩次內部反射，再朝不同方向離開。因此它可能把霓光送給你，同時把虹光送給另一個站在不同位置的人。這不是同一束光變身，也不是整條霓原封不動地變成別人的虹，而是某些水滴在不同觀察者眼中扮演不同角色。<br>
            <b>圓從哪裡來：</b>同一角度繞反太陽方向一整圈，形成角度圓錐；投影到天空視野後看成圓。這不是固定距離的一個水滴圓環，水滴可以位在圓錐面上的不同距離。地面遮住下半圈，所以平常只見弧；飛機上若視線下方也有水滴，便可能看見完整圓。<br>
            <b>太陽愈高，弧愈低：</b>反太陽點會落到地平線下同樣的角度；主虹在太陽高度接近 42° 時會沉到地平線下。圖中色帶有加粗方便觀察，但紅、紫光路與角度由程式分別計算。</p>
          `, `
            <h3>🔮 Advanced Wrap-Up: Every Drop Does Optics, but Your Cone Selects the Bow</h3>
            <p><b>It is not only one ring of drops that refracts:</b> every sunlit, nearly spherical drop refracts, internally reflects, disperses, and sends light in many directions. The lit dots are teaching markers for drops sending the selected bow into the current observer's eye; unlit dots still process sunlight.<br>
            <b>Why special angles are bright:</b> sunlight entering different places on one drop exits in slightly different directions. Near the rainbow angles, many paths bunch into similar directions, creating a concentration of light and a brighter signal at the eye.<br>
            <b>Find the reference axis:</b> with the Sun behind you, the direction exactly opposite the Sun is the antisolar direction, defined here as 0°. The angle is <b>not measured from the ground</b>.<br>
            <b>Primary rainbow:</b> one internal reflection; this model gives red at about ${primaryReference.red.toFixed(1)}° and violet at ${primaryReference.violet.toFixed(1)}°, placing red outside and violet inside.<br>
            <b>Secondary rainbow:</b> two reflections; red is about ${secondaryReference.red.toFixed(1)}° and violet about ${secondaryReference.violet.toFixed(1)}°. The larger violet angle reverses the order, and the extra reflection makes the bow fainter.<br>
            <b>Alexander's dark band does not mean “no drops”:</b> between the outer edge of the primary and the inner edge of the secondary, fewer one- or two-reflection rainbow rays concentrate toward the observer, so the region is only <b>relatively darker</b>. The primary stays brighter and the secondary stays fainter in this diagram; the dashed white ring only marks the selected bow.<br>
            <b>Each observer has a personal rainbow:</b> drops sending a color at the same angle to one pair of eyes form a cone with those eyes at its tip. Move the observer and the cone moves, so a mostly different set of drops contributes. Even red and violet in one bow come from slightly different angular sets of drops.<br>
            <b>A drop in “your secondary” may also be a drop in “someone else's primary”:</b> one drop receives a whole bundle of parallel sunlight. Different incident rays within that bundle can follow one- or two-reflection paths and leave in different directions. The drop may therefore send a secondary ray to you while sending a primary ray to another person standing elsewhere. This is not one ray changing identity, nor does your whole secondary become their whole primary; some drops play different roles for different observers.<br>
            <b>Why a circle:</b> rotating one angle all the way around the antisolar direction forms an angular cone whose sky projection is a circle. It is not one ring of drops at a fixed distance; contributing drops may lie at different distances along the cone. The ground blocks the lower part; from an aircraft, droplets below the line of sight may complete it.<br>
            <b>Higher Sun, lower arc:</b> the antisolar point lies equally far below the horizon. The primary bow drops below the horizon when the Sun approaches 42° altitude. Bands are thickened for visibility, while the red and violet paths and angles are calculated separately.</p>
          `);

        } else if (m === 'object_color') {
          const p = params.object_color;
          const lightObj = colorMap[p.light];
          const objObj = colorMap[p.objColor];

          let inColors = [];
          if (p.light === 'white') inColors = ['#ff0000', '#00ff00', '#5fb0ff'];
          else inColors = [lightObj.hex];

          let outColors = [];
          if (p.objColor === 'black') {
             // 黑色吸收所有光線，不輸出
          } else if (p.objColor === 'white') {
              outColors = [...inColors]; // 白色反射/穿透所有光線
          } else {
              if (p.light === 'white' || p.light === p.objColor) {
                  outColors = [objObj.hex];
              }
          }

          const seenKey = outColors.length === 3 ? 'white' : (outColors.length === 1 ? (p.light === 'white' ? p.objColor : p.light) : 'black');
          const seenObj = colorMap[seenKey];
          const scene = document.createElement('div');
          scene.className = 'fitting-room';
          const coneColor = p.light === 'white' ? 'rgba(255,255,238,.95)' : lightObj.hex;
          const objectMarkup = p.objType === 'opaque'
            ? `<div class="shirt" style="background:${seenObj.hex};opacity:${seenKey==='black' ? .48 : 1}" aria-label="${tr('燈光下看到的衣服', 'Shirt as seen under the lamp')}"></div>`
            : `<div style="width:220px;height:190px;transform:skew(-8deg);border:4px solid rgba(255,255,255,.72);border-radius:12px;background:${seenObj.hex};opacity:${seenKey==='black' ? .22 : .72};box-shadow:0 18px 34px rgba(3,12,10,.48)" aria-label="${tr('舞台彩色濾片', 'Stage color filter')}"></div>`;
          scene.innerHTML = `<div class="light-cone" style="background:linear-gradient(to bottom,${coneColor},transparent)"></div>${objectMarkup}<div style="position:absolute;bottom:16px;color:var(--chalk);font-weight:700">${seenKey==='black' ? tr('沒有可反射／透射的色光，接近黑色', 'No matching light is reflected/transmitted; it appears dark') : `${tr('眼睛收到', 'Your eyes receive')} ${tr(seenObj.zh,seenObj.en)}${tr('色光', ' light')}`}</div>`;
          visualContainer.appendChild(scene);

          let seenColorZh = seenObj.zh + '色';
          let seenColorEn = seenObj.en;

          addStat('入射光', 'Incident Light', `${tr(lightObj.zh, lightObj.en)}${tr('光', '')}`);
          addStat('物體顏色', 'Object Color', `${tr(objObj.zh, objObj.en)}${tr('色', '')}`);
          addStat('眼睛看到的顏色', 'Perceived Color', `<span style="color:${seenObj.hex}">${tr(seenColorZh, seenColorEn)}</span>`);

          explainBox.innerHTML = tr(`
            <h3>👕 衣服沒有自己發光，我們看到的是它送回眼睛的光</h3>
            <p><b>不透明衣服</b>會選擇性反射入射光中的部分色光；紅衣在白光下主要把紅光送回眼睛。如果現場只有綠光，紅衣沒有紅光可以反射，就會顯得很暗。<br>
            <b>彩色濾片</b>則是選擇性讓某些色光通過。這裡用理想化的單色模型幫助判斷；真實染料與濾片的光譜通常更複雜。</p>
          `, `
            <h3>👕 A Shirt Does Not Produce Light; We See the Light It Sends Back</h3>
            <p>An <b>opaque shirt</b> selectively reflects parts of the incident light. Under white light, a red shirt mainly sends red light to your eyes. Under green-only light, there is no red light available to reflect, so it looks dark.<br>
            A <b>color filter</b> selectively transmits parts of the incident light. This activity uses an idealized single-color model; real dyes and filters usually have more complex spectra.</p>
          `);

        } else if (m === 'quiz_love') {
          const lightCol = params.quiz_love.light;
          let heartFill = '#ff0000';
          let textFill = '#ffffff';

          if (lightCol === 'red') {
             heartFill = '#ff0000'; 
             textFill = '#ff0000';  
          } else if (lightCol === 'green') {
             heartFill = '#111111'; 
             textFill = '#00ff00';  
          } else if (lightCol === 'blue') {
             heartFill = '#111111'; 
             textFill = '#5fb0ff';  
          }

          const lightHex = lightCol === 'white' ? 'rgba(255,255,238,.18)' :
                         (lightCol === 'red' ? 'rgba(255,0,0,.20)' :
                         (lightCol === 'green' ? 'rgba(0,255,0,.18)' : 'rgba(95,176,255,.20)'));
          const hidden = lightCol === 'green' || lightCol === 'blue';
          const stage = document.createElement('div');
          stage.className = 'color-card-stage';
          stage.style.background = `radial-gradient(circle at 50% 5%, ${lightHex}, transparent 58%), #071713`;
          stage.innerHTML = `<div class="love-card"><div class="love-heart" style="color:${heartFill};opacity:${hidden ? .09 : 1}" aria-label="${tr('紅色愛心', 'Red heart')}">♥</div><div class="love-word" style="color:${textFill}">LOVE</div></div><div class="mission-status" style="position:absolute;bottom:12px">${params.quiz_love.found.length === 2 ? tr('🔓 密室解鎖！答案是綠光與藍光', '🔓 Unlocked! Green and blue are the answers') : `${tr('已找到', 'Found')} ${params.quiz_love.found.length} / 2`}</div>`;
          visualContainer.appendChild(stage);

          const lNameZh = colorMap[lightCol].zh;
          const lNameEn = colorMap[lightCol].en;
          addStat('目前燈光', 'Current Light', `${tr(lNameZh, lNameEn)}${tr('光', '')}`);
          
          let heartLooksZh = lightCol==='white'||lightCol==='red' ? '紅色' : '黑色 (消失)';
          let heartLooksEn = lightCol==='white'||lightCol==='red' ? 'Red' : 'Black (Disappears)';
          addStat('愛心看起來', 'Heart Appears', tr(heartLooksZh, heartLooksEn));
          
          let textLooksZh = lightCol==='white' ? '白色' : `${lNameZh}色`;
          let textLooksEn = lightCol==='white' ? 'White' : lNameEn;
          addStat('文字看起來', 'Text Appears', tr(textLooksZh, textLooksEn));

          explainBox.innerHTML = tr(`
            <h3>🔐 密室解碼：為什麼紅愛心會消失？</h3>
            <p>卡片是黑底、白字、紅愛心：<br>
            當用<b>綠色燈光</b>或<b>藍色燈光</b>照射時，白字會反射該色光變成綠/藍色，但<b>紅色的愛心會將綠/藍光完全吸收</b>，導致沒有光線反射出來，變成黑色！<br>
            因為背景本來就是黑色，所以愛心就完美地「隱形」在背景中了！</p>
          `, `
            <h3>🔐 Escape-Room Code: Why Does the Red Heart Vanish?</h3>
            <p>This is a card with a black background, white text, and a red heart:<br>
            When illuminated with <b>Green</b> or <b>Blue Light</b>, the white text reflects that color. However, the <b>red heart absorbs all green/blue light</b>, reflecting nothing and turning black!<br>
            Since the background is already black, the heart "turns invisible" and perfectly blends in!</p>
          `);
        }
      }

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          stopRainbowAnimation();
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          currentMode = e.currentTarget.dataset.mode;
          initUI();
        });
      });

      initUI();
      setLang('zh');
    })();
  </script>
</body>
