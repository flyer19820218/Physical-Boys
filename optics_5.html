<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 光學｜光與顏色的世界 黑板模擬器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1300px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 2.1rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 780px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-family: 'Kalam', cursive; font-size: 1.25rem; margin: 0 0 14px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.92rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
    }
    .mode-switch button span.sub { font-size: 0.75rem; font-weight: 400; opacity: 0.7; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.4); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.85; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 14px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--chalk-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 5px; background: transparent; cursor: pointer; }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 10px; min-height: 350px; justify-content: center; }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--chalk-yellow); font-weight: 600; margin-top: 3px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 14px 18px; }
    .explain-box h3 { font-family: 'Kalam', cursive; color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.1rem; }
    .explain-box p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; font-style: italic; }

    /* RGB 混色專用 CSS */
    .rgb-container { position: relative; width: 300px; height: 300px; background: #000; border-radius: 50%; }
    .spotlight { position: absolute; border-radius: 50%; width: 160px; height: 160px; mix-blend-mode: screen; filter: blur(4px); transition: all 0.2s; }
    .spot-r { background: rgb(255, 0, 0); top: 20px; left: 70px; }
    .spot-g { background: rgb(0, 255, 0); bottom: 30px; left: 20px; }
    .spot-b { background: rgb(0, 0, 255); bottom: 30px; right: 20px; }

    .btn-group { display: flex; gap: 6px; margin-top: 4px; }
    .c-btn { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--chalk-dim); cursor: pointer; font-weight: bold; transition: all 0.2s; }
    
    footer { text-align: center; color: var(--chalk-dim); font-size: 0.8rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 4-5</div>
      <h1>光學四：光與顏色的世界</h1>
      <p>從牛頓的三稜鏡色散，到光的三原色加法混色。親手搭配入射光與物體顏色，破解生活中的顏色魔術！</p>
    </header>

    <div class="board">
      <h2>① 選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="prism">
          <span>🌈 1. 三稜鏡色散</span>
          <span class="sub">紅光快、紫光慢，偏折不同</span>
        </button>
        <button data-mode="rgb">
          <span>💡 2. 光的三原色</span>
          <span class="sub">RGB 疊加與混合光</span>
        </button>
        <button data-mode="object_color">
          <span>🍎 3. 物體的顏色</span>
          <span class="sub">反射不吸收的色光</span>
        </button>
        <button data-mode="quiz_love">
          <span>💌 4. 經典題：LOVE 卡片</span>
          <span class="sub">切換燈光，愛心去哪了？</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="visual-card" id="visualContainer">
        <!-- SVG 或 HTML 內容會動態生成於此 -->
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>② 課堂重點與原理解析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer>國中理化 光學單元 · 視覺化互動教學教材 · 設計：彥君老師</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const visualContainer = document.getElementById('visualContainer');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');

      let currentMode = 'prism';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const params = {
        prism: { angle: 15 },
        rgb: { r: 255, g: 255, b: 255 },
        object_color: { light: 'white', objType: 'opaque', objColor: 'red' },
        quiz_love: { light: 'white' }
      };

      const colorMap = {
        'white': { name: '白', val: '#ffffff', hex: '#ffffff' },
        'red': { name: '紅', val: 'rgb(255,0,0)', hex: '#ff0000' },
        'green': { name: '綠', val: 'rgb(0,255,0)', hex: '#00ff00' },
        'blue': { name: '藍', val: 'rgb(0,0,255)', hex: '#5fb0ff' }, // 為了視覺清楚，藍色用亮藍
        'black': { name: '黑', val: '#111111', hex: '#222222' }
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { for (let key in attrs) el.setAttribute(key, attrs[key]); }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal') {
          const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC' });
          t.innerHTML = txt; 
          parent.appendChild(t);
      }

      function initUI() {
        renderControls();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, label, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${label} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            let newVal = parseFloat(e.target.value);
            newVal = onChange(newVal);
            e.target.value = newVal;
            document.getElementById(`val_${id}`).textContent = (unit ? `${newVal} ${unit}` : newVal);
            updateSimulation();
          });
        };

        if (m === 'prism') {
          addSlider('angle', '入射光角度', 0, 30, 1, p.angle, '度', v => { p.angle = v; return v; });
        } else if (m === 'rgb') {
          addSlider('r', '紅光 (Red) 強度', 0, 255, 5, p.r, '', v => { p.r = v; return v; });
          addSlider('g', '綠光 (Green) 強度', 0, 255, 5, p.g, '', v => { p.g = v; return v; });
          addSlider('b', '藍光 (Blue) 強度', 0, 255, 5, p.b, '', v => { p.b = v; return v; });
        } else if (m === 'object_color') {
          const div1 = document.createElement('div'); div1.className = 'control';
          div1.innerHTML = `
            <label>照射光源顏色</label>
            <div class="btn-group">
              <button class="c-btn" style="background:${p.light==='white'?'#fff':'#333'}; color:${p.light==='white'?'#000':'#fff'}" onclick="setObjColor('light', 'white')">白光</button>
              <button class="c-btn" style="background:${p.light==='red'?'#ff4d4d':'#333'}; color:${p.light==='red'?'#000':'#ff4d4d'}" onclick="setObjColor('light', 'red')">紅光</button>
              <button class="c-btn" style="background:${p.light==='green'?'#4cd964':'#333'}; color:${p.light==='green'?'#000':'#4cd964'}" onclick="setObjColor('light', 'green')">綠光</button>
              <button class="c-btn" style="background:${p.light==='blue'?'#5fb0ff':'#333'}; color:${p.light==='blue'?'#000':'#5fb0ff'}" onclick="setObjColor('light', 'blue')">藍光</button>
            </div>
          `;
          controlsBox.appendChild(div1);

          const div2 = document.createElement('div'); div2.className = 'control';
          div2.innerHTML = `
            <label>物體本色與材質</label>
            <select id="selObjType" style="width:100%; padding:6px; background:#222; color:#fff; border:1px solid var(--chalk-dim); border-radius:4px; margin-bottom:6px;">
                <option value="opaque" ${p.objType==='opaque'?'selected':''}>不透明物體 (反射)</option>
                <option value="transparent" ${p.objType==='transparent'?'selected':''}>透明壓克力板 (透射)</option>
            </select>
            <div class="btn-group">
              <button class="c-btn" style="background:${p.objColor==='white'?'#fff':'#333'}; color:${p.objColor==='white'?'#000':'#fff'}" onclick="setObjColor('objColor', 'white')">白色</button>
              <button class="c-btn" style="background:${p.objColor==='red'?'#ff4d4d':'#333'}; color:${p.objColor==='red'?'#000':'#ff4d4d'}" onclick="setObjColor('objColor', 'red')">紅色</button>
              <button class="c-btn" style="background:${p.objColor==='green'?'#4cd964':'#333'}; color:${p.objColor==='green'?'#000':'#4cd964'}" onclick="setObjColor('objColor', 'green')">綠色</button>
              <button class="c-btn" style="background:${p.objColor==='blue'?'#5fb0ff':'#333'}; color:${p.objColor==='blue'?'#000':'#5fb0ff'}" onclick="setObjColor('objColor', 'blue')">藍色</button>
              <button class="c-btn" style="background:${p.objColor==='black'?'#000':'#333'}; color:${p.objColor==='black'?'#fff':'#aaa'}; border-color:#fff;" onclick="setObjColor('objColor', 'black')">黑色</button>
            </div>
          `;
          controlsBox.appendChild(div2);

          document.getElementById('selObjType').addEventListener('change', (e) => {
              p.objType = e.target.value;
              updateSimulation();
          });

          window.setObjColor = (key, val) => {
              p[key] = val;
              renderControls();
              updateSimulation();
          };
        } else if (m === 'quiz_love') {
          const div = document.createElement('div'); div.className = 'control';
          div.innerHTML = `
            <label>切換房間燈光</label>
            <div class="btn-group">
              <button class="c-btn" style="background:${p.light==='white'?'#fff':'#333'}; color:${p.light==='white'?'#000':'#fff'}" onclick="setLoveLight('white')">💡 白光</button>
              <button class="c-btn" style="background:${p.light==='red'?'#ff4d4d':'#333'}; color:${p.light==='red'?'#000':'#ff4d4d'}" onclick="setLoveLight('red')">🔴 紅光</button>
              <button class="c-btn" style="background:${p.light==='green'?'#4cd964':'#333'}; color:${p.light==='green'?'#000':'#4cd964'}" onclick="setLoveLight('green')">🟢 綠光</button>
              <button class="c-btn" style="background:${p.light==='blue'?'#5fb0ff':'#333'}; color:${p.light==='blue'?'#000':'#5fb0ff'}" onclick="setLoveLight('blue')">🔵 藍光</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setLoveLight = (val) => { p.light = val; renderControls(); updateSimulation(); };
        }
      }

      function updateSimulation() {
        visualContainer.innerHTML = '';
        statsGrid.innerHTML = '';
        const m = currentMode;
        
        const addStat = (k, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'prism') {
          const svg = createSvgEl('svg', { viewBox: '-300 -150 600 300' });
          const angle = params.prism.angle; // 0 to 30
          const incY = 50 + angle * 2; 

          // 畫白光入射線
          svg.appendChild(createSvgEl('line', { x1: -250, y1: incY, x2: -50, y2: 0, stroke: '#ffffff', 'stroke-width': 4 }));
          addText(svg, -150, incY/2 - 10, '太陽白光', 'middle', '#fff', 14, 'bold');

          // 畫三稜鏡
          svg.appendChild(createSvgEl('polygon', { points: '0,-100 -80,60 80,60', fill: 'rgba(255,255,255,0.1)', stroke: 'var(--chalk-dim)', 'stroke-width': 2 }));
          addText(svg, 0, 80, '玻璃三稜鏡', 'middle', 'var(--chalk-dim)', 14, 'bold');

          // 畫色散光線 (紅到紫，折射角依序變大)
          // 內部光線
          const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#8b00ff'];
          const names = ['紅', '橙', '黃', '綠', '藍', '靛', '紫'];
          
          colors.forEach((col, idx) => {
             // 打到右側鏡面的 y 座標
             const rightY = -10 + idx * 3;
             svg.appendChild(createSvgEl('line', { x1: -50, y1: 0, x2: 50, y2: rightY, stroke: col, 'stroke-width': 2, opacity: 0.8 }));
             
             // 出射光線 (偏折更大)
             // 紅光偏折小，紫光偏折大
             const spread = 20 + idx * 10 + angle * 1.5;
             svg.appendChild(createSvgEl('line', { x1: 50, y1: rightY, x2: 250, y2: rightY + spread, stroke: col, 'stroke-width': 3 }));
             
             addText(svg, 260, rightY + spread + 4, names[idx], 'start', col, 14, 'bold');
          });

          visualContainer.appendChild(svg);

          addStat('紅光偏折', `最小`);
          addStat('紫光偏折', `最大`);
          addStat('光速(玻璃中)', `紅光 > 紫光`);

          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：牛頓的三稜鏡色散</h3>
            <p>西元 1666 年，牛頓發現太陽的白光通過三稜鏡後，會被折射分散成七種色光。<br>
            為什麼會這樣呢？因為不同顏色的光，在玻璃中的<b>行進速度不同</b>！<br>
            記住關鍵：<span class="formula-highlight">紅光較快，所以偏折較少</span>；紫光最慢，所以偏折角度最大！</p>
          `;

        } else if (m === 'rgb') {
          const p = params.rgb;
          
          const container = document.createElement('div');
          container.className = 'rgb-container';
          
          container.innerHTML = `
             <div class="spotlight spot-r" style="background: rgba(${p.r}, 0, 0, 1)"></div>
             <div class="spotlight spot-g" style="background: rgba(0, ${p.g}, 0, 1)"></div>
             <div class="spotlight spot-b" style="background: rgba(0, 0, ${p.b}, 1)"></div>
          `;
          visualContainer.appendChild(container);

          addStat('R (紅)', `${p.r}`);
          addStat('G (綠)', `${p.g}`);
          addStat('B (藍)', `${p.b}`);

          let mixed = '黑色 (無光)';
          if (p.r > 200 && p.g > 200 && p.b > 200) mixed = '白光';
          else if (p.r > 200 && p.g > 200 && p.b < 50) mixed = '黃光 (Yellow)';
          else if (p.r > 200 && p.b > 200 && p.g < 50) mixed = '洋紅光 (Magenta)';
          else if (p.g > 200 && p.b > 200 && p.r < 50) mixed = '青光 (Cyan)';
          addStat('中心混色結果', mixed);

          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：光的三原色</h3>
            <p>紅(R)、綠(G)、藍(B)是光的三原色。這是一種「加法混色」，光線越疊加越亮！<br>
            試著將兩兩滑桿拉滿：<br>
            <span class="formula-highlight">紅＋綠 ＝ 黃</span><br>
            <span class="formula-highlight">紅＋藍 ＝ 洋紅</span><br>
            <span class="formula-highlight">藍＋綠 ＝ 青</span><br>
            三原色光同時照射，就會合成白色光！電視機和手機螢幕就是利用這個原理發光的喔[cite: 1]。</p>
          `;

        } else if (m === 'object_color') {
          const p = params.object_color;
          const svg = createSvgEl('svg', { viewBox: '-300 -150 600 300' });

          const lightObj = colorMap[p.light];
          const objObj = colorMap[p.objColor];

          // 畫入射光
          let inColors = [];
          if (p.light === 'white') inColors = ['#ff0000', '#00ff00', '#5fb0ff'];
          else inColors = [lightObj.hex];

          inColors.forEach((col, idx) => {
              const offset = inColors.length === 3 ? (idx - 1) * 15 : 0;
              svg.appendChild(createSvgEl('line', { x1: -150 + offset, y1: -120, x2: offset, y2: -20, stroke: col, 'stroke-width': 4, 'marker-end': 'url(#arrow_' + col.replace('#','') + ')' }));
          });

          // 決定反射或透射光
          let outColors = [];
          if (p.objColor === 'black') {
              // 黑色全吸收，無光出
          } else if (p.objColor === 'white') {
              // 白色全反射/透射
              outColors = [...inColors];
          } else {
              // 有顏色物體，只允許該顏色通過/反射
              if (p.light === 'white' || p.light === p.objColor) {
                  outColors = [objObj.hex];
              }
          }

          // 畫物體
          if (p.objType === 'opaque') {
              // 不透明：畫一顆蘋果或方塊
              svg.appendChild(createSvgEl('rect', { x: -60, y: -20, width: 120, height: 40, fill: objObj.hex, rx: 10, stroke: '#fff', 'stroke-width': 2 }));
              addText(svg, 0, 45, `${objObj.name}色 不透明物體`, 'middle', 'var(--chalk)', 14, 'bold');
              
              // 畫反射光
              outColors.forEach((col, idx) => {
                  const offset = outColors.length === 3 ? (idx - 1) * 15 : 0;
                  svg.appendChild(createSvgEl('line', { x1: offset, y1: -20, x2: 150 + offset, y2: -120, stroke: col, 'stroke-width': 5, 'marker-end': 'url(#arrow_' + col.replace('#','') + ')' }));
              });
              
              if (outColors.length === 0) {
                 addText(svg, 100, -60, '光被全部吸收！', 'middle', 'var(--chalk-dim)', 14, 'bold');
              }
          } else {
              // 透明：畫玻璃紙
              svg.appendChild(createSvgEl('polygon', { points: '-80,-20 60,-20 80,20 -60,20', fill: objObj.hex, opacity: 0.7, stroke: '#fff', 'stroke-width': 2 }));
              addText(svg, 0, 45, `${objObj.name}色 壓克力板`, 'middle', 'var(--chalk)', 14, 'bold');

              // 畫透射光
              outColors.forEach((col, idx) => {
                  const offset = outColors.length === 3 ? (idx - 1) * 15 : 0;
                  svg.appendChild(createSvgEl('line', { x1: offset, y1: 20, x2: 150 + offset, y2: 120, stroke: col, 'stroke-width': 5, 'marker-end': 'url(#arrow_' + col.replace('#','') + ')' }));
              });

              if (outColors.length === 0) {
                 addText(svg, 100, 80, '光被全部吸收！', 'middle', 'var(--chalk-dim)', 14, 'bold');
              }
          }

          // 定義箭頭
          let defs = '<defs>';
          ['ff0000', '00ff00', '5fb0ff', 'ffffff'].forEach(col => {
             defs += `<marker id="arrow_${col}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 2 L 10 5 L 0 8 z" fill="#${col}" /></marker>`;
          });
          defs += '</defs>';
          svg.innerHTML += defs;

          visualContainer.appendChild(svg);

          let seenColor = outColors.length === 3 ? '白色' : (outColors.length === 1 ? colorMap[p.objColor].name + '色' : '黑色');

          addStat('入射光', `${lightObj.name}光`);
          addStat('物體顏色', `${objObj.name}色`);
          addStat('眼睛看到的顏色', `<span style="color:${outColors.length > 0 ? outColors[0] : '#aaa'}">${seenColor}</span>`);

          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：看見顏色的定義</h3>
            <p>1. <b>不透明物體</b>：物體會反射它本身不吸收的色光。例如：紅色的鞋子只反射紅光，吸收綠光與藍光[cite: 1]；白色物體將所有色光反射；黑色物體吸收所有色光[cite: 1]！<br>
            2. <b>透明物體</b>：透明壓克力片或玻璃紙，只會讓「跟自己同顏色」的光穿透過去，其餘吸收[cite: 1]。<br>
            （試試看用「綠光」照「紅色物體」，你會發現沒有光反射，物體看起來會變成黑色！）</p>
          `;

        } else if (m === 'quiz_love') {
          const lightCol = params.quiz_love.light;
          const svg = createSvgEl('svg', { viewBox: '0 0 400 300' });
          
          // 背景設定為黑色
          svg.appendChild(createSvgEl('rect', { x: 0, y: 0, width: 400, height: 300, fill: '#050505' }));

          // 決定顏色邏輯
          let heartFill = '#ff0000';
          let textFill = '#ffffff';

          if (lightCol === 'red') {
             heartFill = '#ff0000'; // 紅心反射紅光 -> 紅
             textFill = '#ff0000';  // 白字反射紅光 -> 紅
          } else if (lightCol === 'green') {
             heartFill = '#111111'; // 紅心吸收綠光 -> 黑
             textFill = '#00ff00';  // 白字反射綠光 -> 綠
          } else if (lightCol === 'blue') {
             heartFill = '#111111'; // 紅心吸收藍光 -> 黑
             textFill = '#5fb0ff';  // 白字反射藍光 -> 藍
          }

          // 畫愛心 (置中)
          svg.appendChild(createSvgEl('path', { d: 'M 200,180 L 120,80 A 45,45 0 0,1 200,50 A 45,45 0 0,1 280,80 Z', fill: heartFill }));

          // 畫文字 LOVE
          addText(svg, 110, 240, 'L', 'middle', textFill, 32, 'bold');
          addText(svg, 170, 240, 'O', 'middle', textFill, 32, 'bold');
          addText(svg, 230, 240, 'V', 'middle', textFill, 32, 'bold');
          addText(svg, 290, 240, 'E', 'middle', textFill, 32, 'bold');

          // 若為綠光或藍光，愛心融入背景
          if (lightCol === 'green' || lightCol === 'blue') {
             svg.appendChild(createSvgEl('rect', { x: 50, y: 50, width: 300, height: 150, fill: 'none', stroke: '#333', 'stroke-width': 1, 'stroke-dasharray': '5 5' }));
             addText(svg, 200, 120, '愛心變成黑色，融入背景看不見了！', 'middle', '#888', 14);
          }

          // 畫打光效果
          const lightHex = lightCol === 'white' ? 'rgba(255,255,255,0.15)' : 
                          (lightCol === 'red' ? 'rgba(255,0,0,0.15)' : 
                          (lightCol === 'green' ? 'rgba(0,255,0,0.15)' : 'rgba(95,176,255,0.15)'));
          svg.appendChild(createSvgEl('polygon', { points: '200,0 0,300 400,300', fill: lightHex, 'mix-blend-mode': 'screen', 'pointer-events': 'none' }));

          visualContainer.appendChild(svg);

          const lName = colorMap[lightCol].name;
          addStat('目前燈光', `${lName}光`);
          addStat('愛心看起來', lightCol==='white'||lightCol==='red' ? '紅色' : '黑色 (消失)');
          addStat('文字看起來', lightCol==='white' ? '白色' : `${lName}色`);

          explainBox.innerHTML = `
            <h3>💡 經典試題挑戰：消失的情人節卡片</h3>
            <p>這是一張黑底、白字、紅愛心的卡片[cite: 1]：<br>
            當用<b>綠色燈光</b>或<b>藍色燈光</b>照射時，白字會反射該色光變成綠/藍色，但<b>紅色的愛心會將綠/藍光完全吸收</b>，導致沒有光線反射出來，變成黑色！<br>
            因為背景本來就是黑色，所以愛心就完美地「隱形」在背景中了[cite: 1]！</p>
          `;
        }
      }

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
