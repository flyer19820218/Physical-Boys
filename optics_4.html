<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-zh="光學透鏡：五大核心單元與視力黑板模擬器" data-en="Lenses: Five Core Units & Vision Simulator">光學透鏡：五大核心單元與視力黑板模擬器</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board: #1c3d34;
      --board-dark: #11261f;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #fde047;
      --chalk-green: #4ade80;
      --chalk-pink: #f472b6;
      --chalk-blue: #38bdf8;
      --chalk-gray: #9fb0a8;
      --chalk-orange: #fb923c;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 20px;
      padding: 20px 14px 60px;
      padding-top: 80px;
    }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 2px solid var(--chalk-blue);
      border-radius: 12px;
      background: rgba(17, 38, 31, 0.95);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .lang-label {
      color: var(--chalk-blue);
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      user-select: none;
      margin-left: 4px;
    }
    .lang-options {
      display: flex;
      flex-direction: row;
      gap: 4px;
    }
    .lang-pill {
      min-width: 60px;
      min-height: 48px;
      padding: 6px 12px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .lang-pill.active {
      background: var(--chalk-blue) !important;
      color: #0b1a15 !important;
      border-color: var(--chalk-blue) !important;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.15em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-size: 38px; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); color: var(--chalk-yellow); }
    header p { color: var(--chalk-green); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 21px; font-weight: bold; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-size: 28px; margin: 0 0 16px; font-weight: 700;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 20px; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.25);
      padding: 14px 12px; min-height: 64px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: center; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.5); color: var(--chalk); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); border-style: solid;
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 16px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 20px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 8px; background: transparent; cursor: pointer; min-height: 44px; touch-action: manipulation; }

    .presets { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .presets span { font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 2px dashed var(--chalk-dim);
      color: var(--chalk); padding: 10px 18px; min-height: 48px; border-radius: 18px; font-size: 20px; cursor: pointer; transition: all .15s; font-weight: bold;
      touch-action: manipulation;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 16px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; aspect-ratio: 1000 / 480; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 14px 10px; text-align: center; border: 1px dashed var(--chalk-dim); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--chalk-yellow); font-weight: 700; margin-top: 8px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 16px 20px; }
    .explain-box h3 { color: var(--chalk-yellow); margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); }
    
    .math-eq { display: inline-flex; align-items: center; vertical-align: middle; gap: 6px; font-family: 'JetBrains Mono', monospace; font-weight: bold; }
    .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 2px; }
    .fraction .num { border-bottom: 2px solid currentColor; padding: 2px 4px; line-height: 1.2; }
    .fraction .den { padding: 2px 4px; line-height: 1.2; }
    .formula-highlight { background: rgba(242, 214, 117, 0.15); padding: 4px 12px; border-radius: 6px; color: var(--chalk-yellow); display: inline-flex; margin: 6px 0; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 20px; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; font-weight: bold; }

    @media (max-width: 768px) {
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
      .mode-switch { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- 🌟 右上角橫向懸浮雙語切換器 -->
  <div class="floating-lang-container">
    <span class="lang-label">Language</span>
    <div class="lang-options">
      <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
      <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 4-4</div>
      <h1 data-zh="光學透鏡：核心單元與視力模擬器" data-en="Lenses: Core Units & Vision Simulator">光學透鏡：核心單元與視力模擬器</h1>
      <p data-zh="從透鏡會聚與發散原理，到視力矯正光路模擬。一鍵切換，破解成像規律！" data-en="From converging/diverging principles to vision correction simulation. Master imaging laws instantly!">從透鏡會聚與發散原理，到視力矯正光路模擬。一鍵切換，破解成像規律！</p>
    </header>

    <div class="board">
      <h2 data-zh="選擇互動教學模式" data-en="Select Interactive Mode">選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="intro" data-zh="1. 兩種透鏡與原理" data-en="1. Two Lenses & Principles">1. 兩種透鏡與原理</button>
        <button data-mode="convex" data-zh="2. 凸透鏡成像模擬" data-en="2. Convex Lens Simulator">2. 凸透鏡成像模擬</button>
        <button data-mode="hyperopia" data-zh="3. 遠視眼與矯正" data-en="3. Hyperopia Correction">3. 遠視眼與矯正</button>
        <button data-mode="concave" data-zh="4. 凹透鏡成像模擬" data-en="4. Concave Lens Simulator">4. 凹透鏡成像模擬</button>
        <button data-mode="myopia" data-zh="5. 近視眼與矯正" data-en="5. Myopia Correction">5. 近視眼與矯正</button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>
      
      <div class="visual-card">
        <svg id="visualSvg" viewBox="0 0 1000 480">
          <g id="drawLayer"></g>
        </svg>
      </div>
      
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2 data-zh="課堂重點與原理解析" data-en="Key Concepts & Analysis">課堂重點與原理解析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer data-zh="國中理化 光學單元 · 視覺化互動教學教材" data-en="Junior High Science Optics · Interactive Blackboard">國中理化 光學單元 · 視覺化互動教學教材</footer>
  </div>

  <script>
    (function() {
      let currentLang = 'zh';
      let currentMode = 'intro';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const drawLayer = document.getElementById('drawLayer');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');

      const params = {
        intro: {},
        convex: { uRatio: 3.0 }, 
        concave: { uRatio: 3.0 },
        hyperopia: { power: 0 }, 
        myopia: { power: 0 }
      };

      const V_WIDTH = 1000;
      const V_HEIGHT = 480;
      const CX = 500;
      const CY = 240;
      const F_LEN = 140;
      const OBJ_H = 100;

      function tr(zh, en) {
        return currentLang === 'en' ? en : zh;
      }

      window.setLang = function(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';

        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.innerHTML = el.getAttribute(`data-${lang}`);
        });

        initUI();
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { 
          for (let key in attrs) {
            if (key === 'style') el.style.cssText = attrs[key];
            else el.setAttribute(key, attrs[key]);
          }
        }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal', style='') {
        const t = createSvgEl('text', { 
          x: x, 
          y: y, 
          'text-anchor': anchor, 
          fill: color, 
          'font-size': size, 
          'font-weight': weight, 
          'font-family': 'Noto Sans TC, sans-serif'
        });
        if(style) t.style.cssText = style;
        t.textContent = txt;
        parent.appendChild(t);
      }

      function drawRay(parent, x1, y1, x2, y2, color, strokeWidth, isDashed = false, drawArrowHead = true) {
        const line = createSvgEl('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': strokeWidth });
        if (isDashed) line.setAttribute('stroke-dasharray', '8 6');
        parent.appendChild(line);

        if (drawArrowHead) {
          const angle = Math.atan2(y2 - y1, x2 - x1);
          const hl = 14; 
          const pts = `${x2},${y2} ${x2 - hl * Math.cos(angle - Math.PI/6)},${y2 - hl * Math.sin(angle - Math.PI/6)} ${x2 - hl * Math.cos(angle + Math.PI/6)},${y2 - hl * Math.sin(angle + Math.PI/6)}`;
          const polygon = createSvgEl('polygon', { points: pts, fill: color });
          parent.appendChild(polygon);
        }
      }

      function drawLens(parent, cx, cy, h, w, type) {
        if (type === 'concave') {
          const path = createSvgEl('path', {
            d: `M ${cx - w},${cy - h} L ${cx + w},${cy - h} Q ${cx + w/4},${cy} ${cx + w},${cy + h} L ${cx - w},${cy + h} Q ${cx - w/4},${cy} ${cx - w},${cy - h} Z`,
            fill: 'rgba(77, 210, 255, 0.25)', stroke: '#4dd2ff', 'stroke-width': 3
          });
          parent.appendChild(path);
        } else {
          const path = createSvgEl('path', {
            d: `M ${cx},${cy - h - 10} Q ${cx + w*1.8},${cy} ${cx},${cy + h + 10} Q ${cx - w*1.8},${cy} ${cx},${cy - h - 10} Z`,
            fill: 'rgba(255, 224, 102, 0.25)', stroke: '#ffe066', 'stroke-width': 3
          });
          parent.appendChild(path);
        }
        const axis = createSvgEl('line', { x1: cx, y1: cy - h - 15, x2: cx, y2: cy + h + 15, stroke: 'rgba(255,255,255,0.6)', 'stroke-width': 2, 'stroke-dasharray': '5 5' });
        parent.appendChild(axis);
      }

      function drawCustomLensSection(parent, cx, cy, type, name) {
        const h = 42;
        let d = '';
        if (type === 'bi-convex') d = `M ${cx},${cy-h} Q ${cx+16},${cy} ${cx},${cy+h} Q ${cx-16},${cy} ${cx},${cy-h} Z`;
        else if (type === 'plano-convex') d = `M ${cx-6},${cy-h} L ${cx-6},${cy+h} Q ${cx+16},${cy} ${cx-6},${cy-h} Z`;
        else if (type === 'concavo-convex') d = `M ${cx-8},${cy-h} Q ${cx+18},${cy} ${cx-8},${cy+h} Q ${cx+4},${cy} ${cx-8},${cy-h} Z`;
        else if (type === 'bi-concave') d = `M ${cx-12},${cy-h} L ${cx+12},${cy-h} Q ${cx+3},${cy} ${cx+12},${cy+h} L ${cx-12},${cy+h} Q ${cx-3},${cy} ${cx-12},${cy-h} Z`;
        else if (type === 'convexo-concave') d = `M ${cx-12},${cy-h} Q ${cx+10},${cy} ${cx-12},${cy+h} L ${cx-4},${cy+h} Q ${cx+14},${cy} ${cx-4},${cy-h} Z`;
        else if (type === 'plano-concave') d = `M ${cx-10},${cy-h} L ${cx+4},${cy-h} Q ${cx-6},${cy} ${cx+4},${cy+h} L ${cx-10},${cy+h} Z`;
        
        const path = createSvgEl('path', { d: d, fill: 'rgba(111, 168, 242, 0.3)', stroke: '#6fa8f2', 'stroke-width': 2.5 });
        parent.appendChild(path);

        const axis = createSvgEl('line', { x1: cx-10, y1: cy, x2: cx+10, y2: cy, stroke: '#ff8040', 'stroke-width': 2 });
        parent.appendChild(axis);
        parent.appendChild(createSvgEl('circle', { cx: cx, cy: cy, r: 2.5, fill: '#ff8040' }));

        addText(parent, cx, cy + h + 26, name, 'middle', '#ffffff', 18, 'bold');
      }

      function initUI() {
        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.replaceChildren();
        presetsBox.replaceChildren();
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, labelZh, labelEn, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${tr(labelZh, labelEn)} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            let newVal = parseFloat(e.target.value);
            newVal = onChange(newVal);
            e.target.value = newVal;
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            updateSimulation();
          });
        };

        if (m === 'convex' || m === 'concave') {
          addSlider('uRatio', '物體位置 (物距 u)', 'Object Position (u)', 0.5, 3.5, 0.1, p.uRatio, 'f', v => { p.uRatio = v; return v; });
        } else if (m === 'hyperopia' || m === 'myopia') {
          addSlider('power', '鏡片矯正強度', 'Lens Correction Power', 0, 100, 1, p.power, '%', v => { p.power = v; return v; });
        }
      }

      function renderPresets() {
        presetsBox.replaceChildren();
        const m = currentMode;
        if (m === 'convex') {
          const span = document.createElement('span');
          span.textContent = tr('⚡ 成像區間快速跳轉：', '⚡ Jump to Region:');
          presetsBox.appendChild(span);
          
          const p = params.convex;
          const addBtn = (label, action) => {
            const b = document.createElement('button');
            b.textContent = label;
            b.onclick = () => { action(); renderControls(); renderPresets(); updateSimulation(); };
            presetsBox.appendChild(b);
          };
          addBtn('A (3f)', () => { p.uRatio = 3.0; });
          addBtn('B (2f)', () => { p.uRatio = 2.0; });
          addBtn('C (1.5f)', () => { p.uRatio = 1.5; });
          addBtn('D (f)', () => { p.uRatio = 1.0; });
          addBtn('E (0.5f)', () => { p.uRatio = 0.5; });
        }
      }

      function updateSimulation() {
        while (drawLayer.firstChild) {
          drawLayer.removeChild(drawLayer.firstChild);
        }
        statsGrid.replaceChildren();
        const m = currentMode;
        
        const addStat = (kZh, kEn, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${tr(kZh, kEn)}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'intro') {
          const cy1 = 120;
          drawLayer.appendChild(createSvgEl('line', { x1: 20, y1: cy1, x2: V_WIDTH-20, y2: cy1, stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 2 }));

          drawCustomLensSection(drawLayer, 120, cy1, 'bi-convex', tr('雙凸透鏡', 'Biconvex'));
          drawCustomLensSection(drawLayer, 240, cy1, 'plano-convex', tr('平凸透鏡', 'Plano-convex'));
          drawCustomLensSection(drawLayer, 360, cy1, 'concavo-convex', tr('凹凸透鏡', 'Concavo-convex'));

          addText(drawLayer, 30, cy1 - 70, tr("● 凸透鏡家族：中間部份較周圍為【厚】 ➔ 具有「會聚光線」效果", "● Convex Family: Thicker in middle ➔ Converges light"), 'start', '#ffe066', 20, 'bold');

          drawLens(drawLayer, 650, cy1, 65, 14, 'convex');
          const focusX1 = 880; 
          [-40, -20, 0, 20, 40].forEach(offset => {
            const y = cy1 + offset;
            drawLayer.appendChild(createSvgEl('line', { x1: 460, y1: y, x2: 650, y2: y, stroke: '#ff8040', 'stroke-width': 3 }));
            
            // 🌟 【完美修復】凸透鏡折射光線斜率嚴格鎖死為穿過焦點 (880, cy1)
            const slope = (cy1 - y) / (focusX1 - 650);
            const endX = 950; // 延伸到右側邊緣
            drawRay(drawLayer, 650, y, endX, y + slope * (endX - 650), '#ff8040', 3, false, offset !== 0);
          });
          addText(drawLayer, focusX1 - 30, cy1 + 32, tr("實焦點 F", "Real Focus F"), 'start', '#ffffff', 18, 'bold');
          drawLayer.appendChild(createSvgEl('circle', { cx: focusX1, cy: cy1, r: 6, fill: '#ff8040' }));

          drawLayer.appendChild(createSvgEl('line', { x1: 30, y1: 250, x2: V_WIDTH-30, y2: 250, stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 2, 'stroke-dasharray': '8 8' }));

          const cy2 = 380;
          drawLayer.appendChild(createSvgEl('line', { x1: 20, y1: cy2, x2: V_WIDTH-20, y2: cy2, stroke: 'rgba(255,255,255,0.4)', 'stroke-width': 2 }));

          drawCustomLensSection(drawLayer, 120, cy2, 'bi-concave', tr('雙凹透鏡', 'Biconcave'));
          drawCustomLensSection(drawLayer, 240, cy2, 'convexo-concave', tr('凸凹透鏡', 'Convexo-concave'));
          drawCustomLensSection(drawLayer, 360, cy2, 'plano-concave', tr('平凹透鏡', 'Plano-concave'));

          addText(drawLayer, 30, cy2 - 70, tr("● 凹透鏡家族：中間部份較周圍為【薄】 ➔ 具有「發散光線」效果", "● Concave Family: Thinner in middle ➔ Diverges light"), 'start', '#4dd2ff', 20, 'bold');

          drawLens(drawLayer, 650, cy2, 65, 14, 'concave');
          const vFocusX = 540;
          [-40, -20, 0, 20, 40].forEach(offset => {
            const y = cy2 + offset;
            drawLayer.appendChild(createSvgEl('line', { x1: 460, y1: y, x2: 650, y2: y, stroke: '#4dd2ff', 'stroke-width': 3 }));
            
            // 🌟 【完美修復】凹透鏡反向虛線與前進實線 100% 貼合共線
            const slope = (y - cy2) / (650 - vFocusX);
            const endX = 950;
            drawRay(drawLayer, 650, y, endX, y + slope * (endX - 650), '#4dd2ff', 3, false, offset !== 0);
            
            if (offset !== 0) {
              drawLayer.appendChild(createSvgEl('line', { x1: 650, y1: y, x2: vFocusX, y2: cy2, stroke: '#4dd2ff', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
            }
          });
          addText(drawLayer, vFocusX - 35, cy2 + 32, tr("虛焦點 F", "Virtual Focus F"), 'start', '#ffffff', 18, 'bold');
          drawLayer.appendChild(createSvgEl('circle', { cx: vFocusX, cy: cy2, r: 6, fill: '#4dd2ff' }));

          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：透鏡的基本形狀與光路</h3>
            <p>只要是<b>「中間厚、邊緣薄」</b>的透鏡，就具備<b>會聚</b>光線的能力；相反地，<b>「中間薄、邊緣厚」</b>的透鏡，就具備<b>發散</b>光線的能力。<br>
            光線通過透鏡時，會發生兩次折射（空氣入玻璃、玻璃出空氣），但在畫光路圖時，我們習慣簡化成在透鏡的中軸線（虛線處）發生一次折射即可。</p>
          `, `
            <h3>💡 Teacher's Analysis: Lens Shapes & Rays</h3>
            <p>Lenses that are <b>"thicker in the middle"</b> have the ability to <b>converge</b> light rays. Conversely, lenses <b>"thinner in the middle"</b> <b>diverge</b> light rays.<br>
            Although light refracts twice (entering and exiting glass), in ray tracing, we simplify it as a single bend at the lens's central axis.</p>
          `);

        } else if (m === 'convex' || m === 'concave') {
          const u_ratio = params[m].uRatio;
          const u = F_LEN * u_ratio;
          const obj_x = CX - u;
          const obj_top_y = CY - OBJ_H;

          // 光軸與透鏡
          drawLayer.appendChild(createSvgEl('line', { x1: 20, y1: CY, x2: V_WIDTH - 20, y2: CY, stroke: 'rgba(255,255,255,0.6)', 'stroke-width': 2 }));
          drawLens(drawLayer, CX, CY, 150, 18, m);

          // 標示焦點與 2f 點
          const markers = [ { ratio: 2.0, name: '2f' }, { ratio: 1.0, name: 'f' } ];
          markers.forEach(mk => {
            [-1, 1].forEach(dir => {
              const x = CX + dir * mk.ratio * F_LEN;
              drawLayer.appendChild(createSvgEl('line', { x1: x, y1: CY - 10, x2: x, y2: CY + 10, stroke: '#ffffff', 'stroke-width': 2 }));
              addText(drawLayer, x, CY + 30, mk.name, 'middle', '#ffe066', 18, 'bold');
            });
          });

          // 繪製物體
          drawLayer.appendChild(createSvgEl('line', { x1: obj_x, y1: CY, x2: obj_x, y2: obj_top_y, stroke: '#ffe066', 'stroke-width': 6 }));
          drawLayer.appendChild(createSvgEl('polygon', { points: `${obj_x},${obj_top_y-8} ${obj_x-6},${obj_top_y+2} ${obj_x+6},${obj_top_y+2}`, fill: '#ffe066' }));
          addText(drawLayer, obj_x, obj_top_y - 15, tr('物體', 'Object'), 'middle', '#ffe066', 18, 'bold');

          if (m === 'concave') {
            const v = -(u * F_LEN) / (u + F_LEN);
            const m_mag = Math.abs(v) / u;
            const img_x = CX + v;
            const img_top_y = CY - OBJ_H * m_mag;

            // 射線 1 (平行光 -> 發散)
            drawLayer.appendChild(createSvgEl('line', { x1: obj_x, y1: obj_top_y, x2: CX, y2: obj_top_y, stroke: '#ff8040', 'stroke-width': 3 }));
            const slope1 = (obj_top_y - CY) / F_LEN; 
            drawRay(drawLayer, CX, obj_top_y, V_WIDTH - 20, obj_top_y + slope1 * (V_WIDTH - 20 - CX), '#ff8040', 3, false, true);
            drawLayer.appendChild(createSvgEl('line', { x1: CX, y1: obj_top_y, x2: CX - F_LEN, y2: CY, stroke: '#4dd2ff', 'stroke-width': 2, 'stroke-dasharray': '6 6' }));

            // 射線 2 (過鏡心直進)
            const slope2 = (CY - obj_top_y) / (CX - obj_x);
            drawRay(drawLayer, obj_x, obj_top_y, V_WIDTH - 20, CY + slope2 * (V_WIDTH - 20 - CX), '#33cc99', 3, false, true);
            drawLayer.appendChild(createSvgEl('line', { x1: CX, y1: CY, x2: img_x, y2: img_top_y, stroke: '#4dd2ff', 'stroke-width': 2, 'stroke-dasharray': '6 6' }));

            // 繪製虛像
            drawLayer.appendChild(createSvgEl('line', { x1: img_x, y1: CY, x2: img_x, y2: img_top_y, stroke: '#4dd2ff', 'stroke-width': 4, 'stroke-dasharray': '5 3' }));
            drawLayer.appendChild(createSvgEl('polygon', { points: `${img_x},${img_top_y-8} ${img_x-6},${img_top_y+2} ${img_x+6},${img_top_y+2}`, fill: '#4dd2ff' }));
            addText(drawLayer, img_x, img_top_y - 15, tr('虛像', 'Virtual'), 'middle', '#4dd2ff', 16, 'bold');

            addStat('物距 <span class="math-text">u</span>', 'Obj Dist <span class="math-text">u</span>', `${u_ratio.toFixed(2)} f`);
            addStat('像距 <span class="math-text">v</span>', 'Img Dist <span class="math-text">v</span>', `${(Math.abs(v) / F_LEN).toFixed(2)} f ${tr('(鏡前)', '(Front)')}`);
            addStat('放大率 <span class="math-text">m</span>', 'Mag <span class="math-text">m</span>', `${m_mag.toFixed(2)} ${tr('倍', 'x')}`);
            addStat('成像性質', 'Image Type', `<span style="color:#ff8040">${tr('正立縮小虛像', 'Upright Reduced Virtual')}</span>`);

            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：凹透鏡永遠的宿命</h3>
              <p>凹透鏡為發散透鏡。不管物體在什麼位置移動（無需死記 3F 或 2F），成像永遠在<b>「鏡前、正立、縮小、虛像」</b>。<br>
              請注意：兩條折射線在鏡前的反向延長虛線，必然精準交會於縮小虛像的頂端。</p>
            `, `
              <h3>💡 Teacher's Analysis: Concave Lens Fate</h3>
              <p>A concave lens is a diverging lens. Regardless of object position, the image is ALWAYS <b>"front, upright, reduced, virtual"</b>.<br>
              Notice how the backward extensions of both refracted rays intersect perfectly at the tip of the virtual image.</p>
            `);

          } else if (m === 'convex') {
            addStat('物距 <span class="math-text">u</span>', 'Obj Dist <span class="math-text">u</span>', `${u_ratio.toFixed(2)} f`);

            if (Math.abs(u_ratio - 1.0) < 0.02) {
              // 位於焦點上 (u = f)
              drawLayer.appendChild(createSvgEl('line', { x1: obj_x, y1: obj_top_y, x2: CX, y2: obj_top_y, stroke: '#ff8040', 'stroke-width': 3 }));
              const slope1 = (CY - obj_top_y) / F_LEN;
              drawRay(drawLayer, CX, obj_top_y, V_WIDTH - 20, obj_top_y + slope1 * (V_WIDTH - 20 - CX), '#ff8040', 3, false, true);

              const slope2 = (CY - obj_top_y) / (CX - obj_x);
              drawRay(drawLayer, obj_x, obj_top_y, V_WIDTH - 20, CY + slope2 * (V_WIDTH - 20 - CX), '#33cc99', 3, false, true);

              addStat('像距 <span class="math-text">v</span>', 'Img Dist <span class="math-text">v</span>', `∞ ${tr('(無限遠)', '(Infinity)')}`);
              addStat('放大率 <span class="math-text">m</span>', 'Mag <span class="math-text">m</span>', tr('無法計算', 'N/A'));
              addStat('成像性質', 'Image Type', `<span style="color:#ff8040">${tr('折射光平行，不成像', 'Parallel rays, no image')}</span>`);
            } else if (u > F_LEN) {
              // 實像區 (u > f)
              const v = (u * F_LEN) / (u - F_LEN);
              const m_mag = v / u;
              const img_x = CX + v;
              const img_top_y = CY + OBJ_H * m_mag;

              drawLayer.appendChild(createSvgEl('line', { x1: obj_x, y1: obj_top_y, x2: CX, y2: obj_top_y, stroke: '#ff8040', 'stroke-width': 3 }));
              const slope1 = (CY - obj_top_y) / F_LEN;
              const extX = Math.min(V_WIDTH - 20, img_x + 100);
              drawRay(drawLayer, CX, obj_top_y, extX, obj_top_y + slope1 * (extX - CX), '#ff8040', 3, false, true);

              const slope2 = (CY - obj_top_y) / (CX - obj_x);
              drawRay(drawLayer, obj_x, obj_top_y, extX, CY + slope2 * (extX - CX), '#33cc99', 3, false, true);

              if (img_x < V_WIDTH - 40) {
                drawLayer.appendChild(createSvgEl('line', { x1: img_x, y1: CY, x2: img_x, y2: img_top_y, stroke: '#4dd2ff', 'stroke-width': 6 }));
                drawLayer.appendChild(createSvgEl('polygon', { points: `${img_x},${img_top_y+8} ${img_x-6},${img_top_y-2} ${img_x+6},${img_top_y-2}`, fill: '#4dd2ff' }));
                addText(drawLayer, img_x, img_top_y + 25, tr('實像', 'Real'), 'middle', '#4dd2ff', 18, 'bold');
              }

              let imgTypeZh = "倒立等大實像"; let imgTypeEn = "Inverted Same-size Real";
              if (m_mag > 1.05) { imgTypeZh = "倒立放大實像"; imgTypeEn = "Inverted Magnified Real"; }
              else if (m_mag < 0.95) { imgTypeZh = "倒立縮小實像"; imgTypeEn = "Inverted Reduced Real"; }

              addStat('像距 <span class="math-text">v</span>', 'Img Dist <span class="math-text">v</span>', `${(v / F_LEN).toFixed(2)} f ${tr('(鏡後)', '(Back)')}`);
              addStat('放大率 <span class="math-text">m</span>', 'Mag <span class="math-text">m</span>', `${m_mag.toFixed(2)} ${tr('倍', 'x')}`);
              addStat('成像性質', 'Image Type', `<span style="color:#ff8040">${tr(imgTypeZh, imgTypeEn)}</span>`);
            } else {
              // 虛像區 (u < f)
              const v = (u * F_LEN) / (F_LEN - u); // 正值表示鏡前
              const m_mag = v / u;
              const img_x = CX - v; 
              const img_top_y = CY - OBJ_H * m_mag;

              drawLayer.appendChild(createSvgEl('line', { x1: obj_x, y1: obj_top_y, x2: CX, y2: obj_top_y, stroke: '#ff8040', 'stroke-width': 3 }));
              const slope1 = (CY - obj_top_y) / F_LEN;
              drawRay(drawLayer, CX, obj_top_y, V_WIDTH - 20, obj_top_y + slope1 * (V_WIDTH - 20 - CX), '#ff8040', 3, false, true);
              drawLayer.appendChild(createSvgEl('line', { x1: CX, y1: obj_top_y, x2: Math.max(20, img_x), y2: obj_top_y + slope1 * (Math.max(20, img_x) - CX), stroke: '#4dd2ff', 'stroke-width': 2, 'stroke-dasharray': '6 6' }));

              const slope2 = (CY - obj_top_y) / (CX - obj_x);
              drawRay(drawLayer, obj_x, obj_top_y, V_WIDTH - 20, CY + slope2 * (V_WIDTH - 20 - CX), '#33cc99', 3, false, true);
              drawLayer.appendChild(createSvgEl('line', { x1: obj_x, y1: obj_top_y, x2: Math.max(20, img_x), y2: CY + slope2 * (Math.max(20, img_x) - CX), stroke: '#4dd2ff', 'stroke-width': 2, 'stroke-dasharray': '6 6' }));

              if (img_x > 40) {
                drawLayer.appendChild(createSvgEl('line', { x1: img_x, y1: CY, x2: img_x, y2: img_top_y, stroke: '#4dd2ff', 'stroke-width': 4, 'stroke-dasharray': '5 3' }));
                drawLayer.appendChild(createSvgEl('polygon', { points: `${img_x},${img_top_y-8} ${img_x-6},${img_top_y+2} ${img_x+6},${img_top_y+2}`, fill: '#4dd2ff' }));
                addText(drawLayer, img_x, img_top_y - 15, tr('放大虛像', 'Virtual Image'), 'middle', '#4dd2ff', 18, 'bold');
              }

              addStat('像距 <span class="math-text">v</span>', 'Img Dist <span class="math-text">v</span>', `${(v / F_LEN).toFixed(2)} f ${tr('(鏡前)', '(Front)')}`);
              addStat('放大率 <span class="math-text">m</span>', 'Mag <span class="math-text">m</span>', `${m_mag.toFixed(2)} ${tr('倍', 'x')}`);
              addStat('成像性質', 'Image Type', `<span style="color:#ff8040">${tr('正立放大虛像', 'Upright Magnified Virtual')}</span>`);
            }

            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：凸透鏡的六大成像區塊</h3>
              <p>凸透鏡為會聚透鏡，成像變化多端，是考試的絕對重點！<br>
              請拉動上方滑桿，觀察物距與成像的關係：<br>
              當物距 <span class="math-eq">u > f</span> 時，在鏡後形成<b>倒立實像</b>，且「物近像遠像變大」。<br>
              當物距小於焦距 <span class="math-eq">u < f</span> 時，光線發散無法在鏡後交會，但在鏡前反向延伸會交會，化身為<b>放大鏡</b>，形成正立放大虛像！</p>
            `, `
              <h3>💡 Teacher's Analysis: 6 Imaging Zones of Convex Lens</h3>
              <p>Convex lenses converge light, creating versatile images that are heavily tested!<br>
              Drag the slider to observe:<br>
              When <span class="math-eq">u > f</span>, it forms an <b>inverted real image</b> behind the lens. As the object approaches f, the image moves further away and gets larger.<br>
              When <span class="math-eq">u < f</span>, refracted rays diverge but their backward extensions meet in front of the lens. It becomes a <b>magnifying glass</b>, forming an upright magnified virtual image!</p>
            `);
          }

        } else if (m === 'hyperopia' || m === 'myopia') {
          const power = params[m].power / 100; // 0 to 1
          const EYE_X = 650;
          const EYE_R = 140;
          const LENS_X = EYE_X - EYE_R + 10;
          const RETINA_X = EYE_X + EYE_R;
          const GLASSES_X = 250;

          drawLayer.appendChild(createSvgEl('line', { x1: 20, y1: CY, x2: V_WIDTH - 20, y2: CY, stroke: 'rgba(255,255,255,0.6)', 'stroke-width': 2 }));

          drawLayer.appendChild(createSvgEl('circle', { cx: EYE_X, cy: CY, r: EYE_R, fill: '#11261f', stroke: '#ffffff', 'stroke-width': 3 }));
          drawLayer.appendChild(createSvgEl('ellipse', { cx: LENS_X, cy: CY, rx: 20, ry: 65, fill: 'rgba(255,255,255,0.15)', stroke: '#4dd2ff', 'stroke-width': 2 }));

          drawLayer.appendChild(createSvgEl('path', { d: `M ${EYE_X},${CY-EYE_R} A ${EYE_R} ${EYE_R} 0 0 1 ${EYE_X},${CY+EYE_R}`, fill: 'none', stroke: '#ffe066', 'stroke-width': 6 }));
          addText(drawLayer, RETINA_X - 10, CY - EYE_R - 15, tr("視網膜 (成像目標)", "Retina (Target)"), 'end', '#ffe066', 20, 'bold');

          const beamY1 = CY - 40;
          const beamY2 = CY + 40;
          let focusX = 0;

          if (m === 'myopia') {
            focusX = (RETINA_X - 80) + 80 * power;
            if (power > 0) {
              drawLens(drawLayer, GLASSES_X, CY, 80, 10 + 10 * power, 'concave');
              addText(drawLayer, GLASSES_X, CY - 100, tr("凹透鏡 (先發散光線)", "Concave Lens (Diverges)"), 'middle', '#ffffff', 18, 'bold');
            }
          } else {
            focusX = (RETINA_X + 80) - 80 * power;
            if (power > 0) {
              drawLens(drawLayer, GLASSES_X, CY, 80, 10 + 10 * power, 'convex');
              addText(drawLayer, GLASSES_X, CY - 100, tr("凸透鏡 (先會聚光線)", "Convex Lens (Converges)"), 'middle', '#ffffff', 18, 'bold');
            }
          }

          if (power === 0) {
            drawRay(drawLayer, 20, beamY1, LENS_X, beamY1, '#ff8040', 3, false, false);
            drawRay(drawLayer, LENS_X, beamY1, focusX, CY, '#ff8040', 3, false, true);

            drawRay(drawLayer, 20, beamY2, LENS_X, beamY2, '#33cc99', 3, false, false);
            drawRay(drawLayer, LENS_X, beamY2, focusX, CY, '#33cc99', 3, false, true);
          } else {
            const rayColor = power > 0.95 ? '#4ade80' : '#6fa8f2';
            const offset = m === 'myopia' ? (16 * power) : -(16 * power);
            const lensY1 = beamY1 + offset;
            const lensY2 = beamY2 - offset;

            drawRay(drawLayer, 20, beamY1, GLASSES_X, beamY1, rayColor, 3, false, false);
            drawRay(drawLayer, GLASSES_X, beamY1, LENS_X, lensY1, rayColor, 3, false, false);
            drawRay(drawLayer, LENS_X, lensY1, focusX, CY, rayColor, 3, false, true);

            drawRay(drawLayer, 20, beamY2, GLASSES_X, beamY2, rayColor, 3, false, false);
            drawRay(drawLayer, GLASSES_X, beamY2, LENS_X, lensY2, rayColor, 3, false, false);
            drawRay(drawLayer, LENS_X, lensY2, focusX, CY, rayColor, 3, false, true);
          }

          const focusColor = power > 0.95 ? "#4ade80" : "#ff8040";
          drawLayer.appendChild(createSvgEl('circle', { cx: focusX, cy: CY, r: 8, fill: focusColor }));
          
          if (power > 0.95) {
            addText(drawLayer, RETINA_X - 60, CY + 175, tr("🎯 焦點精準落在視網膜上！(視力清晰)", "🎯 Focused perfectly on retina! (Clear vision)"), 'center', focusColor, 22, 'bold');
          } else if (m === 'myopia') {
            addText(drawLayer, focusX, CY + 50, tr("⚠️ 焦點在視網膜「前方」(遠處模糊)", "⚠️ Focused IN FRONT of retina (Blurry far)"), 'middle', focusColor, 20, 'bold');
          } else {
            addText(drawLayer, Math.min(V_WIDTH - 150, focusX), CY + 50, tr("⚠️ 焦點在視網膜「後方」(近處模糊)", "⚠️ Focused BEHIND retina (Blurry near)"), 'middle', focusColor, 20, 'bold');
          }

          if (m === 'myopia') {
            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：近視眼與凹透鏡矯正</h3>
              <p>眼球軸長過長或水晶體折射力太強，導致遠方光線過早會聚，聚焦在<b>「視網膜前方」</b>。<br>
              戴上<b>「凹透鏡（發散透鏡）」</b>後，光線會先被適度發散，即可將焦點順利往後推移，精準落在視網膜上！</p>
            `, `
              <h3>💡 Teacher's Analysis: Myopia & Concave Correction</h3>
              <p>If the eyeball is too long or the lens is too strong, distant rays converge too early, focusing <b>IN FRONT of the retina</b>.<br>
              Wearing a <b>"Concave Lens (Diverging)"</b> spreads the rays slightly before they enter the eye, pushing the focal point back perfectly onto the retina!</p>
            `);
          } else {
            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：遠視/老花眼與凸透鏡矯正</h3>
              <p>眼球軸長過短或水晶體聚焦力不足，導致近處光線來不及會聚，聚焦在<b>「視網膜後方」</b>。<br>
              配戴<b>「凸透鏡（會聚透鏡）」</b>幫忙把光線提前會聚，就能讓焦點前移回到視網膜上！</p>
            `, `
              <h3>💡 Teacher's Analysis: Hyperopia & Convex Correction</h3>
              <p>If the eyeball is too short or the lens is too weak, near rays don't converge fast enough, focusing <b>BEHIND the retina</b>.<br>
              Wearing a <b>"Convex Lens (Converging)"</b> helps converge the rays early, pulling the focal point forward perfectly onto the retina!</p>
            `);
          }
        }
      }

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          currentMode = e.currentTarget.dataset.mode;
          initUI();
        });
      });

      initUI();
      setLang('zh');
    })();
  </script>
</body>
</html>
