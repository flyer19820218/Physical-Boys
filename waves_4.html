<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title data-zh="聲音的三要素與共振" data-en="Sound: 3 Elements & Resonance">聲音的三要素與共振</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<style>
  :root {
    --bg-base: #111e19;
    --bg-panel: #172a23;
    --bg-panel-hover: #1f382f;
    --chalk-white: #ffffff;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-pink: #ff66b2;
    --rule-color: rgba(255, 255, 255, 0.25);
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
    background-color: var(--bg-base);
    color: var(--chalk-white);
    font-size: 20px; 
    padding-bottom: 50px;
  }

  /* 🌟 規範：右上角橫向懸浮雙語切換器 */
  .floating-lang-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 2px solid var(--chalk-teal);
    border-radius: 12px;
    background: rgba(17, 30, 25, 0.95);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(77, 210, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .lang-label {
    color: var(--chalk-teal);
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    font-weight: 700;
    user-select: none;
    margin-left: 4px;
  }
  .lang-options {
    display: flex;
    flex-direction: row;
    gap: 4px;
  }
  .lang-pill {
    min-width: 60px;
    min-height: 48px; /* 觸控防禦 */
    padding: 6px 12px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    background: transparent;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    touch-action: manipulation;
  }
  .lang-pill.active {
    background: var(--chalk-teal) !important;
    color: #0b1a15 !important;
    border-color: var(--chalk-teal) !important;
    box-shadow: 0 0 10px rgba(77, 210, 255, 0.5);
  }

  .wrap { max-width: 1080px; margin: 60px auto 20px; padding: 0 16px; }
  
  header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed var(--rule-color); padding-bottom: 16px; }
  h1 { font-size: 40px; margin: 0 0 10px 0; color: var(--chalk-yellow); letter-spacing: 2px; font-weight: 900; }
  header p { margin: 0; color: #e0e0e0; font-size: 20px; font-weight: bold; }

  /* 導覽列 */
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
  .tab-btn {
    flex: 1; min-width: 180px; min-height: 54px;
    padding: 12px 10px; font-size: 20px; font-weight: bold;
    background: rgba(255,255,255,0.08); color: #c0d0c8;
    border: 2px dashed var(--rule-color); border-radius: 10px;
    cursor: pointer; transition: all 0.2s; text-align: center;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .tab-btn:hover { background: var(--bg-panel-hover); color: #ffffff; }
  .tab-btn.active { background: #223e34; color: var(--chalk-yellow); border: 2px solid var(--chalk-yellow); box-shadow: 0 0 12px rgba(255, 224, 102, 0.3); }

  /* 面板 */
  .panel { background: var(--bg-panel); border: 2px solid var(--rule-color); border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px dashed var(--rule-color); padding-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  h2 { margin: 0; font-size: 28px; color: #ffffff; letter-spacing: 1px; }
  .sub-tag { font-size: 18px; color: #000000; padding: 6px 16px; border-radius: 999px; font-weight: 800; }

  /* 畫布防禦等比縮放 */
  #stage-container { width: 100%; border: 2px solid rgba(255,255,255,0.3); border-radius: 12px; overflow: hidden; background: #0c1612; box-shadow: inset 0 0 25px rgba(0,0,0,0.7); position: relative; margin-bottom: 20px; aspect-ratio: 1050 / 320; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  
  /* 控制區 */
  .interactive-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .slider-container { flex: 1; min-width: 300px; }
  .slider-label { font-size: 22px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  input[type=range] { width: 100%; height: 48px; cursor: pointer; accent-color: var(--chalk-yellow); }
  
  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
  button.tool-btn { min-height: 48px; padding: 10px 20px; border: 2px solid var(--chalk-teal); background: transparent; color: var(--chalk-teal); border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; touch-action: manipulation; }
  button.tool-btn:hover, button.tool-btn.active { background: var(--chalk-teal); color: #000; }

  .note { font-size: 20px; color: #ffffff; margin-top: 20px; line-height: 1.8; background: rgba(255,255,255,0.08); padding: 20px 24px; border-radius: 10px; border-left: 6px solid var(--chalk-yellow); }
  
  /* 結論特別區塊 */
  .conclusion-box { background: rgba(255, 128, 64, 0.15); border: 2px solid var(--chalk-coral); padding: 24px; margin-top: 24px; border-radius: 12px; box-shadow: 0 0 15px rgba(255,128,64,0.2); }
  .conclusion-box h3 { color: var(--chalk-coral); margin: 0 0 12px 0; font-size: 26px; display: flex; align-items: center; gap: 8px;}
  .conclusion-box p { margin: 0 0 10px 0; font-size: 22px; line-height: 1.6;}
  
  /* 發音體性質表格 */
  .prop-table { width: 100%; border-collapse: collapse; margin-top: 12px; background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; }
  .prop-table th, .prop-table td { padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
  .prop-table th { background: rgba(77, 210, 255, 0.2); color: var(--chalk-teal); font-size: 22px;}
  .prop-table td { font-size: 20px; font-weight: bold; }

  @media (max-width: 600px) {
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
      .prop-table th, .prop-table td { padding: 8px; font-size: 16px; }
  }
</style>
</head>
<body>

<!-- 🌟 雙語切換器 -->
<div class="floating-lang-container">
  <span class="lang-label">Language</span>
  <div class="lang-options">
    <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
    <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="wrap">
  <header>
    <h1 data-zh="聲音的世界：三要素與共振" data-en="World of Sound: 3 Elements & Resonance">聲音的世界：三要素與共振</h1>
    <p data-zh="國中自然科核心概念：響度、音調、音色、水杯考題與共振現象" data-en="Core Concepts: Loudness, Pitch, Timbre, Water Glass Quiz & Resonance">國中自然科核心概念：響度、音調、音色、水杯考題與共振現象</p>
  </header>

  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('tab1')">
        <span data-zh="一、響度" data-en="I. Loudness">一、響度</span>
    </div>
    <div class="tab-btn" onclick="switchTab('tab2')">
        <span data-zh="二、音調" data-en="II. Pitch">二、音調</span>
    </div>
    <div class="tab-btn" onclick="switchTab('tab3')">
        <span data-zh="三、音色" data-en="III. Timbre">三、音色</span>
    </div>
    <div class="tab-btn" onclick="switchTab('tab4')">
        <span data-zh="四、水杯魔王題" data-en="IV. Water Glass Quiz">四、水杯魔王題</span>
    </div>
    <div class="tab-btn" onclick="switchTab('tab5')">
        <span data-zh="五、共振現象" data-en="V. Resonance">五、共振現象</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">一、響度 (音量大小)</h2>
      <span id="panel-badge" class="sub-tag" style="background:#ffe066;">波的振幅</span>
    </div>

    <!-- 動畫畫布 -->
    <div id="stage-container">
      <canvas id="stage"></canvas>
    </div>

    <!-- 互動控制區 -->
    <div class="interactive-box" id="control-box">
      <!-- 內容由 JS 動態替換 -->
    </div>

    <!-- 結論區 (僅在 Tab 3 顯示) -->
    <div class="conclusion-box" id="conclusion-section" style="display:none;">
      <h3 data-zh="⚠️ 必考大結論：三要素互不影響！" data-en="⚠️ Exam Focus: The 3 Elements Are Independent!">⚠️ 必考大結論：三要素互不影響！</h3>
      <p><b data-zh="頻率改變了，振幅不一定會變；波形改變了，頻率也不一定會變。" data-en="Change in frequency doesn't change amplitude; change in waveform doesn't change frequency.">頻率改變了，振幅不一定會變；波形改變了，頻率也不一定會變。</b></p>
      <p style="color: var(--chalk-yellow);" data-zh="👉 <b>舉例：</b>鋼琴可以彈出很小聲的低音；小提琴也可以拉出很大聲的高音！" data-en="👉 <b>Ex:</b> A piano can play a very soft low note; a violin can play a very loud high note!">👉 <b>舉例：</b>鋼琴可以彈出很小聲的低音；小提琴也可以拉出很大聲的高音！</p>
    </div>

    <!-- 重點筆記區 -->
    <div class="note" id="note-text">
      <!-- 內容由 JS 動態替換 -->
    </div>
  </div>
</div>

<script>
  // ==========================================
  // 🌟 雙語切換系統 (預設繁中絕對防禦)
  // ==========================================
  let currentLang = 'zh';

  function tr(zh, en) {
      return currentLang === 'en' ? en : zh;
  }

  function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';

      // 按鈕視覺切換
      document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

      // 替換所有具備 data-zh / data-en 的靜態 HTML
      document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.innerHTML = el.getAttribute(`data-${lang}`);
      });
      
      // 重新渲染動態注入的 UI
      renderUIForTab();
  }

  // ==========================================
  // 物理繪圖引擎 (100% 絕對鎖死)
  // ==========================================
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  const V_WIDTH = 1050;
  const V_HEIGHT = 320;
  
  let currentTab = 'tab1';
  let aniFrame;
  let time = 0;

  // 物理參數狀態 (Tab 1~3)
  let waveAmp = 50;
  let waveFreq = 2;
  let waveType = 'sine';
  
  // Tab 4 (水杯) 狀態
  let waterAction = 'none'; // 'none', 'knock', 'blow'
  
  // Tab 5 (共振) 狀態
  let forkVibrating = false;
  let forkTime = 0;

  function initCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = V_WIDTH * dpr;
    canvas.height = V_HEIGHT * dpr;
    ctx.scale(dpr, dpr);
  }

  function updateAmp(val) {
    waveAmp = parseInt(val);
    const ampValEl = document.getElementById('amp-val');
    if (ampValEl) ampValEl.innerText = (waveAmp * 1.2).toFixed(0) + ' dB';
  }

  function updateFreq(val) {
    waveFreq = parseFloat(val);
    const freqValEl = document.getElementById('freq-val');
    if (freqValEl) freqValEl.innerText = (waveFreq * 100).toFixed(0) + ' Hz';
  }

  function updateTimbre(type, btn) {
    waveType = type;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setWaterAction(action, btn) {
    waterAction = action;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    time = 0; // 重置動畫時間
  }

  function triggerResonance() {
    forkVibrating = true;
    forkTime = 0;
  }

  function switchTab(tab) {
    currentTab = tab;
    cancelAnimationFrame(aniFrame);
    time = 0;
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
    
    renderUIForTab();
  }

  function renderUIForTab() {
    const title = document.getElementById('panel-title');
    const badge = document.getElementById('panel-badge');
    const note = document.getElementById('note-text');
    const control = document.getElementById('control-box');
    const conclusion = document.getElementById('conclusion-section');
    
    conclusion.style.display = 'none';
    control.style.display = 'flex';

    if (currentTab === 'tab1') {
      title.textContent = tr('一、響度 (聲音的大小/音量)', 'I. Loudness (Volume)');
      badge.textContent = tr('振幅決定', 'Determined by Amplitude');
      badge.style.background = '#ffe066';
      
      waveAmp = 50; waveFreq = 2; waveType = 'sine';

      control.innerHTML = `
        <div class="slider-container">
          <div class="slider-label"><span>${tr('調整用力程度 (振幅)：', 'Adjust Force (Amplitude):')}</span> <span id="amp-val" style="color:var(--chalk-yellow); font-family: 'Courier New', monospace;">60 dB</span></div>
          <input type="range" min="10" max="100" value="50" oninput="updateAmp(this.value)">
        </div>
      `;
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>決定因素：</b>由聲波的 <b>振幅</b> 決定。敲擊的力量越大，振幅越大，聲音就越大。<br>
        • <b>測量單位：</b><b>分貝 (dB)</b>。<br>
        • <b>生活常識：</b>0 分貝是人耳能聽見的最小音量。分貝數每增加 10，聲音能量會增加 10 倍。`,
        
        `💡 <b>Blackboard Notes:</b><br>
        • <b>Determining Factor:</b> Determined by wave's <b>Amplitude</b>. Harder strike = larger amplitude = louder sound.<br>
        • <b>Unit:</b> <b>Decibel (dB)</b>.<br>
        • <b>Fact:</b> 0 dB is the minimum sound humans can hear. Every 10 dB increase multiplies sound energy by 10.`
      );
      
      animateWave();
    } 
    else if (currentTab === 'tab2') {
      title.textContent = tr('二、音調 (聲音的高低)', 'II. Pitch (High/Low Sound)');
      badge.textContent = tr('頻率決定', 'Determined by Frequency');
      badge.style.background = '#4dd2ff';
      
      waveAmp = 40; waveFreq = 2; waveType = 'sine';

      control.innerHTML = `
        <div class="slider-container">
          <div class="slider-label"><span>${tr('調整震動快慢 (頻率)：', 'Adjust Vibration Speed (Freq):')}</span> <span id="freq-val" style="color:var(--chalk-teal); font-family: 'Courier New', monospace;">200 Hz</span></div>
          <input type="range" min="1" max="6" value="2" step="0.5" oninput="updateFreq(this.value)">
        </div>
      `;
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>決定因素：</b>由聲波的 <b>頻率</b> 決定。物體震動越快，頻率越大，音調就越高。<br>
        • <b>測量單位：</b><b>赫茲 (Hz)</b> (每秒震動的次數)。<br>
        • <b>發音體的性質規律：</b>
        <table class="prop-table">
          <tr>
            <th>狀態</th><th>物體特性</th><th>震動難易</th><th>頻率</th><th>音調</th>
          </tr>
          <tr>
            <td><b style="color:var(--chalk-coral)">輕、薄、短、小、細、緊</b></td>
            <td>質量小</td><td>容易震動</td><td>高</td><td><b style="color:var(--chalk-coral)">高音</b></td>
          </tr>
          <tr>
            <td><b style="color:var(--chalk-teal)">重、厚、長、大、粗、鬆</b></td>
            <td>質量大</td><td>不易震動</td><td>低</td><td><b style="color:var(--chalk-teal)">低音</b></td>
          </tr>
        </table>`,
        
        `💡 <b>Blackboard Notes:</b><br>
        • <b>Determining Factor:</b> Determined by wave's <b>Frequency</b>. Faster vibration = higher frequency = higher pitch.<br>
        • <b>Unit:</b> <b>Hertz (Hz)</b> (Vibrations per sec).<br>
        • <b>Properties of Sounding Bodies:</b>
        <table class="prop-table">
          <tr>
            <th>State</th><th>Property</th><th>Vibration</th><th>Freq</th><th>Pitch</th>
          </tr>
          <tr>
            <td><b style="color:var(--chalk-coral)">Light, Thin, Short, Small, Tight</b></td>
            <td>Low Mass</td><td>Easy</td><td>High</td><td><b style="color:var(--chalk-coral)">High</b></td>
          </tr>
          <tr>
            <td><b style="color:var(--chalk-teal)">Heavy, Thick, Long, Large, Loose</b></td>
            <td>High Mass</td><td>Hard</td><td>Low</td><td><b style="color:var(--chalk-teal)">Low</b></td>
          </tr>
        </table>`
      );
      animateWave();
    }
    else if (currentTab === 'tab3') {
      title.textContent = tr('三、音色 (發音體的特色)', 'III. Timbre (Sound Quality)');
      badge.textContent = tr('波形決定', 'Determined by Waveform');
      badge.style.background = '#ff8040';
      
      waveAmp = 50; waveFreq = 2.5; waveType = 'sine';

      control.innerHTML = `
        <div class="slider-label" style="width:100%; text-align:center;">${tr('切換不同樂器的波形 (相同音量與音調下)：', 'Switch instrument waveforms (At same volume & pitch):')}</div>
        <div class="btn-group">
          <button class="tool-btn active" onclick="updateTimbre('sine', this)">${tr('音叉 (單一頻率)', 'Tuning Fork (Pure)')}</button>
          <button class="tool-btn" onclick="updateTimbre('piano', this)">${tr('鋼琴', 'Piano')}</button>
          <button class="tool-btn" onclick="updateTimbre('violin', this)">${tr('小提琴', 'Violin')}</button>
        </div>
      `;
      
      conclusion.style.display = 'block';

      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>決定因素：</b>由聲波的 <b>波形</b> 決定。<br>
        • <b>辨識功能：</b>就算不同樂器發出相同大小聲 (響度同)、相同音階 (音調同) 的聲音，我們還是能分辨出是哪種樂器，這就是因為「音色 (波形)」不同！<br>
        • 音叉發出的是最單純的波，稱為「純音」。大多數樂器發出的都是複合波。`,
        
        `💡 <b>Blackboard Notes:</b><br>
        • <b>Determining Factor:</b> Determined by <b>Waveform</b>.<br>
        • <b>Identification:</b> Even if instruments play the same volume (Loudness) and note (Pitch), we can tell them apart because their "Timbre (Waveform)" is different!<br>
        • Tuning forks produce the purest wave, called "Pure Tone". Most instruments produce complex waves.`
      );
      animateWave();
    }
    else if (currentTab === 'tab4') {
      title.textContent = tr('四、經典魔王試題：水杯的敲與吹', 'IV. Classic Quiz: Knocking vs Blowing Water Glass');
      badge.textContent = tr('找對發音體！', 'Find the Sound Source!');
      badge.style.background = '#ff4d4d';
      waterAction = 'none';

      control.innerHTML = `
        <div class="slider-label" style="width:100%; text-align:center;">${tr('點擊觀察不同動作時的「發音體」是誰：', 'Click to observe the "Sound Source" for different actions:')}</div>
        <div class="btn-group">
          <button class="tool-btn" onclick="setWaterAction('knock', this)">🔨 ${tr('敲打杯身', 'Knock Glass')}</button>
          <button class="tool-btn" onclick="setWaterAction('blow', this)">💨 ${tr('吹氣(杯口)', 'Blow into Mouth')}</button>
        </div>
      `;
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>敲打杯子時：</b>發音體是 <b style="color:var(--chalk-teal)">「水 + 杯子」</b>。水越多，質量越大越難震動，音調越<b>低</b>。<br>
        • <b>對杯口吹氣時：</b>發音體是杯內的 <b style="color:var(--chalk-yellow)">「空氣柱」</b>。水越多，空氣柱越短，質量越小越容易震動，音調越<b>高</b>。<br>
        ⚠️ <b>解題秘訣：</b>先確認題目是「敲」還是「吹」，找出「發音體是誰」，再套用「輕薄短小細緊」的規則！`,
        
        `💡 <b>Blackboard Notes:</b><br>
        • <b>When Knocking:</b> Source is <b style="color:var(--chalk-teal)">"Water + Glass"</b>. More water = larger mass = harder to vibrate = <b>Lower</b> pitch.<br>
        • <b>When Blowing:</b> Source is the <b style="color:var(--chalk-yellow)">"Air Column"</b> inside. More water = shorter air column = smaller mass = easier to vibrate = <b>Higher</b> pitch.<br>
        ⚠️ <b>Quiz Tip:</b> First check if it's "Knock" or "Blow", find the "Sound Source", then apply the "Light/Short/Small" rules!`
      );
      animateWaterGlass();
    }
    else if (currentTab === 'tab5') {
      title.textContent = tr('五、共振 (共鳴) 現象', 'V. Resonance Phenomenon');
      badge.textContent = tr('頻率相同', 'Same Frequency');
      badge.style.background = '#33cc99';
      forkVibrating = false;

      control.innerHTML = `
        <div class="btn-group" style="width:100%;">
          <button class="tool-btn" style="border-color:var(--chalk-green); color:var(--chalk-green);" onclick="triggerResonance()">🔨 ${tr('敲擊左側音叉', 'Strike Left Tuning Fork')}</button>
        </div>
      `;
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>發生條件：</b>兩個發音體的 <b>自然頻率完全相同</b> 時，敲擊其中一個，另一個也會跟著震動發聲。<br>
        • <b>生活應用：</b>木吉他、提琴的木箱稱為「共鳴箱」，可以藉由共振加強聲音的響度 (變大聲)。<br>
        ⚠️ <b>考試注意：</b>共振的先決條件就是「頻率必須一樣」，大小聲(振幅)不一樣沒關係。`,
        
        `💡 <b>Blackboard Notes:</b><br>
        • <b>Condition:</b> When two sounding bodies have <b>exactly the same natural frequency</b>, striking one causes the other to vibrate and sound.<br>
        • <b>Daily Use:</b> The wooden body of guitars/violins is a "resonance box", amplifying the sound's Loudness through resonance.<br>
        ⚠️ <b>Exam Alert:</b> The prerequisite for resonance is "Same Frequency"; differing loudness (amplitude) doesn't matter.`
      );
      animateResonance();
    }
  }

  // ============== TAB 1~3: 波形繪製 ==============
  function drawWaveform(timeOffset, amp, freq, type, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    
    for (let x = 0; x < V_WIDTH; x++) {
      let angle = (x / V_WIDTH) * Math.PI * 2 * freq - timeOffset;
      let y = 0;
      if (type === 'sine') {
        y = Math.sin(angle);
      } else if (type === 'piano') {
        y = 0.7 * Math.sin(angle) + 0.3 * Math.sin(2 * angle - 0.5) + 0.1 * Math.cos(3 * angle);
      } else if (type === 'violin') {
        y = 0.6 * Math.sin(angle) - 0.3 * Math.sin(3 * angle) + 0.2 * Math.sin(5 * angle) - 0.1 * Math.cos(7 * angle);
      }
      let plotY = (V_HEIGHT / 2) - (y * amp);
      if (x === 0) ctx.moveTo(x, plotY); else ctx.lineTo(x, plotY);
    }
    ctx.stroke();
  }

  function animateWave() {
    if(currentTab !== 'tab1' && currentTab !== 'tab2' && currentTab !== 'tab3') return;
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    time += 0.08;

    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(0, V_HEIGHT / 2); ctx.lineTo(V_WIDTH, V_HEIGHT / 2); ctx.stroke();
    ctx.setLineDash([]);

    let waveColor = "#ffe066";
    if (currentTab === 'tab2') waveColor = "#4dd2ff";
    if (currentTab === 'tab3') waveColor = "#ff8040";

    drawWaveform(time, waveAmp, waveFreq, waveType, waveColor);

    ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; ctx.font = "20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(tr("靜止位置", "At Rest Position"), 15, V_HEIGHT / 2 - 10);

    if (currentTab === 'tab1') {
      let midX = V_WIDTH / 2;
      ctx.strokeStyle = "#ff8040"; ctx.beginPath(); ctx.moveTo(midX, V_HEIGHT / 2); ctx.lineTo(midX, V_HEIGHT / 2 - waveAmp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(midX - 5, V_HEIGHT / 2 - waveAmp + 5); ctx.lineTo(midX, V_HEIGHT / 2 - waveAmp); ctx.lineTo(midX + 5, V_HEIGHT / 2 - waveAmp + 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(midX - 5, V_HEIGHT / 2 - 5); ctx.lineTo(midX, V_HEIGHT / 2); ctx.lineTo(midX + 5, V_HEIGHT / 2 - 5); ctx.stroke();
      ctx.fillStyle = "#ff8040"; ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"; 
      ctx.fillText(tr("振幅", "Amp"), midX + 10, V_HEIGHT / 2 - waveAmp / 2 + 5);
    }
    
    if (currentTab === 'tab2') {
      ctx.fillStyle = "rgba(77, 210, 255, 0.8)"; ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(tr(`目前畫面中有 ${waveFreq} 個全波`, `Currently ${waveFreq} full waves on screen`), 15, 30);
    }
    aniFrame = requestAnimationFrame(animateWave);
  }

  // ============== TAB 4: 水杯魔王題 ==============
  function drawGlass(x, y, waterHeight, label) {
    const w = 80; const h = 150;
    // 畫水
    ctx.fillStyle = "rgba(77, 210, 255, 0.6)";
    ctx.fillRect(x, y + h - waterHeight, w, waterHeight);
    // 畫杯子外框
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y); ctx.stroke();
    // 標籤
    ctx.fillStyle = "#fff"; ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(label, x + w/2, y + h + 35);
    ctx.textAlign = "left"; // reset
  }

  function animateWaterGlass() {
    if(currentTab !== 'tab4') return;
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    time += 0.1;

    let g1_x = 250, g1_y = 80, g1_wLevel = 30; // 少水
    let g2_x = 700, g2_y = 80, g2_wLevel = 110; // 多水
    let g_h = 150, g_w = 80;

    drawGlass(g1_x, g1_y, g1_wLevel, tr("杯子 A (水少)", "Glass A (Less Water)"));
    drawGlass(g2_x, g2_y, g2_wLevel, tr("杯子 B (水多)", "Glass B (More Water)"));

    if (waterAction === 'knock') {
      // 敲擊動畫
      let hammerOffset = Math.sin(time*2)*10;
      ctx.font = "30px sans-serif";
      ctx.fillText("🔨", g1_x + g_w + 10 + hammerOffset, g1_y + g_h - 20);
      ctx.fillText("🔨", g2_x + g_w + 10 + hammerOffset, g2_y + g_h - 20);
      
      // 標示發音體
      ctx.fillStyle = "rgba(255, 224, 102, 0.3)";
      ctx.fillRect(g1_x-5, g1_y + g_h - g1_wLevel, g_w+10, g1_wLevel+5);
      ctx.fillRect(g2_x-5, g2_y + g_h - g2_wLevel, g_w+10, g2_wLevel+5);

      ctx.fillStyle = "#ffe066"; ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(tr("發音體：水+杯 (質量小)", "Source: Water+Glass (Low Mass)"), g1_x - 60, g1_y - 25);
      ctx.fillText(tr("發音體：水+杯 (質量大)", "Source: Water+Glass (High Mass)"), g2_x - 60, g2_y - 25);
      
      ctx.fillStyle = "#ff8040"; ctx.font = "bold 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(tr("👉 音調 高 (容易震動)", "👉 Pitch HIGH (Easy to Vibrate)"), g1_x - 40, g1_y + 280);
      ctx.fillText(tr("👉 音調 低 (難以震動)", "👉 Pitch LOW (Hard to Vibrate)"), g2_x - 40, g2_y + 280);
      
      if(Math.floor(time)%2===0) { ctx.font = "24px sans-serif"; ctx.fillText("🎵", g1_x-20, g1_y+50); ctx.fillText("🎵", g2_x-20, g2_y+50); }

    } else if (waterAction === 'blow') {
      // 吹氣動畫
      let windOffset = (time*30)%40;
      ctx.strokeStyle = "#4dd2ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(g1_x - 30 + windOffset, g1_y - 15); ctx.lineTo(g1_x + g_w + 10, g1_y - 15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g2_x - 30 + windOffset, g2_y - 15); ctx.lineTo(g2_x + g_w + 10, g2_y - 15); ctx.stroke();
      ctx.font = "30px sans-serif"; ctx.fillText("💨", g1_x - 60, g1_y - 5); ctx.fillText("💨", g2_x - 60, g2_y - 5);

      // 標示發音體
      let a1_h = g_h - g1_wLevel;
      let a2_h = g_h - g2_wLevel;
      ctx.fillStyle = "rgba(255, 128, 64, 0.4)";
      ctx.fillRect(g1_x+2, g1_y, g_w-4, a1_h);
      ctx.fillRect(g2_x+2, g2_y, g_w-4, a2_h);

      ctx.fillStyle = "#ff8040"; ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(tr("發音體：空氣柱 (長/重)", "Source: Air Column (Long/Heavy)"), g1_x - 60, g1_y - 50);
      ctx.fillText(tr("發音體：空氣柱 (短/輕)", "Source: Air Column (Short/Light)"), g2_x - 60, g2_y - 50);
      
      ctx.fillStyle = "#4dd2ff"; ctx.font = "bold 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(tr("👉 音調 低 (難以震動)", "👉 Pitch LOW (Hard to Vibrate)"), g1_x - 40, g1_y + 280);
      ctx.fillText(tr("👉 音調 高 (容易震動)", "👉 Pitch HIGH (Easy to Vibrate)"), g2_x - 40, g2_y + 280);
      
      if(Math.floor(time)%2===0) { ctx.font = "24px sans-serif"; ctx.fillText("🎵", g1_x+30, g1_y+20); ctx.fillText("🎵", g2_x+30, g2_y+20); }
    }

    aniFrame = requestAnimationFrame(animateWaterGlass);
  }

  // ============== TAB 5: 共振現象 ==============
  function drawTuningFork(x, y, isVibrating) {
    ctx.strokeStyle = "#c0d0c8"; ctx.lineWidth = 8; ctx.lineJoin = 'round';
    
    let spread = 20;
    if (isVibrating) {
      spread = 20 + Math.sin(forkTime * 20) * 3;
    }

    // 🌟 物理引擎鎖定不變
    ctx.beginPath();
    ctx.moveTo(x - spread, y - 60); ctx.lineTo(x - spread, y);
    ctx.arc(x, y, spread, Math.PI, 0, true);
    ctx.lineTo(x + spread, y - 60); ctx.stroke();
    
    ctx.beginPath(); ctx.moveTo(x, y + spread); ctx.lineTo(x, y + spread + 40); ctx.stroke();
    
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(x - 40, y + spread + 40, 80, 50);
    ctx.strokeStyle = "#5c3a21"; ctx.lineWidth=2; ctx.strokeRect(x - 40, y + spread + 40, 80, 50);
    ctx.beginPath(); ctx.arc(x+20, y + spread + 65, 10, 0, Math.PI*2); ctx.fillStyle="#000"; ctx.fill();
  }

  function animateResonance() {
    if(currentTab !== 'tab5') return;
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    
    let f1_x = 250, f1_y = 150;
    let f2_x = 750, f2_y = 150;

    if (forkVibrating) {
      forkTime += 0.05;
      
      drawTuningFork(f1_x, f1_y, true);
      
      let waveDist = (forkTime * 200) % 600;
      if (waveDist < (f2_x - f1_x)) {
        ctx.strokeStyle = "rgba(51, 204, 153, 0.6)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f1_x, f1_y-30, waveDist, -Math.PI/4, Math.PI/4); ctx.stroke();
        if(waveDist>40) { ctx.beginPath(); ctx.arc(f1_x, f1_y-30, waveDist-40, -Math.PI/4, Math.PI/4); ctx.stroke(); }
        
        drawTuningFork(f2_x, f2_y, false);
      } else {
        drawTuningFork(f2_x, f2_y, true);
        
        ctx.fillStyle = "#ffe066"; ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.fillText(tr("✨ 吸收能量，產生共振！", "✨ Absorbs energy, creates Resonance!"), f2_x - 120, f2_y - 90);
        ctx.font = "30px sans-serif";
        ctx.fillText("🎵", f2_x - 30, f2_y - 120 + Math.sin(forkTime*10)*10);
        ctx.fillText("🎵", f2_x + 10, f2_y - 100 + Math.sin(forkTime*10+2)*10);
      }
      
      if (forkTime < 0.2) {
        ctx.font = "40px sans-serif";
        ctx.fillText("🔨", f1_x - 70 + (forkTime*100), f1_y - 30);
      }
    } else {
      drawTuningFork(f1_x, f1_y, false);
      drawTuningFork(f2_x, f2_y, false);
    }

    ctx.fillStyle = "#fff"; ctx.font = "20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"; ctx.textAlign="center";
    ctx.fillText(tr("音叉 A (256 Hz)", "Tuning Fork A (256 Hz)"), f1_x, f1_y + 140);
    ctx.fillText(tr("音叉 B (256 Hz)", "Tuning Fork B (256 Hz)"), f2_x, f2_y + 140);
    
    ctx.fillStyle = "#33cc99"; ctx.font = "bold 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    // 🌟 改到畫布最上方，降低認知負荷與排版擠壓
    ctx.fillText(tr("兩者自然頻率相同，符合共振條件", "Identical natural freq matches resonance condition"), V_WIDTH/2, 45);
    ctx.textAlign="left";

    aniFrame = requestAnimationFrame(animateResonance);
  }

  // Init
  initCanvas();
  window.addEventListener('resize', initCanvas);
  setLang('zh'); // Initialize UI

</script>
