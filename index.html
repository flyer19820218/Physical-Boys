<!doctype html>
<!--
  伽利略星球：網站首頁（3D 星球）。
  ★ 新增或修改課程卡片，請改 index_classic.html（舊版清單），然後在專案根目錄執行
      python3 tools/museum/build_lessons.py
    產生 assets/museum/data/lessons.json，星球上才會出現新的課。這個檔案本身不放課程清單。
  交接說明：galileo-planet/HANDOFF.md
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16241f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="伽利略星球">
<meta name="description" content="伽利略星球：用手轉動一顆小行星，走進物理、化學、地科、生物四座館，逛完所有自然科學互動課程。">
<title>伽利略星球｜自然科學</title>
<link rel="stylesheet" href="assets/museum/museum.css?v=202610280503">
</head>
<body class="booting">
<div id="app">
  <canvas id="scene" aria-hidden="true"></canvas>

  <header id="topbar">
    <button id="btnBack" class="fab" type="button" hidden aria-label="回星球" title="回星球 Back to planet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5S14.600 18.100 12 20.500C9.400 18.100 8.100 15.300 8.100 12S9.400 5.900 12 3.500Z"/></svg>
    </button>
    <div class="spacer"></div>
    <button id="btnSearch" class="fab" type="button" hidden aria-label="搜尋課程" title="搜尋課程 Search" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.500 4.500"/></svg>
    </button>
    <div id="langSwitch" class="lang" role="group" aria-label="Language 語言">
      <button type="button" data-lang="zh" class="active" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a id="linkClassic" class="fab classic" href="index_classic.html" title="舊版清單 Classic list" aria-label="舊版清單">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.500 6.500H20"/><path d="M8.500 12H20"/><path d="M8.500 17.500H20"/><path d="M4 6.500h.01"/><path d="M4 12h.01"/><path d="M4 17.500h.01"/></svg>
      <span class="classic-text">舊版清單</span>
    </a>
  </header>

  <section id="intro" aria-live="polite">
    <h1 id="introTitle">伽利略星球</h1>
    <p id="introSub">Galileo Planet</p>
  </section>
  <p id="hint" role="status"></p>

  <div id="plates" aria-label="四座館"></div>
  <div id="focusLabel" hidden></div>

  <section id="sheet" hidden aria-label="課程簡介">
    <button id="sheetHandle" class="sheet-handle" type="button" aria-expanded="true">
      <span class="grip" aria-hidden="true"></span>
      <span id="sheetTitle" class="sheet-title"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <nav id="chips" class="chips" aria-label="單元"></nav>
    <div class="cards-wrap">
      <button id="cardPrev" class="arrow prev" type="button" aria-label="上一張">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div id="cards" class="cards" tabindex="0"></div>
      <button id="cardNext" class="arrow next" type="button" aria-label="下一張">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <section id="searchPanel" hidden aria-label="搜尋課程">
    <input id="searchInput" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <ul id="searchResults"></ul>
  </section>

  <section id="sciCard" hidden role="dialog" aria-modal="true" aria-labelledby="sciName">
    <div class="sci-box">
      <button id="sciClose" class="fab sci-close" type="button" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <p id="sciKicker" class="sci-kicker"></p>
      <h2 id="sciName"></h2>
      <p id="sciYears" class="sci-years"></p>
      <p id="sciRole" class="sci-role"></p>
      <p id="sciText" class="sci-text"></p>
    </div>
  </section>

  <section id="launch" hidden role="dialog" aria-modal="true">
    <canvas aria-hidden="true"></canvas>
    <div class="launch-text">
      <h1 class="launch-title"><span class="l1">歡迎搭乘光速太空梭</span><span class="l2">來到<b>伽利略星球</b></span></h1>
      <p class="launch-status"><span class="st">引擎啟動中</span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
      <button id="launchGo" type="button" hidden>🚀 出發！</button>
    </div>
    <div class="warp-ui" aria-hidden="true">
      <p class="warp-cap"><span class="cap-t">太空梭目前正穿越蟲洞</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
    </div>
    <button id="launchSkip" type="button">跳過</button>
  </section>

  <div id="narration" hidden aria-live="polite"><p></p></div>

  <div id="notice" hidden role="status"></div>
  <div id="debug" hidden></div>
</div>
<noscript><p style="color:#f6f3ea;padding:24px;font:22px sans-serif">這個頁面需要 JavaScript。請改用<a href="index_classic.html" style="color:#f2d675">舊版清單</a>。</p></noscript>
<script type="module" src="assets/museum/museum_v1.js?v=202610280503"></script>
</body>
</html>
