<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理小遊戲目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #16241f;
    --bg-panel: #1e2f27;
    --bg-panel-hover: #24382f;
    --chalk-white: #f6f3ea;
    --chalk-muted: #9fb0a8;
    --chalk-yellow: #f2d675;
    --chalk-teal: #7fc8c4;
    --chalk-coral: #f0955c;
    --rule-color: rgba(246, 243, 234, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-base);
    background-image:
      radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 3px;
    color: var(--chalk-white);
    font-family: 'Noto Sans TC', sans-serif;
    line-height: 1.6;
    padding: 0 0 80px;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 56px 24px 0;
  }

  header.hero {
    text-align: center;
    padding-bottom: 28px;
    border-bottom: 2px dashed var(--rule-color);
  }

  .eyebrow {
    display: inline-block;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--chalk-muted);
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(38px, 7vw, 58px);
    margin: 0 0 12px;
    color: var(--chalk-white);
    text-shadow: 0 0 18px rgba(246, 243, 234, 0.12);
  }

  .hero p {
    color: var(--chalk-muted);
    font-size: 15px;
    margin: 0;
  }

  /* chalk sine-wave divider */
  .wave-divider {
    display: block;
    width: 100%;
    height: 44px;
    margin: 48px 0 40px;
    overflow: hidden;
  }
  .wave-divider path {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw-wave 1.8s ease-out forwards;
  }
  @keyframes draw-wave {
    to { stroke-dashoffset: 0; }
  }

  section.category {
    margin-bottom: 8px;
  }

  .cat-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .cat-icon {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
  }

  h2 {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .cat-count {
    font-size: 12px;
    color: var(--chalk-muted);
    font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid var(--rule-color);
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: auto;
  }

  .cards {
    list-style: none;
    margin: 0 0 52px;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .cards li {
    opacity: 0;
    animation: rise 0.5s ease-out forwards;
  }
  .cards li:nth-child(1) { animation-delay: 0.05s; }
  .cards li:nth-child(2) { animation-delay: 0.12s; }
  .cards li:nth-child(3) { animation-delay: 0.19s; }
  .cards li:nth-child(4) { animation-delay: 0.26s; }
  .cards li:nth-child(5) { animation-delay: 0.33s; }
  .cards li:nth-child(6) { animation-delay: 0.40s; }
  .cards li:nth-child(7) { animation-delay: 0.47s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    display: block;
    height: 100%;
    background: var(--bg-panel);
    border: 1.5px dashed var(--rule-color);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--chalk-white);
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .card:hover {
    background: var(--bg-panel-hover);
    transform: translateY(-2px);
  }

  .card-title {
    font-family: 'Kalam', cursive;
    font-size: 18px;
    font-weight: 700;
    display: inline-block;
    position: relative;
  }

  .card-title::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 0;
    height: 2px;
    background: currentColor;
    transition: width 0.25s ease;
  }
  .card:hover .card-title::after { width: 100%; }

  .optics .card-title { color: var(--chalk-yellow); }
  .waves .card-title { color: var(--chalk-teal); }
  .electricity .card-title { color: var(--chalk-coral); }

  .optics .cat-head h2 { color: var(--chalk-yellow); }
  .waves .cat-head h2 { color: var(--chalk-teal); }
  .electricity .cat-head h2 { color: var(--chalk-coral); }

  .card-thumb {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin-top: 12px;
    border: 1px solid var(--rule-color);
  }

  footer {
    text-align: center;
    color: var(--chalk-muted);
    font-size: 13px;
    padding-top: 20px;
    border-top: 2px dashed var(--rule-color);
  }

  @media (prefers-reduced-motion: reduce) {
    .cards li, .wave-divider path {
      animation: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
    }
  }

  @media (max-width: 480px) {
    .wrap { padding: 40px 16px 0; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="eyebrow">Physics Lab Notes</span>
    <h1>物理小遊戲目錄</h1>
    <p>用眼睛看、用手玩，把抽象的物理現象變成看得見的東西</p>
  </header>

  <svg class="wave-divider" viewBox="0 0 800 44" preserveAspectRatio="none" style="color: var(--chalk-yellow);">
    <path d="M0,22 C 40,2 80,42 120,22 C 160,2 200,42 240,22 C 280,2 320,42 360,22 C 400,2 440,42 480,22 C 520,2 560,42 600,22 C 640,2 680,42 720,22 C 760,2 800,42 800,22" stroke="currentColor"/>
  </svg>

  <section class="category optics">
    <div class="cat-head">
      <svg class="cat-icon" viewBox="0 0 34 34" fill="none" stroke="var(--chalk-yellow)" stroke-width="2">
        <ellipse cx="17" cy="17" rx="7" ry="12"/>
        <line x1="2" y1="17" x2="10" y2="17"/>
        <line x1="24" y1="17" x2="32" y2="17"/>
      </svg>
      <h2>互動小遊戲</h2>
      <span class="cat-count">3 個</span>
    </div>
    <ul class="cards">
      <li>
        <a class="card" href="https://flyer19820218.github.io/Physical-Boys/concavelens/concavelens.html" target="_blank">
          <span class="card-title">凹透鏡互動</span>
        </a>
      </li>
      <li>
        <a class="card" href="convexlens/" target="_blank">
          <span class="card-title">凸透鏡互動</span>
        </a>
      </li>
      <li>
        <a class="card" href="電梯體重計互動HTML版_大頭體重計版/" target="_blank">
          <span class="card-title">電梯體重計互動版</span>
        </a>
      </li>
    </ul>
  </section>

  <svg class="wave-divider" viewBox="0 0 800 44" preserveAspectRatio="none" style="color: var(--chalk-teal);">
    <path d="M0,22 C 40,2 80,42 120,22 C 160,2 200,42 240,22 C 280,2 320,42 360,22 C 400,2 440,42 480,22 C 520,2 560,42 600,22 C 640,2 680,42 720,22 C 760,2 800,42 800,22" stroke="currentColor"/>
  </svg>

  <section class="category waves">
    <div class="cat-head">
      <svg class="cat-icon" viewBox="0 0 34 34" fill="none" stroke="var(--chalk-teal)" stroke-width="2">
        <path d="M2,20 C 7,10 11,30 16,20 C 21,10 25,30 30,20" stroke-linecap="round"/>
      </svg>
      <h2>GIF 示範動畫（波、熱與其他）</h2>
      <span class="cat-count">7 個</span>
    </div>
    <ul class="cards">
      <li>
        <a class="card" href="縱波.gif" target="_blank">
          <span class="card-title">縱波</span>
        </a>
      </li>
      <li>
        <a class="card" href="橫波.gif" target="_blank">
          <span class="card-title">橫波</span>
        </a>
      </li>
      <li>
        <a class="card" href="真實聲波.gif" target="_blank">
          <span class="card-title">真實聲波</span>
        </a>
      </li>
      <li>
        <a class="card" href="回聲漫射.gif" target="_blank">
          <span class="card-title">回聲漫射</span>
        </a>
      </li>
      <li>
        <a class="card" href="垂直毛細滲流動畫.gif" target="_blank">
          <span class="card-title">垂直色層分析</span>
        </a>
      </li>
      <li>
        <a class="card" href="水的對流.gif" target="_blank">
          <span class="card-title">水的對流</span>
        </a>
      </li>
      <li>
        <a class="card" href="回聲變小聲方向改變.gif" target="_blank">
          <span class="card-title">回聲特性</span>
        </a>
      </li>
    </ul>
  </section>

  <svg class="wave-divider" viewBox="0 0 800 44" preserveAspectRatio="none" style="color: var(--chalk-coral);">
    <path d="M0,22 C 40,2 80,42 120,22 C 160,2 200,42 240,22 C 280,2 320,42 360,22 C 400,2 440,42 480,22 C 520,2 560,42 600,22 C 640,2 680,42 720,22 C 760,2 800,42 800,22" stroke="currentColor"/>
  </svg>

  <section class="category electricity">
    <div class="cat-head">
      <svg class="cat-icon" viewBox="0 0 34 34" fill="none" stroke="var(--chalk-coral)" stroke-width="2">
        <path d="M17,3 L8,19 L15,19 L12,31 L26,13 L18,13 Z" stroke-linejoin="round"/>
      </svg>
      <h2>電學 GIF 示範動畫</h2>
      <span class="cat-count">4 個</span>
    </div>
    <ul class="cards">
      <li>
        <a class="card" href="electricity/gifs/同時並聯與串聯.gif" target="_blank">
          <span class="card-title">同時並聯與串聯</span>
          <img class="card-thumb" src="同時並聯與串聯.gif" alt="同時並聯與串聯動畫">
        </a>
      </li>
      <li>
        <a class="card" href="燈泡的並聯與串聯.gif" target="_blank">
          <span class="card-title">燈泡的並聯與串聯</span>
          <img class="card-thumb" src="燈泡的並聯與串聯.gif" alt="燈泡的並聯與串聯動畫">
        </a>
      </li>
      <li>
        <a class="card" href="電子流.gif" target="_blank">
          <span class="card-title">電子流</span>
          <img class="card-thumb" src="電子流.gif" alt="電子流動畫">
        </a>
      </li>
      <li>
        <a class="card" href="電池串聯和並聯的差異.gif" target="_blank">
          <span class="card-title">電池串聯和並聯的差異</span>
          <img class="card-thumb" src="電池串聯和並聯的差異.gif" alt="電池串聯和並聯的差異動畫">
        </a>
      </li>
    </ul>
  </section>

  <footer>
    整理給喜歡動手玩物理的你
  </footer>

</div>
</body>
</html>
