<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化學反應與平衡：飽和食鹽水 3D 動態平衡 (名師教學旗艦版)</title>
    <style>
        /* 採用高辨識度字體綁定 */
        @import url('https://fonts.googleapis.com/css2?family=Verdana:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');

        /* 黑板視覺與零黑色原則 */
        body {
            background-color: #11261f;
            color: #FFFFFF;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 20px;
            margin: 0;
            padding: 30px;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 1200px;
            overflow-x: auto;
        }

        * {
            box-sizing: border-box;
            border-color: #FFFFFF;
        }

        .header-container {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #7CFC00;
            width: 100%;
            max-width: 1100px;
        }

        .header-container h1 {
            font-size: 34px; 
            color: #00FFFF;
            margin: 0;
            letter-spacing: 2px;
        }

        /* 戰術儀表板 */
        .dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #16332a;
            border: 2px solid #00FFFF;
            border-radius: 12px;
            padding: 15px 30px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.15);
        }

        .legend {
            display: flex;
            gap: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .legend-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .math-text {
            font-family: 'JetBrains Mono', Verdana, monospace;
        }

        /* 狀態指示燈 */
        .status-box {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            border: 2px dashed;
            transition: all 0.3s;
        }

        .status-dissolving {
            border-color: #FFA500;
            background-color: rgba(255, 165, 0, 0.15);
            color: #FFA500;
        }

        .status-equilibrium {
            border-color: #7CFC00;
            background-color: rgba(124, 252, 0, 0.15);
            color: #7CFC00;
            box-shadow: 0 0 15px rgba(124, 252, 0, 0.4);
        }

        /* 按鈕樣式控制列 */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .action-btn {
            background-color: #11261f;
            color: #FFFFFF;
            border: 2px solid #00FFFF;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .action-btn:hover { 
            background-color: #00FFFF; 
            color: #11261f; 
        }
        
        /* 平衡按鈕專屬樣式 */
        .equilibrium-btn {
            border-color: #7CFC00;
            color: #7CFC00;
        }
        .equilibrium-btn:hover {
            background-color: #7CFC00;
            color: #11261f;
        }

        /* Canvas 容器 */
        .canvas-container {
            width: 100%;
            max-width: 1100px;
            background-color: #0b1813;
            border: 2px dashed #FFA500;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 600px;
            cursor: grab;
        }

        canvas:active { cursor: grabbing; }

        .hint {
            color: #9fb0a8;
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🧪戰術模擬中心：飽和食鹽水 動態平衡</h1>
    </div>

    <!-- 戰術儀表板 -->
    <div class="dashboard">
        <div class="legend">
            <div class="legend-item">
                <span style="color: #00FFFF; font-size: 28px;">●</span> 
                <span class="math-text" style="color: #00FFFF;">Na⁺</span>
            </div>
            <div class="legend-item">
                <span style="color: #7CFC00; font-size: 28px;">●</span> 
                <span class="math-text" style="color: #7CFC00;">Cl⁻</span>
            </div>
            <div class="legend-item">
                <span style="color: #FF69B4; font-size: 28px;">●</span> 
                <span class="math-text" style="color: #FF69B4;">H₂O</span>
            </div>
        </div>
        
        <div style="font-size: 24px; font-weight: bold;">
            水合離子對：<span id="ionCountDisplay" class="math-text" style="color: #FFFFFF; font-size: 28px;">0</span> <span style="color: #9fb0a8;">/ 15</span>
        </div>

        <div id="systemStatus" class="status-box status-dissolving">
            🔄 溶液未飽和，持續溶解中...
        </div>
    </div>

    <div class="controls">
        <!-- 核心功能按鈕：瞬間平衡 (已修正錯字) -->
        <button class="action-btn equilibrium-btn" onclick="triggerInstantEquilibrium()">⚖️ 直達平衡狀態 (教學戰術)</button>
        <button class="action-btn" onclick="togglePause()" style="border-color: #FFFF00; color: #FFFF00;">⏸️ 暫停 / 播放畫面</button>
        <button class="action-btn" onclick="toggleAutoRotate()" style="border-color: #FF69B4; color: #FF69B4;">🌀 旋轉視角 ON/OFF</button>
        <button class="action-btn" onclick="resetSim()" style="border-color: #9fb0a8; color: #9fb0a8;">🔄 重新結晶</button>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas" width="1100" height="600"></canvas>
    </div>
    
    <div class="hint">💡 教學提示：用滑鼠或手指在畫布內拖曳可自由旋轉 3D 視角，觀察離子表面與水分子的極性引力對接！</div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 物理常數與平衡參數 ---
        const DISSOLVE_PROB = 0.5;   
        const PRECIPITATE_PROB = 0.6; 
        const MAX_CARRIED_IONS = 15;  // 配合畫面容量，飽和上限設為 15
        const BOUNDARY = 450; 

        let waters = [];
        let crystal = [];
        
        let angleY = 0.5; 
        let angleX = 0.3; 
        let isDragging = false;
        let isPaused = false;
        let autoRotate = true; // 預設開啟自動旋轉，展示大作風範
        let lastMouseX = 0;
        let lastMouseY = 0;

        const gridSize = 65; // 稍微拉開晶格距離，視覺更通透
        const offset = (3 * gridSize) / 2; 

        function initSim() {
            crystal = [];
            waters = [];
            
            // 建立 4x4x4 的 NaCl 晶格
            for (let x = 0; x < 4; x++) {
                for (let y = 0; y < 4; y++) {
                    for (let z = 0; z < 4; z++) {
                        crystal.push({
                            x: x * gridSize - offset,
                            y: y * gridSize - offset,
                            z: z * gridSize - offset,
                            type: (x + y + z) % 2 === 0 ? 'Na' : 'Cl',
                            active: true 
                        });
                    }
                }
            }

            // 放入 25 顆水分子 (15顆負責搬運，10顆充當背景溶劑增加沸騰感)
            for (let i = 0; i < 25; i++) {
                let wx, wy, wz;
                do {
                    wx = (Math.random() - 0.5) * (BOUNDARY * 1.8);
                    wy = (Math.random() - 0.5) * (BOUNDARY * 1.8);
                    wz = (Math.random() - 0.5) * (BOUNDARY * 1.8);
                } while (Math.hypot(wx, wy, wz) < 220); // 不要在晶體正中間出生

                waters.push({
                    x: wx, y: wy, z: wz,
                    vx: (Math.random() - 0.5) * 8.0,
                    vy: (Math.random() - 0.5) * 8.0,
                    vz: (Math.random() - 0.5) * 8.0,
                    carriedIon: null,
                    angle: Math.random() * Math.PI * 2,        
                    rotationSpeed: (Math.random() - 0.5) * 0.1, 
                    cooldown: 0 
                });
            }
        }

        // 教學核心功能：瞬間跳躍到平衡狀態
        function triggerInstantEquilibrium() {
            // 先重置晶體，確保晶體表面完整
            initSim();
            
            // 從晶體表面溶解掉離子，直到水合離子對數量達到 MAX_CARRIED_IONS (15)
            // 分配 7對 Na 和 8對 Cl，保持對稱感
            let naToDissolve = 7;
            let clToDissolve = 8;
            
            // 溶解晶體表面的 Na
            for(let c of crystal) {
                if(c.active && c.type === 'Na' && naToDissolve > 0) {
                    c.active = false; naToDissolve--;
                }
            }
            // 溶解晶體表面的 Cl
            for(let c of crystal) {
                if(c.active && c.type === 'Cl' && clToDissolve > 0) {
                    c.active = false; clToDissolve--;
                }
            }
            
            // 將離子分配給前 15 顆水分子
            let naToAssign = 7;
            let clToAssign = 8;
            for(let i=0; i<15; i++) {
                if(naToAssign > 0) { waters[i].carriedIon = { type: 'Na' }; naToAssign--; }
                else if(clToAssign > 0) { waters[i].carriedIon = { type: 'Cl' }; clToAssign--; }
                waters[i].cooldown = 10; // 給點冷卻時間，防止瞬間沉澱
            }
            
            // 如果暫停了，自動播放
            if(isPaused) togglePause();
        }

        function resetSim() {
            initSim();
            if(isPaused) togglePause();
        }

        function togglePause() { isPaused = !isPaused; }
        function toggleAutoRotate() { autoRotate = !autoRotate; }

        // --- 視角拖曳控制 ---
        function startDrag(e) {
            isDragging = true;
            lastMouseX = e.clientX || e.touches[0].clientX;
            lastMouseY = e.clientY || e.touches[0].clientY;
        }
        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); // 畫布內防滾動
            let currentX = e.clientX || (e.touches && e.touches[0].clientX);
            let currentY = e.clientY || (e.touches && e.touches[0].clientY);
            angleY += (currentX - lastMouseX) * 0.008;
            angleX += (currentY - lastMouseY) * 0.008;
            lastMouseX = currentX;
            lastMouseY = currentY;
        }
        function endDrag() { isDragging = false; }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchstart', startDrag, {passive: false});
        canvas.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', endDrag);

        function getCarriedCount() {
            return waters.filter(w => w.carriedIon !== null).length;
        }

        // --- 物理更新引擎 ---
        function updatePhysics() {
            if (isPaused) return;
            if (autoRotate && !isDragging) angleY += 0.004; // 柔和自動旋轉

            let carriedCount = getCarriedCount();
            
            // 更新 UI 儀表板
            document.getElementById('ionCountDisplay').innerText = carriedCount;
            let statusBox = document.getElementById('systemStatus');
            if(carriedCount >= MAX_CARRIED_IONS) {
                statusBox.className = 'status-box status-equilibrium';
                statusBox.innerHTML = '⚖️ 達成動態平衡 ( R<sub>正</sub> = R<sub>逆</sub> )';
            } else {
                statusBox.className = 'status-box status-dissolving';
                statusBox.innerHTML = '🔄 溶液未飽和，持續溶解中...';
            }

            waters.forEach(w => {
                if (w.cooldown > 0) w.cooldown--;

                // 速度限制
                let speed = Math.hypot(w.vx, w.vy, w.vz);
                if (speed > 10) {
                    w.vx = (w.vx / speed) * 10; w.vy = (w.vy / speed) * 10; w.vz = (w.vz / speed) * 10;
                }

                w.x += w.vx; w.y += w.vy; w.z += w.vz;
                w.angle += w.rotationSpeed; 

                // 邊界反彈
                if (Math.abs(w.x) > BOUNDARY) { w.x = Math.sign(w.x) * BOUNDARY; w.vx *= -1; }
                if (Math.abs(w.y) > BOUNDARY) { w.y = Math.sign(w.y) * BOUNDARY; w.vy *= -1; }
                if (Math.abs(w.z) > BOUNDARY) { w.z = Math.sign(w.z) * BOUNDARY; w.vz *= -1; }

                let hasDissolvedThisFrame = false;

                // 晶體碰撞與溶解判定
                for (let c of crystal) {
                    if (!c.active) continue;

                    let dx = w.x - c.x; let dy = w.y - c.y; let dz = w.z - c.z;
                    let dist = Math.hypot(dx, dy, dz);
                    let minDist = w.carriedIon ? 70 : 60; 

                    if (dist < minDist && dist > 0.1) {
                        // 推開防重疊
                        let push = (minDist - dist) / dist;
                        w.x += dx * push; w.y += dy * push; w.z += dz * push;

                        // 彈性碰撞反彈
                        let nx = dx / dist, ny = dy / dist, nz = dz / dist;
                        let dot = w.vx * nx + w.vy * ny + w.vz * nz;
                        if (dot < 0) {
                            w.vx -= 2 * dot * nx; w.vy -= 2 * dot * ny; w.vz -= 2 * dot * nz;
                        }

                        // 溶解 (正反應)
                        if (!w.carriedIon && carriedCount < MAX_CARRIED_IONS && !hasDissolvedThisFrame) {
                            if (Math.random() < DISSOLVE_PROB) {
                                c.active = false;
                                w.carriedIon = { type: c.type };
                                carriedCount++;
                                hasDissolvedThisFrame = true;
                                
                                w.vx = nx * 12; 
                                w.vy = ny * 12; 
                                w.vz = nz * 12;
                                w.cooldown = 20; 
                            }
                        }
                    }
                }

                // 沉澱 (逆反應)
                if (w.carriedIon && w.cooldown === 0) {
                    for (let c of crystal) {
                        if (c.active || c.type !== w.carriedIon.type) continue;
                        let dist = Math.hypot(w.x - c.x, w.y - c.y, w.z - c.z);
                        if (dist < 75) { 
                            if (Math.random() < PRECIPITATE_PROB) {
                                c.active = true; 
                                w.carriedIon = null;  
                                w.vx = (w.x - c.x) * 0.3; 
                                w.vy = (w.y - c.y) * 0.3; 
                                w.vz = (w.z - c.z) * 0.3; 
                                break;
                            }
                        }
                    }
                }
            });
        }

        // --- 霓虹 3D 渲染引擎 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let renderList = []; 

            // 收集所有物件準備 Z-sorting
            crystal.forEach(c => { if (c.active) renderList.push({ type: 'ion', obj: c }); });
            waters.forEach(w => { renderList.push({ type: 'water', obj: w }); });

            renderList.forEach(item => {
                let x = item.obj.x; let y = item.obj.y; let z = item.obj.z;

                // 3D 旋轉矩陣
                let y1 = y * Math.cos(angleX) - z * Math.sin(angleX);
                let z1 = y * Math.sin(angleX) + z * Math.cos(angleX);
                let x1 = x;

                let rx = x1 * Math.cos(angleY) - z1 * Math.sin(angleY);
                let rz = x1 * Math.sin(angleY) + z1 * Math.cos(angleY);
                let ry = y1;

                item.rz = rz; 
                let focalLength = 900; 
                let cameraZ = 300; 
                let scale = focalLength / (focalLength + rz + cameraZ);
                
                item.scale = scale;
                item.px = rx * scale + canvas.width / 2;
                item.py = ry * scale + canvas.height / 2;
            });

            // Painter's Algorithm: 從遠到近繪製
            renderList.sort((a, b) => b.rz - a.rz);

            renderList.forEach(item => {
                if (item.scale < 0.1) return; // 剔除過近防破圖
                
                ctx.save();
                ctx.translate(item.px, item.py);
                ctx.scale(item.scale, item.scale); 

                // 繪製晶格離子
                if (item.type === 'ion') {
                    let isNa = item.obj.type === 'Na';
                    let r = isNa ? 22 : 28;
                    let baseColor = isNa ? '#00FFFF' : '#7CFC00'; // 霓虹青 / 霓虹綠
                    
                    // 發光漸層渲染
                    let grad = ctx.createRadialGradient(-5, -5, 2, 0, 0, r);
                    grad.addColorStop(0, "rgba(255, 255, 255, 0.8)");
                    grad.addColorStop(0.5, baseColor);
                    grad.addColorStop(1, "rgba(0, 0, 0, 0.6)");
                    
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.fillStyle = '#11261f'; ctx.font = 'bold 24px "JetBrains Mono", sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(isNa ? 'Na⁺' : 'Cl⁻', 0, 0);
                } 
                // 繪製水分子與水合離子
                else if (item.type === 'water') {
                    let w = item.obj;
                    ctx.rotate(w.angle);

                    // 若攜帶離子 (化學極性精準對位！)
                    if (w.carriedIon) {
                        let isNa = w.carriedIon.type === 'Na';
                        let cColor = isNa ? '#00FFFF' : '#7CFC00';
                        let cText = isNa ? 'Na⁺' : 'Cl⁻';
                        let ionR = isNa ? 22 : 28;
                        
                        // 【關鍵化學細節】：強制對位
                        // 若為正離子 (Na+)，氧原子靠近。 V形是顛倒的 upside-down V
                        // 若為負離子 (Cl-)，氫原子靠近。 正立 V形
                        let flipFactor = isNa ? 1 : -1;
                        ctx.scale(1, flipFactor); // 負離子時垂直翻轉

                        // 偏移座標，確保離子永遠在 V 形分子開口下方
                        let ionOffset = 35;

                        // 畫水分子本身
                        ctx.fillStyle = '#FF69B4'; // 氧端 (霓虹粉)
                        ctx.beginPath(); ctx.arc(0, -10, 18, 0, Math.PI*2); ctx.fill();
                        
                        ctx.fillStyle = '#FFFFFF'; // 氫端 (白色)
                        ctx.beginPath(); ctx.arc(-12, 8, 8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(12, 8, 8, 0, Math.PI*2); ctx.fill();
                        
                        // 畫被吸附的離子
                        let grad = ctx.createRadialGradient(-5, ionOffset-5, 2, 0, ionOffset, ionR);
                        grad.addColorStop(0, "rgba(255, 255, 255, 0.8)");
                        grad.addColorStop(0.5, cColor);
                        grad.addColorStop(1, "rgba(0, 0, 0, 0.6)");

                        ctx.fillStyle = grad; 
                        ctx.beginPath(); ctx.arc(0, ionOffset, ionR, 0, Math.PI*2); ctx.fill();
                        
                        // 離子文字 (確保文字永遠正向)
                        ctx.save();
                        ctx.translate(0, ionOffset);
                        ctx.scale(1, flipFactor); // 抵消 flipFactor
                        ctx.rotate(isNa ? -w.angle : w.angle); // 抵消旋轉 (Cl- 因為翻轉過，所以旋轉方向相反)
                        
                        ctx.fillStyle = '#11261f'; ctx.font = 'bold 24px "JetBrains Mono", sans-serif'; 
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(cText, 0, 0);
                        ctx.restore();

                    } else {
                        // 自由游離的水分子
                        ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#FFFFFF'; 
                        ctx.beginPath(); ctx.arc(-12, 12, 8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(12, 12, 8, 0, Math.PI*2); ctx.fill();
                    }
                }
                ctx.restore();
            });
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        // 初始化並啟動
        initSim();
        loop();
    </script>
</body>
</html>
