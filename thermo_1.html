const NS='http://www.w3.org/2000/svg',intro=document.getElementById('introScreen'),zhBtn=document.getElementById('zhBtn'),enBtn=document.getElementById('enBtn'),modes=document.getElementById('modes'),hook=document.getElementById('hook'),principle=document.getElementById('principle'),mission=document.getElementById('mission'),controls=document.getElementById('controls'),visual=document.getElementById('visual'),stats=document.getElementById('stats'),explain=document.getElementById('explain');
let lang='zh',mode='touch',introClosed=false,raf=null,timer=null,last=0;
const state={touch:{choice:'',shown:false},column:{temp:25,tube:'thin'},cal:{zero:false,hundred:false,sample:false,guess:25,checked:false,temp:37},scales:{c:25},kelvin:{c:0}};
const copy={
touch:{hook:['曉臻老師把金屬湯匙和木尺在教室放了一整晚。摸起來金屬比較冷——它的溫度真的比較低嗎？先相信你的手，再讓溫度計來判案。','Ms. Xiaozhen left a metal spoon and wooden ruler in the same classroom overnight. Metal feels colder—but is its temperature actually lower? Trust your hand, then let a thermometer judge.'],title:['科學原理｜皮膚感覺的是熱量傳遞快慢，不是直接讀出溫度','Science Principle | Skin senses the rate of energy transfer, not temperature directly'],text:['兩物體在同一環境放得夠久，通常會接近相同溫度。金屬導熱較快，會更快帶走手的能量，因此感覺較冷；溫度計要充分接觸並等讀值穩定後再判斷。','Objects left long enough in the same environment usually approach the same temperature. Metal conducts energy away from your hand faster, so it feels colder. A thermometer needs good contact and a stable reading.'],core:['感覺冷 ≠ 溫度一定較低','Feeling colder ≠ having a lower temperature'],flow:[['先用手摸','產生感覺','放上溫度計','等穩定再讀'],['Touch first','Form a sensation','Use thermometers','Wait, then read']],mission:['先預測哪一個溫度較低，再按「放上溫度計」。如果手感與讀值衝突，用熱量傳遞快慢解釋。','Predict which object has the lower temperature, then place the thermometers. Explain any conflict using the rate of energy transfer.']},
column:{hook:['溫度計沒有馬達，紅色液柱為什麼會自己往上爬？把外殼變透明，我們來看液體受熱後發生了什麼。','A thermometer has no motor, so why does its red column climb? Make the case transparent and see what happens when the liquid warms.'],title:['科學原理｜液體熱脹冷縮，細管把微小體積變化放大','Science Principle | Expansion plus a narrow tube magnifies a small change'],text:['溫度計與環境接近熱平衡後，液體溫度改變。受熱時粒子運動加快、平均距離略增，液體體積增大；多出的液體進入細管，因此液柱上升。冷卻時相反。','After the thermometer approaches thermal equilibrium, its liquid temperature changes. Heating increases particle motion and slightly increases average spacing, expanding the liquid and raising the column. Cooling reverses it.'],core:['同樣的體積變化，細管越窄，液柱升得越明顯','For the same volume change, a narrower tube gives a larger visible rise'],flow:[['接觸環境','交換能量','液體體積改變','細管顯示高度'],['Contact','Exchange energy','Volume changes','Column shows height']],mission:['拖動溫度，再切換粗管與細管。找出哪種管徑能把同樣的膨脹看得更清楚。','Change temperature, then switch tube width. Find which tube makes the same expansion easier to see.']},
cal:{hook:['玻璃管旁只有一把 0～10 cm 的直尺，卻沒有溫度刻度。只要知道液柱長度，你能反推出現在幾度嗎？','The glass tube has only a 0–10 cm ruler and no temperature scale. Can you infer temperature from the column length?'],title:['科學原理｜先量長度，再用兩個固定點把 cm 翻譯成 °C','Science Principle | Measure length, then use two fixed points to translate cm into °C'],text:['在標準大氣壓下，把冰水的液面位置定為 0 cm／0°C，把沸水的液面位置定為 10 cm／100°C。兩者之間是線性等分，因此左邊的長度尺可以轉換成右邊的攝氏溫標。','At standard atmospheric pressure, set the ice-water level to 0 cm/0°C and the boiling-water level to 10 cm/100°C. The interval is linear, so the length ruler on the left can be translated into the Celsius scale on the right.'],core:['0～10 cm 對應 0～100°C，所以每 1 cm 對應 10°C','0–10 cm corresponds to 0–100°C, so each 1 cm corresponds to 10°C'],flow:[['冰水定 0 cm','同時標 0°C','沸水定 10 cm／100°C','由長度推算溫度'],['Set ice water to 0 cm','Also mark 0°C','Set boiling water to 10 cm/100°C','Infer from length']],mission:['建立左右雙重刻度，再測量液柱長 3.7 cm 的神秘飲料。先推算溫度，最後檢查答案。','Build both scales, then measure a mystery drink with a 3.7 cm column. Infer the temperature before checking.']},
scales:{hook:['台灣天氣 25°C，美國朋友卻說是 77°F。難道飛過太平洋，溫度就突然升高了？','The weather is 25°C in Taiwan, but an American friend calls it 77°F. Did it warm up while crossing the Pacific?'],title:['科學原理｜同一個冷熱狀態，可以用不同溫標描述','Science Principle | One thermal state can be described with different scales'],text:['攝氏把水的冰點與沸點標成 0 與 100；華氏標成 32 與 212。兩段刻度都是等距的，因此可以用等比例關係互相翻譯。','Celsius labels water’s freezing and boiling points 0 and 100; Fahrenheit uses 32 and 212. Both are evenly spaced, so a proportion translates between them.'],core:['溫度沒有改變，改變的是數字與刻度單位','The temperature stays; the number and unit change'],flow:[['選同一溫度','找兩溫標基準','比較刻度間隔','換算數值'],['Choose one state','Find reference points','Compare intervals','Convert']],mission:['找出 0°C、25°C、37°C、100°C 分別是多少 °F，並觀察 −40°C 有什麼特別。','Find the Fahrenheit values of 0°C, 25°C, 37°C and 100°C, then discover what is special about −40°C.']},
kelvin:{hook:['如果每次都再冷 10°C，是不是永遠都能繼續降？科學家發現，溫度不是一條沒有底的樓梯。','If we cool something by another 10°C each time, can temperature fall forever? Temperature is not a staircase without a bottom.'],title:['資優原理｜凱氏溫標從理論上的最低溫開始計數','Advanced Principle | Kelvin starts at the theoretical lower limit'],text:['0 K 等於 −273.15°C，稱為絕對零度。這是物質熱運動能量所能到達的理論最低狀態；真實微觀世界仍須用量子理論描述，不能簡化成「所有粒子完全不動」。','0 K equals −273.15°C and is absolute zero, the theoretical minimum thermal-energy state. Quantum theory is still needed; “all particles stop completely” is an oversimplification.'],core:['K = °C + 273.15，而且凱氏溫度不低於 0 K','K = °C + 273.15, and Kelvin does not go below 0 K'],flow:[['攝氏溫度','加上 273.15','換成 K','最低到 0 K'],['Celsius','Add 273.15','Convert to K','Minimum 0 K']],mission:['把溫度一路往下拉，觀察粒子模型如何變慢，並找出 0°C、−273.15°C 各等於多少 K。','Lower the temperature, watch the particle model slow, and find the Kelvin values of 0°C and −273.15°C.']}

function tr(z,e){return lang==='en'?e:z}function fmt(v,d){const n=Number(v.toFixed(d));return String(n).replace('-','−')}function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null}if(timer!==null){clearInterval(timer);timer=null}}

function renderTouch(){const s=state.touch;controls.innerHTML='<div class="control"><label>'+tr('先預測：哪個溫度較低？','Predict: Which is colder?')+'</label><div class="btn-group">'+[['metal','金屬較低','Metal'],['same','兩者相同','Same'],['wood','木頭較低','Wood']].map(x=>'<button class="tool-btn '+(s.choice===x[0]?'active':'')+'" data-p="'+x[0]+'">'+tr(x[1],x[2])+'</button>').join('')+'</div></div><div class="control"><label>'+tr('讓儀器來判案','Let the instrument decide')+'</label><button class="tool-btn primary" id="reveal">🌡️ '+tr('放上溫度計','Place thermometers')+'</button></div><div class="feedback '+(s.shown?(s.choice==='same'?'success':'try'):'')+'" id="fb">'+touchFeedback()+'</div>';visual.innerHTML='<div class="touch-lab '+(s.shown?'revealed':'')+'"><div class="touch-stage"><div class="block metal"><div>🥄 '+tr('金屬','Metal')+'</div><div class="reading">25.0°C</div></div><div class="hand">☝️</div><div class="block wood"><div>📏 '+tr('木頭','Wood')+'</div><div class="reading">25.0°C</div></div></div><div class="heat-flow">'+(s.shown?tr('金屬把手的能量帶走得<b>比較快</b>，但兩物體溫度相同。','Metal carries energy away <b>faster</b>, but both have the same temperature.'):tr('兩物體都在同一間 25°C 的教室放了一整晚。','Both stayed overnight in the same 25°C classroom.'))+'</div></div>';setStats([['教室溫度','Room temperature','25.0°C'],['金屬手感','Metal feels',tr('較冷','Colder')],['木頭手感','Wood feels',tr('較不冷','Less cold')],['儀器判定','Instrument result',s.shown?tr('相同','Same'):'—']]);explain.innerHTML=tr('<h3>🖐️ 為什麼手感不能代替溫度計？</h3><p>手通常比室內物體溫暖。金屬導熱較快，手的能量較快傳出去，所以感覺更冷；木頭導熱慢，感覺較不冷。<b>手感描述的是身體當下的能量交換，溫度計才提供可重複比較的數值。</b><br>接觸式溫度計還必須等待它與被測物接近熱平衡；太早讀，只是在看尚未穩定的過程。</p>','<h3>🖐️ Why Can’t Touch Replace a Thermometer?</h3><p>Your hand is usually warmer than room objects. Metal carries energy away faster, so it feels colder. <b>Sensation reflects current energy exchange; a thermometer provides a repeatable value.</b><br>A contact thermometer must also approach thermal equilibrium before it is read.</p>');controls.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.choice=b.dataset.p;s.shown=false;renderTouch()});document.getElementById('reveal').onclick=()=>{if(!s.choice){const f=document.getElementById('fb');f.textContent=tr('先選一個預測，科學家要留下推理紀錄！','Choose a prediction first!');f.className='feedback try';return}s.shown=true;renderTouch()}}
function renderColumn(){const s=state.column;controls.innerHTML='<div class="control"><label><span>'+tr('環境溫度','Surrounding temperature')+'</span><span class="val">'+s.temp+'°C</span></label><input id="ct" type="range" min="0" max="100" value="'+s.temp+'"></div><div class="control"><label>'+tr('玻璃管管徑','Tube width')+'</label><div class="btn-group"><button class="tool-btn '+(s.tube==='thin'?'active':'')+'" data-tube="thin">'+tr('細管','Narrow')+'</button><button class="tool-btn '+(s.tube==='wide'?'active':'')+'" data-tube="wide">'+tr('粗管','Wide')+'</button></div></div><div class="control"><label>'+tr('快速情境','Quick scenes')+'</label><div class="btn-group"><button class="tool-btn" data-temp="0">🧊 0°C</button><button class="tool-btn" data-temp="37">🤲 37°C</button><button class="tool-btn" data-temp="100">♨️ 100°C</button></div></div>';const svg=svgEl('svg',{viewBox:'0 0 820 430',role:'img','aria-label':tr('液柱與粒子運動示意','Column and particle model')});svg.appendChild(svgEl('rect',{x:18,y:18,width:784,height:394,rx:22,fill:'rgba(7,28,24,.58)',stroke:'rgba(56,189,248,.28)','stroke-width':2}));const w=s.tube==='thin'?26:64;svg.appendChild(svgEl('circle',{cx:405,cy:325,r:76,fill:'rgba(251,113,133,.12)',stroke:'#f2ecd9','stroke-width':5}));svg.appendChild(svgEl('rect',{x:405-w/2,y:48,width:w,height:285,rx:w/2,fill:'rgba(242,236,217,.07)',stroke:'#f2ecd9','stroke-width':5}));const rise=s.tube==='thin'?245:126,top=288-s.temp/100*rise;svg.appendChild(svgEl('rect',{x:405-Math.max(8,w/2-8),y:top,width:Math.max(16,w-16),height:318-top,rx:9,fill:'#fb7185'}));svg.appendChild(svgEl('circle',{cx:405,cy:325,r:62,fill:'#fb7185',opacity:.9}));for(let i=0;i<20;i++){const a=Math.PI*2*i/20,r=18+i%4*10;svg.appendChild(svgEl('circle',{cx:405+Math.cos(a)*r,cy:325+Math.sin(a)*r,r:4.5,fill:'#fde047',class:'particle','data-i':i}))}txt(svg,145,74,tr('環境溫度','Surroundings'),{fill:'#38bdf8',size:20});txt(svg,145,112,s.temp+'°C',{fill:'#fde047',size:34});txt(svg,660,74,tr(s.tube==='thin'?'細毛細管':'粗玻璃管',s.tube==='thin'?'Narrow capillary':'Wide tube'),{fill:'#38bdf8',size:20});txt(svg,660,111,tr(s.tube==='thin'?'高度變化明顯':'高度變化較小',s.tube==='thin'?'Large visible rise':'Smaller visible rise'),{fill:'#fde047',size:22});txt(svg,405,404,tr('粒子模型為教學示意，非真實比例','Particle model is illustrative, not to scale'),{fill:'#c9c2ab',size:15});visual.innerHTML='<div class="xray"></div>';visual.firstChild.appendChild(svg);const motion=s.temp<20?tr('較慢','Slower'):s.temp<65?tr('中等','Moderate'):tr('較快','Faster');setStats([['液體溫度','Liquid temperature',s.temp+'°C'],['粒子運動','Particle motion',motion],['管徑','Tube width',tr(s.tube==='thin'?'細':'粗',s.tube==='thin'?'Narrow':'Wide')],['可見變化','Visible change',tr(s.tube==='thin'?'較大':'較小',s.tube==='thin'?'Larger':'Smaller')]]);explain.innerHTML=tr('<h3>🔬 溫度計不是「熱往上跑」</h3><p>液體受熱後體積略增。玻璃容器把液體限制在球部與細管中，多出的體積只能沿細管上升；冷卻時液體收縮，液柱下降。細管截面積越小，同樣體積變化造成的高度變化越大。<br><b>真正測量要等讀值穩定：</b>只有當溫度計與被測物接近熱平衡，液柱讀值才可代表被測物溫度。</p>','<h3>🔬 Heat Does Not Simply “Run Upward”</h3><p>The liquid expands slightly when warmed. The glass confines it, so the extra volume rises through the capillary; cooling lowers it. A narrower tube turns the same volume change into a larger height change.<br><b>Wait for stability:</b> only near thermal equilibrium can the reading represent the object.</p>');document.getElementById('ct').oninput=e=>{s.temp=+e.target.value;render()};controls.querySelectorAll('[data-tube]').forEach(b=>b.onclick=()=>{s.tube=b.dataset.tube;render()});controls.querySelectorAll('[data-temp]').forEach(b=>b.onclick=()=>{s.temp=+b.dataset.temp;render()});startParticles(svg)}
function startParticles(svg){const ps=[...svg.querySelectorAll('.particle')],speed=.018+state.column.temp/100*.075;last=performance.now();function tick(now){last=now;ps.forEach((p,i)=>{const base=Math.PI*2*i/ps.length,phase=now*speed*.01+i*1.7,r=18+i%4*10;p.setAttribute('cx',(405+Math.cos(base+phase)*r+Math.sin(phase*2.2)*5).toFixed(2));p.setAttribute('cy',(325+Math.sin(base+phase)*r+Math.cos(phase*1.6)*5).toFixed(2))});if(mode==='column')raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}

 bath(svg,85,s.zero,'#38bdf8','🧊',tr('冰水共存','Ice + water'),'0 cm ↔ 0°C');bath(svg,650,s.hundred,'#fb923c','♨️',tr('沸騰的水','Boiling water'),'10 cm ↔ 100°C');
 visual.innerHTML='<div class="cal-lab"></div>';visual.firstChild.appendChild(svg);visual.firstChild.insertAdjacentHTML('beforeend','<div class="steps"><div class="chip '+(s.zero?'done':'')+'">'+tr('把 0°C 位置定為 0 cm','Set 0°C as 0 cm')+'</div><div class="chip '+(s.hundred?'done':'')+'">'+tr('100°C 位置是 10 cm','100°C is at 10 cm')+'</div><div class="chip '+(s.sample?'done':'')+'">'+tr('由長度推回溫度','Infer temperature from length')+'</div></div>');
 setStats([['冰水固定點','Ice-water point',s.zero?'0 cm ↔ 0°C':'—'],['沸水固定點','Boiling-water point',s.hundred?'10 cm ↔ 100°C':'—'],['目前液柱長度','Current column length',s.sample?'3.7 cm':fmt(length,1)+' cm'],['推算溫度','Inferred temperature',s.checked?s.temp+'°C':'? °C']]);
 explain.innerHTML=tr('<h3>🧪 長度本身就是一把尺</h3><p>這裡把 <b>0°C 的液面位置設為長度 0 cm</b>，把 <b>100°C 的液面位置設為 10 cm</b>。左邊永遠保留 0～10 cm 的長度尺；右邊是校準後得到的 0～100°C 溫度尺。於是每增加 1 cm，就代表增加 10°C。<br><span class="formula"><span class="fraction"><span class="num">T − 0</span><span class="den">100 − 0</span></span> = <span class="fraction"><span class="num">L − 0</span><span class="den">10 − 0</span></span></span><br>神秘飲料讓液柱從 0°C 基準線上升 3.7 cm，因此 <b>T = 37°C</b>。這個 0 cm 是我們選定的測量起點，不是從玻璃球最底端量起。</p>','<h3>🧪 Length Is a Scale Too</h3><p>Set the <b>0°C liquid level as 0 cm</b> and the <b>100°C level as 10 cm</b>. The 0–10 cm ruler stays visible on the left; the calibrated 0–100°C scale appears on the right. Each centimeter therefore represents 10°C.<br><span class="formula"><span class="fraction"><span class="num">T − 0</span><span class="den">100 − 0</span></span> = <span class="fraction"><span class="num">L − 0</span><span class="den">10 − 0</span></span></span><br>The mystery drink raises the column 3.7 cm above the 0°C reference, so <b>T = 37°C</b>. Here 0 cm is the chosen reference level, not the bottom of the bulb.</p>');
 controls.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{if(b.dataset.cal==='zero')s.zero=true;if(b.dataset.cal==='hundred')s.hundred=true;if(b.dataset.cal==='sample'&&ready)s.sample=true;s.checked=false;renderCal()});document.getElementById('guess').oninput=e=>{s.guess=+e.target.value;s.checked=false;renderCal()};document.getElementById('check').onclick=()=>{s.checked=true;renderCal()};document.getElementById('reset').onclick=()=>{state.cal={zero:false,hundred:false,sample:false,guess:25,checked:false,temp:37};renderCal()};
}
function renderScales(){
 const s=state.scales,f=s.c*9/5+32;
 controls.innerHTML='<div class="control"><label><span>'+tr('拖動液柱，兩側刻度一起讀','Move the column and read both sides')+'</span><span class="val">'+fmt(s.c,1)+'°C = '+fmt(f,1)+'°F</span></label><input id="cs" type="range" min="-40" max="100" value="'+s.c+'"></div><div class="control"><label>'+tr('挑戰地標','Landmarks')+'</label><div class="btn-group">'+[100,37,25,0,-40].map(v=>'<button class="tool-btn" data-c="'+v+'">'+(v===-40?'−40°C':v+'°C')+'</button>').join('')+'</div></div>';
 const svg=svgEl('svg',{viewBox:'0 0 480 520',role:'img','aria-label':tr('左側攝氏、右側華氏的雙刻度液體溫度計','A liquid thermometer with Celsius on the left and Fahrenheit on the right'),style:'width:100%;height:100%'});
 svg.appendChild(svgEl('rect',{x:18,y:12,width:444,height:496,rx:22,fill:'rgba(7,28,24,.44)',stroke:'rgba(242,236,217,.12)','stroke-width':2}));
 txt(svg,240,40,tr('同一液柱｜雙重刻度','One Column | Two Scales'),{fill:'#f2ecd9',size:21});
 txt(svg,112,69,'°C',{fill:'#38bdf8',size:26});txt(svg,368,69,'°F',{fill:'#fb923c',size:26});
 const yTop=90,yBottom=410,stemX=240,levelY=yBottom-(s.c+40)/140*(yBottom-yTop);
 svg.appendChild(svgEl('rect',{x:222,y:76,width:36,height:352,rx:18,fill:'rgba(242,236,217,.07)',stroke:'#f2ecd9','stroke-width':4}));
 svg.appendChild(svgEl('rect',{x:231,y:levelY,width:18,height:425-levelY,rx:9,fill:'#fb7185'}));
 svg.appendChild(svgEl('circle',{cx:240,cy:438,r:46,fill:'#fb7185',stroke:'#f2ecd9','stroke-width':4}));
 for(let c=-40;c<=100;c+=10){
   const y=yBottom-(c+40)/140*(yBottom-yTop),fahrenheit=c*9/5+32,anchor=c===-40||c===0||c===100,label=c%20===0||c===100;
   svg.appendChild(svgEl('line',{x1:anchor?181:195,y1:y,x2:220,y2:y,stroke:anchor?'#fde047':'rgba(242,236,217,.58)','stroke-width':anchor?3:1.5}));
   svg.appendChild(svgEl('line',{x1:260,y1:y,x2:anchor?299:285,y2:y,stroke:anchor?'#fde047':'rgba(242,236,217,.58)','stroke-width':anchor?3:1.5}));
   if(label){txt(svg,170,y+6,fmt(c,0),{anchor:'end',fill:anchor?'#fde047':'#c9c2ab',size:anchor?20:17});txt(svg,310,y+6,fmt(fahrenheit,0),{anchor:'start',fill:anchor?'#fde047':'#c9c2ab',size:anchor?20:17})}
 }
 svg.appendChild(svgEl('line',{x1:180,y1:levelY,x2:300,y2:levelY,stroke:'#55e9ff','stroke-width':3,'stroke-dasharray':'7 5'}));
 svg.appendChild(svgEl('path',{d:'M 180 '+levelY+' l 12 -7 v 14 z',fill:'#55e9ff'}));svg.appendChild(svgEl('path',{d:'M 300 '+levelY+' l -12 -7 v 14 z',fill:'#55e9ff'}));
 txt(svg,240,501,tr('紅色液體溫度計示意｜量程 −40°C～100°C','Red-liquid thermometer model | Range −40°C to 100°C'),{fill:'#c9c2ab',size:16});
 visual.innerHTML='<div class="scale-lab"><div class="dual-thermo" id="dualThermo"></div><div class="scale-side"><div class="scale-read"><div class="unit">'+tr('從左側讀攝氏','Read Celsius on the left')+'</div><div class="big">'+fmt(s.c,1)+'°C</div></div><div class="scale-read f"><div class="unit">'+tr('同一高度讀華氏','Read Fahrenheit at the same height')+'</div><div class="big">'+fmt(f,1)+'°F</div></div><div class="feedback '+(s.c===-40?'success':'')+'">'+(s.c===-40?tr('看見了嗎？−40°C 與 −40°F 在同一條刻線相遇。','See it? −40°C and −40°F meet on the same line.'):tr('眼睛沿著藍色水平線讀：左邊 °C，右邊 °F。','Follow the blue horizontal line: °C on the left and °F on the right.'))+'</div></div></div>';
 document.getElementById('dualThermo').appendChild(svg);
 setStats([['目前攝氏','Current Celsius',fmt(s.c,1)+'°C'],['目前華氏','Current Fahrenheit',fmt(f,1)+'°F'],['兩溫標交會點','Shared numerical point','−40°C = −40°F']]);
 explain.innerHTML=tr('<h3>🌍 一支溫度計，左右同時翻譯</h3><p>學生不必把兩張表硬背起來：從液柱頂端畫一條水平線，左邊直接讀攝氏，右邊直接讀華氏。水的冰點是 0°C／32°F，沸點是 100°C／212°F；一路往下會在 <b>−40°C／−40°F</b> 相遇。<br><span class="formula"><span class="fraction"><span class="num">C − 0</span><span class="den">100 − 0</span></span> = <span class="fraction"><span class="num">F − 32</span><span class="den">212 − 32</span></span></span><br><b>量程提醒：</b>本圖模擬可量到 −40°C 的紅色酒精／有機液體溫度計；不同溫度計的量程不同。水銀約在 −38.8°C 凝固，因此 −40°C 不能用一般水銀溫度計測量。</p>','<h3>🌍 One Thermometer, Two Simultaneous Readings</h3><p>Follow a horizontal line from the top of the liquid: read Celsius on the left and Fahrenheit on the right. Water freezes at 0°C/32°F and boils at 100°C/212°F; the scales meet at <b>−40°C/−40°F</b>.<br><span class="formula"><span class="fraction"><span class="num">C − 0</span><span class="den">100 − 0</span></span> = <span class="fraction"><span class="num">F − 32</span><span class="den">212 − 32</span></span></span><br><b>Range note:</b> this model represents a red alcohol/organic-liquid thermometer that reaches −40°C. Ranges vary by thermometer. Mercury freezes near −38.8°C, so an ordinary mercury thermometer cannot measure −40°C.</p>');
 document.getElementById('cs').oninput=e=>{s.c=+e.target.value;renderScales()};controls.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{s.c=+b.dataset.c;renderScales()});
}
function renderKelvin(){const s=state.kelvin,k=Math.max(0,s.c+273.15),p=k/373.15*100;controls.innerHTML='<div class="control"><label><span>'+tr('攝氏溫度','Celsius')+'</span><span class="val">'+fmt(s.c,2)+'°C</span></label><input id="ks" type="range" min="-273.15" max="100" step=".05" value="'+s.c+'"></div><div class="control"><label>'+tr('快速定位','Quick positions')+'</label><div class="btn-group">'+[100,0,-196,-273.15].map(v=>'<button class="tool-btn" data-k="'+v+'">'+(v===-273.15?'0 K':fmt(v,2)+'°C')+'</button>').join('')+'</div></div>';visual.innerHTML='<div class="kelvin-lab"><div class="k-meter"><div class="k-fill" style="height:'+Math.max(1.5,p)+'%"></div><div class="k-read"><div><div class="big">'+fmt(k,2)+' K</div><div>'+fmt(s.c,2)+'°C</div></div></div></div><div><div class="particle-field" id="kfield"></div><div class="feedback" style="margin-top:12px">'+(k<.01?tr('到達 0 K：這是理論最低溫，不代表量子世界所有運動完全消失。','At 0 K: the theoretical limit, not a claim that all quantum motion vanishes.'):tr('溫度降低，模型中的熱運動幅度跟著減小。','As temperature falls, modeled thermal motion decreases.'))+'</div></div></div>';setStats([['攝氏溫度','Celsius',fmt(s.c,2)+'°C'],['凱氏溫度','Kelvin',fmt(k,2)+' K'],['理論最低值','Theoretical minimum','0 K'],['換算關係','Conversion','K = °C + 273.15']]);explain.innerHTML=tr('<h3>🔮 為什麼科學家喜歡用 Kelvin？</h3><p>凱氏溫標把絕對零度定為 0 K。0°C 等於 273.15 K，100°C 等於 373.15 K；攝氏每增加 1°C，凱氏也增加 1 K，兩者只有起點不同。<br><b>精確說法：</b>絕對零度是系統能量的理論最低狀態。動畫把運動畫得越來越慢，但真實微觀粒子涉及量子零點運動，不能說成「所有粒子完全靜止」。</p>','<h3>🔮 Why Kelvin?</h3><p>Kelvin sets absolute zero at 0 K. 0°C equals 273.15 K and 100°C equals 373.15 K. A 1°C increase is also 1 K; only the starting point differs.<br><b>Precise wording:</b> absolute zero is the theoretical minimum-energy state. Quantum zero-point motion means “all particles stop completely” is inaccurate.</p>');const field=document.getElementById('kfield'),dots=[];for(let i=0;i<18;i++){const d=document.createElement('span');d.className='k-dot';d.style.left=(10+i*37%82)+'%';d.style.top=(10+i*53%78)+'%';field.appendChild(d);dots.push(d)}const amp=1+k/373.15*18;timer=setInterval(()=>dots.forEach((d,i)=>d.style.transform='translate('+(Math.sin(Date.now()*.002+i)*amp).toFixed(1)+'px,'+(Math.cos(Date.now()*.0024+i*1.3)*amp).toFixed(1)+'px)'),120);document.getElementById('ks').oninput=e=>{s.c=+e.target.value;render()};controls.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{s.c=+b.dataset.k;render()})}
function render(){stop();narrative();if(mode==='touch')renderTouch();if(mode==='column')renderColumn();if(mode==='cal')renderCal();if(mode==='scales')renderScales();if(mode==='kelvin')renderKelvin()}
function setLang(l){lang=l==='en'?'en':'zh';document.documentElement.lang=lang==='en'?'en':'zh-TW';document.querySelectorAll('[data-zh][data-en]').forEach(e=>e.innerHTML=lang==='en'?e.dataset.en:e.dataset.zh);zhBtn.classList.toggle('active',lang==='zh');enBtn.classList.toggle('active',lang==='en');render()}
intro.onclick=enter;intro.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}};zhBtn.onclick=()=>setLang('zh');enBtn.onclick=()=>setLang('en');modes.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{modes.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});setLang('zh');
})();
