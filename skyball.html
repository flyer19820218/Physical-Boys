<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理黑板教室：太陽軌跡與緯度三視角連動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-blackboard: #11261f;
    --bg-panel: #18332a;
    --chalk-white: #FFFFFF;
    --chalk-yellow: #FFE600;
    --chalk-cyan: #00E5FF;
    --chalk-orange: #FF9900;
    --chalk-green: #00FF66;
    --chalk-pink: #FF3399;
    --chalk-dim: #A0B3C6; 
    --chalk-line: rgba(255, 255, 255, 0.4);
    --shadow-dark: rgba(9, 20, 16, 0.9);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 15px;
    background-color: var(--bg-blackboard);
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
      radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
    background-size: 24px 24px, 16px 16px;
    color: var(--chalk-white);
    font-family: "Noto Sans TC", sans-serif;
    font-size: 18px; 
    line-height: 1.5;
  }
  .wrap { max-width: 1500px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--chalk-dim);
  }
  h1 {
    font-size: 28px;
    color: var(--chalk-white);
    margin: 0 0 5px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 18px;
    color: var(--chalk-dim);
  }
  .concept-box {
    background: rgba(255, 255, 255, 0.04);
    border-left: 4px solid var(--chalk-cyan);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 15px;
    font-size: 16px;
  }
  
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    align-items: stretch;
  }
  @media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr; } }
  
  .canvas-container {
    background: var(--bg-panel);
    border: 1px solid var(--chalk-line);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 15px var(--shadow-dark);
  }
  .canvas-container h3 {
    margin: 0 0 10px 0;
    font-size: 18px;
    text-align: center;
  }
  canvas {
    background-color: var(--bg-blackboard);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1; 
    margin-bottom: 10px;
  }
  
  .control-panel {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--chalk-line);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .slider-row label {
    color: var(--chalk-white);
    min-width: 110px;
  }
  input[type=range] {
    flex: 1;
    cursor: pointer;
  }
  .val-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--chalk-cyan);
    min-width: 80px;
    text-align: right;
  }
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    padding: 6px 12px;
    font-size: 15px;
    background: transparent;
    color: var(--chalk-white);
    border: 1px solid var(--chalk-line);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover { background: rgba(255,255,255,0.1); }
  .action-btn.active {
    background: var(--chalk-dim);
    color: var(--bg-blackboard);
    border-color: var(--chalk-dim);
  }
  .btn-green.active { background: var(--chalk-green); border-color: var(--chalk-green); }
  .btn-yellow.active { background: var(--chalk-yellow); border-color: var(--chalk-yellow); }
  .btn-orange.active { background: var(--chalk-orange); border-color: var(--chalk-orange); }
  .explain-box {
    font-size: 15px;
    color: var(--chalk-white);
    line-height: 1.6;
    flex-grow: 1;
  }
  .hl-yellow { color: var(--chalk-yellow); }
  .hl-green { color: var(--chalk-green); }
  .hl-cyan { color: var(--chalk-cyan); }
  .hl-pink { color: var(--chalk-pink); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>天文物理：太陽軌跡與緯度連動模型</h1>
    <div class="subtitle">探討地球自轉、觀測者緯度與太陽視運動的幾何關係</div>
  </header>

  <div class="concept-box">
    💡 <strong>教學重點：觀察相對運動的轉換</strong><br>
    👉 <strong>太空視角：</strong> 太陽光固定來自右側。地球逆時針自轉，觀測者(粉紅點)轉進向陽面即為日出。<br>
    👉 <strong>剖面視角：</strong> 視角固定於觀測者，太陽在天球軌道上順時針運行。地平線(綠線)會因緯度而傾斜。<br>
    👉 <strong>地表視角：</strong> 將剖面圖的幾何關係轉換為立體天空，呈現出與緯度對應的傾斜軌跡與天赤道。
  </div>

  <div class="control-panel">
    <div class="slider-row">
      <label>觀測者緯度：</label>
      <input type="range" id="latSlider" min="-90" max="90" step="0.5" value="23.5">
      <div class="val-display" id="latVal">23.5°N</div>
    </div>
    <div class="btn-group" style="margin-bottom: 12px;">
      <button class="action-btn" onclick="setLat(90)">北極點 (90°N)</button>
      <button class="action-btn active" onclick="setLat(23.5)">台灣 (23.5°N)</button>
      <button class="action-btn" onclick="setLat(0)">赤道 (0°)</button>
      <button class="action-btn" onclick="setLat(-34)">雪梨 (34°S)</button>
      <button class="action-btn" onclick="setLat(-90)">南極點 (90°S)</button>
    </div>

    <div class="slider-row">
      <label>24h 時間：</label>
      <input type="range" id="timeSlider" min="0" max="24" step="0.1" value="12">
      <div class="val-display" id="timeVal">12:00</div>
    </div>
    <div class="btn-group">
      <button class="action-btn active" id="playBtn" onclick="togglePlay()">暫停播放</button>
      <button class="action-btn btn-orange active" id="btn-summer" onclick="setSeason('summer')">夏至 (直射北迴)</button>
      <button class="action-btn btn-green" id="btn-equinox" onclick="setSeason('equinox')">春秋分 (直射赤道)</button>
      <button class="action-btn btn-cyan" id="btn-winter" onclick="setSeason('winter')">冬至 (直射南迴)</button>
    </div>
  </div>

  <div class="grid-3">
    <div class="canvas-container">
      <h3 style="color: var(--chalk-dim);">【太空視角】地球自轉</h3>
      <canvas id="heliosCanvas" width="450" height="450"></canvas>
      <div class="explain-box" id="heliosExplain"></div>
    </div>
    <div class="canvas-container">
      <h3 style="color: var(--chalk-cyan);">【剖面視角】緯度與地平線</h3>
      <canvas id="theoryCanvas" width="450" height="450"></canvas>
      <div class="explain-box" id="theoryExplain"></div>
    </div>
    <div class="canvas-container">
      <h3 style="color: var(--chalk-green);">【地表視角】觀測者天空</h3>
      <canvas id="obsCanvas" width="450" height="450"></canvas>
      <div class="explain-box" id="obsExplain"></div>
    </div>
  </div>
</div>

<script>
  let lat_deg = 23.5;
  let timeHour = 12;
  let season = 'summer'; 
  let isPlaying = true;
  let animId = null;

  const DELTA_MAP = { 'summer': 23.5, 'equinox': 0, 'winter': -23.5 };
  const COLOR_MAP = { 'summer': '#FF9900', 'equinox': '#00FF66', 'winter': '#00E5FF' };

  const latSlider = document.getElementById('latSlider');
  const timeSlider = document.getElementById('timeSlider');
  const latVal = document.getElementById('latVal');
  const timeVal = document.getElementById('timeVal');

  latSlider.addEventListener('input', (e) => { 
      lat_deg = parseFloat(e.target.value); 
      document.querySelectorAll('.control-panel .btn-group:nth-child(2) .action-btn').forEach(b => b.classList.remove('active'));
      updateUI(); 
  });
  timeSlider.addEventListener('input', (e) => { timeHour = parseFloat(e.target.value); updateUI(); });

  function setLat(val) { 
      latSlider.value = val; 
      lat_deg = val; 
      document.querySelectorAll('.control-panel .btn-group:nth-child(2) .action-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      updateUI(); 
  }

  function setSeason(s) { 
      season = s; 
      document.getElementById('btn-summer').classList.remove('active');
      document.getElementById('btn-equinox').classList.remove('active');
      document.getElementById('btn-winter').classList.remove('active');
      document.getElementById('btn-'+s).classList.add('active');
      updateUI(); 
  }

  function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerHTML = isPlaying ? "暫停播放" : "自動播放";
  }

  function getTimeAngle(hour) {
      return ((hour - 12) / 24) * 2 * Math.PI; 
  }

  function drawArrow(ctx, x1, y1, x2, y2, color, text, offset=0, align="center", thickness=2) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = thickness;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headlen = 8 + thickness; 
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 7), y2 - headlen * Math.sin(angle - Math.PI / 7));
      ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 7), y2 - headlen * Math.sin(angle + Math.PI / 7));
      ctx.fill();
      
      if (text) {
          ctx.font = "14px 'Noto Sans TC'";
          let tw = ctx.measureText(text).width;
          let tx = x2 + 12 * Math.cos(angle);
          let ty = y2 + 12 * Math.sin(angle) + offset;
          if (align === "left") { tx = x2 - tw - 15; ty = y2 - 8; }
          ctx.fillText(text, tx - (align==="center"?tw/2:0), ty);
      }
  }

  function getSyncPos(H_rad, delta_rad, phi, R, cx, cy, depth) {
      const x_eq = R * Math.cos(delta_rad) * Math.cos(H_rad); 
      const y_eq = -R * Math.cos(delta_rad) * Math.sin(H_rad); 
      const z_eq = R * Math.sin(delta_rad); 
      
      const x_hor = x_eq * Math.sin(phi) - z_eq * Math.cos(phi); 
      const y_hor = y_eq; 
      const z_hor = x_eq * Math.cos(phi) + z_eq * Math.sin(phi); 

      return {
          x: cx + x_hor,
          y: cy - z_hor - y_hor * depth, 
          z: y_hor,
          altitude: z_hor 
      };
  }

  // ==========================================
  // === 圖1: 太空視角 ===
  // ==========================================
  function drawHeliosCanvas() {
      const canvas = document.getElementById('heliosCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const R = 110;
      const phi_rad = lat_deg * Math.PI / 180;
      const delta_rad = DELTA_MAP[season] * Math.PI / 180;

      ctx.fillStyle = '#11261f'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI/2, 3*Math.PI/2); ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx, cy - R - 15); ctx.lineTo(cx, cy + R + 15); ctx.stroke(); 
      ctx.beginPath(); ctx.moveTo(cx - R - 15, cy); ctx.lineTo(cx + R + 15, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#FFFFFF'; ctx.font = "14px sans-serif"; ctx.fillText("N", cx - 5, cy - R - 20);

      const latY = cy - R * Math.sin(phi_rad);
      const latR = R * Math.cos(phi_rad);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - latR, latY); ctx.lineTo(cx + latR, latY); ctx.stroke();

      const t_rad = getTimeAngle(timeHour); 
      const ox = cx + latR * Math.cos(t_rad);
      const oz = -latR * Math.sin(t_rad); 

      if (oz <= 0) { 
          ctx.fillStyle = '#FF3399'; ctx.beginPath(); ctx.arc(ox, latY, 5, 0, Math.PI*2); ctx.fill();
          const zx = Math.cos(phi_rad) * Math.cos(t_rad);
          const zy = Math.sin(phi_rad);
          drawArrow(ctx, ox, latY, ox + zx*30, latY - zy*30, '#FF3399', '');
      } else { 
          ctx.fillStyle = 'rgba(255,51,153,0.3)'; ctx.beginPath(); ctx.arc(ox, latY, 4, 0, Math.PI*2); ctx.fill();
      }

      const rayY = cy - R * Math.sin(delta_rad);
      drawArrow(ctx, cx + R + 80, rayY, cx + R + 10, rayY, COLOR_MAP[season], '太陽光', -12, "center", 4);

      const exp = document.getElementById('heliosExplain');
      const hh = String(Math.floor(timeHour)).padStart(2,'0');
      const mm = String(Math.floor((timeHour%1)*60)).padStart(2,'0');
      exp.innerHTML = `時間：<span class="mono hl-cyan">${hh}:${mm}</span><br>地球逆時針自轉。觀測者(粉紅點)轉至向陽面即為日出。`;
  }

  // ==========================================
  // === 圖2: 剖面視角 ===
  // ==========================================
  function drawTheoryCanvas() {
      const canvas = document.getElementById('theoryCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const R_earth = 25, R_sky = 170; 
      const phi_rad = lat_deg * Math.PI / 180;
      const delta_rad = DELTA_MAP[season] * Math.PI / 180;

      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, R_sky, 0, Math.PI*2); ctx.stroke();

      const angleZenith = -phi_rad; 
      const angleNorth = angleZenith - Math.PI/2; 
      const angleSouth = angleZenith + Math.PI/2; 

      ctx.fillStyle = 'rgba(0, 162, 255, 0.2)';
      ctx.beginPath(); ctx.arc(cx, cy, R_sky, angleNorth, angleSouth); ctx.fill();
      ctx.fillStyle = 'rgba(0, 255, 102, 0.05)';
      ctx.beginPath(); ctx.arc(cx, cy, R_sky, angleSouth, angleNorth); ctx.fill();

      // 天極軸
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx, cy - R_sky); ctx.lineTo(cx, cy + R_sky); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.font = "14px 'Noto Sans TC'"; ctx.fillText("天極軸", cx + 5, cy - R_sky + 15);

      // 天赤道後半部 (Z < 0) 虛線
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
      ctx.beginPath();
      for(let h = -Math.PI; h <= 0; h+=0.05) {
          let x = cx + R_sky * Math.cos(h);
          let z = R_sky * Math.sin(h);
          let y = cy + z * 0.35; 
          if(h===-Math.PI) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke(); ctx.setLineDash([]);

      // 畫太陽軌道後半部 (Z < 0) 虛線
      const orbitY = cy - R_sky * Math.sin(delta_rad);
      const orbitR = R_sky * Math.cos(delta_rad);
      ctx.strokeStyle = COLOR_MAP[season]; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
      ctx.beginPath();
      for(let h = -Math.PI; h <= 0; h+=0.05) {
          let x = cx + orbitR * Math.cos(h);
          let z = orbitR * Math.sin(h);
          let y = orbitY + z * 0.35; 
          if(h===-Math.PI) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke(); ctx.setLineDash([]);

      // 畫地球本體
      ctx.fillStyle = '#11261f'; ctx.beginPath(); ctx.arc(cx, cy, R_earth, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, R_earth, 0, Math.PI*2); ctx.stroke();
      
      // 縮小版地球的地軸與赤道圓弧
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(cx, cy - R_earth - 10); ctx.lineTo(cx, cy + R_earth + 10); ctx.stroke(); // 地軸
      ctx.beginPath();
      for(let h = -Math.PI; h <= Math.PI; h+=0.05) { // 赤道
          let x = cx + R_earth * Math.cos(h);
          let z = R_earth * Math.sin(h);
          let y = cy + z * 0.35; 
          if(h===-Math.PI) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke(); ctx.setLineDash([]);

      // 地平線與天頂
      const hx1 = cx + R_sky * Math.cos(angleNorth);
      const hy1 = cy + R_sky * Math.sin(angleNorth);
      const hx2 = cx + R_sky * Math.cos(angleSouth);
      const hy2 = cy + R_sky * Math.sin(angleSouth);
      ctx.strokeStyle = '#00FF66'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(hx1, hy1); ctx.lineTo(hx2, hy2); ctx.stroke();
      
      ctx.fillStyle = '#00FF66'; ctx.font = "14px 'Noto Sans TC'";
      ctx.fillText("北(N)", hx1 - 30, hy1 - 10);
      ctx.fillText("南(S)", hx2 + 5, hy2 + 15);

      const ox = cx + R_earth * Math.cos(angleZenith);
      const oy = cy + R_earth * Math.sin(angleZenith);
      ctx.fillStyle = '#FF3399'; ctx.beginPath(); ctx.arc(ox, oy, 3, 0, Math.PI*2); ctx.fill();
      const zx = cx + R_sky * Math.cos(angleZenith);
      const zy = cy + R_sky * Math.sin(angleZenith);
      drawArrow(ctx, ox, oy, zx, zy, '#FF3399', '天頂', -12, "center", 2);

      // 天赤道前半部 (Z >= 0) 實線
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for(let h = 0; h <= Math.PI; h+=0.05) {
          let x = cx + R_sky * Math.cos(h);
          let z = R_sky * Math.sin(h);
          let y = cy + z * 0.35;
          if(h===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.fillStyle = 'rgba(0, 229, 255, 0.6)'; ctx.font = "14px 'Noto Sans TC'"; 
      ctx.fillText("天赤道", cx - R_sky - 45, cy + 5);

      // 畫太陽軌道前半部 (Z >= 0) 實線
      ctx.strokeStyle = COLOR_MAP[season]; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for(let h = 0; h <= Math.PI; h+=0.05) {
          let x = cx + orbitR * Math.cos(h);
          let z = orbitR * Math.sin(h);
          let y = orbitY + z * 0.35;
          if(h===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();

      // 太陽位置
      const H_sun = getTimeAngle(timeHour);
      const sun_x = cx + orbitR * Math.cos(H_sun);
      const sun_z = orbitR * Math.sin(H_sun);
      const sun_y = orbitY + sun_z * 0.35;
      
      const dx = orbitR * Math.cos(H_sun);
      const dy = R_sky * Math.sin(delta_rad); 
      const zx_math = R_sky * Math.cos(angleZenith);
      const zy_math = R_sky * Math.sin(-angleZenith); 
      const isDay = (dx * zx_math + dy * zy_math) >= 0;

      if (sun_z <= 0) { 
          ctx.fillStyle = isDay ? 'rgba(255,230,0,0.5)' : 'rgba(255,230,0,0.2)';
          ctx.beginPath(); ctx.arc(sun_x, sun_y, 6, 0, Math.PI*2); ctx.fill();
      } else { 
          ctx.fillStyle = isDay ? '#FFE600' : 'rgba(255,230,0,0.4)';
          ctx.beginPath(); ctx.arc(sun_x, sun_y, 10, 0, Math.PI*2); ctx.fill();
          if(isDay) { ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke(); }
      }

      const exp = document.getElementById('theoryExplain');
      exp.innerHTML = `太陽在天球軌道上順時針運行。地平線傾斜度與緯度相關，決定了在地可見的天空範圍。`;
  }

  // ==========================================
  // === 圖3: 地表視角 ===
  // ==========================================
  function drawObsCanvas() {
      const canvas = document.getElementById('obsCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 20; 
      const R = 170, depth = 0.35;
      const phi_rad = lat_deg * Math.PI / 180;

      ctx.fillStyle = 'rgba(0, 255, 102, 0.08)';
      ctx.beginPath(); ctx.ellipse(cx, cy, R+20, R*depth, 0, 0, 2*Math.PI); ctx.fill();
      ctx.strokeStyle = '#00FF66'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, R+20, R*depth, 0, 0, 2*Math.PI); ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 162, 255, 0.5)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, R+20, Math.PI, 0); ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - R - 20); ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle = '#00FF66'; ctx.font = "14px 'Noto Sans TC'";
      ctx.fillText("北(N)", cx - R - 40, cy + 5);
      ctx.fillText("南(S)", cx + R + 10, cy + 5);
      ctx.fillText("西(W)", cx - 20, cy + R*depth + 20);
      ctx.fillStyle = 'rgba(0,255,102,0.5)';
      ctx.fillText("東(E)", cx - 20, cy - R*depth - 5);

      const personHeadY = cy - 6;
      ctx.fillStyle = '#FF3399'; ctx.beginPath(); ctx.arc(cx, personHeadY, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#FF3399'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx, personHeadY+4); ctx.lineTo(cx, cy+4); ctx.stroke();

      // 天極軸
      const ncpP = getSyncPos(0, 90*Math.PI/180, phi_rad, R, cx, cy, depth);
      const scpP = getSyncPos(0, -90*Math.PI/180, phi_rad, R, cx, cy, depth);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(ncpP.x, ncpP.y); ctx.lineTo(scpP.x, scpP.y); ctx.stroke(); ctx.setLineDash([]);
      if(ncpP.altitude >= 0) { 
          ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(ncpP.x, ncpP.y, 3, 0, Math.PI*2); ctx.fill();
          ctx.fillText("天極軸", ncpP.x + 5, ncpP.y + 15);
      }

      // 天赤道
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.15)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
      ctx.beginPath();
      for(let h = -Math.PI; h <= 0; h += 0.05) { 
          let p = getSyncPos(h, 0, phi_rad, R+20, cx, cy, depth);
          if(h === -Math.PI) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke(); ctx.setLineDash([]);
      
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for(let h = 0; h <= Math.PI; h += 0.05) { 
          let p = getSyncPos(h, 0, phi_rad, R+20, cx, cy, depth);
          if(h === 0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
      
      let eq_label_p = getSyncPos(Math.PI/2, 0, phi_rad, R+20, cx, cy, depth);
      if(eq_label_p.altitude >= 0) {
          ctx.fillStyle = 'rgba(0, 229, 255, 0.8)'; ctx.fillText("天赤道", eq_label_p.x - 40, eq_label_p.y - 10);
      }

      const tracks = [
          { d: 23.5, color: COLOR_MAP['summer'], id: 'summer' },
          { d: 0, color: COLOR_MAP['equinox'], id: 'equinox' },
          { d: -23.5, color: COLOR_MAP['winter'], id: 'winter' }
      ];

      tracks.forEach(trk => {
          const delta_rad = trk.d * Math.PI / 180;
          const isActive = (season === trk.id);
          const col = isActive ? trk.color : 'rgba(255,255,255,0.15)';
          const lw = isActive ? 2.5 : 1;

          ctx.strokeStyle = col; ctx.lineWidth = lw * 0.5; ctx.setLineDash([4,4]);
          ctx.beginPath(); let fb=true;
          for(let h = -Math.PI; h <= 0; h += 0.05) { 
              let p = getSyncPos(h, delta_rad, phi_rad, R+20, cx, cy, depth);
              if(p.altitude >= 0) { if(fb) { ctx.moveTo(p.x,p.y); fb=false; } else ctx.lineTo(p.x,p.y); }
          }
          ctx.stroke(); ctx.setLineDash([]);

          ctx.strokeStyle = col; ctx.lineWidth = lw;
          ctx.beginPath(); let ff=true;
          for(let h = 0; h <= Math.PI; h += 0.05) { 
              let p = getSyncPos(h, delta_rad, phi_rad, R+20, cx, cy, depth);
              if(p.altitude >= 0) { if(ff) { ctx.moveTo(p.x,p.y); ff=false; } else ctx.lineTo(p.x,p.y); }
          }
          ctx.stroke();
      });

      const activeDelta = DELTA_MAP[season] * Math.PI / 180;
      const H_sun = getTimeAngle(timeHour);
      const sunP = getSyncPos(H_sun, activeDelta, phi_rad, R+20, cx, cy, depth);

      if (sunP.altitude >= 0) {
          ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sunP.x, sunP.y); ctx.stroke();
          
          if (sunP.z > 0) { 
             ctx.fillStyle = '#FFE600'; ctx.beginPath(); ctx.arc(sunP.x, sunP.y, 7, 0, Math.PI*2); ctx.fill();
          } else { 
             ctx.fillStyle = '#FFE600'; ctx.beginPath(); ctx.arc(sunP.x, sunP.y, 11, 0, Math.PI*2); ctx.fill();
             ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
          }
      } else {
          ctx.fillStyle = 'rgba(255,230,0,0.15)'; ctx.beginPath(); ctx.arc(sunP.x, sunP.y, 6, 0, Math.PI*2); ctx.fill();
      }

      const exp = document.getElementById('obsExplain');
      exp.innerHTML = `加入立體的天赤道網格。將中圖的空間關係完美轉換為地表實際天空的觀測視角。`;
  }

  function updateUI() {
      let latStr = Math.abs(lat_deg).toFixed(1) + "°" + (lat_deg >= 0 ? "N" : "S");
      if(lat_deg === 0) latStr = "0°";
      latVal.innerText = latStr;
      
      const hh = String(Math.floor(timeHour)).padStart(2, '0');
      const mm = String(Math.floor((timeHour % 1) * 60)).padStart(2, '0');
      timeVal.innerText = `${hh}:${mm}`;

      drawHeliosCanvas();
      drawTheoryCanvas();
      drawObsCanvas();
  }

  function loop() {
      if (isPlaying) {
          timeHour += 0.08;
          if (timeHour >= 24) timeHour = 0;
          timeSlider.value = timeHour;
          updateUI();
      }
      animId = requestAnimationFrame(loop);
  }

  window.onload = () => {
      updateUI();
      loop();
  };

</script>
</body>
</html>
