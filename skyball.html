<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理黑板教室：天球模型與觀測者緯度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-blackboard: #11261f;
    --bg-panel: #18332a;
    --chalk-white: #FFFFFF;
    --chalk-yellow: #FFE600;
    --chalk-cyan: #00E5FF;
    --chalk-orange: #FF9900;
    --chalk-green: #00FF66;
    --chalk-pink: #FF3399;
    --chalk-dim: #A0B3C6; 
    --chalk-line: rgba(255, 255, 255, 0.4);
    --shadow-dark: rgba(9, 20, 16, 0.9);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 15px 15px 40px;
    background-color: var(--bg-blackboard);
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
      radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
    background-size: 24px 24px, 16px 16px;
    color: var(--chalk-white);
    font-family: "Noto Sans TC", sans-serif;
    font-size: 18px; 
    line-height: 1.5;
  }
  .wrap { max-width: 1440px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--chalk-cyan);
  }
  h1 {
    font-size: 30px;
    color: var(--chalk-cyan);
    margin: 0 0 6px;
    letter-spacing: 2px;
  }
  .subtitle {
    font-size: 18px;
    color: var(--chalk-yellow);
    font-weight: bold;
  }
  .concept-box {
    background: rgba(255, 255, 255, 0.06);
    border-left: 6px solid var(--chalk-green);
    padding: 12px 18px;
    border-radius: 0 10px 10px 0;
    margin-bottom: 16px;
    font-size: 17px;
  }
  
  /* ✅ 等比例縮放並列的核心佈局 */
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
  }
  @media (max-width: 960px) { .grid-3 { grid-template-columns: 1fr; } }
  
  .canvas-container {
    background: var(--bg-panel);
    border: 2px dashed var(--chalk-line);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 25px var(--shadow-dark);
  }
  h3 {
    text-align: center;
    font-size: 20px;
    margin: 0 0 10px;
  }
  canvas {
    background-color: var(--bg-blackboard);
    border: 2px solid var(--chalk-cyan);
    border-radius: 8px;
    width: 100%;       /* 強制等比例貼齊容器 */
    height: auto;      /* 高度自適應 */
    margin-bottom: 12px;
  }
  .control-panel {
    background: rgba(255, 255, 255, 0.04);
    border: 2px solid var(--chalk-line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .slider-row label {
    font-weight: bold;
    color: var(--chalk-yellow);
    min-width: 130px;
  }
  input[type=range] {
    flex: 1;
    cursor: pointer;
  }
  .val-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    color: var(--chalk-cyan);
    min-width: 85px;
    text-align: right;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .action-btn {
    padding: 8px 16px;
    font-size: 16px;
    font-weight: bold;
    background: transparent;
    color: var(--chalk-white);
    border: 2px solid var(--chalk-line);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover { background: rgba(255,255,255,0.1); }
  .action-btn.active {
    background: var(--chalk-cyan);
    color: var(--bg-blackboard);
    border-color: var(--chalk-cyan);
  }
  .btn-green.active { background: var(--chalk-green); border-color: var(--chalk-green); color: var(--bg-blackboard); }
  .btn-yellow.active { background: var(--chalk-yellow); border-color: var(--chalk-yellow); color: var(--bg-blackboard); }
  .btn-orange.active { background: var(--chalk-orange); border-color: var(--chalk-orange); color: var(--bg-blackboard); }
  .explain-box {
    font-size: 16px;
    color: var(--chalk-white);
    text-align: left;
    flex-grow: 1;
  }
  .hl-yellow { color: var(--chalk-yellow); font-weight: bold; }
  .hl-green { color: var(--chalk-green); font-weight: bold; }
  .hl-cyan { color: var(--chalk-cyan); font-weight: bold; }
  .hl-pink { color: var(--chalk-pink); font-weight: bold; }
  .hl-orange { color: var(--chalk-orange); font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>🎯 終極天球緯度：三視角連動模型</h1>
    <div class="subtitle">太陽是不動的！改變的只是地球自轉與我們的緯度視野</div>
  </header>

  <div class="concept-box">
    💡 <strong class="hl-yellow">教學核心：把「視運動」還原成「真運動」！</strong><br>
    👉 <strong class="hl-cyan">左圖 (宇宙視角)：</strong> 太陽光固定來自右側。地球<strong class="hl-yellow">由西向東自轉</strong>，觀測者(紅點)轉進陽光區就是日出。<br>
    👉 <strong class="hl-green">中圖 (視野剖面)：</strong> 依據緯度不同，地平線(綠線)會斜切過天空。光線射入角度決定了正午仰角。<br>
    👉 <strong class="hl-pink">右圖 (在地立體天空)：</strong> 左圖的自轉 + 中圖的斜切 ＝ 我們每天看到的「東升西落與傾斜軌跡」！
  </div>

  <!-- 控制面板 -->
  <div class="control-panel">
    <div class="slider-row">
      <label>🌍 觀測者緯度：</label>
      <input type="range" id="latSlider" min="-90" max="90" step="0.5" value="23.5">
      <div class="val-display" id="latVal">23.5°N</div>
    </div>
    <div class="btn-group" style="margin-bottom: 16px;">
      <button class="action-btn" onclick="setLat(90)">北極點 (90°N)</button>
      <button class="action-btn active" id="btn-tw" onclick="setLat(23.5)">台灣 (23.5°N)</button>
      <button class="action-btn" onclick="setLat(0)">赤道 (0°)</button>
      <button class="action-btn" onclick="setLat(-34)">雪梨 (34°S)</button>
      <button class="action-btn" onclick="setLat(-90)">南極點 (90°S)</button>
    </div>

    <div class="slider-row">
      <label>⏰ 24h 時間：</label>
      <input type="range" id="timeSlider" min="0" max="24" step="0.1" value="12">
      <div class="val-display" id="timeVal">12:00</div>
    </div>
    <div class="btn-group">
      <button class="action-btn active" id="playBtn" onclick="togglePlay()">⏸️ 暫停播放</button>
      <button class="action-btn btn-orange active" id="btn-summer" onclick="setSeason('summer')">☀️ 夏至 (直射北迴)</button>
      <button class="action-btn btn-green" id="btn-equinox" onclick="setSeason('equinox')">🌸 春秋分 (直射赤道)</button>
      <button class="action-btn btn-cyan" id="btn-winter" onclick="setSeason('winter')">❄️ 冬至 (直射南迴)</button>
    </div>
  </div>

  <!-- 三畫布連動顯示區 -->
  <div class="grid-3">
    <!-- 圖1: 宇宙視角 -->
    <div class="canvas-container">
      <h3 style="color: var(--chalk-dim);">【宇宙視角】地球由西向東自轉</h3>
      <canvas id="universeCanvas" width="480" height="420"></canvas>
      <div class="explain-box" id="universeExplain"></div>
    </div>

    <!-- 圖2: 視野剖面 -->
    <div class="canvas-container">
      <h3 style="color: var(--chalk-cyan);">【剖面視角】緯度切割的天空</h3>
      <canvas id="theoryCanvas" width="480" height="420"></canvas>
      <div class="explain-box" id="theoryExplain"></div>
    </div>

    <!-- 圖3: 在地立體天空 -->
    <div class="canvas-container">
      <h3 style="color: var(--chalk-green);">【在地視角】教科書標準天球</h3>
      <canvas id="obsCanvas" width="480" height="420"></canvas>
      <div class="explain-box" id="obsExplain"></div>
    </div>
  </div>
</div>

<script>
  // --- 狀態變數 ---
  let lat_deg = 23.5;
  let timeHour = 12;
  let season = 'summer'; 
  let isPlaying = true;
  let animId = null;

  const DELTA_MAP = { 'summer': 23.5, 'equinox': 0, 'winter': -23.5 };
  const COLOR_MAP = { 'summer': '#FF9900', 'equinox': '#00FF66', 'winter': '#00E5FF' };

  // --- 初始化綁定 ---
  const latSlider = document.getElementById('latSlider');
  const timeSlider = document.getElementById('timeSlider');
  const latVal = document.getElementById('latVal');
  const timeVal = document.getElementById('timeVal');

  latSlider.addEventListener('input', (e) => { 
      lat_deg = parseFloat(e.target.value); 
      document.querySelectorAll('.control-panel .btn-group:nth-child(2) .action-btn').forEach(b => b.classList.remove('active'));
      updateUI(); 
  });
  timeSlider.addEventListener('input', (e) => { timeHour = parseFloat(e.target.value); updateUI(); });

  function setLat(val) { 
      latSlider.value = val; 
      lat_deg = val; 
      document.querySelectorAll('.control-panel .btn-group:nth-child(2) .action-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      updateUI(); 
  }

  function setSeason(s) { 
      season = s; 
      document.getElementById('btn-summer').classList.remove('active');
      document.getElementById('btn-equinox').classList.remove('active');
      document.getElementById('btn-winter').classList.remove('active');
      document.getElementById('btn-'+s).classList.add('active');
      updateUI(); 
  }

  function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerHTML = isPlaying ? "⏸️ 暫停播放" : "▶️ 自動播放";
  }

  // --- 共用繪圖與數學 ---
  function drawArrow(ctx, x1, y1, x2, y2, color, text, offset=0, align="center", thickness=3) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = thickness;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headlen = 10 + (thickness * 1.2); 
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 7), y2 - headlen * Math.sin(angle - Math.PI / 7));
      ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 7), y2 - headlen * Math.sin(angle + Math.PI / 7));
      ctx.fill();
      
      if (text) {
          ctx.font = "bold 18px 'Noto Sans TC'";
          let tw = ctx.measureText(text).width;
          let tx = x2 + 15 * Math.cos(angle);
          let ty = y2 + 15 * Math.sin(angle) + offset;
          if (align === "left") { tx = x2 - tw - 20; ty = y2 - 10; }
          ctx.fillText(text, tx - (align==="center"?tw/2:0), ty);
      }
  }

  // 地平座標系轉換 (南在左, 北在右, 東在前, 西在後) -> 配合教科書 (南左北右)
  function getHorizonPos(H_rad, delta_rad, phi_rad, R) {
      const x_eq = R * Math.cos(delta_rad) * Math.sin(H_rad); 
      const y_eq = R * Math.cos(delta_rad) * Math.cos(H_rad); 
      const z_eq = R * Math.sin(delta_rad);                   

      const theta = Math.PI / 2 - phi_rad;
      const x_h = x_q = x_eq; // West
      const y_h = y_eq * Math.cos(theta) - z_eq * Math.sin(theta); // South
      const z_h = y_eq * Math.sin(theta) + z_eq * Math.cos(theta); // Zenith

      return { x: -y_h, y: z_h, z: -x_h }; // X: South(-), North(+). Y: Zenith(+). Z: West(-), East(+)
  }

  // ==========================================
  // === 左圖：宇宙視角 (地球自轉) ===
  // ==========================================
  function drawUniverseCanvas() {
      const canvas = document.getElementById('universeCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = 230, cy = 210, R = 110;
      const phi_rad = lat_deg * Math.PI / 180;
      const delta_rad = DELTA_MAP[season] * Math.PI / 180;

      // 地球本體
      ctx.fillStyle = '#11261f'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
      
      // 陰影 (光從右邊來)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI/2, 3*Math.PI/2); ctx.fill();

      // 地軸與赤道
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx, cy - R - 20); ctx.lineTo(cx, cy + R + 20); ctx.stroke(); 
      ctx.beginPath(); ctx.moveTo(cx - R - 20, cy); ctx.lineTo(cx + R + 20, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#FFFFFF'; ctx.font = "bold 16px sans-serif"; ctx.fillText("N", cx - 6, cy - R - 25);

      // 緯度軌道
      const latY = cy - R * Math.sin(phi_rad);
      const latR = R * Math.cos(phi_rad);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - latR, latY); ctx.lineTo(cx + latR, latY); ctx.stroke();

      // 觀測者位置 (由西向東自轉)
      const t_rad = ((timeHour - 12) / 24) * Math.PI * 2; 
      const ox = cx + latR * Math.cos(t_rad);
      const oz = -latR * Math.sin(t_rad); 

      if (oz <= 0) { 
          ctx.fillStyle = '#FF3399'; ctx.beginPath(); ctx.arc(ox, latY, 6, 0, Math.PI*2); ctx.fill();
          const zx = Math.cos(phi_rad) * Math.cos(t_rad);
          const zy = Math.sin(phi_rad);
          drawArrow(ctx, ox, latY, ox + zx*35, latY - zy*35, '#FF3399', '');
      } else { 
          ctx.fillStyle = 'rgba(255,51,153,0.3)'; ctx.beginPath(); ctx.arc(ox, latY, 4, 0, Math.PI*2); ctx.fill();
      }

      // 唯一粗直射光
      const rayY = cy - R * Math.sin(delta_rad);
      drawArrow(ctx, cx + R + 110, rayY, cx + R + 15, rayY, COLOR_MAP[season], '太陽光', -15, "center", 5);

      const exp = document.getElementById('universeExplain');
      exp.innerHTML = `👉 地球<strong class="hl-cyan">由西向東(逆時針)</strong>轉。粉紅點代表我們，轉進右半邊的瞬間就是<strong class="hl-yellow">日出</strong>！`;
  }

  // ==========================================
  // === 中圖：視野剖面 (固定地球) ===
  // ==========================================
  function drawTheoryCanvas() {
      const canvas = document.getElementById('theoryCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = 240, cy = 210, R_earth = 55, R_sky = 160;
      const phi_rad = lat_deg * Math.PI / 180;
      const delta_rad = DELTA_MAP[season] * Math.PI / 180;

      // 天球外框
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, R_sky, 0, Math.PI*2); ctx.stroke();

      // 地球
      ctx.fillStyle = '#11261f'; ctx.beginPath(); ctx.arc(cx, cy, R_earth, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R_earth, 0, Math.PI*2); ctx.stroke();
      
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx, cy - R_earth - 15); ctx.lineTo(cx, cy + R_earth + 15); ctx.stroke(); 
      ctx.beginPath(); ctx.moveTo(cx - R_earth - 15, cy); ctx.lineTo(cx + R_earth + 15, cy); ctx.stroke(); ctx.setLineDash([]);

      // 視野切割幾何
      const angleZenith = -phi_rad; 
      const angleNorth = angleZenith - Math.PI/2; 
      const angleSouth = angleZenith + Math.PI/2; 

      ctx.fillStyle = 'rgba(0, 162, 255, 0.2)';
      ctx.beginPath(); ctx.arc(cx, cy, R_sky, angleNorth, angleSouth); ctx.fill();
      ctx.fillStyle = 'rgba(0, 255, 102, 0.05)';
      ctx.beginPath(); ctx.arc(cx, cy, R_sky, angleSouth, angleNorth); ctx.fill();

      // 地平線
      const hx1 = cx + R_sky * Math.cos(angleNorth);
      const hy1 = cy + R_sky * Math.sin(angleNorth);
      const hx2 = cx + R_sky * Math.cos(angleSouth);
      const hy2 = cy + R_sky * Math.sin(angleSouth);
      ctx.strokeStyle = '#00FF66'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hx1, hy1); ctx.lineTo(hx2, hy2); ctx.stroke();
      
      ctx.fillStyle = '#00FF66'; ctx.font = "bold 18px 'Noto Sans TC'";
      ctx.fillText("北地平(N)", hx1 - 35, hy1 - 10);
      ctx.fillText("南地平(S)", hx2 + 5, hy2 + 20);

      // 觀測者與天頂
      const ox = cx + R_earth * Math.cos(angleZenith);
      const oy = cy + R_earth * Math.sin(angleZenith);
      ctx.fillStyle = '#FF3399'; ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI*2); ctx.fill();
      const zx = cx + R_sky * Math.cos(angleZenith);
      const zy = cy + R_sky * Math.sin(angleZenith);
      drawArrow(ctx, ox, oy, zx, zy, '#FF3399', '天頂', -15);

      // 唯一粗直射光
      const mainRayY = cy - R_earth * Math.sin(delta_rad);
      drawArrow(ctx, cx + R_sky + 70, mainRayY, cx + R_sky + 10, mainRayY, COLOR_MAP[season], '直射光', -12, "center", 5);

      // 太陽位置投影
      const H_sun = ((timeHour - 12) / 24) * Math.PI * 2;
      const skyPos = getHorizonPos(H_sun, delta_rad, phi_rad, R_sky);
      const ppx = cx + skyPos.y * Math.cos(angleZenith) + skyPos.x * Math.cos(angleNorth);
      const ppy = cy + skyPos.y * Math.sin(angleZenith) + skyPos.x * Math.sin(angleNorth);
      
      ctx.fillStyle = (skyPos.y >= 0) ? '#FFE600' : 'rgba(255,230,0,0.3)';
      ctx.beginPath(); ctx.arc(ppx, ppy, 12, 0, Math.PI*2); ctx.fill();
      if(skyPos.y >= 0) { ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke(); }

      const exp = document.getElementById('theoryExplain');
      exp.innerHTML = `👉 <strong class="hl-green">地平線傾斜</strong>切出我們能看見的藍色天空。光線射入角度決定了正午的仰角！`;
  }

  // ==========================================
  // === 右圖：在地立體天空 (左南 右北 前東 後西) ===
  // ==========================================
  function drawObsCanvas() {
      const canvas = document.getElementById('obsCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = 240, cy = 250, R = 160, depth = 0.35;
      const phi_rad = lat_deg * Math.PI / 180;

      // 天球基底與地平線
      ctx.fillStyle = 'rgba(0, 255, 102, 0.08)';
      ctx.beginPath(); ctx.ellipse(cx, cy, R+20, R*depth, 0, 0, 2*Math.PI); ctx.fill();
      ctx.strokeStyle = '#00FF66'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, cy, R+20, R*depth, 0, 0, 2*Math.PI); ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 162, 255, 0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, R+20, Math.PI, 0); ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - R - 20); ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle = '#00FF66'; ctx.font = "bold 18px 'Noto Sans TC'";
      ctx.fillText("南 (S)", cx - R - 50, cy + 5);
      ctx.fillText("北 (N)", cx + R + 10, cy + 5);
      ctx.fillText("東 (E)", cx - 20, cy + R*depth + 25);
      ctx.fillStyle = 'rgba(0,255,102,0.5)';
      ctx.fillText("西 (W)", cx - 20, cy - R*depth - 5);

      const personHeadY = cy - 8;
      ctx.fillStyle = '#FF3399'; ctx.beginPath(); ctx.arc(cx, personHeadY, 6, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#FF3399'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx, personHeadY+6); ctx.lineTo(cx, cy+5); ctx.stroke();

      // 天北極點投影
      const ncpPos = getHorizonPos(Math.PI, 90*Math.PI/180, phi_rad, R);
      const nx = cx + ncpPos.x;
      const ny = cy - ncpPos.y + ncpPos.z * depth;
      if(ncpPos.y >= 0) {
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.setLineDash([3,3]);
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(nx, ny, 4, 0, Math.PI*2); ctx.fill();
      }

      // 繪製軌道
      const tracks = [
          { d: 23.5, color: COLOR_MAP['summer'], id: 'summer' },
          { d: 0, color: COLOR_MAP['equinox'], id: 'equinox' },
          { d: -23.5, color: COLOR_MAP['winter'], id: 'winter' }
      ];

      tracks.forEach(trk => {
          const delta_rad = trk.d * Math.PI / 180;
          const isActive = (season === trk.id);
          const col = isActive ? trk.color : 'rgba(255,255,255,0.2)';
          const lw = isActive ? 3 : 1.5;

          ctx.strokeStyle = col; ctx.lineWidth = lw * 0.5; ctx.setLineDash([4,4]);
          ctx.beginPath(); let fb=true;
          for(let h = 0; h <= Math.PI; h += 0.05) { 
              let pos = getHorizonPos(h, delta_rad, phi_rad, R);
              let px = cx + pos.x; let py = cy - pos.y + pos.z * depth;
              if(pos.y >= 0) { if(fb) { ctx.moveTo(px,py); fb=false; } else ctx.lineTo(px,py); }
          }
          ctx.stroke(); ctx.setLineDash([]);

          ctx.strokeStyle = col; ctx.lineWidth = lw;
          ctx.beginPath(); let ff=true;
          for(let h = -Math.PI; h <= 0; h += 0.05) { 
              let pos = getHorizonPos(h, delta_rad, phi_rad, R);
              let px = cx + pos.x; let py = cy - pos.y + pos.z * depth;
              if(pos.y >= 0) { if(ff) { ctx.moveTo(px,py); ff=false; } else ctx.lineTo(px,py); }
          }
          ctx.stroke();
      });

      // 當前太陽
      const activeDelta = DELTA_MAP[season] * Math.PI / 180;
      const H_sun = ((timeHour - 12) / 24) * Math.PI * 2;
      const sunPos = getHorizonPos(H_sun, activeDelta, phi_rad, R);
      
      const sx = cx + sunPos.x;
      const sy = cy - sunPos.y + sunPos.z * depth;

      if (sunPos.y >= 0) {
          ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sx, sy); ctx.stroke();
          ctx.fillStyle = '#FFE600'; ctx.beginPath(); ctx.arc(sx, sy, 13, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
      } else {
          ctx.fillStyle = 'rgba(255,230,0,0.2)'; ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI*2); ctx.fill();
      }

      const exp = document.getElementById('obsExplain');
      let status = (sunPos.y >= 0) ? "☀️" : "🌙";
      exp.innerHTML = `👉 <strong class="hl-cyan">視角連動：</strong>中圖被切掉的天空，造就了右圖這幾條傾斜的太陽軌跡，完美還原東升西落！`;
  }

  // --- 主迴圈 ---
  function updateUI() {
      let latStr = Math.abs(lat_deg).toFixed(1) + "°" + (lat_deg >= 0 ? "N" : "S");
      if(lat_deg === 0) latStr = "0°";
      latVal.innerText = latStr;
      
      const hh = String(Math.floor(timeHour)).padStart(2, '0');
      const mm = String(Math.floor((timeHour % 1) * 60)).padStart(2, '0');
      timeVal.innerText = `${hh}:${mm}`;

      drawUniverseCanvas();
      drawTheoryCanvas();
      drawObsCanvas();
  }

  function loop() {
      if (isPlaying) {
          timeHour += 0.08;
          if (timeHour >= 24) timeHour = 0;
          timeSlider.value = timeHour;
          updateUI();
      }
      animId = requestAnimationFrame(loop);
  }

  window.onload = () => {
      updateUI();
      loop();
  };

</script>
</body>
</html>
