    :root {

      --board-dark: #11261f;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #fde047;
      --chalk-green: #4ade80;
      --chalk-pink: #f472b6;
      --chalk-blue: #38bdf8;
      --chalk-gray: #9fb0a8;
      --chalk-orange: #fb923c;
      --chalk-cyan: #55e9ff;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 20px;
      padding-bottom: 60px;

    body.intro-locked { overflow: hidden; }
    .intro-screen {
        position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
        overflow: hidden; background: #03130f; cursor: pointer; isolation: isolate;
        transition: opacity .7s ease, visibility .7s ease;
    }
    .intro-screen::before {
        content: ""; position: absolute; inset: -3%; z-index: -3;
        /* 👇 老師，圖檔名稱在這裡改！大約第 50 行 */
        background: url("optics_1_cover.jpeg") center/cover no-repeat;
        animation: introZoom 9s ease-out both;
        filter: brightness(0.7) contrast(1.1) saturate(1.1);
    }
    .intro-screen::after {
        content: ""; position: absolute; inset: 0; z-index: -2;
        background: radial-gradient(circle, rgba(1,11,11,0) 40%, rgba(1,12,10,0.7) 100%);
        pointer-events: none;
    }
    .intro-screen.exiting { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes introZoom { from { transform: scale(1); } to { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .intro-screen::before { animation: none; } }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: row; align-items: center; gap: 8px;
      padding: 8px 12px; border: 2px solid var(--chalk-blue); border-radius: 12px;
      background: rgba(17, 38, 31, 0.95); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lang-label { color: var(--chalk-blue); font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; user-select: none; margin-left: 4px; }
    .lang-options { display: flex; flex-direction: row; gap: 4px; }
    .lang-pill {
      min-width: 60px; min-height: 48px; padding: 6px 12px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 8px;
      background: transparent; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation;
    }
    .lang-pill.active { background: var(--chalk-blue) !important; color: #0b1a15 !important; border-color: var(--chalk-blue) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .wrap { max-width: 1080px; margin: 60px auto 20px; padding: 0 16px; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.15em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-size: 40px; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); color: var(--chalk-yellow); }
    header p { color: var(--chalk-green); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 22px; font-weight: bold; }

    /* 🌟 V5 曉臻老師專屬 Hook 區塊 */
    .hook-box { 
        display: flex; align-items: center; gap: 18px;
        background: linear-gradient(135deg, rgba(85, 233, 255, 0.12), rgba(85, 233, 255, 0.02)); 
        border-left: 6px solid var(--chalk-cyan); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; 
        box-shadow: 0 4px 20px rgba(85, 233, 255, 0.08);
        border-right: 1px solid rgba(85, 233, 255, 0.1); border-bottom: 1px solid rgba(85, 233, 255, 0.1); border-top: 1px solid rgba(85, 233, 255, 0.1);
    }
    .xiaozhen-logo { width: 64px; height: 64px; border-radius: 50%; background-color: var(--board); border: 3px solid var(--chalk-cyan); display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; box-shadow: 0 0 15px rgba(85, 233, 255, 0.4); overflow: hidden; }
    .hook-content { flex: 1; line-height: 1.6; }
    .hook-title { color: var(--chalk-cyan); font-size: 22px; font-weight: 900; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .hook-text { color: #fff; font-size: 20px; font-weight: bold; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-size: 28px; margin: 0 0 16px; font-weight: 700;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    /* 分頁切換按鈕 */
    .mode-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 22px; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.3);
      padding: 14px 10px; min-height: 56px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: center;
      touch-action: manipulation;
    }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.6); color: var(--chalk); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); border-style: solid;
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 16px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 20px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 8px; background: transparent; cursor: pointer; min-height: 44px; touch-action: manipulation; }

    .presets { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .presets span { font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 2px dashed var(--chalk-dim);
      color: var(--chalk); padding: 10px 18px; min-height: 48px; border-radius: 18px; font-size: 20px; cursor: pointer; transition: all .15s; font-weight: bold;
      touch-action: manipulation;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 16px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; aspect-ratio: 600 / 320; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 14px 10px; text-align: center; border: 1px dashed var(--chalk-dim); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 28px; color: var(--chalk-yellow); font-weight: 700; margin-top: 8px; }
    .math-text { font-family: 'JetBrains Mono', monospace; font-weight: bold; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 16px 20px; }
    .explain-box h3 { color: var(--chalk-yellow); margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); }
    
    /* 垂直分式 */
    .math-eq { display: inline-flex; align-items: center; vertical-align: middle; gap: 6px; font-family: 'JetBrains Mono', monospace; font-weight: bold; }
    .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 2px; }
    .fraction .num { border-bottom: 2px solid currentColor; padding: 2px 4px; line-height: 1.2; }
    .fraction .den { padding: 2px 4px; line-height: 1.2; }
    .formula-highlight { background: rgba(242, 214, 117, 0.15); padding: 6px 12px; border-radius: 6px; color: var(--chalk-yellow); display: inline-flex; margin: 6px 0; }

    .quiz-box { background: rgba(95, 176, 255, 0.1); border: 2px dashed var(--x-color); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
    .quiz-box h4 { margin: 0 0 10px 0; color: var(--x-color); font-size: 24px; font-weight: 700; }
    .quiz-box p { margin: 6px 0; font-size: 20px; line-height: 1.8; }
    
    footer { text-align: center; color: var(--chalk-dim); font-size: 20px; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; font-weight: bold; }

    @media (max-width: 768px) {
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
      .mode-switch { grid-template-columns: 1fr; }
      .hook-box { flex-direction: column; text-align: center; }
    }
  
    /* 🏠 首頁懸浮按鈕（V5：全站導覽，2026-09-25 新增） */
    .home-fab {
      position: fixed; top: 16px; left: 20px; z-index: 9999;
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; text-decoration: none;
      background: rgba(17, 38, 31, 0.92); border: 2px solid #ffe066; color: #f6f3ea;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 14px rgba(255, 224, 102, 0.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    }
    .home-fab svg { width: 24px; height: 24px; display: block; }
    .home-fab:hover, .home-fab:focus-visible {
      background: #ffe066; color: #11261f;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 224, 102, 0.55);
      transform: translateY(-2px);
    }
    .home-fab:active { transform: translateY(0); }
    @media (max-width: 520px) {
      .home-fab { top: 8px; left: 8px; width: 42px; height: 42px; }
      .home-fab svg { width: 20px; height: 20px; }
    }

  /* ==================================================================
     老師講解／學生操作 雙模式（外層加法：學生操作＝原本的樣子，沒有改任何一個原有規則）
     ================================================================== */
  .mode-bar { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0 0 22px; }
  .mode-bar .mode-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .mode-pill {
    min-height: 52px; padding: 8px 26px; border-radius: 999px; cursor: pointer;
    font-size: 21px; font-weight: 700; font-family: inherit; line-height: 1.3;
    background: transparent; color: #c0d0c8; border: 2px dashed rgba(242, 236, 217, 0.35);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: all 0.2s;
  }
  .mode-pill:hover:not(.active) { background: rgba(255, 255, 255, 0.06); color: #fff; }
  .mode-pill.active { background: var(--chalk-yellow); color: var(--board-dark); border: 2px solid var(--chalk-yellow); box-shadow: 0 0 14px rgba(255, 224, 102, 0.35); }
  .mode-hint { font-size: 17px; color: #c0d0c8; text-align: center; line-height: 1.5; max-width: 900px; }
  .teach-bar {
    display: none; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    background: rgba(13, 32, 26, 0.72); border: 1px solid rgba(242, 236, 217, 0.12); border-top: none;
    border-radius: 0 0 8px 8px; padding: 16px 20px 18px; margin-top: -2px;
  }
  body.mode-teacher .teach-bar { display: flex; }
  .teach-btn {
    min-height: 44px; padding: 6px 18px; border-radius: 8px; cursor: pointer;
    font-size: 18px; font-weight: 700; font-family: inherit; line-height: 1.3;
    background: transparent; color: var(--chalk-green); border: 2px solid var(--chalk-green);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: all 0.2s;
  }
  .teach-btn:hover:not(:disabled) { background: var(--chalk-green); color: var(--board-dark); }
  .teach-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .teach-btn.hot { background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); }
  .teach-track { flex: 1 1 180px; min-width: 120px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .teach-fill { height: 100%; width: 0; background: var(--chalk-yellow); border-radius: 6px; transition: width 0.35s linear; }
  .teach-chips { flex: 1 1 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
  .teach-chip {
    min-height: 44px; padding: 4px 14px; border-radius: 8px; cursor: pointer;
    font-size: 18px; font-weight: 700; font-family: inherit; line-height: 1.3;
    background: transparent; color: #c0d0c8; border: 2px dashed rgba(242, 236, 217, 0.35);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: all 0.2s;
  }
  .teach-chip .teach-n { display: inline-block; min-width: 1.2em; text-align: center; margin-right: 2px; }
  .teach-chip:hover:not(.on) { background: rgba(255, 255, 255, 0.06); color: #fff; border-color: #fff; }
  .teach-chip.past { color: var(--chalk-green); border-color: rgba(74, 222, 128, 0.55); }
  .teach-chip.on { background: var(--chalk-yellow); color: var(--board-dark); border: 2px solid var(--chalk-yellow); box-shadow: 0 0 12px rgba(255, 224, 102, 0.4); }
  .teach-note { flex: 1 1 100%; text-align: center; font-size: 20px; line-height: 1.5; color: var(--chalk-yellow); min-height: 1.5em; }
  /* 老師模式：學生用的控制列（滑桿、快速設定、孔洞按鈕）收起來 */
  body.mode-teacher .controls, body.mode-teacher .presets { display: none !important; }
  .visual-card, .hook-box { scroll-margin-top: 88px; }
  @media (max-width: 520px) {
    .mode-pill { padding: 8px 18px; font-size: 19px; }
    .teach-bar { padding: 14px 12px 16px; }
  }
  </style>

    </div>

    <div class="board">
      <h2 data-zh="重點觀念與解析" data-en="Key Concepts & Analysis">重點觀念與解析</h2>
      <div id="quizContainer"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer data-zh="國中自然 光學單元 視覺化黑板教材" data-en="Middle School Science - Optics Visual Blackboard">國中自然 光學單元 視覺化黑板教材</footer>
  </div>

  <script>
    (function() {
      // 🌟 V5 開場動畫控制
      const introScreen = document.getElementById('introScreen');
      let introClosed = false;
      function enterLesson() {
          if (introClosed) return;
          introClosed = true;
          introScreen.classList.add('exiting');
          document.body.classList.remove('intro-locked');
          setTimeout(() => introScreen.remove(), 800);
      }
      introScreen.addEventListener('click', enterLesson);

      let currentLang = 'zh';
      let currentMode = 'shadow';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const drawLayer = document.getElementById('drawLayer');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const quizContainer = document.getElementById('quizContainer');

      const params = {
        shadow: { lightSize: 14, objHeight: 60 },
        pinhole: { objX: -100, holeX: 0, screenX: 100, h: 40, holes: '1' },
        quiz: { holeX: -50 }
      };

      // 🌟 曉臻老師 Hook 提問資料庫
      const hooks = {
          'shadow': {
              zh: "為什麼在路燈下走路，影子有時候很清晰，有時候邊緣卻糊糊的？難道影子也會「失焦」嗎？",
              en: "Why under a streetlamp are shadows sometimes crisp and sometimes blurry? Do shadows lose focus?"
          },
          'pinhole': {
              zh: "為什麼透過一個小小的圓孔看出去，世界會變成「上下顛倒、左右相反」？如果我在紙上戳三個洞，會看到三個顛倒的世界嗎？",
              en: "Why does looking through a tiny hole turn the world upside down? If I poke three holes, will I see three inverted worlds?"
          },
          'quiz': {
              zh: "當你把針孔往物體靠近時，牆上的畫面會變大還是變小？這可是段考最愛考的「相似三角形」魔王題！",
              en: "When you move the pinhole closer to the object, does the image on the wall get larger or smaller? Exam trap alert!"
          }
      };

      function updateHookBox() {
          const hookBox = document.getElementById('hookBox');
          if(hookBox && hooks[currentMode]) {
              const titleText = currentLang === 'en' ? "👩🏻‍🏫 Teacher Xiaozhen says:" : "👩🏻‍🏫 曉臻老師說：";
              const contentText = currentLang === 'en' ? hooks[currentMode].en : hooks[currentMode].zh;
              hookBox.innerHTML = `
                  <div class="xiaozhen-logo">👩🏻‍🏫</div>
                  <div class="hook-content">
                      <div class="hook-title">${titleText}</div>
                      <div class="hook-text">${contentText}</div>
                  </div>
              `;
          }
      }

      function tr(zh, en) {
        return currentLang === 'en' ? en : zh;
      }

      window.setLang = function(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';

        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.innerHTML = el.getAttribute(`data-${lang}`);
        });

        initUI();
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { 
          for (let key in attrs) {
            if (key === 'style') el.style.cssText = attrs[key];
            else el.setAttribute(key, attrs[key]);
          }
        }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal') {
        const t = createSvgEl('text', { 
          x: x, 
          y: y, 
          'text-anchor': anchor, 
          fill: color, 
          'font-size': size, 
          'font-weight': weight, 
          'font-family': 'Noto Sans TC, sans-serif' 
        });
        t.textContent = txt;
        parent.appendChild(t);
      }

      function initUI() {
        updateHookBox();
        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.replaceChildren();
        presetsBox.replaceChildren();
        quizContainer.replaceChildren();
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, labelZh, labelEn, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${tr(labelZh, labelEn)} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            let newVal = parseFloat(e.target.value);
            newVal = onChange(newVal);
            e.target.value = newVal;
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            updateSimulation();
          });
        };

        if (m === 'shadow') {
          addSlider('lightSize', '光源大小 (點 ↔ 擴展)', 'Light Size (Point ↔ Ext)', 2, 36, 2, p.lightSize, 'cm', v => { p.lightSize = v; return v; });
          addSlider('objHeight', '障礙物大小', 'Obstacle Height', 30, 90, 5, p.objHeight, 'cm', v => { p.objHeight = v; return v; });
        } else if (m === 'pinhole') {
          addSlider('objX', '物體位置 (左側)', 'Obj Pos (Left)', -250, -20, 5, p.objX, 'cm', v => {
            p.objX = v;
            if(p.holeX <= p.objX + 10) { p.holeX = p.objX + 10; document.getElementById('inp_holeX').value = p.holeX; document.getElementById('val_holeX').textContent = p.holeX + ' cm'; }
            return v;
          });
          addSlider('holeX', '針孔位置', 'Pinhole Pos', -200, 200, 5, p.holeX, 'cm', v => {
            let val = v;
            if(val <= p.objX + 10) val = p.objX + 10;
            if(val >= p.screenX - 10) val = p.screenX - 10;
            p.holeX = val; return val;
          });
          addSlider('screenX', '屏幕位置 (右側)', 'Screen Pos (Right)', 20, 250, 5, p.screenX, 'cm', v => {
            p.screenX = v;
            if(p.holeX >= p.screenX - 10) { p.holeX = p.screenX - 10; document.getElementById('inp_holeX').value = p.holeX; document.getElementById('val_holeX').textContent = p.holeX + ' cm'; }
            return v;
          });
          
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${tr('紙板孔洞類型', 'Pinhole Type')} <span class="val">${tr('點擊切換', 'Click to switch')}</span></label>
            <div style="display:flex; gap:8px; margin-top:4px;">
              <button type="button" style="flex:1; padding:10px; border-radius:6px; border:2px solid var(--chalk-dim); background:${p.holes === '1' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '1' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:1.05rem; touch-action:manipulation;" onclick="setHole('1')">${tr('1洞', '1 Hole')}</button>
              <button type="button" style="flex:1; padding:10px; border-radius:6px; border:2px solid var(--chalk-dim); background:${p.holes === '2' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '2' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:1.05rem; touch-action:manipulation;" onclick="setHole('2')">${tr('2洞', '2 Holes')}</button>
              <button type="button" style="flex:1; padding:10px; border-radius:6px; border:2px solid var(--chalk-dim); background:${p.holes === '3' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '3' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:1.05rem; touch-action:manipulation;" onclick="setHole('3')">${tr('3洞', '3 Holes')}</button>
              <button type="button" style="flex:1; padding:10px; border-radius:6px; border:2px solid var(--chalk-dim); background:${p.holes === 'large' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === 'large' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:1.05rem; touch-action:manipulation;" onclick="setHole('large')">${tr('大洞', 'Large')}</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setHole = (val) => { p.holes = val; renderControls(); renderPresets(); updateSimulation(); };
          
        } else if (m === 'quiz') {
          addSlider('holeX', '移動針孔位置解答', 'Move Pinhole to Solve', -90, 90, 2, p.holeX, 'cm', v => { p.holeX = v; return v; });
          
          quizContainer.innerHTML = '<div id="mcq-optics1"></div>';
          if (window.LessonQuiz && LessonQuiz.refresh) LessonQuiz.refresh();
        }
      }

      function renderPresets() {
        presetsBox.replaceChildren();
        if(currentMode !== 'pinhole') return;
        
        const span = document.createElement('span');
        span.textContent = tr('快速設定：', 'Presets:');
        presetsBox.appendChild(span);
        
        const p = params.pinhole;
        const addBtn = (labelZh, labelEn, action) => {
          const b = document.createElement('button');
          b.textContent = tr(labelZh, labelEn);
          b.onclick = () => { action(); renderControls(); renderPresets(); updateSimulation(); };
          presetsBox.appendChild(b);
        };
        addBtn('1:1 等大成像', '1:1 Same Size', () => { p.objX = -100; p.holeX = 0; p.screenX = 100; });
        addBtn('針孔近物 (像放大)', 'Near Obj (Magnify)', () => { p.objX = -100; p.holeX = -50; p.screenX = 100; });
        addBtn('針孔遠物 (像縮小)', 'Far Obj (Shrink)', () => { p.objX = -100; p.holeX = 50; p.screenX = 100; });
      }

      function updateSimulation() {
        while (drawLayer.firstChild) {
          drawLayer.removeChild(drawLayer.firstChild);
        }
        statsGrid.replaceChildren();
        const m = currentMode;
        
        drawLayer.appendChild(createSvgEl('line', { x1: -280, y1: 0, x2: 280, y2: 0, stroke: 'var(--chalk-dim)', 'stroke-width': 1, 'stroke-dasharray': '5 5', opacity: 0.5 }));
        
        const addStat = (kZh, kEn, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${tr(kZh, kEn)}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'shadow') {
          const p = params.shadow;
          const lightX = -200, objX = -50, screenX = 200;
          
          drawLayer.appendChild(createSvgEl('circle', { cx: lightX, cy: 0, r: p.lightSize + 8, fill: '#f2d675', opacity: 0.25 }));
          drawLayer.appendChild(createSvgEl('circle', { cx: lightX, cy: 0, r: p.lightSize, fill: '#f2d675' }));
          addText(drawLayer, lightX, p.lightSize + 28, p.lightSize <= 4 ? tr('點光源', 'Point Light') : tr('擴展光源', 'Ext Light'), 'middle', '#f2d675', 20, 'bold');
          
          drawLayer.appendChild(createSvgEl('rect', { x: objX - 10, y: -p.objHeight/2, width: 20, height: p.objHeight, fill: '#5c4a33' }));
          addText(drawLayer, objX, p.objHeight/2 + 28, tr('不透明物體', 'Opaque Obj'), 'middle', '#c9c2ab', 20);
          
          drawLayer.appendChild(createSvgEl('line', { x1: screenX, y1: -150, x2: screenX, y2: 150, stroke: '#ffffff', 'stroke-width': 6 }));
          
          const topLight = -p.lightSize, botLight = p.lightSize;
          const topObj = -p.objHeight/2, botObj = p.objHeight/2;
          
          const drawRay = (y1, y2, opacity) => {
            const slope = (y2 - y1) / (objX - lightX);
            const yAtScreen = y1 + slope * (screenX - lightX);
            drawLayer.appendChild(createSvgEl('line', { x1: lightX, y1: y1, x2: screenX, y2: yAtScreen, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));
            return yAtScreen;
          };

          const s1 = drawRay(topLight, topObj, 0.45); 
          const s2 = drawRay(botLight, botObj, 0.45); 
          const s3 = drawRay(topLight, botObj, 0.45); 
          const s4 = drawRay(botLight, topObj, 0.45); 

          const umbraTop = Math.max(s1, s4);
          const umbraBot = Math.min(s2, s3);
          const penumbraTop = Math.min(s1, s4);
          const penumbraBot = Math.max(s2, s3);
          
          if (penumbraTop < umbraTop && Math.abs(umbraTop - penumbraTop) > 4) {
              drawLayer.appendChild(createSvgEl('line', { x1: screenX, y1: penumbraTop, x2: screenX, y2: umbraTop, stroke: '#8899a6', 'stroke-width': 8 }));
              addText(drawLayer, screenX + 15, (penumbraTop + umbraTop)/2 + 6, tr('半影區', 'Penumbra'), 'start', 'var(--chalk-gray)', 20, 'bold');
          }
          if (umbraBot < penumbraBot && Math.abs(penumbraBot - umbraBot) > 4) {
              drawLayer.appendChild(createSvgEl('line', { x1: screenX, y1: umbraBot, x2: screenX, y2: penumbraBot, stroke: '#8899a6', 'stroke-width': 8 }));
              addText(drawLayer, screenX + 15, (umbraBot + penumbraBot)/2 + 6, tr('半影區', 'Penumbra'), 'start', 'var(--chalk-gray)', 20, 'bold');
          }

          if (umbraTop < umbraBot) {
              drawLayer.appendChild(createSvgEl('line', { x1: screenX, y1: umbraTop, x2: screenX, y2: umbraBot, stroke: '#051510', 'stroke-width': 8 }));
              addText(drawLayer, screenX + 15, (umbraTop + umbraBot)/2 + 6, tr('本影區', 'Umbra'), 'start', 'var(--v-color)', 22, 'bold');
          }
          
          explainBox.innerHTML = tr(`
            <h3>光的直進與影子的生成</h3>
            <p>當光在均勻介質中直線前進遇到障礙物時，後方光線完全被遮擋、到達不了的區域稱為「<b>本影區</b>」。<br>
            當光源體積較大（擴展光源），本影區上下兩側只有部分光線被遮擋的灰色過渡地帶，則稱為「<b>半影區</b>」。隨著光源變大，半影區範圍會跟著明顯增加！</p>
          `, `
            <h3>Rectilinear Propagation & Shadow</h3>
            <p>When light travels straight and hits an obstacle, the area where no light reaches is the "<b>Umbra</b>".<br>
            For an extended light source, the gray transition zones where light is partially blocked are "<b>Penumbra</b>". As the source grows, the penumbra increases significantly!</p>
          `);
          
        } else if (m === 'pinhole' || m === 'quiz') {
          
          let pVal, qVal, objH, holePositions = [0], isLargeHole = false;
          let objX, screenX, holeX;

          if (m === 'pinhole') {
            const p = params.pinhole;
            objX = p.objX; holeX = p.holeX; screenX = p.screenX; objH = p.h;
            pVal = holeX - objX; qVal = screenX - holeX;
            const hType = p.holes;
            if (hType === '2') holePositions = [-30, 30];
            else if (hType === '3') holePositions = [-40, 0, 40];
            else if (hType === 'large') { isLargeHole = true; holePositions = [-15, -10, -5, 0, 5, 10, 15]; }
          } else if (m === 'quiz') {
            const p = params.quiz;
            const SCALE = 5;
            objH = 8 * SCALE; 
            objX = -100; screenX = 100; holeX = p.holeX;
            pVal = holeX - objX; qVal = screenX - holeX;
          }

          drawLayer.appendChild(createSvgEl('line', { x1: holeX, y1: -140, x2: holeX, y2: 140, stroke: '#8f8a80', 'stroke-width': 4 }));
          holePositions.forEach(hy => {
              const hs = isLargeHole ? 35 : 12;
              drawLayer.appendChild(createSvgEl('line', { x1: holeX, y1: hy - hs/2, x2: holeX, y2: hy + hs/2, stroke: 'var(--board-dark)', 'stroke-width': 6 }));
          });
          addText(drawLayer, holeX - 5, -120, tr('針孔', 'Pinhole'), 'end', '#8f8a80', 18, 'bold');

          drawLayer.appendChild(createSvgEl('line', { x1: screenX, y1: -140, x2: screenX, y2: 140, stroke: '#ffffff', 'stroke-width': 6, opacity: 0.9 }));
          addText(drawLayer, screenX + 10, -120, tr('屏幕', 'Screen'), 'start', '#ffffff', 18, 'bold');
          
          drawLayer.appendChild(createSvgEl('line', { x1: objX, y1: 0, x2: objX, y2: -objH, stroke: '#ef6a5a', 'stroke-width': 6, 'stroke-linecap': 'round' }));
          drawLayer.appendChild(createSvgEl('polygon', { points: `${objX},-${objH+8} ${objX-6},-${objH-2} ${objX+6},-${objH-2}`, fill: '#ef6a5a' }));
          
          let mainImgH = 0;
          let topImgY_master = 0;
          let botImgY_master = 0;
          let imgColorMaster = '';

          holePositions.forEach((hy, idx) => {
              const opacity = isLargeHole ? 0.15 : 0.6;
              const topSlope = (hy - (-objH)) / (holeX - objX);
              const topImgY = hy + topSlope * (screenX - holeX);
              drawLayer.appendChild(createSvgEl('line', { x1: objX, y1: -objH, x2: screenX, y2: topImgY, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));

              const botSlope = (hy - 0) / (holeX - objX);
              const botImgY = hy + botSlope * (screenX - holeX);
              drawLayer.appendChild(createSvgEl('line', { x1: objX, y1: 0, x2: screenX, y2: botImgY, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));

              const imgColor = isLargeHole ? 'rgba(95, 176, 255, 0.2)' : '#5fb0ff';
              drawLayer.appendChild(createSvgEl('line', { x1: screenX, y1: botImgY, x2: screenX, y2: topImgY, stroke: imgColor, 'stroke-width': 6, 'stroke-linecap': 'round' }));
              drawLayer.appendChild(createSvgEl('polygon', { points: `${screenX},${topImgY+8} ${screenX-6},${topImgY-2} ${screenX+6},${topImgY-2}`, fill: imgColor }));
              
              if (hy === 0 || idx === 0) {
                mainImgH = Math.abs(topImgY - botImgY);
                topImgY_master = topImgY;
                botImgY_master = botImgY;
                imgColorMaster = isLargeHole ? '#5fb0ff' : imgColor;
              }
          });

          drawLayer.appendChild(createSvgEl('path', { d: `M ${objX},130 L ${holeX},130`, stroke: 'var(--chalk-dim)', 'stroke-width': 1, fill: 'none', 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)' }));
          drawLayer.appendChild(createSvgEl('path', { d: `M ${holeX},130 L ${screenX},130`, stroke: 'var(--chalk-dim)', 'stroke-width': 1, fill: 'none', 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)' }));
          
          let trueP = pVal, trueQ = qVal, trueObjH = objH, trueImgH = mainImgH;
          if (m === 'quiz') {
            trueP = pVal / 5; trueQ = qVal / 5; trueObjH = 8; trueImgH = mainImgH / 5;
          }

          addText(drawLayer, (objX+holeX)/2, 148, `p = ${trueP.toFixed(1)}`, 'middle', 'var(--chalk-dim)', 16);
          addText(drawLayer, (holeX+screenX)/2, 148, `q = ${trueQ.toFixed(1)}`, 'middle', 'var(--chalk-dim)', 16);

          addText(drawLayer, objX - 15, -objH/2 + 5, `${trueObjH.toFixed(1)} cm`, 'end', '#ef6a5a', 18, 'bold');
          if (mainImgH > 0 && !isLargeHole) {
            addText(drawLayer, screenX + 15, (topImgY_master + botImgY_master)/2 + 5, `${trueImgH.toFixed(1)} cm`, 'start', imgColorMaster, 18, 'bold');
          }

          const mag = (trueQ / trueP).toFixed(2);
          addStat('物距 <span class="math-text">p</span>', 'Obj Dist <span class="math-text">p</span>', `${trueP.toFixed(1)} cm`);
          addStat('像距 <span class="math-text">q</span>', 'Img Dist <span class="math-text">q</span>', `${trueQ.toFixed(1)} cm`);
          addStat('物高 <span class="math-text">h<sub>o</sub></span>', 'Obj H <span class="math-text">h<sub>o</sub></span>', `${trueObjH.toFixed(1)} cm`);
          addStat('像高 <span class="math-text">h<sub>i</sub></span>', 'Img H <span class="math-text">h<sub>i</sub></span>', `${trueImgH.toFixed(1)} cm`);
          addStat('倍率 <span class="math-text">M</span>', 'Mag <span class="math-text">M</span>', `${mag} ${tr('倍', 'x')}`);

          if (m === 'pinhole') {
            let extraZh = ''; let extraEn = '';
            if (params.pinhole.holes === '2') {
              extraZh = '兩個孔洞會各自獨立成像，在屏幕上形成<b>兩個互不干擾的倒立實像</b>。';
              extraEn = 'Two holes form <b>two independent inverted real images</b> without interference.';
            } else if (params.pinhole.holes === '3') {
              extraZh = '三個孔洞會形成<b>三個獨立的倒立實像</b>，且排列形狀與孔洞方向完全上下顛倒。';
              extraEn = 'Three holes form <b>three inverted real images</b>, arranged upside down compared to the holes.';
            } else if (params.pinhole.holes === 'large') {
              extraZh = '大孔可視為無數微小孔洞的集合。無數倒立實像互相交疊，造成<b>成像邊緣模糊</b>，最終輪廓甚至會接近孔洞本身的形狀，但整體亮度增加。';
              extraEn = 'A large hole is a collection of tiny holes. Overlapping images cause <b>blurred edges</b>, adopting the hole\'s shape while increasing brightness.';
            }

            explainBox.innerHTML = tr(`
              <h3>針孔成像幾何規律</h3>
              <p>光線直進穿過小孔，在屏幕上形成<b>倒立實像</b>。利用相似三角形原理，可得必考比例公式：</p>
              <div class="math-eq formula-highlight">
                <div class="fraction"><span class="num">h<sub>i</sub></span><span class="den">h<sub>o</sub></span></div>
                <span> ＝ </span>
                <div class="fraction"><span class="num">q</span><span class="den">p</span></div>
              </div>。<br>
              <p>當物距 (p) 小於像距 (q) 時，成像放大；反之則縮小。<br>
              ${extraZh ? '<br>'+extraZh : ''}</p>
            `, `
              <h3>Pinhole Geometry Rules</h3>
              <p>Light travels straight through the hole, forming an <b>inverted real image</b>. Using similar triangles gives the ratio formula:</p>
              <div class="math-eq formula-highlight">
                <div class="fraction"><span class="num">h<sub>i</sub></span><span class="den">h<sub>o</sub></span></div>

              代入總長度：p + 4p = 40，解得 <b style="color:var(--chalk-green);">p = 8 cm</b>。<br>
              原本物距為 10 cm，現在變為 8 cm，代表 <b style="color:var(--chalk-pink);">針孔需向物體方向移動 2 cm</b>。</p>

              <p>Solving gives image distance <b style="color:var(--chalk-yellow);">q = 30 cm</b>.</p>
              <br>
              <p><b>Q2 Analysis:</b> Total distance is fixed at p + q = 10 + 30 = 40 cm. For 4x magnification, q = 4p.<br>
              Substitute: p + 4p = 40, solving gives <b style="color:var(--chalk-green);">p = 8 cm</b>.<br>

      document.querySelectorAll('.mode-switch button').forEach(btn => {

<script>
/* ==================================================================
   老師講解／學生操作 雙模式（外層加法；上面的原有程式只多了一行入口 window.__optics1）
   ・學生操作＝原本的互動（滑桿、快速設定、孔洞按鈕、考題實戰）。
   ・老師講解＝按下去就自動從頭連續播：目前的互動單元依序走完它的步驟（直接改頁面原本的 params，再呼叫原本的 initUI 重畫），
     可暫停、從頭重播、點步驟編號跳到那一步。切回學生操作時，畫面還原成「剛按下老師講解」那一刻的樣子。
   ・只借用原本的參數與重畫函式，不碰任何繪圖座標與物理。
   ================================================================== */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const O = window.__optics1;
  const L = (zh, en) => ({ zh: zh, en: en });
  const isEn = () => O.lang() === 'en';
  const say = o => (isEn() ? o.en : o.zh);
  const tt = (zh, en) => (isEn() ? en : zh);

  // 設定參數並用頁面原本的函式重畫（滑桿也會跟著回到對應的值）
  const SH = (light, h) => { Object.assign(O.params.shadow, { lightSize: light, objHeight: h }); O.init(); };
  const PH = (objX, holeX, screenX, holes) => { Object.assign(O.params.pinhole, { objX: objX, holeX: holeX, screenX: screenX, holes: holes }); O.init(); };
  const QZ = x => { O.params.quiz.holeX = x; O.init(); };

  const STEPS = {
    shadow: [
      { ms: 9000, label: L('點光源', 'Point light'),
        note: L('光源縮到最小，像一個點：光沿直線前進，被障礙物擋出一塊全黑的本影，邊緣很清楚。', 'The source shrinks to a point: light travels straight, so the obstacle casts one sharp, fully dark umbra.'),
        go() { SH(2, 60); } },
      { ms: 9000, label: L('擴展光源', 'Extended light'),
        note: L('光源變大：本影的上下兩側出現灰色的半影區，那裡只有一部分光被擋住。', 'A bigger source: gray penumbra bands appear above and below the umbra, where only part of the light is blocked.'),
        go() { SH(14, 60); } },
      { ms: 9000, label: L('光源更大', 'Even larger'),
        note: L('光源再變大：半影範圍明顯增加，本影反而縮小，影子邊緣越來越模糊。', 'A larger source: the penumbra grows, the umbra shrinks, and the shadow edge gets blurrier.'),
        go() { SH(30, 60); } },
      { ms: 8000, label: L('障礙物變大', 'Bigger obstacle'),
        note: L('光源回到原本大小，障礙物加高到 90：擋住的光線變多，屏幕上的影子也跟著變大。', 'Back to the original source, with the obstacle raised to 90: more light is blocked and the shadow grows.'),
        go() { SH(14, 90); } }
    ],
    pinhole: [
      { ms: 9000, label: L('等大成像', '1:1 image'),
        note: L('物體和屏幕各離針孔 100 公分：成倒立實像，像高等於物高 40 公分。', 'Object and screen are both 100 cm from the pinhole: an inverted real image, as tall as the object (40 cm).'),
        go() { PH(-100, 0, 100, '1'); } },
      { ms: 9000, label: L('針孔近物', 'Pinhole near object'),
        note: L('針孔往物體靠近：p = 50、q = 150，像高 ÷ 物高 = q ÷ p = 3，像放大成 3 倍。', 'Pinhole moves toward the object: p = 50, q = 150, so image ÷ object = q ÷ p = 3. The image is 3 times larger.'),
        go() { PH(-100, -50, 100, '1'); } },
      { ms: 9000, label: L('針孔遠物', 'Pinhole far from object'),
        note: L('針孔往屏幕靠近：p = 150、q = 50，q ÷ p 約 0.33，像縮小成三分之一。', 'Pinhole moves toward the screen: p = 150, q = 50, so q ÷ p is about 0.33. The image shrinks to one third.'),
        go() { PH(-100, 50, 100, '1'); } },
      { ms: 8000, label: L('兩個孔', 'Two holes'),
        note: L('紙板戳兩個洞：兩個孔各自成像，屏幕上出現兩個互不干擾的倒立實像。', 'Two holes: each makes its own image, giving two independent inverted real images on the screen.'),
        go() { PH(-100, 0, 100, '2'); } },
      { ms: 8000, label: L('三個孔', 'Three holes'),
        note: L('三個洞就有三個倒立實像，排列的形狀和孔洞的方向上下顛倒。', 'Three holes give three inverted images, arranged upside down compared with the holes.'),
        go() { PH(-100, 0, 100, '3'); } },
      { ms: 9000, label: L('大洞', 'Large hole'),
        note: L('洞開得很大，等於無數個小孔：無數個倒立實像疊在一起，邊緣變模糊，整體卻更亮。', 'A large hole is countless tiny holes: countless inverted images overlap, the edges blur, but the image gets brighter.'),
        go() { PH(-100, 0, 100, 'large'); } }
    ],
    quiz: [
      { ms: 9000, label: L('題一：算像距', 'Q1: image distance'),
        note: L('針孔在 p = 10 公分處、物高 8 公分、像高 24 公分：24 ÷ 8 = q ÷ 10，q = 30 公分。', 'Pinhole at p = 10 cm, object 8 cm, image 24 cm: 24 ÷ 8 = q ÷ 10, so q = 30 cm.'),
        go() { QZ(-50); } },
      { ms: 8000, label: L('等大的位置', 'Same-size position'),
        note: L('物體和屏幕固定相距 40 公分：針孔在正中間時 p = q = 20，像高等於物高 8 公分。', 'Object and screen stay 40 cm apart: with the pinhole in the middle, p = q = 20 and the image is 8 cm, same as the object.'),
        go() { QZ(0); } },
      { ms: 10000, label: L('題二：像放大 4 倍', 'Q2: 4x image'),
        note: L('像高要變 4 倍，就是 q = 4p；p + q = 40，所以 p = 8 公分，針孔要往物體移動 2 公分。', 'A 4x image means q = 4p; with p + q = 40, p = 8 cm, so the pinhole moves 2 cm toward the object.'),
        go() { QZ(-60); } }
    ]
  };
  const totalMs = m => STEPS[m].reduce((s, x) => s + x.ms, 0);

  const T = { on: false, mode: null, si: 0, elapsed: 0, paused: false, done: false, timer: 0, last: 0 };
  let snap = null;

  function fillBar() {
    const f = $('teach-fill'); if (!f || !T.mode) return;
    const st = STEPS[T.mode]; let before = 0;
    for (let i = 0; i < T.si; i++) before += st[i].ms;
    const cur = T.done ? st[T.si].ms : Math.min(T.elapsed, st[T.si].ms);
    f.style.width = (100 * (before + cur) / totalMs(T.mode)) + '%';
  }
  function paintBtns() {
    const p = $('teach-pause'), r = $('teach-replay'); if (!p || !r) return;
    p.textContent = T.paused ? tt('▶ 繼續', '▶ Resume') : tt('⏸ 暫停', '⏸ Pause');
    p.disabled = T.done;
    r.textContent = tt('↺ 從頭重播', '↺ Replay');
    r.classList.toggle('hot', T.done);
  }
  function paintChips() {
    const box = $('teach-chips'); if (!box || !T.mode) return;
    box.innerHTML = '';
    STEPS[T.mode].forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'teach-chip' + (i === T.si ? ' on' : (i < T.si ? ' past' : ''));
      b.innerHTML = '<span class="teach-n">' + (i + 1) + '</span>' + say(s.label).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      b.addEventListener('click', () => { if (T.done) T.paused = false; goStep(i); });
      box.appendChild(b);
    });
    const n = $('teach-note'); if (n) n.textContent = say(STEPS[T.mode][T.si].note);
  }
  function goStep(i) {
    T.si = i; T.elapsed = 0; T.done = false;
    STEPS[T.mode][i].go();
    paintChips(); paintBtns(); fillBar();
  }
  function finish() { T.done = true; fillBar(); paintBtns(); }
  function enterMode(m) {
    if (!STEPS[m]) return;
    T.mode = m; T.paused = false; T.done = false;
    goStep(0);
    const s = document.querySelector('.visual-card');
    if (s && s.scrollIntoView) { try { s.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { s.scrollIntoView(); } }
  }
  function tick() {
    const now = performance.now(), dt = now - T.last; T.last = now;
    if (!T.on || T.paused || T.done || !T.mode) return;
    const arr = STEPS[T.mode]; T.elapsed += dt;
    if (T.elapsed >= arr[T.si].ms) { if (T.si + 1 < arr.length) goStep(T.si + 1); else finish(); }
    fillBar();
  }

  $('teach-pause').addEventListener('click', () => { if (!T.done) { T.paused = !T.paused; paintBtns(); } });
  $('teach-replay').addEventListener('click', () => { T.paused = false; goStep(0); });

  // 切互動單元：原本的按鈕處理（先登記、先執行）已經更新 currentMode；老師模式下從該單元第 1 步重新開始
  document.querySelectorAll('.mode-switch button').forEach(btn => {
    btn.addEventListener('click', () => { if (T.on) enterMode(O.mode()); });
  });
  // 切語言：原本的 setLang 會重畫整個畫面；老師模式再補畫自己的按鈕與提示
  const _setLang = window.setLang;
  window.setLang = function () {
    _setLang.apply(this, arguments);
    if (T.on && T.mode) { paintChips(); paintBtns(); }
  };

  window.setMode = function (m) {
    const teacher = m === 'teacher';
    if (teacher === T.on) return;
    $('mode-student').classList.toggle('active', !teacher); $('mode-student').setAttribute('aria-pressed', String(!teacher));
    $('mode-teacher').classList.toggle('active', teacher); $('mode-teacher').setAttribute('aria-pressed', String(teacher));
    document.body.classList.toggle('mode-teacher', teacher);
    if (teacher) {
      snap = { shadow: Object.assign({}, O.params.shadow), pinhole: Object.assign({}, O.params.pinhole), quiz: Object.assign({}, O.params.quiz) };
      T.on = true; T.last = performance.now();
      T.timer = setInterval(tick, 100);
      enterMode(O.mode());
    } else {
      T.on = false; clearInterval(T.timer); T.timer = 0; T.mode = null;
      if (snap) {                                    // 還原成「剛按下老師講解」那一刻
        Object.assign(O.params.shadow, snap.shadow); Object.assign(O.params.pinhole, snap.pinhole); Object.assign(O.params.quiz, snap.quiz);
        snap = null; O.init();
      }
    }
  };
})();
</script>
