<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 光學｜光的直進與針孔成像</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --chalk-gray: #a0aec0;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 20px;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1300px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; letter-spacing: 0.15em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-size: 2.3rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 1rem; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-size: 1.3rem; margin: 0 0 14px; font-weight: 700;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    /* 分頁按鈕：簡明扼要、無數字編號 */
    .mode-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 1.05rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 14px 10px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: center;
    }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.4); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 16px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 6px; background: transparent; cursor: pointer; }

    .presets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .presets span { font-size: 0.9rem; color: var(--chalk-dim); margin-right: 4px; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 1px dashed var(--chalk-dim);
      color: var(--chalk); padding: 6px 14px; border-radius: 18px; font-size: 0.9rem; cursor: pointer; transition: all .15s;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 10px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 12px 10px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 0.9rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; color: var(--chalk-yellow); font-weight: 700; margin-top: 4px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 16px 20px; }
    .explain-box h3 { color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.2rem; font-weight: 700; }
    .explain-box p { margin: 0; font-size: 1rem; line-height: 1.6; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 10px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 700; display: inline-block; margin: 4px 0; font-style: italic; }

    .quiz-box { background: rgba(95, 176, 255, 0.1); border: 1px dashed var(--x-color); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .quiz-box h4 { margin: 0 0 8px 0; color: var(--x-color); font-size: 1.1rem; font-weight: 700; }
    .quiz-box p { margin: 6px 0; font-size: 1rem; line-height: 1.6; }
    
    footer { text-align: center; color: var(--chalk-dim); font-size: 0.85rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Curriculum</div>
      <h1>光的直進與針孔成像</h1>
      <p>透過光學滑軌模擬器，觀察光源、障礙物與屏幕的相對位置，視覺化探索光的直線前進、影子生成與成像規律。</p>
    </header>

    <div class="board">
      <h2>選擇互動單元</h2>
      <div class="mode-switch">
        <button class="active" data-mode="shadow">光的直進與影子</button>
        <button data-mode="pinhole">針孔光學模擬</button>
        <button data-mode="quiz">考題實戰</button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>
      <div class="visual-card">
        <svg id="visualSvg" viewBox="-300 -160 600 320"></svg>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>重點觀念與解析</h2>
      <div id="quizContainer"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer>國中自然 光學單元 視覺化黑板教材</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const visualSvg = document.getElementById('visualSvg');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const quizContainer = document.getElementById('quizContainer');

      let currentMode = 'shadow';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const params = {
        shadow: { lightSize: 14, objHeight: 60 },
        pinhole: { objX: -100, holeX: 0, screenX: 100, h: 40, holes: '1' },
        quiz: { holeX: -50 }
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { for (let key in attrs) el.setAttribute(key, attrs[key]); }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal') {
          const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC' });
          t.innerHTML = txt;
          parent.appendChild(t);
      }

      function initUI() {
        quizContainer.innerHTML = '';
        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        presetsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, label, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${label} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            let newVal = parseFloat(e.target.value);
            newVal = onChange(newVal);
            e.target.value = newVal;
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            updateSimulation();
          });
        };

        if (m === 'shadow') {
          addSlider('lightSize', '光源大小 (點光源 ↔ 擴展光源)', 2, 36, 2, p.lightSize, 'cm', v => { p.lightSize = v; return v; });
          addSlider('objHeight', '障礙物大小', 30, 90, 5, p.objHeight, 'cm', v => { p.objHeight = v; return v; });
        } else if (m === 'pinhole') {
          addSlider('objX', '物體位置 (左側)', -250, -20, 5, p.objX, 'cm', v => {
            p.objX = v;
            if(p.holeX <= p.objX + 10) { p.holeX = p.objX + 10; document.getElementById('inp_holeX').value = p.holeX; document.getElementById('val_holeX').textContent = p.holeX + ' cm'; }
            return v;
          });
          addSlider('holeX', '針孔位置', -200, 200, 5, p.holeX, 'cm', v => {
            let val = v;
            if(val <= p.objX + 10) val = p.objX + 10;
            if(val >= p.screenX - 10) val = p.screenX - 10;
            p.holeX = val; return val;
          });
          addSlider('screenX', '屏幕位置 (右側)', 20, 250, 5, p.screenX, 'cm', v => {
            p.screenX = v;
            if(p.holeX >= p.screenX - 10) { p.holeX = p.screenX - 10; document.getElementById('inp_holeX').value = p.holeX; document.getElementById('val_holeX').textContent = p.holeX + ' cm'; }
            return v;
          });
          
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>紙板孔洞類型 <span class="val">點擊切換</span></label>
            <div style="display:flex; gap:8px; margin-top:4px;">
              <button type="button" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === '1' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '1' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:0.95rem;" onclick="setHole('1')">1洞</button>
              <button type="button" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === '2' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '2' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:0.95rem;" onclick="setHole('2')">2洞</button>
              <button type="button" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === '3' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === '3' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:0.95rem;" onclick="setHole('3')">3洞</button>
              <button type="button" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.holes === 'large' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.holes === 'large' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:0.95rem;" onclick="setHole('large')">大洞</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setHole = (val) => { p.holes = val; renderControls(); updateSimulation(); };
          
        } else if (m === 'quiz') {
          addSlider('holeX', '移動針孔位置解答', -90, 90, 2, p.holeX, 'cm', v => { p.holeX = v; return v; });
          
          quizContainer.innerHTML = `
            <div class="quiz-box">
              <h4>隨堂考題挑戰</h4>
              <p><b>題目一：</b>原本物高 8cm，物距 10cm。請問屏幕放在另一側距離針孔多少距離時，像高會變成 24cm？</p>
              <p><b>題目二：</b>承上題，針孔要向何處移動，成像大小會變成物體高的 4 倍大？</p>
            </div>
          `;
        }
      }

      function renderPresets() {
        if(currentMode !== 'pinhole') return;
        presetsBox.innerHTML = '<span>快速設定：</span>';
        const p = params.pinhole;
        const addBtn = (label, action) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = () => { action(); renderControls(); updateSimulation(); };
          presetsBox.appendChild(b);
        };
        addBtn('1:1 等大成像', () => { p.objX = -100; p.holeX = 0; p.screenX = 100; });
        addBtn('針孔近物 (像放大)', () => { p.objX = -100; p.holeX = -50; p.screenX = 100; });
        addBtn('針孔遠物 (像縮小)', () => { p.objX = -100; p.holeX = 50; p.screenX = 100; });
      }

      function updateSimulation() {
        visualSvg.innerHTML = '';
        statsGrid.innerHTML = '';
        const m = currentMode;
        
        visualSvg.appendChild(createSvgEl('line', { x1: -280, y1: 0, x2: 280, y2: 0, stroke: 'var(--chalk-dim)', 'stroke-width': 1, 'stroke-dasharray': '5 5', opacity: 0.5 }));
        
        const addStat = (k, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'shadow') {
          const p = params.shadow;
          const lightX = -200, objX = -50, screenX = 200;
          
          visualSvg.appendChild(createSvgEl('circle', { cx: lightX, cy: 0, r: p.lightSize, fill: '#f2d675', filter: 'drop-shadow(0 0 10px rgba(242, 214, 117, 0.8))' }));
          addText(visualSvg, lightX, p.lightSize + 24, p.lightSize <= 4 ? '點光源' : '擴展光源', 'middle', '#f2d675', 15, 'bold');
          
          visualSvg.appendChild(createSvgEl('rect', { x: objX - 10, y: -p.objHeight/2, width: 20, height: p.objHeight, fill: '#5c4a33' }));
          addText(visualSvg, objX, p.objHeight/2 + 24, '不透明物體', 'middle', '#c9c2ab', 15);
          
          visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: -150, x2: screenX, y2: 150, stroke: '#ffffff', 'stroke-width': 6 }));
          
          const topLight = -p.lightSize, botLight = p.lightSize;
          const topObj = -p.objHeight/2, botObj = p.objHeight/2;
          
          const drawRay = (y1, y2, opacity) => {
            const slope = (y2 - y1) / (objX - lightX);
            const yAtScreen = y1 + slope * (screenX - lightX);
            visualSvg.appendChild(createSvgEl('line', { x1: lightX, y1: y1, x2: screenX, y2: yAtScreen, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));
            return yAtScreen;
          };

          const s1 = drawRay(topLight, topObj, 0.45); 
          const s2 = drawRay(botLight, botObj, 0.45); 
          const s3 = drawRay(topLight, botObj, 0.45); 
          const s4 = drawRay(botLight, topObj, 0.45); 

          const umbraTop = Math.max(s1, s4);
          const umbraBot = Math.min(s2, s3);
          const penumbraTop = Math.min(s1, s4);
          const penumbraBot = Math.max(s2, s3);
          
          // 畫半影區 (灰色)
          if (penumbraTop < umbraTop && Math.abs(umbraTop - penumbraTop) > 4) {
              visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: penumbraTop, x2: screenX, y2: umbraTop, stroke: '#8899a6', 'stroke-width': 8 }));
              addText(visualSvg, screenX + 15, (penumbraTop + umbraTop)/2 + 6, '半影區', 'start', 'var(--chalk-gray)', 15, 'bold');
          }
          if (umbraBot < penumbraBot && Math.abs(penumbraBot - umbraBot) > 4) {
              visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: umbraBot, x2: screenX, y2: penumbraBot, stroke: '#8899a6', 'stroke-width': 8 }));
              addText(visualSvg, screenX + 15, (umbraBot + penumbraBot)/2 + 6, '半影區', 'start', 'var(--chalk-gray)', 15, 'bold');
          }

          // 畫本影區 (物理定義完全無光，必定為純黑 #000000)
          if (umbraTop < umbraBot) {
              visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: umbraTop, x2: screenX, y2: umbraBot, stroke: '#000000', 'stroke-width': 8 }));
              addText(visualSvg, screenX + 15, (umbraTop + umbraBot)/2 + 6, '本影區', 'start', 'var(--v-color)', 16, 'bold');
          }
          
          explainBox.innerHTML = `
            <h3>光的直進與影子的生成</h3>
            <p>當光在均勻介質中直線前進遇到障礙物時，後方光線完全被遮擋、到達不了的純黑區域稱為「<b>本影區</b>」。<br>
            當光源體積較大（擴展光源），本影區上下兩側只有部分光線被遮擋的灰色過渡地帶，則稱為「<b>半影區</b>」。隨著光源變大，半影區範圍會跟著明顯增加！</p>
          `;
          
        } else if (m === 'pinhole' || m === 'quiz') {
          
          let pVal, qVal, objH, holePositions = [0], isLargeHole = false;
          let objX, screenX, holeX;

          if (m === 'pinhole') {
            const p = params.pinhole;
            objX = p.objX; holeX = p.holeX; screenX = p.screenX; objH = p.h;
            pVal = holeX - objX; qVal = screenX - holeX;
            const hType = p.holes;
            if (hType === '2') holePositions = [-25, 25];
            else if (hType === '3') holePositions = [-30, 0, 30];
            else if (hType === 'large') { isLargeHole = true; holePositions = [-15, -10, -5, 0, 5, 10, 15]; }
          } else if (m === 'quiz') {
            const p = params.quiz;
            const SCALE = 5;
            objH = 8 * SCALE; 
            objX = -100; screenX = 100; holeX = p.holeX;
            pVal = holeX - objX; qVal = screenX - holeX;
          }

          visualSvg.appendChild(createSvgEl('line', { x1: holeX, y1: -140, x2: holeX, y2: 140, stroke: '#8f8a80', 'stroke-width': 4 }));
          holePositions.forEach(hy => {
              const hs = isLargeHole ? 35 : 12;
              visualSvg.appendChild(createSvgEl('line', { x1: holeX, y1: hy - hs/2, x2: holeX, y2: hy + hs/2, stroke: 'var(--board-dark)', 'stroke-width': 6 }));
          });
          addText(visualSvg, holeX - 5, -120, '針孔', 'end', '#8f8a80', 14, 'bold');

          visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: -140, x2: screenX, y2: 140, stroke: '#ffffff', 'stroke-width': 6, opacity: 0.9 }));
          addText(visualSvg, screenX + 10, -120, '屏幕', 'start', '#ffffff', 14, 'bold');
          
          visualSvg.appendChild(createSvgEl('line', { x1: objX, y1: 0, x2: objX, y2: -objH, stroke: '#ef6a5a', 'stroke-width': 6, 'stroke-linecap': 'round' }));
          visualSvg.appendChild(createSvgEl('polygon', { points: `${objX},-${objH+8} ${objX-6},-${objH-2} ${objX+6},-${objH-2}`, fill: '#ef6a5a' }));
          
          let mainImgH = 0;
          let topImgY_master = 0;
          let botImgY_master = 0;
          let imgColorMaster = '';

          holePositions.forEach((hy, idx) => {
              const opacity = isLargeHole ? 0.15 : 0.6;
              const topSlope = (hy - (-objH)) / (holeX - objX);
              const topImgY = hy + topSlope * (screenX - holeX);
              visualSvg.appendChild(createSvgEl('line', { x1: objX, y1: -objH, x2: screenX, y2: topImgY, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));

              const botSlope = (hy - 0) / (holeX - objX);
              const botImgY = hy + botSlope * (screenX - holeX);
              visualSvg.appendChild(createSvgEl('line', { x1: objX, y1: 0, x2: screenX, y2: botImgY, stroke: '#f2d675', 'stroke-width': 1.5, opacity: opacity }));

              const imgColor = isLargeHole ? 'rgba(95, 176, 255, 0.2)' : '#5fb0ff';
              visualSvg.appendChild(createSvgEl('line', { x1: screenX, y1: botImgY, x2: screenX, y2: topImgY, stroke: imgColor, 'stroke-width': 6, 'stroke-linecap': 'round' }));
              visualSvg.appendChild(createSvgEl('polygon', { points: `${screenX},${topImgY+8} ${screenX-6},${topImgY-2} ${screenX+6},${topImgY-2}`, fill: imgColor }));
              
              if (hy === 0 || idx === 0) {
                mainImgH = Math.abs(topImgY - botImgY);
                topImgY_master = topImgY;
                botImgY_master = botImgY;
                imgColorMaster = isLargeHole ? '#5fb0ff' : imgColor;
              }
          });

          visualSvg.appendChild(createSvgEl('path', { d: `M ${objX},130 L ${holeX},130`, stroke: 'var(--chalk-dim)', 'stroke-width': 1, fill: 'none', 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)' }));
          visualSvg.appendChild(createSvgEl('path', { d: `M ${holeX},130 L ${screenX},130`, stroke: 'var(--chalk-dim)', 'stroke-width': 1, fill: 'none', 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)' }));
          
          let trueP = pVal, trueQ = qVal, trueObjH = objH, trueImgH = mainImgH;
          if (m === 'quiz') {
             trueP = pVal / 5; trueQ = qVal / 5; trueObjH = 8; trueImgH = mainImgH / 5;
          }

          addText(visualSvg, (objX+holeX)/2, 148, `p = ${trueP.toFixed(1)}`, 'middle', 'var(--chalk-dim)', 14);
          addText(visualSvg, (holeX+screenX)/2, 148, `q = ${trueQ.toFixed(1)}`, 'middle', 'var(--chalk-dim)', 14);

          addText(visualSvg, objX - 15, -objH/2 + 5, `${trueObjH.toFixed(1)} cm`, 'end', '#ef6a5a', 15, 'bold');
          if (mainImgH > 0 && !isLargeHole) {
              addText(visualSvg, screenX + 15, (topImgY_master + botImgY_master)/2 + 5, `${trueImgH.toFixed(1)} cm`, 'start', imgColorMaster, 15, 'bold');
          }

          visualSvg.innerHTML += `
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 2 L 10 5 L 0 8 z" fill="var(--chalk-dim)" />
                </marker>
            </defs>
          `;

          const mag = (trueQ / trueP).toFixed(2);
          addStat('物距 <span style="font-family:JetBrains Mono">p</span>', `${trueP.toFixed(1)} cm`);
          addStat('像距 <span style="font-family:JetBrains Mono">q</span>', `${trueQ.toFixed(1)} cm`);
          addStat('物高 <span style="font-family:JetBrains Mono">h<sub>o</sub></span>', `${trueObjH.toFixed(1)} cm`);
          addStat('像高 <span style="font-family:JetBrains Mono">h<sub>i</sub></span>', `${trueImgH.toFixed(1)} cm`);
          addStat('倍率 <span style="font-family:JetBrains Mono">M</span>', `${mag} 倍`);

          if (m === 'pinhole') {
            let extra = '';
            if (params.pinhole.holes === '2') extra = '兩個孔洞會各自獨立成像，在屏幕上形成<b>兩個互不干擾的倒立實像</b>。';
            else if (params.pinhole.holes === '3') extra = '三個孔洞會形成<b>三個獨立的倒立實像</b>，且排列形狀與孔洞方向完全上下顛倒。';
            else if (params.pinhole.holes === 'large') extra = '大孔可視為無數微小孔洞的集合。無數倒立實像互相交疊，造成<b>成像邊緣模糊</b>，最終輪廓甚至會接近孔洞本身的形狀，但整體亮度增加。';

            explainBox.innerHTML = `
              <h3>針孔成像幾何規律</h3>
              <p>光線直進穿過小孔，在屏幕上形成<b>倒立實像</b>。利用相似三角形原理，可得必考比例公式：<span class="formula-highlight">h<sub>i</sub> / h<sub>o</sub> = q / p</span>。<br>
              當物距 (p) 小於像距 (q) 時，成像放大；反之則縮小。<br>
              ${extra ? '<br>'+extra : ''}</p>
            `;
          } else if (m === 'quiz') {
            explainBox.innerHTML = `
              <h3>隨堂測驗解答與觀念解析</h3>
              <p><b>題目一解析：</b>根據公式 <span class="formula-highlight">h<sub>i</sub> / h<sub>o</sub> = q / p</span>，物長 h<sub>o</sub> = 8，物距 p = 10，像長 h<sub>i</sub> = 24。代入公式 24 / 8 = q / 10，解得像距 <b>q = 30 cm</b>。</p>
              <p><b>題目二解析：</b>物屏總距離固定為 p + q = 10 + 30 = 40 cm。若像高變成 4 倍，代表 q = 4p。<br>
              代入總長度：p + 4p = 40，解得 <b>p = 8 cm</b>。<br>
              原本物距為 10 cm，現在變為 8 cm，代表<b>針孔需向物體方向移動 2 cm</b>。</p>
            `;
          }
        }
      }

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
