<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-zh="國中自然 光學｜平面鏡成像與反射定律 黑板模擬器" data-en="Optics | Plane Mirror Imaging & Reflection Laws Simulator">國中自然 光學｜平面鏡成像與反射定律 黑板模擬器</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board: #1c3d34;
      --board-dark: #11261f;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #fde047;
      --chalk-green: #4ade80;
      --chalk-pink: #f472b6;
      --chalk-blue: #38bdf8;
      --chalk-gray: #9fb0a8;
      --chalk-orange: #fb923c;
      --chalk-cyan: #55e9ff;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 20px;
      padding-bottom: 60px;
    }

    /* 🌟 V5 規範：電影式單元封面 */
    body.intro-locked { overflow: hidden; }
    .intro-screen {
        position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
        overflow: hidden; background: #03130f; cursor: pointer; isolation: isolate;
        transition: opacity .7s ease, visibility .7s ease;
    }
    .intro-screen::before {
        content: ""; position: absolute; inset: -3%; z-index: -3;
        /* 👇 老師，圖檔名稱在這裡改！大約第 48~50 行 */
        background: url("optics_2_cover.png") center/cover no-repeat;
        animation: introZoom 9s ease-out both;
        filter: brightness(0.65) contrast(1.1) saturate(1.1);
    }
    .intro-screen::after {
        content: ""; position: absolute; inset: 0; z-index: -2;
        background: radial-gradient(circle, rgba(1,11,11,0) 40%, rgba(1,12,10,0.7) 100%);
        pointer-events: none;
    }
    .intro-screen.exiting { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes introZoom { from { transform: scale(1); } to { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .intro-screen::before { animation: none; } }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: row; align-items: center; gap: 8px;
      padding: 8px 12px; border: 2px solid var(--chalk-blue); border-radius: 12px;
      background: rgba(17, 38, 31, 0.95); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lang-label { color: var(--chalk-blue); font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; user-select: none; margin-left: 4px; }
    .lang-options { display: flex; flex-direction: row; gap: 4px; }
    .lang-pill {
      min-width: 60px; min-height: 48px; padding: 6px 12px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 8px;
      background: transparent; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation;
    }
    .lang-pill.active { background: var(--chalk-blue) !important; color: #0b1a15 !important; border-color: var(--chalk-blue) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .wrap { max-width: 1080px; margin: 60px auto 20px; padding: 0 16px; }
    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.15em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-size: 38px; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); color: var(--chalk-yellow); }
    header p { color: var(--chalk-green); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 21px; font-weight: bold; }

    /* 🌟 V5 曉臻老師專屬 Hook 區塊 */
    .hook-box { 
        display: flex; align-items: center; gap: 18px;
        background: linear-gradient(135deg, rgba(85, 233, 255, 0.12), rgba(85, 233, 255, 0.02)); 
        border-left: 6px solid var(--chalk-cyan); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; 
        box-shadow: 0 4px 20px rgba(85, 233, 255, 0.08);
        border-right: 1px solid rgba(85, 233, 255, 0.1); border-bottom: 1px solid rgba(85, 233, 255, 0.1); border-top: 1px solid rgba(85, 233, 255, 0.1);
    }
    .xiaozhen-logo { width: 64px; height: 64px; border-radius: 50%; background-color: var(--board); border: 3px solid var(--chalk-cyan); display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; box-shadow: 0 0 15px rgba(85, 233, 255, 0.4); overflow: hidden; }
    .hook-content { flex: 1; line-height: 1.6; }
    .hook-title { color: var(--chalk-cyan); font-size: 22px; font-weight: 900; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .hook-text { color: #fff; font-size: 20px; font-weight: bold; }

    .board {
      background: var(--board); border: 10px solid var(--frame); border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px; margin-bottom: 20px; position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }
    .board h2 { font-size: 28px; margin: 0 0 16px; font-weight: 700; color: var(--chalk-yellow); }

    /* 模式切換按鈕 */
    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 20px; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.25);
      padding: 12px; min-height: 64px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
      touch-action: manipulation;
    }
    .mode-switch button span.sub { font-size: 15px; font-weight: 400; opacity: 0.8; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.5); color: var(--chalk); }
    .mode-switch button.active { background: var(--chalk-blue); color: var(--board-dark); border-color: var(--chalk-blue); border-style: solid; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25); }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.9; font-weight: 600; }

    /* 遊戲區專用輸入框與按鈕 */
    .custom-input { background: rgba(0, 0, 0, 0.5) !important; border: 2px solid var(--chalk-blue) !important; color: var(--chalk-yellow) !important; font-size: 24px; font-family: 'JetBrains Mono', monospace; padding: 8px 12px; border-radius: 8px; width: 100%; text-align: center; font-weight: bold; }
    .custom-input:focus { outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); background: rgba(255,255,255,0.1); }
    
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
    .btn-group button {
      all: unset; display: inline-flex; flex: 1; align-items: center; justify-content: center;
      min-height: 48px; padding: 8px 12px; border: 2px solid var(--chalk-blue) !important;
      background: rgba(0, 0, 0, 0.5) !important; color: var(--chalk-blue) !important;
      border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; touch-action: manipulation; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif;
      white-space: nowrap;
    }
    .btn-group button:hover, .btn-group button.active { background: var(--chalk-blue) !important; color: var(--board-dark) !important; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 16px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 20px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }

    .presets { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .presets span { font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 2px dashed var(--chalk-dim);
      color: var(--chalk); padding: 10px 18px; min-height: 48px; border-radius: 18px; font-size: 20px; cursor: pointer; transition: all .15s; font-weight: bold; touch-action: manipulation;
      white-space: nowrap;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 16px; touch-action: none; }
    
    /* 🌟 SVG 等比例防禦 */
    svg { width: 100%; height: auto; display: block; overflow: visible; aspect-ratio: 600 / 350; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 14px 10px; text-align: center; border: 1px dashed var(--chalk-dim); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--chalk-yellow); font-weight: 700; margin-top: 8px; }
    
    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 16px 20px; }
    .explain-box h3 { color: var(--chalk-yellow); margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); }
    .formula-highlight { background: rgba(242, 214, 117, 0.15); padding: 4px 12px; border-radius: 6px; color: var(--chalk-yellow); display: inline-flex; margin: 6px 0; font-family: 'JetBrains Mono', monospace; font-weight: bold;}

    /* 拖拉物件樣式 */
    .draggable-prop { cursor: grab; }
    .draggable-prop:active { cursor: grabbing; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 20px; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; font-weight: bold; }

    @media (max-width: 768px) {
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
      .mode-switch { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="intro-locked">

  <!-- 🌟 V5 電影式開場動畫 -->
  <div id="introScreen" class="intro-screen" role="dialog" aria-modal="true" aria-label="單元封面" tabindex="0"></div>

  <!-- 🌟 右上角橫向懸浮雙語切換器 -->
  <div class="floating-lang-container">
    <span class="lang-label">Language</span>
    <div class="lang-options">
      <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
      <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 4-2</div>
      <h1 data-zh="光學二：平面鏡成像與反射定律" data-en="Optics 2: Plane Mirror Imaging & Reflection Laws">光學二：平面鏡成像與反射定律</h1>
      <p data-zh="從互動魔鏡遊戲、基礎光路圖，到考試大魔王「全身鏡迷思」與「三面鏡相對運動」。五大模組一次到位！" data-en="From interactive mirror games and ray tracing to the 'full-body mirror' myth and 'three mirrors' relative motion!">從互動魔鏡遊戲、基礎光路圖，到考試大魔王「全身鏡迷思」與「三面鏡相對運動」。五大模組一次到位！</p>
    </header>

    <!-- 🌟 V5 曉臻老師專屬 Hook 區塊 -->
    <div class="hook-box" id="hookBox">
        <!-- JS 動態生成 -->
    </div>

    <div class="board">
      <h2 data-zh="選擇互動教學模式" data-en="Select Interactive Mode">選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="playground">
          <span data-zh="✨ 互動魔鏡遊戲" data-en="✨ Magic Mirror Game">✨ 互動魔鏡遊戲</span>
          <span class="sub" data-zh="親手放道具玩反射！" data-en="Place props and see the magic">親手放道具玩反射！</span>
        </button>
        <button data-mode="plane_and_reflection">
          <span data-zh="📐 反射定律與平面鏡" data-en="📐 Reflection & Plane Mirror">📐 反射定律與平面鏡</span>
          <span class="sub" data-zh="光路圖與反射角" data-en="Ray tracing & Angles">光路圖與反射角</span>
        </button>
        <button data-mode="curved_mirror">
          <span data-zh="🥣 曲面鏡與視野" data-en="🥣 Curved Mirrors">🥣 曲面鏡與視野</span>
          <span class="sub" data-zh="平、凸、凹面鏡特性" data-en="Plane, Convex, Concave">平、凸、凹面鏡特性</span>
        </button>
        <button data-mode="applications">
          <span data-zh="🏆 綜合應用" data-en="🏆 Applications">🏆 綜合應用</span>
          <span class="sub" data-zh="全身鏡與三面鏡運動" data-en="Full-body & 3-Mirrors">全身鏡與三面鏡運動</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>
      
      <div class="visual-card">
        <svg id="visualSvg" viewBox="0 0 1000 400">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
              <path d="M 0 2 L 10 5 L 0 8 z" fill="var(--chalk-dim)" />
            </marker>
          </defs>
          <g id="drawLayer"></g>
        </svg>
      </div>
      
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2 data-zh="課堂重點與原理解析" data-en="Key Concepts & Analysis">課堂重點與原理解析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer data-zh="國中理化 光學單元 · 視覺化互動教學教材" data-en="Junior High Science Optics · Interactive Blackboard">國中理化 光學單元 · 視覺化互動教學教材</footer>
  </div>

  <script>
    (function() {
      // 🌟 V5 開場動畫控制
      const introScreen = document.getElementById('introScreen');
      let introClosed = false;
      function enterLesson() {
          if (introClosed) return;
          introClosed = true;
          introScreen.classList.add('exiting');
          document.body.classList.remove('intro-locked');
          setTimeout(() => introScreen.remove(), 800);
      }
      introScreen.addEventListener('click', enterLesson);

      let currentLang = 'zh';
      let currentMode = 'playground'; 
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const drawLayer = document.getElementById('drawLayer');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');

      // 🌟 狀態管理：加入 applications 子模式，全面啟用小數點座標
      const params = {
        playground: { prop: 'text', text: 'AMBULANCE', time: '12:05', mirror: 'plane', objX: 250, objY: 200 },
        plane_and_reflection: { subMode: 'reflection' }, // 🌟 預設為雷射槍(反射定律)
        plane_mirror: { objX: 250, objY: 180 }, 
        reflection: { laserX: 250, laserY: 50 },
        curved_mirror: { focalX: 350 }, 
        applications: { subMode: 'full_body' }, 
        full_body: { objX: 400 }, 
        three_mirrors: { objX: 500, objY: 240 }
      };

      const hooks = {
          'playground': {
              zh: "有沒有注意過，救護車車頭印的「AMBULANCE」都是左右寫反的？你知道為什麼要這樣設計嗎？",
              en: "Ever noticed that 'AMBULANCE' on the front of the vehicle is written backwards? Do you know why?"
          },
          'plane_mirror': {
              zh: "看著鏡子裡的你，那真的是『你』嗎？如果鏡子裡的你伸出右手，那是你現實中的哪一隻手？",
              en: "Looking at yourself in the mirror, is that really 'you'? If your reflection reaches out its right hand, which hand is it in reality?"
          },
          'reflection': {
              zh: "拿雷射筆照鏡子時，如果想精準反射並射中旁邊的目標，你的雷射筆要怎麼瞄準才對？",
              en: "When shining a laser at a mirror to hit a target nearby, how exactly do you aim the laser?"
          },
          'curved_mirror': {
              zh: "山路轉角的大圓鏡，還有超商角落的防盜鏡，為什麼都能讓我們看到超寬廣的死角？",
              en: "Why do large round mirrors at mountain curves and convenience store corners let us see huge blind spots?"
          },
          'full_body': {
              zh: "在房間照鏡子發現看不到全身，退後兩步真的就能看到了嗎？千萬別被你的眼睛騙了！",
              en: "If you can't see your whole body in a mirror, will stepping back help? Don't let your eyes fool you!"
          },
          'three_mirrors': {
              zh: "在服飾店的「Ｕ型三面鏡」前試穿衣服，當你往右邊走時，裡面那三個分身會怎麼跑？這題空間感魔王題誰能解？",
              en: "Trying clothes in front of a U-shaped three-way mirror. When you step right, where do your 3 clones go? Can you solve this spatial puzzle?"
          }
      };

      function updateHookBox() {
          const hookBox = document.getElementById('hookBox');
          let mode = currentMode;
          // 解析子分頁的 Hook
          if (mode === 'applications') mode = params.applications.subMode;
          if (mode === 'plane_and_reflection') mode = params.plane_and_reflection.subMode;

          if(hookBox && hooks[mode]) {
              const titleText = currentLang === 'en' ? "👩🏻‍🏫 Teacher Xiaozhen says:" : "👩🏻‍🏫 曉臻老師說：";
              const contentText = currentLang === 'en' ? hooks[mode].en : hooks[mode].zh;
              hookBox.innerHTML = `<div class="xiaozhen-logo">👩🏻‍🏫</div><div class="hook-content"><div class="hook-title">${titleText}</div><div class="hook-text">${contentText}</div></div>`;
          }
      }

      function tr(zh, en) { return currentLang === 'en' ? en : zh; }

      window.setLang = function(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
        document.querySelectorAll('[data-zh][data-en]').forEach(el => { el.innerHTML = el.getAttribute(`data-${lang}`); });
        initUI();
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { 
          for (let key in attrs) {
            if (key === 'style') el.style.cssText = attrs[key];
            else el.setAttribute(key, attrs[key]);
          }
        }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal', style='') {
        const t = createSvgEl('text', { x: x, y: y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC, sans-serif' });
        if(style) t.style.cssText = style;
        t.textContent = txt;
        parent.appendChild(t);
      }

      // 送出事件綁定
      window.submitText = () => { params.playground.text = document.getElementById('propTextInput').value; updateSimulation(); };
      window.submitTime = () => { params.playground.time = document.getElementById('propTimeInput').value; updateSimulation(); };
      window.setPlayground = (key, val) => { params.playground[key] = val; renderControls(); updateSimulation(); };

      // 子分頁切換控制
      window.setAppSubMode = (mode) => {
         params.applications.subMode = mode;
         renderControls(); updateHookBox(); updateSimulation();
      };
      window.setPlaneSubMode = (mode) => {
         params.plane_and_reflection.subMode = mode;
         renderControls(); updateHookBox(); updateSimulation();
      };

      // 🌟 SVG 全自由 2D 拖拉機制 (移除所有 Range Bar)
      let isDraggingProp = false;
      document.getElementById('visualSvg').addEventListener('mousedown', (e) => { if (e.target.closest('.draggable-prop')) { isDraggingProp = true; e.preventDefault(); } });
      document.getElementById('visualSvg').addEventListener('touchstart', (e) => { if (e.target.closest('.draggable-prop')) { isDraggingProp = true; e.preventDefault(); } }, {passive: false});

      window.addEventListener('mousemove', (e) => { if (!isDraggingProp) return; handleDrag(e.clientX, e.clientY); });
      window.addEventListener('touchmove', (e) => { if (!isDraggingProp) return; handleDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});

      window.addEventListener('mouseup', () => { isDraggingProp = false; });
      window.addEventListener('touchend', () => { isDraggingProp = false; });

      function handleDrag(clientX, clientY) {
          const svg = document.getElementById('visualSvg');
          const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
          const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
          let newX = svgP.x, newY = svgP.y;

          let activeMode = currentMode;
          if (activeMode === 'applications') activeMode = params.applications.subMode;
          if (activeMode === 'plane_and_reflection') activeMode = params.plane_and_reflection.subMode;

          if (activeMode === 'playground') {
              const p = params.playground;
              if (newX > 360) newX = 360; if (newX < 50) newX = 50;
              if (newY < 50) newY = 50; if (newY > 350) newY = 350;
              p.objX = newX; p.objY = newY;
          } else if (activeMode === 'plane_mirror') {
              const p = params.plane_mirror;
              if (newX > 400) newX = 400; if (newX < 50) newX = 50;
              if (newY > 350) newY = 350; if (newY < 150) newY = 150;
              p.objX = newX; p.objY = newY;
          } else if (activeMode === 'reflection') {
              const p = params.reflection;
              if (newX > 950) newX = 950; if (newX < 50) newX = 50;
              if (newY > 240) newY = 240; if (newY < 20) newY = 20; 
              p.laserX = newX; p.laserY = newY;
          } else if (activeMode === 'curved_mirror') {
              const p = params.curved_mirror;
              if (newX > 900) newX = 900; if (newX < 100) newX = 100;
              p.focalX = newX;
          } else if (activeMode === 'full_body') {
              const p = params.full_body;
              if (newX > 450) newX = 450; if (newX < 50) newX = 50;
              p.objX = newX;
          } else if (activeMode === 'three_mirrors') {
              const p = params.three_mirrors;
              if (newX > 610) newX = 610; if (newX < 390) newX = 390;
              if (newY > 360) newY = 360; if (newY < 160) newY = 160;
              p.objX = newX; p.objY = newY;
          }
          updateSimulation();
      }

      function updateSimulation() {
        while (drawLayer.firstChild) drawLayer.removeChild(drawLayer.firstChild);
        statsGrid.replaceChildren();
        let activeMode = currentMode;
        if (activeMode === 'applications') activeMode = params.applications.subMode;
        if (activeMode === 'plane_and_reflection') activeMode = params.plane_and_reflection.subMode;
        
        const addStat = (kZh, kEn, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${tr(kZh, kEn)}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (activeMode === 'playground') {
          const p = params.playground;
          const mirrorX = 500;
          const objX = p.objX, objY = p.objY;
          const dist = mirrorX - objX;
          
          drawLayer.appendChild(createSvgEl('line', { x1: 50, y1: 300, x2: 950, y2: 300, stroke: 'var(--chalk-dim)', 'stroke-width': 1, 'stroke-dasharray': '5 5' }));
          
          let curveStr = ""; let mag = 1; let mirrorLabel = tr('平面鏡 (等大)', 'Plane Mirror (1:1)');
          
          if(p.mirror === 'concave') {
            curveStr = "Q 450,200 500,320"; mirrorLabel = tr('凹面鏡 (放大)', 'Concave (Magnify)');
            mag = 400 / (400 - dist); if(mag < 0) mag = Math.abs(mag); 
          } else if(p.mirror === 'convex') {
            curveStr = "Q 550,200 500,320"; mirrorLabel = tr('凸面鏡 (縮小)', 'Convex (Shrink)');
            mag = 400 / (400 + dist);
          } else {
            curveStr = "L 500,320"; mag = 1;
          }
          
          const imgX = mirrorX + dist * mag;
          const imgY = 200 + (objY - 200) * mag; 

          drawLayer.appendChild(createSvgEl('path', { d: `M 500,80 ${curveStr}`, fill: 'none', stroke: '#8f8a80', 'stroke-width': 8, 'stroke-linecap': 'round' }));
          addText(drawLayer, 500, 50, mirrorLabel, 'middle', '#8f8a80', 18, 'bold');

          const drawProp = (x, y) => {
            const g = createSvgEl('g', { transform: `translate(${x}, ${y})` });
            if(p.prop === 'text') {
              const t = createSvgEl('text', { x: 0, y: 15, 'text-anchor': 'middle', fill: '#ef6a5a', 'font-size': '50px', 'font-family': "'JetBrains Mono', sans-serif", 'font-weight': 'bold' });
              t.textContent = p.text || '?'; g.appendChild(t);
            } else if (p.prop === 'digital') {
              g.appendChild(createSvgEl('rect', { x: -80, y: -40, width: 160, height: 80, fill: 'var(--board-dark)', stroke: '#ef6a5a', 'stroke-width': 4, rx: 10 }));
              const t = createSvgEl('text', { x: 0, y: 15, 'text-anchor': 'middle', fill: '#4ade80', 'font-size': '45px', 'font-family': "'JetBrains Mono', monospace", 'font-weight': 'bold' });
              t.textContent = p.time || '12:00'; g.appendChild(t);
            } else if (p.prop === 'analog') {
              g.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 60, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 6 }));
              g.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 5, fill: '#ef6a5a' }));
              for(let i=0; i<12; i++) {
                let ang = i * Math.PI/6;
                g.appendChild(createSvgEl('line', { x1: Math.cos(ang)*50, y1: Math.sin(ang)*50, x2: Math.cos(ang)*60, y2: Math.sin(ang)*60, stroke: '#ef6a5a', 'stroke-width': i%3==0?4:2 }));
              }
              let [hr, mn] = (p.time || '12:00').split(':').map(Number);
              let hAng = (hr%12 + mn/60) * Math.PI/6 - Math.PI/2;
              let mAng = mn * Math.PI/30 - Math.PI/2;
              g.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: Math.cos(hAng)*30, y2: Math.sin(hAng)*30, stroke: '#fde047', 'stroke-width': 6, 'stroke-linecap': 'round' }));
              g.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: Math.cos(mAng)*45, y2: Math.sin(mAng)*45, stroke: '#4ade80', 'stroke-width': 4, 'stroke-linecap': 'round' }));
            }
            return g;
          };

          const objGroup = drawProp(objX, objY);
          objGroup.classList.add('draggable-prop');
          objGroup.style.cursor = 'grab';
          
          const hitBox = createSvgEl('rect', { x: -150, y: -80, width: 300, height: 160, fill: 'transparent' });

          const hintG = createSvgEl('g');

          addText(hintG, 0, 125, '↔ ↕ 拖拉我', 'middle', 'var(--chalk-yellow)', 20, 'bold');
          objGroup.appendChild(hintG);

          drawLayer.appendChild(objGroup);
          addText(drawLayer, objX, objY + 160, tr('真實物體', 'Real Object'), 'middle', '#ef6a5a', 18, 'bold');

          const imgGroup = drawProp(0, 0); 
          imgGroup.setAttribute('transform', `translate(${imgX}, ${imgY}) scale(${-mag}, ${mag})`);
          imgGroup.style.opacity = '0.7';
          imgGroup.querySelectorAll('text').forEach(el => { if(el.getAttribute('fill') === '#ef6a5a') el.setAttribute('fill', '#5fb0ff'); });
          imgGroup.querySelectorAll('circle, rect, line').forEach(el => {
            if(el.getAttribute('stroke') === '#ef6a5a') el.setAttribute('stroke', '#5fb0ff');
            if(el.getAttribute('fill') === '#ef6a5a') el.setAttribute('fill', '#5fb0ff');

          addText(drawLayer, imgX, imgY + 160*mag, tr('鏡中虛像', 'Virtual Image'), 'middle', '#5fb0ff', 18, 'bold');

          addStat('物距 (p)', 'Obj Dist (p)', `${dist.toFixed(2)} cm`);
          addStat('像距 (q)', 'Img Dist (q)', `${(dist * mag).toFixed(2)} cm`);
          addStat('鏡面類型', 'Mirror Type', p.mirror === 'plane' ? tr('平面', 'Plane') : (p.mirror === 'concave' ? tr('凹面', 'Concave') : tr('凸面', 'Convex')));
          addStat('成像大小', 'Image Size', p.mirror === 'plane' ? tr('相等', 'Equal') : (p.mirror === 'concave' ? tr('放大', 'Magnified') : tr('縮小', 'Diminished')));

          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：為什麼救護車的字要印反的？</h3>
            <p>1. <b>左右相反</b>：因為照鏡子時，光線是直接反射回來的，所以我們在鏡子裡看到的字都會呈現「左右對稱顛倒」！救護車車頭的字故意印反，就是為了讓前方的駕駛透過「照後鏡」看時，剛好能看到正確的「AMBULANCE」。<br>
            2. <b>時鐘陷阱題</b>：考試最愛考「從鏡子裡看到的時鐘是幾點」。最快的破解法就是：<span class="formula-highlight">真實時間 ＋ 鏡中時間 ＝ 12:00</span>！不信你拿手邊的時鐘試試看！</p>
          `, `
            <h3>💡 Teacher's Analysis: Why is AMBULANCE backwards?</h3>
            <p>1. <b>Left-Right Reversed</b>: In a mirror, light reflects directly back, causing a lateral inversion! Ambulances print it backward so drivers ahead see it correctly in their rearview mirrors.<br>
            2. <b>Clock Trap Trick</b>: Exams love asking "What time is it in the mirror?". The ultimate hack: <span class="formula-highlight">Real Time + Mirror Time = 12:00</span>! Try it yourself!</p>
          `);

        } else if (activeMode === 'reflection') {
          const p = params.reflection;
          const laserX = p.laserX, laserY = p.laserY;
          const cx = 500, cy = 250; 

          drawLayer.appendChild(createSvgEl('line', { x1: 150, y1: cy, x2: 850, y2: cy, stroke: '#8f8a80', 'stroke-width': 6 }));
          for(let i=160; i<=840; i+=30) { drawLayer.appendChild(createSvgEl('line', { x1: i, y1: cy+3, x2: i-15, y2: cy+18, stroke: '#8f8a80', 'stroke-width': 2 })); }
          addText(drawLayer, 180, cy-15, tr('平面鏡', 'Plane Mirror'), 'start', '#8f8a80', 16, 'bold');

          drawLayer.appendChild(createSvgEl('line', { x1: cx, y1: cy, x2: cx, y2: cy-200, stroke: 'var(--chalk-dim)', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
          addText(drawLayer, cx, cy-210, tr('法線', 'Normal Line'), 'middle', 'var(--chalk-dim)', 16);

          let angleRad = Math.atan2(Math.abs(laserX - cx), cy - laserY);
          let angleDeg = (angleRad * 180 / Math.PI);
          
          const refX = cx + (cx - laserX);
          const refY = laserY;

          drawLayer.appendChild(createSvgEl('line', { x1: laserX, y1: laserY, x2: cx, y2: cy, stroke: '#ef6a5a', 'stroke-width': 3 }));
          const midIncX = (laserX + cx) / 2; const midIncY = (laserY + cy) / 2;
          const angleInc = Math.atan2(cy - laserY, cx - laserX) * 180 / Math.PI + 90; 
          drawLayer.appendChild(createSvgEl('polygon', { points: `${midIncX},${midIncY-7} ${midIncX-6},${midIncY+5} ${midIncX+6},${midIncY+5}`, fill: '#ef6a5a', transform: `rotate(${angleInc}, ${midIncX}, ${midIncY})` }));

          const laserGroup = createSvgEl('g');
          laserGroup.classList.add('draggable-prop');
          laserGroup.style.cursor = 'grab';
          laserGroup.appendChild(createSvgEl('circle', { cx: laserX, cy: laserY, r: 40, fill: 'transparent' })); 
          const rotLaser = Math.atan2(cy - laserY, cx - laserX) * 180 / Math.PI;
          laserGroup.appendChild(createSvgEl('rect', { x: laserX-20, y: laserY-10, width: 40, height: 20, fill: '#5fb0ff', rx: 3, transform: `rotate(${rotLaser}, ${laserX}, ${laserY})` }));
          addText(laserGroup, laserX, laserY - 30, '↔ ↕ 拖拉我', 'middle', 'var(--chalk-yellow)', 16, 'bold');
          drawLayer.appendChild(laserGroup);

          drawLayer.appendChild(createSvgEl('line', { x1: cx, y1: cy, x2: refX, y2: refY, stroke: '#f2d675', 'stroke-width': 3 }));
          const midRefX = (cx + refX) / 2; const midRefY = (cy + refY) / 2;
          const angleRef = Math.atan2(refY - cy, refX - cx) * 180 / Math.PI + 90;
          drawLayer.appendChild(createSvgEl('polygon', { points: `${midRefX},${midRefY-7} ${midRefX-6},${midRefY+5} ${midRefX+6},${midRefY+5}`, fill: '#f2d675', transform: `rotate(${angleRef}, ${midRefX}, ${midRefY})` }));

          const arcR = 60;
          const arcIncX = cx - arcR * Math.sin(angleRad) * (laserX < cx ? 1 : -1);
          const arcIncY = cy - arcR * Math.cos(angleRad);
          drawLayer.appendChild(createSvgEl('path', { d: `M ${cx},${cy-arcR} A ${arcR} ${arcR} 0 0 ${laserX < cx ? 0 : 1} ${arcIncX} ${arcIncY}`, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 2 }));
          
          const arcRefX = cx + arcR * Math.sin(angleRad) * (laserX < cx ? 1 : -1);
          drawLayer.appendChild(createSvgEl('path', { d: `M ${cx},${cy-arcR} A ${arcR} ${arcR} 0 0 ${laserX < cx ? 1 : 0} ${arcRefX} ${arcIncY}`, fill: 'none', stroke: '#f2d675', 'stroke-width': 2 }));

          addText(drawLayer, cx - arcR/2 * (laserX<cx?1:-1) - (laserX<cx?10:-10), cy - arcR/2 - 10, `${tr('入射角', 'Incident')} ${angleDeg.toFixed(2)}°`, laserX<cx?'end':'start', '#ef6a5a', 16, 'bold');
          addText(drawLayer, cx + arcR/2 * (laserX<cx?1:-1) + (laserX<cx?10:-10), cy - arcR/2 - 10, `${tr('反射角', 'Reflected')} ${angleDeg.toFixed(2)}°`, laserX<cx?'start':'end', '#f2d675', 16, 'bold');

          addStat('入射角 <i>θ<sub>i</sub></i>', 'Incident Angle <i>θ<sub>i</sub></i>', `${angleDeg.toFixed(2)}°`);
          addStat('反射角 <i>θ<sub>r</sub></i>', 'Reflected Angle <i>θ<sub>r</sub></i>', `${angleDeg.toFixed(2)}°`);
          addStat('光與鏡面夾角', 'Angle with Mirror', `${(90 - angleDeg).toFixed(2)}°`);

          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：反射定律的對稱美學</h3>
            <p>1. <b>入射角＝反射角</b>：光線碰到不透明物體反彈，永遠遵守這個黃金準則。<br>
            2. <b>法線是基準</b>：考試最愛考的陷阱！角度一定要找光線與「法線」的夾角，絕對不是光線跟「鏡面」的夾角喔！</p>
          `, `
            <h3>💡 Teacher's Analysis: Law of Reflection</h3>
            <p>1. <b>Incident Angle = Reflected Angle</b>: Reflection off surfaces strictly obeys this rule.<br>
            2. <b>Normal Line is Reference</b>: Common exam trap! Angles must always be measured relative to the "normal line", never to the "mirror surface"!</p>
          `);

        } else if (activeMode === 'plane_mirror') {

          drawLayer.appendChild(createSvgEl('line', { x1: ballX, y1: ballY, x2: leftImgX, y2: ballY, stroke: '#4ade80', 'stroke-width': 1, 'stroke-dasharray': '4 4', opacity: 0.5 }));

          const rightImgX = rightMirrorX + (rightMirrorX - ballX);
          drawLayer.appendChild(createSvgEl('circle', { cx: rightImgX, cy: ballY, r: 15, fill: '#f2d675', opacity: 0.6 }));
          addText(drawLayer, rightImgX, ballY - 20, tr('像 3', 'Img 3'), 'middle', '#f2d675', 15, 'bold');
          drawLayer.appendChild(createSvgEl('line', { x1: ballX, y1: ballY, x2: rightImgX, y2: ballY, stroke: '#f2d675', 'stroke-width': 1, 'stroke-dasharray': '4 4', opacity: 0.5 }));

          addStat('物體座標 (x, y)', 'Object (x, y)', `(${ballX.toFixed(2)}, ${ballY.toFixed(2)})`);
          addStat('前方像距', 'Front Img Dist', `${Math.abs(ballY - 120).toFixed(2)} cm`);
          addStat('左方像距', 'Left Img Dist', `${Math.abs(ballX - leftMirrorX).toFixed(2)} cm`);
          addStat('右方像距', 'Right Img Dist', `${Math.abs(ballX - rightMirrorX).toFixed(2)} cm`);

          explainBox.innerHTML = tr(`
            <h3>💡 經典試題挑戰：三面鏡相對運動</h3>
            <p>當物體在三面Ｕ型鏡子中間移動時，鏡子裡的 3 個像會怎麼跑？這題是立體空間感的魔王題！<br>
            請直接在畫面上隨意拖拉紅球觀察：<br>
            1. <b>平移不變</b>：平行於鏡面移動時，像距不變，虛像會跟著同方向平移。<br>
            2. <b>垂直反向</b>：垂直遠離或靠近鏡面時，像距改變，虛像會往反方向移動！</p>
          `, `
            <h3>💡 Classic Exam Challenge: Three Mirrors Motion</h3>
            <p>When an object moves between three U-shaped mirrors, where do the 3 images go?<br>
            Drag the red ball anywhere on the board to observe:<br>
            1. <b>Parallel Motion</b>: Moving parallel keeps image distance constant; virtual image moves in same direction.<br>
            2. <b>Perpendicular Motion</b>: Moving away/towards changes image distance; virtual images move in opposite direction!</p>
          `);
        }
      }

      document.querySelectorAll('.mode-switch > button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.mode-switch > button').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          currentMode = e.currentTarget.dataset.mode;
          initUI();
        });
      });

      window.onload = function() {
        setLang('zh'); 
      };
    })();
  </script>
</body>
</html>
