name: Patch kinematics 06-1

on:
  push:
    paths:
      - '.github/workflows/patch-kinematics-06-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal teaching-flow patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kinematics.html')
          s=p.read_text(encoding='utf-8')

          # viewport + baseline iPad/touch/bilingual CSS: additive only
          s=s.replace('<meta name="viewport" content="width=device-width, initial-scale=1.0">','<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">')
          s=s.replace('<title>國中理化：位置、路徑長與位移（PPT互動切換完美版）</title>','<title>06-1｜位置、路徑長與位移｜Position, Distance & Displacement</title>')
          css='''\n        /* README_2 teaching wrapper: do not alter existing SVG/Canvas/physics logic */\n        body { font-size: 20px; }\n        .container { max-width: 1080px; }\n        .floating-lang-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:row;align-items:center;gap:8px;background:#172e21ee;border:2px solid var(--chalk-teal,#64ffda);border-radius:999px;padding:7px 10px}\n        .lang-options{display:flex;flex-direction:row;gap:6px}.lang-label{color:#64ffda;font-weight:bold}.lang-pill{min-width:52px;min-height:44px;border:1.5px solid #64ffda;border-radius:999px;background:transparent;color:#64ffda;font-weight:bold}.lang-pill.active{background:#64ffda;color:#112219}\n        .lesson-intro{text-align:center;padding:0 150px 12px}.lesson-intro h1{margin:0;color:var(--chalk-yellow);font-size:2rem;line-height:1.2}.lesson-intro p{margin:5px 0 0;color:var(--chalk-blue);font-weight:bold}\n        .hook-subtitle{margin:-6px 0 14px;color:#a7f3d0;font-weight:bold}.bridge-box{margin:8px 0 14px;padding:12px 16px;background:rgba(100,255,218,.08);border-left:5px solid #64ffda;border-radius:0 10px 10px 0;font-weight:bold}.bridge-box strong{color:#64ffda}\n        .tab-btn,.nav-page-btn,.action-btn,.reset-btn,.option-btn,.lang-pill{min-height:44px}.tab-btn{font-size:20px}.teacher-text,.example-note,label,.nav-page-btn,.action-btn,.option-btn{font-size:20px}\n        @media(max-width:960px) and (orientation:portrait){body{padding:12px}.lesson-intro{padding:64px 10px 12px}.grid-2{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr 1fr}}\n'''
          s=s.replace('    </style>',css+'    </style>')

          lang='''\n<div class="floating-lang-container">\n  <span class="lang-label">Language</span>\n  <div class="lang-options"><button class="lang-pill active" id="btn-lang-zh" onclick="setLang(\'zh\')">中文</button><button class="lang-pill" id="btn-lang-en" onclick="setLang(\'en\')">EN</button></div>\n</div>\n'''
          s=s.replace('<body>','<body>'+lang,1)
          intro='''\n    <header class="lesson-intro">\n      <h1 data-zh="位置、路徑長與位移" data-en="Position, Distance & Displacement">位置、路徑長與位移</h1>\n      <p data-zh="先知道物體在哪裡，再描述它怎麼移動" data-en="Locate the object first, then describe how it moves">先知道物體在哪裡，再描述它怎麼移動</p>\n    </header>\n'''
          s=s.replace('<div class="container">','<div class="container">'+intro,1)

          # Navigation stays short/professional; hooks live inside pages.
          navmap={
          '❶ 位置的定義':'位置與參考點','❷ 平面座標與颱風':'平面上的位置','❸ 路徑長與位移':'路徑長與位移','❹ 進階應用':'非直線運動','❺ 互動實驗室':'互動實驗室','❻ 隨堂實戰':'隨堂挑戰'}
          for a,b in navmap.items(): s=s.replace('>'+a+'</button>',' data-zh="'+b+'" data-en="'+{'位置與參考點':'Position & Reference Point','平面上的位置':'Position in 2D','路徑長與位移':'Distance & Displacement','非直線運動':'Nonlinear Paths','互動實驗室':'Interactive Lab','隨堂挑戰':'Quick Challenge'}[b]+'">'+b+'</button>')

          # Page 1: position only. Keep the original number-line SVG untouched.
          s=s.replace('<h2>「位置」是什麼？怎麼用數字表示？</h2>','<h2 data-zh="📍「我在 5 公尺的位置！」——等等，從哪裡開始算？" data-en="📍 “I am at 5 meters!”—Wait, measured from where?">📍「我在 5 公尺的位置！」——等等，從哪裡開始算？</h2><p class="hook-subtitle" data-zh="同一句「5 公尺」，參考點不同，位置就可能完全不同。" data-en="The same “5 meters” can mean different positions if the reference point changes.">同一句「5 公尺」，參考點不同，位置就可能完全不同。</p>')
          s=s.replace('                        <li>「位置」描述的是<b>一個點</b>；「位移」描述的是<b>兩個位置之間的變化量</b>。</li>\n','')
          formula='''            <div class="formula-box">\n                <span class="formula-label">位移的定義式（和位置的關係）</span>\n                Δx = x<sub>末</sub> − x<sub>初</sub>\n            </div>\n\n'''
          ex='''            <div class="example-note">\n                <b>小範例：</b>小明原本站在 x₁ = −2 m 處，之後走到 x₂ = +6 m 處。<br>\n                位移 Δx = x₂ − x₁ = (+6) − (−2) = <span class="highlight-green">+8 m</span>（正號代表方向朝右）\n            </div>\n\n'''
          qstart='''            <h3 style="color: var(--chalk-orange); margin-top:24px;">✏️ 練習題：位置與位移的觀念</h3>'''
          qend='''            </div>\n        </div>\n        <div class="footer-nav">'''
          # extract first-page question block by boundaries
          qblock=''
          if qstart in s:
              a=s.index(qstart); b=s.index(qend,a)
              qblock=s[a:b+len('            </div>\n')]
              s=s[:a]+s[b-len('        </div>\n'):] if False else s
          # safer explicit removal of formula/example and question through known footer marker
          s=s.replace(formula,'',1).replace(ex,'',1)
          first_footer='''        <div class="footer-nav">\n            <div></div>\n            <button class="nav-page-btn" onclick="switchSlide(1)">下一頁：平面座標與颱風 ➔</button>\n        </div>'''
          # remove the entire first-page practice block without touching SVG
          a=s.find(qstart)
          f=s.find(first_footer,a)
          if a!=-1 and f!=-1:
              # preserve closing card div immediately before footer
              tail=s.rfind('        </div>',a,f)
              if tail!=-1: s=s[:a]+s[tail:f]+s[f:]

          # Page hooks
          s=s.replace('<h2>應用題組：平面座標與颱風中心位置</h2>','<h2 data-zh="🌀 颱風在哪裡？只說「在臺灣附近」夠不夠？" data-en="🌀 Where is the typhoon? Is “near Taiwan” precise enough?">🌀 颱風在哪裡？只說「在臺灣附近」夠不夠？</h2><p class="hook-subtitle" data-zh="一條數線只能說左右；真實世界的位置，常常需要兩個方向一起描述。" data-en="A number line only gives left-right position; real locations often need two coordinates.">一條數線只能說左右；真實世界的位置，常常需要兩個方向一起描述。</p>')
          s=s.replace('<h2>什麼是路徑長？什麼是位移？</h2>','<h2 data-zh="🏃 繞操場一圈回到原點：明明跑了很遠，位移怎麼會是 0？" data-en="🏃 One lap back to the start: you ran far, so how can displacement be zero?">🏃 繞操場一圈回到原點：明明跑了很遠，位移怎麼會是 0？</h2><p class="hook-subtitle" data-zh="「實際走了多遠」和「最後位置改變多少」需要兩個不同的物理量。" data-en="“How far you traveled” and “how much your position changed” require two different quantities.">「實際走了多遠」和「最後位置改變多少」需要兩個不同的物理量。</p>')
          s=s.replace('<h2>進階應用：當路徑不是直線時</h2>','<h2 data-zh="↪️ 路徑彎來彎去，位移也要跟著繞嗎？" data-en="↪️ If the path bends, does displacement bend too?">↪️ 路徑彎來彎去，位移也要跟著繞嗎？</h2><p class="hook-subtitle" data-zh="路徑長沿著實際軌跡計算；位移始終只連接起點與終點。" data-en="Distance follows the actual path; displacement always connects start to finish.">路徑長沿著實際軌跡計算；位移始終只連接起點與終點。</p>')
          s=s.replace('<h2>觀察折返運動：x-t 圖與數據同步實況</h2>','<h2 data-zh="🎮 先別算！你能先預測折返後的路徑長與位移嗎？" data-en="🎮 Don’t calculate yet—can you predict distance and displacement after turning back?">🎮 先別算！你能先預測折返後的路徑長與位移嗎？</h2><p class="hook-subtitle" data-zh="先預測，再操作；用動畫和數據驗證自己的想法。" data-en="Predict first, then test your idea with the animation and data.">先預測，再操作；用動畫和數據驗證自己的想法。</p>')
          s=s.replace('<h2>隨堂概念小挑戰</h2>','<h2 data-zh="🎯 你是在算「走多遠」，還是算「位置改變多少」？" data-en="🎯 Are you finding how far it traveled, or how much its position changed?">🎯 你是在算「走多遠」，還是算「位置改變多少」？</h2><p class="hook-subtitle" data-zh="先判斷題目問的是路徑長還是位移，再開始計算。" data-en="Identify whether the question asks for distance or displacement before calculating.">先判斷題目問的是路徑長還是位移，再開始計算。</p>')

          # Move displacement definition/example/practice into page 3 (slide-2), after its existing diagram.
          slide2=s.find('<div id="slide-2"')
          slide3=s.find('<div id="slide-3"')
          if slide2!=-1 and slide3!=-1:
              insert=s.rfind('        </div>',slide2,slide3)
              moved='''\n            <div class="formula-box" data-zh="位移定義：Δx = x末 − x初" data-en="Displacement: Δx = xfinal − xinitial"><span class="formula-label" data-zh="位移的定義式（由位置變化得到）" data-en="Displacement from the change in position">位移的定義式（由位置變化得到）</span>Δx = x<sub>末</sub> − x<sub>初</sub></div>\n            <div class="example-note" data-zh="小範例：小明從 x₁ = −2 m 走到 x₂ = +6 m，位移 Δx = (+6) − (−2) = +8 m（正號代表向右）。" data-en="Example: from x₁ = −2 m to x₂ = +6 m, Δx = (+6) − (−2) = +8 m (positive means right)."><b>小範例：</b>小明原本站在 x₁ = −2 m 處，之後走到 x₂ = +6 m 處。<br>位移 Δx = x₂ − x₁ = (+6) − (−2) = <span class="highlight-green">+8 m</span>（正號代表方向朝右）</div>\n            <h3 style="color: var(--chalk-orange); margin-top:24px;" data-zh="✏️ 練習題：從位置算位移" data-en="✏️ Practice: Find displacement from positions">✏️ 練習題：從位置算位移</h3>\n            <div class="teacher-box" id="posTeacherBox"><div class="teacher-avatar">👩‍🏫</div><div class="teacher-content"><div class="teacher-name" data-zh="曉臻老師的提問" data-en="Teacher's Question">曉臻老師的提問</div><p class="teacher-text" id="posTeacherText" data-zh="小華原本在數線 x₁ = +3 m 處，之後走到 x₂ = −4 m 處，請問他的位移是多少？" data-en="Xiaohua moves from x₁ = +3 m to x₂ = −4 m. What is the displacement?">小華原本在數線 x₁ = +3 m 處，之後走到 x₂ = −4 m 處，請問他的位移是多少？</p></div></div>\n            <div><button class="option-btn" onclick="checkPosAnswer(1)">(A) +7 m</button><button class="option-btn" onclick="checkPosAnswer(2)">(B) −7 m</button><button class="option-btn" onclick="checkPosAnswer(3)">(C) −1 m</button><button class="option-btn" onclick="checkPosAnswer(4)">(D) +1 m</button></div>\n'''
              s=s[:insert]+moved+s[insert:]

          # Teaching bridges before footers.
          bridges=[
          ('<div id="slide-0"','<div id="slide-1"','一條數線可以描述左右的位置；可是颱風會往東西南北移動，一條線還夠嗎？','A number line describes left and right. But a typhoon moves in two dimensions—is one line enough?'),
          ('<div id="slide-1"','<div id="slide-2"','現在我們知道物體「在哪裡」。如果它開始移動，接下來要分清楚：它走了多遠，和它的位置改變多少，是同一件事嗎？','Now we know where the object is. Once it moves, is distance traveled the same as change in position?'),
          ('<div id="slide-2"','<div id="slide-3"','直線折返已經看出路徑長和位移不同。那如果路徑變成圓弧，位移還是沿路徑算嗎？','A straight out-and-back path separates distance from displacement. What happens when the path is curved?'),
          ('<div id="slide-3"','<div id="slide-4"','概念看懂了，下一步先做預測，再用互動實驗驗證。','Now predict first, then verify with the interactive experiment.'),
          ('<div id="slide-4"','<div id="slide-5"','你已經看過位置、路徑長與位移同步變化。最後，用一道題目確認自己真的分得清楚。','You have watched position, distance, and displacement change together. Finish with one challenge.'),
          ]
          for startmark,endmark,zh,en in bridges:
              a=s.find(startmark); b=s.find(endmark,a)
              if a!=-1 and b!=-1:
                  f=s.rfind('<div class="footer-nav">',a,b)
                  if f!=-1:
                      box=f'<div class="bridge-box"><strong data-zh="串場｜" data-en="Bridge｜">串場｜</strong><span data-zh="{zh}" data-en="{en}">{zh}</span></div>\n        '
                      s=s[:f]+box+s[f:]

          # Bilingual engine. Only data-en content changes; original diagrams/Canvas logic remain untouched.
          engine='''\n    let currentLang = 'zh';\n    function tr(zh,en){ return currentLang==='en'?en:zh; }\n    function setLang(lang){\n      currentLang=lang;\n      document.querySelectorAll('[data-zh][data-en]').forEach(el=>{el.innerHTML=lang==='en'?el.dataset.en:el.dataset.zh;});\n      const z=document.getElementById('btn-lang-zh'), e=document.getElementById('btn-lang-en'); if(z)z.classList.toggle('active',lang==='zh'); if(e)e.classList.toggle('active',lang==='en');\n      if(typeof resetSim==='function') resetSim();\n    }\n'''
          s=s.replace('<script>','<script>'+engine,1)
          s=s.replace('    resetSim();','    resetSim();\n    setLang(\'zh\');',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched lesson and remove one-time workflow
        shell: bash
        run: |
          git config user.name "openai-course-maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-kinematics-06-1.yml
          git add kinematics.html .github/workflows/patch-kinematics-06-1.yml
          git commit -m "Refine kinematics 06-1 teaching flow without touching core diagrams" || exit 0
          git push
