name: Complete kinematics 06-1 bilingual layer

# Trigger pass 2: workflow now exists on default branch.
on:
  push:
    paths:
      - '.github/workflows/patch-kinematics-06-1-bilingual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Complete bilingual layer without touching protected physics logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html, sys

          p = Path('kinematics.html')
          s = p.read_text(encoding='utf-8')

          protected_svgs = re.findall(r'<svg\b.*?</svg>', s, flags=re.S)
          protected_functions = {}
          for name, next_name in [('getKinematics','animate'), ('drawAnimation','drawGraph'), ('drawGraph','checkAnswer')]:
              m = re.search(rf'(    function {name}\(.*?)(?=\n    function {next_name}\b|\n    // ==================== 隨堂實戰)', s, flags=re.S)
              if m:
                  protected_functions[name] = m.group(1)

          s = s.replace('<title>06-1｜位置、路徑長與位移｜Position, Distance & Displacement</title>', '<title>06-1｜位置、路徑長與位移</title>')
          s = s.replace('位置（position）：', '位置：')
          s = s.replace('1D 數線運動軌跡', '一維數線運動軌跡')

          def add_attr_by_text(tag, zh, en):
              global s
              pat = re.compile(rf'(<{tag}\b(?![^>]*data-zh=)[^>]*>)' + re.escape(zh) + rf'(</{tag}>)')
              def repl(m):
                  return m.group(1)[:-1] + f' data-zh="{html.escape(zh, quote=True)}" data-en="{html.escape(en, quote=True)}">' + zh + m.group(2)
              s, _ = pat.subn(repl, s, count=1)

          pairs = [
            ('div','曉臻老師的小提醒',"Ms. Hsiao-Chen's Note"),
            ('p','▼ 數線上的位置表示法','▼ Position on a Number Line'),
            ('button','下一頁：平面座標與颱風 ➔','Next: Position in 2D ➔'),
            ('div','曉臻老師的氣象播報台',"Ms. Hsiao-Chen's Weather Desk"),
            ('p','▼ 凱米颱風中心位置監測圖','▼ Tracking the Center of Typhoon Gaemi'),
            ('h3','✏️ 題組第 1 題：平面相對坐標','✏️ Question 1: Relative Coordinates in 2D'),
            ('h3','✏️ 題組第 2 題：二維空間的位移大小','✏️ Question 2: Displacement Magnitude in 2D'),
            ('button','⬅ 上一頁：位置的定義','⬅ Previous: Position & Reference Point'),
            ('button','下一頁：路徑長與位移 ➔','Next: Distance & Displacement ➔'),
            ('p','▼ 靜態圖解：向前走 12 m，再往回走 8 m','▼ Walk 12 m Forward, Then 8 m Back'),
            ('button','⬅ 上一頁：平面座標與颱風','⬅ Previous: Position in 2D'),
            ('button','下一頁：進階應用 ➔','Next: Nonlinear Paths ➔'),
            ('h3','🏟️ 範例一：跑半圈圓形操場','🏟️ Example 1: Half a Lap Around a Circular Track'),
            ('p','▼ 從 A 點跑半圈到對面的 B 點','▼ Run Half a Lap from A to the Opposite Point B'),
            ('h3','🕐 範例二：時鐘秒針走 15 秒','🕐 Example 2: A Second Hand Moves for 15 Seconds'),
            ('p','▼ 秒針從 12 點走到 3 點（15秒＝1/4圈）','▼ From 12 to 3 (15 s = 1/4 revolution)'),
            ('button','⬅ 上一頁：路徑長與位移','⬅ Previous: Distance & Displacement'),
            ('button','下一頁：互動實驗室 ➔','Next: Interactive Lab ➔'),
            ('div','曉臻老師的實驗室指引',"Ms. Hsiao-Chen's Lab Guide"),
            ('div','經過時間 (t)','Elapsed time (t)'),('div','當前位置 (x)','Current position (x)'),('div','路徑長 (L)','Distance (L)'),('div','位移 (Δx)','Displacement (Δx)'),
            ('h3','一維數線運動軌跡','1D Number-Line Motion'),('h3','x-t 圖 (位置-時間圖)','x-t Graph (Position-Time Graph)'),
            ('button','↺ 重置','↺ Reset'),('button','⬅ 上一頁：進階應用','⬅ Previous: Nonlinear Paths'),('button','下一頁：隨堂實戰 ➔','Next: Quick Challenge ➔'),
            ('div','曉臻老師的試場分析',"Ms. Hsiao-Chen's Test-Taking Tip"),('button','⬅ 上一頁：回到互動實驗室','⬅ Previous: Interactive Lab')
          ]
          for tag,zh,en in pairs: add_attr_by_text(tag,zh,en)

          # Large rich-text blocks: wrap in bilingual spans without changing original Chinese HTML.
          rich = [
            ('同學們，講「位置」之前一定要先選一個', 'Before talking about position, first choose a <span class="highlight-blue">reference point (origin)</span>. Without a reference point, saying “I am at 5 meters” is incomplete—measured from where?'),
            ('真實世界可不是一條直線', 'The real world is not one straight line. Meteorologists use a <span class="highlight-yellow">two-dimensional coordinate system (x, y)</span> to locate a typhoon.'),
            ('同學們！想像你在操場跑步', 'Imagine running around a track. The total actual path is <span class="highlight-yellow">distance traveled</span>; the change from start to finish is <span class="highlight-green">displacement</span>.'),
            ('路徑長永遠是「沿著實際走過的軌跡」去算', 'Distance follows the actual path, while displacement depends only on the straight-line change from the starting position to the final position.'),
            ('在運動會大隊接力熱身時', '<strong>【Question】</strong> During relay warm-up, Xiaoming starts at <strong>0 m</strong>, runs right to <strong>15 m</strong>, then turns back and stops at <strong>5 m</strong>.<br>What are his <span class="highlight-yellow">distance traveled</span> and <span class="highlight-green">displacement</span>?')
          ]
          for phrase,en in rich:
              pat = re.compile(r'(<p\b(?![^>]*data-zh=)[^>]*>)(?P<x>(?:(?!</p>).)*'+re.escape(phrase)+r'(?:(?!</p>).)*)(</p>)', re.S)
              def repl(m,en=en):
                  zh=m.group('x'); return m.group(1)[:-1]+f' data-zh="{html.escape(zh,quote=True)}" data-en="{html.escape(en,quote=True)}">'+zh+m.group(3)
              s,_=pat.subn(repl,s,count=1)

          # Dynamic slider label prefixes.
          s=s.replace('<label for="x1Slider">❶ 前進折返點位置 x₁： <span id="x1Val"','<label for="x1Slider"><span data-zh="❶ 前進折返點位置 x₁：" data-en="❶ Turning-point position x₁:">❶ 前進折返點位置 x₁：</span> <span id="x1Val"')
          s=s.replace('<label for="x2Slider">❷ 後退終點位置 x₂： <span id="x2Val"','<label for="x2Slider"><span data-zh="❷ 後退終點位置 x₂：" data-en="❷ Final position after returning x₂:">❷ 後退終點位置 x₂：</span> <span id="x2Val"')

          old = """    let currentLang = 'zh';
    function tr(zh,en){ return currentLang==='en'?en:zh; }
    function setLang(lang){
      currentLang=lang;
      document.querySelectorAll('[data-zh][data-en]').forEach(el=>{el.innerHTML=lang==='en'?el.dataset.en:el.dataset.zh;});
      const z=document.getElementById('btn-lang-zh'), e=document.getElementById('btn-lang-en'); if(z)z.classList.toggle('active',lang==='zh'); if(e)e.classList.toggle('active',lang==='en');
      if(typeof resetSim==='function') resetSim();
    }
"""
          new = r"""    let currentLang = 'zh';
    let i18nMutating = false;
    function tr(zh,en){ return currentLang==='en'?en:zh; }
    const canvasTextMap={'路徑長 L':'Distance L','位移 Δx':'Displacement Δx','時間 t (s)':'Time t (s)','位置 x (m)':'Position x (m)','折返轉折點':'Turning point'};
    if(!CanvasRenderingContext2D.prototype.__pbI18n){const _ft=CanvasRenderingContext2D.prototype.fillText;CanvasRenderingContext2D.prototype.fillText=function(text,...args){const k=String(text);return _ft.call(this,currentLang==='en'&&canvasTextMap[k]?canvasTextMap[k]:text,...args)};CanvasRenderingContext2D.prototype.__pbI18n=true;}
    function dynEn(el){const t=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(el.id==='startBtn'){return {'▶ 播放動畫':'▶ Play animation','▶ 繼續播放':'▶ Resume','❚❚ 暫停':'❚❚ Pause','↺ 重新播放':'↺ Replay'}[t]||null;}
      if(t.includes('小華原本在數線')) return 'Xiaohua moves from x₁ = +3 m to x₂ = −4 m. What is the displacement?';
      if(t.startsWith('🎉 答對了！位移')) return '🎉 <b>Correct!</b> Δx = (−4) − (+3) = <b>−7 m</b>. The negative sign means left.';
      if(t.startsWith('❌ 再想想：位移公式')) return '❌ <b>Try again:</b> Δx = x<sub>final</sub> − x<sub>initial</sub>. Check the signs carefully.';
      if(t.includes('若以「恆春」為基準點')) return 'Using <b>Hengchun</b> as (0,0), point A is (3,−1). What are the coordinates of <b>point B</b>?';
      if(t.startsWith('🎉 完全正確！')) return '🎉 <b>Correct!</b> B is 1 square left and 2 squares up, so B = <b>(−1, 2)</b>.';
      if(t.startsWith('❌ 哎呀看錯格囉！')) return '❌ <b>Check again:</b> coordinates are (x,y): left/right first, then down/up.';
      if(t.includes('每一個小方格的邊長代表 150 公里')) return 'If each grid square represents <b>150 km</b>, what is the <b>displacement magnitude</b> from A to B?';
      if(t.startsWith('🎉 太厲害了！正是 750 公里！')) return '🎉 <b>Correct—750 km!</b> The changes form a 3–4–5 triangle, so displacement is 5 squares × 150 km = <b>750 km</b>.';
      if(t.startsWith('❌ 再算一次看看！')) return '❌ <b>Try again:</b> horizontal change = 4 squares, vertical change = 3 squares. Use the Pythagorean theorem.';
      if(t.includes('若操場半徑改成 r = 30 m')) return 'If r = 30 m and you run half a lap, which distance-displacement pair is correct?';
      if(t.includes('若秒針走了 30 秒')) return 'If the second hand moves for 30 s (half a revolution), which statement is correct?';
      if(t.startsWith('請老師或同學拖拉上方滑塊')) return 'Adjust the sliders, then press “Play animation” to observe.';
      if(t.startsWith('⏸ 動畫暫停中')) return '⏸ <b>Paused.</b> Compare the current position with the x-t graph.';
      if(t.includes('等速向前奔跑中')) return '🏃‍♂️ <b>Moving forward at constant speed.</b> Before turning, distance and displacement magnitude are equal.';
      if(t.includes('跑到起點後方了')) return '⚠️ <b>Now behind the starting point.</b> Displacement is negative, while distance keeps increasing.';
      if(t.includes('轉身往回跑了')) return '🔄 <b>It turned around.</b> Distance keeps increasing while displacement decreases.';
      if(t.startsWith('🏁 到達終點！')) return '🏁 <b>Finished!</b> Compare total distance traveled with final displacement from the start.';
      if(t.startsWith('點選下方選項作答')) return 'Choose an answer. First decide whether the question asks for distance or displacement.';
      if(t.startsWith('🎉 太厲害了！答對了！')) return '🎉 <b>Correct!</b> Distance = 15 + 10 = <b>25 m</b>; displacement = 5 − 0 = <b>+5 m</b>.';
      if(t.startsWith('❌ 哎呀，答錯囉！')) return '❌ <b>Try again:</b> distance adds every segment; displacement is final position minus initial position.';
      return null;}
    const dynamicIds=['posTeacherText','typhoonQ1Text','typhoonQ2Text','circleTeacherText','clockTeacherText','teacherText2','quizTeacherText','startBtn'];
    function applyDyn(el){if(!el||i18nMutating)return;if(currentLang==='en'){if(/[\u4e00-\u9fff]/.test(el.textContent||''))el.dataset.zhDynamic=el.innerHTML;const en=dynEn(el);if(en){i18nMutating=true;el.innerHTML=en;i18nMutating=false;}}else if(el.dataset.zhDynamic){i18nMutating=true;el.innerHTML=el.dataset.zhDynamic;i18nMutating=false;}}
    function translateDyn(){dynamicIds.forEach(id=>applyDyn(document.getElementById(id)));}
    let dynObserver=null;function initDynamicI18n(){if(dynObserver)return;dynObserver=new MutationObserver(rs=>{if(i18nMutating)return;rs.forEach(r=>{let el=r.target.nodeType===1?r.target:r.target.parentElement;if(el&&el.closest){let target=dynamicIds.map(id=>el.closest('#'+id)).find(Boolean);if(target)applyDyn(target);}})});dynamicIds.forEach(id=>{const el=document.getElementById(id);if(el)dynObserver.observe(el,{childList:true,subtree:true,characterData:true});});}
    function setLang(lang){currentLang=lang;document.querySelectorAll('[data-zh][data-en]').forEach(el=>{const v=lang==='en'?el.dataset.en:el.dataset.zh;if(el.namespaceURI&&el.namespaceURI.includes('svg'))el.textContent=v;else el.innerHTML=v;});const z=document.getElementById('btn-lang-zh'),e=document.getElementById('btn-lang-en');if(z)z.classList.toggle('active',lang==='zh');if(e)e.classList.toggle('active',lang==='en');document.title=lang==='en'?'06-1 | Position, Distance & Displacement':'06-1｜位置、路徑長與位移';translateDyn();if(typeof getKinematics==='function'){const k=getKinematics(t);drawAnimation(k.pos,k.path,k.disp);drawGraph(t);}}
"""
          if old not in s: print('ERROR language engine not found'); sys.exit(2)
          s=s.replace(old,new,1)
          s=re.sub(r'^\s*setLang\(\'zh\'\);\s*$','',s,flags=re.M)
          s=s.replace('    // 初始化繪製\n    resetSim();\n</script>',"    // 初始化繪製\n    initDynamicI18n();\n    resetSim();\n    setLang('zh');\n</script>")

          # Protected geometry and core functions must remain unchanged.
          new_svgs=re.findall(r'<svg\b.*?</svg>',s,flags=re.S)
          if len(new_svgs)!=len(protected_svgs): print('ERROR SVG count'); sys.exit(3)
          def skeleton(x): x=re.sub(r'\s+data-(?:zh|en)="[^"]*"','',x); return re.sub(r'>([^<>]*)<','><',x)
          for a,b in zip(protected_svgs,new_svgs):
              if skeleton(a)!=skeleton(b): print('ERROR SVG geometry changed'); sys.exit(4)
          for name,before in protected_functions.items():
              nxt={'getKinematics':'animate','drawAnimation':'drawGraph','drawGraph':'checkAnswer'}[name]
              m=re.search(rf'(    function {name}\(.*?)(?=\n    function {nxt}\b|\n    // ==================== 隨堂實戰)',s,flags=re.S)
              if not m or m.group(1)!=before: print('ERROR protected function',name); sys.exit(5)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit bilingual completion and remove one-time workflow
        shell: bash
        run: |
          git config user.name "openai-course-maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-kinematics-06-1-bilingual.yml
          git add kinematics.html .github/workflows/patch-kinematics-06-1-bilingual.yml
          git commit -m "Complete kinematics 06-1 bilingual layer safely"
          git push
