<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-zh="等加速度運動 (上)｜打點計時、斜面與等差數列" data-en="Uniform Accel. (1) | Ticker Tape, Incline & Arithmetic Seq">等加速度運動 (上)｜打點計時、斜面與等差數列</title>

  <!-- 強制注入 MathJax 解析設定 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --a-color: #4cd964;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
      font-size: 20px;
      padding-top: 70px;
      overflow-x: hidden;
    }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed; top: 16px; right: 20px; z-index: 9999; display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 6px 10px; border: 2px solid var(--x-color); border-radius: 12px; background: rgba(21, 48, 42, 0.95); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(95, 176, 255, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lang-label { color: var(--x-color); font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; user-select: none; margin-left: 4px; }
    .lang-options { display: flex; flex-direction: row; gap: 4px; }
    .lang-pill { padding: 6px 12px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 6px; background: transparent; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation; }
    .lang-pill.active { background: var(--x-color) !important; color: var(--board-dark) !important; border-color: var(--x-color) !important; box-shadow: 0 0 10px rgba(95, 176, 255, 0.5); }

    .wrap { max-width: 1080px; margin: 0 auto; width: 100%; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.1em; color: var(--chalk-dim); text-transform: uppercase; font-weight: bold; }
    h1 { font-size: 36px; font-weight: 900; margin: 6px 0 10px; color: var(--chalk-yellow); }
    header p { color: var(--a-color); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 20px; font-weight: bold; }

    .board {
      background: var(--board);
      border: 8px solid var(--frame);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .board h2 {
      font-size: 26px; margin: 0 0 16px; font-weight: 900;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 20px; font-weight: 900;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.25);
      padding: 16px 16px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: manipulation;
    }
    .mode-switch button span.sub { font-size: 16px; font-weight: bold; opacity: 0.8; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.5); color: var(--chalk); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); border-style: solid;
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.9; font-weight: 900; }

    /* 🌟 教學 Hook 區塊 */
    .hook-box { background: rgba(95, 176, 255, 0.08); border-left: 6px solid var(--x-color); border-radius: 0 8px 8px 0; padding: 16px 20px; font-size: 20px; line-height: 1.6; color: var(--chalk); font-weight: bold; }

    /* 🌟 將控制面板打包移至下方的精緻排版 */
    .sim-controls-wrapper { width: 100%; display: flex; flex-direction: column; gap: 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .sim-controls-wrapper .controls { display: grid; grid-template-columns: 1fr; gap: 12px; background: transparent; padding: 0; margin: 0; border: none; }
    .sim-controls-wrapper .presets { margin-top: 0; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sim-controls-wrapper .playbar { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
    
    .control label { display: flex; justify-content: space-between; font-size: 18px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 900; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 8px; background: transparent; cursor: pointer; padding: 10px 0; touch-action: manipulation; }

    .presets span { font-size: 18px; color: var(--chalk-dim); font-weight: bold; margin-right: 4px; }
    .presets button { font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 2px dashed var(--chalk-dim); color: var(--chalk); padding: 8px 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all .15s; touch-action: manipulation; }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    #playBtn { background: var(--chalk-yellow); color: var(--board-dark); border: none; font-weight: 900; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 20px; transition: all .15s; min-width: 140px; touch-action: manipulation; }
    #playBtn:hover { transform: scale(1.02); }
    .progress-track { flex: 1; height: 10px; background: rgba(242, 236, 217, 0.15); border-radius: 5px; position: relative; overflow: hidden; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--chalk-yellow); border-radius: 5px; width: 0%; }

    /* 🌟 重大排版更新：動態調整 Flex 比例 */
    .dual-view { display: flex; gap: 20px; margin: 16px 0 12px; align-items: stretch; }
    .graph-card { min-width: 0; background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;}
    .visual-card { min-width: 0; background: rgba(0, 0, 0, 0.28); border: 2px solid rgba(242, 236, 217, 0.12); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }

    /* Ticker模式：左4 右6，主角放大！ */
    .dual-view.ratio-ticker .graph-card { flex: 4; }
    .dual-view.ratio-ticker .visual-card { flex: 6; }
    
    .dual-view.ratio-incline .graph-card { flex: 5; }
    .dual-view.ratio-incline .visual-card { flex: 4; }
    
    .dual-view.ratio-table .graph-card { flex: 1; }
    .dual-view.ratio-table .visual-card { flex: 1; }

    .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 18px; font-family: 'Noto Sans TC', sans-serif; font-weight: bold; color: var(--chalk-dim); flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 16px; height: 4px; display: inline-block; border-radius: 2px; }

    /* SVG 等比縮放 */
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    #combinedSvg { width: 100%; aspect-ratio: auto; min-height: 250px; }
    #visualSvg { width: 100%; aspect-ratio: auto; min-height: 250px; }

    .axis-line { stroke: var(--chalk-dim); stroke-width: 2; opacity: 0.8; }
    .grid-line { stroke: var(--chalk-dim); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    .curve-x { fill: none; stroke: var(--x-color); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .curve-v { fill: none; stroke: var(--v-color); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

    .phase-badge { font-size: 20px; font-weight: 900; padding: 8px 16px; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: var(--chalk); text-align: center; width: 100%; margin-bottom: 16px; white-space: nowrap; border: 2px solid transparent; }
    .phase-badge.blue { background: rgba(95, 176, 255, 0.15); color: var(--x-color); border-color: var(--x-color); }

    #derivationTableContainer { width: 100%; display: none; flex-direction: column; height: 100%; justify-content: center; }
    .deriv-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 18px; text-align: center; background: rgba(0,0,0,0.2); border: 2px solid var(--chalk-dim); table-layout: fixed; }
    .deriv-table th, .deriv-table td { border: 1px solid rgba(242, 236, 217, 0.3); padding: 12px 0; }
    .deriv-table th { background: rgba(242, 214, 117, 0.15); color: var(--chalk-yellow); font-family: 'Noto Sans TC', sans-serif; font-weight: 900; white-space: nowrap; }
    .deriv-table .val-cell { color: var(--chalk); font-weight: bold; }
    .deriv-table .calc-row { background: rgba(95, 176, 255, 0.15); color: #8fd0ff; font-weight: bold; }
    .deriv-table .acc-row { background: rgba(239, 106, 90, 0.2); color: #ff9485; font-weight: 900; }
    .slash-cell { background: linear-gradient(to bottom right, transparent 48%, rgba(242, 236, 217, 0.4) 49%, rgba(242, 236, 217, 0.4) 51%, transparent 52%); }

    .deriv-btn-group { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .deriv-btn { flex: 1; padding: 10px; font-family: 'Noto Sans TC', sans-serif; font-weight: 900; font-size: 18px; border-radius: 8px; cursor: pointer; border: 2px solid var(--chalk-yellow); background: transparent; color: var(--chalk-yellow); transition: all 0.2s; touch-action: manipulation; }
    .deriv-btn.active { background: var(--chalk-yellow); color: var(--board-dark); }
    .deriv-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--chalk-dim); color: var(--chalk-dim); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 16px 12px; text-align: center; border: 1px dashed rgba(255, 255, 255, 0.2); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-weight: bold; font-size: 18px; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: var(--chalk-yellow); font-weight: 900; margin-top: 6px; }

    .explain-box { margin-top: 24px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 10px 10px 0; padding: 20px 24px; }
    .explain-box h3 { font-family: 'Noto Sans TC', sans-serif; color: var(--chalk-yellow); margin: 0 0 12px; font-size: 22px; font-weight: 900; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); font-weight: bold; }

    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; }

    /* 🌟 左側圖表下方的題型切換區 */
    .tape-quiz-box { background: rgba(0, 0, 0, 0.3); border: 2px dashed rgba(242, 236, 217, 0.2); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .tape-quiz-title { font-size: 20px; color: var(--chalk-yellow); font-weight: 900; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .tape-btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .tape-btn { background: rgba(255, 255, 255, 0.05); border: 2px solid var(--chalk-dim); color: var(--chalk); padding: 12px 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; transition: all .15s; touch-action: manipulation; }
    .tape-btn:hover, .tape-btn.active { background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); font-weight: 900; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 18px; margin-top: 32px; font-family: 'JetBrains Mono', monospace; font-weight: bold; opacity: 0.8; }

    @media (max-width: 960px) {
      .dual-view { flex-direction: column; }
      .visual-card { width: 100%; aspect-ratio: auto; min-height: 340px; }
      .tape-btn-group { grid-template-columns: 1fr 1fr; }
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
    }
    @media (max-width: 600px) {
      .tape-btn-group { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- 🌟 右上角橫向懸浮雙語切換器 -->
  <div class="floating-lang-container">
    <span class="lang-label">Language</span>
    <div class="lang-options">
      <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
      <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <h1 data-zh="等加速度運動（上）：打點計時、斜面與等差數列" data-en="Uniform Accel (1): Ticker Tape, Incline & Arithmetic Seq">等加速度運動（上）：打點計時、斜面與等差數列</h1>
      <p data-zh="專為國中會考量身打造！徹底破解「打點計時器點序方向」迷思、直觀演示伽利略斜面俯衝比例，並以表格一步步推導中間時刻與平均速度的奧秘！" data-en="Tailored for Junior High exams! Crack the 'ticker tape direction' myth, visualize Galileo's incline ratio, and step-by-step derive average velocity using tables!">專為國中會考量身打造！徹底破解「打點計時器點序方向」迷思、直觀演示伽利略斜面俯衝比例，並以表格一步步推導中間時刻與平均速度的奧秘！</p>
    </header>

    <div class="board">
      <h2 data-zh="① 選擇基礎實驗與模組" data-en="① Select Experiment Module">① 選擇基礎實驗與模組</h2>
      <div class="mode-switch">
        <button class="active" data-mode="ticker">
          <span data-zh="⏱️ 1. 水平打點計時器" data-en="⏱️ 1. Horiz. Ticker Tape">⏱️ 1. 水平打點計時器</span>
          <span class="sub" data-zh="4大考題練習與紙帶打點" data-en="4 quiz types & tape dots">4大考題練習與紙帶打點</span>
        </button>
        <button data-mode="incline">
          <span data-zh="📐 2. 伽利略斜面運動" data-en="📐 2. Galileo's Incline">📐 2. 伽利略斜面運動</span>
          <span class="sub" data-zh="1:3:5:7:9 距離比與長條圖" data-en="1:3:5:7:9 Ratio & Bar Chart">1:3:5:7:9 距離比與長條圖</span>
        </button>
        <button data-mode="table_deriv">
          <span data-zh="📝 3. 等差數列推導" data-en="📝 3. Seq. Derivation">📝 3. 等差數列推導</span>
          <span class="sub" data-zh="表格推導與中間時刻" data-en="Table deriv. & mid-time">表格推導與中間時刻</span>
        </button>
      </div>

      <!-- 🌟 Hook 動態引導區 -->
      <div class="hook-box" id="hookBox">
          <!-- JS 動態生成 -->
      </div>
    </div>

    <div class="board">
      <h2 data-zh="② 物理動態與運動學圖形聯動" data-en="② Dynamic Physics & Graph Sync">② 物理動態與運動學圖形聯動</h2>
      <div class="dual-view" id="dualViewContainer">
        
        <!-- 左側圖表 -->
        <div class="graph-card">
          <div class="legend" id="graphLegend">
            <span id="legendX"><i style="background:var(--x-color)"></i><span data-zh="藍線：x-t（位置/位移）" data-en="Blue: x-t (Pos/Disp)">藍線：x-t（位置/位移）</span></span>
            <span id="legendV"><i style="background:var(--v-color)"></i><span data-zh="紅線：v-t（速度）" data-en="Red: v-t (Velocity)">紅線：v-t（速度）</span></span>
          </div>
          <svg id="combinedSvg"></svg>
          
          <!-- 打點計時器專屬：題型切換面板 (移到左邊下方) -->
          <div id="graphQuizContainer"></div>
        </div>

        <!-- 右側視覺/動畫 -->
        <div class="visual-card">
          <div class="phase-badge blue" id="phaseBadge" data-zh="準備就緒" data-en="Ready">準備就緒</div>
          <svg id="visualSvg"></svg>
          
          <div id="derivationTableContainer">
            <div class="deriv-btn-group">
              <button class="deriv-btn active" id="btnDeriv0" data-zh="Step 0: 原始數據" data-en="Step 0: Raw Data">Step 0: 原始數據</button>
              <button class="deriv-btn" id="btnDeriv1" data-zh="Step 1: 算位移" data-en="Step 1: Calc Disp">Step 1: 算位移</button>              
              <button class="deriv-btn" id="btnDeriv2" data-zh="Step 2: 算平均速度" data-en="Step 2: Calc Avg Vel">Step 2: 算平均速度</button>              
              <button class="deriv-btn" id="btnDeriv3" data-zh="Step 3: 找中間時刻" data-en="Step 3: Find Mid-time">Step 3: 找中間時刻</button>              
              <button class="deriv-btn" id="btnDeriv4" data-zh="Step 4: 求加速度" data-en="Step 4: Calc Accel">Step 4: 求加速度</button>

            </table>

          <div id="simulationControls" class="sim-controls-wrapper">

            <div class="playbar" id="playbarContainer">

              <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
              </div>

      <div class="explain-box" id="explainBox"></div>

  </div>

  <script>
    (function() {
      let currentLang = 'zh';

      window.setLang = function(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';

        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.innerHTML = el.getAttribute(`data-${lang}`);
        });

        updateSimulation();
      };

      function tr(zh, en) {
        return currentLang === 'en' ? en : zh;
      }

      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const hookBox = document.getElementById('hookBox');
      const playBtn = document.getElementById('playBtn');
      const progressFill = document.getElementById('progressFill');
      const playbarContainer = document.getElementById('playbarContainer');
      const combinedSvg = document.getElementById('combinedSvg');
      const visualSvg = document.getElementById('visualSvg');
      const phaseBadge = document.getElementById('phaseBadge');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const legendX = document.getElementById('legendX');
      const legendV = document.getElementById('legendV');
      const derivationTableContainer = document.getElementById('derivationTableContainer');
      const derivTable = document.getElementById('derivTable');
      const dualViewContainer = document.getElementById('dualViewContainer');
      const graphQuizContainer = document.getElementById('graphQuizContainer');
      const simulationControls = document.getElementById('simulationControls');

      let currentMode = 'ticker';
      let animId = null;
      let animStartTime = null;

        return el;
      }

      function addTextToSvg(parent, x, y, txt, anchor, color, size, weight='normal') {

                <button class="tape-btn ${p.quiz === 2 ? 'active' : ''}" onclick="setTickerQuiz(2)">${tr('② 等減速 (越來越慢)', '② Decel (Slower)')}</button>
                <button class="tape-btn ${p.quiz === 3 ? 'active' : ''}" onclick="setTickerQuiz(3)">${tr('③ 等速度 (間距相同)', '③ Uniform Speed')}</button>
                <button class="tape-btn ${p.quiz === 4 ? 'active' : ''}" onclick="setTickerQuiz(4)">${tr('④ 陷阱題 (先加後減)', '④ Trap (Accel->Decel)')}</button>

            addSlider('L', '斜面總長度 L', 'Incline Length L', 2.0, 10.0, 0.5, p.L, 'm', v => p.L = v);

      function renderPresets() {
        presetsBox.innerHTML = `<span>⚡ ${tr('快速情境：', 'Presets:')}</span>`;
        const m = currentMode;
        const addBtn = (labelZh, labelEn, action) => {

          b.textContent = tr(labelZh, labelEn);
          b.onclick = () => { action(); renderControls(); updateSimulation(); };
          presetsBox.appendChild(b);
        };

        if (m === 'ticker') {
          addBtn('標準打點 10Hz', 'Standard 10Hz', () => { params.ticker.f = 10; });
          addBtn('密打點 20Hz', 'Dense 20Hz', () => { params.ticker.f = 20; });
          presetsBox.style.display = 'flex';
        } else if (m === 'incline') {
          addBtn('經典 30° (1:3:5:7:9)', 'Classic 30° (1:3:5:7:9)', () => { params.incline.angle = 30; params.incline.L = 5.0; params.incline.g = 10.0; });
          addBtn('極限 90° (自由落體)', 'Limit 90° (Free Fall)', () => { params.incline.angle = 90; params.incline.L = 8.0; params.incline.g = 10.0; });
          presetsBox.style.display = 'flex';
        } else {
          presetsBox.style.display = 'none';
        }
      }

      function calculatePhysics() {
        const m = currentMode;
        const p = params[m];
        let res = {};

        if (m === 'ticker') {
          const dt = 1 / p.f;
          const totalTime = 1.4;
          const dots = [];
          
          let stopTime = Infinity;
          const calcPos = (t_val) => {
            if (p.quiz === 4) {
              if (t_val <= 0.7) return { x: 0.5 * 5.0 * t_val * t_val, v: 5.0 * t_val };
              else {
                const dt2 = t_val - 0.7;
                return { x: 1.225 + 3.5 * dt2 - 0.5 * 4.0 * dt2 * dt2, v: 3.5 - 4.0 * dt2 };
              }
            } else {
              return { x: p.v0 * t_val + 0.5 * p.a * t_val * t_val, v: p.v0 + p.a * t_val };
            }
          };

          if (p.quiz === 4) stopTime = 0.7 + (3.5 / 4.0);
          else if (p.a < 0) stopTime = -p.v0 / p.a;

          for (let t = 0; t <= totalTime; t += dt) {
            let actualT = Math.min(t, stopTime);
            let state = calcPos(actualT);
            dots.push({ t, x: Math.max(0, state.x), v: Math.max(0, state.v) });
          }
          
          const endState = calcPos(Math.min(totalTime, stopTime));
          const xMax = Math.max(0.1, endState.x);
          const maxV = Math.max(...dots.map(d => d.v));
          res = { tMax: totalTime, xMax, vMax: maxV !== -Infinity ? Math.max(maxV, 0.1) : 0.1, dots, dt, quiz: p.quiz, stopTime, calcPos };        
        } else if (m === 'incline') {
          const rad = p.angle * Math.PI / 180;
          const a = p.g * Math.sin(rad);
          const tMax = 5.0; 
          const vMax = a * tMax;
          const xMax = 0.5 * a * tMax * tMax;

          const xTop = 20;
          const targetW = 200; 
          const targetH = 260; 
          const rampLen = Math.min(targetW / Math.cos(rad), targetH / Math.sin(rad));

          const availableTop = 45, availableBottom = 300;
          const actualVSpan = rampLen * Math.sin(rad);
          const yTop = availableTop + ((availableBottom - availableTop) - actualVSpan) / 2;

          const xBot = xTop + rampLen * Math.cos(rad);
          const yBot = yTop + rampLen * Math.sin(rad);
          res = { tMax, xMax, vMax, a, _ramp: { xTop, yTop, rad, rampLen, xBot, yBot } };
        } else if (m === 'table_deriv') {
          const times = [0, 1, 2, 3, 4, 5];
          const positions = [0, 0.2, 0.8, 1.8, 3.2, 5.0];
          const displacements = [0.2, 0.6, 1.0, 1.4, 1.8]; 
          const avgVelocities = [0.2, 0.6, 1.0, 1.4, 1.8]; 
          const midTimes = [0.5, 1.5, 2.5, 3.5, 4.5];        
          const accelerations = [0.4, 0.4, 0.4, 0.4];                  
          res = {
            tMax: 5, xMax: 5.0, vMax: 2.0, 
            times, positions, displacements, avgVelocities, midTimes, accelerations,
            step: p.step
          };
        }
        return res;
      }

      function updateSimulation() {
        const phys = calculatePhysics();
        currentPhys = phys;
        if (currentMode === 'table_deriv') {
          legendX.style.display = 'none';
          legendV.innerHTML = tr('<i style="background:var(--v-color)"></i>紅線：v-t（速度）', '<i style="background:var(--v-color)"></i>Red: v-t (Velocity)');
        } else if (currentMode === 'incline') {
          legendX.style.display = 'none';
          legendV.innerHTML = tr('<i style="background:#f2ecd9"></i>黑線：v-t 斜直線 ｜ 四色階梯：等時間段位移', '<i style="background:#f2ecd9"></i>Black: v-t line | Color bars: Disp. in equal time');
        } else {
          legendX.style.display = 'inline-flex';
          legendV.innerHTML = tr('<i style="background:var(--v-color)"></i>紅線：v-t（速度）', '<i style="background:var(--v-color)"></i>Red: v-t (Velocity)');
        }

        drawGraph(phys);
        if (currentMode === 'table_deriv') {
          drawDerivationTable(phys);
        } else {
          drawVisualBackground(phys);
          renderFrame(0, phys);
        }
        updateStatsAndExplain(phys);
        
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(e => console.log(e));
        }
      }

      function drawGraph(phys) {
        combinedSvg.innerHTML = '';
        const W = 680, H = 340;
        combinedSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);

        const margin = { top: 30, right: 50, bottom: 40, left: 60 };
        const pW = W - margin.left - margin.right;
        const pH = H - margin.top - margin.bottom;

        const addLine = (x1, y1, x2, y2, cls, extraProps={}) => {
          const el = createSvgEl('line', { x1, y1, x2, y2, class: cls });
          for(let k in extraProps) el.setAttribute(k, extraProps[k]);
          combinedSvg.appendChild(el);
        };

        addLine(margin.left, margin.top + pH, margin.left + pW, margin.top + pH, 'axis-line');
        addLine(margin.left, margin.top, margin.left, margin.top + pH, 'axis-line');
        addLine(margin.left + pW, margin.top, margin.left + pW, margin.top + pH, 'axis-line');

        for (let i = 1; i <= 5; i++) {
          const gx = margin.left + (i / 5) * pW;
          addLine(gx, margin.top, gx, margin.top + pH, 'grid-line');
        }
        for (let i = 1; i <= 5; i++) {
          const gy = margin.top + (i / 5) * pH;
          addLine(margin.left, gy, margin.left + pW, gy, 'grid-line');
        }

        const getX = t => margin.left + (t / phys.tMax) * pW;        
        const getY_x = x_val => {
          let peakX = phys.xMax || 1;
          return margin.top + pH - (x_val / peakX) * pH;
        };
        const getY_v = v_val => {
          const maxV = phys.vMax * 1.05 || 1;
          return margin.top + pH - (v_val / maxV) * pH;
        };

        /* ================== 斜面專用：左側 v-t 階梯 ================== */
        if (currentMode === 'incline') {
          const colors = ['#5fb0ff', '#f2d675', '#ef6a5a', '#bd93f9'];
          for (let i = 0; i < 4; i++) {
            const x1 = getX(i + 1);
            const x2 = getX(i + 2);
            const yVal = getY_v((i + 1) * (phys.vMax / 5));
            combinedSvg.appendChild(createSvgEl('rect', {
              x: x1, y: yVal, width: x2 - x1, height: margin.top + pH - yVal,
              fill: colors[i], stroke: '#000', 'stroke-width': 1.5, opacity: 0.9
            }));
          }
          addLine(margin.left, margin.top + pH, getX(5.5), getY_v(phys.vMax * 1.1), '', { 'stroke': '#f2ecd9', 'stroke-width': 3.5, 'stroke-linecap': 'round' });

          addTextToSvg(combinedSvg, margin.left - 10, margin.top - 12, tr('速度 v', 'Vel v'), 'start', '#f2ecd9', 16, 'bold');
          addTextToSvg(combinedSvg, margin.left + pW / 2, H - 5, tr('運動時間 t (s)', 'Time t (s)'), 'middle', 'var(--chalk-dim)', 14, 'bold');

          for (let i = 1; i <= 5; i++) {
            const tx = getX(i);
            addLine(tx, margin.top + pH, tx, margin.top + pH + 6, 'axis-line');
            addTextToSvg(combinedSvg, tx, margin.top + pH + 22, `${i}`, 'middle', 'var(--chalk-yellow)', 16, 'bold');
            
            const vy = getY_v(i * (phys.vMax / 5));
            addLine(margin.left - 6, vy, margin.left, vy, 'axis-line');
            addTextToSvg(combinedSvg, margin.left - 10, vy + 5, `${i * 10}`, 'end', '#f2ecd9', 14, 'bold');
          }

          combinedSvg.appendChild(createSvgEl('line', { id: 'svgGuide', class: 'guide-line' }));
          combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotV', r: 8, class: 'dot-v', fill: '#f2ecd9' }));
          phys._getX = getX; phys._getY_v = getY_v;
          return;
        }

        if (currentMode !== 'table_deriv') {
          addTextToSvg(combinedSvg, margin.left - 10, margin.top - 12, tr('位置 x', 'Pos x'), 'start', 'var(--x-color)', 14, 'bold');
        }
        addTextToSvg(combinedSvg, margin.left + pW + 10, margin.top - 12, tr('速度 v', 'Vel v'), 'end', 'var(--v-color)', 14, 'bold');
        addTextToSvg(combinedSvg, margin.left + pW / 2, H - 5, tr('運動時間 t (s)', 'Time t (s)'), 'middle', 'var(--chalk-dim)', 14, 'bold');

        if (currentMode === 'table_deriv') {
          phys.times.forEach(t => {
            addLine(getX(t), margin.top+pH, getX(t), margin.top+pH+6, 'axis-line');
            addTextToSvg(combinedSvg, getX(t), margin.top+pH+20, t, 'middle', 'var(--chalk-dim)', 14, 'bold');
          });
          
          [0.5, 1.0, 1.5, 2.0].forEach(v => {
            addLine(margin.left-6, getY_v(v), margin.left, getY_v(v), 'axis-line');
            addTextToSvg(combinedSvg, margin.left-10, getY_v(v)+5, v.toFixed(1), 'end', 'var(--v-color)', 14, 'bold');
          });

          const pts = phys.times.map(t => `${getX(t)},${getY_v(0.4 * t)}`).join(' ');
          combinedSvg.appendChild(createSvgEl('polyline', { points: pts, class: 'curve-v', style: 'stroke-width: 3.5; opacity: 0.8;' }));

          if (phys.step >= 2) {
            phys.avgVelocities.forEach((v, i) => {
              const x1 = getX(phys.times[i]);
              const x2 = getX(phys.times[i+1]);
              const y = getY_v(v);
              combinedSvg.appendChild(createSvgEl('rect', {
                x: x1, y: y, width: (x2-x1), height: (margin.top+pH - y),
                fill: 'rgba(95, 176, 255, 0.05)', stroke: 'rgba(95, 176, 255, 0.3)', 'stroke-dasharray': '3 4'
              }));
              addLine(x1, y, x2, y, '', {'stroke': 'var(--x-color)', 'stroke-width': 4});
            });
          }

          if (phys.step >= 3) {
            phys.midTimes.forEach((mt, i) => {
              const y = getY_v(phys.avgVelocities[i]);
              const cx = getX(mt);
              addLine(cx, y, cx, margin.top+pH, '', {'stroke': 'var(--chalk-yellow)', 'stroke-dasharray': '4 4', 'stroke-width': 2});
              combinedSvg.appendChild(createSvgEl('circle', { cx: cx, cy: y, r: 7, fill: 'var(--chalk-yellow)', stroke: '#000', 'stroke-width': 2 }));
            });
          }

          if (phys.step >= 4) {
            if (phys.midTimes.length >= 2) {
              const x1 = getX(phys.midTimes[0]);
              const y1 = getY_v(phys.avgVelocities[0]);
              const x2 = getX(phys.midTimes[1]);
              const y2 = getY_v(phys.avgVelocities[1]);
              
              combinedSvg.appendChild(createSvgEl('polygon', {
                points: `${x1},${y1} ${x2},${y1} ${x2},${y2}`,
                fill: 'rgba(239, 106, 90, 0.2)'
              }));
              addLine(x2, y1, x2, y2, '', {'stroke': 'var(--v-color)', 'stroke-width': 3, 'stroke-dasharray': '3 3'});
              addTextToSvg(combinedSvg, (x1+x2)/2, y1+16, 'Δt=1s', 'middle', 'var(--chalk-dim)', 14, 'bold');
              addTextToSvg(combinedSvg, x2+18, (y1+y2)/2+5, 'Δv=0.4', 'start', '#ff9485', 14, 'bold');
            }
          }
          return;
        }

        let ptsX = [], ptsV = [];
        const steps = 60;
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * phys.tMax;
          let x = 0, v = 0;
          if (currentMode === 'ticker') {
            const state = phys.calcPos(Math.min(t, phys.stopTime));
            x = state.x; v = state.v;
          }
          ptsX.push(`${getX(t)},${getY_x(Math.max(0, x))}`);
          ptsV.push(`${getX(t)},${getY_v(v)}`);
        }

        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsX.join(' '), class: 'curve-x' }));
        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsV.join(' '), class: 'curve-v' }));

        if (currentMode === 'ticker') {
          phys.dots.forEach(d => {
            combinedSvg.appendChild(createSvgEl('circle', { cx: getX(d.t), cy: getY_v(d.v), r: 5, fill: 'var(--chalk-yellow)' }));
          });
        }

        combinedSvg.appendChild(createSvgEl('line', { id: 'svgGuide', class: 'guide-line' }));
        const dotX = createSvgEl('circle', { id: 'svgDotX', r: 8, class: 'dot-x' });
        combinedSvg.appendChild(dotX);
        combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotV', r: 8, class: 'dot-v' }));

        phys._getX = getX; phys._getY_x = getY_x; phys._getY_v = getY_v;
      }
      
      function drawDerivationTable(phys) {
        let html = `
          <tr>
            <th style="width: 17%;">${tr('時間 (s)', 'Time (s)')}</th>
            ${phys.times.map(t => `<td colspan="2" class="val-cell">${t}</td>`).join('')}
          </tr>
          <tr>
            <th>${tr('位置 (m)', 'Pos (m)')}</th>
            ${phys.positions.map(p => `<td colspan="2" class="val-cell">${p.toFixed(1)}</td>`).join('')}
          </tr>
        `;
        
        let dispHtml = '';
        if (phys.step >= 1) {
          dispHtml = `<td class="slash-cell"></td>`;
          phys.displacements.forEach(d => { dispHtml += `<td colspan="2" class="val-cell calc-row">${d.toFixed(1)}</td>`; });
          dispHtml += `<td class="slash-cell"></td>`;
        } else {
          dispHtml = `<td colspan="${phys.times.length * 2}"></td>`;
        }
        html += `<tr><th>${tr('位移 (m)', 'Disp (m)')}</th>${dispHtml}</tr>`;

        let avgHtml = '';
        if (phys.step >= 2) {
          avgHtml = `<td class="slash-cell"></td>`;
          phys.avgVelocities.forEach(v => { avgHtml += `<td colspan="2" class="val-cell calc-row" style="font-weight:bold;">${v.toFixed(1)}</td>`; });
          avgHtml += `<td class="slash-cell"></td>`;
        } else {
          avgHtml = `<td colspan="${phys.times.length * 2}"></td>`;
        }
        html += `<tr><th style="font-size:16px; line-height:1.4;">${tr('平均速度<br>(m/s)', 'Avg Vel<br>(m/s)')}</th>${avgHtml}</tr>`;

        let accHtml = '';
        if (phys.step >= 4) {
          accHtml = `<td colspan="2" class="slash-cell"></td>`;
          phys.accelerations.forEach(a => { accHtml += `<td colspan="2" class="val-cell acc-row">${a.toFixed(1)}</td>`; });
          accHtml += `<td colspan="2" class="slash-cell"></td>`;
        } else {
          accHtml = `<td colspan="${phys.times.length * 2}"></td>`;
        }
        html += `<tr><th style="font-size:16px; line-height:1.4;">${tr('速度變化<br>(m/s²)', 'Vel Chg<br>(m/s²)')}</th>${accHtml}</tr>`;

        derivTable.innerHTML = html;
      }

      // 🌟 神級 Car 繪製引擎
      function drawCoolCar(parent, color) {
        // 陰影
        parent.appendChild(createSvgEl('rect', { x: -20, y: -10, width: 44, height: 20, fill: 'rgba(0,0,0,0.4)', rx: 4 }));
        // 輪胎
        const wColor = '#1e293b';
        parent.appendChild(createSvgEl('rect', { x: -14, y: -14, width: 10, height: 4, fill: wColor, rx: 1 }));
        parent.appendChild(createSvgEl('rect', { x: 8, y: -14, width: 10, height: 4, fill: wColor, rx: 1 }));
        parent.appendChild(createSvgEl('rect', { x: -14, y: 10, width: 10, height: 4, fill: wColor, rx: 1 }));
        parent.appendChild(createSvgEl('rect', { x: 8, y: 10, width: 10, height: 4, fill: wColor, rx: 1 }));
        // 車體
        parent.appendChild(createSvgEl('rect', { x: -22, y: -12, width: 44, height: 24, fill: color, rx: 5 }));
        // 擋風玻璃
        parent.appendChild(createSvgEl('rect', { x: 4, y: -8, width: 6, height: 16, fill: 'rgba(255,255,255,0.7)', rx: 1 }));
        // 後車窗
        parent.appendChild(createSvgEl('rect', { x: -16, y: -6, width: 4, height: 12, fill: 'rgba(255,255,255,0.4)', rx: 1 }));
        // 車頭燈
        parent.appendChild(createSvgEl('circle', { cx: 20, cy: -8, r: 2.5, fill: '#fde047' }));
        parent.appendChild(createSvgEl('circle', { cx: 20, cy: 8, r: 2.5, fill: '#fde047' }));
      }

      function drawVisualBackground(phys) {
        visualSvg.innerHTML = '';
        const m = currentMode;

        if (m === 'ticker') {
          // 🌟 打點計時器：放大寬度與字體
          visualSvg.setAttribute('viewBox', '0 0 500 400');
          
          visualSvg.appendChild(createSvgEl('rect', { x: 10, y: 110, width: 35, height: 46, fill: '#8f8a80', rx: 6 }));
          visualSvg.appendChild(createSvgEl('circle', { cx: 30, cy: 133, r: 6, fill: '#ef6a5a' }));
          addTextToSvg(visualSvg, 30, 95, tr('⬅️新點(最後)', '⬅️New(Last)'), 'middle', 'var(--v-color)', 16, 'bold');
          addTextToSvg(visualSvg, 450, 95, tr('舊點(t=0)➡️', 'Old(t=0)➡️'), 'middle', 'var(--chalk-yellow)', 16, 'bold');
          
          visualSvg.appendChild(createSvgEl('g', { id: 'tapeGroup' }));
          
          const carG = createSvgEl('g', { id: 'simObject' });
          drawCoolCar(carG, '#5fb0ff');
          visualSvg.appendChild(carG);

          visualSvg.appendChild(createSvgEl('rect', { x: 10, y: 200, width: 480, height: 160, fill: 'rgba(0,0,0,0.4)', stroke: 'rgba(242,236,217,0.2)', rx: 12 }));
          addTextToSvg(visualSvg, 30, 240, tr('🔍 【紙帶放大特寫】', '🔍 【Tape Close-up】'), 'start', 'var(--chalk-yellow)', 20, 'bold');
          visualSvg.appendChild(createSvgEl('rect', { x: 30, y: 260, width: 440, height: 40, fill: '#ffffff', stroke: '#a39d93', 'stroke-width': 3, rx: 4 }));
          addTextToSvg(visualSvg, 30, 335, tr('計時器端(最新)', 'Timer(New)'), 'start', 'var(--chalk-dim)', 16, 'bold');
          addTextToSvg(visualSvg, 470, 335, tr('拉車端(t=0) ➔', 'Pull(t=0) ➔'), 'end', 'var(--chalk-yellow)', 16, 'bold');

          phys.dots.forEach((d, idx) => {
            const dotX = 450 - (d.x / phys.xMax) * 400;
            if (dotX >= 35 && dotX <= 465) {
              visualSvg.appendChild(createSvgEl('circle', { cx: dotX, cy: 280, r: 6, fill: '#000000' }));
              if (idx === 0) {
                visualSvg.appendChild(createSvgEl('circle', { cx: dotX, cy: 280, r: 11, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 3 }));
              }
            }
          });

          const hintZh = phys.quiz === 1 ? '👉 點距越來越大 ➔ 加速運動' : (phys.quiz === 2 ? '👉 點距越來越小 ➔ 減速運動' : (phys.quiz === 3 ? '👉 點距均勻相等 ➔ 等速運動' : '👉 點距先大後小 ➔ 先加後減'));
          const hintEn = phys.quiz === 1 ? '👉 Gap widens ➔ Accel' : (phys.quiz === 2 ? '👉 Gap shrinks ➔ Decel' : (phys.quiz === 3 ? '👉 Even gaps ➔ Uniform Speed' : '👉 Gap widens then shrinks'));
          addTextToSvg(visualSvg, 250, 380, tr(hintZh, hintEn), 'middle', 'var(--x-color)', 18, 'bold');

        } else if (m === 'incline') {
          visualSvg.setAttribute('viewBox', '0 0 280 340');
          const r = phys._ramp;
          visualSvg.appendChild(createSvgEl('polygon', {
            points: `${r.xTop},${r.yTop} ${r.xBot},${r.yBot} ${r.xTop},${r.yBot}`,
            fill: 'rgba(242,214,117,0.15)', stroke: 'var(--chalk-yellow)', 'stroke-width': 3
          }));
          const segRatios = [1, 3, 5, 7, 9];
          const totalUnits = segRatios.reduce((a, b) => a + b, 0);
          const markerFracs = [0]; let cum = 0;
          segRatios.forEach(u => { cum += u; markerFracs.push(cum / totalUnits); });
          
          markerFracs.forEach((frac, idx) => {
            const dist = frac * r.rampLen;
            const tx = r.xTop + dist * Math.cos(r.rad), ty = r.yTop + dist * Math.sin(r.rad);
            visualSvg.appendChild(createSvgEl('circle', { cx: tx, cy: ty, r: (idx === 0 || idx === markerFracs.length - 1) ? 6 : 5, fill: idx === 0 ? 'var(--v-color)' : 'var(--chalk-yellow)' }));
          });
          
          for (let i = 0; i < segRatios.length; i++) {
            const dist1 = markerFracs[i] * r.rampLen, dist2 = markerFracs[i + 1] * r.rampLen;
            const midDist = (dist1 + dist2) / 2;
            const mx = r.xTop + midDist * Math.cos(r.rad), my = r.yTop + midDist * Math.sin(r.rad);
            const labelOffset = 20;
            const lx = mx - labelOffset * Math.sin(r.rad), ly = my + labelOffset * Math.cos(r.rad);
            addTextToSvg(visualSvg, lx, ly, segRatios[i], 'middle', 'var(--chalk-yellow)', 16, 'bold');
          }
          
          addTextToSvg(visualSvg, 140, 20, tr('等間隔，位移比 = 1:3:5:7:9', 'Equal time, Disp ratio = 1:3:5:7:9'), 'middle', 'var(--chalk-dim)', 16, 'bold');
          
          const ball = createSvgEl('g', { id: 'simObject' });
          ball.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 14, fill: '#ef6a5a', stroke: '#f2ecd9', 'stroke-width': 2 }));
          ball.appendChild(createSvgEl('circle', { cx: -4, cy: -4, r: 4, fill: 'rgba(255,255,255,0.7)' }));
          visualSvg.appendChild(ball);
        }
      }

      function renderFrame(t, phys) {
        const m = currentMode;
        if (m === 'table_deriv') return; 

        let x = 0, v = 0;
        if (m === 'ticker') {
          const state = phys.calcPos(Math.min(t, phys.stopTime));
          x = state.x; v = state.v;
        } else if (m === 'incline') { x = 0.5 * phys.a * t * t; v = phys.a * t; }

        if (phys._getX) {
          const cx = phys._getX(t);
          const guide = document.getElementById('svgGuide');
          if (guide) {
            guide.setAttribute('x1', cx); guide.setAttribute('y1', 20);
            guide.setAttribute('x2', cx); guide.setAttribute('y2', 320);
          }
          if (m === 'incline') {
            const dotV = document.getElementById('svgDotV');
            if (dotV) {
              dotV.setAttribute('cx', cx);
              dotV.setAttribute('cy', phys._getY_v(v));
            }
          } else if (phys._getY_x && phys._getY_v) {
            const dotX = document.getElementById('svgDotX'), dotV = document.getElementById('svgDotV');
            if (dotX && dotV) {
              dotX.setAttribute('cx', cx); dotX.setAttribute('cy', phys._getY_x(Math.max(0, x)));
              dotV.setAttribute('cx', cx); dotV.setAttribute('cy', phys._getY_v(v));
            }
          }
        }

        const simObj = document.getElementById('simObject');
        const ratio = Math.min(1, Math.max(0, x / (phys.xMax || 1)));

        if (simObj) {
          if (m === 'ticker') {
            const px = 60 + ratio * 360; // 移動長度
            simObj.setAttribute('transform', `translate(${px}, 133) scale(1.2)`);
            const tapeGroup = document.getElementById('tapeGroup');
            if (tapeGroup) {
              tapeGroup.innerHTML = '';
              const tapeWidth = Math.max(0, px - 35);
              if (tapeWidth > 0) {
                tapeGroup.appendChild(createSvgEl('rect', { x: 35, y: 124, width: tapeWidth, height: 18, fill: '#ffffff', stroke: '#a39d93', 'stroke-width': 2 }));
              }
              phys.dots.forEach((d, idx) => {
                if (d.t <= t) {
                  const dotPx = 35 + ((x - d.x) / phys.xMax) * 360;
                  if (dotPx >= 35 && dotPx <= px - 10) {
                    tapeGroup.appendChild(createSvgEl('circle', { cx: dotPx, cy: 133, r: 5, fill: '#000000' }));
                    if (idx === 0) tapeGroup.appendChild(createSvgEl('circle', { cx: dotPx, cy: 133, r: 9, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 2 }));
                  }
                }
              });
            }
          } else if (m === 'incline' && phys._ramp) {
            const r = phys._ramp;
            const dist = ratio * r.rampLen;
            const ballR = 14;
            const px = r.xTop + dist * Math.cos(r.rad) + ballR * Math.sin(r.rad);
            const py = r.yTop + dist * Math.sin(r.rad) - ballR * Math.cos(r.rad);
            simObj.setAttribute('transform', `translate(${px}, ${py}) rotate(${dist * 2.5})`);
          }
        }

        phaseBadge.className = 'phase-badge blue';
        phaseBadge.textContent = tr(`⏱️ 實驗進行中：t = ${t.toFixed(2)} s`, `⏱️ Running: t = ${t.toFixed(2)} s`);
      }

      function updateStatsAndExplain(phys) {
        statsGrid.innerHTML = '';
        const addStat = (kZh, kEn, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${tr(kZh, kEn)}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        const m = currentMode;
        if (m === 'ticker') {
          addStat('打點頻率 f', 'Frequency f', `${params.ticker.f} Hz`);
          addStat('時間差 Δt', 'Time diff Δt', `${phys.dt.toFixed(3)} s`);
          addStat('紙帶總點數', 'Total dots', `${phys.dots.length} ${tr('點', '')}`);
          
          let stateZh = phys.quiz === 1 ? '等加速 (越來越快)' : (phys.quiz === 2 ? '等減速 (越來越慢)' : (phys.quiz === 3 ? '等速運動' : '先加速後減速'));
          let stateEn = phys.quiz === 1 ? 'Uniform Accel' : (phys.quiz === 2 ? 'Uniform Decel' : (phys.quiz === 3 ? 'Uniform Vel' : 'Accel then Decel'));
          addStat('運動狀態', 'Motion State', tr(stateZh, stateEn));

          explainBox.innerHTML = tr(`
            <h3>💡 重點解析：打點計時器判斷法則</h3>
            <p>1. <b>時間起點在拉車端</b>：考卷紙帶向右拉時，離拉車端最近的（最右邊）是第一點（$t = 0$）；離計時器最近的（最左邊）是最新打下的點。<br>
               2. <b>判斷加減速看間隔 $\\Delta x$</b>：從<b>最右邊（舊點）往最左邊（新點）</b>看過去，點跟點的距離若<b>「越來越大」就是等加速運動</b>；若<b>「越來越小」就是等減速運動</b>！<br>
               3. <b>等差數列公式</b>：由靜止開始的等加速運動，相鄰位移差恆為固定值，且呈 <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span> 比例成長！</p>
          `, `
            <h3>💡 Teacher's Analysis: Ticker Tape Golden Rules</h3>
            <p>1. <b>Time origin is at the pulling end</b>: The dot closest to the car (rightmost) is the first dot ($t = 0$).<br>
               2. <b>Observe gap $\\Delta x$ to judge acceleration</b>: Look from <b>oldest (right) to newest (left)</b>. If the gap is <b>getting larger, it's acceleration</b>; if <b>getting smaller, it's deceleration</b>!<br>
               3. <b>Arithmetic Sequence</b>: Starting from rest, the displacement sequence of uniform acceleration grows in a <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span> ratio!</p>
          `);
        } else if (m === 'incline') {
          addStat('時間軸刻度', 'Time Scale', `1, 2, 3, 4, 5 s`);
          addStat('斜面角度 θ', 'Incline Angle', `${params.incline.angle}°`);
          addStat('下滑加速度 a', 'Acceleration a', `${phys.a.toFixed(2)} m/s²`);
          addStat('位移奇數比', 'Odd Disp Ratio', `1 : 3 : 5 : 7 : 9`);
          explainBox.innerHTML = tr(`
            <h3>💡 觀念總結：伽利略斜面與 v-t 圖位移長條</h3>
            <p>由靜止出發的等加速下滑，將時間以 <span class="formula-highlight">$1, 2, 3, 4, 5\\text{ 秒}$</span> 等分後，對應到的速度呈現正比遞增！左邊圖表的<b>四色階梯長條圖</b>，明確顯示在連續等間隔時間內，位移面積的遞增比必定是奇數等差數列 <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span>！這不僅是伽利略斜面實驗的核心，更是會考解題的關鍵！</p>
          `, `
            <h3>💡 Summary: Galileo's Incline & v-t Bars</h3>
            <p>For uniform acceleration from rest, speed increases proportionally over equal time intervals <span class="formula-highlight">$1, 2, 3, 4, 5\\text{ s}$</span>! The <b>color bar chart</b> clearly shows that the increment of displacement area follows the odd arithmetic sequence <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span>! This is the core of Galileo's experiment and key to solving exams!</p>
          `);
        } else if (m === 'table_deriv') {
          addStat('總位移 Δx', 'Total Disp Δx', `5.0 m`);
          addStat('平均加速度 a', 'Avg Accel a', `0.4 m/s²`);
          addStat('時間區隔 Δt', 'Time Diff Δt', `1.0 s`);
          addStat('目前推導進度', 'Current Step', `Step ${phys.step}`);
          explainBox.innerHTML = tr(`
            <h3>💡 重點解析：表格推導與「中間時刻速度」</h3>
            <p>在等加速度運動中，<b>「某段時間內的平均速度，恰等於該段時間『中間時刻』的瞬時速度」</b>！例如第 $0 \\sim 1$ 秒的平均速度為 $0.2\\text{ m/s}$，這其實就是 $t = 0.5$ 秒時的瞬時速度。利用這個技巧，我們把求加速度的問題，轉化為相鄰中間時刻（時間差 $\\Delta t = 1\\text{ s}$）的速度變化，輕鬆得出 <span class="formula-highlight">$a = \\frac{\\Delta v}{\\Delta t} = 0.4\\text{ m/s}^2$</span>！</p>
          `, `
            <h3>💡 Teacher's Analysis: Derivation & Mid-Time Velocity</h3>
            <p>In uniform acceleration, <b>'the average velocity over a time interval equals the instantaneous velocity at the EXACT MIDDLE of that interval'</b>! E.g., the avg velocity from $0 \\sim 1$ sec is $0.2\\text{ m/s}$, which is the instant velocity at $t = 0.5$ sec. With this trick, we easily find acceleration <span class="formula-highlight">$a = \\frac{\\Delta v}{\\Delta t} = 0.4\\text{ m/s}^2$</span>!</p>
          `);
        }
      }

      function animate(ts) {
        if (!animStartTime) animStartTime = ts;
        const elapsed = ts - animStartTime;
        const phys = currentPhys;
        const frac = Math.min(1, elapsed / ANIM_DURATION);
        const curTime = frac * phys.tMax;

        progressFill.style.width = `${frac * 100}%`;
        renderFrame(curTime, phys);

        if (frac < 1) {
          animId = requestAnimationFrame(animate);
        } else {
          animId = null; animStartTime = null;
          playBtn.textContent = tr('🔄 再次播放', '🔄 Replay');
        }
      }

      playBtn.addEventListener('click', () => {
        if (animId) {
          cancelAnimationFrame(animId); animId = null; animStartTime = null;
          playBtn.textContent = tr('▶ 繼續播放', '▶ Resume');
        } else {
          playBtn.textContent = tr('⏸ 暫停播放', '⏸ Pause');
          animId = requestAnimationFrame(animate);
        }
      });

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          if (animId) { cancelAnimationFrame(animId); animId = null; animStartTime = null; }
          playBtn.textContent = tr('▶ 開始實驗', '▶ Start Lab'); progressFill.style.width = '0%';
          initUI();
        });
      });

      initUI();
      setLang('zh'); // Initialize Bilingual System
    })();
  </script>
</body>
</html>
