<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 等加速度運動 (上)｜打點計時、斜面與等差數列</title>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; background: var(--board-dark); color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif; padding: 20px 14px 60px;
    }

    .wrap { max-width: 1400px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 2.1rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 780px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem; }

    .board {
      background: var(--board); border: 10px solid var(--frame); border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px; margin-bottom: 20px; position: relative;
    }
    .board h2 {
      font-family: 'Kalam', cursive; font-size: 1.25rem; margin: 0 0 14px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 14px 16px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left;
    }
    .mode-switch button span.sub { font-size: 0.78rem; font-weight: 400; opacity: 0.7; display: block; margin-top: 4px; }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.85; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 14px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--chalk-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 5px; background: transparent; cursor: pointer; }

    .presets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .presets span { font-size: 0.8rem; color: var(--chalk-dim); margin-right: 4px; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 1px dashed var(--chalk-dim);
      color: var(--chalk); padding: 6px 12px; border-radius: 18px; font-size: 0.8rem; cursor: pointer;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .playbar { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    #playBtn {
      background: var(--chalk-yellow); color: var(--board-dark); border: none; font-weight: 700;
      padding: 10px 24px; border-radius: 24px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem;
      min-width: 110px; box-shadow: 0 4px 12px rgba(242, 214, 117, 0.3);
    }
    .progress-track { flex: 1; height: 6px; background: rgba(242, 236, 217, 0.15); border-radius: 3px; position: relative; overflow: hidden; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--chalk-yellow); border-radius: 3px; width: 0%; }

    .dual-view { display: flex; gap: 16px; margin: 12px 0 8px; align-items: stretch; }
    .graph-card { flex: 1; min-width: 0; background: rgba(0, 0, 0, 0.22); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; }
    .visual-card { flex: 1; min-width: 0; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }

    .legend { display: flex; gap: 14px; margin-bottom: 8px; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: var(--chalk-dim); flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { width: 12px; height: 3px; display: inline-block; border-radius: 2px; }

    svg { width: 100%; height: auto; display: block; overflow: visible; }
    .axis-line { stroke: var(--chalk-dim); stroke-width: 1; opacity: 0.6; }
    .grid-line { stroke: var(--chalk-dim); stroke-width: 0.5; stroke-dasharray: 3 3; opacity: 0.2; }
    .curve-x { fill: none; stroke: var(--x-color); stroke-width: 2.5; stroke-linecap: round; }
    .curve-v { fill: none; stroke: var(--v-color); stroke-width: 2.5; stroke-linecap: round; }
    .dot-x { fill: var(--x-color); }
    .dot-v { fill: var(--v-color); }

    .phase-badge {
      font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.1);
      color: var(--chalk); text-align: center; width: 100%; margin-bottom: 10px;
    }
    .phase-badge.blue { background: rgba(95, 176, 255, 0.2); color: #8fd0ff; border: 1px solid #5fb0ff; }

    #combinedSvg { width: 100%; min-height: 340px; }
    #visualSvg { width: 100%; min-height: 340px; }
    .guide-line { stroke: var(--chalk-yellow); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.6; fill: none; }

    /* 表格推導專用 CSS */
    #derivationTableContainer { width: 100%; display: none; flex-direction: column; height: 100%; justify-content: center; }
    .deriv-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; text-align: center; background: rgba(0,0,0,0.2); border: 1.5px solid var(--chalk-dim); }
    .deriv-table th, .deriv-table td { border: 1px solid rgba(242, 236, 217, 0.3); padding: 8px 0; }
    .deriv-table th { background: rgba(242, 214, 117, 0.15); color: var(--chalk-yellow); font-weight: 700; }
    .deriv-table .calc-row { background: rgba(95, 176, 255, 0.1); color: #8fd0ff; }
    .deriv-table .acc-row { background: rgba(239, 106, 90, 0.15); color: #ff9485; font-weight: bold; }
    .slash-cell { background: linear-gradient(to bottom right, transparent 48%, rgba(242, 236, 217, 0.4) 49%, rgba(242, 236, 217, 0.4) 51%, transparent 52%); }

    .deriv-btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .deriv-btn { flex: 1; padding: 8px; font-weight: bold; font-size: 0.85rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--chalk-yellow); background: transparent; color: var(--chalk-yellow); }
    .deriv-btn.active { background: var(--chalk-yellow); color: var(--board-dark); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--chalk-yellow); font-weight: 600; margin-top: 3px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 14px 18px; }
    .explain-box h3 { font-family: 'Kalam', cursive; color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.1rem; }
    .explain-box p { margin: 0; font-size: 0.9rem; line-height: 1.6; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; }

    .tape-quiz-box { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(242, 236, 217, 0.2); border-radius: 8px; padding: 12px; margin-top: 10px; }
    .tape-btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
    .tape-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--chalk-dim); color: var(--chalk); padding: 8px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; text-align: left; }
    .tape-btn.active { background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); font-weight: bold; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 0.8rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }

    @media (max-width: 768px) { .dual-view { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Taiwan Middle School Science · Chapter 1-4 Kinematics</div>
      <h1>等加速度運動（上）：打點計時、斜面與等差數列</h1>
      <p>完全視覺化物理教材！徹底清除冗餘表格，讓視覺與圖像直球對決！</p>
    </header>

    <div class="board">
      <h2>① 選擇基礎實驗與考題模組</h2>
      <div class="mode-switch">
        <button class="active" data-mode="ticker">
          <span>⏱️ 1. 水平打點計時器</span>
          <span class="sub">4大考題練習與紙帶打點</span>
        </button>
        <button data-mode="incline">
          <span>📐 2. 伽利略斜面運動</span>
          <span class="sub">100%純視覺斜面滾球圖 (零表格！)</span>
        </button>
        <button data-mode="table_deriv">
          <span>📝 3. 等差數列破解等加速</span>
          <span class="sub">表格推導與中間時刻</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>

      <div class="playbar" id="playbarContainer">
        <button id="playBtn">▶ 開始實驗</button>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="board">
      <h2>② 物理動態與運動學圖形聯動</h2>
      <div class="dual-view">
        <div class="graph-card">
          <div class="legend" id="graphLegend">
            <span id="legendX"><i style="background:var(--x-color)"></i>藍線：x-t（位移）</span>
            <span id="legendV"><i style="background:var(--v-color)"></i>紅線：v-t（速度）</span>
          </div>
          <svg id="combinedSvg" viewBox="0 0 680 340"></svg>
        </div>

        <div class="visual-card">
          <div class="phase-badge blue" id="phaseBadge">準備就緒</div>
          
          <!-- 這裡就是你千萬期盼的純 SVG 斜面圖容器！ -->
          <svg id="visualSvg" viewBox="0 0 320 340"></svg>
          
          <!-- 表格推導只有在模式3才會打開！模式2絕對不會出現！ -->
          <div id="derivationTableContainer">
            <div class="deriv-btn-group">
              <button class="deriv-btn active" id="btnDeriv0">Step 0: 原始數據</button>
              <button class="deriv-btn" id="btnDeriv1">Step 1: 算位移</button>              
              <button class="deriv-btn" id="btnDeriv2">Step 2: 算平均速度</button>              
              <button class="deriv-btn" id="btnDeriv3">Step 3: 找中間時刻</button>              
              <button class="deriv-btn" id="btnDeriv4">Step 4: 求加速度</button>
            </div>
            <table class="deriv-table" id="derivTable"></table>
          </div>
        </div>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>③ 課堂重點與物理概念剖析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>
    <footer>國中理化 · 等加速度運動視覺化教材 · 徹底告別錯亂排版</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const playBtn = document.getElementById('playBtn');
      const progressFill = document.getElementById('progressFill');
      const playbarContainer = document.getElementById('playbarContainer');
      const combinedSvg = document.getElementById('combinedSvg');
      const visualSvg = document.getElementById('visualSvg');
      const phaseBadge = document.getElementById('phaseBadge');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const legendX = document.getElementById('legendX');
      const legendV = document.getElementById('legendV');
      const derivationTableContainer = document.getElementById('derivationTableContainer');
      const derivTable = document.getElementById('derivTable');

      let currentMode = 'ticker';
      let animId = null; let animStartTime = null; let currentPhys = null;
      const ANIM_DURATION = 4000;

      const params = {
        ticker:      { quiz: 1, f: 10, a: 3.5, v0: 0.2 },
        incline:     { angle: 30, g: 10.0 },
        table_deriv: { step: 0 }
      };

      const SVG_NS = 'http://www.w3.org/2000/svg';
      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { for (let key in attrs) el.setAttribute(key, attrs[key]); }
        return el;
      }
      function addTextToSvg(parent, x, y, txt, anchor, color, size, weight='normal') {
        const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight });
        t.textContent = txt; parent.appendChild(t);
      }

      function initUI() {
        // ★ 核心修復：強制模式隔離！切換到斜面時，絕對消滅表格容器！
        if (currentMode === 'table_deriv') {
          visualSvg.style.display = 'none';
          phaseBadge.style.display = 'none';
          playbarContainer.style.display = 'none';
          derivationTableContainer.style.display = 'flex';
          
          for (let i = 0; i <= 4; i++) {
            const btn = document.getElementById(`btnDeriv${i}`);
            btn.onclick = () => {
              params.table_deriv.step = i;
              document.querySelectorAll('.deriv-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              updateSimulation();
            };
          }
        } else {
          // 在斜面模式(incline)與打點模式(ticker)下，表格完全隱藏，只顯示純 SVG 圖！
          visualSvg.style.display = 'block';
          phaseBadge.style.display = 'block';
          playbarContainer.style.display = 'flex';
          derivationTableContainer.style.display = 'none';
        }

        renderControls(); renderPresets(); updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        const m = currentMode; const p = params[m];
        if (m === 'ticker') {
          const div = document.createElement('div'); div.style.gridColumn = '1 / -1';
          div.innerHTML = `
            <div class="tape-quiz-box">
              <span style="color:var(--chalk-yellow); font-weight:bold; font-size:0.85rem;">📝 考卷典型題型練習（水平向右拉動）</span>
              <div class="tape-btn-group">
                <button class="tape-btn ${p.quiz === 1 ? 'active' : ''}" onclick="setTickerQuiz(1)">案例①：等加速運動（越來越快）</button>
                <button class="tape-btn ${p.quiz === 2 ? 'active' : ''}" onclick="setTickerQuiz(2)">案例②：等減速運動（越來越慢）</button>
                <button class="tape-btn ${p.quiz === 3 ? 'active' : ''}" onclick="setTickerQuiz(3)">案例③：等速度運動（高速等速）</button>
                <button class="tape-btn ${p.quiz === 4 ? 'active' : ''}" onclick="setTickerQuiz(4)">案例④：陷阱綜合題（先加速後減速）</button>
              </div>
            </div>`;
          controlsBox.appendChild(div);
          window.setTickerQuiz = (q) => {
            p.quiz = q;
            if (q === 1) { p.v0 = 0.2; p.a = 3.5; } else if (q === 2) { p.v0 = 4.5; p.a = -2.8; }
            else if (q === 3) { p.v0 = 3.0; p.a = 0.0; } else if (q === 4) { p.v0 = 0.0; p.a = 4.0; }
            renderControls(); updateSimulation();
          };
          const fDiv = document.createElement('div'); fDiv.className = 'control';
          fDiv.innerHTML = `<label>打點計時頻率 f <span class="val" id="val_f">${p.f} Hz</span></label><input type="range" min="5" max="20" step="5" value="${p.f}">`;
          controlsBox.appendChild(fDiv);
          fDiv.querySelector('input').addEventListener('input', e => { p.f = parseFloat(e.target.value); document.getElementById('val_f').textContent = `${p.f} Hz`; updateSimulation(); });
        } else if (m === 'incline') {
          const div = document.createElement('div'); div.style.gridColumn = '1 / -1';
          div.innerHTML = `<p style="margin:0; font-size:0.95rem; color:var(--chalk-yellow); line-height:1.6;">💡 <b>教具觀念提點：</b>左方 $v-t$ 圖的五色面積比，現在<b>100%直接對應右方直角斜面上的五段幾何長度</b>！按下「▶ 開始實驗」，看球體如何在相同時間內滾過 1 : 3 : 5 : 7 : 9 的距離！</p>`;
          controlsBox.appendChild(div);
        } else if (m === 'table_deriv') {
          const div = document.createElement('div'); div.style.gridColumn = '1 / -1';
          div.innerHTML = `<p style="margin:0; font-size:0.9rem; color:var(--chalk-dim);">✨ 依序點擊右側按鈕，看中間時刻如何破解加速度！</p>`;
          controlsBox.appendChild(div);
        }
      }

      function renderPresets() {
        presetsBox.innerHTML = '';
        if (currentMode !== 'ticker') return;
        presetsBox.innerHTML = '<span>⚡ 快速情境：</span>';
        const addBtn = (label, fVal) => {
          const b = document.createElement('button'); b.textContent = label;
          b.onclick = () => { params.ticker.f = fVal; renderControls(); updateSimulation(); };
          presetsBox.appendChild(b);
        };
        addBtn('標準打點 10Hz', 10); addBtn('密打點 20Hz', 20);
      }

      function calculatePhysics() {
        const m = currentMode; const p = params[m];
        if (m === 'ticker') {
          const dt = 1 / p.f; const totalTime = 1.4; const dots = [];
          let stopTime = Infinity;
          const calcPos = (t_val) => {
            if (p.quiz === 4) {
              if (t_val <= 0.7) return { x: 0.5 * 5.0 * t_val * t_val, v: 5.0 * t_val };
              else { const dt2 = t_val - 0.7; return { x: 1.225 + 3.5 * dt2 - 0.5 * 4.0 * dt2 * dt2, v: 3.5 - 4.0 * dt2 }; }
            } else { return { x: p.v0 * t_val + 0.5 * p.a * t_val * t_val, v: p.v0 + p.a * t_val }; }
          };
          if (p.quiz === 4) stopTime = 0.7 + (3.5 / 4.0); else if (p.a < 0) stopTime = -p.v0 / p.a;
          for (let t = 0; t <= totalTime; t += dt) {
            let actualT = Math.min(t, stopTime); let state = calcPos(actualT);
            dots.push({ t, x: Math.max(0, state.x), v: Math.max(0, state.v) });
          }
          const endState = calcPos(Math.min(totalTime, stopTime));
          const maxV = Math.max(...dots.map(d => d.v));
          return { tMax: totalTime, xMax: Math.max(0.1, endState.x), vMax: maxV !== -Infinity ? Math.max(maxV, 0.1) : 0.1, dots, dt, quiz: p.quiz, stopTime, calcPos };        
        } else if (m === 'incline') {
          return { tMax: 5.0, vMax: 50.0, a: 10.0 };
        } else {
          return {
            tMax: 5, xMax: 5.0, vMax: 2.0, 
            times: [0, 1, 2, 3, 4, 5], positions: [0, 0.2, 0.8, 1.8, 3.2, 5.0],
            displacements: [0.2, 0.6, 1.0, 1.4, 1.8], avgVelocities: [0.2, 0.6, 1.0, 1.4, 1.8], midTimes: [0.5, 1.5, 2.5, 3.5, 4.5], accelerations: [0.4, 0.4, 0.4, 0.4],
            step: p.step
          };
        }
      }

      function updateSimulation() {
        const phys = calculatePhysics(); currentPhys = phys;
        if (currentMode === 'table_deriv') {
          legendX.style.display = 'none'; legendV.innerHTML = '<i style="background:var(--v-color)"></i>紅線：v-t（速度）';
        } else if (currentMode === 'incline') {
          legendX.style.display = 'none'; legendV.innerHTML = '<i style="background:#ffffff"></i>白線：v-t 斜直線 ｜ 五色區塊：第1~5秒內位移面積 (1:3:5:7:9)';
        } else {
          legendX.style.display = 'inline-flex'; legendV.innerHTML = '<i style="background:var(--v-color)"></i>紅線：v-t（速度）';
        }
        drawGraph(phys);
        if (currentMode === 'table_deriv') { drawDerivationTable(phys); }
        else { drawVisualBackground(phys); renderFrame(0, phys); }
        updateStatsAndExplain(phys);
        if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(e=>console.log(e));
      }

      function drawGraph(phys) {
        combinedSvg.innerHTML = '';
        const W = 680, H = 340; const margin = { top: 30, right: 50, bottom: 40, left: 50 };
        const pW = W - margin.left - margin.right; const pH = H - margin.top - margin.bottom;
        const addLine = (x1, y1, x2, y2, cls, extra={}) => {
          const el = createSvgEl('line', { x1, y1, x2, y2, class: cls });
          for(let k in extra) el.setAttribute(k, extra[k]); combinedSvg.appendChild(el);
        };
        addLine(margin.left, margin.top + pH, margin.left + pW, margin.top + pH, 'axis-line');
        addLine(margin.left, margin.top, margin.left, margin.top + pH, 'axis-line');
        for (let i = 1; i <= 5; i++) {
          addLine(margin.left + (i / 5) * pW, margin.top, margin.left + (i / 5) * pW, margin.top + pH, 'grid-line');
          addLine(margin.left, margin.top + (i / 5) * pH, margin.left + pW, margin.top + (i / 5) * pH, 'grid-line');
        }
        const getX = t => margin.left + (t / phys.tMax) * pW;        
        const getY_x = x_val => margin.top + pH - (x_val / (phys.xMax || 1)) * pH;
        const getY_v = v_val => margin.top + pH - (v_val / (phys.vMax * 1.05 || 1)) * pH;

        if (currentMode === 'incline') {
          const fillColors = ['rgba(95, 176, 255, 0.65)', 'rgba(242, 214, 117, 0.65)', 'rgba(239, 106, 90, 0.65)', 'rgba(189, 147, 249, 0.65)', 'rgba(46, 196, 182, 0.65)'];
          const strokeColors = ['#5fb0ff', '#f2d675', '#ef6a5a', '#bd93f9', '#2ec4b6'];
          const ratios = ['1', '3', '5', '7', '9'];
          for (let i = 0; i < 5; i++) {
            const x1 = getX(i), x2 = getX(i + 1), y1 = getY_v(i * 10), y2 = getY_v((i + 1) * 10), y0 = margin.top + pH;
            combinedSvg.appendChild(createSvgEl('polygon', { points: `${x1},${y0} ${x1},${y1} ${x2},${y2} ${x2},${y0}`, fill: fillColors[i], stroke: strokeColors[i], 'stroke-width': 1.5 }));
            const label = createSvgEl('text', { x: (x1 + x2) / 2, y: (y0 + (y1 + y2) / 2) / 2 + 6, 'text-anchor': 'middle', fill: '#ffffff', 'font-size': '20', 'font-weight': 'bold' });
            label.textContent = ratios[i]; combinedSvg.appendChild(label);
          }
          addLine(margin.left, margin.top + pH, getX(5.3), getY_v(53), '', { 'stroke': '#ffffff', 'stroke-width': 3.5, 'stroke-linecap': 'round' });
          addTextToSvg(combinedSvg, margin.left - 10, margin.top - 8, '速度 v (m/s)', 'start', '#f2ecd9', 12, 'bold');
          addTextToSvg(combinedSvg, margin.left + pW / 2, H - 10, '運動時間 t (s)', 'middle', 'var(--chalk-dim)', 11);
          for (let i = 1; i <= 5; i++) {
            addTextToSvg(combinedSvg, getX(i), margin.top + pH + 18, `${i}`, 'middle', 'var(--chalk-yellow)', 12, 'bold');
            addTextToSvg(combinedSvg, margin.left - 10, getY_v(i * 10) + 4, `${i * 10}`, 'end', '#f2ecd9', 11);
          }
          return;
        }

        if (currentMode !== 'table_deriv') addTextToSvg(combinedSvg, margin.left - 10, margin.top - 8, '位置 x', 'start', 'var(--x-color)', 10);
        addTextToSvg(combinedSvg, margin.left + pW + 10, margin.top - 8, '速度 v', 'end', 'var(--v-color)', 10);
        addTextToSvg(combinedSvg, margin.left + pW / 2, H - 8, '運動時間 t (s)', 'middle', 'var(--chalk-dim)', 10);

        if (currentMode === 'table_deriv') {
          phys.times.forEach(t => addTextToSvg(combinedSvg, getX(t), margin.top+pH+15, t, 'middle', 'var(--chalk-dim)', 10));
          [0.5, 1.0, 1.5, 2.0].forEach(v => addTextToSvg(combinedSvg, margin.left-10, getY_v(v)+4, v, 'end', 'var(--v-color)', 10));
          combinedSvg.appendChild(createSvgEl('polyline', { points: phys.times.map(t => `${getX(t)},${getY_v(0.4 * t)}`).join(' '), class: 'curve-v', style: 'stroke-width: 2.5; opacity: 0.7;' }));
          if (phys.step >= 2) {
            phys.avgVelocities.forEach((v, i) => {
              combinedSvg.appendChild(createSvgEl('rect', { x: getX(phys.times[i]), y: getY_v(v), width: (getX(phys.times[i+1])-getX(phys.times[i])), height: (margin.top+pH - getY_v(v)), fill: 'rgba(95, 176, 255, 0.05)', stroke: 'rgba(95, 176, 255, 0.3)', 'stroke-dasharray': '2 4' }));
              addLine(getX(phys.times[i]), getY_v(v), getX(phys.times[i+1]), getY_v(v), '', {'stroke': 'var(--x-color)', 'stroke-width': 3});
            });
          }
          if (phys.step >= 3) {
            phys.midTimes.forEach((mt, i) => {
              addLine(getX(mt), getY_v(phys.avgVelocities[i]), getX(mt), margin.top+pH, '', {'stroke': 'var(--chalk-yellow)', 'stroke-dasharray': '4 4', 'stroke-width': 1.5});
              combinedSvg.appendChild(createSvgEl('circle', { cx: getX(mt), cy: getY_v(phys.avgVelocities[i]), r: 6, fill: 'var(--chalk-yellow)', stroke: '#000', 'stroke-width': 1.5 }));
            });
          }
          return;
        }

        let ptsX = [], ptsV = [];
        for (let i = 0; i <= 60; i++) {
          const t = (i / 60) * phys.tMax; let x = 0, v = 0;
          if (currentMode === 'ticker') { const state = phys.calcPos(Math.min(t, phys.stopTime)); x = state.x; v = state.v; }
          ptsX.push(`${getX(t)},${getY_x(Math.max(0, x))}`); ptsV.push(`${getX(t)},${getY_v(v)}`);
        }
        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsX.join(' '), class: 'curve-x' }));
        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsV.join(' '), class: 'curve-v' }));
        if (currentMode === 'ticker') phys.dots.forEach(d => combinedSvg.appendChild(createSvgEl('circle', { cx: getX(d.t), cy: getY_v(d.v), r: 4, fill: 'var(--chalk-yellow)' })));
        combinedSvg.appendChild(createSvgEl('line', { id: 'svgGuide', class: 'guide-line' }));
        combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotX', r: 6, class: 'dot-x' }));
        combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotV', r: 6, class: 'dot-v' }));
        phys._getX = getX; phys._getY_x = getY_x; phys._getY_v = getY_v;
      }
      
      function drawDerivationTable(phys) {
        let html = `<tr><th>時間 (秒)</th>${phys.times.map(t => `<td colspan="2">${t}</td>`).join('')}</tr><tr><th>位置 (公尺)</th>${phys.positions.map(p => `<td colspan="2">${p.toFixed(1)}</td>`).join('')}</tr>`;
        html += `<tr><th>位移 (公尺)</th>${phys.step >= 1 ? `<td class="slash-cell"></td>` + phys.displacements.map(d => `<td colspan="2" class="calc-row">${d.toFixed(1)}</td>`).join('') + `<td class="slash-cell"></td>` : `<td colspan="${phys.times.length * 2}"></td>`}</tr>`;
        html += `<tr><th>平均速度</th>${phys.step >= 2 ? `<td class="slash-cell"></td>` + phys.avgVelocities.map(v => `<td colspan="2" class="calc-row" style="font-weight:bold;">${v.toFixed(1)}</td>`).join('') + `<td class="slash-cell"></td>` : `<td colspan="${phys.times.length * 2}"></td>`}</tr>`;
        html += `<tr><th>加速度</th>${phys.step >= 4 ? `<td colspan="2" class="slash-cell"></td>` + phys.accelerations.map(a => `<td colspan="2" class="acc-row">${a.toFixed(1)}</td>`).join('') + `<td colspan="2" class="slash-cell"></td>` : `<td colspan="${phys.times.length * 2}"></td>`}</tr>`;
        derivTable.innerHTML = html;
      }

      function drawVisualBackground(phys) {
        visualSvg.innerHTML = '';
        const m = currentMode;
        if (m === 'ticker') {
          visualSvg.appendChild(createSvgEl('rect', { x: 5, y: 115, width: 26, height: 30, fill: '#8f8a80', rx: 3 }));
          visualSvg.appendChild(createSvgEl('g', { id: 'tapeGroup' }));
          const car = createSvgEl('g', { id: 'simObject' });
          car.appendChild(createSvgEl('rect', { x: -16, y: 115, width: 32, height: 20, fill: '#5fb0ff', rx: 3 }));
          car.appendChild(createSvgEl('circle', { cx: -10, cy: 135, r: 4.5, fill: '#000' }));
          car.appendChild(createSvgEl('circle', { cx: 8, cy: 135, r: 4.5, fill: '#000' }));
          visualSvg.appendChild(car);
          visualSvg.appendChild(createSvgEl('rect', { x: 5, y: 200, width: 310, height: 115, fill: 'rgba(0,0,0,0.4)', rx: 6 }));
          addTextToSvg(visualSvg, 15, 222, '🔍 【考卷紙帶特寫】：向右拉動', 'start', 'var(--chalk-yellow)', 11, 'bold');
          visualSvg.appendChild(createSvgEl('rect', { x: 15, y: 240, width: 290, height: 28, fill: '#ffffff', rx: 2 }));
          phys.dots.forEach((d, idx) => {
            const dotX = 295 - (d.x / phys.xMax) * 270;
            if (dotX >= 18 && dotX <= 302) {
              visualSvg.appendChild(createSvgEl('circle', { cx: dotX, cy: 254, r: 4.5, fill: '#000000' }));
              if (idx === 0) visualSvg.appendChild(createSvgEl('circle', { cx: dotX, cy: 254, r: 8, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 2 }));
            }
          });
        } else if (m === 'incline') {
          // ★ 這裡就是你千萬期盼的純 SVG 斜面物理圖！絕對沒有表格！
          addTextToSvg(visualSvg, 160, 24, '📐 伽利略斜面：等時間隔位移比 1:3:5:7:9', 'middle', 'var(--chalk-yellow)', 13, 'bold');
          
          const xTop = 40, yTop = 50;
          const xBot = 280, yBot = 270;
          const xLeft = 40, yLeft = 270;
          
          // 畫出直角三角形斜面結構
          visualSvg.appendChild(createSvgEl('polygon', {
            points: `${xTop},${yTop} ${xBot},${yBot} ${xLeft},${yLeft}`,
            fill: 'rgba(242, 214, 117, 0.08)', stroke: 'var(--chalk-dim)', 'stroke-width': 2
          }));
          visualSvg.appendChild(createSvgEl('line', { x1: 20, y1: 270, x2: 300, y2: 270, stroke: 'var(--chalk-dim)', 'stroke-width': 3 }));

          // 累積時間平方比 [0, 1, 4, 9, 16, 25] 對應斜面的 5 段區間
          const cumRatios = [0, 1, 4, 9, 16, 25];
          const colors = ['#5fb0ff', '#f2d675', '#ef6a5a', '#bd93f9', '#2ec4b6'];
          const labels = ['1', '3', '5', '7', '9'];

          // 沿著斜面貼上 5 段高亮彩色軌道
          for(let i=0; i<5; i++) {
            const f1 = cumRatios[i]/25, f2 = cumRatios[i+1]/25;
            const sx1 = xTop + f1*(xBot-xTop), sy1 = yTop + f1*(yBot-yTop);
            const sx2 = xTop + f2*(xBot-xTop), sy2 = yTop + f2*(yBot-yTop);
            visualSvg.appendChild(createSvgEl('line', {
              x1: sx1, y1: sy1, x2: sx2, y2: sy2,
              stroke: colors[i], 'stroke-width': 6, 'stroke-linecap': 'round'
            }));

            // 在斜面法向外側標註超醒目的 1, 3, 5, 7, 9 數字徽章
            const mx = (sx1+sx2)/2 + 18, my = (sy1+sy2)/2 - 12;
            const badge = createSvgEl('circle', { cx: mx, cy: my-4, r: 12, fill: colors[i] });
            visualSvg.appendChild(badge);
            addTextToSvg(visualSvg, mx, my+1, labels[i], 'middle', '#15302a', 13, 'bold');
          }

          // 標記時間點 t=0 ~ t=5
          cumRatios.forEach((cum, idx) => {
            const frac = cum / 25;
            const px = xTop + frac * (xBot - xTop), py = yTop + frac * (yBot - yTop);
            visualSvg.appendChild(createSvgEl('circle', { cx: px, cy: py, r: 4, fill: '#ffffff', stroke: '#000', 'stroke-width': 1.5 }));
            if (idx > 0) addTextToSvg(visualSvg, px - 12, py + 18, `t=${idx}s`, 'middle', 'var(--chalk-dim)', 10);
            else addTextToSvg(visualSvg, px - 15, py - 5, `t=0`, 'end', 'var(--chalk-dim)', 10);
          });

          addTextToSvg(visualSvg, 160, 315, '🎯 動態滾球完全依照 x ∝ t² 定律加速俯衝！', 'middle', 'var(--x-color)', 12, 'bold');
          
          // 斜面滾動的紅球
          const ball = createSvgEl('g', { id: 'simObject' });
          ball.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 12, fill: '#ef6a5a', stroke: '#ffffff', 'stroke-width': 2 }));
          visualSvg.appendChild(ball);
        }
      }

      function renderFrame(t, phys) {
        const m = currentMode;
        if (m === 'table_deriv') return; 
        let x = 0, v = 0;
        if (m === 'ticker') { const state = phys.calcPos(Math.min(t, phys.stopTime)); x = state.x; v = state.v; }
        else if (m === 'incline') { x = 0.5 * phys.a * t * t; v = phys.a * t; }

        if (phys._getX) {
          const cx = phys._getX(t);
          const guide = document.getElementById('svgGuide');
          if (guide) { guide.setAttribute('x1', cx); guide.setAttribute('y1', 20); guide.setAttribute('x2', cx); guide.setAttribute('y2', 320); }
          if (phys._getY_x && phys._getY_v) {
            const dotX = document.getElementById('svgDotX'), dotV = document.getElementById('svgDotV');
            if (dotX && dotV) { dotX.setAttribute('cx', cx); dotX.setAttribute('cy', phys._getY_x(Math.max(0, x))); dotV.setAttribute('cx', cx); dotV.setAttribute('cy', phys._getY_v(v)); }
          }
        }

        const simObj = document.getElementById('simObject');
        const ratio = Math.min(1, Math.max(0, x / (phys.xMax || 1)));
        if (simObj) {
          if (m === 'ticker') {
            simObj.setAttribute('transform', `translate(${30 + ratio * 220}, 0)`);
          } else if (m === 'incline') {
            // 球在直角斜面上精準滾動
            const xTop = 40, yTop = 50, xBot = 280, yBot = 270;
            const ballX = xTop + ratio * (xBot - xTop), ballY = yTop + ratio * (yBot - yTop);
            simObj.setAttribute('transform', `translate(${ballX}, ${ballY}) rotate(${ratio * 360})`);
          }
        }
        phaseBadge.className = 'phase-badge blue';
        phaseBadge.textContent = `⏱️ 實驗進行中：t = ${t.toFixed(2)} s`;
      }

      function updateStatsAndExplain(phys) {
        statsGrid.innerHTML = '';
        const addStat = (k, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };
        const m = currentMode;
        if (m === 'ticker') {
          addStat('打點頻率 f', `${params.ticker.f} Hz`); addStat('時間差 Δt', `${phys.dt.toFixed(3)} s`);
          addStat('紙帶總點數', `${phys.dots.length} 點`); addStat('運動狀態', phys.quiz === 1 ? '等加速 (越來越快)' : '典型運動分析');
          explainBox.innerHTML = `<h3>💡 老師精闢解析：打點計時器判斷黃金法則</h3><p>紙帶向右拉動時，<b>最右邊是第一點（舊點），最左邊是最新點</b>。從右往左看點距越來越大即為等加速運動！相鄰位移呈 <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span> 比例！</p>`;
        } else if (m === 'incline') {
          addStat('時間區間', `0 ~ 5 s`); addStat('間隔時間', `Δt = 1 s`);
          addStat('區間位移比', `1 : 3 : 5 : 7 : 9`); addStat('累積總位移比', `1 : 4 : 9 : 16 : 25`);
          explainBox.innerHTML = `<h3>💡 觀念總結：由靜止開始等加速的「幾何面積與斜面實測」</h3><p>觀察左方 $v-t$ 圖與右方斜面球體落下的軌跡：為什麼在相同時間間隔內，位移差比必定是 <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span>？因為在 $v-t$ 圖中，<b>「圖形與時間軸圍出的面積 = 位移」</b>！當速度隨時間正比遞增，每一秒下的梯形面積正好呈現連續奇數比，右方的斜面球體也完全依照這個比例俯衝，這才是真的直觀物理！</p>`;
        } else {
          addStat('總位移 Δx', `5.0 m`); addStat('加速度 a', `0.4 m/s²`); addStat('推導進度', `Step ${phys.step}`);
          explainBox.innerHTML = `<h3>💡 老師精闢解析：中間時刻與平均速度</h3><p>等加速度運動中，<b>「某時間段內的平均速度，等於該段時間『中間時刻』的瞬時速度」</b>。透過相鄰中間時刻的速度變化，即可輕鬆求得 <span class="formula-highlight">$a = \\frac{\\Delta v}{\\Delta t}$</span>！</p>`;
        }
      }

      function animate(ts) {
        if (!animStartTime) animStartTime = ts;
        const frac = Math.min(1, (ts - animStartTime) / ANIM_DURATION);
        progressFill.style.width = `${frac * 100}%`; renderFrame(frac * currentPhys.tMax, currentPhys);
        if (frac < 1) animId = requestAnimationFrame(animate);
        else { animId = null; animStartTime = null; playBtn.textContent = '🔄 再次播放'; }
      }

      playBtn.addEventListener('click', () => {
        if (animId) { cancelAnimationFrame(animId); animId = null; animStartTime = null; playBtn.textContent = '▶ 繼續播放'; }
        else { playBtn.textContent = '⏸ 暫停播放'; animId = requestAnimationFrame(animate); }
      });

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active'); currentMode = btn.dataset.mode;
          if (animId) { cancelAnimationFrame(animId); animId = null; animStartTime = null; }
          playBtn.textContent = '▶ 開始實驗'; progressFill.style.width = '0%'; initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
