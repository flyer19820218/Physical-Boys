<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 等加速度運動 (上)｜打點計時、斜面與等差數列</title>

  <!-- 強制注入 MathJax 解析設定，確保 inline $ 與 LaTeX 公式絕對不壞掉 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --a-color: #4cd964;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1400px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 2.1rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 780px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-family: 'Kalam', cursive; font-size: 1.25rem; margin: 0 0 14px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 14px 16px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
    }
    .mode-switch button span.sub { font-size: 0.78rem; font-weight: 400; opacity: 0.7; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.4); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.85; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 14px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--chalk-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 5px; background: transparent; cursor: pointer; }

    .presets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .presets span { font-size: 0.8rem; color: var(--chalk-dim); margin-right: 4px; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 1px dashed var(--chalk-dim);
      color: var(--chalk); padding: 6px 12px; border-radius: 18px; font-size: 0.8rem; cursor: pointer; transition: all .15s;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .playbar { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    #playBtn {
      background: var(--chalk-yellow); color: var(--board-dark); border: none; font-weight: 700;
      padding: 10px 24px; border-radius: 24px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem;
      transition: all .15s; box-shadow: 0 4px 12px rgba(242, 214, 117, 0.3); min-width: 110px;
    }
    #playBtn:hover { transform: scale(1.04); box-shadow: 0 6px 16px rgba(242, 214, 117, 0.4); }
    .progress-track { flex: 1; height: 6px; background: rgba(242, 236, 217, 0.15); border-radius: 3px; position: relative; overflow: hidden; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--chalk-yellow); border-radius: 3px; width: 0%; }

    .dual-view { display: flex; gap: 16px; margin: 12px 0 8px; align-items: stretch; }
    .graph-card { min-width: 0; background: rgba(0, 0, 0, 0.22); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; }
    .visual-card { min-width: 220px; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }

    /* 嚴格控制上半部三大分頁「左圖表 : 右模擬器」的寬度比例 */
    .dual-view.ratio-2-1 .graph-card { flex: 2; }
    .dual-view.ratio-2-1 .visual-card { flex: 1; }

    .dual-view.ratio-3-2 .graph-card { flex: 3; }
    .dual-view.ratio-3-2 .visual-card { flex: 2; }

    .dual-view.ratio-1-1 .graph-card { flex: 1; }
    .dual-view.ratio-1-1 .visual-card { flex: 1; }

    .legend { display: flex; gap: 14px; margin-bottom: 8px; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: var(--chalk-dim); flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { width: 12px; height: 3px; display: inline-block; border-radius: 2px; }

    svg { width: 100%; height: auto; display: block; overflow: visible; }
    .axis-line { stroke: var(--chalk-dim); stroke-width: 1; opacity: 0.6; }
    .grid-line { stroke: var(--chalk-dim); stroke-width: 0.5; stroke-dasharray: 3 3; opacity: 0.2; }
    .curve-x { fill: none; stroke: var(--x-color); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .curve-v { fill: none; stroke: var(--v-color); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    .dot-x { fill: var(--x-color); filter: drop-shadow(0 0 4px rgba(95, 176, 255, 0.9)); }
    .dot-v { fill: var(--v-color); filter: drop-shadow(0 0 4px rgba(239, 106, 90, 0.9)); }

    .phase-badge {
      font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.1);
      color: var(--chalk); text-align: center; width: 100%; margin-bottom: 10px; white-space: nowrap;
    }
    .phase-badge.blue { background: rgba(95, 176, 255, 0.2); color: #8fd0ff; border: 1px solid #5fb0ff; }

    #combinedSvg { width: 100%; min-height: 340px; }
    #visualSvg { width: 100%; min-height: 340px; }
    .guide-line { stroke: var(--chalk-yellow); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.6; fill: none; }

    #derivationTableContainer { width: 100%; display: none; flex-direction: column; height: 100%; justify-content: center; }
    .deriv-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; text-align: center; background: rgba(0,0,0,0.2); border: 1.5px solid var(--chalk-dim); table-layout: fixed; }
    .deriv-table th, .deriv-table td { border: 1px solid rgba(242, 236, 217, 0.3); padding: 8px 0; }
    .deriv-table th { background: rgba(242, 214, 117, 0.15); color: var(--chalk-yellow); font-family: 'Noto Sans TC', sans-serif; font-weight: 700; white-space: nowrap; }
    .deriv-table .val-cell { color: var(--chalk); }
    .deriv-table .calc-row { background: rgba(95, 176, 255, 0.1); color: #8fd0ff; }
    .deriv-table .acc-row { background: rgba(239, 106, 90, 0.15); color: #ff9485; font-weight: bold; }
    .slash-cell {
      background: linear-gradient(to bottom right, transparent 48%, rgba(242, 236, 217, 0.4) 49%, rgba(242, 236, 217, 0.4) 51%, transparent 52%);
    }

    .deriv-btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .deriv-btn { flex: 1; padding: 8px; font-family: 'Noto Sans TC'; font-weight: bold; font-size: 0.85rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--chalk-yellow); background: transparent; color: var(--chalk-yellow); transition: all 0.2s; }
    .deriv-btn.active { background: var(--chalk-yellow); color: var(--board-dark); }
    .deriv-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--chalk-dim); color: var(--chalk-dim); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--chalk-yellow); font-weight: 600; margin-top: 3px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 14px 18px; }
    .explain-box h3 { font-family: 'Kalam', cursive; color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.1rem; }
    .explain-box p { margin: 0; font-size: 0.9rem; line-height: 1.6; color: var(--chalk); }

    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; }

    .tape-quiz-box { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(242, 236, 217, 0.2); border-radius: 8px; padding: 12px; margin-top: 10px; }
    .tape-quiz-title { font-size: 0.85rem; color: var(--chalk-yellow); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .tape-btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
    .tape-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--chalk-dim); color: var(--chalk); padding: 8px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; text-align: left; transition: all .15s; }
    .tape-btn:hover, .tape-btn.active { background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); font-weight: bold; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 0.8rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }

    @media (max-width: 768px) {
      .dual-view { flex-direction: column; }
      .visual-card { width: 100%; min-height: 340px; }
      .tape-btn-group { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Taiwan Middle School Science · Chapter 1-4 Kinematics (Part 1)</div>
      <h1>等加速度運動（上）：打點計時、斜面與等差數列</h1>
      <p>專為國中會考量身打造！徹底破解「打點計時器點序方向」迷思、直觀演示伽利略斜面俯衝比例，並以表格一步步推導中間時刻與平均速度的奧秘！</p>
    </header>

    <div class="board">
      <h2>① 選擇基礎實驗與考題模組</h2>
      <div class="mode-switch">
        <button class="active" data-mode="ticker">
          <span>⏱️ 1. 水平打點計時器</span>
          <span class="sub">4大考題練習與紙帶打點</span>
        </button>
        <button data-mode="incline">
          <span>📐 2. 伽利略斜面運動</span>
          <span class="sub">1:3:5:7:9 距離比驗證</span>
        </button>
        <button data-mode="table_deriv">
          <span>📝 3. 等差數列破解等加速</span>
          <span class="sub">表格推導與中間時刻</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>

      <div class="playbar" id="playbarContainer">
        <button id="playBtn">▶ 開始實驗</button>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="board">
      <h2>② 物理動態與運動學圖形聯動</h2>
      <div class="dual-view" id="dualViewContainer">
        <div class="graph-card">
          <div class="legend" id="graphLegend">
            <span id="legendX"><i style="background:var(--x-color)"></i>藍線：x-t（位置/位移）</span>
            <span id="legendV"><i style="background:var(--v-color)"></i>紅線：v-t（速度）</span>
          </div>
          <svg id="combinedSvg" viewBox="0 0 680 340"></svg>
        </div>

        <div class="visual-card">
          <div class="phase-badge blue" id="phaseBadge">準備就緒</div>
          <svg id="visualSvg" viewBox="0 0 220 340"></svg>
          
          <div id="derivationTableContainer">
            <div class="deriv-btn-group">
              <button class="deriv-btn active" id="btnDeriv0">Step 0: 原始數據</button>
              <button class="deriv-btn" id="btnDeriv1">Step 1: 算位移</button>              
              <button class="deriv-btn" id="btnDeriv2">Step 2: 算平均速度</button>              
              <button class="deriv-btn" id="btnDeriv3">Step 3: 找中間時刻</button>              
              <button class="deriv-btn" id="btnDeriv4">Step 4: 求加速度</button>
            </div>
            <table class="deriv-table" id="derivTable">
              <!-- JS 動態生成 -->
            </table>
          </div>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>③ 課堂重點與物理概念剖析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer>國中理化 · 等加速度運動（上篇） · 視覺化互動教學教材 · 基礎概念徹底破解！</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const playBtn = document.getElementById('playBtn');
      const progressFill = document.getElementById('progressFill');
      const playbarContainer = document.getElementById('playbarContainer');
      const combinedSvg = document.getElementById('combinedSvg');
      const visualSvg = document.getElementById('visualSvg');
      const phaseBadge = document.getElementById('phaseBadge');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const legendX = document.getElementById('legendX');
      const derivationTableContainer = document.getElementById('derivationTableContainer');
      const derivTable = document.getElementById('derivTable');
      const dualViewContainer = document.getElementById('dualViewContainer');

      let currentMode = 'ticker';
      let animId = null;
      let animStartTime = null;
      let currentPhys = null;
      const ANIM_DURATION = 4000;

      const params = {
        ticker:      { quiz: 1, f: 10, a: 3.5, v0: 0.2 },
        incline:     { angle: 30, g: 9.8, L: 5.0 },
        table_deriv: { step: 0 }
      };

      const SVG_NS = 'http://www.w3.org/2000/svg';

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) {
          for (let key in attrs) el.setAttribute(key, attrs[key]);
        }
        return el;
      }

      function addTextToSvg(parent, x, y, txt, anchor, color, size, weight='normal') {
        const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight });
        t.textContent = txt;
        parent.appendChild(t);
      }

      function initUI() {
        /* 嚴格控制上半部三大分頁比例：2:1、3:2、1:1 */
        dualViewContainer.classList.remove('ratio-2-1', 'ratio-3-2', 'ratio-1-1');
        if (currentMode === 'ticker') {
          dualViewContainer.classList.add('ratio-2-1');
        } else if (currentMode === 'incline') {
          dualViewContainer.classList.add('ratio-3-2');
        } else if (currentMode === 'table_deriv') {
          dualViewContainer.classList.add('ratio-1-1');
        }

        if (currentMode === 'table_deriv') {
          visualSvg.style.display = 'none';
          phaseBadge.style.display = 'none';
          playbarContainer.style.display = 'none';
          derivationTableContainer.style.display = 'flex';
          
          for (let i = 0; i <= 4; i++) {
            const btn = document.getElementById(`btnDeriv${i}`);
            btn.onclick = () => {
              params.table_deriv.step = i;
              document.querySelectorAll('.deriv-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              updateSimulation();
            };
          }
        } else {
          visualSvg.style.display = 'block';
          phaseBadge.style.display = 'block';
          playbarContainer.style.display = 'flex';
          derivationTableContainer.style.display = 'none';
        }

        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, label, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${label} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            const newVal = parseFloat(e.target.value);
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            onChange(newVal);
            updateSimulation();
          });
        };

        if (m === 'ticker') {
          const div = document.createElement('div');
          div.style.gridColumn = '1 / -1';
          div.innerHTML = `
            <div class="tape-quiz-box">
              <div class="tape-quiz-title">
                <span>📝 考卷典型題型練習（水平向右拉動）</span>
                <span style="font-size:0.75rem; font-weight:normal; color:var(--chalk-dim);">點選立即切換紙帶</span>
              </div>
              <div class="tape-btn-group">
                <button class="tape-btn ${p.quiz === 1 ? 'active' : ''}" onclick="setTickerQuiz(1)">案例①：等加速運動（越來越快）</button>
                <button class="tape-btn ${p.quiz === 2 ? 'active' : ''}" onclick="setTickerQuiz(2)">案例②：等減速運動（越來越慢）</button>
                <button class="tape-btn ${p.quiz === 3 ? 'active' : ''}" onclick="setTickerQuiz(3)">案例③：等速度運動（高速等速）</button>
                <button class="tape-btn ${p.quiz === 4 ? 'active' : ''}" onclick="setTickerQuiz(4)">案例④：陷阱綜合題（先加速後減速）</button>
              </div>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setTickerQuiz = (q) => {
            p.quiz = q;
            if (q === 1) { p.v0 = 0.2; p.a = 3.5; }
            else if (q === 2) { p.v0 = 4.5; p.a = -2.8; }
            else if (q === 3) { p.v0 = 3.0; p.a = 0.0; }
            else if (q === 4) { p.v0 = 0.0; p.a = 4.0; }
            renderControls();
            updateSimulation();
          };
          addSlider('f', '打點計時頻率 f', 5, 20, 5, p.f, 'Hz', v => p.f = v);
        } else if (m === 'incline') {
          addSlider('angle', '斜面傾斜角度 θ', 10, 90, 5, p.angle, '度 (°)', v => p.angle = v);
          addSlider('L', '斜面總長度 L', 2.0, 10.0, 0.5, p.L, 'm', v => p.L = v);
          addSlider('g', '重力加速度 g', 1.6, 20.0, 0.2, p.g, 'm/s²', v => p.g = v);
        } else if (m === 'table_deriv') {
          const div = document.createElement('div');
          div.style.gridColumn = '1 / -1';
          div.innerHTML = `<p style="margin:0; font-size:0.9rem; color:var(--chalk-dim);">✨ 請依序點擊右側的 <b>Step 按鈕</b>，觀察從「位移」推導至「加速度」的交錯表格填寫過程。留意 v-t 圖上的對應變化！</p>`;
          controlsBox.appendChild(div);
        }
      }

      function renderPresets() {
        presetsBox.innerHTML = '<span>⚡ 快速情境：</span>';
        const m = currentMode;
        const addBtn = (label, action) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = () => { action(); renderControls(); updateSimulation(); };
          presetsBox.appendChild(b);
        };

        if (m === 'ticker') {
          addBtn('標準打點 10Hz', () => { params.ticker.f = 10; });
          addBtn('密打點 20Hz', () => { params.ticker.f = 20; });
        } else if (m === 'incline') {
          addBtn('經典 30° (1:3:5:7:9)', () => { params.incline.angle = 30; params.incline.L = 5.0; params.incline.g = 9.8; });
          addBtn('極限 90° (等於落體)', () => { params.incline.angle = 90; params.incline.L = 8.0; params.incline.g = 9.8; });
        }
      }

      function calculatePhysics() {
        const m = currentMode;
        const p = params[m];
        let res = {};

        if (m === 'ticker') {
          const dt = 1 / p.f;
          const totalTime = 1.4;
          const dots = [];
          
          let stopTime = Infinity;
          const calcPos = (t_val) => {
            if (p.quiz === 4) {
              if (t_val <= 0.7) return { x: 0.5 * 5.0 * t_val * t_val, v: 5.0 * t_val };
              else {
                const dt2 = t_val - 0.7;
                return { x: 1.225 + 3.5 * dt2 - 0.5 * 4.0 * dt2 * dt2, v: 3.5 - 4.0 * dt2 };
              }
            } else {
              return { x: p.v0 * t_val + 0.5 * p.a * t_val * t_val, v: p.v0 + p.a * t_val };
            }
          };

          if (p.quiz === 4) stopTime = 0.7 + (3.5 / 4.0);
          else if (p.a < 0) stopTime = -p.v0 / p.a;

          for (let t = 0; t <= totalTime; t += dt) {
            let actualT = Math.min(t, stopTime);
            let state = calcPos(actualT);
            dots.push({ t, x: Math.max(0, state.x), v: Math.max(0, state.v) });
          }
          
          const endState = calcPos(Math.min(totalTime, stopTime));
          const xMax = Math.max(0.1, endState.x);
          const maxV = Math.max(...dots.map(d => d.v));
          res = { tMax: totalTime, xMax, vMax: maxV !== -Infinity ? Math.max(maxV, 0.1) : 0.1, dots, dt, quiz: p.quiz, stopTime, calcPos };        
        } else if (m === 'incline') {
          const rad = p.angle * Math.PI / 180;
          const a = p.g * Math.sin(rad);
          const tMax = Math.sqrt(2 * p.L / a);
          const vMax = a * tMax;
          /* 維持加長的斜面視覺長度與起點調整 */
          const xTop = 15, yTop = 20, rampLen = 160;
          const xBot = xTop + rampLen * Math.cos(rad);
          const yBot = yTop + rampLen * Math.sin(rad);
          res = { tMax, xMax: p.L, vMax, a, _ramp: { xTop, yTop, rad, rampLen, xBot, yBot } };
        } else if (m === 'table_deriv') {
          const times = [0, 1, 2, 3, 4, 5];
          const positions = [0, 0.2, 0.8, 1.8, 3.2, 5.0];
          const displacements = [0.2, 0.6, 1.0, 1.4, 1.8]; 
          const avgVelocities = [0.2, 0.6, 1.0, 1.4, 1.8]; 
          const midTimes = [0.5, 1.5, 2.5, 3.5, 4.5];       
          const accelerations = [0.4, 0.4, 0.4, 0.4];                  
          res = {
            tMax: 5, xMax: 5.0, vMax: 2.0, 
            times, positions, displacements, avgVelocities, midTimes, accelerations,
            step: p.step
          };
        }
        return res;
      }

      function updateSimulation() {
        const phys = calculatePhysics();
        currentPhys = phys;
        legendX.style.display = (currentMode === 'table_deriv') ? 'none' : 'inline-flex';

        drawGraph(phys);
        if (currentMode === 'table_deriv') {
          drawDerivationTable(phys);
        } else {
          drawVisualBackground(phys);
          renderFrame(0, phys);
        }
        updateStatsAndExplain(phys);
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(e => console.log(e));
        }
      }

      function drawGraph(phys) {
        combinedSvg.innerHTML = '';
        const W = 680, H = 340;
        const margin = { top: 30, right: 50, bottom: 30, left: 50 };
        const pW = W - margin.left - margin.right;
        const pH = H - margin.top - margin.bottom;

        const addLine = (x1, y1, x2, y2, cls, extraProps={}) => {
          const el = createSvgEl('line', { x1, y1, x2, y2, class: cls });
          for(let k in extraProps) el.setAttribute(k, extraProps[k]);
          combinedSvg.appendChild(el);
        };

        addLine(margin.left, margin.top + pH, margin.left + pW, margin.top + pH, 'axis-line');
        addLine(margin.left, margin.top, margin.left, margin.top + pH, 'axis-line');
        addLine(margin.left + pW, margin.top, margin.left + pW, margin.top + pH, 'axis-line');

        for (let i = 1; i <= 4; i++) {
          const gx = margin.left + (i / 4) * pW, gy = margin.top + (i / 4) * pH;
          addLine(gx, margin.top, gx, margin.top + pH, 'grid-line');
          addLine(margin.left, gy, margin.left + pW, gy, 'grid-line');
        }

        const getX = t => margin.left + (t / phys.tMax) * pW;        
        const getY_x = x_val => {
          let peakX = phys.xMax || 1;
          return margin.top + pH - (x_val / peakX) * pH;
        };

        const getY_v = v_val => {
          const maxV = phys.vMax * 1.05 || 1;
          return margin.top + pH - (v_val / maxV) * pH;
        };

        if (currentMode !== 'table_deriv') {
          addTextToSvg(combinedSvg, margin.left - 10, margin.top - 8, '位置 x', 'start', 'var(--x-color)', 10);
        }
        addTextToSvg(combinedSvg, margin.left + pW + 10, margin.top - 8, '速度 v', 'end', 'var(--v-color)', 10);
        addTextToSvg(combinedSvg, margin.left + pW / 2, H - 8, '運動時間 t (s)', 'middle', 'var(--chalk-dim)', 10);

        if (currentMode === 'table_deriv') {
          phys.times.forEach(t => {
            addLine(getX(t), margin.top+pH, getX(t), margin.top+pH+5, 'axis-line');
            addTextToSvg(combinedSvg, getX(t), margin.top+pH+15, t, 'middle', 'var(--chalk-dim)', 10);
          });
          
          [0.5, 1.0, 1.5, 2.0].forEach(v => {
            addLine(margin.left-5, getY_v(v), margin.left, getY_v(v), 'axis-line');
            addTextToSvg(combinedSvg, margin.left-10, getY_v(v)+4, v, 'end', 'var(--v-color)', 10);
          });

          const pts = phys.times.map(t => `${getX(t)},${getY_v(0.4 * t)}`).join(' ');
          combinedSvg.appendChild(createSvgEl('polyline', { points: pts, class: 'curve-v', style: 'stroke-width: 2.5; opacity: 0.7;' }));

          if (phys.step >= 2) {
            phys.avgVelocities.forEach((v, i) => {
              const x1 = getX(phys.times[i]);
              const x2 = getX(phys.times[i+1]);
              const y = getY_v(v);
              combinedSvg.appendChild(createSvgEl('rect', {
                x: x1, y: y, width: (x2-x1), height: (margin.top+pH - y),
                fill: 'rgba(95, 176, 255, 0.05)', stroke: 'rgba(95, 176, 255, 0.3)', 'stroke-dasharray': '2 4'
              }));
              addLine(x1, y, x2, y, '', {'stroke': 'var(--x-color)', 'stroke-width': 3});
            });
          }

          if (phys.step >= 3) {
            phys.midTimes.forEach((mt, i) => {
              const y = getY_v(phys.avgVelocities[i]);
              const cx = getX(mt);
              addLine(cx, y, cx, margin.top+pH, '', {'stroke': 'var(--chalk-yellow)', 'stroke-dasharray': '4 4', 'stroke-width': 1.5});
              combinedSvg.appendChild(createSvgEl('circle', { cx: cx, cy: y, r: 6, fill: 'var(--chalk-yellow)', stroke: '#000', 'stroke-width': 1.5 }));
            });
          }

          if (phys.step >= 4) {
            if (phys.midTimes.length >= 2) {
              const x1 = getX(phys.midTimes[0]);
              const y1 = getY_v(phys.avgVelocities[0]);
              const x2 = getX(phys.midTimes[1]);
              const y2 = getY_v(phys.avgVelocities[1]);
              
              combinedSvg.appendChild(createSvgEl('polygon', {
                points: `${x1},${y1} ${x2},${y1} ${x2},${y2}`,
                fill: 'rgba(239, 106, 90, 0.2)'
              }));
              addLine(x2, y1, x2, y2, '', {'stroke': 'var(--v-color)', 'stroke-width': 2, 'stroke-dasharray': '2 2'});
              addTextToSvg(combinedSvg, (x1+x2)/2, y1+12, 'Δt=1s', 'middle', 'var(--chalk-dim)', 10);
              addTextToSvg(combinedSvg, x2+15, (y1+y2)/2+4, 'Δv=0.4', 'start', '#ff9485', 10, 'bold');
            }
          }
          return;
        }

        let ptsX = [], ptsV = [];
        const steps = 60;
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * phys.tMax;
          let x = 0, v = 0;
          if (currentMode === 'ticker') {
            const state = phys.calcPos(Math.min(t, phys.stopTime));
            x = state.x; v = state.v;
          } else if (currentMode === 'incline') { x = 0.5 * phys.a * t * t; v = phys.a * t; }
          
          ptsX.push(`${getX(t)},${getY_x(Math.max(0, x))}`);
          ptsV.push(`${getX(t)},${getY_v(v)}`);
        }

        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsX.join(' '), class: 'curve-x' }));
        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsV.join(' '), class: 'curve-v' }));

        if (currentMode === 'ticker') {
          phys.dots.forEach(d => {
            combinedSvg.appendChild(createSvgEl('circle', { cx: getX(d.t), cy: getY_v(d.v), r: 4, fill: 'var(--chalk-yellow)' }));
          });
        }

        combinedSvg.appendChild(createSvgEl('line', { id: 'svgGuide', class: 'guide-line' }));
        const dotX = createSvgEl('circle', { id: 'svgDotX', r: 6, class: 'dot-x' });
        combinedSvg.appendChild(dotX);
        combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotV', r: 6, class: 'dot-v' }));

        phys._getX = getX; phys._getY_x = getY_x; phys._getY_v = getY_v;
      }
      
      function drawDerivationTable(phys) {
        let html = `
          <tr>
            <th style="width: 17%;">時間 (秒)</th>
            ${phys.times.map(t => `<td colspan="2" class="val-cell">${t}</td>`).join('')}
          </tr>
          <tr>
            <th>位置 (公尺)</th>
            ${phys.positions.map(p => `<td colspan="2" class="val-cell">${p.toFixed(1)}</td>`).join('')}
          </tr>
        `;
        
        let dispHtml = '';
        if (phys.step >= 1) {
          dispHtml = `<td class="slash-cell"></td>`;
          phys.displacements.forEach(d => { dispHtml += `<td colspan="2" class="val-cell calc-row">${d.toFixed(1)}</td>`; });
          dispHtml += `<td class="slash-cell"></td>`;
        } else {
          dispHtml = `<td colspan="${phys.times.length * 2}"></td>`;
        }
        html += `<tr><th>位移 (公尺)</th>${dispHtml}</tr>`;

        let avgHtml = '';
        if (phys.step >= 2) {
          avgHtml = `<td class="slash-cell"></td>`;
          phys.avgVelocities.forEach(v => { avgHtml += `<td colspan="2" class="val-cell calc-row" style="font-weight:bold;">${v.toFixed(1)}</td>`; });
          avgHtml += `<td class="slash-cell"></td>`;
        } else {
          avgHtml = `<td colspan="${phys.times.length * 2}"></td>`;
        }
        html += `<tr><th style="font-size:0.8rem; line-height:1.2;">平均速度<br>(公尺/秒)</th>${avgHtml}</tr>`;

        let accHtml = '';
        if (phys.step >= 4) {
          accHtml = `<td colspan="2" class="slash-cell"></td>`;
          phys.accelerations.forEach(a => { accHtml += `<td colspan="2" class="val-cell acc-row">${a.toFixed(1)}</td>`; });
          accHtml += `<td colspan="2" class="slash-cell"></td>`;
        } else {
          accHtml = `<td colspan="${phys.times.length * 2}"></td>`;
        }
        html += `<tr><th style="font-size:0.8rem; line-height:1.2;">速度變化<br>(公尺/秒²)</th>${accHtml}</tr>`;

        derivTable.innerHTML = html;
      }

      function drawVisualBackground(phys) {
        visualSvg.innerHTML = '';
        const m = currentMode;

        if (m === 'ticker') {
          visualSvg.appendChild(createSvgEl('rect', { x: 5, y: 115, width: 26, height: 30, fill: '#8f8a80', rx: 3 }));
          visualSvg.appendChild(createSvgEl('circle', { cx: 20, cy: 130, r: 3, fill: '#ef6a5a' }));
          addTextToSvg(visualSvg, 20, 105, '⬅️新點(最後)', 'middle', 'var(--v-color)', 9, 'bold');
          addTextToSvg(visualSvg, 180, 105, '舊點(第一點,t=0)➡️', 'middle', 'var(--chalk-yellow)', 9, 'bold');
          
          visualSvg.appendChild(createSvgEl('g', { id: 'tapeGroup' }));
          
          const car = createSvgEl('g', { id: 'simObject' });
          car.appendChild(createSvgEl('rect', { x: -16, y: 115, width: 32, height: 20, fill: '#5fb0ff', rx: 3 }));
          car.appendChild(createSvgEl('circle', { cx: -10, cy: 135, r: 4.5, fill: '#000' }));
          car.appendChild(createSvgEl('circle', { cx: 8, cy: 135, r: 4.5, fill: '#000' }));
          car.appendChild(createSvgEl('polygon', { points: '16,120 22,125 16,130', fill: '#f2d675' }));
          visualSvg.appendChild(car);

          visualSvg.appendChild(createSvgEl('rect', { x: 5, y: 200, width: 210, height: 115, fill: 'rgba(0,0,0,0.4)', stroke: 'rgba(242,236,217,0.2)', rx: 6 }));
          addTextToSvg(visualSvg, 15, 222, '🔍 【考卷紙帶放大特寫】：', 'start', 'var(--chalk-yellow)', 10, 'bold');
          visualSvg.appendChild(createSvgEl('rect', { x: 15, y: 240, width: 190, height: 28, fill: '#ffffff', stroke: '#a39d93', 'stroke-width': 1.5, rx: 2 }));
          addTextToSvg(visualSvg, 15, 285, '計時器端(最新)', 'start', 'var(--chalk-dim)', 8.5);
          addTextToSvg(visualSvg, 205, 285, '拉車端(第一點,t=0) ➔', 'end', 'var(--chalk-yellow)', 8.5, 'bold');

          phys.dots.forEach((d, idx) => {
            const dotX = 195 - (d.x / phys.xMax) * 170;
            if (dotX >= 18 && dotX <= 202) {
              /* 100% 維持：純黑色實心黑點！ */
              visualSvg.appendChild(createSvgEl('circle', { cx: dotX, cy: 254, r: 4.5, fill: '#000000' }));
              if (idx === 0) {
                visualSvg.appendChild(createSvgEl('circle', { cx: dotX, cy: 254, r: 8, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 2 }));
              }
            }
          });

          const hint = phys.quiz === 1 ? '👉 往左看點距越來越大 ➔ 加速運動' : (phys.quiz === 2 ? '👉 往左看點距越來越小 ➔ 減速運動' : (phys.quiz === 3 ? '👉 全程點距均勻相等 ➔ 等速運動' : '👉 點距先變大後變小 ➔ 先加後減'));
          addTextToSvg(visualSvg, 110, 305, hint, 'middle', 'var(--x-color)', 9.5);

        } else if (m === 'incline') {
          const r = phys._ramp;
          visualSvg.appendChild(createSvgEl('polygon', {
            points: `${r.xTop},${r.yTop} ${r.xBot},${r.yBot} ${r.xTop},${r.yBot}`,
            fill: 'rgba(242,214,117,0.15)', stroke: 'var(--chalk-yellow)', 'stroke-width': 2
          }));
          const segRatios = [1, 3, 5, 7, 9];
          const totalUnits = segRatios.reduce((a, b) => a + b, 0);
          const markerFracs = [0]; let cum = 0;
          segRatios.forEach(u => { cum += u; markerFracs.push(cum / totalUnits); });
          markerFracs.forEach((frac, idx) => {
            const dist = frac * r.rampLen;
            const tx = r.xTop + dist * Math.cos(r.rad), ty = r.yTop + dist * Math.sin(r.rad);
            visualSvg.appendChild(createSvgEl('circle', { cx: tx, cy: ty, r: (idx === 0 || idx === markerFracs.length - 1) ? 4 : 3, fill: idx === 0 ? 'var(--v-color)' : 'var(--chalk-yellow)' }));
          });
          for (let i = 0; i < segRatios.length; i++) {
            const dist1 = markerFracs[i] * r.rampLen, dist2 = markerFracs[i + 1] * r.rampLen;
            const midDist = (dist1 + dist2) / 2;
            const mx = r.xTop + midDist * Math.cos(r.rad), my = r.yTop + midDist * Math.sin(r.rad);
            const lx = mx + 12 * Math.sin(r.rad), ly = my - 12 * Math.cos(r.rad);
            addTextToSvg(visualSvg, lx, ly, segRatios[i], 'middle', 'var(--chalk-yellow)', 10, 'bold');
          }
          addTextToSvg(visualSvg, 110, 15, '等時間間隔，位移差比 = 1:3:5:7:9', 'middle', 'var(--chalk-dim)', 10);
          
          const ball = createSvgEl('g', { id: 'simObject' });
          ball.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 11, fill: '#ef6a5a', stroke: '#f2ecd9', 'stroke-width': 1.5 }));
          ball.appendChild(createSvgEl('circle', { cx: -3, cy: -3, r: 3, fill: 'rgba(255,255,255,0.7)' }));
          visualSvg.appendChild(ball);

          /* 填滿「1:3:5:7:9 連續等時間隔·位移比例對比圖」 */
          visualSvg.appendChild(createSvgEl('line', { x1: 15, y1: 185, x2: 205, y2: 185, stroke: 'var(--chalk-dim)', 'stroke-dasharray': '2 4', opacity: 0.5 }));
          addTextToSvg(visualSvg, 15, 205, '📊 【等時間間隔·下滑位移比例比較】', 'start', 'var(--chalk-yellow)', 10, 'bold');
          
          const colors = ['#ef6a5a', '#f2d675', '#4cd964', '#5fb0ff', '#bd93f9'];
          segRatios.forEach((val, idx) => {
            const by = 218 + idx * 23;
            const bw = val * 16;
            visualSvg.appendChild(createSvgEl('rect', { x: 55, y: by, width: bw, height: 16, fill: colors[idx], opacity: 0.35, rx: 3, stroke: colors[idx], 'stroke-width': 1 }));
            addTextToSvg(visualSvg, 50, by + 12, `第${idx+1}秒內`, 'end', 'var(--chalk-dim)', 8.5);
            addTextToSvg(visualSvg, 55 + bw/2, by + 12, `1:3:5... 比值 = ${val}`, 'middle', '#ffffff', 9, 'bold');
          });
        }
      }

      function renderFrame(t, phys) {
        const m = currentMode;
        if (m === 'table_deriv') return; 

        let x = 0, v = 0;
        if (m === 'ticker') {
          const state = phys.calcPos(Math.min(t, phys.stopTime));
          x = state.x; v = state.v;
        } else if (m === 'incline') { x = 0.5 * phys.a * t * t; v = phys.a * t; }

        if (phys._getX) {
          const cx = phys._getX(t), cy_x = phys._getY_x(Math.max(0, x)), cy_v = phys._getY_v(v);
          const dotX = document.getElementById('svgDotX'), dotV = document.getElementById('svgDotV'), guide = document.getElementById('svgGuide');
          if (dotX && dotV && guide) {
            dotX.setAttribute('cx', cx); dotX.setAttribute('cy', cy_x);
            dotV.setAttribute('cx', cx); dotV.setAttribute('cy', cy_v);
            guide.setAttribute('x1', cx); guide.setAttribute('y1', 20);
            guide.setAttribute('x2', cx); guide.setAttribute('y2', 320);
          }
        }

        const simObj = document.getElementById('simObject');
        const ratio = Math.min(1, Math.max(0, x / (phys.xMax || 1)));

        if (simObj) {
          if (m === 'ticker') {
            const px = 30 + ratio * 150;
            simObj.setAttribute('transform', `translate(${px}, 0)`);
            const tapeGroup = document.getElementById('tapeGroup');
            if (tapeGroup) {
              tapeGroup.innerHTML = '';
              const tapeWidth = Math.max(0, (px - 10) - 20);
              if (tapeWidth > 0) {
                tapeGroup.appendChild(createSvgEl('rect', { x: 20, y: 122, width: tapeWidth, height: 14, fill: '#ffffff', stroke: '#a39d93', 'stroke-width': 1 }));
              }
              phys.dots.forEach((d, idx) => {
                if (d.t <= t) {
                  const dotPx = 20 + ((x - d.x) / phys.xMax) * 150;
                  if (dotPx >= 20 && dotPx <= px - 5) {
                    tapeGroup.appendChild(createSvgEl('circle', { cx: dotPx, cy: 129, r: 4, fill: '#000000' }));
                    if (idx === 0) tapeGroup.appendChild(createSvgEl('circle', { cx: dotPx, cy: 129, r: 6.5, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 1.5 }));
                  }
                }
              });
            }
          } else if (m === 'incline' && phys._ramp) {
            const r = phys._ramp;
            const dist = ratio * r.rampLen;
            const ballR = 11;
            const px = r.xTop + dist * Math.cos(r.rad) + ballR * Math.sin(r.rad);
            const py = r.yTop + dist * Math.sin(r.rad) - ballR * Math.cos(r.rad);
            simObj.setAttribute('transform', `translate(${px}, ${py}) rotate(${dist * 2})`);
          }
        }

        phaseBadge.className = 'phase-badge blue';
        phaseBadge.textContent = `⏱️ 實驗進行中：t = ${t.toFixed(2)} s`;
      }

      function updateStatsAndExplain(phys) {
        statsGrid.innerHTML = '';
        const addStat = (k, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        const m = currentMode;
        if (m === 'ticker') {
          addStat('打點頻率 f', `${params.ticker.f} Hz`);
          addStat('時間差 Δt', `${phys.dt.toFixed(3)} s`);
          addStat('紙帶總點數', `${phys.dots.length} 點`);
          addStat('運動狀態', phys.quiz === 1 ? '等加速 (越來越快)' : (phys.quiz === 2 ? '等減速 (越來越慢)' : (phys.quiz === 3 ? '等速運動' : '先加速後減速')));

          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：打點計時器判斷「三大黃金法則」</h3>
            <p>1. <b>時間起點在拉車端</b>：考卷紙帶向右拉時，離拉車端最近的（最右邊）是第一點（$t = 0$）；離計時器最近的（最左邊）是最新打下的點。<br>
               2. <b>判斷加減速看間隔 $\\Delta x$</b>：從<b>最右邊（舊點）往最左邊（新點）</b>看過去，點跟點的距離若<b>「越來越大」就是等加速運動</b>；若<b>「越來越小」就是等減速運動</b>！<br>
               3. <b>等差數列公式</b>：由靜止開始的等加速運動，相鄰位移差恆為固定值，且呈 <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span> 比例成長！</p>
          `;
        } else if (m === 'incline') {
          addStat('斜面角度 θ', `${params.incline.angle}°`);
          addStat('下滑加速度 a', `${phys.a.toFixed(2)} m/s²`);
          addStat('下滑總時間', `${phys.tMax.toFixed(2)} s`);
          addStat('底端速度', `${phys.vMax.toFixed(2)} m/s`);
          explainBox.innerHTML = `<h3>💡 觀念總結：伽利略「稀釋重力」實驗</h3><p>古代沒有計時器，伽利略利用斜面將重力加速度「稀釋」為 <span class="formula-highlight">$a = g \\times \\sin\\theta$</span>。當角度 $\\theta = 90^\\circ$ 時，加速度等於重力加速度 $g$，完全轉化為自由落體！斜面上標示的 5 個時間殘影點，證明了將總時間等分後，各段滾進距離會精準呈現 <span class="formula-highlight">$1 : 3 : 5 : 7 : 9$</span> 的等差奇數比！</p>`;
        } else if (m === 'table_deriv') {
          addStat('總位移 Δx', `5.0 m`);
          addStat('平均加速度 a', `0.4 m/s²`);
          addStat('時間區隔 Δt', `1.0 s`);
          addStat('目前推導進度', `Step ${phys.step}`);
          explainBox.innerHTML = `<h3>💡 老師精闢解析：表格推導與「中間時刻速度」</h3><p>在等加速度運動中，<b>「某段時間內的平均速度，恰等於該段時間『中間時刻』的瞬時速度」</b>！例如第 $0 \\sim 1$ 秒的平均速度為 $0.2\\text{ m/s}$，這其實就是 $t = 0.5$ 秒時的瞬時速度。利用這個技巧，我們把求加速度的問題，轉化為相鄰中間時刻（時間差 $\\Delta t = 1\\text{ s}$）的速度變化，輕鬆得出 <span class="formula-highlight">$a = \\frac{\\Delta v}{\\Delta t} = 0.4\\text{ m/s}^2$</span>！</p>`;
        }
      }

      function animate(ts) {
        if (!animStartTime) animStartTime = ts;
        const elapsed = ts - animStartTime;
        const phys = currentPhys;
        const frac = Math.min(1, elapsed / ANIM_DURATION);
        const curTime = frac * phys.tMax;

        progressFill.style.width = `${frac * 100}%`;
        renderFrame(curTime, phys);

        if (frac < 1) {
          animId = requestAnimationFrame(animate);
        } else {
          animId = null; animStartTime = null;
          playBtn.textContent = '🔄 再次播放';
        }
      }

      playBtn.addEventListener('click', () => {
        if (animId) {
          cancelAnimationFrame(animId); animId = null; animStartTime = null;
          playBtn.textContent = '▶ 繼續播放';
        } else {
          playBtn.textContent = '⏸ 暫停播放';
          animId = requestAnimationFrame(animate);
        }
      });

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          if (animId) { cancelAnimationFrame(animId); animId = null; animStartTime = null; }
          playBtn.textContent = '▶ 開始實驗'; progressFill.style.width = '0%';
          initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
