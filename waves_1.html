<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>波動與介質：四大核心單元互動黑板</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg-base: #111e19;
    --bg-panel: #172a23;
    --bg-panel-hover: #1f382f;
    --chalk-white: #ffffff;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-pink: #ff66b2;
    --rule-color: rgba(255, 255, 255, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
    background-color: var(--bg-base);
    color: var(--chalk-white);
  }
  .wrap { max-width: 1140px; margin: 20px auto; padding: 0 16px 40px; }
  
  header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed var(--rule-color); padding-bottom: 16px; }
  h1 { font-size: 36px; margin: 0 0 8px; color: var(--chalk-yellow); letter-spacing: 2px; font-weight: 800; }
  header p { margin: 0; color: #e0e0e0; font-size: 16px; }

  /* 導覽列 */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    flex: 1; min-width: 140px;
    padding: 12px 10px; font-size: 16px; font-weight: bold;
    background: rgba(255,255,255,0.08); color: #c0d0c8;
    border: 1.5px dashed var(--rule-color); border-radius: 10px;
    cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .tab-btn:hover { background: var(--bg-panel-hover); color: #ffffff; }
  .tab-btn.active { background: #223e34; color: var(--chalk-yellow); border: 2px solid var(--chalk-yellow); box-shadow: 0 0 12px rgba(255, 224, 102, 0.3); }

  /* 面板 */
  .panel { background: var(--bg-panel); border: 2px solid var(--rule-color); border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed var(--rule-color); padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  h2 { margin: 0; font-size: 22px; color: #ffffff; letter-spacing: 1px; }
  .sub-tag { font-size: 14px; color: #000000; background: var(--chalk-yellow); padding: 4px 14px; border-radius: 999px; font-weight: 800; }

  /* 控制區 */
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; background: rgba(0,0,0,0.35); padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); min-height: 56px; }
  input[type=range] { flex: 1; min-width: 150px; accent-color: var(--chalk-yellow); cursor: pointer; }
  button.action-btn {
    padding: 8px 16px; border: 1px solid var(--rule-color);
    background: #111e19; color: #ffffff;
    border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold;
    transition: all 0.2s;
  }
  button.action-btn:hover { background: var(--chalk-yellow); color: #000000; border-color: var(--chalk-yellow); }
  button.action-btn.active-btn { background: var(--chalk-coral); color: #fff; border-color: var(--chalk-coral); box-shadow: 0 0 8px var(--chalk-coral); }
  .readout-badge { font-weight: bold; color: #000000; background: var(--chalk-yellow); padding: 6px 14px; border-radius: 6px; min-width: 90px; text-align: center; font-size: 15px; }

  /* 畫布 */
  #stage-container { width: 100%; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; background: #0c1612; box-shadow: inset 0 0 25px rgba(0,0,0,0.7); position: relative; }
  canvas { display: block; width: 100%; height: auto; }
  
  .stats { display: flex; gap: 24px; font-size: 15px; color: #ffffff; margin-top: 14px; background: rgba(0,0,0,0.4); padding: 12px 18px; border-radius: 8px; border: 1px dashed var(--rule-color); flex-wrap: wrap; align-items: center; }
  .stats b { color: var(--chalk-yellow); margin-left: 6px; font-size: 18px; }
  .note { font-size: 15px; color: #ffffff; margin-top: 14px; line-height: 1.6; background: rgba(255,255,255,0.05); padding: 14px 18px; border-radius: 8px; border-left: 5px solid var(--chalk-yellow); }
  .highlight { color: var(--chalk-coral); font-weight: bold; }
  .highlight-teal { color: var(--chalk-teal); font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>波動與介質</h1>
    <p>國中自然科核心概念：第一部 - 波的性質、分類與名詞解釋</p>
  </header>

  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('intro')">一、波的分類</div>
    <div class="tab-btn" onclick="switchTab('transverse')">二、橫波名詞解剖</div>
    <div class="tab-btn" onclick="switchTab('longitudinal')">三、縱波名詞解剖</div>
    <div class="tab-btn" onclick="switchTab('equation')">四、波速方程式</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">一、波的分類（力學波與非力學波）</h2>
      <span id="panel-badge" class="sub-tag" style="background:#4dd2ff;">基礎觀念與動畫</span>
    </div>

    <!-- 控制區 -->
    <div class="controls" id="controls-box">
      <!-- 分頁一與四共用的播放鍵 -->
      <button id="play-btn" class="action-btn" onclick="togglePlay()" style="display:none;">暫停動畫 ⏸</button>
      
      <!-- 分頁二：橫波按鈕 -->
      <div id="btn-group-t" style="display:none; gap:10px; flex-wrap:wrap;">
        <button class="action-btn active-btn" onclick="setHighlight('none')">顯示原圖</button>
        <button class="action-btn" onclick="setHighlight('peaks')">標示 波峰/波谷</button>
        <button class="action-btn" onclick="setHighlight('amplitude')">標示 振幅</button>
        <button class="action-btn" onclick="setHighlight('wavelength')">標示 波長</button>
      </div>

      <!-- 分頁三：縱波按鈕 -->
      <div id="btn-group-l" style="display:none; gap:10px; flex-wrap:wrap;">
        <button class="action-btn active-btn" onclick="setHighlight('none')">顯示原圖</button>
        <button class="action-btn" onclick="setHighlight('dense')">標示 密部</button>
        <button class="action-btn" onclick="setHighlight('sparse')">標示 疏部</button>
        <button class="action-btn" onclick="setHighlight('wavelength')">標示 波長</button>
      </div>

      <!-- 分頁四：滑桿區 -->
      <div id="slider-group" style="display:none; width:100%; gap:15px; align-items:center;">
        <label style="color:var(--chalk-teal); font-weight:bold;">頻率(f):</label>
        <input id="rng-f" type="range" min="0.5" max="3" step="0.5" value="1">
        <span id="val-f" class="readout-badge" style="background:var(--chalk-teal);">1.0 Hz</span>
        
        <label style="color:var(--chalk-pink); font-weight:bold; margin-left:10px;">波長(λ):</label>
        <input id="rng-w" type="range" min="100" max="300" step="50" value="200">
        <span id="val-w" class="readout-badge" style="background:var(--chalk-pink);">200 px</span>
      </div>
    </div>

    <div id="stage-container">
      <canvas id="stage"></canvas>
    </div>

    <!-- 數據顯示區 (分頁四專用) -->
    <div class="stats" id="stats-box" style="display:none;">
      <span>波速公式：<b style="color:#fff;">$v = f \times \lambda$</b></span>
      <span style="margin-left: auto; color: var(--chalk-coral); font-weight: bold; font-size: 18px;">
        當前波速 v = <b id="val-v" style="color:var(--chalk-coral); font-size: 22px;">200</b> px/s
      </span>
    </div>

    <!-- 黑板筆記區 -->
    <div class="note" id="note-text">
      <!-- 內容由 JS 動態切換 -->
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  let currentTab = 'intro';
  let isPlaying = true;
  let animTime = 0;
  let reqId;
  let highlightState = 'none';

  // 滑桿元素
  const rngF = document.getElementById('rng-f');
  const rngW = document.getElementById('rng-w');
  const valF = document.getElementById('val-f');
  const valW = document.getElementById('val-w');
  const valV = document.getElementById('val-v');

  const V_WIDTH = 1000;
  const V_HEIGHT = 450;
  const CX = V_WIDTH / 2;

  function initCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = V_WIDTH * dpr;
    canvas.height = V_HEIGHT * dpr;
    ctx.scale(dpr, dpr);
    if (!reqId) animate();
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('play-btn');
    btn.innerHTML = isPlaying ? "暫停動畫 ⏸" : "繼續播放 ▶️";
    btn.style.background = isPlaying ? "#111e19" : "var(--chalk-coral)";
  }

  function setHighlight(state) {
    highlightState = state;
    // 更新按鈕視覺狀態
    const group = currentTab === 'transverse' ? 'btn-group-t' : 'btn-group-l';
    const btns = document.querySelectorAll(`#${group} .action-btn`);
    btns.forEach(b => b.classList.remove('active-btn'));
    event.target.classList.add('active-btn');
  }

  function switchTab(tab) {
    currentTab = tab;
    highlightState = 'none'; // 重置標示
    
    // UI 狀態切換
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.remove('active');
      const tabsOrder = ['intro', 'transverse', 'longitudinal', 'equation'];
      if (tabsOrder[idx] === tab) btn.classList.add('active');
    });

    const panelTitle = document.getElementById('panel-title');
    const panelBadge = document.getElementById('panel-badge');
    const noteText = document.getElementById('note-text');
    
    document.getElementById('play-btn').style.display = 'none';
    document.getElementById('btn-group-t').style.display = 'none';
    document.getElementById('btn-group-l').style.display = 'none';
    document.getElementById('slider-group').style.display = 'none';
    document.getElementById('stats-box').style.display = 'none';

    // 恢復按鈕預設顏色
    document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active-btn'));
    const defaultBtns = document.querySelectorAll("button[onclick=\"setHighlight('none')\"]");
    defaultBtns.forEach(b => b.classList.add('active-btn'));

    if (tab === 'intro') {
      panelTitle.textContent = '一、波的分類（力學波與非力學波）';
      panelBadge.textContent = '依介質與振動方向分類';
      panelBadge.style.background = 'var(--chalk-teal)';
      document.getElementById('play-btn').style.display = 'inline-block';
      noteText.innerHTML = '💡 <b>黑板重點：</b><br>1. <b>力學波</b>需要介質（如水、繩、空氣），<b>非力學波</b>不需介質（如光波、電磁波）。<br>2. 觀察下方動畫：上圖為<span class="highlight">橫波</span>（介質振動方向與波前進垂直）；下圖為<span class="highlight-teal">縱波</span>（介質振動方向與波前進平行）。請注意<b style="color:var(--chalk-coral)">橘色介質點</b>只在原地振動，不隨波前進！';
      isPlaying = true;
    } 
    else if (tab === 'transverse') {
      panelTitle.textContent = '二、橫波 (高低波) 的名詞解剖';
      panelBadge.textContent = '點擊按鈕觀察各部位';
      panelBadge.style.background = 'var(--chalk-yellow)';
      document.getElementById('btn-group-t').style.display = 'flex';
      noteText.innerHTML = '💡 <b>黑板重點：</b>橫波由波峰與波谷組成。<br>● <span class="highlight">振幅</span>：介質離開平衡位置的最大距離（代表能量大小）。<br>● <span class="highlight">波長 (λ)</span>：相鄰兩波峰或相鄰兩波谷間的距離（一個完整波的長度）。';
      isPlaying = false; // 靜態解剖
      animTime = 0;
    } 
    else if (tab === 'longitudinal') {
      panelTitle.textContent = '三、縱波 (疏密波) 的名詞解剖';
      panelBadge.textContent = '點擊按鈕觀察各部位';
      panelBadge.style.background = 'var(--chalk-pink)';
      document.getElementById('btn-group-l').style.display = 'flex';
      noteText.innerHTML = '💡 <b>黑板重點：</b>縱波（如聲波）由密部與疏部組成。<br>● <span class="highlight">密部/疏部</span>：介質分佈最密集與最稀疏的區域。<br>● <span class="highlight">波長 (λ)</span>：相鄰兩密部中心，或相鄰兩疏部中心之間的距離。';
      isPlaying = false; // 靜態解剖
      animTime = 0;
    } 
    else if (tab === 'equation') {
      panelTitle.textContent = '四、波速方程式模擬器';
      panelBadge.textContent = '調整頻率與波長';
      panelBadge.style.background = 'var(--chalk-green)';
      document.getElementById('play-btn').style.display = 'inline-block';
      document.getElementById('slider-group').style.display = 'flex';
      document.getElementById('stats-box').style.display = 'flex';
      noteText.innerHTML = '💡 <b>黑板重點：</b>波速(v)取決於介質。當介質不變時波速固定。公式 <span class="highlight">v = f × λ</span> 告訴我們，若波速固定，<b>頻率(f)與波長(λ)成反比</b>。<br>試著拉動滑桿，觀察波形密度與行進速度的變化！';
      isPlaying = true;
      updateStats();
    }
  }

  // --- 繪圖輔助函數 ---
  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    for (let i = 0; i < V_WIDTH; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, V_HEIGHT); ctx.stroke(); }
    for (let i = 0; i < V_HEIGHT; i += 50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(V_WIDTH, i); ctx.stroke(); }
  }

  function drawChalkArrow(x1, y1, x2, y2, color, text, offset=0) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headlen = 10;
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + headlen * Math.cos(angle - Math.PI / 6), y1 + headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x1 + headlen * Math.cos(angle + Math.PI / 6), y1 + headlen * Math.sin(angle + Math.PI / 6));
    ctx.fill();
    if (text) {
      ctx.font = "bold 18px 'Noto Sans TC'";
      const textWidth = ctx.measureText(text).width;
      ctx.fillText(text, (x1+x2)/2 - textWidth/2, (y1+y2)/2 + offset);
    }
  }

  // --- 各分頁繪圖邏輯 ---
  function renderIntro() {
    drawGrid();
    ctx.font = "bold 20px 'Noto Sans TC'"; ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText("【橫波】", 20, 40);
    ctx.fillText("【縱波】", 20, 260);
    
    // 橫波 (上半)
    const cy1 = 130;
    ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(0, cy1); ctx.lineTo(V_WIDTH, cy1); ctx.stroke(); ctx.setLineDash([]);
    
    const k1 = (2 * Math.PI) / 200;
    const numP1 = 50;
    for(let i=0; i<=numP1; i++) {
      const x = i * (V_WIDTH/numP1);
      const y = cy1 + 60 * Math.sin(k1 * x - animTime * 0.05);
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2);
      ctx.fillStyle = (i === 25) ? "var(--chalk-coral)" : "var(--chalk-yellow)";
      if(i===25) { ctx.arc(x, y, 3, 0, Math.PI*2); } // 橘色點畫大一點
      ctx.fill();
    }

    // 縱波 (下半) - 用彈簧線條呈現，比較有質感
    const cy2 = 340;
    const lines = 120;
    ctx.strokeStyle = "var(--chalk-teal)"; ctx.lineWidth = 3;
    for(let i=0; i<lines; i++) {
      const x0 = (i / lines) * V_WIDTH;
      const dx = 35 * Math.sin(k1 * x0 - animTime * 0.05);
      const x = x0 + dx;
      
      // 標示出一個不前進的介質線
      if (i === 60) {
        ctx.strokeStyle = "var(--chalk-coral)"; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(x, cy2 - 50); ctx.lineTo(x, cy2 + 50); ctx.stroke();
        ctx.strokeStyle = "var(--chalk-teal)"; ctx.lineWidth = 3;
      } else {
        ctx.beginPath(); ctx.moveTo(x, cy2 - 40); ctx.lineTo(x, cy2 + 40); ctx.stroke();
      }
    }
  }

  function renderTransverse() {
    drawGrid();
    const cy = V_HEIGHT / 2;
    const amp = 100;
    const waveLen = 300;
    const k = (2 * Math.PI) / waveLen;

    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.setLineDash([5,5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(V_WIDTH, cy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#fff"; ctx.font = "16px sans-serif"; ctx.fillText("平衡位置", 20, cy - 10);

    ctx.strokeStyle = "var(--chalk-yellow)"; ctx.lineWidth = 4;
    ctx.beginPath();
    for (let x = 0; x <= V_WIDTH; x++) {
      const y = cy - amp * Math.sin(k * x);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    const p1x = waveLen/4;      const p1y = cy - amp;
    const v1x = waveLen*0.75;   const v1y = cy + amp;
    const p2x = waveLen*1.25;   const p2y = cy - amp;

    if (highlightState === 'peaks' || highlightState === 'amplitude' || highlightState === 'wavelength') {
      if (highlightState === 'peaks') {
        ctx.fillStyle = "var(--chalk-coral)";
        ctx.beginPath(); ctx.arc(p1x, p1y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(p2x, p2y, 8, 0, Math.PI*2); ctx.fill();
        ctx.font="bold 20px sans-serif"; ctx.fillText("波峰", p1x-20, p1y-15);
        
        ctx.fillStyle = "var(--chalk-teal)";
        ctx.beginPath(); ctx.arc(v1x, v1y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillText("波谷", v1x-20, v1y+30);
      }
      if (highlightState === 'amplitude') {
        drawChalkArrow(p1x, cy, p1x, p1y, "var(--chalk-coral)", "振幅", -30);
        drawChalkArrow(v1x, cy, v1x, v1y, "var(--chalk-teal)", "振幅", 45);
      }
      if (highlightState === 'wavelength') {
        drawChalkArrow(p1x, p1y-40, p2x, p2y-40, "var(--chalk-pink)", "波長 (λ)", -15);
        ctx.strokeStyle="var(--chalk-pink)"; ctx.setLineDash([4,4]); ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p1x, p1y-50); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p2x, p2y); ctx.lineTo(p2x, p2y-50); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  function renderLongitudinal() {
    drawGrid();
    const cy = V_HEIGHT / 2;
    const waveLen = 300;
    const k = (2 * Math.PI) / waveLen;
    const lines = 180;

    ctx.strokeStyle = "var(--chalk-teal)"; ctx.lineWidth = 3;
    for(let i = 0; i < lines; i++) {
      const x0 = (i / lines) * V_WIDTH;
      const dx = 40 * Math.sin(k * x0);
      const x = x0 + dx;
      ctx.beginPath(); ctx.moveTo(x, cy - 80); ctx.lineTo(x, cy + 80); ctx.stroke();
    }

    const dense1 = waveLen/2; 
    const dense2 = waveLen*1.5;
    const sparse1 = waveLen;

    if (highlightState === 'dense') {
      ctx.fillStyle = "rgba(255, 128, 64, 0.4)";
      ctx.fillRect(dense1 - 30, cy - 90, 60, 180);
      ctx.fillRect(dense2 - 30, cy - 90, 60, 180);
      ctx.fillStyle = "var(--chalk-coral)"; ctx.font = "bold 20px sans-serif";
      ctx.fillText("密部", dense1 - 20, cy - 100); ctx.fillText("密部", dense2 - 20, cy - 100);
    }
    if (highlightState === 'sparse') {
      ctx.fillStyle = "rgba(255, 224, 102, 0.3)";
      ctx.fillRect(sparse1 - 40, cy - 90, 80, 180);
      ctx.fillStyle = "var(--chalk-yellow)"; ctx.font = "bold 20px sans-serif";
      ctx.fillText("疏部", sparse1 - 20, cy - 100);
    }
    if (highlightState === 'wavelength') {
      drawChalkArrow(dense1, cy-120, dense2, cy-120, "var(--chalk-pink)", "波長 (λ)", -15);
      ctx.strokeStyle="var(--chalk-pink)"; ctx.setLineDash([4,4]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(dense1, cy-80); ctx.lineTo(dense1, cy-130); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(dense2, cy-80); ctx.lineTo(dense2, cy-130); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function renderEquation() {
    drawGrid();
    const cy = V_HEIGHT / 2;
    const f = parseFloat(rngF.value);
    const lambda = parseInt(rngW.value);
    const k = (2 * Math.PI) / lambda;
    const speed = f * lambda; // 實際像素波速
    
    // 畫波形
    ctx.strokeStyle = "var(--chalk-green)"; ctx.lineWidth = 4;
    ctx.beginPath();
    for (let x = 0; x <= V_WIDTH; x++) {
      const y = cy - 80 * Math.sin(k * x - animTime * 2 * Math.PI * f / 60); // 假設60fps的角頻率
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 畫平衡線
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.setLineDash([5,5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(V_WIDTH, cy); ctx.stroke(); ctx.setLineDash([]);

    // 即時標示一段波長
    const offset = (animTime * 2 * Math.PI * f / 60) / k;
    const p1x = (lambda/4 + offset) % lambda; 
    let p2x = p1x + lambda;
    if(p2x > V_WIDTH) { p2x -= lambda; } // 確保顯示在畫面上
    
    ctx.strokeStyle = "var(--chalk-pink)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(100, cy - 120); ctx.lineTo(100 + lambda, cy - 120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, cy-110); ctx.lineTo(100, cy-130); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100+lambda, cy-110); ctx.lineTo(100+lambda, cy-130); ctx.stroke();
    ctx.fillStyle = "var(--chalk-pink)"; ctx.font = "bold 16px sans-serif";
    ctx.fillText(`λ = ${lambda}`, 100 + lambda/2 - 20, cy - 135);
  }

  // --- 動畫與事件綁定 ---
  function animate() {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    if (isPlaying) animTime += 1;

    if (currentTab === 'intro') renderIntro();
    else if (currentTab === 'transverse') renderTransverse();
    else if (currentTab === 'longitudinal') renderLongitudinal();
    else if (currentTab === 'equation') renderEquation();

    reqId = requestAnimationFrame(animate);
  }

  function updateStats() {
    const f = parseFloat(rngF.value);
    const w = parseInt(rngW.value);
    valF.textContent = f.toFixed(1) + " Hz";
    valW.textContent = w + " px";
    valV.textContent = (f * w).toFixed(0);
  }

  rngF.addEventListener('input', updateStats);
  rngW.addEventListener('input', updateStats);
  window.addEventListener('resize', initCanvas);
  
  // 啟動
  initCanvas();
  switchTab('intro');
</script>
</body>
</html>
