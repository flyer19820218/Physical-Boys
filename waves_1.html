<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>波動與介質：第一節課</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg-base: #111e19;
    --bg-panel: #172a23;
    --bg-panel-hover: #1f382f;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-pink: #ff66b2;
    --rule-color: rgba(255, 255, 255, 0.25);
  }
  body {
    margin: 0; font-family: -apple-system, sans-serif;
    background-color: var(--bg-base); color: #fff;
  }
  .wrap { max-width: 1140px; margin: 20px auto; padding: 0 16px 40px; }
  header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed var(--rule-color); padding-bottom: 16px; }
  h1 { font-size: 36px; margin: 0 0 8px; color: var(--chalk-yellow); }
  
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; padding: 12px 10px; font-size: 16px; font-weight: bold;
    background: rgba(255,255,255,0.08); border: 1.5px dashed var(--rule-color); border-radius: 10px;
    cursor: pointer; text-align: center; color: #c0d0c8;
  }
  .tab-btn.active { background: #223e34; color: var(--chalk-yellow); border: 2px solid var(--chalk-yellow); }

  .panel { background: var(--bg-panel); border: 2px solid var(--rule-color); border-radius: 14px; padding: 20px; }
  .panel-header { margin-bottom: 16px; border-bottom: 1px dashed var(--rule-color); padding-bottom: 12px; }
  h2 { margin: 0; font-size: 22px; }

  .controls { display: flex; gap: 10px; margin-bottom: 16px; background: rgba(0,0,0,0.35); padding: 12px 16px; border-radius: 10px; min-height: 56px; }
  button.action-btn { padding: 8px 16px; border: 1px solid var(--rule-color); background: #111e19; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button.action-btn.active-btn { background: var(--chalk-coral); border-color: var(--chalk-coral); }
  
  #stage-container { width: 100%; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; background: #0c1612; }
  canvas { display: block; width: 100%; height: auto; }
  
  .note { font-size: 15px; margin-top: 14px; background: rgba(255,255,255,0.05); padding: 14px 18px; border-radius: 8px; border-left: 5px solid var(--chalk-yellow); }
  .highlight { color: var(--chalk-coral); font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>波動與介質</h1>
  </header>

  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('transverse')">第一頁：橫波解剖</div>
    <div class="tab-btn" onclick="switchTab('longitudinal')">第二頁：縱波解剖</div>
    <div class="tab-btn" onclick="switchTab('wip3')">第三頁：(準備中)</div>
    <div class="tab-btn" onclick="switchTab('wip4')">第四頁：(準備中)</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">第一頁：橫波 (高低波) 的名詞解剖</h2>
    </div>

    <!-- 橫波與縱波共用的按鈕區 -->
    <div class="controls" id="btn-group">
      <!-- 內容由 JS 動態切換 -->
    </div>

    <div id="stage-container">
      <canvas id="stage"></canvas>
    </div>

    <div class="note" id="note-text"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const V_WIDTH = 1000;
  const V_HEIGHT = 450;
  
  let currentTab = 'transverse';
  let highlightState = 'none';

  function initCanvas() {
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;
    drawFrame();
  }

  function setHighlight(state) {
    highlightState = state;
    document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active-btn'));
    event.target.classList.add('active-btn');
    drawFrame();
  }

  function drawGrid() {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    for (let i = 0; i < V_WIDTH; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, V_HEIGHT); ctx.stroke(); }
    for (let i = 0; i < V_HEIGHT; i += 50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(V_WIDTH, i); ctx.stroke(); }
  }

  function drawChalkArrow(x1, y1, x2, y2, color, text, offset=0) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headlen = 10;
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
    ctx.fill();
    if (text) {
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(text, (x1+x2)/2 - ctx.measureText(text).width/2, (y1+y2)/2 + offset);
    }
  }

  function drawFrame() {
    drawGrid();
    if (currentTab === 'transverse') {
      const cy = V_HEIGHT / 2;
      const amp = 100;
      const waveLen = 300;
      const k = (2 * Math.PI) / waveLen;

      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.setLineDash([5,5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(V_WIDTH, cy); ctx.stroke(); ctx.setLineDash([]);
      
      ctx.strokeStyle = "var(--chalk-yellow)"; ctx.lineWidth = 4;
      ctx.beginPath();
      for (let x = 0; x <= V_WIDTH; x++) {
        const y = cy - amp * Math.sin(k * x);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();

      const p1x = waveLen/4, p1y = cy - amp;
      const v1x = waveLen*0.75, v1y = cy + amp;
      const p2x = waveLen*1.25, p2y = cy - amp;

      if (highlightState === 'peaks') {
        ctx.fillStyle = "var(--chalk-coral)"; ctx.beginPath(); ctx.arc(p1x, p1y, 8, 0, Math.PI*2); ctx.fill();
        ctx.font="bold 20px sans-serif"; ctx.fillText("波峰", p1x-20, p1y-15);
        ctx.fillStyle = "var(--chalk-teal)"; ctx.beginPath(); ctx.arc(v1x, v1y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillText("波谷", v1x-20, v1y+30);
      } else if (highlightState === 'amplitude') {
        drawChalkArrow(p1x, cy, p1x, p1y, "var(--chalk-coral)", "振幅", -30);
        drawChalkArrow(v1x, cy, v1x, v1y, "var(--chalk-teal)", "振幅", 45);
      } else if (highlightState === 'wavelength') {
        drawChalkArrow(p1x, p1y-40, p2x, p2y-40, "var(--chalk-pink)", "波長 (λ)", -15);
      }
    } 
    else if (currentTab === 'longitudinal') {
      const cy = V_HEIGHT / 2;
      const waveLen = 300;
      const k = (2 * Math.PI) / waveLen;
      
      ctx.strokeStyle = "var(--chalk-teal)"; ctx.lineWidth = 3;
      for(let i = 0; i < 180; i++) {
        const x = (i / 180) * V_WIDTH + 40 * Math.sin(k * ((i / 180) * V_WIDTH));
        ctx.beginPath(); ctx.moveTo(x, cy - 80); ctx.lineTo(x, cy + 80); ctx.stroke();
      }

      const dense1 = waveLen/2, sparse1 = waveLen, dense2 = waveLen*1.5;

      if (highlightState === 'dense') {
        ctx.fillStyle = "rgba(255, 128, 64, 0.4)";
        ctx.fillRect(dense1 - 30, cy - 90, 60, 180);
        ctx.fillStyle = "var(--chalk-coral)"; ctx.font = "bold 20px sans-serif"; ctx.fillText("密部", dense1 - 20, cy - 100);
      } else if (highlightState === 'sparse') {
        ctx.fillStyle = "rgba(255, 224, 102, 0.3)";
        ctx.fillRect(sparse1 - 40, cy - 90, 80, 180);
        ctx.fillStyle = "var(--chalk-yellow)"; ctx.font = "bold 20px sans-serif"; ctx.fillText("疏部", sparse1 - 20, cy - 100);
      } else if (highlightState === 'wavelength') {
        drawChalkArrow(dense1, cy-120, dense2, cy-120, "var(--chalk-pink)", "波長 (λ)", -15);
      }
    }
    else {
      ctx.fillStyle = "#fff"; ctx.font = "24px sans-serif";
      ctx.fillText("第三、四分頁細節打磨中，敬請期待！", V_WIDTH/2 - 200, V_HEIGHT/2);
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    highlightState = 'none';
    
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.remove('active');
      const tabsOrder = ['transverse', 'longitudinal', 'wip3', 'wip4'];
      if (tabsOrder[idx] === tab) btn.classList.add('active');
    });

    const panelTitle = document.getElementById('panel-title');
    const noteText = document.getElementById('note-text');
    const btnGroup = document.getElementById('btn-group');

    if (tab === 'transverse') {
      panelTitle.textContent = '第一頁：橫波 (高低波) 的名詞解剖';
      btnGroup.style.display = 'flex';
      btnGroup.innerHTML = `
        <button class="action-btn active-btn" onclick="setHighlight('none')">顯示原圖</button>
        <button class="action-btn" onclick="setHighlight('peaks')">標示 波峰/波谷</button>
        <button class="action-btn" onclick="setHighlight('amplitude')">標示 振幅</button>
        <button class="action-btn" onclick="setHighlight('wavelength')">標示 波長</button>
      `;
      noteText.innerHTML = '💡 <b>黑板重點：</b>橫波由波峰與波谷組成。<br>● <span class="highlight">振幅</span>：介質離開平衡位置的最大距離（代表能量大小）。';
    } 
    else if (tab === 'longitudinal') {
      panelTitle.textContent = '第二頁：縱波 (疏密波) 的名詞解剖';
      btnGroup.style.display = 'flex';
      btnGroup.innerHTML = `
        <button class="action-btn active-btn" onclick="setHighlight('none')">顯示原圖</button>
        <button class="action-btn" onclick="setHighlight('dense')">標示 密部</button>
        <button class="action-btn" onclick="setHighlight('sparse')">標示 疏部</button>
        <button class="action-btn" onclick="setHighlight('wavelength')">標示 波長</button>
      `;
      noteText.innerHTML = '💡 <b>黑板重點：</b>縱波（如聲波）由密部與疏部組成。<br>● <span class="highlight">密部/疏部</span>：介質分佈最密集與最稀疏的區域。';
    } 
    else {
      panelTitle.textContent = tab === 'wip3' ? '第三頁：保留區塊' : '第四頁：保留區塊';
      btnGroup.style.display = 'none';
      noteText.innerHTML = '此分頁尚未實作，準備一步一步慢慢完成。';
    }
    drawFrame();
  }

  window.addEventListener('resize', initCanvas);
  initCanvas();
  switchTab('transverse');
</script>
</body>
</html>
