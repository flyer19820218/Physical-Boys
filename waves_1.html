<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一單元：橫波與縱波演示</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .canvas-container {
            background-color: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        canvas {
            background-color: #000000;
            border: 1px solid #444;
            border-radius: 5px;
            display: block;
            margin-bottom: 10px;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #4CAF50;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007ACC;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #005A9E;
        }
        .note {
            color: #aaa;
            font-size: 0.9rem;
            max-width: 600px;
            line-height: 1.5;
        }
        .highlight {
            color: #ff4444;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>第一單元：波動與介質</h1>
    
    <div class="controls">
        <button id="playPauseBtn">暫停動畫 (Pause)</button>
    </div>

    <div class="canvas-container">
        <h2>1. 橫波 (Transverse Wave)</h2>
        <canvas id="transverseCanvas" width="800" height="200"></canvas>
        
        <h2 style="margin-top: 20px;">2. 縱波 (Longitudinal Wave)</h2>
        <canvas id="longitudinalCanvas" width="800" height="200"></canvas>
    </div>

    <div class="note">
        💡 <b>課堂提示：</b><br>
        請引導學生觀察 <span class="highlight">紅色的介質點</span>。按下暫停鍵，可以清楚對照：波形不斷向右傳遞，但介質僅在原處作上下（橫波）或左右（縱波）的週期性振動。
    </div>

    <script>
        const canvasT = document.getElementById('transverseCanvas');
        const ctxT = canvasT.getContext('2d');
        const canvasL = document.getElementById('longitudinalCanvas');
        const ctxL = canvasL.getContext('2d');
        const playPauseBtn = document.getElementById('playPauseBtn');

        let isPlaying = true;
        let time = 0;
        let animationId;

        // 波動參數
        const numParticles = 60;
        const spacing = canvasT.width / numParticles;
        const amplitude = 50;
        const wavelength = 200;
        const speed = 2; // 角頻率相關

        function drawGrid(ctx, canvas) {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
            // 平衡線
            ctx.strokeStyle = '#555';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawTransverse() {
            ctxT.clearRect(0, 0, canvasT.width, canvasT.height);
            drawGrid(ctxT, canvasT);

            const k = (2 * Math.PI) / wavelength;
            const omega = speed * 0.05;

            for (let i = 0; i < numParticles; i++) {
                const x0 = i * spacing;
                // 橫波公式：y 方向位移
                const y = canvasT.height / 2 + amplitude * Math.sin(k * x0 - omega * time);

                ctxT.beginPath();
                ctxT.arc(x0, y, 6, 0, Math.PI * 2);
                
                // 標示特定粒子為紅色
                if (i === 15 || i === 30 || i === 45) {
                    ctxT.fillStyle = '#ff4444'; // 紅色介質
                } else {
                    ctxT.fillStyle = '#4CAF50'; // 綠色介質
                }
                ctxT.fill();
            }
        }

        function drawLongitudinal() {
            ctxL.clearRect(0, 0, canvasL.width, canvasL.height);
            drawGrid(ctxL, canvasL);

            const k = (2 * Math.PI) / wavelength;
            const omega = speed * 0.05;

            // 畫多列粒子讓疏密更明顯
            const rows = 5;
            for (let r = 0; r < rows; r++) {
                const y0 = (canvasL.height / (rows + 1)) * (r + 1);
                
                for (let i = 0; i < numParticles; i++) {
                    const x0 = i * spacing;
                    // 縱波公式：x 方向位移
                    const dx = amplitude * Math.sin(k * x0 - omega * time);
                    const x = x0 + dx;

                    ctxL.beginPath();
                    ctxL.arc(x, y0, 4, 0, Math.PI * 2);
                    
                    if (i === 15 || i === 30 || i === 45) {
                        ctxL.fillStyle = '#ff4444';
                        // 中間那一列的紅色點稍微畫大一點，方便聚焦
                        if (r === 2) ctxL.arc(x, y0, 6, 0, Math.PI * 2);
                    } else {
                        ctxL.fillStyle = '#007ACC';
                    }
                    ctxL.fill();
                }
            }
        }

        function animate() {
            if (isPlaying) {
                time += 1;
            }
            drawTransverse();
            drawLongitudinal();
            animationId = requestAnimationFrame(animate);
        }

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseBtn.innerText = isPlaying ? "暫停動畫 (Pause)" : "繼續播放 (Play)";
            playPauseBtn.style.backgroundColor = isPlaying ? "#007ACC" : "#ff9800";
        });

        // 啟動動畫
        animate();
    </script>
</body>
</html>
