<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>凹透鏡成像互動版（HTML5 離線版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --text: #111; --muted: #555;
    --border: #e5e7eb; --hover: #f0f2f5; --primary: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1120px; margin: 20px auto; padding: 0 14px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  input[type=range] { flex: 1; min-width: 220px; max-width: 380px; accent-color: var(--primary); cursor: pointer; }
  button { padding: 8px 14px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
  button:hover { background: var(--hover); border-color: #cbd5e1; }
  button:active { transform: scale(0.98); }
  .readout-badge { font-weight: bold; color: var(--primary); background: #eff6ff; padding: 6px 12px; border-radius: 6px; min-width: 100px; text-align: center; }
  #stage-container { width: 100%; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 100%; height: auto; }
  .note { font-size: 13.5px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .stats { display: flex; gap: 20px; font-size: 13.5px; color: var(--muted); margin-top: 8px; background: #f8fafc; padding: 8px 14px; border-radius: 8px; border: 1px dashed var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3 style="margin: 0 0 14px; font-size: 20px;">凹透鏡成像互動模擬器（HTML5 即時運算版）</h3>
    <div class="controls">
      <label style="font-weight: 500;">物體位置：</label>
      <input id="rng" type="range" min="0" max="259" step="1" value="0" />
      <span id="readout" class="readout-badge">A（≈3f）</span>
      <button onclick="jump(104)">B (2f)</button>
      <button onclick="jump(155)">C (1.5f)</button>
      <button onclick="jump(207)">D (f)</button>
      <button onclick="jump(259)">E (0.5f)</button>
    </div>
    <div id="stage-container">
      <canvas id="stage"></canvas>
    </div>
    <div class="stats" id="stats">
      <span>物距 $u$：<b id="val-u">3.00f</b></span>
      <span>像距 $v$：<b id="val-v">-0.75f</b></span>
      <span>放大率 $m$：<b id="val-m">0.25x</b></span>
      <span style="color: #dc2626; font-weight: 500;">成像性質：正立縮小虛像</span>
    </div>
    <div class="note">
      💡 <b>教學提示：</b>A~E 標籤置於主光軸上方；$f$ / $2f$ 焦點標示置於下方。虛像以藍紫色的虛點線表示，兩條出射線（平行光發散、中心光直進）均於鏡前繪出回推虛線，精準交會於虛像頂端。
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const rng = document.getElementById('rng');
  const readout = document.getElementById('readout');
  
  // 物理與畫布參數設定
  const V_WIDTH = 1000;
  const V_HEIGHT = 460;
  const CX = 580;       // 透鏡中心 X 座標
  const CY = 240;       // 主光軸 Y 座標
  const F_LEN = 150;    // 焦距 f 的像素長度
  const OBJ_H = 110;    // 物體高度

  function initCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = V_WIDTH * dpr;
    canvas.height = V_HEIGHT * dpr;
    ctx.scale(dpr, dpr);
    render(0);
  }

  function getLabel(i) {
    if (i === 0) return 'A（≈3f）';
    if (i === 104) return 'B（2f）';
    if (i === 155) return 'C（1.5f）';
    if (i === 207) return 'D（f）';
    if (i === 259) return 'E（0.5f）';
    return ` u ≈ ${(3 - (i/259)*2.5).toFixed(2)}f `;
  }

  // 繪製箭頭共用函數
  function drawArrow(x, yFrom, yTo, color, isDashed = false, labelText = "") {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3.5;
    if (isDashed) {
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = 2.5;
    }
    
    // 箭身
    ctx.beginPath();
    ctx.moveTo(x, yFrom);
    ctx.lineTo(x, yTo);
    ctx.stroke();
    
    // 箭頭頂部
    ctx.setLineDash([]);
    ctx.beginPath();
    const headSize = isDashed ? 9 : 12;
    ctx.moveTo(x, yTo);
    ctx.lineTo(x - headSize/1.5, yTo + headSize);
    ctx.lineTo(x + headSize/1.5, yTo + headSize);
    ctx.closePath();
    ctx.fill();

    // 標籤說明
    if (labelText) {
      ctx.font = "bold 14px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(labelText, x, yFrom + 22);
    }
    ctx.restore();
  }

  // 繪製凹透鏡
  function drawConcaveLens() {
    ctx.save();
    ctx.fillStyle = "rgba(224, 242, 254, 0.6)";
    ctx.strokeStyle = "#0284c7";
    ctx.lineWidth = 2.5;

    const h = 160; // 透鏡半高
    const w = 18;  // 透鏡半寬
    
    ctx.beginPath();
    ctx.moveTo(CX - w, CY - h);
    ctx.lineTo(CX + w, CY - h);
    // 右側向內凹弧線
    ctx.quadraticCurveTo(CX + w/4, CY, CX + w, CY + h);
    ctx.lineTo(CX - w, CY + h);
    // 左側向內凹弧線
    ctx.quadraticCurveTo(CX - w/4, CY, CX - w, CY - h);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 透鏡中軸虛線
    ctx.strokeStyle = "rgba(2, 132, 199, 0.4)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(CX, CY - h - 10);
    ctx.lineTo(CX, CY + h + 10);
    ctx.stroke();
    ctx.restore();
  }

  function render(val) {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

    // 1. 幾何位置計算：由滑桿 mapping 到 u = 3f ~ 0.5f
    const u_ratio = 3 - (val / 259) * 2.5;
    const u = F_LEN * u_ratio;
    
    // 凹透鏡成像公式：v = -(u * f) / (u + f)
    const v = -(u * F_LEN) / (u + F_LEN);
    const m = Math.abs(v) / u;
    const img_h = OBJ_H * m;

    const obj_x = CX - u;
    const img_x = CX + v; // v 為負，自動位在鏡前
    const obj_top_y = CY - OBJ_H;
    const img_top_y = CY - img_h;

    // 更新下方資訊欄數值
    document.getElementById('val-u').textContent = `${u_ratio.toFixed(2)}f`;
    document.getElementById('val-v').textContent = `${(v / F_LEN).toFixed(2)}f`;
    document.getElementById('val-m').textContent = `${m.toFixed(2)}x`;

    // 2. 畫主光軸
    ctx.save();
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(20, CY);
    ctx.lineTo(V_WIDTH - 20, CY);
    ctx.stroke();
    ctx.restore();

    // 3. 標示刻度與文字 (上方 A~E，下方 f / 2f)
    const markers = [
      { name: 'A', ratio: 3.0 },
      { name: 'B', ratio: 2.0, sub: '2f' },
      { name: 'C', ratio: 1.5 },
      { name: 'D', ratio: 1.0, sub: 'f' },
      { name: 'E', ratio: 0.5 }
    ];

    ctx.save();
    ctx.font = "bold 13px sans-serif";
    markers.forEach(mk => {
      const x = CX - mk.ratio * F_LEN;
      // 畫刻度短線
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, CY - 5);
      ctx.lineTo(x, CY + 5);
      ctx.stroke();

      // 上方標記 A ~ E
      ctx.fillStyle = "#1e293b";
      ctx.textAlign = "center";
      ctx.fillText(mk.name, x, CY - 12);

      // 下方標記 f / 2f (左側)
      if (mk.sub) {
        ctx.fillStyle = "#dc2626";
        ctx.fillText(mk.sub, x, CY + 22);
      }
    });

    // 右側焦點與兩倍焦距 (下方標記 f / 2f)
    ['f', '2f'].forEach((sub, idx) => {
      const x = CX + (idx + 1) * F_LEN;
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, CY - 5);
      ctx.lineTo(x, CY + 5);
      ctx.stroke();
      ctx.fillStyle = "#dc2626";
      ctx.textAlign = "center";
      ctx.fillText(sub, x, CY + 22);
    });
    ctx.restore();

    // 4. 繪製光路圖
    ctx.save();
    
    // -- 光線 1：平行主光軸，折射後向外發散，反向延長線過左焦點 F --
    // 入射射線 (實線)
    ctx.strokeStyle = "#d97706"; // 橘黃光
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(obj_x, obj_top_y);
    ctx.lineTo(CX, obj_top_y);
    ctx.stroke();

    // 折射發散射線 (實線，往右上方延伸)
    const slope1 = (obj_top_y - CY) / (CX - (CX - F_LEN)); // = -OBJ_H / F_LEN
    const endX1 = V_WIDTH - 40;
    const endY1 = obj_top_y + slope1 * (endX1 - CX);
    ctx.beginPath();
    ctx.moveTo(CX, obj_top_y);
    ctx.lineTo(endX1, endY1);
    ctx.stroke();

    // 鏡前回推虛線 (虛線，連接折射點與左焦點，必定切過虛像頂端)
    ctx.strokeStyle = "#d97706";
    ctx.lineWidth = 1.8;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(CX, obj_top_y);
    ctx.lineTo(CX - F_LEN, CY);
    ctx.stroke();

    // -- 光線 2：穿過鏡心，方向不變直進 --
    // 入射與穿透射線 (實線)
    ctx.strokeStyle = "#059669"; // 翠綠光
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    const slope2 = (CY - obj_top_y) / (CX - obj_x);
    const endX2 = V_WIDTH - 40;
    const endY2 = CY + slope2 * (endX2 - CX);
    ctx.beginPath();
    ctx.moveTo(obj_x, obj_top_y);
    ctx.lineTo(endX2, endY2);
    ctx.stroke();

    // 鏡前回推虛線（特別用細虛線疊加並標註，強調視覺延伸性）
    ctx.strokeStyle = "#059669";
    ctx.lineWidth = 1.8;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(img_x, img_top_y);
    ctx.stroke();

    ctx.restore();

    // 5. 繪製凹透鏡 (置於光路之上或之後皆可，這邊覆蓋在中央)
    drawConcaveLens();

    // 6. 繪製物體與虛像 (放在最上層避免被光線遮蔽)
    drawArrow(obj_x, CY, obj_top_y, "#dc2626", false, "物體");
    drawArrow(img_x, CY, img_top_y, "#7c3aed", true, "虛像");
    
    // 7. 繪製眼睛示意圖 (提醒學生從鏡後觀察)
    ctx.save();
    ctx.font = "24px sans-serif";
    ctx.fillText("👁️", V_WIDTH - 50, CY - 30);
    ctx.font = "12px sans-serif";
    ctx.fillStyle = "#64748b";
    ctx.fillText("觀察方向", V_WIDTH - 65, CY - 8);
    ctx.restore();
  }

  function update(val) {
    readout.textContent = getLabel(val);
    render(val);
  }

  function jump(val) {
    rng.value = val;
    update(val);
  }

  rng.addEventListener('input', e => update(parseInt(e.target.value)));
  
  // 視窗調整大小時自適應渲染
  window.addEventListener('resize', initCanvas);
  
  // 初始繪製
  initCanvas();
</script>
</body>
</html>
