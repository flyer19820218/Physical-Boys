<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中理化：位置、路徑長與位移（PPT互動切換完美版）</title>
    <style>
        :root {
            --bg-board: #1c3829;
            --bg-card: #244734;
            --border-color: #3b6e52;
            --chalk-white: #fcfcfc;
            --chalk-yellow: #fde047;
            --chalk-green: #4ade80;
            --chalk-blue: #38bdf8;
            --chalk-orange: #fb923c;
            --chalk-pink: #f472b6;
            --chalk-purple: #c084fc;
        }
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-board);
            color: var(--chalk-white);
            margin: 0;
            padding: 15px 25px;
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #172e21;
            color: #94a3b8;
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 140px;
        }
        .tab-btn:hover { background: #1f3d2c; color: var(--chalk-white); }
        .tab-btn.active {
            background: var(--bg-card);
            color: var(--chalk-yellow);
            border-color: var(--chalk-yellow);
            border-bottom-color: var(--bg-card);
            transform: translateY(3px);
        }

        .slide { display: none; animation: fadeIn 0.3s ease-in-out; }
        .slide.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        h2 {
            color: var(--chalk-blue);
            font-size: 1.5rem;
            border-left: 6px solid var(--chalk-orange);
            padding-left: 12px;
            margin-top: 0;
        }
        h3 { margin-top: 0; }

        .teacher-box {
            background: #172e21;
            border: 2px solid var(--chalk-pink);
            border-radius: 12px;
            padding: 15px 20px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .teacher-avatar {
            font-size: 2.5rem;
            background: var(--chalk-pink);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .teacher-content { flex-grow: 1; }
        .teacher-name { color: var(--chalk-pink); font-weight: bold; font-size: 0.95rem; margin-bottom: 3px; }
        .teacher-text { font-size: 1.1rem; color: var(--chalk-white); margin: 0; }

        .highlight-yellow { color: var(--chalk-yellow); font-weight: bold; }
        .highlight-green { color: var(--chalk-green); font-weight: bold; }
        .highlight-orange { color: var(--chalk-orange); font-weight: bold; }
        .highlight-blue { color: var(--chalk-blue); font-weight: bold; }
        .highlight-purple { color: var(--chalk-purple); font-weight: bold; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .formula-box {
            background: #172e21;
            border: 2px dashed var(--chalk-blue);
            border-radius: 10px;
            padding: 16px 20px;
            margin: 16px 0;
            font-size: 1.25rem;
            text-align: center;
        }
        .formula-box .formula-label {
            display: block;
            font-size: 0.9rem;
            color: #a7f3d0;
            margin-bottom: 6px;
        }

        .diagram-box {
            background: #172e21;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px dashed var(--border-color);
        }
        .diagram-caption { margin: 0 0 10px 0; color:#a7f3d0; font-weight:bold; }

        .example-note {
            background: rgba(56,189,248,0.08);
            border-left: 4px solid var(--chalk-blue);
            padding: 10px 16px;
            border-radius: 0 8px 8px 0;
            margin: 14px 0;
            font-size: 1.05rem;
        }

        .controls {
            background: #172e21;
            padding: 18px;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 1.05rem; }
        input[type="range"] { width: 100%; cursor: pointer; height: 8px; }

        .btn-group { display: flex; gap: 12px; width: 100%; margin-top: 10px; }
        button.action-btn {
            background-color: var(--chalk-orange);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        button.action-btn:hover { background-color: #f97316; transform: scale(1.02); }
        button.reset-btn { background-color: #64748b; color: white; }
        button.reset-btn:hover { background-color: #475569; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #172e21;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-title { font-size: 0.9rem; color: #a7f3d0; }
        .stat-value { font-size: 1.8rem; font-weight: bold; margin-top: 5px; }

        canvas {
            width: 100%;
            height: auto;
            background: #172e21;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .option-btn {
            background: #172e21;
            color: var(--chalk-white);
            border: 2px solid var(--border-color);
            text-align: left;
            margin-bottom: 12px;
            padding: 15px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .option-btn:hover { background: #1f3d2c; border-color: var(--chalk-yellow); transform: translateX(5px); }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .nav-page-btn {
            background: #3b6e52;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .nav-page-btn:hover { background: #4e8a67; }

        .sub-card {
            background: #172e21;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 22px;
        }
        .sub-card h3 { color: var(--chalk-purple); }
    </style>
</head>
<body>

<div class="container">
    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchSlide(0)">❶ 位置的定義</button>
        <button class="tab-btn" onclick="switchSlide(1)">❷ 路徑長與位移</button>
        <button class="tab-btn" onclick="switchSlide(2)">❸ 進階應用</button>
        <button class="tab-btn" onclick="switchSlide(3)">❹ 互動實驗室</button>
        <button class="tab-btn" onclick="switchSlide(4)">❺ 隨堂實戰</button>
    </nav>
