<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>06-1｜位置、路徑長與位移</title>
<style>
html,body{margin:0;padding:0;background:#1c3829;min-height:100%;}
#lessonFrame{display:block;width:100%;min-height:100vh;border:0;background:#1c3829;}
</style>
</head>
<body>
<iframe id="lessonFrame" src="kinematics_core.html" title="06-1 位置、路徑長與位移"></iframe>
<script>
(() => {
  const frame = document.getElementById('lessonFrame');
  let lang = 'zh';
  let observer = null;
  let resizing = false;

  function resizeFrame(){
    if(resizing) return;
    resizing = true;
    requestAnimationFrame(() => {
      try{
        const d = frame.contentDocument;
        if(d && d.documentElement){
          frame.style.height = Math.max(window.innerHeight, d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0) + 'px';
        }
      }catch(e){}
      resizing = false;
    });
  }

  function setup(){
    const w = frame.contentWindow;
    const d = frame.contentDocument;
    if(!w || !d) return;

    // Fix the one layout mistake from the previous packaging pass: the moved displacement block belongs inside slide 3 content, not inside the footer row.
    const slide2 = d.getElementById('slide-2');
    if(slide2){
      const card = slide2.querySelector('.card');
      const footer = slide2.querySelector('.footer-nav');
      if(card && footer){
        const movable = Array.from(footer.children).filter(el =>
          el.matches('.formula-box,.example-note,h3,#posTeacherBox') ||
          (el.tagName === 'DIV' && el.querySelector && el.querySelector('.option-btn'))
        );
        movable.forEach(el => card.appendChild(el));
      }
    }

    function setPair(el, en, zhOverride){
      if(!el) return;
      if(!el.dataset.overlayZh) el.dataset.overlayZh = zhOverride !== undefined ? zhOverride : el.innerHTML;
      el.dataset.overlayEn = en;
    }
    function exact(root, zh, en, zhOverride){
      const scope = root ? d.querySelector(root) : d.body;
      if(!scope) return;
      const nodes = Array.from(scope.querySelectorAll('*'));
      const el = nodes.find(x => x.textContent.trim() === zh);
      if(el) setPair(el,en,zhOverride);
    }
    function bySel(sel,en,zhOverride){ setPair(d.querySelector(sel),en,zhOverride); }
    function bySelAll(sel,ens){ d.querySelectorAll(sel).forEach((el,i)=>{ if(ens[i]!==undefined) setPair(el,ens[i]); }); }

    // ---------- Slide 0: position ----------
    exact('#slide-0','曉臻老師的小提醒',"Ms. Hsiao-Chen's Note");
    bySel('#slide-0 .teacher-text','Before describing a position, we must choose a <span class="highlight-blue">reference point (origin)</span>. Without a reference point, saying “I am at 5 meters” is incomplete—5 meters measured from where?');
    bySelAll('#slide-0 ul li',[
      '<span class="highlight-blue">Position:</span> the coordinate of an object at a given time relative to a <span class="highlight-orange">reference point (origin O)</span>, written as <b>x</b>.',
      'Position includes <span class="highlight-yellow">magnitude</span> and <span class="highlight-yellow">direction (sign)</span>. For example, x = +5 m is 5 m to the right of the origin, while x = −3 m is 3 m to the left.'
    ]);
    bySel('#slide-0 ul li:first-child', '<span class="highlight-blue">Position:</span> the coordinate of an object at a given time relative to a <span class="highlight-orange">reference point (origin O)</span>, written as <b>x</b>.', '<span class="highlight-blue">位置：</span>物體在某一時刻，相對於<span class="highlight-orange">參考點（原點 O）</span>的坐標，用 <b>x</b> 表示。');
    exact('#slide-0','▼ 數線上的位置表示法','▼ Position on a Number Line');
    exact('#slide-0','O（原點 0）','O (origin 0)');
    exact('#slide-0','下一頁：平面座標與颱風 ➔','Next: Position in 2D ➔');

    // ---------- Slide 1: 2D position / typhoon ----------
    exact('#slide-1','曉臻老師的氣象播報台',"Ms. Hsiao-Chen's Weather Desk");
    bySel('#slide-1 .teacher-text','The real world is not a single straight line. To locate a typhoon, meteorologists use a <span class="highlight-yellow">two-dimensional coordinate system (x, y)</span>. Let’s use this weather scenario to practice locating objects on a plane.');
    bySel('#slide-1 .sub-card > p','<b>【Typhoon Warning Scenario】</b> The weather service tracks Typhoon Gaemi. At 8:00 a.m. on July 24, its center is at <b style="color:#ef4444;">point A</b>. At 8:00 a.m. on July 25, it has moved to <b style="color:#ef4444;">point B</b>. Use the coordinate diagram to answer the two questions below.');
    bySelAll('#slide-1 .sub-card ul li',[
      '💡 <b>Reading coordinates:</b> read left-right first (x-axis), then up-down (y-axis). Right and up are positive; left and down are negative.',
      '💡 <b>Straight-line distance:</b> use the Pythagorean theorem:<br><span class="highlight-green" style="font-size:1.2rem;">displacement magnitude = √(Δx² + Δy²)</span>'
    ]);
    exact('#slide-1','▼ 凱米颱風中心位置監測圖','▼ Tracking the Center of Typhoon Gaemi');
    exact('#slide-1','恆春 (0, 0)','Hengchun (0, 0)');
    exact('#slide-1','✏️ 題組第 1 題：平面相對坐標','✏️ Question 1: Relative Coordinates in 2D');
    exact('#slide-1','✏️ 題組第 2 題：二維空間的位移大小','✏️ Question 2: Displacement Magnitude in 2D');
    exact('#slide-1','⬅ 上一頁：位置的定義','⬅ Previous: Position & Reference Point');
    exact('#slide-1','下一頁：路徑長與位移 ➔','Next: Distance & Displacement ➔');
    ['450','600','750','1050'].forEach(n=>exact('#slide-1',`(${['A','B','C','D'][['450','600','750','1050'].indexOf(n)]}) ${n} 公里`,`(${['A','B','C','D'][['450','600','750','1050'].indexOf(n)]}) ${n} km`));

    // ---------- Slide 2: distance / displacement ----------
    exact('#slide-2','曉臻老師的小提醒',"Ms. Hsiao-Chen's Note");
    bySel('#slide-2 .teacher-text','Imagine running on a track. Your step counter keeps increasing—that is <span class="highlight-yellow">distance traveled</span>. Your final position relative to the start, including direction, is your <span class="highlight-green">displacement</span>.');
    bySelAll('#slide-2 ul li',[
      '<span class="highlight-yellow">【Distance traveled】 (scalar):</span><br>the total length of the actual path.<br>👉 <b>It has magnitude only and is never negative.</b>',
      '<span class="highlight-green">【Displacement】 (vector):</span><br>the change from initial position to final position.<br>👉 <b>It has magnitude and direction; in one dimension, the sign indicates direction.</b>'
    ]);
    exact('#slide-2','▼ 靜態圖解：向前走 12 m，再往回走 8 m','▼ Walk 12 m Forward, Then 8 m Back');
    exact('#slide-2','0 m (起點)','0 m (start)');
    exact('#slide-2','4 m (終點)','4 m (finish)');
    exact('#slide-2','12 m (折返點)','12 m (turning point)');
    exact('#slide-2','路徑長 = 12 + 8 = 20 m','distance = 12 + 8 = 20 m');
    exact('#slide-2','去程 12 m ➔','outward 12 m ➔');
    exact('#slide-2','⬅ 回程 8 m','⬅ return 8 m');
    exact('#slide-2','位移 = +4 m (向右)','displacement = +4 m (right)');
    exact('#slide-2','⬅ 上一頁：平面座標與颱風','⬅ Previous: Position in 2D');
    exact('#slide-2','下一頁：進階應用 ➔','Next: Nonlinear Paths ➔');
    const movedFormula=d.querySelector('#slide-2 .formula-box');
    if(movedFormula){setPair(movedFormula,'<span class="formula-label">Displacement from the change in position</span>Δx = x<sub>final</sub> − x<sub>initial</sub>','<span class="formula-label">位移的定義式（由位置變化得到）</span>Δx = x<sub>末</sub> − x<sub>初</sub>');}
    const movedExample=d.querySelector('#slide-2 .example-note');
    if(movedExample){setPair(movedExample,'<b>Example:</b> Xiaoming moves from x₁ = −2 m to x₂ = +6 m.<br>Displacement Δx = x₂ − x₁ = (+6) − (−2) = <span class="highlight-green">+8 m</span> (positive means right).');}

    // ---------- Slide 3: nonlinear paths ----------
    exact('#slide-3','曉臻老師的小提醒',"Ms. Hsiao-Chen's Note");
    bySel('#slide-3 > .card > .teacher-box .teacher-text','Distance traveled is measured along the <b>actual path</b>. Displacement does not follow the bends of the path; it depends only on the straight-line change from start to finish.');
    exact('#slide-3','🏟️ 範例一：跑半圈圓形操場','🏟️ Example 1: Half a Lap Around a Circular Track');
    exact('#slide-3','▼ 從 A 點跑半圈到對面的 B 點','▼ Run Half a Lap from A to the Opposite Point B');
    exact('#slide-3','A（起點）','A (start)');
    exact('#slide-3','B（終點）','B (finish)');
    exact('#slide-3','路徑長 = 半圓弧長','distance = semicircular arc length');
    exact('#slide-3','位移 = 直徑','displacement = diameter');
    exact('#slide-3','半圓路徑長','Half-circle distance');
    exact('#slide-3','位移大小（直徑）','Displacement magnitude (diameter)');
    const slide3Notes=d.querySelectorAll('#slide-3 .example-note');
    if(slide3Notes[0]) setPair(slide3Notes[0],'<b>Using numbers:</b> track radius r = 50 m, half a lap:<br>distance L = π × 50 ≈ <span class="highlight-yellow">157 m</span><br>displacement magnitude = 2 × 50 = <span class="highlight-green">100 m</span> (from A toward B).');
    const slide3Practice=d.querySelectorAll('#slide-3 h3[style*="chalk-orange"]');
    slide3Practice.forEach(el=>setPair(el,'✏️ Practice'));
    const s3Names=d.querySelectorAll('#slide-3 .teacher-name'); s3Names.forEach(el=>setPair(el,"Ms. Hsiao-Chen's Question"));
    bySel('#circleTeacherText','If the track radius is r = 30 m and you run half a lap, which pair of distance and displacement is closest? (Use π ≈ 3.14.)');
    const circleOpts=d.querySelectorAll('#circleTeacherBox ~ .option-btn');
    const circleEn=['(A) distance 60 m; displacement 94.2 m','(B) distance 94.2 m; displacement 60 m','(C) distance 30 m; displacement 30 m']; circleOpts.forEach((el,i)=>setPair(el,circleEn[i]));
    exact('#slide-3','🕐 範例二：時鐘秒針走 15 秒','🕐 Example 2: A Second Hand Moves for 15 Seconds');
    exact('#slide-3','▼ 秒針從 12 點走到 3 點（15秒＝1/4圈）','▼ From 12 to 3 (15 s = 1/4 revolution)');
    exact('#slide-3','路徑長(弧)','distance (arc)');
    exact('#slide-3','位移(直線)','displacement (straight line)');
    exact('#slide-3','秒針走 1/4 圈的路徑長（設秒針長 L）','Distance for 1/4 revolution (second-hand length L)');
    exact('#slide-3','位移大小（直角三角形斜邊）','Displacement magnitude (hypotenuse)');
    if(slide3Notes[1]) setPair(slide3Notes[1],'<b>Using numbers:</b> second-hand length L = 10 cm, moving 15 s (90°):<br>distance = π×10 ÷ 2 ≈ <span class="highlight-yellow">15.7 cm</span><br>displacement = 10×√2 ≈ <span class="highlight-green">14.1 cm</span> (straight from the 12 position to the 3 position).');
    bySel('#clockTeacherText','If the second hand moves for 30 s (half a revolution) and its length is still 10 cm, which statement is correct?');
    const clockOpts=d.querySelectorAll('#clockTeacherBox ~ .option-btn');
    const clockEn=['(A) distance ≈ 31.4 cm; displacement = 20 cm','(B) distance = 20 cm; displacement ≈ 31.4 cm','(C) distance and displacement are both 20 cm']; clockOpts.forEach((el,i)=>setPair(el,clockEn[i]));
    exact('#slide-3','⬅ 上一頁：路徑長與位移','⬅ Previous: Distance & Displacement');
    exact('#slide-3','下一頁：互動實驗室 ➔','Next: Interactive Lab ➔');

    // ---------- Slide 4: interactive lab ----------
    exact('#slide-4','曉臻老師的實驗室指引',"Ms. Hsiao-Chen's Lab Guide");
    bySel('#teacherText2','Adjust the sliders to set the turning point and final position, then press “Play animation” to observe.');
    const labels=d.querySelectorAll('#slide-4 .control-group label');
    if(labels[0]) setPair(labels[0],`❶ Turning-point position x₁: <span id="x1Val" class="highlight-yellow">${d.getElementById('x1Val').textContent}</span> m`);
    if(labels[1]) setPair(labels[1],`❷ Final position after returning x₂: <span id="x2Val" class="highlight-green">${d.getElementById('x2Val').textContent}</span> m`);
    exact('#slide-4','▶ 播放動畫','▶ Play animation');
    exact('#slide-4','↺ 重置','↺ Reset');
    exact('#slide-4','經過時間 (t)','Elapsed time (t)');
    exact('#slide-4','當前位置 (x)','Current position (x)');
    exact('#slide-4','路徑長 (L)','Distance (L)');
    exact('#slide-4','位移 (Δx)','Displacement (Δx)');
    exact('#slide-4','1D 數線運動軌跡','1D Number-Line Motion','一維數線運動軌跡');
    exact('#slide-4','x-t 圖 (位置-時間圖)','x-t Graph (Position-Time Graph)');
    exact('#slide-4','⬅ 上一頁：進階應用','⬅ Previous: Nonlinear Paths');
    exact('#slide-4','下一頁：隨堂實戰 ➔','Next: Quick Challenge ➔');

    // ---------- Slide 5: final challenge ----------
    const q=d.querySelector('#slide-5 .card > p:not(.hook-subtitle)');
    if(q) setPair(q,'<strong>【Question】</strong> During relay warm-up, Xiaoming starts at <strong>0 m</strong>, runs right to the <strong>15 m</strong> turning point, then runs back and stops at <strong>5 m</strong>.<br>What are his <span class="highlight-yellow">distance traveled</span> and <span class="highlight-green">displacement</span>?');
    exact('#slide-5','曉臻老師的試場分析',"Ms. Hsiao-Chen's Test-Taking Tip");
    bySel('#quizTeacherText','Choose an answer below. First decide whether the question asks for a scalar distance or a vector displacement.');
    const quizOpts=d.querySelectorAll('#quizOptions .option-btn');
    const quizEn=['(A) distance 15 m; displacement +5 m','(B) distance 20 m; displacement −5 m','(C) distance 25 m; displacement +5 m','(D) distance 25 m; displacement +20 m']; quizOpts.forEach((el,i)=>setPair(el,quizEn[i]));
    exact('#slide-5','⬅ 上一頁：回到互動實驗室','⬅ Previous: Interactive Lab');

    // Initial dynamic questions.
    const dynInitial={
      posTeacherText:'Xiaohua moves from x₁ = +3 m to x₂ = −4 m. What is the displacement?',
      typhoonQ1Text:'Using <b>Hengchun</b> as the reference point (0, 0), point A is (3, −1). What are the coordinates of <b>point B</b>?',
      typhoonQ2Text:'If each grid square represents <b>150 km</b>, what is the <b>magnitude of the displacement</b> from A to B?',
      circleTeacherText:'If the track radius is r = 30 m and you run half a lap, which pair of distance and displacement is closest? (Use π ≈ 3.14.)',
      clockTeacherText:'If the second hand moves for 30 s (half a revolution) and its length is still 10 cm, which statement is correct?',
      teacherText2:'Adjust the sliders to set the turning point and final position, then press “Play animation” to observe.',
      quizTeacherText:'Choose an answer below. First decide whether the question asks for a scalar distance or a vector displacement.'
    };
    Object.entries(dynInitial).forEach(([id,en])=>{ const el=d.getElementById(id); if(el) setPair(el,en); });

    function dynamicEnglish(el){
      const t=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(el.id==='startBtn'){
        if(t.includes('繼續播放')) return '▶ Resume';
        if(t.includes('暫停')) return '❚❚ Pause';
        if(t.includes('重新播放')) return '↺ Replay';
        if(t.includes('播放動畫')) return '▶ Play animation';
      }
      if(t.includes('小華原本在數線')) return dynInitial.posTeacherText;
      if(t.startsWith('🎉 答對了！位移')) return '🎉 <b>Correct!</b> Δx = x₂ − x₁ = (−4) − (+3) = <b>−7 m</b>. The negative sign means the displacement is to the left.';
      if(t.startsWith('❌ 再想想：位移公式')) return '❌ <b>Try again:</b> Δx = x<sub>final</sub> − x<sub>initial</sub>. Here it is (−4) − (+3). Check the signs carefully.';
      if(t.includes('若以「恆春」為基準點')) return dynInitial.typhoonQ1Text;
      if(t.startsWith('🎉 完全正確！')) return '🎉 <b>Exactly right!</b> From Hengchun (0,0), point B is 1 grid square left (−1) and 2 squares up (+2), so B = <b>(−1, 2)</b>.';
      if(t.startsWith('❌ 哎呀看錯格囉！')) return '❌ <b>Check the grid again.</b> Coordinates are written (x, y): left/right first, then down/up. Left is negative and up is positive.';
      if(t.includes('每一個小方格的邊長代表 150 公里')) return dynInitial.typhoonQ2Text;
      if(t.startsWith('🎉 太厲害了！正是 750 公里！')) return '🎉 <b>Correct—750 km!</b><br>• From A(3, −1) to B(−1, 2): horizontal change = 4 squares, vertical change = 3 squares.<br>• This is a <b>3–4–5 right triangle</b>, so the displacement is 5 squares.<br>• 5 × 150 km = <b>750 km</b>.';
      if(t.startsWith('❌ 再算一次看看！')) return '❌ <b>Try again.</b> The horizontal change is 4 squares and the vertical change is 3 squares. Use √(3² + 4²), then multiply by 150 km per square.';
      if(t.includes('若操場半徑改成 r = 30 m')) return dynInitial.circleTeacherText;
      if(t.startsWith('🎉 答對了！路徑長 = πr')) return '🎉 <b>Correct!</b> Distance = πr = 3.14 × 30 ≈ <b>94.2 m</b>; displacement magnitude = 2r = <b>60 m</b>.';
      if(t.startsWith('❌ 再檢查一下：路徑長是繞半圓')) return '❌ <b>Check again:</b> distance follows the semicircular arc (πr), while displacement is the straight-line diameter (2r).';
      if(t.includes('若秒針走了 30 秒')) return dynInitial.clockTeacherText;
      if(t.startsWith('🎉 答對了！30秒是半圈')) return '🎉 <b>Correct!</b> In 30 s the hand moves half a revolution. Distance = πL ≈ <b>31.4 cm</b>; displacement = 2L = <b>20 cm</b>.';
      if(t.startsWith('❌ 再想想：走半圈時')) return '❌ <b>Try again:</b> after half a revolution, start and finish are opposite ends of a diameter. Displacement is 20 cm; distance is the semicircular arc ≈ 31.4 cm.';
      if(t.startsWith('請老師或同學拖拉上方滑塊')) return dynInitial.teacherText2;
      if(t.startsWith('⏸ 動畫暫停中')) return '⏸ <b>Paused.</b> Compare the current position with the x-t graph.';
      if(t.includes('等速向前奔跑中')) return '🏃‍♂️ <b>Moving forward at constant speed.</b> Before turning around, distance traveled and displacement magnitude are the same.';
      if(t.includes('跑到起點後方了')) return '⚠️ <b>The object is now behind the starting point.</b> Displacement is negative, while distance traveled keeps increasing.';
      if(t.includes('轉身往回跑了')) return '🔄 <b>It has turned around.</b> The x-t graph slopes downward. Distance keeps increasing while displacement decreases.';
      if(t.startsWith('🏁 到達終點！')){
        const m=t.match(/跑了\s*([+−-]?\d+(?:\.\d+)?)\s*m.*?位移只有\s*([+−-]?\d+(?:\.\d+)?)\s*m/);
        return m ? `🏁 <b>Finished!</b> Distance traveled: <span class="highlight-yellow">${m[1]} m</span>. Final displacement: <span class="highlight-green">${m[2]} m</span>.` : '🏁 <b>Finished!</b> Compare the total distance traveled with the final displacement.';
      }
      if(t.startsWith('點選下方選項作答')) return dynInitial.quizTeacherText;
      if(t.startsWith('🎉 太厲害了！答對了！')) return '🎉 <b>Correct!</b><br>• <b>Distance:</b> 15 m forward + 10 m back = 25 m.<br>• <b>Displacement:</b> final position 5 m − initial position 0 m = <b>+5 m</b>.';
      if(t.startsWith('❌ 哎呀，答錯囉！')) return '❌ <b>Try again:</b> distance adds every segment of the path; displacement is final position minus initial position.';
      return null;
    }

    // Canvas text-only overlay: geometry, timing and drawing logic remain untouched.
    const canvasMap={'路徑長 L':'Distance L','位移 Δx':'Displacement Δx','時間 t (s)':'Time t (s)','位置 x (m)':'Position x (m)','折返轉折點':'Turning point'};
    const proto=w.CanvasRenderingContext2D && w.CanvasRenderingContext2D.prototype;
    if(proto && !proto.__pbI18n){
      const original=proto.fillText;
      proto.fillText=function(text,...args){ const shown=(lang==='en'&&canvasMap[String(text)])?canvasMap[String(text)]:text; return original.call(this,shown,...args); };
      proto.__pbI18n=true;
    }

    const dynamicIds=['posTeacherText','typhoonQ1Text','typhoonQ2Text','circleTeacherText','clockTeacherText','teacherText2','quizTeacherText','startBtn'];
    let mutating=false;
    function translateDynamic(el){
      if(!el||mutating) return;
      if(lang==='en'){
        if(/[\u4e00-\u9fff]/.test(el.textContent||'')) el.dataset.dynamicZh=el.innerHTML;
        const en=dynamicEnglish(el);
        if(en){mutating=true;el.innerHTML=en;mutating=false;}
      }else if(el.dataset.dynamicZh){mutating=true;el.innerHTML=el.dataset.dynamicZh;mutating=false;}
    }
    observer=new w.MutationObserver(records=>{
      if(mutating) return;
      const done=new Set();
      records.forEach(r=>{
        const node=r.target.nodeType===1?r.target:r.target.parentElement;
        if(!node||!node.closest)return;
        for(const id of dynamicIds){const target=node.closest('#'+id);if(target&&!done.has(target)){done.add(target);translateDynamic(target);break;}}
      });
      resizeFrame();
    });
    dynamicIds.forEach(id=>{const el=d.getElementById(id);if(el) observer.observe(el,{childList:true,subtree:true,characterData:true});});

    function applyStatic(){
      d.querySelectorAll('[data-zh][data-en]').forEach(el=>{
        const val=lang==='en'?el.dataset.en:el.dataset.zh;
        if(el.namespaceURI&&el.namespaceURI.includes('svg')) el.textContent=val; else el.innerHTML=val;
      });
      d.querySelectorAll('[data-overlay-zh][data-overlay-en]').forEach(el=>{
        const val=lang==='en'?el.dataset.overlayEn:el.dataset.overlayZh;
        if(el.namespaceURI&&el.namespaceURI.includes('svg')) el.textContent=val; else el.innerHTML=val;
      });
    }

    w.setLang=function(newLang){
      lang=newLang==='en'?'en':'zh';
      d.documentElement.lang=lang==='en'?'en':'zh-TW';
      applyStatic();
      dynamicIds.forEach(id=>translateDynamic(d.getElementById(id)));
      const zh=d.getElementById('btn-lang-zh'), en=d.getElementById('btn-lang-en');
      if(zh) zh.classList.toggle('active',lang==='zh');
      if(en) en.classList.toggle('active',lang==='en');
      document.title=lang==='en'?'06-1 | Position, Distance & Displacement':'06-1｜位置、路徑長與位移';
      try{const k=w.getKinematics(w.t);w.drawAnimation(k.pos,k.path,k.disp);w.drawGraph(w.t);}catch(e){try{w.resetSim();}catch(_){} }
      resizeFrame();
    };

    // Keep slider labels bilingual even after their numeric spans update.
    const x1=d.getElementById('x1Slider'), x2=d.getElementById('x2Slider');
    [x1,x2].forEach(sl=>{if(sl)sl.addEventListener('input',()=>{setTimeout(()=>w.setLang(lang),0);});});

    w.setLang('zh');
    resizeFrame();
    if(w.ResizeObserver){const ro=new w.ResizeObserver(resizeFrame);ro.observe(d.body);}
    window.addEventListener('resize',resizeFrame);
  }

  frame.addEventListener('load',setup);
})();
</script>
</body>
</html>
