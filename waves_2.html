        <label style="color:var(--chalk-green); font-weight:bold;" data-zh="環境溫度 (t)：" data-en="Ambient Temp (t):">環境溫度 (t)：</label>
        <input id="rng-temp" type="range" min="0" max="40" step="1" value="15" />
        <span id="val-temp" class="readout-badge" style="background:var(--chalk-green);">15 °C</span>
      </div>
      <span style="color:#ffffff; font-weight:bold; margin-left:15px; font-size: 20px;" data-zh="濕度影響：濕度愈大，聲速愈快！" data-en="Humidity: Higher humidity, faster sound speed!">濕度影響：濕度愈大，聲速愈快！</span>
    </div>

    <div id="stage-container">
      <canvas id="stage"></canvas>
    </div>

    <div class="teach-bar" id="teachBar">
      <button class="teach-btn" id="teach-pause" type="button"></button>
      <button class="teach-btn" id="teach-replay" type="button"></button>
      <div class="teach-track"><div class="teach-fill" id="teach-fill"></div></div>
      <div class="teach-chips" id="teach-chips"></div>
      <div class="teach-note" id="teach-note" aria-live="polite"></div>
    </div>

    <!-- 數據顯示區 -->
    <div class="stats" id="stats-box">
      <span id="stat1"></span>
      <span id="stat2"></span>
      <span id="stat3"></span>
    </div>

    <!-- 測驗區 Tab 1 (Ex1 & Ex2) -->
    <div id="quiz-section-tab1"></div>

    <!-- 測驗區 Tab 3 (聲速計算) -->
    <div id="quiz-section-tab3" style="display:none;"></div>

    <!-- 重點筆記區 -->
    <div class="note" id="note-text"></div>
  </div>
</div>

<script>
  // ==========================================
  // 🌟 V5 開場動畫控制
  // ==========================================
  const introScreen = document.getElementById('introScreen');
  let introClosed = false;
  function enterLesson() {
      if (introClosed) return;
      introClosed = true;
      introScreen.classList.add('exiting');
      document.body.classList.remove('intro-locked'); // 恢復滾動
      setTimeout(() => introScreen.remove(), 800);
  }
  introScreen.addEventListener('click', enterLesson);
  document.addEventListener('keydown', enterLesson, { once: true });

  // ==========================================
  // 🌟 曉臻老師 Hook 提問資料庫
  // ==========================================
  const hooks = {
      'tab1': {
          zh: "如果波速只跟「介質」有關，那為什麼有些人講話特別快，聲音還是沒有比較早傳到你的耳朵裡？",
          en: "If wave speed only depends on the 'medium,' why doesn't someone speaking really fast reach your ears sooner?"
      },
      'tab2': {
          zh: "在科幻電影裡，太空船爆炸時總是會發出巨大的「轟隆」聲，但其實外太空根本聽不到任何聲音！這是為什麼？",
          en: "In sci-fi movies, exploding spaceships always make a loud 'BOOM', but in reality, outer space is completely silent! Why is that?"
      },
      'tab3': {
          zh: "為什麼在寒冷的冬夜，遠處車站的鐘聲聽起來特別清楚？難道聲音也會「怕冷」而跑得比較慢嗎？",
          en: "Why do train station bells sound so clear from far away on a cold winter night? Does sound get 'cold' and run slower?"
      }
  };

  function updateHookBox() {
      const hookBox = document.getElementById('hookBox');
      if(hookBox && hooks[currentTab]) {
          const titleText = currentLang === 'en' ? "👩🏻‍🏫 Teacher Xiaozhen says:" : "👩🏻‍🏫 曉臻老師說：";
          const contentText = currentLang === 'en' ? hooks[currentTab].en : hooks[currentTab].zh;
          hookBox.innerHTML = `
              <div class="xiaozhen-logo">👩🏻‍🏫</div>
              <div class="hook-content">
                  <div class="hook-title">${titleText}</div>
                  <div class="hook-text">${contentText}</div>
              </div>
          `;
      }
  }

  // ==========================================
  // 🌟 雙語切換系統 (預設繁中絕對防禦)
  // ==========================================
  let currentLang = 'zh';

  function tr(zh, en) {
      return currentLang === 'en' ? en : zh;
  }

  function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';

      // 按鈕視覺切換
      document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

      // 替換所有具備 data-zh / data-en 的靜態 HTML
      document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.innerHTML = el.getAttribute(`data-${lang}`);
      });
      
      updateHookBox(); // 更新 Hook
      renderUIForTab(); // 重新渲染動態注入的 UI
      
  }

  // ==========================================
  // 物理繪圖引擎 (100% 絕對鎖死)
  // ==========================================
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  const V_WIDTH = 1000;
  const V_HEIGHT = 350;
  
  let currentTab = 'tab1';
  let aniFrame;
  let frameCounter = 0; 

  // Tab 1
  const rngFreq = document.getElementById('rng-freq');
  const rngWave = document.getElementById('rng-wave');
  const valFreq = document.getElementById('val-freq');
  const valWave = document.getElementById('val-wave');

  // Tab 2
  let raceProgress = { air: 0, water: 0, steel: 0 };
  let isRacing = false;
  const speeds = { air: 34.3, water: 149.0, steel: 520.0 }; 
  let particles = [];

  function initParticles() {
    particles = [];
    particles.push({ bx: 70, by: 0, r: 70, angle: 0, isTarget: true });

    for(let i = 0; i < 400; i++) {
      let r = Math.random() * 130 + 15;
      let angle = Math.random() * Math.PI * 2;
      particles.push({
        bx: Math.cos(angle) * r,
        by: Math.sin(angle) * r,
        r: r,
        angle: angle,
        isTarget: false
      });
    }
  }

  // Tab 3
  const rngTemp = document.getElementById('rng-temp');
  const valTemp = document.getElementById('val-temp');

  // 通用安全繪製圓角矩形
  function drawRoundRect(c, x, y, w, h, r, color) {
    c.save();
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.fill();
    c.restore();
  }

  function initCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = V_WIDTH * dpr;
    canvas.height = V_HEIGHT * dpr;
    ctx.scale(dpr, dpr);
    
    if (currentTab === 'tab1') updateTab1Stats();
    else if (currentTab === 'tab3') updateTab3Stats();
  }

  // ==== TAB 1: 靜態推導 與 測驗 ====
  function drawStaticArrow(x1, x2, y, color, label) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1+10, y-6); ctx.lineTo(x1+10, y+6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2-10, y-6); ctx.lineTo(x2-10, y+6); ctx.fill();
    ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, (x1+x2)/2, y - 12);
    ctx.restore();
  }

  function updateTab1Stats() {
    if(currentTab !== 'tab1') return;
    const f = parseInt(rngFreq.value);
    const lam = parseInt(rngWave.value);
    const v = f * lam;

    valFreq.textContent = `${f} Hz`;
    valWave.textContent = `${lam} cm`;
    
    document.getElementById('stat1').innerHTML = tr(
        `1 秒內產生了 <b style="color:var(--chalk-teal);">${f} 個波</b>`,
        `${f} waves generated in <b style="color:var(--chalk-teal);">1 sec</b>`
    );
    document.getElementById('stat2').innerHTML = tr(
        `每個波長為 <b style="color:var(--chalk-coral);">${lam} cm</b>`,
        `Each wavelength is <b style="color:var(--chalk-coral);">${lam} cm</b>`
    );
    document.getElementById('stat3').innerHTML = tr(
        `所以波速 v = <b style="color:var(--chalk-yellow); font-family:monospace;">${v} cm/s</b>`,
        `So wave speed v = <b style="color:var(--chalk-yellow); font-family:monospace;">${v} cm/s</b>`
    );

    renderTab1Static(f, lam);
  }

  function renderTab1Static(f, lam) {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    const cy = 180;
    const amp = 60;
    
    const boxStart = 100;
    const boxEnd = 900;
    const waveVisualLength = (boxEnd - boxStart) / f;

    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(boxStart, cy); ctx.lineTo(boxEnd + 20, cy); ctx.stroke();
    
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(boxStart, 40); ctx.lineTo(boxStart, V_HEIGHT - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(boxEnd, 40); ctx.lineTo(boxEnd, V_HEIGHT - 30); ctx.stroke();
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(tr("【 經 過 1 秒 鐘 的 距 離 】", "【 Distance traveled in 1 sec 】"), (boxStart + boxEnd)/2, 35);

    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for(let x = boxStart; x <= boxEnd; x += 2) {
      const progress = (x - boxStart) / (boxEnd - boxStart);
      const y = cy - Math.sin(progress * f * Math.PI * 2) * amp;
      if (x === boxStart) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    drawStaticArrow(boxStart, boxStart + waveVisualLength, cy + amp + 30, "#ff8040", tr(`1個波長 (λ) = ${lam} cm`, `1 Wavelength (λ) = ${lam} cm`));
    drawStaticArrow(boxStart, boxEnd, cy + amp + 80, "#33cc99", tr(`波速 (v) = 共 ${f} 個波 × ${lam} cm = ${f*lam} cm/s`, `Speed (v) = ${f} waves × ${lam} cm = ${f*lam} cm/s`));
  }

      // ==== TAB 2: 介質賽跑 與 空氣分子振動 ====
  function startRace() {
    if(!isRacing) {
      isRacing = true;
      raceProgress = { air: 0, water: 0, steel: 0 };
    }
  }
  function resetRace() {
    isRacing = false;
    raceProgress = { air: 0, water: 0, steel: 0 };
  }

  function drawTrack(y, label, progress, color, speedText) {
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(650, y); ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(label, 130, y + 6);
    
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "18px 'Courier New', Courier, monospace";
    ctx.fillText(speedText, 130, y + 26);

    const x = 150 + progress;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.fill();
    
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 20, -Math.PI/4, Math.PI/4); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 30, -Math.PI/4, Math.PI/4); ctx.stroke();
  }

  function animateTab2() {
    if(currentTab !== 'tab2') return;
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    frameCounter++;

    const target = 650 - 150;
    if(isRacing) {
      if(raceProgress.steel < target) raceProgress.steel += speeds.steel * 0.04;
      if(raceProgress.water < target) raceProgress.water += speeds.water * 0.04;
      if(raceProgress.air < target) raceProgress.air += speeds.air * 0.04;
      
      if(raceProgress.steel > target) raceProgress.steel = target;
      if(raceProgress.water > target) raceProgress.water = target;
      if(raceProgress.air > target) raceProgress.air = target;
    }

    drawTrack(100, tr("氣體 (空氣)", "Gas (Air)"), raceProgress.air, "#ffe066", "343 m/s");
    drawTrack(200, tr("液體 (水)", "Liquid (Water)"), raceProgress.water, "#4dd2ff", "1490 m/s");
    drawTrack(300, tr("固體 (鋼)", "Solid (Steel)"), raceProgress.steel, "#ff8040", "5200 m/s");

    ctx.fillStyle = "#33cc99";
    ctx.font = "bold 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(tr("終點", "Finish"), 650, 45);
    ctx.strokeStyle = "#33cc99";
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(650, 55); ctx.lineTo(650, V_HEIGHT - 30); ctx.stroke();
    ctx.setLineDash([]);

    const cx = 850, cy = 180;
    
    ctx.fillStyle = "#ffe066";
    ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    ctx.fillText(tr("縱波模擬 (分子推擠)", "Longitudinal Anim"), cx, 45);

    ctx.save();
    
    let waveSpeed = 0.8;
    let waveFreq = 0.12;
    let maxAmplitude = 8;

    particles.forEach(p => {
      let phase = (p.r - frameCounter * waveSpeed) * waveFreq;
      let displacement = Math.sin(phase) * maxAmplitude;
      
      let damp = Math.min((p.r - 10) / 20, 1);
      if (damp < 0) damp = 0;

      let currentX = cx + p.bx + Math.cos(p.angle) * displacement * damp;
      let currentY = cy + p.by + Math.sin(p.angle) * displacement * damp;

      if (p.isTarget) {
        ctx.fillStyle = "#ff8040"; 
        ctx.beginPath(); ctx.arc(currentX, currentY, 8, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(77, 210, 255, 0.7)";
        ctx.beginPath(); ctx.arc(currentX, currentY, 3, 0, Math.PI*2); ctx.fill();
      }
    });

    const vibrate = Math.sin(frameCounter * 0.4) * 2;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    
    ctx.beginPath();
    ctx.moveTo(cx, cy + 25); ctx.lineTo(cx, cy + 5);
    ctx.moveTo(cx - 10 - vibrate, cy - 20);
    ctx.lineTo(cx - 10, cy + 5);
    ctx.lineTo(cx + 10, cy + 5);
    ctx.lineTo(cx + 10 + vibrate, cy - 20);
    ctx.stroke();

    ctx.restore();

    aniFrame = requestAnimationFrame(animateTab2);
  }

  // ==== TAB 3: 溫度與測驗 ====
  function updateTab3Stats() {
    if(currentTab !== 'tab3') return;
    const t = parseInt(rngTemp.value);
    valTemp.textContent = `${t} °C`;
    
    renderTab3Static(t);
  }

  function renderTab3Static(t) {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    const v = 331 + 0.6 * t;
    
    function drawCenteredSegments(segments, y, defaultFont) {
      ctx.save();
      let totalWidth = 0;
      segments.forEach(seg => {
        ctx.font = seg.font || defaultFont;
        seg.width = ctx.measureText(seg.text).width;
        totalWidth += seg.width;
      });
      
      let currentX = (V_WIDTH - totalWidth) / 2;
      segments.forEach(seg => {
        ctx.font = seg.font || defaultFont;
        ctx.fillStyle = seg.color;
        ctx.textAlign = "left";
        ctx.fillText(seg.text, currentX, y);
        currentX += seg.width;
      });
      ctx.restore();
    }

    // 1. 當前氣溫標示
    const topFont = "bold 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    drawCenteredSegments([
      { text: tr("當前氣溫：", "Current Temp: "), color: "#ffffff" },
      { text: `${t}`, color: "#e64dff", font: "bold 32px 'Courier New', Courier, monospace" },
      { text: " °C", color: "#ffffff" }
    ], 70, topFont);
    
    // 2. 溫度計
    drawRoundRect(ctx, V_WIDTH/2 - 180, 100, 360, 60, 30, "rgba(255,255,255,0.2)");
    const fillWidth = 40 + (t / 40) * 310;
    drawRoundRect(ctx, V_WIDTH/2 - 175, 105, fillWidth, 50, 25, "#ff8040");
    
    // 3. 公式主角化
    ctx.save();
    const eqFont = "bold 44px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif";
    const monoFont = "bold 44px 'Courier New', Courier, monospace";
    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    
    drawCenteredSegments([
      { text: tr("計算聲速：", "Calc Speed: "), color: "#ffe066" },
      { text: "v = 331 + 0.6 × ", color: "#ffe066", font: monoFont },
      { text: `${t}`, color: "#e64dff", font: monoFont },
      { text: ` = ${v.toFixed(1)} m/s`, color: "#ffe066", font: monoFont }
    ], 260, eqFont);
    ctx.restore();
  }

    // ==========================================
  // 分頁切換與 UI 動態重建
  // ==========================================
  function switchTab(tab) {
    currentTab = tab;
    cancelAnimationFrame(aniFrame); // 🚨 防暴衝
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
    
    document.getElementById('controls-tab1').style.display = 'none';
    document.getElementById('controls-tab2').style.display = 'none';
    document.getElementById('controls-tab3').style.display = 'none';
    
    document.getElementById('quiz-section-tab1').style.display = 'none';
    document.getElementById('quiz-section-tab3').style.display = 'none';
    
    updateHookBox();
    renderUIForTab();
  }

  function renderUIForTab() {
    cancelAnimationFrame(aniFrame); // 🚨 徹底消滅加速 Bug

    const title = document.getElementById('panel-title');
    const badge = document.getElementById('panel-badge');
    const note = document.getElementById('note-text');
    const stats = document.getElementById('stats-box');

    if (currentTab === 'tab1') {
      document.getElementById('controls-tab1').style.display = 'flex';
      document.getElementById('quiz-section-tab1').style.display = 'block';
      title.textContent = tr('一、波速的定義 (一秒鐘走多遠)', 'I. Def of Wave Speed (Dist per sec)');
      badge.textContent = tr('靜態波形推導', 'Static Waveform Derivation');
      badge.style.background = '#ffe066';
      stats.style.display = 'flex';
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>波速 (v) 的定義：</b>波形每秒鐘前進的距離。<br>
        • <b>公式推導：</b>因為 1 秒內會產生 f 個波 (頻率)，而每個波的長度是 λ (波長)，所以全部排在一起的總長度就是 f × λ。<br>
        • 結論：<b style="font-family:monospace;">波速 (v) = 頻率 (f) × 波長 (λ)</b>。波速只和「介質」有關（相同的介質波速相同）！`,
        
        `💡 <b>Blackboard Notes:</b><br>
        • <b>Def of Wave Speed (v):</b> Distance a wave travels in 1 second.<br>
        • <b>Derivation:</b> Since f waves (Frequency) are made in 1 sec, and each wave is λ (Wavelength) long, the total length is f × λ.<br>
        • Conclusion: <b style="font-family:monospace;">Speed (v) = Freq (f) × Wavelength (λ)</b>. Speed depends ONLY on the "Medium" (same medium, same speed)!`
      );
      
      updateTab1Stats();
    } 
    else if (currentTab === 'tab2') {
      document.getElementById('controls-tab2').style.display = 'flex';
      title.textContent = tr('二、聲波的傳播與介質', 'II. Sound Propagation & Medium');
      badge.textContent = tr('介質賽跑與分子振動', 'Medium Race & Vibration');
      badge.style.background = '#4dd2ff';
      stats.style.display = 'none';
      
      resetRace();
      initParticles();
      frameCounter = 0;
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • 聲音是由於物體快速振動所產生的，是一種<b class="highlight-coral">縱波(疏密波)</b>（請觀察右方橘色粒子，波往外傳遞，但介質只在原地平行振動！）。<br>
        • 聲音傳遞需要物質幫忙，該物質稱為介質。<span class="highlight-pink">若處於真空狀態，則無法傳播。</span><br>
        • 介質排列地愈緊密，則速度愈快。<br>
        • 聲音的傳播速度：<b class="highlight-teal">固體 > 液體 > 氣體</b>。例如：鋼(5200m/s) > 水(1490m/s) > 空氣(343m/s)。`,

        `💡 <b>Blackboard Notes:</b><br>
        • Sound is produced by rapid vibration and is a <b class="highlight-coral">Longitudinal Wave</b> (Observe the orange particle: wave moves out, but medium vibrates in place!).<br>
        • Sound needs matter to travel, called a medium. <span class="highlight-pink">It CANNOT travel in a vacuum.</span><br>
        • The denser the medium particles, the faster the speed.<br>
        • Sound speed: <b class="highlight-teal">Solid > Liquid > Gas</b>. Ex: Steel (5200m/s) > Water (1490m/s) > Air (343m/s).`
      );
      
      animateTab2();
    }
    else if (currentTab === 'tab3') {
      document.getElementById('controls-tab3').style.display = 'flex';
      document.getElementById('quiz-section-tab3').style.display = 'block';
      title.textContent = tr('三、影響聲波的因素與計算', 'III. Factors of Sound Speed & Calc');
      badge.textContent = tr('溫度與濕度', 'Temp & Humidity');
      badge.style.background = '#33cc99';
      stats.style.display = 'none';
      
      note.innerHTML = tr(
        `💡 <b>黑板重點：</b><br>
        • <b>溫度：</b>溫度愈高，聲速愈快。公式：<b style="font-family:monospace; color:var(--chalk-teal);">v = 331 + 0.6 × t</b>。<br>
        • <b>濕度：</b>濕度愈大波速愈快。<br>
        • <b>風向：</b>順風會加速聲音傳遞。<br>
        • <b>注意：</b>聲音的大小(響度)和高低(音調) <b class="highlight-pink">不會</b> 影響聲音的傳播速度喔！`,

        `💡 <b>Blackboard Notes:</b><br>
        • <b>Temperature:</b> Higher temp, faster speed. Formula: <b style="font-family:monospace; color:var(--chalk-teal);">v = 331 + 0.6 × t</b>.<br>
        • <b>Humidity:</b> Higher humidity, faster speed.<br>
        • <b>Wind:</b> Tailwind speeds up propagation.<br>
        • <b>Note:</b> Loudness and Pitch <b class="highlight-pink">DO NOT</b> affect the speed of sound!`
      );
      
      updateTab3Stats();
    }
  }

  // 綁定事件
  ['input', 'change'].forEach(evt => {
    rngFreq.addEventListener(evt, updateTab1Stats);
    rngWave.addEventListener(evt, updateTab1Stats);
    rngTemp.addEventListener(evt, updateTab3Stats);
  });

  // Init
  window.onload = function() {
      initCanvas();
      setLang('zh'); // Initialize Language and UI, renderUIForTab kills ghost loops.
  };
  window.addEventListener('resize', initCanvas);
</script>
<script>
/* ==================================================================
   老師講解／學生操作 雙模式（外層加法；上面的原有程式一行都沒改）
   ・學生操作＝原本的互動（頻率、波長、溫度滑桿，發射／重置鈕）。
   ・老師講解＝按下去就自動從頭連續播：每個分頁依序走完它的步驟（直接呼叫頁面原本的滑桿、startRace／resetRace、updateTab1Stats／updateTab3Stats），
     可暫停、從頭重播、點步驟編號跳到那一步。切回學生操作時，畫面還原成「剛按下老師講解」那一刻的樣子。
   ・只借用原本的全域變數與函式，不碰任何繪圖座標與物理。
   ================================================================== */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const L = (zh, en) => ({ zh: zh, en: en });
  const say = o => (currentLang === 'en' ? o.en : o.zh);

  // 設定滑桿並呼叫頁面原本的更新函式（與學生拖動滑桿時做的事完全相同）
  const setT1 = (f, lam) => { rngFreq.value = String(f); rngWave.value = String(lam); updateTab1Stats(); };
  const setT3 = t => { rngTemp.value = String(t); updateTab3Stats(); };
  const race = () => { resetRace(); startRace(); };
  const raceEnd = () => { isRacing = true; raceProgress = { air: 500, water: 500, steel: 500 }; };

  const STEPS = {
    tab1: [
      { ms: 9000, label: L('每秒 3 個波', '3 waves/sec'),
        note: L('頻率 3 赫茲、波長 4 公分：1 秒內走了 3 × 4 = 12 公分，波速 12 cm/s。', 'Frequency 3 Hz, wavelength 4 cm: in 1 s the wave covers 3 × 4 = 12 cm, so v = 12 cm/s.'),
        go() { setT1(3, 4); } },
      { ms: 8000, label: L('頻率加快', 'Higher f'),
        note: L('頻率調到 5 赫茲：1 秒內擠進 5 個波，總長度變成 5 × 4 = 20 公分。', 'Frequency 5 Hz: 5 waves in 1 s, total length 5 × 4 = 20 cm.'),
        go() { setT1(5, 4); } },
      { ms: 8000, label: L('波長變長', 'Longer λ'),
        note: L('波長調到 8 公分：3 個波，每個 8 公分，1 秒走 3 × 8 = 24 公分。', 'Wavelength 8 cm: 3 waves of 8 cm each, 3 × 8 = 24 cm in 1 s.'),
        go() { setT1(3, 8); } },
      { ms: 8000, label: L('兩個都變', 'Both change'),
        note: L('頻率 5、波長 8：v = 5 × 8 = 40 cm/s。公式 v = f × λ 把三件事綁在一起。', 'f = 5, λ = 8: v = 5 × 8 = 40 cm/s. The formula v = f × λ ties the three together.'),
        go() { setT1(5, 8); } }
    ],
    tab2: [
      { ms: 8000, label: L('分子振動', 'Particles'),
        note: L('右邊是縱波模擬：波往外傳，但橘色分子只在原地來回振動。', 'Right side: a longitudinal wave. The wave spreads out, but the orange particle only vibrates in place.'),
        go() { resetRace(); } },
      { ms: 10000, label: L('發射聲波', 'Fire!'),
        note: L('三個聲波同時出發：鋼最先到，水第二，空氣最慢。', 'Three sound waves start together: steel arrives first, water second, air last.'),
        go() { race(); } },
      { ms: 8000, label: L('比較結果', 'Result'),
        note: L('固體 > 液體 > 氣體：鋼 5200、水 1490、空氣 343 公尺／秒。', 'Solid > liquid > gas: steel 5200, water 1490, air 343 m/s.'),
        go() { raceEnd(); } }
    ],
    tab3: [
      { ms: 9000, label: L('15°C', '15°C'),
        note: L('氣溫 15°C：v = 331 + 0.6 × 15 = 340 公尺／秒。', 'At 15°C: v = 331 + 0.6 × 15 = 340 m/s.'),
        go() { setT3(15); } },
      { ms: 7000, label: L('0°C', '0°C'),
        note: L('氣溫降到 0°C：v = 331 公尺／秒，聲音變慢了。', 'Down to 0°C: v = 331 m/s. Sound is slower.'),
        go() { setT3(0); } },
      { ms: 7000, label: L('40°C', '40°C'),
        note: L('氣溫升到 40°C：v = 331 + 0.6 × 40 = 355 公尺／秒，聲音變快了。', 'Up to 40°C: v = 331 + 0.6 × 40 = 355 m/s. Sound is faster.'),
        go() { setT3(40); } },
      { ms: 8000, label: L('25°C', '25°C'),
        note: L('每升高 1°C，聲速增加 0.6 公尺／秒；25°C 時是 346 公尺／秒。', 'Every +1°C adds 0.6 m/s; at 25°C it is 346 m/s.'),
        go() { setT3(25); } }
    ]
  };
  const totalMs = tab => STEPS[tab].reduce((s, x) => s + x.ms, 0);

  const T = { on: false, tab: null, si: 0, elapsed: 0, paused: false, done: false, timer: 0, last: 0 };
  let snap = null;

  function fillBar() {
    const f = $('teach-fill'); if (!f || !T.tab) return;
    const st = STEPS[T.tab]; let before = 0;
    for (let i = 0; i < T.si; i++) before += st[i].ms;
    const cur = T.done ? st[T.si].ms : Math.min(T.elapsed, st[T.si].ms);
    f.style.width = (100 * (before + cur) / totalMs(T.tab)) + '%';
  }
  function paintBtns() {
    const p = $('teach-pause'), r = $('teach-replay'); if (!p || !r) return;
    p.textContent = T.paused ? tr('▶ 繼續', '▶ Resume') : tr('⏸ 暫停', '⏸ Pause');
    p.disabled = T.done;
    r.textContent = tr('↺ 從頭重播', '↺ Replay');
    r.classList.toggle('hot', T.done);
  }
  function paintChips() {
    const box = $('teach-chips'); if (!box || !T.tab) return;
    box.innerHTML = '';
    STEPS[T.tab].forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'teach-chip' + (i === T.si ? ' on' : (i < T.si ? ' past' : ''));
      b.innerHTML = '<span class="teach-n">' + (i + 1) + '</span>' + say(s.label).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      b.addEventListener('click', () => { if (T.done) T.paused = false; goStep(i); });
      box.appendChild(b);
    });
    const n = $('teach-note'); if (n) n.textContent = say(STEPS[T.tab][T.si].note);
  }
  function setPaused(v) {
    T.paused = !!v;
    paintBtns();
  }
  function goStep(i) {
    T.si = i; T.elapsed = 0; T.done = false;
    STEPS[T.tab][i].go();
    paintChips(); paintBtns(); fillBar();
  }
  function finish() { T.done = true; fillBar(); paintBtns(); }
  function enterTab(tab) {
    if (!STEPS[tab]) return;
    T.tab = tab; T.paused = false; T.done = false;
    goStep(0);
    const s = $('stage-container');
    if (s && s.scrollIntoView) { try { s.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { s.scrollIntoView(); } }
  }
  function tick() {
    const now = performance.now(), dt = now - T.last; T.last = now;
    if (!T.on || T.paused || T.done || !T.tab) return;
    const arr = STEPS[T.tab]; T.elapsed += dt;
    if (T.elapsed >= arr[T.si].ms) { if (T.si + 1 < arr.length) goStep(T.si + 1); else finish(); }
    fillBar();
  }

  $('teach-pause').addEventListener('click', () => { if (!T.done) setPaused(!T.paused); });
  $('teach-replay').addEventListener('click', () => { T.paused = false; goStep(0); });

  // 切分頁：老師模式下從該分頁的第 1 步重新開始；學生模式完全照原本
  const _switchTab = window.switchTab;
  window.switchTab = function (tab) { _switchTab.apply(this, arguments); if (T.on) enterTab(tab); };
  // 切語言：原本的 setLang 會把畫布重畫；老師模式再補畫自己的按鈕與提示
  const _setLang = window.setLang;
  window.setLang = function () {
    _setLang.apply(this, arguments);
    if (T.on && T.tab) { paintChips(); paintBtns(); }
  };

  window.setMode = function (m) {
    const teacher = m === 'teacher';
    if (teacher === T.on) return;
    $('mode-student').classList.toggle('active', !teacher); $('mode-student').setAttribute('aria-pressed', String(!teacher));
    $('mode-teacher').classList.toggle('active', teacher); $('mode-teacher').setAttribute('aria-pressed', String(teacher));
    document.body.classList.toggle('mode-teacher', teacher);
    if (teacher) {
      snap = { tab: currentTab, f: rngFreq.value, lam: rngWave.value, temp: rngTemp.value };
      T.on = true; T.last = performance.now();
      T.timer = setInterval(tick, 100);
      enterTab(currentTab);
    } else {
      T.on = false; clearInterval(T.timer); T.timer = 0; T.tab = null;
      if (snap) {                                    // 還原成「剛按下老師講解」那一刻
        rngFreq.value = snap.f; rngWave.value = snap.lam; rngTemp.value = snap.temp;
        if (currentTab !== snap.tab) window.switchTab(snap.tab);
        else renderUIForTab();                       // 同一分頁：重畫（賽跑會歸零、滑桿讀數回到原值）
        snap = null;
      }
    }
  };
})();
</script>
