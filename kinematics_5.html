<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-zh="等加速度運動 (下)｜公式解、自由落體與進階考題" data-en="Uniform Accel. (2) | Formulas, Free Fall & Advanced Quiz">等加速度運動 (下)｜公式解、自由落體與進階考題</title>

  <!-- 強制注入 MathJax 解析設定 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --a-color: #4cd964;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
      font-size: 20px;
      padding-top: 70px;
      overflow-x: hidden;
    }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed; top: 16px; right: 20px; z-index: 9999; display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 6px 10px; border: 2px solid var(--x-color); border-radius: 12px; background: rgba(21, 48, 42, 0.95); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(95, 176, 255, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lang-label { color: var(--x-color); font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; user-select: none; margin-left: 4px; }
    .lang-options { display: flex; flex-direction: row; gap: 4px; }
    .lang-pill { padding: 6px 12px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 6px; background: transparent; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation; }
    .lang-pill.active { background: var(--x-color) !important; color: var(--board-dark) !important; border-color: var(--x-color) !important; box-shadow: 0 0 10px rgba(95, 176, 255, 0.5); }

    .wrap { max-width: 1080px; margin: 0 auto; width: 100%; }

    header { text-align: center; margin-bottom: 24px; padding: 0 10px; }
    /* 🌟 修復英文標題超出格子的問題：使用更彈性的字體設定 */
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: clamp(12px, 2vw, 16px); letter-spacing: 0.1em; color: var(--chalk-dim); text-transform: uppercase; font-weight: bold; word-wrap: break-word; line-height: 1.4; margin-bottom: 8px; }
    h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 900; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); color: var(--chalk-yellow); }
    header p { color: var(--chalk-dim); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: clamp(16px, 2.5vw, 20px); font-weight: bold; }

    .board {
      background: var(--board);
      border: 8px solid var(--frame);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-size: 26px; margin: 0 0 16px; font-weight: 900;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 20px; font-weight: 900;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.25);
      padding: 16px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: manipulation;
    }
    .mode-switch button span.sub { font-size: 16px; font-weight: bold; opacity: 0.8; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.5); color: var(--chalk); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow); border-style: solid;
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.9; font-weight: 900; }

    /* 🌟 教學 Hook 區塊 */
    .hook-box { background: rgba(95, 176, 255, 0.08); border-left: 6px solid var(--x-color); border-radius: 0 8px 8px 0; padding: 16px 20px; font-size: 20px; line-height: 1.6; color: var(--chalk); font-weight: bold; }

    /* 🌟 控制面板大整合 */
    .sim-controls-wrapper { width: 100%; display: flex; flex-direction: column; gap: 16px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin-top: 16px; }
    .sim-controls-wrapper .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; background: transparent; padding: 0; margin: 0; border: none; }
    .sim-controls-wrapper .presets { margin-top: 0; padding-top: 16px; border-top: 1px dashed rgba(255,255,255,0.1); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sim-controls-wrapper .playbar { display: flex; align-items: center; gap: 16px; margin-top: 8px; }

    .control label { display: flex; justify-content: space-between; font-size: 18px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 900; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 8px; background: transparent; cursor: pointer; padding: 10px 0; touch-action: manipulation; }

    .presets span { font-size: 18px; color: var(--chalk-dim); font-weight: bold; margin-right: 4px; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 2px dashed var(--chalk-dim);
      color: var(--chalk); padding: 8px 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all .15s; touch-action: manipulation;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    #playBtn {
      background: var(--chalk-yellow); color: var(--board-dark); border: none; font-weight: 900;
      padding: 12px 24px; border-radius: 8px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 20px;
      transition: all .15s; box-shadow: 0 4px 12px rgba(242, 214, 117, 0.3); min-width: 140px; touch-action: manipulation; flex-shrink: 0;
    }
    #playBtn:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(242, 214, 117, 0.4); }
    .progress-track { flex: 1; height: 10px; background: rgba(242, 236, 217, 0.15); border-radius: 5px; position: relative; overflow: hidden; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--chalk-yellow); border-radius: 5px; width: 0%; }

    .dual-view { display: flex; gap: 20px; margin: 16px 0 0; align-items: stretch; }
    .graph-card { min-width: 0; background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;}
    .visual-card { min-width: 320px; /* 稍微放寬，避免字體被擠壓 */ background: rgba(0, 0, 0, 0.28); border: 2px solid rgba(242, 236, 217, 0.12); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }

    .dual-view.ratio-3-1 .graph-card { flex: 3; }
    .dual-view.ratio-3-1 .visual-card { flex: 1; }

    .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 18px; font-family: 'Noto Sans TC', sans-serif; font-weight: bold; color: var(--chalk-dim); flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 16px; height: 4px; display: inline-block; border-radius: 2px; }

    /* SVG 等比縮放 */
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    #combinedSvg { width: 100%; aspect-ratio: auto; min-height: 250px; }
    #visualSvg { width: 100%; aspect-ratio: auto; min-height: 250px; }

    .axis-line { stroke: var(--chalk-dim); stroke-width: 2; opacity: 0.8; }
    .grid-line { stroke: var(--chalk-dim); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.3; }
    .curve-x { fill: none; stroke: var(--x-color); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .curve-v { fill: none; stroke: var(--v-color); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .fill-rect { fill: var(--x-color); opacity: 0.18; }
    .fill-tri { fill: var(--chalk-yellow); opacity: 0.25; }
    .dot-x { fill: var(--x-color); filter: drop-shadow(0 0 4px rgba(95, 176, 255, 0.9)); }
    .dot-v { fill: var(--v-color); filter: drop-shadow(0 0 4px rgba(239, 106, 90, 0.9)); }

    /* 🌟 修復：解除寬度限制，讓邊框能完美包覆文字 */
    .phase-badge {
      font-size: clamp(16px, 2vw, 20px); font-weight: 900; padding: 10px 16px; border-radius: 8px; background: rgba(255, 255, 255, 0.1);
      color: var(--chalk); text-align: center; margin-bottom: 16px; white-space: nowrap; border: 2px solid transparent; display: inline-block; width: auto; max-width: 100%; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
    }
    .phase-badge.blue { background: rgba(95, 176, 255, 0.15); color: var(--x-color); border-color: var(--x-color); }
    .phase-badge.yellow { background: rgba(242, 214, 117, 0.15); color: var(--chalk-yellow); border-color: var(--chalk-yellow); }
    .phase-badge.red { background: rgba(239, 106, 90, 0.15); color: var(--v-color); border-color: var(--v-color); }
    .phase-badge.green { background: rgba(76, 217, 100, 0.15); color: var(--a-color); border-color: var(--a-color); }

    .guide-line { stroke: var(--chalk-yellow); stroke-width: 2; stroke-dasharray: 5 5; opacity: 0.8; fill: none; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 16px 12px; text-align: center; border: 1px dashed rgba(255, 255, 255, 0.2); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-weight: bold; font-size: 18px; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: var(--chalk-yellow); font-weight: 900; margin-top: 6px; }

    .explain-box { margin-top: 24px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 10px 10px 0; padding: 20px 24px; }
    .explain-box h3 { font-family: 'Noto Sans TC', sans-serif; color: var(--chalk-yellow); margin: 0 0 12px; font-size: 22px; font-weight: 900; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); font-weight: bold; }

    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; }

    .def-card { background: rgba(239, 106, 90, 0.15); border: 2px solid rgba(239, 106, 90, 0.4); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
    .def-card h4 { margin: 0 0 8px; color: #ff9485; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .def-card ul { margin: 0; padding-left: 24px; font-size: 20px; line-height: 1.8; color: var(--chalk); font-weight: bold; }
    .def-card ul li span { color: var(--chalk-yellow); font-weight: 900; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 18px; margin-top: 32px; font-family: 'JetBrains Mono', monospace; font-weight: bold; opacity: 0.8; }

    @media (max-width: 960px) {
      .dual-view { flex-direction: column; }
      .visual-card { width: 100%; aspect-ratio: auto; min-height: 340px; }
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
    }
  </style>
</head>
<body>
  <!-- 🌟 右上角橫向懸浮雙語切換器 -->
  <div class="floating-lang-container">
    <span class="lang-label">Language</span>
    <div class="lang-options">
      <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
      <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="eyebrow">Taiwan Middle School Science · Kinematics (Part 2)</div>
      <h1 data-zh="等加速度運動（下）：公式解、自由落體與進階考題" data-en="Uniform Accel. (2): Formulas, Free Fall & Advanced Quiz">等加速度運動（下）：公式解、自由落體與進階考題</h1>
      <p data-zh="專為國中會考量身打造！直觀演示 v-t 圖切分面積推導公式解、嚴格對比抽真空與大氣阻力下落，並徹底破解上拋最高點、火箭升空與煞車平方定律三大魔王題型！" data-en="Tailored for exams! Visually derive formulas via v-t area splitting, compare vacuum vs air resistance, and crack the ultimate traps: projectile peak, rocket launch, and braking square law!">專為國中會考量身打造！直觀演示 v-t 圖切分面積推導公式解、嚴格對比抽真空與大氣阻力下落，並徹底破解上拋最高點、火箭升空與煞車平方定律三大魔王題型！</p>
    </header>

    <div class="board">
      <h2 data-zh="選擇模組" data-en="Select Module">選擇模組</h2>
      <div class="mode-switch">
        <button class="active" data-mode="area">
          <span data-zh="📊 公式解與圖形面積" data-en="📊 Formula & Graph Area">📊 公式解與圖形面積</span>
          <span class="sub" data-zh="純 v-t 圖幾何位移剖析" data-en="v-t geometric displacement">純 v-t 圖幾何位移剖析</span>
        </button>
        <button data-mode="freefall">
          <span data-zh="🪨 自由落體與真空管" data-en="🪨 Free Fall & Vacuum">🪨 自由落體與真空管</span>
          <span class="sub" data-zh="嚴格定義與大氣阻力比對" data-en="Strict definition & air drag">嚴格定義與大氣阻力比對</span>
        </button>
        <button data-mode="special">
          <span data-zh="🚀 特殊與進階考題" data-en="🚀 Special & Adv. Quiz">🚀 特殊與進階考題</span>
          <span class="sub" data-zh="上拋、火箭與煞車問題" data-en="Throw, Rocket & Braking">上拋、火箭與煞車問題</span>
        </button>
      </div>

      <!-- 🌟 Hook 動態引導區 -->
      <div class="hook-box" id="hookBox">
          <!-- JS 動態生成 -->
      </div>
    </div>

    <div class="board">
      <h2 data-zh="物理動態演示" data-en="Dynamic Physics & Graphs">物理動態演示</h2>
      
      <!-- 🌟 圖表與動畫置頂，第一時間抓住目光 -->
      <div class="dual-view ratio-3-1" id="dualViewContainer">
        <div class="graph-card">
          <div class="legend" id="graphLegend">
            <span id="legendX"><i style="background:var(--x-color)"></i><span data-zh="藍線：x-t（位置/位移）" data-en="Blue: x-t (Pos/Disp)">藍線：x-t（位置/位移）</span></span>
            <span id="legendV"><i style="background:var(--v-color)"></i><span data-zh="紅線：v-t（速度）" data-en="Red: v-t (Velocity)">紅線：v-t（速度）</span></span>
          </div>
          <svg id="combinedSvg"></svg>
        </div>

        <div class="visual-card">
          <div class="phase-badge blue" id="phaseBadge" data-zh="準備就緒" data-en="Ready">準備就緒</div>
          <svg id="visualSvg"></svg>
        </div>
      </div>

      <!-- 🌟 將控制面板統整移到底部 -->
      <div id="simulationControls" class="sim-controls-wrapper">
        <div class="controls" id="controlsBox"></div>
        <div class="presets" id="presetsBox"></div>
        <div class="playbar" id="playbarContainer">
          <button id="playBtn" data-zh="▶ 開始實驗" data-en="▶ Start Lab">▶ 開始實驗</button>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2 data-zh="課堂重點與概念剖析" data-en="Key Concepts & Analysis">課堂重點與概念剖析</h2>
      <div id="extraDefBox"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer data-zh="國中理化 · 等加速度運動（下篇） · 視覺化互動教學教材" data-en="Junior High Science · Uniform Accel. (Part 2) · Interactive Teaching Material">國中理化 · 等加速度運動（下篇） · 視覺化互動教學教材</footer>
  </div>

  <script>
    (function() {
      let currentLang = 'zh';

      window.setLang = function(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';

        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.innerHTML = el.getAttribute(`data-${lang}`);
        });

        updateSimulation();
      };

      function tr(zh, en) {
        return currentLang === 'en' ? en : zh;
      }

      // 🌟 高質感車車繪製引擎 (用於煞車)
      function drawCoolCar(parent, x, y, color, isRightDir = true) {
        const carGroup = createSvgEl('g');
        const scale = 0.8;
        carGroup.setAttribute('transform', `translate(${x}, ${y}) scale(${isRightDir ? scale : -scale}, ${scale})`);
        
        carGroup.appendChild(createSvgEl('rect', { x: -16, y: -8, width: 36, height: 18, fill: 'rgba(0,0,0,0.4)', rx: 4 }));
        
        const wColor = '#1e293b';
        carGroup.appendChild(createSvgEl('rect', { x: -12, y: -12, width: 8, height: 4, fill: wColor, rx: 1 }));
        carGroup.appendChild(createSvgEl('rect', { x: 6, y: -12, width: 8, height: 4, fill: wColor, rx: 1 }));
        carGroup.appendChild(createSvgEl('rect', { x: -12, y: 10, width: 8, height: 4, fill: wColor, rx: 1 }));
        carGroup.appendChild(createSvgEl('rect', { x: 6, y: 10, width: 8, height: 4, fill: wColor, rx: 1 }));

        carGroup.appendChild(createSvgEl('rect', { x: -18, y: -10, width: 36, height: 22, fill: color, rx: 5 }));
        
        carGroup.appendChild(createSvgEl('rect', { x: 2, y: -6, width: 6, height: 14, fill: 'rgba(255,255,255,0.7)', rx: 1 }));
        carGroup.appendChild(createSvgEl('rect', { x: -14, y: -5, width: 3, height: 12, fill: 'rgba(255,255,255,0.4)', rx: 1 }));
        
        carGroup.appendChild(createSvgEl('circle', { cx: 16, cy: -6, r: 2, fill: '#fde047' }));
        carGroup.appendChild(createSvgEl('circle', { cx: 16, cy: 8, r: 2, fill: '#fde047' }));

        parent.appendChild(carGroup);
      }

      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const hookBox = document.getElementById('hookBox');
      const playBtn = document.getElementById('playBtn');
      const progressFill = document.getElementById('progressFill');
      const combinedSvg = document.getElementById('combinedSvg');
      const visualSvg = document.getElementById('visualSvg');
      const phaseBadge = document.getElementById('phaseBadge');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const extraDefBox = document.getElementById('extraDefBox');
      const legendX = document.getElementById('legendX');

      let currentMode = 'area';
      let animId = null;
      let animStartTime = null;
      let currentPhys = null;
      const ANIM_DURATION = 4000;

      const params = {
        area:     { v0: 6, a: 4.0, t: 5.0 },
        freefall: { h: 80, g: 9.8, air: 0 },
        special:  { sub: 'throw', v0: 25, g: 9.8, a_brake: 5.0 }
      };

      const hooks = {
        area: {
          zh: "🤔 <b>課堂思考：</b>如果不背位移公式 $\\Delta x = v_0 t + \\frac{1}{2} a t^2$，我們能不能從 v-t 圖的面積直接「切」出來？",
          en: "🤔 <b>Think:</b> Can we derive $\\Delta x = v_0 t + \\frac{1}{2} a t^2$ purely by slicing the area under the v-t graph?"
        },
        freefall: {
          zh: "🤔 <b>課堂思考：</b>為什麼日常生活中，羽毛總是落得比鐵球慢？如果把空氣抽乾淨，它們真的會同時落地嗎？",
          en: "🤔 <b>Think:</b> Why do feathers fall slower than iron balls in daily life? If we remove the air, will they hit the ground simultaneously?"
        },
        special: {
          zh: "🤔 <b>課堂思考：</b>上拋到達最高點時速度為零，那加速度也是零嗎？火箭燃料用盡的瞬間，真的是到達最高點嗎？",
          en: "🤔 <b>Think:</b> When a thrown object reaches the peak, velocity is zero, is acceleration zero too? Is the rocket at its peak the moment fuel runs out?"
        }
      };

      const SVG_NS = 'http://www.w3.org/2000/svg';

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) {
          for (let key in attrs) el.setAttribute(key, attrs[key]);
        }
        return el;
      }

      function addTextToSvg(parent, x, y, txt, anchor, color, size, weight='normal') {
        const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC, sans-serif' });
        t.textContent = txt;
        parent.appendChild(t);
      }

      function initUI() {
        hookBox.innerHTML = tr(hooks[currentMode].zh, hooks[currentMode].en);
        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, labelZh, labelEn, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${tr(labelZh, labelEn)} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            const newVal = parseFloat(e.target.value);
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            onChange(newVal);
            updateSimulation();
          });
        };

        if (m === 'area') {
          addSlider('v0', '初速度 v₀', 'Initial Vel v₀', 0, 15, 1, p.v0, 'm/s', v => p.v0 = v);
          addSlider('a', '等加速度 a', 'Acceleration a', 1.0, 6.0, 0.5, p.a, 'm/s²', v => p.a = v);
          addSlider('t', '觀察時間 t', 'Time t', 2.0, 10.0, 0.5, p.t, 's', v => p.t = v);
        } else if (m === 'freefall') {
          addSlider('h', '釋放高度 H', 'Drop Height H', 20, 200, 10, p.h, 'm', v => p.h = v);
          addSlider('g', '重力加速度 g', 'Gravity g', 1.6, 25.0, 0.2, p.g, 'm/s²', v => p.g = v);
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${tr('環境狀態', 'Environment')} <span class="val" id="val_air">${p.air ? tr('💨 大氣層 (有阻力)', '💨 Air (Drag)') : tr('🌌 抽真空 (無阻力)', '🌌 Vacuum (No Drag)')}</span></label>
            <div style="display:flex; gap:12px; margin-top:8px;">
              <button type="button" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--chalk-dim); background:${p.air === 0 ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.air === 0 ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:18px; touch-action: manipulation; transition: 0.2s;" onclick="setAir(0)">${tr('抽真空', 'Vacuum')}</button>
              <button type="button" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--chalk-dim); background:${p.air === 1 ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.air === 1 ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:18px; touch-action: manipulation; transition: 0.2s;" onclick="setAir(1)">${tr('有空氣', 'Air')}</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setAir = (val) => { p.air = val; renderControls(); updateSimulation(); };
        } else if (m === 'special') {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${tr('經典魔王題型', 'Classic Boss Quiz')} <span class="val">${p.sub === 'throw' ? tr('⚪ 鉛直上拋', '⚪ Throw Up') : (p.sub === 'rocket' ? tr('🚀 火箭升空', '🚀 Rocket Launch') : tr('🛑 緊急煞車', '🛑 Emerg. Braking'))}</span></label>
            <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;">
              <button type="button" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--chalk-dim); background:${p.sub === 'throw' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.sub === 'throw' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:18px; touch-action: manipulation; transition: 0.2s;" onclick="setSub('throw')">${tr('上拋', 'Throw')}</button>
              <button type="button" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--chalk-dim); background:${p.sub === 'rocket' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.sub === 'rocket' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:18px; touch-action: manipulation; transition: 0.2s;" onclick="setSub('rocket')">${tr('火箭', 'Rocket')}</button>
              <button type="button" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--chalk-dim); background:${p.sub === 'brake' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.sub === 'brake' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold; font-size:18px; touch-action: manipulation; transition: 0.2s;" onclick="setSub('brake')">${tr('煞車', 'Brake')}</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setSub = (val) => { p.sub = val; renderControls(); updateSimulation(); };

          if (p.sub === 'throw') {
            addSlider('v0', '上拋初速度 v₀', 'Init Vel v₀', 10, 40, 2, p.v0, 'm/s', v => p.v0 = v);
            addSlider('g', '重力加速度 g', 'Gravity g', 5.0, 15.0, 0.2, p.g, 'm/s²', v => p.g = v);
          } else if (p.sub === 'rocket') {
            addSlider('v0', '燃盡瞬間速度 v₁', 'Burnout Vel v₁', 50, 200, 10, p.v0, 'm/s', v => p.v0 = v);
            addSlider('g', '重力加速度 g', 'Gravity g', 5.0, 15.0, 0.2, p.g, 'm/s²', v => p.g = v);
          } else {
            addSlider('v0', '行駛初速度 v₀', 'Driving Vel v₀', 10, 40, 2, p.v0, 'm/s', v => p.v0 = v);
            addSlider('a_brake', '煞車減速度 a', 'Braking Decel a', 2.0, 10.0, 0.5, p.a_brake, 'm/s²', v => p.a_brake = v);
          }
        }
      }

      function renderPresets() {
        presetsBox.innerHTML = `<span>⚡ ${tr('快速情境：', 'Presets:')}</span>`;
        const m = currentMode;
        const addBtn = (labelZh, labelEn, action) => {
          const b = document.createElement('button');
          b.textContent = tr(labelZh, labelEn);
          b.onclick = () => { action(); renderControls(); updateSimulation(); };
          presetsBox.appendChild(b);
        };

        if (m === 'area') {
          addBtn('由靜止啟動 (純三角形)', 'Start from rest (Tri)', () => { params.area.v0 = 0; params.area.a = 4.0; params.area.t = 5.0; });
          addBtn('梯形面積 (矩形+三角形)', 'Trapezoid (Rect+Tri)', () => { params.area.v0 = 6; params.area.a = 3.0; params.area.t = 6.0; });
          addBtn('等速度運動 (純矩形 a=0)', 'Uniform Vel (Rect a=0)', () => { params.area.v0 = 12; params.area.a = 0.0; params.area.t = 5.0; });
        } else if (m === 'freefall') {
          addBtn('🌍 地球真空 (g=9.8)', '🌍 Earth Vacuum (g=9.8)', () => { params.freefall.g = 9.8; params.freefall.air = 0; });
          addBtn('📐 課本好算版 (g=10)', '📐 Textbook Math (g=10)', () => { params.freefall.g = 10.0; params.freefall.air = 0; });
        } else if (m === 'special') {
          if (params.special.sub === 'throw') addBtn('初速 29.4 m/s (滯空6秒)', 'v₀=29.4 (Hang 6s)', () => { params.special.v0 = 29.4; params.special.g = 9.8; });
          else if (params.special.sub === 'rocket') addBtn('標準火箭衝刺', 'Standard Rocket', () => { params.special.v0 = 100; params.special.g = 9.8; });
          else addBtn('國道安全煞車距離', 'Highway Braking Dist', () => { params.special.v0 = 30; params.special.a_brake = 6.0; });
        }
      }

      function calculatePhysics() {
        const m = currentMode;
        const p = params[m];
        let res = {};

        if (m === 'area') {
          const tMax = p.t;
          const vMax = p.v0 + p.a * tMax;
          const xMax = p.v0 * tMax + 0.5 * p.a * tMax * tMax;
          res = { tMax, xMax, vMax, areaRect: p.v0 * tMax, areaTri: 0.5 * p.a * tMax * tMax };
        } else if (m === 'freefall') {
          const tMax = Math.sqrt(2 * p.h / p.g);
          const vMax = p.g * tMax;
          res = { tMax, xMax: p.h, vMax, g: p.g, air: p.air };
        } else if (m === 'special') {
          if (p.sub === 'throw') {
            const tTop = p.v0 / p.g;
            const hMax = (p.v0 * p.v0) / (2 * p.g);
            res = { tMax: tTop * 2, xMax: hMax, vMax: p.v0, tTop, sub: 'throw' };
          } else if (p.sub === 'rocket') {
            const t1 = 2.0;
            const vMax = p.v0;
            const x1 = 0.5 * vMax * t1;
            const t2 = t1 + (vMax / p.g);
            const hMax = x1 + (vMax * vMax) / (2 * p.g);
            const tFall = Math.sqrt(2 * hMax / p.g);
            const tMax = t2 + tFall;
            const vEnd = p.g * tFall;
            res = { tMax, xMax: hMax, vMax, vEnd, t1, t2, sub: 'rocket' };
          } else {
            const tMax = p.v0 / p.a_brake;
            const xMax = (p.v0 * p.v0) / (2 * p.a_brake);
            res = { tMax, xMax, vMax: p.v0, sub: 'brake' };
          }
        }
        return res;
      }

      function updateSimulation() {
        const phys = calculatePhysics();
        currentPhys = phys;
        legendX.style.display = (currentMode === 'area') ? 'none' : 'inline-flex';

        drawGraph(phys);
        drawVisualBackground(phys);
        renderFrame(0, phys);
        updateStatsAndExplain(phys);
        
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(e => console.log(e));
        }
      }

      function drawGraph(phys) {
        combinedSvg.innerHTML = '';
        const W = 680, H = 340;
        combinedSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);

        const margin = { top: 30, right: 50, bottom: 30, left: 60 };
        const pW = W - margin.left - margin.right;
        const pH = H - margin.top - margin.bottom;

        const addLine = (x1, y1, x2, y2, cls, extraProps={}) => {
          const el = createSvgEl('line', { x1, y1, x2, y2, class: cls });
          for(let k in extraProps) el.setAttribute(k, extraProps[k]);
          combinedSvg.appendChild(el);
        };

        addLine(margin.left, margin.top + pH, margin.left + pW, margin.top + pH, 'axis-line');
        addLine(margin.left, margin.top, margin.left, margin.top + pH, 'axis-line');
        addLine(margin.left + pW, margin.top, margin.left + pW, margin.top + pH, 'axis-line');

        for (let i = 1; i <= 4; i++) {
          const gx = margin.left + (i / 4) * pW, gy = margin.top + (i / 4) * pH;
          addLine(gx, margin.top, gx, margin.top + pH, 'grid-line');
          addLine(margin.left, gy, margin.left + pW, gy, 'grid-line');
        }

        const getX = t => margin.left + (t / phys.tMax) * pW;        
        const getY_x = x_val => {
          let peakX = phys.xMax || 1;
          return margin.top + pH - (x_val / peakX) * pH;
        };

        const getY_v = v_val => {
          const maxV = phys.vMax * 1.05 || 1;
          if (currentMode === 'special' && phys.sub !== 'brake') {
            return margin.top + pH / 2 - (v_val / maxV) * (pH / 2);
          }
          return margin.top + pH - (v_val / maxV) * pH;
        };

        if (currentMode === 'special' && phys.sub !== 'brake') {
          addLine(margin.left, margin.top + pH / 2, margin.left + pW, margin.top + pH / 2, 'axis-line');
          addTextToSvg(combinedSvg, margin.left - 10, margin.top + pH / 2 + 4, '0', 'end', 'var(--chalk-dim)', 14, 'bold');
        }

        if (currentMode !== 'area') {
          addTextToSvg(combinedSvg, margin.left - 10, margin.top - 12, tr('位置 x', 'Pos x'), 'start', 'var(--x-color)', 16, 'bold');
        }
        addTextToSvg(combinedSvg, margin.left + pW + 10, margin.top - 12, tr('速度 v', 'Vel v'), 'end', 'var(--v-color)', 16, 'bold');
        addTextToSvg(combinedSvg, margin.left + pW / 2, H - 8, tr('運動時間 t (s)', 'Time t (s)'), 'middle', 'var(--chalk-dim)', 14, 'bold');

        if (currentMode === 'special' && phys.sub === 'rocket') {
          const zeroY = margin.top + pH / 2;
          const x1 = getX(phys.t1), x2 = getX(phys.t2), xMax = getX(phys.tMax);
          const yMax = getY_v(phys.vMax);
          const yEnd = getY_v(-phys.vEnd);
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${margin.left},${zeroY} ${x1},${yMax} ${x1},${zeroY}`, fill: 'rgba(95, 176, 255, 0.2)' }));
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${x1},${zeroY} ${x1},${yMax} ${x2},${zeroY}`, fill: 'rgba(242, 214, 117, 0.2)' }));
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${x2},${zeroY} ${xMax},${yEnd} ${xMax},${zeroY}`, fill: 'rgba(239, 106, 90, 0.2)' }));
        }

        if (currentMode === 'area') {
          const p0_v = getY_v(0), p1_v = getY_v(params.area.v0), p2_v = getY_v(phys.vMax);
          const xEnd = getX(phys.tMax);
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${margin.left},${p0_v} ${xEnd},${p0_v} ${xEnd},${p1_v} ${margin.left},${p1_v}`, class: 'fill-rect' }));
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${margin.left},${p1_v} ${xEnd},${p1_v} ${xEnd},${p2_v}`, class: 'fill-tri' }));
          const midX = margin.left + pW / 2;
          if (params.area.v0 > 0) addTextToSvg(combinedSvg, midX, (p0_v + p1_v) / 2 + 6, tr('矩形面積 = v₀t', 'Rect Area = v₀t'), 'middle', 'var(--x-color)', 16, 'bold');
          if (params.area.a > 0) addTextToSvg(combinedSvg, midX, (p1_v + p2_v) / 2 + 10, tr('三角形面積 = ½at²', 'Tri Area = ½at²'), 'middle', 'var(--chalk-yellow)', 16, 'bold');
        }        

        let ptsX = [], ptsV = [];
        const steps = 60;
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * phys.tMax;
          let x = 0, v = 0;
          if (currentMode === 'area') { x = params.area.v0 * t + 0.5 * params.area.a * t * t; v = params.area.v0 + params.area.a * t; }
          else if (currentMode === 'freefall') { x = 0.5 * phys.g * t * t; v = phys.g * t; }
          else if (currentMode === 'special') {
            if (phys.sub === 'throw') { x = params.special.v0 * t - 0.5 * params.special.g * t * t; v = params.special.v0 - params.special.g * t; }
            else if (phys.sub === 'rocket') {
              if (t <= phys.t1) { x = 0.5 * (params.special.v0 / phys.t1) * t * t; v = (params.special.v0 / phys.t1) * t; }
              else if (t <= phys.t2) { const dt = t - phys.t1; x = 0.5 * params.special.v0 * phys.t1 + params.special.v0 * dt - 0.5 * params.special.g * dt * dt; v = params.special.v0 - params.special.g * dt; }
              else { const dt = t - phys.t2; x = phys.xMax - 0.5 * params.special.g * dt * dt; v = -params.special.g * dt; }
            } else { x = params.special.v0 * t - 0.5 * params.special.a_brake * t * t; v = params.special.v0 - params.special.a_brake * t; }
          }
          if (currentMode !== 'area') ptsX.push(`${getX(t)},${getY_x(Math.max(0, x))}`);
          ptsV.push(`${getX(t)},${getY_v(v)}`);
        }

        if (currentMode !== 'area') combinedSvg.appendChild(createSvgEl('polyline', { points: ptsX.join(' '), class: 'curve-x' }));
        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsV.join(' '), class: 'curve-v' }));

        combinedSvg.appendChild(createSvgEl('line', { id: 'svgGuide', class: 'guide-line' }));
        const dotX = createSvgEl('circle', { id: 'svgDotX', r: 7, class: 'dot-x' });
        if (currentMode === 'area') dotX.style.display = 'none';
        combinedSvg.appendChild(dotX);
        combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotV', r: 7, class: 'dot-v' }));

        phys._getX = getX; phys._getY_x = getY_x; phys._getY_v = getY_v;
      }
      
      function drawVisualBackground(phys) {
        visualSvg.innerHTML = '';
        visualSvg.setAttribute('viewBox', '0 0 220 340');
        const m = currentMode;

        if (m === 'area' || (m === 'special' && phys.sub === 'brake')) {
          visualSvg.appendChild(createSvgEl('rect', { x: 5, y: 150, width: 210, height: 40, fill: '#382c1e', rx: 4 }));
          visualSvg.appendChild(createSvgEl('line', { x1: 5, y1: 170, x2: 215, y2: 170, stroke: '#f2ecd9', 'stroke-dasharray': '8 8', 'stroke-width': 2 }));
          
          const car = createSvgEl('g', { id: 'simObject' });
          // 高質感綠色煞車小車
          car.appendChild(createSvgEl('rect', { x: -16, y: -8, width: 36, height: 18, fill: 'rgba(0,0,0,0.4)', rx: 4 }));
          const wColor = '#1e293b';
          car.appendChild(createSvgEl('rect', { x: -12, y: -12, width: 8, height: 4, fill: wColor, rx: 1 }));
          car.appendChild(createSvgEl('rect', { x: 6, y: -12, width: 8, height: 4, fill: wColor, rx: 1 }));
          car.appendChild(createSvgEl('rect', { x: -12, y: 10, width: 8, height: 4, fill: wColor, rx: 1 }));
          car.appendChild(createSvgEl('rect', { x: 6, y: 10, width: 8, height: 4, fill: wColor, rx: 1 }));
          car.appendChild(createSvgEl('rect', { x: -18, y: -10, width: 36, height: 22, fill: '#4cd964', rx: 5 }));
          car.appendChild(createSvgEl('rect', { x: 2, y: -6, width: 6, height: 14, fill: 'rgba(255,255,255,0.7)', rx: 1 }));
          car.appendChild(createSvgEl('rect', { x: -14, y: -5, width: 3, height: 12, fill: 'rgba(255,255,255,0.4)', rx: 1 }));
          car.appendChild(createSvgEl('circle', { cx: 16, cy: -6, r: 2, fill: '#fde047' }));
          car.appendChild(createSvgEl('circle', { cx: 16, cy: 8, r: 2, fill: '#fde047' }));
          visualSvg.appendChild(car);

        } else if (m === 'freefall') {
          // 真空管背景
          visualSvg.appendChild(createSvgEl('rect', { x: 45, y: 35, width: 130, height: 265, fill: 'rgba(255,255,255,0.03)', stroke: 'var(--x-color)', 'stroke-width': 2, rx: 10 }));
          
          // 物體
          const obj = createSvgEl('g', { id: 'simObject' });
          const iron = createSvgEl('g', { id: 'ironBall', transform: 'translate(80, 0)' });
          iron.appendChild(createSvgEl('circle', { cx: 0, cy: 0, r: 16, fill: '#8f8a80', stroke: '#fff', 'stroke-width': 1.5 }));
          addTextToSvg(iron, 0, 5, tr('鐵', 'Fe'), 'middle', '#fff', 14, 'bold');
          obj.appendChild(iron);
          const feather = createSvgEl('g', { id: 'feather', transform: 'translate(140, 0)' });
          feather.appendChild(createSvgEl('path', { d: 'M0,-14 C12,-6 12,6 0,14 C-12,6 -12,-6 0,-14 Z', fill: '#f2d675', opacity: 0.9 }));
          feather.appendChild(createSvgEl('line', { x1: 0, y1: -16, x2: 0, y2: 18, stroke: '#fff', 'stroke-width': 2 }));
          obj.appendChild(feather);
          visualSvg.appendChild(obj);

          // 地面 (蓋在管線上方確保觸底視覺正確)
          visualSvg.appendChild(createSvgEl('rect', { x: 40, y: 300, width: 140, height: 12, fill: '#5c4a33', rx: 3 }));

        } else if (m === 'special') {
          visualSvg.appendChild(createSvgEl('line', { x1: 110, y1: 30, x2: 110, y2: 310, stroke: 'var(--chalk-dim)', 'stroke-dasharray': '3 5', 'stroke-width': 2 }));
          visualSvg.appendChild(createSvgEl('rect', { x: 80, y: 310, width: 60, height: 14, fill: '#5c4a33', rx: 3 }));
          const obj = createSvgEl('g', { id: 'simObject' });
          if (phys.sub === 'throw') {
            obj.appendChild(createSvgEl('circle', { cx: 110, cy: 0, r: 15, fill: '#f2d675', stroke: '#ef6a5a', 'stroke-width': 3 }));
          } else {
            // 高質感火箭
            const rocketG = createSvgEl('g', { transform: 'translate(110, 0)' });
            rocketG.appendChild(createSvgEl('polygon', { id: 'flame', points: '-8,18 0,40 8,18 0,26', fill: '#fde047', stroke: '#ef6a5a', 'stroke-width': 2, style: 'display:none;' }));
            rocketG.appendChild(createSvgEl('rect', { x: -10, y: -16, width: 20, height: 36, fill: '#f2ecd9', rx: 5 }));
            rocketG.appendChild(createSvgEl('polygon', { points: '-10,-16 0,-32 10,-16', fill: '#ef6a5a' }));
            rocketG.appendChild(createSvgEl('polygon', { points: '-10,10 -16,20 -10,20', fill: '#5fb0ff' }));
            rocketG.appendChild(createSvgEl('polygon', { points: '10,10 16,20 10,20', fill: '#5fb0ff' }));
            rocketG.appendChild(createSvgEl('circle', { cx: 0, cy: -2, r: 5, fill: '#38bdf8', stroke: '#15302a', 'stroke-width': 1.5 }));
            obj.appendChild(rocketG);
          }
          visualSvg.appendChild(obj);
        }
      }

      function renderFrame(t, phys) {
        const m = currentMode;
        let x = 0, v = 0;
        
        if (m === 'area') { x = params.area.v0 * t + 0.5 * params.area.a * t * t; v = params.area.v0 + params.area.a * t; }
        else if (m === 'freefall') { x = 0.5 * phys.g * t * t; v = phys.g * t; }
        else if (m === 'special') {
          if (phys.sub === 'throw') { x = params.special.v0 * t - 0.5 * params.special.g * t * t; v = params.special.v0 - params.special.g * t; }
          else if (phys.sub === 'rocket') {
            if (t <= phys.t1) { x = 0.5 * (params.special.v0 / phys.t1) * t * t; v = (params.special.v0 / phys.t1) * t; }
            else if (phys.t2 && t <= phys.t2) { const dt = t - phys.t1; x = 0.5 * params.special.v0 * phys.t1 + params.special.v0 * dt - 0.5 * params.special.g * dt * dt; v = params.special.v0 - params.special.g * dt; }
            else { const dt = t - phys.t2; x = phys.xMax - 0.5 * params.special.g * dt * dt; v = -params.special.g * dt; }
          } else { x = params.special.v0 * t - 0.5 * params.special.a_brake * t * t; v = params.special.v0 - params.special.a_brake * t; }
        }

        if (phys._getX) {
          const cx = phys._getX(t), cy_x = phys._getY_x(Math.max(0, x)), cy_v = phys._getY_v(v);
          const dotX = document.getElementById('svgDotX'), dotV = document.getElementById('svgDotV'), guide = document.getElementById('svgGuide');
          if (dotX && dotV && guide) {
            dotX.setAttribute('cx', cx); dotX.setAttribute('cy', cy_x);
            dotV.setAttribute('cx', cx); dotV.setAttribute('cy', cy_v);
            guide.setAttribute('x1', cx); guide.setAttribute('y1', 20);
            guide.setAttribute('x2', cx); guide.setAttribute('y2', 320);
          }
        }

        const simObj = document.getElementById('simObject');
        const ratio = Math.min(1, Math.max(0, x / (phys.xMax || 1)));

        if (simObj) {
          if (m === 'area' || (m === 'special' && phys.sub === 'brake')) {
            const px = 20 + ratio * 180;
            simObj.setAttribute('transform', `translate(${px}, 170)`);
          } else if (m === 'freefall') {
            // 🌟 精準著陸：當 ratio=1 時，py = 50 + 234 = 284，剛好切齊 y=300 的地面
            const py = 50 + ratio * 234;
            const iron = document.getElementById('ironBall'), feather = document.getElementById('feather');
            if (iron && feather) {
              iron.setAttribute('transform', `translate(80, ${py})`);
              const fy = 50 + (phys.air ? (ratio * 0.6) : ratio) * 234;
              feather.setAttribute('transform', `translate(140, ${fy}) rotate(${phys.air ? Math.sin(t * 10) * 15 : 0})`);
            }
          } else if (m === 'special') {
            const py = 295 - ratio * 260;
            simObj.setAttribute('transform', `translate(0, ${py})`);
            const flame = document.getElementById('flame');
            if (flame) flame.style.display = (phys.sub === 'rocket' && t <= phys.t1 && v > 0) ? 'block' : 'none';
          }
        }

        if (m === 'special') {
          if (phys.sub === 'throw') {
            phaseBadge.className = v > 0 ? 'phase-badge yellow' : 'phase-badge red';
            phaseBadge.textContent = v > 0 ? tr('🟡 上升減速 (v > 0, a 向下)', '🟡 Ascend/Decel (v>0, a↓)') : tr('🔴 下降加速 (v < 0, a 向下)', '🔴 Descend/Accel (v<0, a↓)');
          } else if (phys.sub === 'rocket') {
            if (t <= phys.t1) { phaseBadge.className = 'phase-badge blue'; phaseBadge.textContent = tr('🔵 點火衝刺上升 (a 向上)', '🔵 Engine Burn Ascend (a↑)'); }
            else if (t <= phys.t2) { phaseBadge.className = 'phase-badge yellow'; phaseBadge.textContent = tr('🟡 慣性減速上升 (a = -g)', '🟡 Inertia Ascend (a=-g)'); }
            else { phaseBadge.className = 'phase-badge red'; phaseBadge.textContent = tr('🔴 自由落體下墜 (v < 0)', '🔴 Free Fall Descend (v<0)'); }
          } else {
            phaseBadge.className = v > 0 ? 'phase-badge yellow' : 'phase-badge green';
            phaseBadge.textContent = v > 0 ? tr('🟡 緊急煞車減速中...', '🟡 Braking Decel...') : tr('🟢 完全靜止 (v = 0)', '🟢 Full Stop (v=0)');
          }
        } else {
          phaseBadge.className = 'phase-badge blue';
          phaseBadge.textContent = tr(`⏱️ 實驗進行中：t = ${t.toFixed(2)} s`, `⏱️ Running: t = ${t.toFixed(2)} s`);
        }
      }

      function updateStatsAndExplain(phys) {
        statsGrid.innerHTML = ''; extraDefBox.innerHTML = '';
        const addStat = (kZh, kEn, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${tr(kZh, kEn)}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        const m = currentMode;
        if (m === 'area') {
          addStat('矩形位移 v₀t', 'Rect Disp v₀t', `${phys.areaRect.toFixed(1)} m`);
          addStat('三角位移 ½at²', 'Tri Disp ½at²', `${phys.areaTri.toFixed(1)} m`);
          addStat('總位移 Δx', 'Total Disp Δx', `${phys.xMax.toFixed(1)} m`);
          addStat('末速度 v', 'Final Vel v', `${phys.vMax.toFixed(1)} m/s`);
          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：v-t 圖積分面積 = 絕對位移！</h3>
            <p>在 $v-t$ 圖中，隨著時間向右推進，動態填充的黃色區域面積正好等於車輛走過的位移 $\\Delta x$！梯形總面積可完美切分為：底部的<b>等速矩形（$v_0 t$）</b>與頂部的<b>加速三角形（$\\frac{1}{2} a t^2$）</b>，這正是三大定律之二 <span class="formula-highlight">$\\Delta x = v_0 t + \\frac{1}{2} a t^2$</span> 的幾何真相！</p>
          `, `
            <h3>💡 Teacher's Analysis: v-t Area = Displacement!</h3>
            <p>In the $v-t$ graph, the yellow area perfectly equals the displacement $\\Delta x$! The trapezoid area splits into: bottom <b>uniform rectangle ($v_0 t$)</b> and top <b>acceleration triangle ($\\frac{1}{2} a t^2$)</b>. This is the geometric truth of the kinematic equation <span class="formula-highlight">$\\Delta x = v_0 t + \\frac{1}{2} a t^2$</span>!</p>
          `);
        } else if (m === 'freefall') {
          addStat('釋放高度 H', 'Drop Height H', `${params.freefall.h} m`);
          addStat('重力加速度 g', 'Gravity g', `${phys.g} m/s²`);
          addStat('落地時間 t', 'Fall Time t', `${phys.tMax.toFixed(2)} s`);
          addStat('落地瞬速 v', 'Impact Vel v', `${phys.vMax.toFixed(2)} m/s`);

          extraDefBox.innerHTML = tr(`
            <div class="def-card">
              <h4>🪨 會考必考！【自由落體】嚴格物理四大定義：</h4>
              <ul>
                <li>① <b>初速度必須為零</b>：$v_0 = 0$（由靜止放開，絕非用力丟下）。</li>
                <li>② <b>僅受重力作用</b>：在真空或空氣阻力可忽略的環境進行。</li>
                <li>③ <b>等加速度運動</b>：加速度恆等於地表重力加速度 $g \\approx 9.8\\text{ m/s}^2$，方向永遠垂直指向地心/正下方。</li>
                <li>④ <b>與質量完全無關</b>：不管重的鐵球還是輕的羽毛，下落加速度、速度與落地時間<span>皆相同</span>！</li>
              </ul>
            </div>
          `, `
            <div class="def-card">
              <h4>🪨 Exam Essential! 4 Strict Definitions of 【Free Fall】:</h4>
              <ul>
                <li>① <b>Initial velocity must be zero</b>: $v_0 = 0$ (dropped from rest, not thrown).</li>
                <li>② <b>Only acted upon by gravity</b>: In vacuum or negligible air resistance.</li>
                <li>③ <b>Uniform acceleration</b>: Acceleration is always $g \\approx 9.8\\text{ m/s}^2$ downwards.</li>
                <li>④ <b>Independent of mass</b>: Heavy iron or light feather—they fall with the <span>exact same</span> acceleration, speed, and time!</li>
              </ul>
            </div>
          `);
          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：公式簡化與大氣阻力</h3>
            <p>因為初速 $v_0 = 0$，公式簡化為 <span class="formula-highlight">$H = \\frac{1}{2} g t^2$</span> 與 <span class="formula-highlight">$v = g t = \\sqrt{2gH}$</span>。日常大氣層中，羽毛因受阻力抵消重力而落得慢；但只要點擊上方切換成「抽真空」，親眼見證鐵球與羽毛必定同時落地！</p>
          `, `
            <h3>💡 Teacher's Analysis: Simplified Formulas & Air Drag</h3>
            <p>Since $v_0 = 0$, formulas simplify to <span class="formula-highlight">$H = \\frac{1}{2} g t^2$</span> and <span class="formula-highlight">$v = g t = \\sqrt{2gH}$</span>. In the atmosphere, feathers fall slower due to drag; but switch to 'Vacuum' above, and witness them hitting the ground simultaneously!</p>
          `);
        } else if (m === 'special') {
          if (phys.sub === 'throw') {
            addStat('最高點高度', 'Max Height', `${phys.xMax.toFixed(1)} m`); addStat('滯空總時間', 'Total Air Time', `${phys.tMax.toFixed(2)} s`); addStat('登頂時間', 'Time to Peak', `${phys.tTop.toFixed(2)} s`); addStat('落回瞬速', 'Return Vel', `${phys.vMax.toFixed(1)} m/s`);
            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：鉛直上拋的「極致對稱性」與大考陷阱</h3>
              <p>請仔細觀察動畫：<b>到達最高點瞬間，速度雖為 <span class="formula-highlight">$v = 0$</span>，但重力加速度 $g$ 依舊指向正下方（絕對不為零）</b>！這是全會考錯誤率第一名的題目！全過程具有對稱之美：<b>上升時間 = 下降時間</b>，落回拋出點的速度大小等於初速！</p>
            `, `
              <h3>💡 Teacher's Analysis: Vertical Throw 'Symmetry' & Traps</h3>
              <p>Observe the animation: <b>At the peak, velocity is <span class="formula-highlight">$v = 0$</span>, but acceleration $g$ is STILL pointing downwards (NEVER zero)</b>! This is the #1 missed exam trap! The process is perfectly symmetrical: <b>Ascend time = Descend time</b>, and return speed equals initial speed!</p>
            `);
          } else if (phys.sub === 'rocket') {
            addStat('最高點高度', 'Max Height', `${phys.xMax.toFixed(0)} m`); addStat('燃盡最高速 v₁', 'Burnout Vel v₁', `${params.special.v0} m/s`); addStat('登頂時間 t₂', 'Time to Peak t₂', `${phys.t2.toFixed(1)} s`); addStat('墜地速度', 'Impact Vel', `${phys.vEnd.toFixed(0)} m/s`);
            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：火箭多階段破題秘技</h3>
              <p>必考陷阱：<b>「燃料用盡瞬間，火箭不是在最高點！」</b> 燃料用盡時速度達到正向最大；隨後火箭因慣性繼續向上作等減速上升（階段二），直到速度減為 0 才到達真正最高點；之後才開始自由落體下墜（階段三）。</p>
            `, `
              <h3>💡 Teacher's Analysis: Rocket Multi-stage Trick</h3>
              <p>Exam trap: <b>'The rocket is NOT at its peak when fuel runs out!'</b> At burnout, it reaches max positive speed; it then continues to ascend with deceleration due to inertia (Stage 2) until speed is 0 at the true peak. Only then does it free fall (Stage 3).</p>
            `);
          } else {
            addStat('行駛初速 v₀', 'Driving Vel v₀', `${params.special.v0} m/s`); addStat('煞車減速度 a', 'Braking Decel a', `-${params.special.a_brake} m/s²`); addStat('停止時間', 'Stop Time', `${phys.tMax.toFixed(2)} s`); addStat('煞車距離', 'Braking Dist', `${phys.xMax.toFixed(1)} m`);
            explainBox.innerHTML = tr(`
              <h3>💡 老師精闢解析：緊急煞車與車距平方定律</h3>
              <p>緊急煞車時加速度方向與車速相反。由 <span class="formula-highlight">$v^2 = v_0^2 + 2a\\Delta x$</span> 可知，當車速提高為 2 倍時，在相同的煞車減速度下，所需的煞車距離將激增為平方倍數——也就是 <b>4 倍 distance</b>！這就是國道超速危險的物理核心。</p>
            `, `
              <h3>💡 Teacher's Analysis: Braking & Square Law</h3>
              <p>During emergency braking, acceleration opposes velocity. From <span class="formula-highlight">$v^2 = v_0^2 + 2a\\Delta x$</span>, if speed doubles with the same braking deceleration, the braking distance increases by the square—<b>4 times the distance</b>! This is the physical core of speeding dangers.</p>
            `);
          }
        }
      }

      function animate(ts) {
        if (!animStartTime) animStartTime = ts;
        const elapsed = ts - animStartTime;
        const phys = currentPhys;
        const frac = Math.min(1, elapsed / ANIM_DURATION);
        const curTime = frac * phys.tMax;

        progressFill.style.width = `${frac * 100}%`;
        renderFrame(curTime, phys);

        if (frac < 1) {
          animId = requestAnimationFrame(animate);
        } else {
          animId = null; animStartTime = null;
          playBtn.textContent = tr('🔄 再次播放', '🔄 Replay');
        }
      }

      playBtn.addEventListener('click', () => {
        if (animId) {
          cancelAnimationFrame(animId); animId = null; animStartTime = null;
          playBtn.textContent = tr('▶ 繼續播放', '▶ Resume');
        } else {
          playBtn.textContent = tr('⏸ 暫停播放', '⏸ Pause');
          animId = requestAnimationFrame(animate);
        }
      });

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          if (animId) { cancelAnimationFrame(animId); animId = null; animStartTime = null; }
          playBtn.textContent = tr('▶ 開始實驗', '▶ Start Lab'); progressFill.style.width = '0%';
          initUI();
        });
      });

      initUI();
      setLang('zh'); // Initialize Bilingual System
    })();
  </script>
</body>
</html>
