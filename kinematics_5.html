<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 1-5 等加速度運動 (下)｜公式解、自由落體與進階考題</title>

  <!-- 強制注入 MathJax 解析設定，確保 inline $ 與 LaTeX 公式絕對不壞掉 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --a-color: #4cd964;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1400px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 2.1rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 780px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-family: 'Kalam', cursive; font-size: 1.25rem; margin: 0 0 14px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 14px 16px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
    }
    .mode-switch button span.sub { font-size: 0.78rem; font-weight: 400; opacity: 0.7; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.4); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.85; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 14px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--chalk-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 5px; background: transparent; cursor: pointer; }

    .presets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .presets span { font-size: 0.8rem; color: var(--chalk-dim); margin-right: 4px; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 1px dashed var(--chalk-dim);
      color: var(--chalk); padding: 6px 12px; border-radius: 18px; font-size: 0.8rem; cursor: pointer; transition: all .15s;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .playbar { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    #playBtn {
      background: var(--chalk-yellow); color: var(--board-dark); border: none; font-weight: 700;
      padding: 10px 24px; border-radius: 24px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem;
      transition: all .15s; box-shadow: 0 4px 12px rgba(242, 214, 117, 0.3); min-width: 110px;
    }
    #playBtn:hover { transform: scale(1.04); box-shadow: 0 6px 16px rgba(242, 214, 117, 0.4); }
    .progress-track { flex: 1; height: 6px; background: rgba(242, 236, 217, 0.15); border-radius: 3px; position: relative; overflow: hidden; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--chalk-yellow); border-radius: 3px; width: 0%; }

    .dual-view { display: flex; gap: 16px; margin: 12px 0 8px; align-items: stretch; }
    .graph-card { min-width: 0; background: rgba(0, 0, 0, 0.22); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; }
    .visual-card { min-width: 220px; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }

    /* 下半部三大進階模組統一配置 3:1 寬版圖表比例 */
    .dual-view.ratio-3-1 .graph-card { flex: 3; }
    .dual-view.ratio-3-1 .visual-card { flex: 1; }

    .legend { display: flex; gap: 14px; margin-bottom: 8px; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: var(--chalk-dim); flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { width: 12px; height: 3px; display: inline-block; border-radius: 2px; }

    svg { width: 100%; height: auto; display: block; overflow: visible; }
    .axis-line { stroke: var(--chalk-dim); stroke-width: 1; opacity: 0.6; }
    .grid-line { stroke: var(--chalk-dim); stroke-width: 0.5; stroke-dasharray: 3 3; opacity: 0.2; }
    .curve-x { fill: none; stroke: var(--x-color); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .curve-v { fill: none; stroke: var(--v-color); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .fill-rect { fill: var(--x-color); opacity: 0.18; }
    .fill-tri { fill: var(--chalk-yellow); opacity: 0.25; }
    .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    .dot-x { fill: var(--x-color); filter: drop-shadow(0 0 4px rgba(95, 176, 255, 0.9)); }
    .dot-v { fill: var(--v-color); filter: drop-shadow(0 0 4px rgba(239, 106, 90, 0.9)); }

    .phase-badge {
      font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.1);
      color: var(--chalk); text-align: center; width: 100%; margin-bottom: 10px; white-space: nowrap;
    }
    .phase-badge.blue { background: rgba(95, 176, 255, 0.2); color: #8fd0ff; border: 1px solid #5fb0ff; }
    .phase-badge.yellow { background: rgba(242, 214, 117, 0.2); color: #ffe680; border: 1px solid #f2d675; }
    .phase-badge.red { background: rgba(239, 106, 90, 0.2); color: #ff9485; border: 1px solid #ef6a5a; }
    .phase-badge.green { background: rgba(76, 217, 100, 0.2); color: #85ff99; border: 1px solid #4cd964; }

    #combinedSvg { width: 100%; min-height: 340px; }
    #visualSvg { width: 100%; min-height: 340px; }
    .guide-line { stroke: var(--chalk-yellow); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.6; fill: none; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--chalk-yellow); font-weight: 600; margin-top: 3px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 14px 18px; }
    .explain-box h3 { font-family: 'Kalam', cursive; color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.1rem; }
    .explain-box p { margin: 0; font-size: 0.9rem; line-height: 1.6; color: var(--chalk); }

    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; }

    .def-card { background: rgba(239, 106, 90, 0.15); border: 1px solid rgba(239, 106, 90, 0.4); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
    .def-card h4 { margin: 0 0 6px; color: #ff9485; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .def-card ul { margin: 0; padding-left: 20px; font-size: 0.88rem; line-height: 1.6; color: var(--chalk); }
    .def-card ul li span { color: var(--chalk-yellow); font-weight: bold; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 0.8rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }

    @media (max-width: 768px) {
      .dual-view { flex-direction: column; }
      .visual-card { width: 100%; min-height: 340px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Taiwan Middle School Science · Chapter 1-5 Kinematics (Part 2)</div>
      <h1>等加速度運動（下）：公式解、自由落體與進階考題</h1>
      <p>專為國中會考量身打造！直觀演示 v-t 圖切分面積推導公式解、嚴格對比抽真空與大氣阻力下落，並徹底破解上拋最高點、火箭升空與煞車平方定律三大魔王題型！</p>
    </header>

    <div class="board">
      <h2>① 選擇進階考題與公式模組</h2>
      <div class="mode-switch">
        <button class="active" data-mode="area">
          <span>📊 4. 公式解與圖形面積</span>
          <span class="sub">純 v-t 圖幾何位移剖析</span>
        </button>
        <button data-mode="freefall">
          <span>🪨 5. 自由落體與真空管</span>
          <span class="sub">嚴格定義與大氣阻力比對</span>
        </button>
        <button data-mode="special">
          <span>🚀 6. 特殊與進階考題</span>
          <span class="sub">上拋、火箭與煞車問題</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>

      <div class="playbar" id="playbarContainer">
        <button id="playBtn">▶ 開始實驗</button>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="board">
      <h2>② 物理動態與運動學圖形聯動</h2>
      <div class="dual-view ratio-3-1" id="dualViewContainer">
        <div class="graph-card">
          <div class="legend" id="graphLegend">
            <span id="legendX"><i style="background:var(--x-color)"></i>藍線：x-t（位置/位移）</span>
            <span id="legendV"><i style="background:var(--v-color)"></i>紅線：v-t（速度）</span>
          </div>
          <svg id="combinedSvg" viewBox="0 0 680 340"></svg>
        </div>

        <div class="visual-card">
          <div class="phase-badge blue" id="phaseBadge">準備就緒</div>
          <svg id="visualSvg" viewBox="0 0 220 340"></svg>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>③ 課堂重點與物理概念剖析</h2>
      <div id="extraDefBox"></div>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer>國中理化 · 1-5 等加速度運動（下篇） · 視覺化互動教學教材 · 破解進階大考題型！</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const playBtn = document.getElementById('playBtn');
      const progressFill = document.getElementById('progressFill');
      const combinedSvg = document.getElementById('combinedSvg');
      const visualSvg = document.getElementById('visualSvg');
      const phaseBadge = document.getElementById('phaseBadge');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');
      const extraDefBox = document.getElementById('extraDefBox');
      const legendX = document.getElementById('legendX');

      let currentMode = 'area';
      let animId = null;
      let animStartTime = null;
      let currentPhys = null;
      const ANIM_DURATION = 4000;

      const params = {
        area:     { v0: 6, a: 4.0, t: 5.0 },
        freefall: { h: 80, g: 9.8, air: 0 },
        special:  { sub: 'throw', v0: 25, g: 9.8, a_brake: 5.0 }
      };

      const SVG_NS = 'http://www.w3.org/2000/svg';

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) {
          for (let key in attrs) el.setAttribute(key, attrs[key]);
        }
        return el;
      }

      function addTextToSvg(parent, x, y, txt, anchor, color, size, weight='normal') {
        const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight });
        t.textContent = txt;
        parent.appendChild(t);
      }

      function initUI() {
        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, label, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${label} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            const newVal = parseFloat(e.target.value);
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            onChange(newVal);
            updateSimulation();
          });
        };

        if (m === 'area') {
          addSlider('v0', '初速度 v₀', 0, 15, 1, p.v0, 'm/s', v => p.v0 = v);
          addSlider('a', '等加速度 a', 1.0, 6.0, 0.5, p.a, 'm/s²', v => p.a = v);
          addSlider('t', '觀察時間 t', 2.0, 10.0, 0.5, p.t, 's', v => p.t = v);
        } else if (m === 'freefall') {
          addSlider('h', '釋放高度 H', 20, 200, 10, p.h, 'm', v => p.h = v);
          addSlider('g', '重力加速度 g', 1.6, 25.0, 0.2, p.g, 'm/s²', v => p.g = v);
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>環境狀態 <span class="val" id="val_air">${p.air ? '💨 大氣層 (有阻力)' : '🌌 抽真空 (無阻力)'}</span></label>
            <div style="display:flex; gap:8px; margin-top:4px;">
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.air === 0 ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.air === 0 ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setAir(0)">抽真空</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.air === 1 ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.air === 1 ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setAir(1)">有空氣</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setAir = (val) => { p.air = val; renderControls(); updateSimulation(); };
        } else if (m === 'special') {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>經典魔王題型 <span class="val">${p.sub === 'throw' ? '⚪ 鉛直上拋' : (p.sub === 'rocket' ? '🚀 火箭升空' : '🛑 緊急煞車')}</span></label>
            <div style="display:flex; gap:6px; margin-top:4px;">
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.sub === 'throw' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.sub === 'throw' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setSub('throw')">上拋</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.sub === 'rocket' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.sub === 'rocket' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setSub('rocket')">火箭</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.sub === 'brake' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.sub === 'brake' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setSub('brake')">煞車</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setSub = (val) => { p.sub = val; renderControls(); updateSimulation(); };

          if (p.sub === 'throw') {
            addSlider('v0', '上拋初速度 v₀', 10, 40, 2, p.v0, 'm/s', v => p.v0 = v);
            addSlider('g', '重力加速度 g', 5.0, 15.0, 0.2, p.g, 'm/s²', v => p.g = v);
          } else if (p.sub === 'rocket') {
            addSlider('v0', '燃盡瞬間速度 v₁', 50, 200, 10, p.v0, 'm/s', v => p.v0 = v);
            addSlider('g', '重力加速度 g', 5.0, 15.0, 0.2, p.g, 'm/s²', v => p.g = v);
          } else {
            addSlider('v0', '行駛初速度 v₀', 10, 40, 2, p.v0, 'm/s', v => p.v0 = v);
            addSlider('a_brake', '煞車減速度 a', 2.0, 10.0, 0.5, p.a_brake, 'm/s²', v => p.a_brake = v);
          }
        }
      }

      function renderPresets() {
        presetsBox.innerHTML = '<span>⚡ 快速情境：</span>';
        const m = currentMode;
        const addBtn = (label, action) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = () => { action(); renderControls(); updateSimulation(); };
          presetsBox.appendChild(b);
        };

        if (m === 'area') {
          addBtn('由靜止啟動 (純三角形)', () => { params.area.v0 = 0; params.area.a = 4.0; params.area.t = 5.0; });
          addBtn('梯形面積 (矩形+三角形)', () => { params.area.v0 = 6; params.area.a = 3.0; params.area.t = 6.0; });
          addBtn('等速度運動 (純矩形 a=0)', () => { params.area.v0 = 12; params.area.a = 0.0; params.area.t = 5.0; });
        } else if (m === 'freefall') {
          addBtn('🌍 地球真空 (g=9.8)', () => { params.freefall.g = 9.8; params.freefall.air = 0; });
          addBtn('📐 課本好算版 (g=10)', () => { params.freefall.g = 10.0; params.freefall.air = 0; });
        } else if (m === 'special') {
          if (params.special.sub === 'throw') addBtn('初速 29.4 m/s (滯空6秒)', () => { params.special.v0 = 29.4; params.special.g = 9.8; });
          else if (params.special.sub === 'rocket') addBtn('標準火箭衝刺', () => { params.special.v0 = 100; params.special.g = 9.8; });
          else addBtn('國道安全煞車距離', () => { params.special.v0 = 30; params.special.a_brake = 6.0; });
        }
      }

      function calculatePhysics() {
        const m = currentMode;
        const p = params[m];
        let res = {};

        if (m === 'area') {
          const tMax = p.t;
          const vMax = p.v0 + p.a * tMax;
          const xMax = p.v0 * tMax + 0.5 * p.a * tMax * tMax;
          res = { tMax, xMax, vMax, areaRect: p.v0 * tMax, areaTri: 0.5 * p.a * tMax * tMax };
        } else if (m === 'freefall') {
          const tMax = Math.sqrt(2 * p.h / p.g);
          const vMax = p.g * tMax;
          res = { tMax, xMax: p.h, vMax, g: p.g, air: p.air };
        } else if (m === 'special') {
          if (p.sub === 'throw') {
            const tTop = p.v0 / p.g;
            const hMax = (p.v0 * p.v0) / (2 * p.g);
            res = { tMax: tTop * 2, xMax: hMax, vMax: p.v0, tTop, sub: 'throw' };
          } else if (p.sub === 'rocket') {
            const t1 = 2.0;
            const vMax = p.v0;
            const x1 = 0.5 * vMax * t1;
            const t2 = t1 + (vMax / p.g);
            const hMax = x1 + (vMax * vMax) / (2 * p.g);
            const tFall = Math.sqrt(2 * hMax / p.g);
            const tMax = t2 + tFall;
            const vEnd = p.g * tFall;
            res = { tMax, xMax: hMax, vMax, vEnd, t1, t2, sub: 'rocket' };
          } else {
            const tMax = p.v0 / p.a_brake;
            const xMax = (p.v0 * p.v0) / (2 * p.a_brake);
            res = { tMax, xMax, vMax: p.v0, sub: 'brake' };
          }
        }
        return res;
      }

      function updateSimulation() {
        const phys = calculatePhysics();
        currentPhys = phys;
        legendX.style.display = (currentMode === 'area') ? 'none' : 'inline-flex';

        drawGraph(phys);
        drawVisualBackground(phys);
        renderFrame(0, phys);
        updateStatsAndExplain(phys);
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise().catch(e => console.log(e));
        }
      }

      function drawGraph(phys) {
        combinedSvg.innerHTML = '';
        const W = 680, H = 340;
        const margin = { top: 30, right: 50, bottom: 30, left: 50 };
        const pW = W - margin.left - margin.right;
        const pH = H - margin.top - margin.bottom;

        const addLine = (x1, y1, x2, y2, cls, extraProps={}) => {
          const el = createSvgEl('line', { x1, y1, x2, y2, class: cls });
          for(let k in extraProps) el.setAttribute(k, extraProps[k]);
          combinedSvg.appendChild(el);
        };

        addLine(margin.left, margin.top + pH, margin.left + pW, margin.top + pH, 'axis-line');
        addLine(margin.left, margin.top, margin.left, margin.top + pH, 'axis-line');
        addLine(margin.left + pW, margin.top, margin.left + pW, margin.top + pH, 'axis-line');

        for (let i = 1; i <= 4; i++) {
          const gx = margin.left + (i / 4) * pW, gy = margin.top + (i / 4) * pH;
          addLine(gx, margin.top, gx, margin.top + pH, 'grid-line');
          addLine(margin.left, gy, margin.left + pW, gy, 'grid-line');
        }

        const getX = t => margin.left + (t / phys.tMax) * pW;        
        const getY_x = x_val => {
          let peakX = phys.xMax || 1;
          return margin.top + pH - (x_val / peakX) * pH;
        };

        const getY_v = v_val => {
          const maxV = phys.vMax * 1.05 || 1;
          if (currentMode === 'special' && phys.sub !== 'brake') {
            return margin.top + pH / 2 - (v_val / maxV) * (pH / 2);
          }
          return margin.top + pH - (v_val / maxV) * pH;
        };

        if (currentMode === 'special' && phys.sub !== 'brake') {
          addLine(margin.left, margin.top + pH / 2, margin.left + pW, margin.top + pH / 2, 'axis-line');
          addTextToSvg(combinedSvg, margin.left - 10, margin.top + pH / 2 + 4, '0', 'end', 'var(--chalk-dim)', 10);
        }

        if (currentMode !== 'area') {
          addTextToSvg(combinedSvg, margin.left - 10, margin.top - 8, '位置 x', 'start', 'var(--x-color)', 10);
        }
        addTextToSvg(combinedSvg, margin.left + pW + 10, margin.top - 8, '速度 v', 'end', 'var(--v-color)', 10);
        addTextToSvg(combinedSvg, margin.left + pW / 2, H - 8, '運動時間 t (s)', 'middle', 'var(--chalk-dim)', 10);

        if (currentMode === 'special' && phys.sub === 'rocket') {
          const zeroY = margin.top + pH / 2;
          const x1 = getX(phys.t1), x2 = getX(phys.t2), xMax = getX(phys.tMax);
          const yMax = getY_v(phys.vMax);
          const yEnd = getY_v(-phys.vEnd);
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${margin.left},${zeroY} ${x1},${yMax} ${x1},${zeroY}`, fill: 'rgba(95, 176, 255, 0.2)' }));
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${x1},${zeroY} ${x1},${yMax} ${x2},${zeroY}`, fill: 'rgba(242, 214, 117, 0.2)' }));
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${x2},${zeroY} ${xMax},${yEnd} ${xMax},${zeroY}`, fill: 'rgba(239, 106, 90, 0.2)' }));
        }

        if (currentMode === 'area') {
          const p0_v = getY_v(0), p1_v = getY_v(params.area.v0), p2_v = getY_v(phys.vMax);
          const xEnd = getX(phys.tMax);
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${margin.left},${p0_v} ${xEnd},${p0_v} ${xEnd},${p1_v} ${margin.left},${p1_v}`, class: 'fill-rect' }));
          combinedSvg.appendChild(createSvgEl('polygon', { points: `${margin.left},${p1_v} ${xEnd},${p1_v} ${xEnd},${p2_v}`, class: 'fill-tri' }));
          const midX = margin.left + pW / 2;
          if (params.area.v0 > 0) addTextToSvg(combinedSvg, midX, (p0_v + p1_v) / 2 + 4, '矩形面積 = v₀t', 'middle', 'var(--x-color)', 13);
          if (params.area.a > 0) addTextToSvg(combinedSvg, midX, (p1_v + p2_v) / 2 + 8, '三角形面積 = ½at²', 'middle', 'var(--chalk-yellow)', 13);
        }        

        let ptsX = [], ptsV = [];
        const steps = 60;
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * phys.tMax;
          let x = 0, v = 0;
          if (currentMode === 'area') { x = params.area.v0 * t + 0.5 * params.area.a * t * t; v = params.area.v0 + params.area.a * t; }
          else if (currentMode === 'freefall') { x = 0.5 * phys.g * t * t; v = phys.g * t; }
          else if (currentMode === 'special') {
            if (phys.sub === 'throw') { x = params.special.v0 * t - 0.5 * params.special.g * t * t; v = params.special.v0 - params.special.g * t; }
            else if (phys.sub === 'rocket') {
              if (t <= phys.t1) { x = 0.5 * (params.special.v0 / phys.t1) * t * t; v = (params.special.v0 / phys.t1) * t; }
              else if (t <= phys.t2) { const dt = t - phys.t1; x = 0.5 * params.special.v0 * phys.t1 + params.special.v0 * dt - 0.5 * params.special.g * dt * dt; v = params.special.v0 - params.special.g * dt; }
              else { const dt = t - phys.t2; x = phys.xMax - 0.5 * params.special.g * dt * dt; v = -params.special.g * dt; }
            } else { x = params.special.v0 * t - 0.5 * params.special.a_brake * t * t; v = params.special.v0 - params.special.a_brake * t; }
          }
          if (currentMode !== 'area') ptsX.push(`${getX(t)},${getY_x(Math.max(0, x))}`);
          ptsV.push(`${getX(t)},${getY_v(v)}`);
        }

        if (currentMode !== 'area') combinedSvg.appendChild(createSvgEl('polyline', { points: ptsX.join(' '), class: 'curve-x' }));
        combinedSvg.appendChild(createSvgEl('polyline', { points: ptsV.join(' '), class: 'curve-v' }));

        combinedSvg.appendChild(createSvgEl('line', { id: 'svgGuide', class: 'guide-line' }));
        const dotX = createSvgEl('circle', { id: 'svgDotX', r: 6, class: 'dot-x' });
        if (currentMode === 'area') dotX.style.display = 'none';
        combinedSvg.appendChild(dotX);
        combinedSvg.appendChild(createSvgEl('circle', { id: 'svgDotV', r: 6, class: 'dot-v' }));

        phys._getX = getX; phys._getY_x = getY_x; phys._getY_v = getY_v;
      }

      function renderFrame(t, phys) {
        const m = currentMode;
        let x = 0, v = 0;
        
        if (m === 'area') { x = params.area.v0 * t + 0.5 * params.area.a * t * t; v = params.area.v0 + params.area.a * t; }
        else if (m === 'freefall') { x = 0.5 * phys.g * t * t; v = phys.g * t; }
        else if (m === 'special') {
          if (phys.sub === 'throw') { x = params.special.v0 * t - 0.5 * params.special.g * t * t; v = params.special.v0 - params.special.g * t; }
          else if (phys.sub === 'rocket') {
            if (t <= phys.t1) { x = 0.5 * (params.special.v0 / phys.t1) * t * t; v = (params.special.v0 / phys.t1) * t; }
            else if (phys.t2 && t <= phys.t2) { const dt = t - phys.t1; x = 0.5 * params.special.v0 * phys.t1 + params.special.v0 * dt - 0.5 * params.special.g * dt * dt; v = params.special.v0 - params.special.g * dt; }
            else { const dt = t - phys.t2; x = phys.xMax - 0.5 * params.special.g * dt * dt; v = -params.special.g * dt; }
          } else { x = params.special.v0 * t - 0.5 * params.special.a_brake * t * t; v = params.special.v0 - params.special.a_brake * t; }
        }

        if (phys._getX) {
          const cx = phys._getX(t), cy_x = phys._getY_x(Math.max(0, x)), cy_v = phys._getY_v(v);
          const dotX = document.getElementById('svgDotX'), dotV = document.getElementById('svgDotV'), guide = document.getElementById('svgGuide');
          if (dotX && dotV && guide) {
            dotX.setAttribute('cx', cx); dotX.setAttribute('cy', cy_x);
            dotV.setAttribute('cx', cx); dotV.setAttribute('cy', cy_v);
            guide.setAttribute('x1', cx); guide.setAttribute('y1', 20);
            guide.setAttribute('x2', cx); guide.setAttribute('y2', 320);
          }
        }

        const simObj = document.getElementById('simObject');
        const ratio = Math.min(1, Math.max(0, x / (phys.xMax || 1)));

        if (simObj) {
          if (m === 'area' || (m === 'special' && phys.sub === 'brake')) {
            const px = 20 + ratio * 160;
            simObj.setAttribute('transform', `translate(${px}, 0)`);
          } else if (m === 'freefall') {
            const py = 35 + ratio * 240;
            const iron = document.getElementById('ironBall'), feather = document.getElementById('feather');
            if (iron && feather) {
              iron.setAttribute('transform', `translate(80, ${py})`);
              const fy = 35 + (phys.air ? (ratio * 0.6) : ratio) * 240;
              feather.setAttribute('transform', `translate(140, ${fy}) rotate(${phys.air ? Math.sin(t * 10) * 15 : 0})`);
            }
          } else if (m === 'special') {
            const py = 295 - ratio * 250;
            simObj.setAttribute('transform', `translate(0, ${py})`);
            const flame = document.getElementById('flame');
            if (flame) flame.style.display = (phys.sub === 'rocket' && t <= phys.t1) ? 'block' : 'none';
          }
        }

        if (m === 'special') {
          if (phys.sub === 'throw') {
            phaseBadge.className = v > 0 ? 'phase-badge yellow' : 'phase-badge red';
            phaseBadge.textContent = v > 0 ? '🟡 上升減速 (v > 0, a 向下)' : '🔴 下降加速 (v < 0, a 向下)';
          } else if (phys.sub === 'rocket') {
            if (t <= phys.t1) { phaseBadge.className = 'phase-badge blue'; phaseBadge.textContent = '🔵 點火衝刺上升 (a 向上)'; }
            else if (t <= phys.t2) { phaseBadge.className = 'phase-badge yellow'; phaseBadge.textContent = '🟡 慣性減速上升 (a = -g)'; }
            else { phaseBadge.className = 'phase-badge red'; phaseBadge.textContent = '🔴 自由落體下墜 (v < 0)'; }
          } else {
            phaseBadge.className = v > 0 ? 'phase-badge yellow' : 'phase-badge green';
            phaseBadge.textContent = v > 0 ? '🟡 緊急煞車減速中...' : '🟢 完全靜止 (v = 0)';
          }
        } else {
          phaseBadge.className = 'phase-badge blue';
          phaseBadge.textContent = `⏱️ 實驗進行中：t = ${t.toFixed(2)} s`;
        }
      }

      function animate(ts) {
        if (!animStartTime) animStartTime = ts;
        const elapsed = ts - animStartTime;
        const phys = currentPhys;
        const frac = Math.min(1, elapsed / ANIM_DURATION);
        const curTime = frac * phys.tMax;

        progressFill.style.width = `${frac * 100}%`;
        renderFrame(curTime, phys);

        if (frac < 1) {
          animId = requestAnimationFrame(animate);
        } else {
          animId = null; animStartTime = null;
          playBtn.textContent = '🔄 再次播放';
        }
      }

      playBtn.addEventListener('click', () => {
        if (animId) {
          cancelAnimationFrame(animId); animId = null; animStartTime = null;
          playBtn.textContent = '▶ 繼續播放';
        } else {
          playBtn.textContent = '⏸ 暫停播放';
          animId = requestAnimationFrame(animate);
        }
      });

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          if (animId) { cancelAnimationFrame(animId); animId = null; animStartTime = null; }
          playBtn.textContent = '▶ 開始實驗'; progressFill.style.width = '0%';
          initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
