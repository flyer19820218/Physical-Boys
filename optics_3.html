<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-zh="國中自然 光學｜折射原理與日常生活 黑板模擬器" data-en="Optics | Refraction Principles & Daily Phenomena Simulator">國中自然 光學｜折射原理與日常生活 黑板模擬器</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board: #1c3d34;
      --board-dark: #11261f;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #fde047;
      --chalk-green: #4ade80;
      --chalk-pink: #f472b6;
      --chalk-blue: #38bdf8;
      --chalk-gray: #9fb0a8;
      --chalk-orange: #fb923c;
      --chalk-cyan: #55e9ff;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 20px;
      padding: 20px 14px 60px;
      padding-top: 80px;
    }

    /* 🌟 V5 規範：電影式單元封面 */
    body.intro-locked { overflow: hidden; }
    .intro-screen {
        position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
        overflow: hidden; background: #03130f; cursor: pointer; isolation: isolate;
        transition: opacity .7s ease, visibility .7s ease;
    }
    .intro-screen::before {
        content: ""; position: absolute; inset: -3%; z-index: -3;
        /* 👇 老師，圖檔名稱在這裡改！穩穩地在第 48 行左右 */
        background: url("optics_3_cover.jpg") center/cover no-repeat;
        animation: introZoom 9s ease-out both;
        filter: brightness(0.65) contrast(1.1) saturate(1.1);
    }
    .intro-screen::after {
        content: ""; position: absolute; inset: 0; z-index: -2;
        background: radial-gradient(circle, rgba(1,11,11,0) 40%, rgba(1,12,10,0.7) 100%);
        pointer-events: none;
    }
    .intro-screen.exiting { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes introZoom { from { transform: scale(1); } to { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .intro-screen::before { animation: none; } }

    /* 🌟 規範：右上角橫向懸浮雙語切換器 */
    .floating-lang-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: row; align-items: center; gap: 8px;
      padding: 8px 12px; border: 2px solid var(--chalk-blue); border-radius: 12px;
      background: rgba(17, 38, 31, 0.95); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lang-label { color: var(--chalk-blue); font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; user-select: none; margin-left: 4px; }
    .lang-options { display: flex; flex-direction: row; gap: 4px; }
    .lang-pill {
      min-width: 60px; min-height: 48px; padding: 6px 12px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 8px;
      background: transparent; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; touch-action: manipulation;
    }
    .lang-pill.active { background: var(--chalk-blue) !important; color: #0b1a15 !important; border-color: var(--chalk-blue) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .wrap { max-width: 1080px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.15em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-size: 38px; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); color: var(--chalk-yellow); }
    header p { color: var(--chalk-green); max-width: 850px; margin: 0 auto; line-height: 1.6; font-size: 21px; font-weight: bold; }

    /* 🌟 V5 曉臻老師專屬 Hook 區塊 */
    .hook-box { 
        display: flex; align-items: center; gap: 18px;
        background: linear-gradient(135deg, rgba(85, 233, 255, 0.12), rgba(85, 233, 255, 0.02)); 
        border-left: 6px solid var(--chalk-cyan); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; 
        box-shadow: 0 4px 20px rgba(85, 233, 255, 0.08);
        border-right: 1px solid rgba(85, 233, 255, 0.1); border-bottom: 1px solid rgba(85, 233, 255, 0.1); border-top: 1px solid rgba(85, 233, 255, 0.1);
    }
    .xiaozhen-logo { width: 64px; height: 64px; border-radius: 50%; background-color: var(--board); border: 3px solid var(--chalk-cyan); display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; box-shadow: 0 0 15px rgba(85, 233, 255, 0.4); overflow: hidden; }
    .hook-content { flex: 1; line-height: 1.6; }
    .hook-title { color: var(--chalk-cyan); font-size: 22px; font-weight: 900; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .hook-text { color: #fff; font-size: 20px; font-weight: bold; }

    .board {
      background: var(--board); border: 10px solid var(--frame); border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 24px 20px; margin-bottom: 20px; position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 { font-size: 28px; margin: 0 0 16px; font-weight: 700; color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

    /* 模式切換按鈕 */
    .mode-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 20px; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 2px dashed rgba(242, 236, 217, 0.25);
      padding: 14px 12px; min-height: 64px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px; touch-action: manipulation;
    }
    .mode-switch button span.sub { font-size: 16px; font-weight: 400; opacity: 0.8; }
    .mode-switch button:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--chalk-blue); color: var(--chalk); }
    .mode-switch button.active { background: var(--chalk-blue); color: var(--board-dark); border-color: var(--chalk-blue); border-style: solid; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25); }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.9; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 16px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 20px; color: var(--chalk-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-weight: bold; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 8px; background: transparent; cursor: pointer; min-height: 44px; touch-action: manipulation; }

    /* 按鈕防斷行與明亮化 */
    .presets { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .presets span { font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .presets button, .tool-btn {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 2px dashed var(--chalk-dim);
      color: var(--chalk); padding: 10px 18px; min-height: 48px; border-radius: 18px; font-size: 20px; cursor: pointer; transition: all .15s; font-weight: bold;
      touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
    }
    .presets button:hover, .tool-btn:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }
    
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
    .btn-group button {
      all: unset; display: inline-flex; flex: 1; align-items: center; justify-content: center;
      min-height: 48px; padding: 8px 12px; border: 2px solid var(--chalk-blue) !important;
      background: rgba(0, 0, 0, 0.5) !important; color: var(--chalk-blue) !important;
      border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; touch-action: manipulation; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif;
      white-space: nowrap;
    }
    .btn-group button:hover, .btn-group button.active { background: var(--chalk-blue) !important; color: var(--board-dark) !important; }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 16px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; aspect-ratio: 600 / 320; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 14px 10px; text-align: center; border: 1px dashed var(--chalk-dim); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 20px; color: var(--chalk-dim); font-weight: bold; }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--chalk-yellow); font-weight: 700; margin-top: 8px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 6px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 16px 20px; }
    .explain-box h3 { color: var(--chalk-yellow); margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .explain-box p { margin: 0; font-size: 20px; line-height: 1.8; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 4px 12px; border-radius: 6px; color: var(--chalk-yellow); font-weight: 700; display: inline-block; margin: 4px 0; }

    footer { text-align: center; color: var(--chalk-dim); font-size: 20px; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; font-weight: bold; }

    @media (max-width: 768px) {
      .floating-lang-container { top: 8px; right: 8px; padding: 6px 8px; }
      .lang-label { display: none; }
      .mode-switch { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="intro-locked">
  <!-- 🌟 V5 電影式開場動畫 -->
  <div id="introScreen" class="intro-screen" role="dialog" aria-modal="true" aria-label="單元封面" tabindex="0"></div>

  <!-- 🌟 右上角橫向懸浮雙語切換器 -->
  <div class="floating-lang-container">
    <span class="lang-label">Language</span>
    <div class="lang-options">
      <button class="lang-pill active" id="btn-lang-zh" onclick="setLang('zh')">中文</button>
      <button class="lang-pill" id="btn-lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 4-3</div>
      <h1 data-zh="光學三：折射原理與日常生活" data-en="Optics 3: Refraction Principles & Daily Phenomena">光學三：折射原理與日常生活</h1>
      <p data-zh="從爛泥巴轉彎的直觀比喻，到無敵口訣「大角快、小角慢」，一拉滑桿破解水深變淺與天空之城的海市蜃樓！" data-en="From the mud-wheel analogy to 'Faster in larger angles, slower in smaller angles', decode optical illusions like Fata Morgana and magnified fish!">從爛泥巴轉彎的直觀比喻，到無敵口訣「大角快、小角慢」，一拉滑桿破解水深變淺與天空之城的海市蜃樓！</p>
    </header>

    <!-- 🌟 V5 曉臻老師專屬 Hook 區塊 -->
    <div class="hook-box" id="hookBox">
        <!-- JS 動態生成 -->
    </div>

    <div class="board">
      <h2 data-zh="選擇互動教學模式" data-en="Select Interactive Mode">選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="car_mud">
          <span data-zh="🚗 為什麼會折射？" data-en="🚗 Why Refraction Occurs?">🚗 為什麼會折射？</span>
          <span class="sub" data-zh="車輪入爛泥巴物理動畫" data-en="Mud Wheel Physical Animation">車輪入爛泥巴物理動畫</span>
        </button>
        <button data-mode="snells_law">
          <span data-zh="📐 無敵解題口訣" data-en="📐 Universal Problem-Solving Rule">📐 無敵解題口訣</span>
          <span class="sub" data-zh="大角快、小角慢驗證器" data-en="Larger Angle Faster, Smaller Slower">大角快、小角慢驗證器</span>
        </button>
        <button data-mode="coin_water">
          <span data-zh="🪙 實例：硬幣現身" data-en="🪙 Real Life: Coin Reappearing">🪙 實例：硬幣現身</span>
          <span class="sub" data-zh="加水讓視深變淺" data-en="Adding Water Appears Shallower">加水讓視深變淺</span>
        </button>
        <button data-mode="fish_human">
          <span data-zh="🐟 實例：水底看人" data-en="🐟 Real Life: Underwater View">🐟 實例：水底看人</span>
          <span class="sub" data-zh="視深變高，魚的警戒機制" data-en="Apparent Height & Fish Alert">視深變高，魚的警戒機制</span>
        </button>
        <button data-mode="mirage">
          <span data-zh="🔮 蜃景與天空之城" data-en="🔮 Mirages & Castles in Sky">🔮 蜃景與天空之城</span>
          <span class="sub" data-zh="溫度梯度中的連續折射" data-en="Continuous Refraction in a Temperature Gradient">溫度梯度中的連續折射</span>
        </button>
        <button data-mode="total_internal_reflection">
          <span data-zh="🔄 什麼是全反射？" data-en="🔄 What Is Total Internal Reflection?">🔄 什麼是全反射？</span>
          <span class="sub" data-zh="臨界角與全反射條件" data-en="Critical Angle & TIR Conditions">臨界角與全反射條件</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>
      
      <div class="visual-card">
        <svg id="visualSvg" viewBox="-300 -160 600 320">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
              <path d="M 0 2 L 10 5 L 0 8 z" fill="#4ade80" />
            </marker>
          </defs>
          <g id="drawLayer"></g>
        </svg>
      </div>
      
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2 data-zh="課堂重點與原理解析" data-en="Key Concepts & Analysis">課堂重點與原理解析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer data-zh="國中理化 光學單元 · 視覺化互動教學教材" data-en="Junior High Science Optics · Interactive Blackboard">國中理化 光學單元 · 視覺化互動教學教材</footer>
  </div>

  <script>
    (function() {
      // 🌟 V5 開場動畫控制
      const introScreen = document.getElementById('introScreen');
      let introClosed = false;
      function enterLesson() {
          if (introClosed) return;
          introClosed = true;
          introScreen.classList.add('exiting');
          document.body.classList.remove('intro-locked');
          setTimeout(() => introScreen.remove(), 800);
      }
      introScreen.addEventListener('click', enterLesson);

      let currentLang = 'zh';
      let currentMode = 'car_mud';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const drawLayer = document.getElementById('drawLayer');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');

      // 動畫全域變數
      let carAnimTime = 0;
      let isCarPlaying = false;
      let lastTime = performance.now();

      const params = {
        snells_law: { v1: 30, v2: 22, angle: 45 },
        total_internal_reflection: { n1: 1.33, n2: 1.00, angle: 40, pair: 'water_air' },
        mirage: { type: 'desert' }, 
        coin_water: { waterLevel: 0 },
        fish_human: { observer: 'human' }
      };

      // 🌟 曉臻老師 Hook 提問資料庫
      const hooks = {
          'car_mud': {
              zh: "為什麼車子開進爛泥巴會突然轉彎？光線折射的秘密其實就跟車輪一樣！",
              en: "Why does a car suddenly turn when it hits mud? The secret of light refraction is just like those wheels!"
          },
          'snells_law': {
              zh: "每次考試遇到折射角度都背不起來？記住「大角快、小角慢」這個無敵口訣就對了！",
              en: "Can't memorize refraction angles for exams? Just remember the ultimate rule: 'Larger Angle = Faster, Smaller Angle = Slower'!"
          },
          'total_internal_reflection': {
              zh: "光從水裡射向空氣，角度愈來愈大時，為什麼最後竟然完全出不去了？關鍵就在臨界角！",
              en: "When light travels from water to air, why can it eventually stop escaping completely as the angle increases? The key is the critical angle!"
          },
          'mirage': {
              zh: "沙漠地面像有水、海上的船像飄到天空？關鍵是不同高度的空氣溫度不同，讓光線在分層空氣中一路彎曲！",
              en: "Pools on a hot road and ships floating in the sky? Temperature differences with height make light bend continuously through layered air."
          },
          'coin_water': {
              zh: "明明看不見碗裡的硬幣，加了水卻突然浮出來了？難道水有魔法放大鏡的功能嗎？",
              en: "The coin was invisible in the bowl, but pouring water makes it float up? Does water have magic magnifying powers?"
          },
          'fish_human': {
              zh: "為什麼在水底的魚，看岸邊的你會覺得特別巨大？這是魚的超能力還是大自然的錯覺？",
              en: "Why does a fish underwater see you on the shore as a giant? Is it a superpower or nature's illusion?"
          }
      };

      function updateHookBox() {
          const hookBox = document.getElementById('hookBox');
          if(hookBox && hooks[currentMode]) {
              const titleText = currentLang === 'en' ? "👩🏻‍🏫 Teacher Xiaozhen says:" : "👩🏻‍🏫 曉臻老師說：";
              const contentText = currentLang === 'en' ? hooks[currentMode].en : hooks[currentMode].zh;
              hookBox.innerHTML = `<div class="xiaozhen-logo">👩🏻‍🏫</div><div class="hook-content"><div class="hook-title">${titleText}</div><div class="hook-text">${contentText}</div></div>`;
          }
      }

      function tr(zh, en) { return currentLang === 'en' ? en : zh; }

      window.setLang = function(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
        document.querySelectorAll('[data-zh][data-en]').forEach(el => { el.innerHTML = el.getAttribute(`data-${lang}`); });
        initUI();
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { 
          for (let key in attrs) {
            if (key === 'style') el.style.cssText = attrs[key];
            else el.setAttribute(key, attrs[key]);
          }
        }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal', style='') {
        const t = createSvgEl('text', { x: x, y: y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC, sans-serif' });
        if(style) t.style.cssText = style;
        t.textContent = txt;
        parent.appendChild(t);
      }

      // 🌟 消滅黑色！將黑色元素替換為 var(--board-dark)
      function drawHuman(parent, x, y, scale, opacity, label) {
        const h = createSvgEl('g', { opacity: opacity, transform: `translate(${x}, ${y}) scale(${scale})` });
        h.appendChild(createSvgEl('circle', { cx: 0, cy: -10, r: 12, fill: '#ef6a5a' }));
        h.appendChild(createSvgEl('rect', { x: -8, y: 5, width: 16, height: 35, fill: '#ef6a5a', rx: 6 }));
        h.appendChild(createSvgEl('path', { d: `M -8,10 Q -25,20 -15,35`, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 5, 'stroke-linecap': 'round' }));
        h.appendChild(createSvgEl('path', { d: `M 8,10 Q 25,20 15,35`, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 5, 'stroke-linecap': 'round' }));

      function initUI() {
        isCarPlaying = false; carAnimTime = 0;
        updateHookBox(); renderControls(); renderPresets(); updateSimulation();
      }

      function renderControls() {
        controlsBox.replaceChildren();
        presetsBox.replaceChildren();
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, labelZh, labelEn, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div'); div.className = 'control';
          div.innerHTML = `<label>${tr(labelZh, labelEn)} <span class="val" id="val_${id}">${val} ${unit}</span></label><input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">`;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            let newVal = parseFloat(e.target.value); newVal = onChange(newVal); e.target.value = newVal;
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`; updateSimulation();
          });
        };

        if (m === 'car_mud') {
          const div = document.createElement('div'); div.className = 'control'; div.style.gridColumn = '1 / -1'; 
          div.innerHTML = `
            <label>${tr('播放轉向物理動畫', 'Play Physical Turning Animation')} <span class="val">${tr('點擊按鈕', 'Click Button')}</span></label>
            <div class="btn-group" style="margin-top:8px;">
              <button class="tool-btn active" style="border-color:var(--chalk-green) !important;" onclick="playCarAnim()">▶ ${tr('開始 5 秒模擬', 'Start 5s Sim')}</button>
              <button class="tool-btn active" style="border-color:var(--chalk-orange) !important;" onclick="resetCarAnim()">↺ ${tr('重置位置', 'Reset')}</button>
            </div>
          `;
          controlsBox.appendChild(div);

          window.playCarAnim = () => { isCarPlaying = true; if(carAnimTime >= 5) carAnimTime = 0; };
          window.resetCarAnim = () => { isCarPlaying = false; carAnimTime = 0; updateSimulation(); };

        } else if (m === 'snells_law') {
          addSlider('angle', '入射角 θ₁', 'Incident Angle θ₁', 0, 85, 1, p.angle, '°', v => { p.angle = v; return v; });
          addSlider('v1', '介質甲 光速', 'Medium 1 Speed', 10, 30, 1, p.v1, tr('萬 km/s', '0k km/s'), v => { p.v1 = v; return v; });
          addSlider('v2', '介質乙 光速', 'Medium 2 Speed', 10, 30, 1, p.v2, tr('萬 km/s', '0k km/s'), v => { p.v2 = v; return v; });
        } else if (m === 'total_internal_reflection') {
          addSlider('tir_angle', '入射角 θ₁', 'Incident Angle θ₁', 0, 89, 1, p.angle, '°', v => { p.angle = v; return v; });
          const div = document.createElement('div'); div.className = 'control';
          div.innerHTML = `
            <label>${tr('選擇光的行進介質', 'Choose Media Pair')} <span class="val">${p.pair === 'water_air' ? tr('水 ➔ 空氣', 'Water ➔ Air') : tr('玻璃 ➔ 空氣', 'Glass ➔ Air')}</span></label>
            <div class="btn-group" style="margin-top:4px;">
              <button class="tool-btn ${p.pair === 'water_air' ? 'active' : ''}" onclick="setTIRPair('water_air')">💧 ${tr('水 ➔ 空氣', 'Water ➔ Air')}</button>
              <button class="tool-btn ${p.pair === 'glass_air' ? 'active' : ''}" onclick="setTIRPair('glass_air')">🔷 ${tr('玻璃 ➔ 空氣', 'Glass ➔ Air')}</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setTIRPair = (val) => {
            p.pair = val;
            if (val === 'water_air') { p.n1 = 1.33; p.n2 = 1.00; }
            else { p.n1 = 1.50; p.n2 = 1.00; }
            renderControls(); updateSimulation();
          };
        } else if (m === 'mirage') {
          const div = document.createElement('div'); div.className = 'control'; div.style.gridColumn = '1 / -1';
          div.innerHTML = `
            <label>${tr('切換蜃景類型：', 'Switch Mirage Type:')}</label>
            <div class="btn-group">
              <button class="tool-btn ${p.type === 'desert' ? 'active' : ''}" onclick="setMirage('desert')">🏜️ ${tr('沙漠海市蜃樓 (下蜃景)', 'Desert Mirage')}</button>
              <button class="tool-btn ${p.type === 'ocean' ? 'active' : ''}" onclick="setMirage('ocean')">🚢 ${tr('天空之城 (上蜃景)', 'Fata Morgana')}</button>
            </div>

        } else if (m === 'coin_water') {

        } else if (m === 'fish_human') {
          const div = document.createElement('div'); div.className = 'control';
          div.innerHTML = `
            <label>${tr('切換觀察者視角', 'Switch Observer')} <span class="val">${tr('點擊按鈕', 'Click to switch')}</span></label>

      function renderPresets() {
        presetsBox.replaceChildren();
        const m = currentMode;
        if(m === 'snells_law') {
          const span = document.createElement('span'); span.textContent = tr('⚡ 經典介質設定：', '⚡ Presets:'); presetsBox.appendChild(span);

          const addBtn = (labelZh, labelEn, v1, v2) => {
            const b = document.createElement('button'); b.textContent = tr(labelZh, labelEn);

          addBtn('空氣 ➔ 水 (變慢)', 'Air ➔ Water', 30, 22);
          addBtn('玻璃 ➔ 空氣 (變快)', 'Glass ➔ Air', 20, 30);
          addBtn('水 ➔ 玻璃 (微幅變慢)', 'Water ➔ Glass', 22, 20);
        }
      }

      function updateSimulation() {
        while (drawLayer.firstChild) drawLayer.removeChild(drawLayer.firstChild);
        statsGrid.replaceChildren();
        const m = currentMode;
        
        const addStat = (kZh, kEn, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${tr(kZh, kEn)}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'car_mud') {
          const t = carAnimTime; 
          
          drawLayer.appendChild(createSvgEl('rect', { x: -300, y: -160, width: 600, height: 160, fill: '#3b4045' }));
          drawLayer.appendChild(createSvgEl('rect', { x: -300, y: 0, width: 600, height: 160, fill: '#5c4a33' }));
          
          drawLayer.appendChild(createSvgEl('line', { x1: -300, y1: 0, x2: 300, y2: 0, stroke: 'var(--chalk)', 'stroke-width': 2 }));
          addText(drawLayer, -280, -10, tr('平坦柏油路 (速度快)', 'Paved Road (Fast)'), 'start', '#c9c2ab', 18, 'bold');
          addText(drawLayer, -280, 26, tr('爛泥巴區 (速度慢)', 'Muddy Zone (Slow)'), 'start', '#f2d675', 18, 'bold');

          drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: -160, x2: 0, y2: 160, stroke: 'var(--chalk-dim)', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
          addText(drawLayer, 8, -140, tr('法線', 'Normal Line'), 'start', 'var(--chalk-dim)', 18);

          const angle1 = 45 * Math.PI / 180;
          const angle2 = 25 * Math.PI / 180;
          
          drawLayer.appendChild(createSvgEl('line', { x1: -150 * Math.sin(angle1), y1: -150 * Math.cos(angle1), x2: 0, y2: 0, stroke: 'rgba(255,255,255,0.2)', 'stroke-width': 4, 'stroke-dasharray': '8 4' }));
          drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: 150 * Math.sin(angle2), y2: 150 * Math.cos(angle2), stroke: 'rgba(255,255,255,0.2)', 'stroke-width': 4, 'stroke-dasharray': '8 4' }));

          let cx, cy, rot;
          if (t <= 2) {
              let p = t / 2; 
              let d = -130 + p * 110; 
              cx = d * Math.sin(angle1); cy = d * Math.cos(angle1); rot = 45; 
          } else if (t <= 3) {
              let p = t - 2; 
              let startX = -20 * Math.sin(angle1), startY = -20 * Math.cos(angle1);
              let targetX = 20 * Math.sin(angle2), targetY = 20 * Math.cos(angle2);
              cx = startX + (targetX - startX) * p; cy = startY + (targetY - startY) * p;
              let sp = p * p * (3 - 2 * p); rot = 45 + sp * 20; 
          } else {
              let p = (t - 3) / 2; 
              let d = 20 + p * 110; 
              cx = d * Math.sin(angle2); cy = d * Math.cos(angle2); rot = 65; 
          }

          const car = createSvgEl('g', { transform: `translate(${cx}, ${cy}) rotate(${rot})` });
          car.appendChild(createSvgEl('rect', { x: -20, y: -15, width: 40, height: 30, fill: '#ef6a5a', rx: 4 }));
          car.appendChild(createSvgEl('rect', { x: 10, y: -12, width: 8, height: 24, fill: '#8fd0ff', rx: 2 })); 
          // 🌟 消滅黑字：替換成 var(--board-dark)
          car.appendChild(createSvgEl('rect', { x: -15, y: -18, width: 10, height: 4, fill: 'var(--board-dark)', rx: 1 })); 
          car.appendChild(createSvgEl('rect', { x: -15, y: 14, width: 10, height: 4, fill: 'var(--board-dark)', rx: 1 })); 
          
          if (t > 2 && t < 3) {
             car.appendChild(createSvgEl('rect', { x: 10, y: -18, width: 10, height: 4, fill: '#8fd0ff', rx: 1 })); 
             car.appendChild(createSvgEl('rect', { x: 10, y: 14, width: 10, height: 4, fill: '#f2d675', rx: 1 })); 
          } else {
             car.appendChild(createSvgEl('rect', { x: 10, y: -18, width: 10, height: 4, fill: 'var(--board-dark)', rx: 1 })); 
             car.appendChild(createSvgEl('rect', { x: 10, y: 14, width: 10, height: 4, fill: 'var(--board-dark)', rx: 1 })); 
          }
          drawLayer.appendChild(car);

          if (t > 2 && t < 3) {
            addText(drawLayer, 60, -20, tr('右前輪先入泥巴，開始減速！', 'Right wheel in mud slows down!'), 'start', '#f2d675', 18, 'bold');
            addText(drawLayer, 60, 6, tr('左前輪還在柏油路，維持高速！', 'Left wheel still moving fast!'), 'start', '#8fd0ff', 18, 'bold');
            addText(drawLayer, 60, 32, tr('➔ 扭力產生，車頭向右轉 (偏向法線)！', '➔ Torque turns car right (towards normal)!'), 'start', '#ef6a5a', 18, 'bold');
          } else if (t >= 3) {
            addText(drawLayer, 60, 6, tr('雙輪皆進入泥巴，以新角度慢速直行', 'Both wheels in mud, moving slow at new angle'), 'start', '#c9c2ab', 18, 'bold');
          } else if (t > 0) {
            addText(drawLayer, 60, 6, tr('雙輪在平坦路面，高速直行', 'Both wheels on paved road, moving fast'), 'start', '#c9c2ab', 18, 'bold');
          }

          addStat('播放時間', 'Time', `${t.toFixed(1)} s`);
          addStat('車輛狀態', 'Status', t <= 2 ? tr('高速直進', 'Fast Straight') : (t <= 3 ? tr('轉向中...', 'Turning...') : tr('慢速直進', 'Slow Straight')));

          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：為什麼光線會折射？</h3>
            <p>光線就像是一台車子。當光線從<b>疏介質（如空氣，光速快＝柏油路）</b>斜向進入<b>密介質（如玻璃或水，光速慢＝爛泥巴）</b>時，因為「一邊的輪子先碰到爛泥巴減速，另一邊還在高速前進」，車頭就會硬生生地被拉向法線，這就是<b>折射偏折的成因</b>喔！</p>
          `, `
            <h3>💡 Teacher's Analysis: Why Light Refracts</h3>
            <p>Light behaves like a moving vehicle. When light enters obliquely from a <b>faster medium (air = paved road)</b> into a <b>slower medium (water/glass = mud)</b>, the wheel hitting mud first slows down while the other stays fast, naturally pulling the front towards the normal line!</p>
          `);
          
        } else if (m === 'snells_law') {
          const p = params.snells_law;
          const theta1 = p.angle;
          const rad1 = theta1 * Math.PI / 180;
          
          const sinTheta2 = (p.v2 / p.v1) * Math.sin(rad1);
          let theta2 = 0; let isTIR = false;
          if (sinTheta2 >= 1) { isTIR = true; theta2 = theta1; } 
          else { theta2 = Math.asin(sinTheta2) * 180 / Math.PI; }
          const rad2 = theta2 * Math.PI / 180;

          drawLayer.appendChild(createSvgEl('rect', { x: -300, y: -160, width: 600, height: 160, fill: p.v1 >= p.v2 ? 'rgba(95,176,255,0.1)' : 'rgba(239,106,90,0.1)' }));
          drawLayer.appendChild(createSvgEl('rect', { x: -300, y: 0, width: 600, height: 160, fill: p.v2 >= p.v1 ? 'rgba(95,176,255,0.1)' : 'rgba(239,106,90,0.1)' }));
          drawLayer.appendChild(createSvgEl('line', { x1: -300, y1: 0, x2: 300, y2: 0, stroke: 'var(--chalk)', 'stroke-width': 2 }));
          drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: -160, x2: 0, y2: 160, stroke: 'var(--chalk-dim)', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
          
          addText(drawLayer, -280, -10, `${tr('介質甲 (光速', 'Medium 1 (Speed')} ${p.v1} ${tr('萬 km/s)', '0k km/s)')}`, 'start', 'var(--chalk)', 18, 'bold');
          addText(drawLayer, -280, 26, `${tr('介質乙 (光速', 'Medium 2 (Speed')} ${p.v2} ${tr('萬 km/s)', '0k km/s)')}`, 'start', 'var(--chalk)', 18, 'bold');

          const L = 140;
          const incX = -L * Math.sin(rad1); const incY = -L * Math.cos(rad1);
          
          drawLayer.appendChild(createSvgEl('line', { x1: incX, y1: incY, x2: 0, y2: 0, stroke: '#f2d675', 'stroke-width': 3 }));
          drawLayer.appendChild(createSvgEl('polygon', { points: '-6,-6 6,-6 0,6', fill: '#f2d675', transform: `translate(${incX/2}, ${incY/2}) rotate(${-theta1})` }));

          if (isTIR) {
            const refX = L * Math.sin(rad1); const refY = -L * Math.cos(rad1);
            drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: refX, y2: refY, stroke: '#ef6a5a', 'stroke-width': 3 }));
            drawLayer.appendChild(createSvgEl('polygon', { points: '-6,6 6,6 0,-6', fill: '#ef6a5a', transform: `translate(${refX/2}, ${refY/2}) rotate(${theta1})` }));
            addText(drawLayer, 50, 40, tr('💥 發生全反射！', '💥 Total Internal Reflection!'), 'start', '#ef6a5a', 18, 'bold');
          } else {
            const refX = L * Math.sin(rad2); const refY = L * Math.cos(rad2);
            drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: refX, y2: refY, stroke: '#ef6a5a', 'stroke-width': 3 }));
            drawLayer.appendChild(createSvgEl('polygon', { points: '-6,-6 6,-6 0,6', fill: '#ef6a5a', transform: `translate(${refX/2}, ${refY/2}) rotate(${-theta2})` }));
            drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: -incX, y2: -incY, stroke: 'var(--chalk-dim)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));
          }

          const arcR = 40;
          drawLayer.appendChild(createSvgEl('path', { d: `M 0,${-arcR} A ${arcR} ${arcR} 0 0 0 ${-arcR*Math.sin(rad1)} ${-arcR*Math.cos(rad1)}`, fill: 'none', stroke: '#f2d675', 'stroke-width': 2 }));
          addText(drawLayer, -10, -50, `${tr('入射角', 'Incident')} ${theta1.toFixed(1)}°`, 'end', '#f2d675', 16, 'bold');

          if (!isTIR) {
            drawLayer.appendChild(createSvgEl('path', { d: `M 0,${arcR} A ${arcR} ${arcR} 0 0 1 ${arcR*Math.sin(rad2)} ${arcR*Math.cos(rad2)}`, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 2 }));
            addText(drawLayer, 10, 60, `${tr('折射角', 'Refracted')} ${theta2.toFixed(1)}°`, 'start', '#ef6a5a', 16, 'bold');
          }

          addStat('介質甲速度', 'Med 1 Speed', `<i>v<sub>1</sub></i> = ${p.v1}`);
          addStat('介質乙速度', 'Med 2 Speed', `<i>v<sub>2</sub></i> = ${p.v2}`);
          addStat('入射角', 'Incident Ang', `<i>θ<sub>1</sub></i> = ${theta1.toFixed(1)}°`);
          addStat(isTIR ? '反射角' : '折射角', isTIR ? 'Reflected Ang' : 'Refracted Ang', `<i>θ<sub>2</sub></i> = ${theta2.toFixed(1)}°`);

          let relZh = p.v1 > p.v2 ? '光速變慢 ➔ 角度變小 (偏向法線)' : (p.v1 < p.v2 ? '光速變快 ➔ 角度變大 (偏離法線)' : '速度相同 ➔ 不偏折');
          let relEn = p.v1 > p.v2 ? 'Slows down ➔ Angle smaller (Towards normal)' : (p.v1 < p.v2 ? 'Speeds up ➔ Angle larger (Away from normal)' : 'Same speed ➔ No deviation');
          if (isTIR) { relZh = '光速快 ➔ 全反射無法穿透'; relEn = 'Total internal reflection occurs'; }

          explainBox.innerHTML = tr(`
            <h3>💡 老師精闢解析：無敵解題口訣</h3>
            <p>考試遇到折射圖形，請直接默念超好用的判斷口訣：<span class="formula-highlight">大角快、小角慢</span>！<br>
            先判斷入射角和折射角哪一個比較大，<b>角度大的那一側，光速就一定比較快</b>。<br>
            不同介質光速比較：<span class="formula-highlight">真空 > 空氣 > 水 > 玻璃 > 鑽石</span>。<br>
            (目前狀態：${relZh})</p>
          `, `
            <h3>💡 Teacher's Analysis: Universal Solving Rule</h3>
            <p>For refraction diagrams, remember: <span class="formula-highlight">Faster in larger angles, slower in smaller angles</span>!<br>
            Identify which angle is larger—<b>the side with the larger angle always has a faster speed of light</b>.<br>
            Speed in media: <span class="formula-highlight">Vacuum > Air > Water > Glass > Diamond</span>.<br>
            (Current state: ${relEn})</p>
          `);

        } else if (m === 'total_internal_reflection') {
          const p = params.total_internal_reflection;
          const theta1 = p.angle;
          const rad1 = theta1 * Math.PI / 180;
          const canTIR = p.n1 > p.n2;
          const critical = canTIR ? Math.asin(p.n2 / p.n1) * 180 / Math.PI : 90;
          const nearCritical = canTIR && Math.abs(theta1 - critical) < 0.6;
          const isTIR = canTIR && theta1 > critical + 0.6;

          // 上方疏介質、下方密介質，光由下往上射向界面。
          drawLayer.appendChild(createSvgEl('rect', { x: -300, y: -160, width: 600, height: 160, fill: 'rgba(95,176,255,0.10)' }));
          drawLayer.appendChild(createSvgEl('rect', { x: -300, y: 0, width: 600, height: 160, fill: p.pair === 'water_air' ? 'rgba(56,189,248,0.25)' : 'rgba(192,132,252,0.22)' }));
          drawLayer.appendChild(createSvgEl('line', { x1: -300, y1: 0, x2: 300, y2: 0, stroke: 'var(--chalk)', 'stroke-width': 2 }));
          drawLayer.appendChild(createSvgEl('line', { x1: 0, y1: -155, x2: 0, y2: 155, stroke: 'var(--chalk-dim)', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));

          addText(drawLayer, -280, -18, tr(`疏介質：空氣  n = ${p.n2.toFixed(2)}`, `Rarer medium: Air  n = ${p.n2.toFixed(2)}`), 'start', '#8fd0ff', 17, 'bold');
          addText(drawLayer, -280, 28, p.pair === 'water_air' ? tr(`密介質：水  n = ${p.n1.toFixed(2)}`, `Denser medium: Water  n = ${p.n1.toFixed(2)}`) : tr(`密介質：玻璃  n = ${p.n1.toFixed(2)}`, `Denser medium: Glass  n = ${p.n1.toFixed(2)}`), 'start', '#f2d675', 17, 'bold');
          addText(drawLayer, 10, -132, tr('法線', 'Normal'), 'start', 'var(--chalk-dim)', 16);

          const L = 138;
          const incX = -L * Math.sin(rad1);
          const incY = L * Math.cos(rad1);
          drawLayer.appendChild(createSvgEl('line', { x1: incX, y1: incY, x2: 0, y2: 0, stroke: '#f2d675', 'stroke-width': 4 }));
          drawLayer.appendChild(createSvgEl('circle', { cx: incX, cy: incY, r: 5, fill: '#f2d675' }));

          // 入射角弧線。
          const arcR = 42;
          drawLayer.appendChild(createSvgEl('path', { d: `M 0,${arcR} A ${arcR} ${arcR} 0 0 1 ${-arcR*Math.sin(rad1)} ${arcR*Math.cos(rad1)}`, fill: 'none', stroke: '#f2d675', 'stroke-width': 2 }));

              drawHuman(drawLayer, headX, headY, 1, 1, tr('人 (觀察者)', 'Human (Observer)'));
              drawFish(fishX, fishY, 1, tr('真實魚', 'Real Fish'));
              
              drawLayer.appendChild(createSvgEl('line', { x1: fishX, y1: fishY, x2: hitX, y2: 0, stroke: '#ef6a5a', 'stroke-width': 2 }));
              drawLayer.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: headX, y2: headY, stroke: '#f2d675', 'stroke-width': 2 }));
              
              const slope = (0 - headY) / (hitX - headX);
              const virtualFishX = fishX; 
              const virtualFishY = 0 + slope * (virtualFishX - hitX);
              
              drawLayer.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: virtualFishX, y2: virtualFishY, stroke: '#f2d675', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
              drawFish(virtualFishX, virtualFishY, 0.5, tr('魚虛像 (變淺)', 'Virtual Fish (Shallower)'));

              addStat('觀察者', 'Observer', tr('岸上的人', 'Human on Shore'));
              addStat('光線路徑', 'Ray Path', tr('水 ➔ 空氣', 'Water ➔ Air'));
              addStat('看見的像', 'Perceived Image', tr('變淺 (浮起)', 'Shallower (Elevated)'));

              explainBox.innerHTML = tr(`
                <h3>💡 老師精闢解析：人看水裡的魚</h3>
                <p>光線從水裡的魚發出，進入空氣時折射（偏離法線，折射角大）。人的大腦會認為光是「沿著直線」來的，所以視覺向後延伸，就會覺得<span class="formula-highlight">魚的虛像變「淺」了</span>！<br>
                因此，若要去溪邊叉魚，必須瞄準魚的<b>「下方」</b>才叉得到喔！另外，到野外不要以為看到的溪水很淺就跳下去，那時候就會有生命危險了，要特別小心！</p>
              `, `
                <h3>💡 Teacher's Analysis: Human Looking at Fish</h3>
                <p>Light emitted from fish bends away from the normal when entering air. Human eyes trace rays backward in a straight line, perceiving the <span class="formula-highlight">virtual fish as shallower</span> than reality!<br>
                To spear a fish, you must aim <b>below</b> its apparent position! Also, never jump into wild streams assuming water is shallow—it is far deeper than it looks!</p>
              `);
          } else {
              drawFish(fishX, fishY, 1, tr('魚 (觀察者)', 'Fish (Observer)'));
              drawHuman(drawLayer, headX, headY, 1, 1, tr('真實人', 'Real Human'));

              drawLayer.appendChild(createSvgEl('line', { x1: headX, y1: headY, x2: hitX, y2: 0, stroke: '#ef6a5a', 'stroke-width': 2 }));
              drawLayer.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: fishX, y2: fishY, stroke: '#f2d675', 'stroke-width': 2 }));

              const slope = (0 - fishY) / (hitX - fishX);
              const virtualHeadX = headX; 
              const virtualHeadY = 0 + slope * (virtualHeadX - hitX);
              
              drawLayer.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: virtualHeadX, y2: virtualHeadY, stroke: '#f2d675', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
              
              drawHuman(drawLayer, virtualHeadX, virtualHeadY, 1.25, 0.5, tr('人虛像 (變高大)', 'Virtual Human (Taller)'));

              addStat('觀察者', 'Observer', tr('水底的魚', 'Fish Underwater'));
              addStat('光線路徑', 'Ray Path', tr('空氣 ➔ 水', 'Air ➔ Water'));
              addStat('看見的像', 'Perceived Image', tr('變高、變大', 'Taller & Larger'));

              explainBox.innerHTML = tr(`
                <h3>💡 老師精闢解析：水裡的魚看岸邊的人</h3>
                <p>光線從岸上的人發出，進入水中時折射（偏向法線，折射角小）。魚的大腦同樣認為光是直線來的，向後延伸後，水裡的魚看到陸地上的人會覺得<span class="formula-highlight">變高、變大</span>！<br>
                變大、變高的影像對魚類而言，具有保護警戒的效果。因為人靠近的時候會有很大的影像產生，容易讓魚類觀察到而逃離。</p>
              `, `
                <h3>💡 Teacher's Analysis: Fish Looking at Human</h3>
                <p>Light from a human bends towards the normal when entering water. The fish perceives the human as <span class="formula-highlight">taller and larger</span>!<br>
                This magnified image acts as a natural alert mechanism, making approaching predators or humans easily noticeable so the fish can escape.</p>
              `);
          }
        }
      }

      // 動畫主迴圈
      function animationLoop(now) {
          let dt = (now - lastTime) / 1000;
          lastTime = now;
          if (currentMode === 'car_mud' && isCarPlaying) {
              carAnimTime += dt;
              if (carAnimTime >= 5) {
                  carAnimTime = 5;
                  isCarPlaying = false;
              }
              updateSimulation();
          }
          requestAnimationFrame(animationLoop);
      }
      requestAnimationFrame(animationLoop);

      document.querySelectorAll('.mode-switch > button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.mode-switch > button').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          currentMode = e.currentTarget.dataset.mode;
          initUI();
        });
      });

      initUI();
      setLang('zh');
    })();
  </script>
</body>
</html>
