<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中自然 光學｜折射原理與日常生活 黑板模擬器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --board: #1c3d34;
      --board-dark: #15302a;
      --chalk: #f2ecd9;
      --chalk-dim: #c9c2ab;
      --chalk-yellow: #f2d675;
      --x-color: #5fb0ff;
      --v-color: #ef6a5a;
      --frame: #5c4a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--board-dark);
      color: var(--chalk);
      font-family: 'Noto Sans TC', sans-serif;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1300px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--chalk-dim); text-transform: uppercase; }
    h1 { font-family: 'Kalam', cursive; font-size: 2.1rem; font-weight: 700; margin: 6px 0 10px; text-shadow: 0 0 14px rgba(242, 236, 217, 0.15); }
    header p { color: var(--chalk-dim); max-width: 780px; margin: 0 auto; line-height: 1.6; font-size: 0.95rem; }

    .board {
      background: var(--board);
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), inset 0 0 60px rgba(0, 0, 0, 0.25);
      padding: 20px 18px 24px;
      margin-bottom: 20px;
      position: relative;
    }
    .board::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 5px 5px; pointer-events: none; border-radius: 6px;
    }

    .board h2 {
      font-family: 'Kalam', cursive; font-size: 1.25rem; margin: 0 0 14px;
      color: var(--chalk-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    .mode-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .mode-switch button {
      font-family: 'Noto Sans TC', sans-serif; font-size: 0.92rem; font-weight: 700;
      background: rgba(0, 0, 0, 0.25); color: var(--chalk-dim); border: 1.5px solid rgba(242, 236, 217, 0.18);
      padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: all .15s; text-align: left; display: flex; flex-direction: column; gap: 4px;
    }
    .mode-switch button span.sub { font-size: 0.75rem; font-weight: 400; opacity: 0.7; }
    .mode-switch button:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(242, 236, 217, 0.4); }
    .mode-switch button.active {
      background: var(--chalk-yellow); color: var(--board-dark); border-color: var(--chalk-yellow);
      box-shadow: 0 4px 12px rgba(242, 214, 117, 0.25);
    }
    .mode-switch button.active span.sub { color: var(--board-dark); opacity: 0.85; font-weight: 600; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.15); padding: 14px; border-radius: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--chalk-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
    .control label span.val { color: var(--chalk-yellow); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--chalk-yellow); height: 5px; background: transparent; cursor: pointer; }

    .presets { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .presets span { font-size: 0.8rem; color: var(--chalk-dim); margin-right: 4px; }
    .presets button {
      font-family: 'Noto Sans TC', sans-serif; background: transparent; border: 1px dashed var(--chalk-dim);
      color: var(--chalk); padding: 6px 12px; border-radius: 18px; font-size: 0.8rem; cursor: pointer; transition: all .15s;
    }
    .presets button:hover { border-color: var(--chalk-yellow); color: var(--chalk-yellow); background: rgba(242, 214, 117, 0.1); }

    .visual-card { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(242, 236, 217, 0.12); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; margin-top: 10px; }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.04); }
    .stat .k { font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem; color: var(--chalk-dim); }
    .stat .v { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--chalk-yellow); font-weight: 600; margin-top: 3px; }

    .explain-box { margin-top: 18px; background: rgba(0, 0, 0, 0.18); border-left: 4px solid var(--chalk-yellow); border-radius: 0 8px 8px 0; padding: 14px 18px; }
    .explain-box h3 { font-family: 'Kalam', cursive; color: var(--chalk-yellow); margin: 0 0 8px; font-size: 1.1rem; }
    .explain-box p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: var(--chalk); }
    .formula-highlight { font-family: 'JetBrains Mono', monospace; background: rgba(242, 214, 117, 0.15); padding: 2px 8px; border-radius: 4px; color: var(--chalk-yellow); font-weight: 600; display: inline-block; margin: 4px 0; font-style: italic; }
    
    footer { text-align: center; color: var(--chalk-dim); font-size: 0.8rem; margin-top: 28px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Optics Chapter 4-3</div>
      <h1>光學三：折射原理與日常生活</h1>
      <p>從爛泥巴轉彎的直觀比喻，到無敵口訣「大角快、小角慢」，一拉滑桿破解水深變淺與魚變大的自然錯覺！</p>
    </header>

    <div class="board">
      <h2>① 選擇互動教學模式</h2>
      <div class="mode-switch">
        <button class="active" data-mode="car_mud">
          <span>🚗 1. 為什麼會折射？</span>
          <span class="sub">車輪入爛泥巴減速比喻</span>
        </button>
        <button data-mode="snells_law">
          <span>📐 2. 無敵解題口訣</span>
          <span class="sub">大角快、小角慢驗證器</span>
        </button>
        <button data-mode="coin_water">
          <span>🪙 3. 生活實例：硬幣現身</span>
          <span class="sub">加水讓視深變淺</span>
        </button>
        <button data-mode="fish_human">
          <span>🐟 4. 生活實例：水底看人</span>
          <span class="sub">視深變高，魚的警戒機制</span>
        </button>
      </div>

      <div class="controls" id="controlsBox"></div>
      <div class="presets" id="presetsBox"></div>
      <div class="visual-card">
        <svg id="visualSvg" viewBox="-300 -160 600 320"></svg>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="board">
      <h2>② 課堂重點與原理解析</h2>
      <div class="explain-box" id="explainBox"></div>
    </div>

    <footer>國中理化 光學單元 · 視覺化互動教學教材 · 設計：彥君老師</footer>
  </div>

  <script>
    (function() {
      const controlsBox = document.getElementById('controlsBox');
      const presetsBox = document.getElementById('presetsBox');
      const visualSvg = document.getElementById('visualSvg');
      const statsGrid = document.getElementById('statsGrid');
      const explainBox = document.getElementById('explainBox');

      let currentMode = 'car_mud';
      const SVG_NS = 'http://www.w3.org/2000/svg';

      const params = {
        car_mud: { progress: 0 },
        snells_law: { v1: 30, v2: 22, angle: 45 }, // v in 10000 km/s (30=30萬)
        coin_water: { waterLevel: 0 },
        fish_human: { observer: 'human' } // 'human' 或 'fish'
      };

      function createSvgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) { for (let key in attrs) el.setAttribute(key, attrs[key]); }
        return el;
      }

      function addText(parent, x, y, txt, anchor, color, size, weight='normal') {
          const t = createSvgEl('text', { x, y, 'text-anchor': anchor, fill: color, 'font-size': size, 'font-weight': weight, 'font-family': 'Noto Sans TC' });
          t.innerHTML = txt; 
          parent.appendChild(t);
      }

      function initUI() {
        renderControls();
        renderPresets();
        updateSimulation();
      }

      function renderControls() {
        controlsBox.innerHTML = '';
        presetsBox.innerHTML = '';
        const m = currentMode;
        const p = params[m];

        const addSlider = (id, label, min, max, step, val, unit, onChange) => {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>${label} <span class="val" id="val_${id}">${val} ${unit}</span></label>
            <input type="range" id="inp_${id}" min="${min}" max="${max}" step="${step}" value="${val}">
          `;
          controlsBox.appendChild(div);
          div.querySelector('input').addEventListener('input', (e) => {
            let newVal = parseFloat(e.target.value);
            newVal = onChange(newVal);
            e.target.value = newVal;
            document.getElementById(`val_${id}`).textContent = `${newVal} ${unit}`;
            updateSimulation();
          });
        };

        if (m === 'car_mud') {
          addSlider('progress', '拖拉車輛前進', 0, 100, 1, p.progress, '%', v => { p.progress = v; return v; });
        } else if (m === 'snells_law') {
          addSlider('angle', '入射角 <i>θ<sub>1</sub></i>', 0, 85, 1, p.angle, '度', v => { p.angle = v; return v; });
          addSlider('v1', '介質甲 光速', 10, 30, 1, p.v1, '萬公里/s', v => { p.v1 = v; return v; });
          addSlider('v2', '介質乙 光速', 10, 30, 1, p.v2, '萬公里/s', v => { p.v2 = v; return v; });
        } else if (m === 'coin_water') {
          addSlider('waterLevel', '加水進碗裡 (水位高度)', 0, 80, 2, p.waterLevel, 'cm', v => { p.waterLevel = v; return v; });
        } else if (m === 'fish_human') {
          const div = document.createElement('div');
          div.className = 'control';
          div.innerHTML = `
            <label>切換觀察者視角 <span class="val">點擊按鈕</span></label>
            <div style="display:flex; gap:6px; margin-top:4px;">
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.observer === 'human' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.observer === 'human' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setObserver('human')">👨 人看水底的魚</button>
              <button type="button" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--chalk-dim); background:${p.observer === 'fish' ? 'var(--chalk-yellow)' : 'transparent'}; color:${p.observer === 'fish' ? 'var(--board-dark)' : 'var(--chalk)'}; cursor:pointer; font-weight:bold;" onclick="setObserver('fish')">🐟 魚看岸上的人</button>
            </div>
          `;
          controlsBox.appendChild(div);
          window.setObserver = (val) => { p.observer = val; renderControls(); updateSimulation(); };
        }
      }

      function renderPresets() {
        const m = currentMode;
        if(m === 'snells_law') {
            presetsBox.innerHTML = '<span>⚡ 經典介質設定：</span>';
            const p = params.snells_law;
            const addBtn = (label, v1, v2) => {
                const b = document.createElement('button');
                b.textContent = label;
                b.onclick = () => { p.v1 = v1; p.v2 = v2; renderControls(); updateSimulation(); };
                presetsBox.appendChild(b);
            };
            addBtn('空氣 ➔ 水 (變慢偏折)', 30, 22.5);
            addBtn('玻璃 ➔ 空氣 (變快遠離)', 20, 30);
            addBtn('水 ➔ 玻璃 (微幅變慢)', 22.5, 20);
        }
      }

      function updateSimulation() {
        visualSvg.innerHTML = '';
        statsGrid.innerHTML = '';
        const m = currentMode;
        
        const addStat = (k, v) => {
          const d = document.createElement('div'); d.className = 'stat';
          d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; statsGrid.appendChild(d);
        };

        if (m === 'car_mud') {
          const progress = params.car_mud.progress / 100; // 0 to 1
          
          // 背景：上半部柏油路，下半部爛泥巴
          visualSvg.appendChild(createSvgEl('rect', { x: -300, y: -160, width: 600, height: 160, fill: '#3b4045' }));
          visualSvg.appendChild(createSvgEl('rect', { x: -300, y: 0, width: 600, height: 160, fill: '#5c4a33' }));
          
          visualSvg.appendChild(createSvgEl('line', { x1: -300, y1: 0, x2: 300, y2: 0, stroke: 'var(--chalk)', 'stroke-width': 2 }));
          addText(visualSvg, -280, -10, '平坦柏油路 (速度快)', 'start', '#c9c2ab', 14, 'bold');
          addText(visualSvg, -280, 20, '爛泥巴區 (速度慢)', 'start', '#f2d675', 14, 'bold');

          visualSvg.appendChild(createSvgEl('line', { x1: 0, y1: -160, x2: 0, y2: 160, stroke: 'var(--chalk-dim)', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
          addText(visualSvg, 5, -140, '法線', 'start', 'var(--chalk-dim)', 14);

          // 計算車子軌跡
          const angle1 = 45 * Math.PI / 180;
          const angle2 = 25 * Math.PI / 180;
          
          // 軌跡輔助線
          visualSvg.appendChild(createSvgEl('line', { x1: -150 * Math.sin(angle1), y1: -150 * Math.cos(angle1), x2: 0, y2: 0, stroke: 'rgba(255,255,255,0.2)', 'stroke-width': 4, 'stroke-dasharray': '8 4' }));
          visualSvg.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: 150 * Math.sin(angle2), y2: 150 * Math.cos(angle2), stroke: 'rgba(255,255,255,0.2)', 'stroke-width': 4, 'stroke-dasharray': '8 4' }));

          let cx, cy, rot;
          if (progress <= 0.5) {
             const t = progress / 0.5; // 0 to 1
             const dist = -120 * (1 - t);
             cx = dist * Math.sin(angle1);
             cy = dist * Math.cos(angle1);
             rot = 90 - 45; // 直進
          } else {
             const t = (progress - 0.5) / 0.5; // 0 to 1
             const dist = 120 * t;
             cx = dist * Math.sin(angle2);
             cy = dist * Math.cos(angle2);
             rot = 90 - 25; // 偏折
          }

          // 畫車子
          const car = createSvgEl('g', { transform: `translate(${cx}, ${cy}) rotate(${rot})` });
          car.appendChild(createSvgEl('rect', { x: -20, y: -15, width: 40, height: 30, fill: '#ef6a5a', rx: 4 }));
          car.appendChild(createSvgEl('rect', { x: 10, y: -12, width: 8, height: 24, fill: '#8fd0ff', rx: 2 })); // 擋風玻璃
          // 輪子
          car.appendChild(createSvgEl('rect', { x: -15, y: -18, width: 10, height: 4, fill: '#111', rx: 1 }));
          car.appendChild(createSvgEl('rect', { x: -15, y: 14, width: 10, height: 4, fill: '#111', rx: 1 }));
          // 前輪 (右輪先碰泥巴)
          car.appendChild(createSvgEl('rect', { x: 10, y: -18, width: 10, height: 4, fill: '#111', rx: 1 })); // 左前輪
          car.appendChild(createSvgEl('rect', { x: 10, y: 14, width: 10, height: 4, fill: '#f2d675', rx: 1, filter: 'drop-shadow(0 0 5px #f2d675)' })); // 右前輪 (特別標示)

          visualSvg.appendChild(car);

          if (progress > 0.4 && progress < 0.6) {
              addText(visualSvg, 40, -20, '右輪先陷進爛泥巴減速', 'start', '#f2d675', 14, 'bold');
              addText(visualSvg, 40, 0, '左輪仍維持高速', 'start', '#8fd0ff', 14, 'bold');
              addText(visualSvg, 40, 20, '➔ 車頭向右偏轉！', 'start', '#ef6a5a', 14, 'bold');
          }

          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：為什麼光線會折射？</h3>
            <p>光線就像是一台車子。當光線從<b>疏介質（如空氣，光速快＝柏油路）</b>斜向進入<b>密介質（如玻璃或水，光速慢＝爛泥巴）</b>時，因為「一邊的輪子先碰到爛泥巴減速，另一邊還在高速前進」，車頭就會硬生生地被拉向法線，這就是<b>折射偏折的成因</b>喔！</p>
          `;
          
        } else if (m === 'snells_law') {
          const p = params.snells_law;
          const theta1 = p.angle;
          const rad1 = theta1 * Math.PI / 180;
          
          // 司乃耳定律：sin(θ2) = (v2 / v1) * sin(θ1)
          const sinTheta2 = (p.v2 / p.v1) * Math.sin(rad1);
          let theta2 = 0;
          let isTIR = false; // 判斷是否全反射
          if (sinTheta2 >= 1) {
              isTIR = true;
              theta2 = theta1; // 全反射角等於入射角
          } else {
              theta2 = Math.asin(sinTheta2) * 180 / Math.PI;
          }
          const rad2 = theta2 * Math.PI / 180;

          // 背景與法線
          visualSvg.appendChild(createSvgEl('rect', { x: -300, y: -160, width: 600, height: 160, fill: p.v1 >= p.v2 ? 'rgba(95,176,255,0.1)' : 'rgba(239,106,90,0.1)' }));
          visualSvg.appendChild(createSvgEl('rect', { x: -300, y: 0, width: 600, height: 160, fill: p.v2 >= p.v1 ? 'rgba(95,176,255,0.1)' : 'rgba(239,106,90,0.1)' }));
          visualSvg.appendChild(createSvgEl('line', { x1: -300, y1: 0, x2: 300, y2: 0, stroke: 'var(--chalk)', 'stroke-width': 2 }));
          visualSvg.appendChild(createSvgEl('line', { x1: 0, y1: -160, x2: 0, y2: 160, stroke: 'var(--chalk-dim)', 'stroke-width': 2, 'stroke-dasharray': '5 5' }));
          
          addText(visualSvg, -280, -10, `介質甲 (光速 ${p.v1} 萬公里/s)`, 'start', 'var(--chalk)', 14, 'bold');
          addText(visualSvg, -280, 20, `介質乙 (光速 ${p.v2} 萬公里/s)`, 'start', 'var(--chalk)', 14, 'bold');

          // 光線長度
          const L = 140;
          const incX = -L * Math.sin(rad1);
          const incY = -L * Math.cos(rad1);
          
          // 入射線（黃色，由左上向中心，箭頭順向朝右下角）
          visualSvg.appendChild(createSvgEl('line', { x1: incX, y1: incY, x2: 0, y2: 0, stroke: '#f2d675', 'stroke-width': 3 }));
          visualSvg.appendChild(createSvgEl('polygon', { points: '-6,-6 6,-6 0,6', fill: '#f2d675', transform: `translate(${incX/2}, ${incY/2}) rotate(${-theta1})` }));

          if (isTIR) {
              // 全反射線（紅色，由中心往右上彈射）
              const refX = L * Math.sin(rad1);
              const refY = -L * Math.cos(rad1);
              visualSvg.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: refX, y2: refY, stroke: '#ef6a5a', 'stroke-width': 3 }));
              visualSvg.appendChild(createSvgEl('polygon', { points: '-6,6 6,6 0,-6', fill: '#ef6a5a', transform: `translate(${refX/2}, ${refY/2}) rotate(${theta1})` }));
              addText(visualSvg, 50, 40, '💥 發生全反射！', 'start', '#ef6a5a', 16, 'bold');
          } else {
              // 折射線（紅色，由中心往右下折射，箭頭修正為紅色且朝向右下角）
              const refX = L * Math.sin(rad2);
              const refY = L * Math.cos(rad2);
              visualSvg.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: refX, y2: refY, stroke: '#ef6a5a', 'stroke-width': 3 }));
              visualSvg.appendChild(createSvgEl('polygon', { points: '-6,-6 6,-6 0,6', fill: '#ef6a5a', transform: `translate(${refX/2}, ${refY/2}) rotate(${-theta2})` }));
              
              // 虛線（原本直進的方向）
              visualSvg.appendChild(createSvgEl('line', { x1: 0, y1: 0, x2: -incX, y2: -incY, stroke: 'var(--chalk-dim)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));
          }

          // 角度標示
          const arcR = 40;
          visualSvg.appendChild(createSvgEl('path', { d: `M 0,${-arcR} A ${arcR} ${arcR} 0 0 0 ${-arcR*Math.sin(rad1)} ${-arcR*Math.cos(rad1)}`, fill: 'none', stroke: '#f2d675', 'stroke-width': 2 }));
          addText(visualSvg, -10, -50, `入射角 ${theta1.toFixed(1)}°`, 'end', '#f2d675', 13, 'bold');

          if (!isTIR) {
            visualSvg.appendChild(createSvgEl('path', { d: `M 0,${arcR} A ${arcR} ${arcR} 0 0 1 ${arcR*Math.sin(rad2)} ${arcR*Math.cos(rad2)}`, fill: 'none', stroke: '#ef6a5a', 'stroke-width': 2 }));
            addText(visualSvg, 10, 60, `折射角 ${theta2.toFixed(1)}°`, 'start', '#ef6a5a', 13, 'bold');
          }

          addStat('介質甲速度', `<i>v<sub>1</sub></i> = ${p.v1}`);
          addStat('介質乙速度', `<i>v<sub>2</sub></i> = ${p.v2}`);
          addStat('入射角', `<i>θ<sub>1</sub></i> = ${theta1.toFixed(1)}°`);
          addStat(isTIR ? '反射角' : '折射角', `<i>θ<sub>2</sub></i> = ${theta2.toFixed(1)}°`);

          let relation = p.v1 > p.v2 ? '光速變慢 ➔ 角度變小 (偏向法線)' : (p.v1 < p.v2 ? '光速變快 ➔ 角度變大 (偏離法線)' : '速度相同 ➔ 不偏折');
          if (isTIR) relation = '光速快 ➔ 全反射無法穿透';

          explainBox.innerHTML = `
            <h3>💡 老師精闢解析：無敵解題口訣</h3>
            <p>考試遇到折射圖形，請直接默念超好用的判斷口訣：<span class="formula-highlight">大角快、小角慢</span>！<br>
            先判斷入射角和折射角哪一個比較大，<b>角度大的那一側，光速就一定比較快</b>。<br>
            不同介質光速比較：<span class="formula-highlight">真空 > 空氣 > 水 > 玻璃 > 鑽石</span>。<br>
            (目前狀態：${relation})</p>
          `;

        } else if (m === 'coin_water') {
          const wLevel = params.coin_water.waterLevel; // 0 to 80
          const cupWidth = 180, cupHeight = 80; // 寬矮的碗
          const cupY = 100; // 碗底 y
          
          // 畫眼睛 (右上) - 【修正】降低眼睛高度，確保沒水的時候一定被碗壁擋住
          const eyeX = 220, eyeY = -10; 
          visualSvg.appendChild(createSvgEl('path', { d: `M ${eyeX-15} ${eyeY} Q ${eyeX} ${eyeY-15} ${eyeX+15} ${eyeY} Q ${eyeX} ${eyeY+15} ${eyeX-15} ${eyeY}`, fill: 'none', stroke: '#fff', 'stroke-width': 2 }));
          visualSvg.appendChild(createSvgEl('circle', { cx: eyeX, cy: eyeY, r: 5, fill: '#5fb0ff' }));

          // 畫碗
          visualSvg.appendChild(createSvgEl('path', { d: `M ${-cupWidth/2},${cupY-cupHeight} L ${-cupWidth/2},${cupY} L ${cupWidth/2},${cupY} L ${cupWidth/2},${cupY-cupHeight}`, fill: 'none', stroke: 'rgba(255,255,255,0.8)', 'stroke-width': 4 }));
          
          // 畫水
          if (wLevel > 0) {
              visualSvg.appendChild(createSvgEl('rect', { x: -cupWidth/2+2, y: cupY-wLevel, width: cupWidth-4, height: wLevel, fill: 'rgba(95,176,255,0.3)' }));
              visualSvg.appendChild(createSvgEl('line', { x1: -cupWidth/2+2, y1: cupY-wLevel, x2: cupWidth/2-2, y2: cupY-wLevel, stroke: '#5fb0ff', 'stroke-width': 2 }));
          }

          // 畫硬幣 (放在碗底偏左) - 【修正】讓硬幣稍微更靠左，藏進視角死角
          const coinX = -50, coinY = cupY - 5; 
          visualSvg.appendChild(createSvgEl('ellipse', { cx: coinX, cy: coinY, rx: 20, ry: 6, fill: '#f2d675' }));
          addText(visualSvg, coinX - 30, coinY + 4, '硬幣', 'end', '#f2d675', 12, 'bold');

          const blockLineY = cupY - cupHeight; // 碗口邊緣高度
          const blockLineX = cupWidth/2; // 碗口右邊緣

          // 光路計算 (從硬幣出發到眼睛)
          if (wLevel === 0) {
             // 沒水：直線前進
             visualSvg.appendChild(createSvgEl('line', { x1: coinX, y1: coinY, x2: eyeX, y2: eyeY, stroke: '#ef6a5a', 'stroke-width': 2, 'stroke-dasharray': '4 4' }));
             // 判斷是否被碗壁擋住
             const slope = (eyeY - coinY) / (eyeX - coinX);
             const yAtCupEdge = coinY + slope * (blockLineX - coinX);
             
             if (yAtCupEdge > blockLineY) {
                 // 被碗壁擋住
                 addText(visualSvg, 0, -40, '光線被碗壁擋住，看不見硬幣！', 'middle', 'var(--v-color)', 16, 'bold');
             } else {
                 addText(visualSvg, 0, -40, '直線看見硬幣！', 'middle', 'var(--chalk-yellow)', 16, 'bold');
             }
          } else {
             // 有水：折射
             const surfaceY = cupY - wLevel;
             
             // 簡化尋找打在水面上的 X 座標 (使用二分法逼近 Snell's law)
             let left = coinX, right = eyeX, hitX = coinX;
             const nWater = 1.33, nAir = 1.0;
             
             for(let i=0; i<15; i++) {
                 hitX = (left + right) / 2;
                 const dx1 = hitX - coinX, dy1 = surfaceY - coinY;
                 const dx2 = eyeX - hitX, dy2 = eyeY - surfaceY;
                 const sin1 = dx1 / Math.sqrt(dx1*dx1 + dy1*dy1); // 水中入射角的 sin
                 const sin2 = dx2 / Math.sqrt(dx2*dx2 + dy2*dy2); // 空氣折射角的 sin
                 if (nWater * sin1 > nAir * sin2) right = hitX;
                 else left = hitX;
             }

             const slopeAir = (eyeY - surfaceY) / (eyeX - hitX);
             const yAtCupEdge = surfaceY + slopeAir * (blockLineX - hitX);

             if (yAtCupEdge > blockLineY && hitX < blockLineX) {
                 // 折射後仍被碗壁擋住
                 visualSvg.appendChild(createSvgEl('line', { x1: coinX, y1: coinY, x2: hitX, y2: surfaceY, stroke: '#ef6a5a', 'stroke-width': 2 }));
                 visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: surfaceY, x2: eyeX, y2: eyeY, stroke: '#ef6a5a', 'stroke-width': 2, 'stroke-dasharray': '4 4' }));
                 addText(visualSvg, 0, -40, '光線折射，但仍被碗壁擋住', 'middle', 'var(--v-color)', 16, 'bold');
             } else {
                 // 成功折射入眼
                 visualSvg.appendChild(createSvgEl('line', { x1: coinX, y1: coinY, x2: hitX, y2: surfaceY, stroke: '#ef6a5a', 'stroke-width': 2 }));
                 visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: surfaceY, x2: eyeX, y2: eyeY, stroke: '#f2d675', 'stroke-width': 2 }));
                 
                 // 畫虛線延伸尋找虛像
                 const virtualCoinX = coinX; // 近似在正上方
                 const virtualCoinY = surfaceY - slopeAir * (hitX - coinX);
                 
                 visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: surfaceY, x2: virtualCoinX, y2: virtualCoinY, stroke: '#f2d675', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
                 
                 // 畫虛像硬幣
                 visualSvg.appendChild(createSvgEl('ellipse', { cx: virtualCoinX, cy: virtualCoinY, rx: 20, ry: 6, fill: '#f2d675', opacity: 0.5, stroke: '#fff', 'stroke-width': 1 }));
                 addText(visualSvg, virtualCoinX - 30, virtualCoinY + 4, '硬幣虛像', 'end', '#fff', 12, 'bold');
                 
                 visualSvg.appendChild(createSvgEl('path', { d: `M ${virtualCoinX},${coinY-8} L ${virtualCoinX},${virtualCoinY+8}`, stroke: '#4cd964', 'stroke-width': 2, fill: 'none', 'marker-end': 'url(#arrow)' }));
                 addText(visualSvg, virtualCoinX+10, (coinY+virtualCoinY)/2, '浮起！', 'start', '#4cd964', 12, 'bold');
                 
                 addText(visualSvg, 0, -40, '折射讓視深變淺，看見硬幣！', 'middle', 'var(--chalk-yellow)', 16, 'bold');
             }
          }

          visualSvg.innerHTML += `<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 2 L 10 5 L 0 8 z" fill="#4cd964" /></marker></defs>`;

          addStat('水位高度', `${wLevel} cm`);
          addStat('光線路徑', wLevel > 0 ? '水 ➔ 空氣' : '空氣');
          addStat('視覺效果', wLevel > 0 ? '變淺浮起' : '真實深度');

          explainBox.innerHTML = `
            <h3>💡 生活實例：若隱若現的銅板</h3>
            <p>將硬幣放在碗底，挪開一點距離讓自己剛好從側面看不到硬幣。接著緩緩倒入水，漸漸地硬幣又出現了！為什麼？<br>
            光在不同介質傳遞速率不同，當硬幣的光線從水（慢）進入空氣（快）時，產生折射偏折（偏離法線），進入了我們的眼睛。<br>
            簡單來說：<span class="formula-highlight">折射現象讓我們看水裡的東西都變「淺」了！</span></p>
          `;

        } else if (m === 'fish_human') {
          const observer = params.fish_human.observer;
          
          visualSvg.appendChild(createSvgEl('rect', { x: -300, y: 0, width: 600, height: 160, fill: 'rgba(95,176,255,0.2)' }));
          visualSvg.appendChild(createSvgEl('line', { x1: -300, y1: 0, x2: 300, y2: 0, stroke: '#5fb0ff', 'stroke-width': 2 }));
          addText(visualSvg, -280, -10, '空氣 (快)', 'start', 'var(--chalk)', 14, 'bold');
          addText(visualSvg, -280, 20, '水 (慢)', 'start', '#5fb0ff', 14, 'bold');

          const fishX = 150, fishY = 100;
          const headX = -150, headY = -120;
          
          // 畫魚
          const drawFish = (x, y, opacity, label) => {
              const f = createSvgEl('g', { opacity: opacity });
              f.appendChild(createSvgEl('ellipse', { cx: x, cy: y, rx: 20, ry: 10, fill: '#f2d675' }));
              f.appendChild(createSvgEl('polygon', { points: `${x+15},${y} ${x+30},${y-10} ${x+30},${y+10}`, fill: '#f2d675' }));
              f.appendChild(createSvgEl('circle', { cx: x-10, cy: y-2, r: 2, fill: '#000' }));
              addText(f, x, y+20, label, 'middle', '#f2d675', 12, 'bold');
              visualSvg.appendChild(f);
          };
          
          // 畫人
          const drawHuman = (x, y, scale, opacity, label) => {
              const h = createSvgEl('g', { opacity: opacity, transform: `translate(${x}, 0) scale(${scale})` });
              h.appendChild(createSvgEl('circle', { cx: 0, cy: y, r: 15, fill: '#ef6a5a' }));
              h.appendChild(createSvgEl('line', { x1: 0, y1: y+15, x2: 0, y2: 0, stroke: '#ef6a5a', 'stroke-width': 4 }));
              addText(h, 0, y-20, label, 'middle', '#ef6a5a', 12/scale, 'bold');
              visualSvg.appendChild(h);
          };

          // 光路尋根二分法
          let left = headX, right = fishX, hitX = headX;
          const nAir = 1.0, nWater = 1.33;
          for(let i=0; i<15; i++) {
              hitX = (left + right) / 2;
              const dx1 = hitX - headX, dy1 = 0 - headY; // Air
              const dx2 = fishX - hitX, dy2 = fishY - 0; // Water
              const sin1 = dx1 / Math.sqrt(dx1*dx1 + dy1*dy1); 
              const sin2 = dx2 / Math.sqrt(dx2*dx2 + dy2*dy2); 
              if (nAir * sin1 > nWater * sin2) right = hitX;
              else left = hitX;
          }

          if (observer === 'human') {
              // 人看魚：光從魚出發到人
              drawHuman(headX, headY, 1, 1, '人 (觀察者)');
              drawFish(fishX, fishY, 1, '真實魚');
              
              visualSvg.appendChild(createSvgEl('line', { x1: fishX, y1: fishY, x2: hitX, y2: 0, stroke: '#ef6a5a', 'stroke-width': 2 }));
              visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: headX, y2: headY, stroke: '#f2d675', 'stroke-width': 2 }));
              
              // 人大腦反向延伸
              const slope = (0 - headY) / (hitX - headX);
              const virtualFishX = fishX; // 近似
              const virtualFishY = 0 + slope * (virtualFishX - hitX);
              
              visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: virtualFishX, y2: virtualFishY, stroke: '#f2d675', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
              drawFish(virtualFishX, virtualFishY, 0.5, '魚虛像 (變淺)');

              addStat('觀察者', `岸上的人`);
              addStat('光線路徑', `水 ➔ 空氣`);
              addStat('看見的像', `變淺 (浮起)`);

              explainBox.innerHTML = `
                <h3>💡 老師精闢解析：人看水裡的魚</h3>
                <p>光線從水裡的魚發出，進入空氣時折射（偏離法線，折射角大）。人的大腦會認為光是「沿著直線」來的，所以視覺向後延伸，就會覺得<span class="formula-highlight">魚的虛像變「淺」了</span>！<br>
                因此，若要去溪邊叉魚，必須瞄準魚的<b>「下方」</b>才叉得到喔！另外，到野外的溪流或湖泊中，不要以為看到的深度很淺就跳下去，那時候就會有生命危險了，要特別小心！</p>
              `;
          } else {
              // 魚看人：光從人出發到魚
              drawFish(fishX, fishY, 1, '魚 (觀察者)');
              drawHuman(headX, headY, 1, 1, '真實人');

              visualSvg.appendChild(createSvgEl('line', { x1: headX, y1: headY, x2: hitX, y2: 0, stroke: '#ef6a5a', 'stroke-width': 2 }));
              visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: fishX, y2: fishY, stroke: '#f2d675', 'stroke-width': 2 }));

              // 魚大腦反向延伸
              const slope = (0 - fishY) / (hitX - fishX);
              const virtualHeadX = headX; // 近似
              const virtualHeadY = 0 + slope * (virtualHeadX - hitX);
              
              visualSvg.appendChild(createSvgEl('line', { x1: hitX, y1: 0, x2: virtualHeadX, y2: virtualHeadY, stroke: '#f2d675', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
              drawHuman(virtualHeadX, virtualHeadY, 1.3, 0.5, '人虛像 (變高大)');

              addStat('觀察者', `水底的魚`);
              addStat('光線路徑', `空氣 ➔ 水`);
              addStat('看見的像', `變高、變大`);

              explainBox.innerHTML = `
                <h3>💡 老師精闢解析：水裡的魚看岸邊的人</h3>
                <p>光線從岸上的人發出，進入水中時折射（偏向法線，折射角小）。魚的大腦同樣認為光是直線來的，向後延伸後，水裡的魚看到陸地上的人會覺得<span class="formula-highlight">變高、變大</span>！<br>
                變大、變高的影像對魚類而言，具有保護警戒的效果。因為人靠近的時候會有很大的影像產生，容易讓魚類觀察到而逃離。</p>
              `;
          }
        }
      }

      document.querySelectorAll('.mode-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          initUI();
        });
      });

      initUI();
    })();
  </script>
</body>
</html>
