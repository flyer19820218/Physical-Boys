<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡單機械與功的原理：HTML5 互動黑板教學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #11261f;
    --bg-panel: #17332a;
    --bg-panel-hover: #1f4236;
    --chalk-white: #f6f3ea;
    --chalk-muted: #a3b8b0;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-purple: #d4a5a5;
    --rule-color: rgba(246, 243, 234, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg-base);
    color: var(--chalk-white);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    line-height: 1.65;
    padding: 24px 0 80px;
  }

  .wrap {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 2px dashed var(--rule-color);
    padding-bottom: 20px;
  }

  h1 {
    font-size: 36px;
    margin: 0 0 10px 0;
    color: var(--chalk-yellow);
    letter-spacing: 2px;
    font-weight: 700;
  }

  header p {
    margin: 0;
    color: var(--chalk-muted);
    font-size: 21px;
  }

  /* 乾淨導覽列 (嚴禁數字前綴) */
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .tab-btn {
    flex: 1;
    min-width: 200px;
    padding: 16px 14px;
    font-size: 20px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.05);
    color: var(--chalk-muted);
    border: 2px dashed var(--rule-color);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }

  .tab-btn:hover {
    background: var(--bg-panel-hover);
    color: var(--chalk-white);
  }

  .tab-btn.active {
    background: #1f4236;
    color: var(--chalk-yellow);
    border: 2px solid var(--chalk-yellow);
    box-shadow: 0 0 16px rgba(255, 224, 102, 0.25);
  }

  /* 嚴格單一版面 Grid (一大格垂直堆疊，投影最適配) */
  .grid-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .panel {
    background: var(--bg-panel);
    border: 2px solid var(--rule-color);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--rule-color);
    padding-bottom: 14px;
  }

  h2 {
    margin: 0;
    font-size: 28px;
    color: var(--chalk-white);
  }

  .sub-tag {
    font-size: 18px;
    color: var(--bg-base);
    background: var(--chalk-yellow);
    padding: 4px 16px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* 畫布區域：嚴格零黑色原則，滿版大視野 */
  .stage-container {
    width: 100%;
    border: 2px solid var(--rule-color);
    border-radius: 12px;
    overflow: hidden;
    background: #0d201a;
    position: relative;
    margin-bottom: 20px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .controls {
    background: rgba(255, 255, 255, 0.04);
    padding: 22px;
    border-radius: 12px;
    border: 1px solid var(--rule-color);
    margin-bottom: 20px;
  }

  .control-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }

  .control-group:last-child {
    margin-bottom: 0;
  }

  label {
    font-weight: 700;
    color: var(--chalk-teal);
    font-size: 21px;
  }

  input[type=range] {
    flex: 1;
    height: 12px;
    accent-color: var(--chalk-yellow);
    cursor: pointer;
  }

  .readout-badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--bg-base);
    background: var(--chalk-yellow);
    padding: 4px 16px;
    border-radius: 8px;
    min-width: 110px;
    text-align: center;
    font-size: 19px;
  }

  .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    color: var(--chalk-white);
    background: rgba(255, 255, 255, 0.04);
    padding: 22px;
    border-radius: 12px;
    border: 1px dashed var(--rule-color);
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: space-around;
  }

  .stats span {
    background: rgba(0, 0, 0, 0.2);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .stats b {
    color: var(--chalk-yellow);
  }

  .note {
    font-size: 20px;
    color: var(--chalk-white);
    line-height: 1.8;
    background: rgba(255, 255, 255, 0.05);
    padding: 24px;
    border-radius: 12px;
    border-left: 6px solid var(--chalk-yellow);
  }

  .note ul {
    margin: 10px 0 0 0;
    padding-left: 28px;
  }

  .note li {
    margin-bottom: 10px;
  }

  /* 理化專用標準上下垂直分式規範 */
  .fraction {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .fraction .numerator {
    border-bottom: 2px solid var(--chalk-white);
    padding-bottom: 2px;
    font-size: 0.9em;
  }

  .fraction .denominator {
    padding-top: 2px;
    font-size: 0.9em;
  }

  .formula-box {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255, 255, 255, 0.06);
    padding: 16px 24px;
    border-radius: 10px;
    border: 1px solid var(--rule-color);
    margin: 16px 0;
    text-align: center;
    font-size: 23px;
    color: var(--chalk-teal);
  }

  .btn-switch {
    padding: 12px 24px;
    border: 2px solid var(--chalk-teal);
    background: transparent;
    color: var(--chalk-teal);
    border-radius: 8px;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-switch:hover, .btn-switch.active {
    background: var(--chalk-teal);
    color: var(--bg-base);
  }

  .prop-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    overflow: hidden;
  }
  .prop-table th, .prop-table td {
    padding: 14px;
    text-align: center;
    border: 1px solid var(--rule-color);
    font-size: 20px;
  }
  .prop-table th {
    background: rgba(77, 210, 255, 0.15);
    color: var(--chalk-teal);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚙️ 簡單機械與功的原理</h1>
    <p>國中自然科核心單元：功的黃金鐵律、槓桿拔釘演練、輪軸滑輪與斜面螺旋</p>
  </header>

  <!-- 嚴格分頁規範：乾淨命名直擊概念，嚴禁數字前綴 -->
  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('tab1')">簡單機械與功</div>
    <div class="tab-btn" onclick="switchTab('tab2')">槓桿與拔釘演練</div>
    <div class="tab-btn" onclick="switchTab('tab3')">輪軸與滑輪系統</div>
    <div class="tab-btn" onclick="switchTab('tab4')">斜面與螺旋原理</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">簡單機械之目的與功的黃金鐵律</h2>
      <span id="panel-badge" class="sub-tag">能量守恆</span>
    </div>

    <!-- 嚴格單一版面 Grid：一大格垂直堆疊配置，視線最聚焦 -->
    <div class="grid-container">
      <!-- 1. 動態畫布 (滿版大視野) -->
      <div class="stage-container">
        <canvas id="stage" width="960" height="440"></canvas>
      </div>

      <!-- 2. 控制列與物理數據顯示 -->
      <div>
        <div class="controls" id="dynamic-controls">
          <!-- 內容由 JS 動態生成 -->
        </div>
        <div class="stats" id="dynamic-stats">
          <!-- 數據由 JS 動態生成 -->
        </div>
      </div>

      <!-- 3. 名師授課筆記 -->
      <div class="note" id="note-text">
        <!-- 授課筆記由 JS 動態生成 -->
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  let currentTab = 'tab1';
  let animationFrame;
  let animTime = 0;

  // 物理互動操作與狀態變數
  let t1_f = 50, t1_s = 4;
  let t2_arm_eff = 30, t2_arm_res = 5, t2_res_force = 600;
  let t3_mode = 'pulley'; // 'pulley' or 'wheel'
  let t4_mode = 'screw', t4_len = 6, t4_h = 2; // 預設展示最精彩的自轉木動螺旋捲動

  const dynamicControls = document.getElementById('dynamic-controls');
  const dynamicStats = document.getElementById('dynamic-stats');

  function switchTab(tab) {
    currentTab = tab;
    cancelAnimationFrame(animationFrame);
    animTime = 0;

    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');

    const title = document.getElementById('panel-title');
    const badge = document.getElementById('panel-badge');
    const note = document.getElementById('note-text');

    if (tab === 'tab1') {
      title.textContent = '簡單機械之目的與功的黃金鐵律';
      badge.textContent = '能量守恆';
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>施力大小 (<span style="white-space: nowrap;">F</span>)：</label>
          <input id="rng-t1-f" type="range" min="20" max="100" step="10" value="${t1_f}">
          <span id="val-t1-f" class="readout-badge">${t1_f} N</span>
        </div>
        <div class="control-group">
          <label>施力位移 (<span style="white-space: nowrap;">S</span>)：</label>
          <input id="rng-t1-s" type="range" min="1" max="10" step="1" value="${t1_s}">
          <span id="val-t1-s" class="readout-badge">${t1_s} m</span>
        </div>
        <div style="text-align:center; color:var(--chalk-teal); font-size:19px; margin-top:10px;">
          👉 觀察「省力必費距離」：輸入功的總量 <span style="white-space: nowrap;">W = F × S</span> 恆定不變！
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>何謂簡單機械：</b>能協助人類作功的單純工具，如槓桿、輪軸、滑輪、齒輪、斜面與螺旋。</li>
          <li><b>使用目的三大核心：</b>
            <br>① <span style="white-space: nowrap;"><b>省力</b></span>：施力小於物重，但必定<span style="white-space: nowrap;"><b>費距離（費時）</b></span>。
            <br>② <span style="white-space: nowrap;"><b>省時</b></span>：施力距離小於物體移動距離，但必定<span style="white-space: nowrap;"><b>費力</b></span>。
            <br>③ <span style="white-space: nowrap;"><b>操作方便</b></span>：僅改變施力方向（如定滑輪），不省力亦不費力。
          </li>
          <li><b>功的原理 (黃金鐵律)：</b>任何簡單機械<span style="white-space: nowrap;"><b>絕對無法省功！</b></span> 在無摩擦力之理想狀態下，操作者輸入之總功，必等於機械對物體輸出之功。
            <div class="formula-box">
              <span style="white-space: nowrap;">W施 = W抗 👉 F施 × S施 = F抗 × S抗</span>
            </div>
          </li>
        </ul>
      `;

      document.getElementById('rng-t1-f').addEventListener('input', e => { t1_f = parseFloat(e.target.value); document.getElementById('val-t1-f').textContent = t1_f + ' N'; updateTab1(); });
      document.getElementById('rng-t1-s').addEventListener('input', e => { t1_s = parseFloat(e.target.value); document.getElementById('val-t1-s').textContent = t1_s + ' m'; updateTab1(); });

      updateTab1();
      animateTab1();
    }
    else if (tab === 'tab2') {
      title.textContent = '槓桿分類與鐵撬拔釘演練';
      badge.textContent = '實戰試題';
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>握柄施力臂 (<span style="white-space: nowrap;">L施</span>)：</label>
          <input id="rng-eff" type="range" min="15" max="45" step="5" value="${t2_arm_eff}">
          <span id="val-eff" class="readout-badge">${t2_arm_eff} cm</span>
        </div>
        <div class="control-group">
          <label>拔釘抗力臂 (<span style="white-space: nowrap;">L抗</span>)：</label>
          <input id="rng-res" type="range" min="3" max="10" step="1" value="${t2_arm_res}">
          <span id="val-res" class="readout-badge">${t2_arm_res} cm</span>
        </div>
        <div class="control-group">
          <label>鐵釘阻力 (<span style="white-space: nowrap;">F抗</span>)：</label>
          <input id="rng-res-f" type="range" min="300" max="900" step="50" value="${t2_res_force}">
          <span id="val-res-f" class="readout-badge">${t2_res_force} N</span>
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>槓桿分類與必考生活實例大彙整：</b>
            <table class="prop-table">
              <tr><th>類別</th><th>結構特徵</th><th>機械特性</th><th>必考常見實例</th></tr>
              <tr><td><b>第一類</b></td><td>支點在中間</td><td>可省力或費力</td><td>剪刀、翹蹺板、拔釘器、<b style="color:var(--chalk-green);">天平</b>、鉗子</td></tr>
              <tr><td><b>第二類</b></td><td>抗力在中間</td><td><b style="color:var(--chalk-yellow);">恆省力費時</b></td><td>手推車、開瓶器、裁紙刀、胡桃鉗、鍘刀</td></tr>
              <tr><td><b>第三類</b></td><td>施力在中間</td><td><b style="color:var(--chalk-coral);">恆費力省時</b></td><td>筷子、麵包夾、釣魚竿、<b style="color:var(--chalk-coral);">掃把</b>、手臂前臂</td></tr>
            </table>
          </li>
          <li><b>鐵撬拔釘解析 (對齊經典教材圖解)：</b>
            <br>👉 <span style="white-space: nowrap;"><b>丁 (支點)</b></span>：彎肘頂點接觸木板表面； <span style="white-space: nowrap;"><b>甲 (施力點)</b></span>：長柄握把端。
            <br>👉 <span style="white-space: nowrap;"><b>乙 (施力臂)</b></span>：長邊桿身； <span style="white-space: nowrap;"><b>丙 (抗力點)</b></span>：短邊扣住鐵釘帽處。
            <div class="formula-box">
              <span style="white-space: nowrap;">F施 = <div class="fraction"><span class="numerator">F抗 × L抗</span><span class="denominator">L施</span></div></span> （因為 <span style="white-space: nowrap;">L施 > L抗</span> ，恆省力！）
            </div>
          </li>
        </ul>
      `;

      document.getElementById('rng-eff').addEventListener('input', e => { t2_arm_eff = parseFloat(e.target.value); document.getElementById('val-eff').textContent = t2_arm_eff + ' cm'; updateTab2(); });
      document.getElementById('rng-res').addEventListener('input', e => { t2_arm_res = parseFloat(e.target.value); document.getElementById('val-res').textContent = t2_arm_res + ' cm'; updateTab2(); });
      document.getElementById('rng-res-f').addEventListener('input', e => { t2_res_force = parseFloat(e.target.value); document.getElementById('val-res-f').textContent = t2_res_force + ' N'; updateTab2(); });

      updateTab2();
      animateTab2();
    }
    else if (tab === 'tab3') {
      title.textContent = '輪軸結構與滑輪系統比較';
      badge.textContent = '轉動機械';
      
      dynamicControls.innerHTML = `
        <div style="display:flex; justify-content:center; gap:16px; margin-bottom:14px;">
          <button class="btn-switch ${t3_mode==='pulley'?'active':''}" onclick="setTab3Mode('pulley', this)">定滑輪 vs 動滑輪</button>
          <button class="btn-switch ${t3_mode==='wheel'?'active':''}" onclick="setTab3Mode('wheel', this)">輪軸結構與應用</button>
        </div>
        <div style="text-align:center; color:var(--chalk-teal); font-size:19px;">
          ${t3_mode==='pulley' ? '👉 定滑輪僅改方向；動滑輪省一半力，但拉繩距離是上升高度的 2 倍！' : '👉 輪走一圈軸也走一圈。施力在輪 (半徑大) 恆省力；施力在軸恆費力！'}
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>定滑輪：</b>轉動軸心固定。視為等臂槓桿（<span style="white-space: nowrap;">R = r</span>），故施力 <span style="white-space: nowrap;">F = W</span>。<b>不省力亦不費力，目的在改變施力方向</b>（如升旗）。</li>
          <li><b>動滑輪：</b>滑輪隨重物一同升降。支點在一側切線，施力臂為半徑 2 倍（<span style="white-space: nowrap;">2R</span>），抗力臂為半徑（<span style="white-space: nowrap;">R</span>）。
            <div class="formula-box">
              <span style="white-space: nowrap;">F施 = <div class="fraction"><span class="numerator">W</span><span class="denominator">2</span></div></span> （省一半力，但拉繩距離 <span style="white-space: nowrap;">S = 2h</span>）
            </div>
          </li>
          <li><b>輪軸原理：</b>同軸心旋轉之大輪與小軸。喇叭鎖、螺絲起子、方向盤皆為<span style="white-space: nowrap;"><b>施力於輪之省力機械</b></span>；竹蜻蜓、擀面棍則為<span style="white-space: nowrap;"><b>施力於軸之省時機械</b></span>。</li>
        </ul>
      `;

      updateTab3();
      animateTab3();
    }
    else if (tab === 'tab4') {
      title.textContent = '斜面與雙螺旋自轉捲動模擬';
      badge.textContent = '連續位移';
      
      dynamicControls.innerHTML = `
        <div style="display:flex; justify-content:center; gap:16px; margin-bottom:16px;">
          <button class="btn-switch ${t4_mode==='screw'?'active':''}" onclick="setTab4Mode('screw', this)">雙斜面自轉捲動 (螺距 d)</button>
          <button class="btn-switch ${t4_mode==='inclined'?'active':''}" onclick="setTab4Mode('inclined', this)">斜面推力計算</button>
        </div>
        <div id="inc-sub-controls" style="display:${t4_mode==='inclined'?'block':'none'};">
          <div class="control-group">
            <label>斜面長度 (<span style="white-space: nowrap;">L</span>)：</label>
            <input id="rng-inc-l" type="range" min="3" max="10" step="1" value="${t4_len}">
            <span id="val-inc-l" class="readout-badge">${t4_len} m</span>
          </div>
          <div class="control-group">
            <label>斜面高度 (<span style="white-space: nowrap;">h</span>)：</label>
            <input id="rng-inc-h" type="range" min="1" max="4" step="0.5" value="${t4_h}">
            <span id="val-inc-h" class="readout-badge">${t4_h} m</span>
          </div>
        </div>
        <div id="screw-hint" style="display:${t4_mode==='screw'?'block':'none'}; text-align:center; color:var(--chalk-yellow); font-size:19px;">
          ✨ 物理轉動展示：木條原地旋轉（看表面縱紋轉動），前 4 秒等速將斜面紙條捲入，捲完第 4 秒立即剎車停止轉動！停留 2 秒看清楚定型之螺距 d！
        </div>

  function animateTab4() {
    if (currentTab !== 'tab4') return;
    ctx.clearRect(0, 0, 960, 440);
    animTime += 0.03;

    if (t4_mode === 'inclined') {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 26px Noto Sans TC';
      ctx.fillText('斜面省力推析：以長度換取輕鬆推力', 250, 45);

      let bx = 160, by = 350;
      let sw = 640, sh = (t4_h / 4) * 220;

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + sw, by); ctx.lineTo(bx + sw, by - sh); ctx.closePath(); ctx.stroke();

      let prog = (Math.sin(animTime) + 1) / 2;
      let cx = bx + prog * sw, cy = by - prog * sh;

      ctx.save();
      ctx.translate(cx, cy);
      let inc_angle = Math.atan2(-sh, sw);
      ctx.rotate(inc_angle);
      ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-45, -50, 60, 50);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-45, -50, 60, 50);
      ctx.restore();

      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px JetBrains Mono';
      ctx.fillText(`高度 h = ${t4_h}m`, bx + sw + 20, by - sh/2);
      ctx.fillText(`斜面長 L = ${t4_len}m`, bx + sw/2 - 60, by - sh/2 - 30);
    } else {
      // 100% 真實物理轉動：木條表面有「木紋線」隨之旋轉！
      // 6秒一循環：0~4秒旋轉把紙條吃進去，第4~6秒停止旋轉，停留2秒清楚展示定型後的螺距！
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 25px Noto Sans TC';
      ctx.fillText('雙斜面木條自轉捲動模擬：角度恆定、愈捲愈短印出螺距 d', 140, 38);

      let cycleTime = animTime % 6;
      let roll_prog = 0;
      let isSpinning = false;
      if (cycleTime < 4) {
        roll_prog = cycleTime / 4; // 0 ~ 1 旋轉吃入
        isSpinning = true;
      } else {
        roll_prog = 1; // 捲完停止轉動，停留展示！
        isSpinning = false;
      }

      // === 上列：緩斜面自轉捲動 (坡度緩 -> 螺距小 d 小 -> 極致省力) ===
      let r_y = 190;
      let cyl_r_x = 760, cyl_w = 45, cyl_h = 110;
      
      // 1. 繪製自轉木條圓柱底框
      ctx.fillStyle = '#1e2f27'; ctx.fillRect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h);
      
      // 🌟 核心升級：畫出隨著旋轉位移的「縱向木紋線」，一眼看出木條在轉！
      ctx.save();
      ctx.beginPath(); ctx.rect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h); ctx.clip();
      ctx.strokeStyle = 'rgba(163, 184, 176, 0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        let angle = roll_prog * Math.PI * 2 * 4 + (i * Math.PI * 2 / 3);
        let gx = cyl_r_x + cyl_w/2 + (cyl_w/2 - 5) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(gx, r_y - cyl_h); ctx.lineTo(gx, r_y); ctx.stroke();
      }
      ctx.restore();

      // 頂部旋轉指示箭頭 (轉動時旋轉，停止時靜止)
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      let topAng1 = roll_prog * Math.PI * 2 * 4;
      ctx.beginPath(); ctx.arc(cyl_r_x + cyl_w/2, r_y - cyl_h - 12, 16, topAng1, topAng1 + Math.PI * 1.3); ctx.stroke();

      // 2. 正在被捲入的直角三角形紙條 (坡度完全固定，越捲越短)
      let max_len2 = 540;
      let cur_len2 = max_len2 * (1 - roll_prog); // 轉到最後完全包入 0
      if (cur_len2 > 0) {
        let slope2 = cyl_h / max_len2; 
        let cur_h2 = cur_len2 * slope2; 
        let base_l2_x = cyl_r_x - cur_len2;
        ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(base_l2_x, r_y); ctx.lineTo(cyl_r_x, r_y); ctx.lineTo(cyl_r_x, r_y - cur_h2); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 224, 102, 0.15)'; ctx.fill();
      }

      // 3. 在圓柱表面烙印出密集的傾斜螺紋 (螺距小 d 小)
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
      let count2 = Math.floor(roll_prog * 6) + 1;
      for(let i = 0; i < count2; i++) {
        let y = r_y - 10 - i * 18;
        if (y >= r_y - cyl_h) {
          ctx.beginPath(); ctx.moveTo(cyl_r_x, y); ctx.lineTo(cyl_r_x + cyl_w, y - 8); ctx.stroke();
        }
      }
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 21px Noto Sans TC';
      if (!isSpinning) {
        ctx.fillText('✨ 捲繞完成！螺紋密、螺距 d 小 (極省力)', 120, r_y - 45);
      } else {
        ctx.fillText('緩斜面捲動中... ➔ 螺紋密、螺距 d 小', 120, r_y - 45);
      }

      // === 下列：陡斜面自轉捲動 (坡度陡 -> 螺距大 d 大 -> 費力省時) ===
      let l_y = 380;
      
      // 1. 繪製自轉木條底框與木紋線
      ctx.fillStyle = '#1e2f27'; ctx.fillRect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h);
      
      ctx.save();
      ctx.beginPath(); ctx.rect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h); ctx.clip();
      ctx.strokeStyle = 'rgba(163, 184, 176, 0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        let angle = roll_prog * Math.PI * 2 * 2 + (i * Math.PI * 2 / 3);
        let gx = cyl_r_x + cyl_w/2 + (cyl_w/2 - 5) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(gx, l_y - cyl_h); ctx.lineTo(gx, l_y); ctx.stroke();
      }
      ctx.restore();

      // 頂部旋轉箭頭
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      let topAng2 = roll_prog * Math.PI * 2 * 2;
      ctx.beginPath(); ctx.arc(cyl_r_x + cyl_w/2, l_y - cyl_h - 12, 16, topAng2, topAng2 + Math.PI * 1.3); ctx.stroke();

      // 2. 正在被捲入的陡斜面紙條 (越捲越短)
      let max_len1 = 240;
      let cur_len1 = max_len1 * (1 - roll_prog); 
      if (cur_len1 > 0) {
        let slope1 = cyl_h / max_len1; 
        let cur_h1 = cur_len1 * slope1; 
        let base_l1_x = cyl_r_x - cur_len1;
        ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(base_l1_x, l_y); ctx.lineTo(cyl_r_x, l_y); ctx.lineTo(cyl_r_x, l_y - cur_h1); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 128, 64, 0.15)'; ctx.fill();
      }

      // 3. 在圓柱表面烙印出稀疏的傾斜螺紋 (螺距大 d 大)
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 5;
      let count1 = Math.floor(roll_prog * 2.5) + 1;
      for(let i = 0; i < count1; i++) {
        let y = l_y - 15 - i * 42;
        if (y >= l_y - cyl_h) {
          ctx.beginPath(); ctx.moveTo(cyl_r_x, y); ctx.lineTo(cyl_r_x + cyl_w, y - 18); ctx.stroke();
        }
      }
      ctx.fillStyle = '#ff8040'; ctx.font = 'bold 21px Noto Sans TC';
      if (!isSpinning) {
        ctx.fillText('✨ 捲繞完成！螺紋疏、螺距 d 大 (費力省時)', 120, l_y - 45);
      } else {
        ctx.fillText('陡斜面捲動中... ➔ 螺紋疏、螺距 d 大', 120, l_y - 45);
      }
    }

    animationFrame = requestAnimationFrame(animateTab4);
  }

  // 初始化啟動
  switchTab('tab1');
</script>
