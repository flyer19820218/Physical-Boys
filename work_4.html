<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡單機械與功的原理：HTML5 互動黑板教學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #11261f;
    --bg-panel: #17332a;
    --bg-panel-hover: #1f4236;
    --chalk-white: #f6f3ea;
    --chalk-muted: #a3b8b0;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-purple: #d4a5a5;
    --rule-color: rgba(246, 243, 234, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg-base);
    color: var(--chalk-white);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    line-height: 1.65;
    padding: 24px 0 80px;
  }

  .wrap {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 2px dashed var(--rule-color);
    padding-bottom: 20px;
  }

  h1 {
    font-size: 36px;
    margin: 0 0 10px 0;
    color: var(--chalk-yellow);
    letter-spacing: 2px;
    font-weight: 700;
  }

  header p {
    margin: 0;
    color: var(--chalk-muted);
    font-size: 21px;
  }

  /* 乾淨導覽列 (嚴禁數字前綴) */
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .tab-btn {
    flex: 1;
    min-width: 200px;
    padding: 16px 14px;
    font-size: 20px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.05);
    color: var(--chalk-muted);
    border: 2px dashed var(--rule-color);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }

  .tab-btn:hover {
    background: var(--bg-panel-hover);
    color: var(--chalk-white);
  }

  .tab-btn.active {
    background: #1f4236;
    color: var(--chalk-yellow);
    border: 2px solid var(--chalk-yellow);
    box-shadow: 0 0 16px rgba(255, 224, 102, 0.25);
  }

  /* 嚴格單一版面 Grid (一大格垂直堆疊，投影最適配) */
  .grid-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .panel {
    background: var(--bg-panel);
    border: 2px solid var(--rule-color);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--rule-color);
    padding-bottom: 14px;
  }

  h2 {
    margin: 0;
    font-size: 28px;
    color: var(--chalk-white);
  }

  .sub-tag {
    font-size: 18px;
    color: var(--bg-base);
    background: var(--chalk-yellow);
    padding: 4px 16px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* 畫布區域：嚴格零黑色原則，滿版大視野 */
  .stage-container {
    width: 100%;
    border: 2px solid var(--rule-color);
    border-radius: 12px;
    overflow: hidden;
    background: #0d201a;
    position: relative;
    margin-bottom: 20px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .controls {
    background: rgba(255, 255, 255, 0.04);
    padding: 22px;
    border-radius: 12px;
    border: 1px solid var(--rule-color);
    margin-bottom: 20px;
  }

  .control-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }

  .control-group:last-child {
    margin-bottom: 0;
  }

  label {
    font-weight: 700;
    color: var(--chalk-teal);
    font-size: 21px;
  }

  input[type=range] {
    flex: 1;
    height: 12px;
    accent-color: var(--chalk-yellow);
    cursor: pointer;
  }

  .readout-badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--bg-base);
    background: var(--chalk-yellow);
    padding: 4px 16px;
    border-radius: 8px;
    min-width: 110px;
    text-align: center;
    font-size: 19px;
  }

  .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    color: var(--chalk-white);
    background: rgba(255, 255, 255, 0.04);
    padding: 22px;
    border-radius: 12px;
    border: 1px dashed var(--rule-color);
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: space-around;
  }

  .stats span {
    background: rgba(0, 0, 0, 0.2);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .stats b {
    color: var(--chalk-yellow);
  }

  .note {
    font-size: 20px;
    color: var(--chalk-white);
    line-height: 1.8;
    background: rgba(255, 255, 255, 0.05);
    padding: 24px;
    border-radius: 12px;
    border-left: 6px solid var(--chalk-yellow);
  }

  .note ul {
    margin: 10px 0 0 0;
    padding-left: 28px;
  }

  .note li {
    margin-bottom: 10px;
  }

  /* 理化專用標準上下垂直分式規範 */
  .fraction {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .fraction .numerator {
    border-bottom: 2px solid var(--chalk-white);
    padding-bottom: 2px;
    font-size: 0.9em;
  }

  .fraction .denominator {
    padding-top: 2px;
    font-size: 0.9em;
  }

  .formula-box {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255, 255, 255, 0.06);
    padding: 16px 24px;
    border-radius: 10px;
    border: 1px solid var(--rule-color);
    margin: 16px 0;
    text-align: center;
    font-size: 23px;
    color: var(--chalk-teal);
  }

  .btn-switch {
    padding: 10px 20px;
    border: 2px solid var(--chalk-teal);
    background: transparent;
    color: var(--chalk-teal);
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-switch:hover, .btn-switch.active {
    background: var(--chalk-teal);
    color: var(--bg-base);
  }

  .prop-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    overflow: hidden;
  }
  .prop-table th, .prop-table td {
    padding: 14px;
    text-align: center;
    border: 1px solid var(--rule-color);
    font-size: 20px;
  }
  .prop-table th {
    background: rgba(77, 210, 255, 0.15);
    color: var(--chalk-teal);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚙️ 簡單機械與功的原理</h1>
    <p>國中自然科核心單元：功的黃金鐵律、銳角拔釘演練、輪軸實例解剖與斜面螺旋</p>
  </header>

  <!-- 嚴格分頁規範：乾淨命名直擊概念，嚴禁數字前綴 -->
  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('tab1')">簡單機械與功</div>
    <div class="tab-btn" onclick="switchTab('tab2')">槓桿與拔釘演練</div>
    <div class="tab-btn" onclick="switchTab('tab3')">輪軸與滑輪系統</div>
    <div class="tab-btn" onclick="switchTab('tab4')">斜面與螺旋原理</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">簡單機械之目的與功的黃金鐵律</h2>
      <span id="panel-badge" class="sub-tag">能量守恆</span>
    </div>

    <!-- 嚴格單一版面 Grid：一大格垂直堆疊配置，視線最聚焦 -->
    <div class="grid-container">
      <!-- 1. 動態畫布 (滿版大視野) -->
      <div class="stage-container">
        <canvas id="stage" width="960" height="440"></canvas>
      </div>

      <!-- 2. 控制列與物理數據顯示 -->
      <div>
        <div class="controls" id="dynamic-controls">
          <!-- 內容由 JS 動態生成 -->
        </div>
        <div class="stats" id="dynamic-stats">
          <!-- 數據由 JS 動態生成 -->
        </div>
      </div>

      <!-- 3. 名師授課筆記 -->
      <div class="note" id="note-text">
        <!-- 授課筆記由 JS 動態生成 -->
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  let currentTab = 'tab1';
  let animationFrame;
  let animTime = 0;

  // 物理互動操作與狀態變數
  let t1_f = 50, t1_s = 4;
  let t2_arm_eff = 30, t2_arm_res = 5, t2_res_force = 600;
  let t2_show_arm = false; // 🌟 決定是否顯示垂直力臂測驗與線段
  let t3_mode = 'wheel';
  let t3_wheel_item = 'pencil';
  let t4_mode = 'inclined', t4_len = 6, t4_h = 2;

  const dynamicControls = document.getElementById('dynamic-controls');
  const dynamicStats = document.getElementById('dynamic-stats');

  function switchTab(tab) {
    currentTab = tab;
    cancelAnimationFrame(animationFrame);
    animTime = 0;

    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');

    const title = document.getElementById('panel-title');
    const badge = document.getElementById('panel-badge');
    const note = document.getElementById('note-text');

    if (tab === 'tab1') {
      title.textContent = '簡單機械之目的與功的黃金鐵律';
      badge.textContent = '能量守恆';
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>施力大小 (<span style="white-space: nowrap;">F</span>)：</label>
          <input id="rng-t1-f" type="range" min="20" max="100" step="10" value="${t1_f}">
          <span id="val-t1-f" class="readout-badge">${t1_f} N</span>
        </div>
        <div class="control-group">
          <label>施力位移 (<span style="white-space: nowrap;">S</span>)：</label>
          <input id="rng-t1-s" type="range" min="1" max="10" step="1" value="${t1_s}">
          <span id="val-t1-s" class="readout-badge">${t1_s} m</span>
        </div>
        <div style="text-align:center; color:var(--chalk-teal); font-size:19px; margin-top:10px;">
          👉 觀察「省力必費距離」：輸入功的總量 <span style="white-space: nowrap;">W = F × S</span> 恆定不變！
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>何謂簡單機械：</b>能協助人類作功的單純工具，如槓桿、輪軸、滑輪、齒輪、斜面與螺旋。</li>
          <li><b>使用目的三大核心：</b>
            <br>① <span style="white-space: nowrap;"><b>省力</b></span>：施力小於物重，但必定<span style="white-space: nowrap;"><b>費距離（費時）</b></span>。
            <br>② <span style="white-space: nowrap;"><b>省時</b></span>：施力距離小於物體移動距離，但必定<span style="white-space: nowrap;"><b>費力</b></span>。
            <br>③ <span style="white-space: nowrap;"><b>操作方便</b></span>：僅改變施力方向（如定滑輪），不省力亦不費力。
          </li>
          <li><b>功的原理 (黃金鐵律)：</b>任何簡單機械<span style="white-space: nowrap;"><b>絕對無法省功！</b></span> 在無摩擦力之理想狀態下，操作者輸入之總功，必等於機械對物體輸出之功。
            <div class="formula-box">
              <span style="white-space: nowrap;">W施 = W抗 👉 F施 × S施 = F抗 × S抗</span>
            </div>
          </li>
        </ul>
      `;

      document.getElementById('rng-t1-f').addEventListener('input', e => { t1_f = parseFloat(e.target.value); document.getElementById('val-t1-f').textContent = t1_f + ' N'; updateTab1(); });
      document.getElementById('rng-t1-s').addEventListener('input', e => { t1_s = parseFloat(e.target.value); document.getElementById('val-t1-s').textContent = t1_s + ' m'; updateTab1(); });

      updateTab1();
      animateTab1();
    }
    else if (tab === 'tab2') {
      title.textContent = '槓桿分類與銳角鐵撬拔釘演練';
      badge.textContent = '實戰試題';
      
      dynamicControls.innerHTML = `
        <div style="display:flex; justify-content:center; margin-bottom:18px;">
          <button class="btn-switch ${t2_show_arm?'active':''}" style="border-color:var(--chalk-yellow); color:${t2_show_arm?'var(--bg-base)':'var(--chalk-yellow)'}; background:${t2_show_arm?'var(--chalk-yellow)':'transparent'};" onclick="toggleLeverArm(this)">📐 考考你：顯示垂直力臂與省力倍率</button>
        </div>
        <div class="control-group">
          <label>握柄施力臂 (<span style="white-space: nowrap;">L施</span>)：</label>
          <input id="rng-eff" type="range" min="15" max="45" step="5" value="${t2_arm_eff}">
          <span id="val-eff" class="readout-badge">${t2_arm_eff} cm</span>
        </div>
        <div class="control-group">
          <label>拔釘抗力臂 (<span style="white-space: nowrap;">L抗</span>)：</label>
          <input id="rng-res" type="range" min="3" max="10" step="1" value="${t2_arm_res}">
          <span id="val-res" class="readout-badge">${t2_arm_res} cm</span>
        </div>
        <div class="control-group">
          <label>鐵釘阻力 (<span style="white-space: nowrap;">F抗</span>)：</label>
          <input id="rng-res-f" type="range" min="300" max="900" step="50" value="${t2_res_force}">
          <span id="val-res-f" class="readout-badge">${t2_res_force} N</span>
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>槓桿分類與必考生活實例大彙整 (🌟 全套生動圖示版)：</b>
            <table class="prop-table">
              <tr><th>類別</th><th>結構特徵</th><th>機械特性</th><th>必考常見實例 (圖示)</th></tr>
              <tr><td><b>第一類</b></td><td>支點在中間</td><td>可省力或費力</td><td>✂️ 剪刀、⚖️ 翹蹺板、🔨 拔釘器、⚖️ <b style="color:var(--chalk-green);">天平</b>、🔧 鉗子</td></tr>
              <tr><td><b>第二類</b></td><td>抗力在中間</td><td><b style="color:var(--chalk-yellow);">恆省力費時</b></td><td>🛒 手推車、🍾 開瓶器、🔪 裁紙刀、🥜 胡桃鉗、🗜️ 鍘刀</td></tr>
              <tr><td><b>第三類</b></td><td>施力在中間</td><td><b style="color:var(--chalk-coral);">恆費力省時</b></td><td>🥢 筷子、🥖 麵包夾、🎣 釣魚竿、🧹 <b style="color:var(--chalk-coral);">掃把</b>、💪 手臂前臂</td></tr>
            </table>
          </li>
          <li><b>銳角鐵撬拔釘幾何解析 (對齊經典實例)：</b>
            <br>👉 <span style="white-space: nowrap;"><b>丁 (支點)</b></span>：羊角轉折凸點接觸木板表面； <span style="white-space: nowrap;"><b>甲 (施力點)</b></span>：長柄握把端。
            <br>👉 <span style="white-space: nowrap;"><b>乙 (施力臂)</b></span>：長邊桿身； <span style="white-space: nowrap;"><b>丙 (抗力點)</b></span>：短邊分叉處扣住鐵釘平頭。
            <div class="formula-box">
              <span style="white-space: nowrap;">F施 = <div class="fraction"><span class="numerator">F抗 × L抗</span><span class="denominator">L施</span></div></span> （夾角約 60 度銳角，長柄壓下輕鬆拔起！）
            </div>
          </li>
        </ul>
      `;

      document.getElementById('rng-eff').addEventListener('input', e => { t2_arm_eff = parseFloat(e.target.value); document.getElementById('val-eff').textContent = t2_arm_eff + ' cm'; updateTab2(); });
      document.getElementById('rng-res').addEventListener('input', e => { t2_arm_res = parseFloat(e.target.value); document.getElementById('val-res').textContent = t2_arm_res + ' cm'; updateTab2(); });
      document.getElementById('rng-res-f').addEventListener('input', e => { t2_res_force = parseFloat(e.target.value); document.getElementById('val-res-f').textContent = t2_res_force + ' N'; updateTab2(); });

      updateTab2();
      animateTab2();
    }
    else if (tab === 'tab3') {
      title.textContent = '輪軸與滑輪：靜態幾何結構特展';
      badge.textContent = '轉動機械';
      
      dynamicControls.innerHTML = `
        <div style="display:flex; justify-content:center; gap:16px; margin-bottom:16px;">
          <button class="btn-switch ${t3_mode==='wheel'?'active':''}" onclick="setTab3Mode('wheel', this)">輪軸生活實例解剖</button>
          <button class="btn-switch ${t3_mode==='pulley'?'active':''}" onclick="setTab3Mode('pulley', this)">定滑輪 vs 動滑輪</button>
        </div>
        <div id="wheel-sub-controls" style="display:${t3_mode==='wheel'?'flex':'none'}; justify-content:center; gap:8px; flex-wrap:wrap;">
          <button class="btn-switch ${t3_wheel_item==='copter'?'active':''}" style="font-size:16px; padding:6px 12px;" onclick="setWheelItem('copter', this)">竹蜻蜓 / 擀麵棍 🚁</button>
          <button class="btn-switch ${t3_wheel_item==='pencil'?'active':''}" style="font-size:16px; padding:6px 12px;" onclick="setWheelItem('pencil', this)">削鉛筆機 ✏️</button>
          <button class="btn-switch ${t3_wheel_item==='faucet'?'active':''}" style="font-size:16px; padding:6px 12px;" onclick="setWheelItem('faucet', this)">水龍頭 🚰</button>
          <button class="btn-switch ${t3_wheel_item==='doorknob'?'active':''}" style="font-size:16px; padding:6px 12px;" onclick="setWheelItem('doorknob', this)">喇叭門把 🚪</button>
          <button class="btn-switch ${t3_wheel_item==='screwdriver'?'active':''}" style="font-size:16px; padding:6px 12px;" onclick="setWheelItem('screwdriver', this)">螺絲起子 🪛</button>
          <button class="btn-switch ${t3_wheel_item==='wheel'?'active':''}" style="font-size:16px; padding:6px 12px;" onclick="setWheelItem('wheel', this)">方向盤 ☸️</button>
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>輪軸原理：</b>同軸心旋轉之大輪與小軸。半徑大者為輪 (<span style="white-space: nowrap;">R</span>)，半徑小者為軸 (<span style="white-space: nowrap;">r</span>)。
            <div class="formula-box">
              <span style="white-space: nowrap;">F × R = W × r 👉 F = <div class="fraction"><span class="numerator">r</span><span class="denominator">R</span></div> × W</span>
            </div>
          </li>
          <li><b>輪軸實例大判讀 (必考！看清楚手握在輪還是軸)：</b>
            <br>👉 <span style="white-space: nowrap;"><b>施力於輪 (省力費時)</b></span>：削鉛筆機把手、水龍頭手柄、門把、螺絲起子粗柄、汽車方向盤、喇叭鎖。
            <br>👉 <span style="white-space: nowrap;"><b>施力於軸 (費力省時)</b></span>：竹蜻蜓手搓細桿、擀麵棍手握細軸、汽車轉動輪胎、電風扇馬達帶動扇葉。
          </li>

  function animateTab2() {
    if (currentTab !== 'tab2') return;
    ctx.clearRect(0, 0, 960, 440);
    animTime += 0.03;

    // 1. 底部厚實木板
    ctx.fillStyle = '#a3b8b0'; ctx.fillRect(180, 320, 600, 60);
    ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(180, 320, 600, 60);
    for(let i=338; i<=365; i+=15) {
      ctx.beginPath(); ctx.moveTo(195, i); ctx.lineTo(765, i); ctx.stroke();
    }

    // 2. 支點 丁：羊角轉折凸點接觸木板表面
    let cx = 520, cy = 320;
    ctx.fillStyle = '#33cc99'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
    ctx.fillText('丁 (支點)', cx - 45, cy + 35);

    // 3. 銳角羊角鐵撬模擬 (夾角 60 度銳角，整支統一橘色 #ff8040)
    let tilt = Math.sin(animTime) * 0.1 - 0.05; 
    ctx.save();
    ctx.translate(cx, cy); 
    ctx.rotate(tilt);

    // 握柄往左上 (-140度)，拔釘爪往左 (-175度)，夾角相差約 35~60 度銳角！統一繪製為亮橘色！
    let hx = 230 * Math.cos(-140 * Math.PI / 180);
    let hy = 230 * Math.sin(-140 * Math.PI / 180);
    let cx_tip = 85 * Math.cos(-175 * Math.PI / 180);
    let cy_tip = 85 * Math.sin(-175 * Math.PI / 180);

    ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(0, 0);
    ctx.lineTo(cx_tip, cy_tip);
    ctx.stroke();

    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 20px Noto Sans TC';
    ctx.fillText('乙 (施力臂 L施)', -180, -45);
    ctx.fillStyle = '#ffe066'; ctx.font = 'bold 22px Noto Sans TC';
    ctx.fillText('甲 (施力點)', -260, -165);
    ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 20px Noto Sans TC';
    ctx.fillText('丙 (抗力點)', -105, -30);

    // 🌟 鐵釘連動拔出：厚度 38px 的平頭鐵釘 (扁平水平 T 字帽)
    ctx.save();
    ctx.translate(cx_tip, cy_tip);
    ctx.rotate(-tilt); 
    ctx.fillStyle = '#f6f3ea'; ctx.fillRect(-8, 0, 16, 65); // 粗壯實心釘身
    ctx.fillRect(-19, -8, 38, 8); // 🌟 厚實平的鐵釘頭！
    ctx.restore();

    // 施力 F 箭頭 (垂直壓下長柄端)
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - 20, hy + 70); ctx.stroke();
    ctx.fillStyle = '#ffe066'; 
    ctx.beginPath(); ctx.moveTo(hx - 20, hy + 70); ctx.lineTo(hx - 8, hy + 64); ctx.lineTo(hx - 32, hy + 56); ctx.fill();
    ctx.font = 'bold 20px JetBrains Mono'; ctx.fillText('F施 (下壓)', -350, -80);

    ctx.restore();

    // 🌟 互動考題：顯示垂直力臂水平線段
    if (t2_show_arm) {
      let hx_global = cx + hx * Math.cos(tilt) - hy * Math.sin(tilt);
      let tip_x_global = cx + cx_tip * Math.cos(tilt) - cy_tip * Math.sin(tilt);

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(cx, cy - 80); ctx.lineTo(hx_global, cy - 80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx_global, cy - 80); ctx.lineTo(hx_global, cy + hx * Math.sin(tilt) + hy * Math.cos(tilt)); ctx.stroke();
      
      ctx.strokeStyle = '#4dd2ff';
      ctx.beginPath(); ctx.moveTo(cx, cy - 40); ctx.lineTo(tip_x_global, cy - 40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tip_x_global, cy - 40); ctx.lineTo(tip_x_global, cy + cx_tip * Math.sin(tilt) + cy_tip * Math.cos(tilt)); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 21px JetBrains Mono';
      ctx.fillText(`L施 = ${t2_arm_eff}cm`, (cx + hx_global)/2 - 50, cy - 90);
      ctx.fillStyle = '#4dd2ff';
      ctx.fillText(`L抗 = ${t2_arm_res}cm`, (cx + tip_x_global)/2 - 40, cy - 50);
    }

    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 26px Noto Sans TC';
    ctx.fillText('銳角鐵撬拔釘幾何還原：60度銳角、統一橘色與金屬平頭鐵釘', 130, 45);

    animationFrame = requestAnimationFrame(animateTab2);
  }

      let m_wheel_x = 700;
      let m_wheel_y = 230 - offset_mov; 

      ctx.fillStyle = '#a3b8b0'; ctx.fillRect(620, 60, 160, 12);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(m_wheel_x - 45, 72); ctx.lineTo(m_wheel_x - 45, m_wheel_y); ctx.stroke();

      let hand_y_mov = 150 - offset_mov * 2;
      ctx.beginPath(); ctx.moveTo(m_wheel_x + 45, m_wheel_y); ctx.lineTo(m_wheel_x + 45, hand_y_mov); ctx.stroke();
      
      ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(m_wheel_x, m_wheel_y, 45, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#f6f3ea'; ctx.beginPath(); ctx.arc(m_wheel_x, m_wheel_y, 7, 0, Math.PI*2); ctx.fill();

      let box_y_mov = m_wheel_y + 45;
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(m_wheel_x, m_wheel_y); ctx.lineTo(m_wheel_x, box_y_mov); ctx.stroke();
      ctx.fillStyle = '#ff8040'; ctx.fillRect(m_wheel_x - 25, box_y_mov, 50, 50);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(m_wheel_x - 25, box_y_mov, 50, 50);
      ctx.fillStyle = '#11261f'; ctx.font = 'bold 20px JetBrains Mono'; ctx.fillText('W', m_wheel_x - 6, box_y_mov + 32);

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(m_wheel_x + 45, hand_y_mov); ctx.lineTo(m_wheel_x + 45, hand_y_mov - 45); ctx.stroke();
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.moveTo(m_wheel_x + 45, hand_y_mov - 45); ctx.lineTo(m_wheel_x + 36, hand_y_mov - 32); ctx.lineTo(m_wheel_x + 54, hand_y_mov - 32); ctx.fill();
      ctx.fillText('F=W/2', m_wheel_x + 60, hand_y_mov - 15);
      ctx.fillStyle = '#33cc99'; ctx.font = 'bold 21px Noto Sans TC'; ctx.fillText('動滑輪：繩拉2倍、力省一半', 580, 380);

    } else {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 25px Noto Sans TC';
      ctx.fillText('輪軸靜態結構解剖：亮青色為【大輪 R】 vs 亮橘色為【小軸 r】', 140, 40);

      // === 左區：基礎同心圓幾何模型 ===
      let cx = 260, cy = 240;
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 110, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 45, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#f6f3ea'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 110, cy); ctx.stroke();
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 45); ctx.stroke();

      ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 20px Noto Sans TC'; ctx.fillText('大輪 (半徑 R)', cx - 110, cy - 15);
      ctx.fillStyle = '#ff8040'; ctx.fillText('小軸 (半徑 r)', cx + 15, cy - 25);
      ctx.fillStyle = '#a3b8b0'; ctx.font = '18px Noto Sans TC'; ctx.fillText('▲ 同心旋轉幾何模型', cx - 90, cy + 150);

      // === 右區：100% 靜態實例工整剖面繪圖 (🌟 移除所有虛線，文字上下置中絕不重疊) ===
      let rx = 700, ry = 240;
      ctx.save();
      ctx.translate(rx, ry);

      // 🌟 採用 textAlign='center' 保證文字在物件上方下方垂直對齊、零重疊
      ctx.textAlign = 'center';

      if (t3_wheel_item === 'copter') {
        // 1. 竹蜻蜓 (純淨無虛線版)
        ctx.fillStyle = '#ff8040'; ctx.fillRect(-10, -10, 20, 130);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-10, -10, 20, 130);

        ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-130, -32, 260, 22);
        ctx.strokeStyle = '#f6f3ea'; ctx.strokeRect(-130, -32, 260, 22);

        // 🌟 垂直置中標示，徹底告別排版重疊！
        ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 22px Noto Sans TC'; ctx.fillText('寬長葉片為【大輪 R】(極省時！)', 0, -60);
        ctx.fillStyle = '#ff8040'; ctx.fillText('手搓細桿為【小軸 r】(費力)', 0, 155);
      }
      else if (t3_wheel_item === 'pencil') {
        // 2. 削鉛筆機 (純淨無虛線版)
        ctx.fillStyle = '#ffe066'; ctx.fillRect(-170, -15, 80, 24);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-170, -15, 80, 24);
        ctx.fillStyle = '#ff8040'; ctx.beginPath(); ctx.moveTo(-90, -15); ctx.lineTo(-70, -3); ctx.lineTo(-90, 9); ctx.fill();
        ctx.fillStyle = '#11261f'; ctx.beginPath(); ctx.arc(-70, -3, 3, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#1e382b'; ctx.fillRect(-90, -75, 120, 150);
        ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(-90, -75, 120, 150);
        ctx.beginPath(); ctx.moveTo(-90, 25); ctx.lineTo(30, 25); ctx.stroke();
        ctx.beginPath(); ctx.arc(-30, 50, 6, 0, Math.PI*2); ctx.stroke();

        ctx.fillStyle = '#ff8040'; ctx.fillRect(30, -25, 30, 44);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(30, -25, 30, 44);

        let crank_center_x = 45, crank_center_y = -3;
        ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(crank_center_x, crank_center_y); ctx.lineTo(crank_center_x, -93); ctx.lineTo(crank_center_x + 50, -93); ctx.stroke();
        ctx.fillStyle = '#ffe066'; ctx.fillRect(crank_center_x + 40, -120, 22, 54);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(crank_center_x + 40, -120, 22, 54);

        ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 22px Noto Sans TC'; ctx.fillText('手搖把手為【大輪 R】(極省力)', -20, -135);
        ctx.fillStyle = '#ff8040'; ctx.fillText('中心滾刀為【小軸 r】', -20, 115);
      }
      else if (t3_wheel_item === 'faucet') {
        // 3. 水龍頭 (純淨無虛線版)
        ctx.fillStyle = '#a3b8b0'; ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 3;
        ctx.fillRect(-35, 80, 70, 20); ctx.strokeRect(-35, 80, 70, 20);
        ctx.fillRect(-25, -10, 50, 90); ctx.strokeRect(-25, -10, 50, 90);
        
        ctx.lineWidth = 24; ctx.lineCap = 'round'; ctx.strokeStyle = '#a3b8b0';
        ctx.beginPath(); ctx.moveTo(-5, 20); ctx.quadraticCurveTo(-70, 20, -70, 70); ctx.stroke();
        ctx.lineWidth = 3; ctx.strokeStyle = '#f6f3ea';
        ctx.beginPath(); ctx.moveTo(-5, 8); ctx.quadraticCurveTo(-83, 8, -83, 70); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-5, 32); ctx.quadraticCurveTo(-57, 32, -57, 70); ctx.stroke();
        
        ctx.fillStyle = '#4dd2ff'; ctx.beginPath(); ctx.arc(-70, 95, 10, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#ff8040'; ctx.fillRect(-16, -35, 32, 50);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-16, -35, 32, 50);

        ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-110, -55, 220, 22);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 3; ctx.strokeRect(-110, -55, 220, 22);
        ctx.fillRect(-22, -68, 44, 13); ctx.strokeRect(-22, -68, 44, 13);

        ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 22px Noto Sans TC'; ctx.fillText('手柄寬跨距為【大輪 R】(省力)', 0, -90);
        ctx.fillStyle = '#ff8040'; ctx.fillText('閥桿中心為【小軸 r】', 0, 135);
      }
      else if (t3_wheel_item === 'doorknob') {
        // 4. 喇叭門把 (純淨無虛線版)
        ctx.fillStyle = '#1e382b'; ctx.fillRect(-30, -110, 50, 230);
        ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(-30, -110, 50, 230);
        ctx.strokeStyle = 'rgba(163, 184, 160, 0.3)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-10, -110); ctx.lineTo(-10, 120); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5, -110); ctx.lineTo(5, 120); ctx.stroke();

        ctx.fillStyle = '#a3b8b0'; ctx.fillRect(-38, -45, 8, 90);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-38, -45, 8, 90);

        ctx.fillStyle = '#ff8040'; ctx.fillRect(-30, -14, 115, 28);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-30, -14, 115, 28);
        ctx.fillStyle = '#a3b8b0'; ctx.beginPath(); ctx.moveTo(85, -14); ctx.lineTo(115, 0); ctx.lineTo(85, 14); ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#4dd2ff'; ctx.beginPath(); ctx.arc(-95, 0, 55, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillRect(-48, -20, 10, 40); ctx.strokeRect(-48, -20, 10, 40);

        ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 22px Noto Sans TC'; ctx.fillText('外把球為【大輪 R】(省力)', -95, -80);
        ctx.fillStyle = '#ff8040'; ctx.fillText('內部鎖舌為【小軸 r】', 45, 55);
      }
      else if (t3_wheel_item === 'screwdriver') {
        // 5. 螺絲起子 (純淨無虛線版)
        ctx.fillStyle = '#ff8040'; ctx.fillRect(20, -14, 140, 28);
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(20, -14, 140, 28);
        ctx.beginPath(); ctx.moveTo(160, -14); ctx.lineTo(185, -6); ctx.lineTo(185, 6); ctx.lineTo(160, 14); ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-150, -42, 170, 84);
        ctx.strokeStyle = '#f6f3ea'; ctx.strokeRect(-150, -42, 170, 84);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 4;
        for(let i=-120; i<=-10; i+=35) {
          ctx.beginPath(); ctx.moveTo(i, -42); ctx.lineTo(i, 42); ctx.stroke();
        }

        ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 22px Noto Sans TC'; ctx.fillText('粗柄為【大輪 R】(省力)', -65, -70);
        ctx.fillStyle = '#ff8040'; ctx.fillText('細金屬為【小軸 r】', 90, 55);
      }
      else if (t3_wheel_item === 'wheel') {
        // 6. 方向盤 (純淨無虛線版)
        ctx.fillStyle = '#ff8040'; ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.stroke();

        ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 20; ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(-100, 0); ctx.lineTo(-32, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(32, 0); ctx.lineTo(100, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 32); ctx.lineTo(0, 100); ctx.stroke();

        ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 22px Noto Sans TC'; ctx.fillText('外握圈為【大輪 R】(省力)', 0, -135);
        ctx.fillStyle = '#ff8040'; ctx.fillText('轉向柱為【小軸 r】', 0, 155);
      }

      ctx.restore();
    }

    animationFrame = requestAnimationFrame(animateTab3);
  }

  // ============== 分頁四：斜面與自轉捲動螺旋模擬 (右上左下、由上往下依序生成) ==============
  function setTab4Mode(mode, btn) {
    t4_mode = mode;
    document.querySelectorAll('.btn-switch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('inc-sub-controls').style.display = (mode === 'inclined') ? 'block' : 'none';
    document.getElementById('screw-hint').style.display = (mode === 'screw') ? 'block' : 'none';
    updateTab4();
  }

  function updateTab4() {
    if (t4_mode === 'inclined') {
      let w_val = 120;
      let f_inc = (w_val * t4_h) / t4_len;
      dynamicStats.innerHTML = `
        <span>物體重量 <span style="white-space: nowrap;">W = 120 N</span> ， 斜面長度 <span style="white-space: nowrap;">L = ${t4_len} m</span> ， 高度 <span style="white-space: nowrap;">h = ${t4_h} m</span></span>
        <span>沿斜面平衡推力 <span style="white-space: nowrap;">F = <div class="fraction"><span class="numerator">W × h</span><span class="denominator">L</span></div> = <b style="color:var(--chalk-teal);">${f_inc.toFixed(1)} N</b></span></span>
      `;
    } else {
      dynamicStats.innerHTML = `
        <span><b>上列 (緩斜面自轉捲動)：</b>斜面長 <span style="white-space: nowrap;">L</span> 超長、坡度平緩 👉 捲動圈數多，螺紋密集（<b>螺距 <span style="white-space: nowrap;">d</span> 小</b>），旋入時<b style="color:var(--chalk-yellow);">極致省力，但費距離（費時）</b>！</span>
        <span><b>下列 (陡斜面自轉捲動)：</b>斜面長 <span style="white-space: nowrap;">L</span> 短、坡度陡峭 👉 捲動圈數少，螺紋稀疏（<b>螺距 <span style="white-space: nowrap;">d</span> 大</b>），旋入時<b style="color:var(--chalk-coral);">較為費力，但省距離（省時）</b>！</span>
      `;
    }
  }

  function animateTab4() {
    if (currentTab !== 'tab4') return;
    ctx.clearRect(0, 0, 960, 440);
    animTime += 0.03;

    if (t4_mode === 'inclined') {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 26px Noto Sans TC';
      ctx.fillText('斜面省力推析：以長度換取輕鬆推力', 250, 45);

      let bx = 160, by = 350;
      let sw = 640, sh = (t4_h / 4) * 220;

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + sw, by); ctx.lineTo(bx + sw, by - sh); ctx.closePath(); ctx.stroke();

      let prog = (Math.sin(animTime) + 1) / 2;
      let cx = bx + prog * sw, cy = by - prog * sh;

      ctx.save();
      ctx.translate(cx, cy);
      let inc_angle = Math.atan2(-sh, sw);
      ctx.rotate(inc_angle);
      ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-45, -50, 60, 50);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-45, -50, 60, 50);
      ctx.restore();

      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px JetBrains Mono';
      ctx.fillText(`高度 h = ${t4_h}m`, bx + sw + 20, by - sh/2);
      ctx.fillText(`斜面長 L = ${t4_len}m`, bx + sw/2 - 60, by - sh/2 - 30);
    } else {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 25px Noto Sans TC';
      ctx.fillText('雙斜面木條自轉捲動模擬：角度恆定、由上往下印出右上左下螺紋', 120, 38);

      let cycleTime = animTime % 6;
      let roll_prog = 0;
      let isSpinning = false;
      if (cycleTime < 4) {
        roll_prog = cycleTime / 4; 
        isSpinning = true;
      } else {
        roll_prog = 1; 
        isSpinning = false;
      }

      let r_y = 190;
      let cyl_r_x = 760, cyl_w = 45, cyl_h = 110;
      
      ctx.fillStyle = '#1e2f27'; ctx.fillRect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h);
      
      ctx.save();
      ctx.beginPath(); ctx.rect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h); ctx.clip();
      ctx.strokeStyle = 'rgba(163, 184, 176, 0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        let angle = roll_prog * Math.PI * 2 * 4 + (i * Math.PI * 2 / 3);
        let gx = cyl_r_x + cyl_w/2 + (cyl_w/2 - 5) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(gx, r_y - cyl_h); ctx.lineTo(gx, r_y); ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      let topAng1 = roll_prog * Math.PI * 2 * 4;
      ctx.beginPath(); ctx.arc(cyl_r_x + cyl_w/2, r_y - cyl_h - 12, 16, topAng1, topAng1 + Math.PI * 1.3); ctx.stroke();

      let max_len2 = 540;
      let cur_len2 = max_len2 * (1 - roll_prog); 
      if (cur_len2 > 0) {
        let slope2 = cyl_h / max_len2; 
        let cur_h2 = cur_len2 * slope2; 
        let base_l2_x = cyl_r_x - cur_len2;
        ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(base_l2_x, r_y); ctx.lineTo(cyl_r_x, r_y); ctx.lineTo(cyl_r_x, r_y - cur_h2); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 224, 102, 0.15)'; ctx.fill();
      }

      // 🌟 嚴格修正：100% 由頂端「上方開始往下方」烙印生成「右上左下」傾斜螺紋！
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
      let count2 = Math.floor(roll_prog * 6) + 1;
      for(let i = 0; i < count2; i++) {
        let y_top = (r_y - cyl_h) + 6 + i * 16; // 由最頂端依序往下滑動
        if (y_top <= r_y - 6) {
          ctx.beginPath(); ctx.moveTo(cyl_r_x + cyl_w, y_top); ctx.lineTo(cyl_r_x, y_top + 10); ctx.stroke(); // 嚴格右上左下！
        }
      }
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 21px Noto Sans TC';
      if (!isSpinning) {
        ctx.fillText('✨ 捲繞完成！螺紋密、螺距 d 小 (極省力)', 120, r_y - 45);
      } else {
        ctx.fillText('緩斜面捲動中... ➔ 螺紋密、螺距 d 小', 120, r_y - 45);
      }

      let l_y = 380;
      
      ctx.fillStyle = '#1e2f27'; ctx.fillRect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h);
      
      ctx.save();
      ctx.beginPath(); ctx.rect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h); ctx.clip();
      ctx.strokeStyle = 'rgba(163, 184, 176, 0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        let angle = roll_prog * Math.PI * 2 * 2 + (i * Math.PI * 2 / 3);
        let gx = cyl_r_x + cyl_w/2 + (cyl_w/2 - 5) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(gx, l_y - cyl_h); ctx.lineTo(gx, l_y); ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      let topAng2 = roll_prog * Math.PI * 2 * 2;
      ctx.beginPath(); ctx.arc(cyl_r_x + cyl_w/2, l_y - cyl_h - 12, 16, topAng2, topAng2 + Math.PI * 1.3); ctx.stroke();

      let max_len1 = 240;
      let cur_len1 = max_len1 * (1 - roll_prog); 
      if (cur_len1 > 0) {
        let slope1 = cyl_h / max_len1; 
        let cur_h1 = cur_len1 * slope1; 
        let base_l1_x = cyl_r_x - cur_len1;
        ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(base_l1_x, l_y); ctx.lineTo(cyl_r_x, l_y); ctx.lineTo(cyl_r_x, l_y - cur_h1); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 128, 64, 0.15)'; ctx.fill();
      }

      // 🌟 嚴格修正：100% 由頂端「上方開始往下方」烙印生成「右上左下」傾斜螺紋！
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 5;
      let count1 = Math.floor(roll_prog * 2.5) + 1;
      for(let i = 0; i < count1; i++) {
        let y_top = (l_y - cyl_h) + 10 + i * 36; // 由最頂端依序往下滑動
        if (y_top <= l_y - 6) {
          ctx.beginPath(); ctx.moveTo(cyl_r_x + cyl_w, y_top); ctx.lineTo(cyl_r_x, y_top + 20); ctx.stroke(); // 嚴格右上左下！
        }
      }
      ctx.fillStyle = '#ff8040'; ctx.font = 'bold 21px Noto Sans TC';
      if (!isSpinning) {
        ctx.fillText('✨ 捲繞完成！螺紋疏、螺距 d 大 (費力省時)', 120, l_y - 45);
      } else {
        ctx.fillText('陡斜面捲動中... ➔ 螺紋疏、螺距 d 大', 120, l_y - 45);
      }
    }

    animationFrame = requestAnimationFrame(animateTab4);
  }

  // 初始化啟動
  switchTab('tab1');
</script>
