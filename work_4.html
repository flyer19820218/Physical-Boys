<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡單機械與功的原理：HTML5 互動黑板教學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #11261f;
    --bg-panel: #17332a;
    --bg-panel-hover: #1f4236;
    --chalk-white: #f6f3ea;
    --chalk-muted: #a3b8b0;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-purple: #d4a5a5;
    --rule-color: rgba(246, 243, 234, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg-base);
    color: var(--chalk-white);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    line-height: 1.65;
    padding: 24px 0 80px;
  }

  .wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 2px dashed var(--rule-color);
    padding-bottom: 20px;
  }

  h1 {
    font-size: 34px;
    margin: 0 0 10px 0;
    color: var(--chalk-yellow);
    letter-spacing: 1.5px;
    font-weight: 700;
  }

  header p {
    margin: 0;
    color: var(--chalk-muted);
    font-size: 20px;
  }

  /* 乾淨導覽列 (嚴禁數字前綴) */
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .tab-btn {
    flex: 1;
    min-width: 200px;
    padding: 16px 14px;
    font-size: 20px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.05);
    color: var(--chalk-muted);
    border: 2px dashed var(--rule-color);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }

  .tab-btn:hover {
    background: var(--bg-panel-hover);
    color: var(--chalk-white);
  }

  .tab-btn.active {
    background: #1f4236;
    color: var(--chalk-yellow);
    border: 2px solid var(--chalk-yellow);
    box-shadow: 0 0 16px rgba(255, 224, 102, 0.25);
  }

  /* 嚴格雙欄排版 Grid (專為橫式平板與大螢幕適配) */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: var(--bg-panel);
    border: 2px solid var(--rule-color);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--rule-color);
    padding-bottom: 14px;
  }

  h2 {
    margin: 0;
    font-size: 28px;
    color: var(--chalk-white);
  }

  .sub-tag {
    font-size: 18px;
    color: var(--bg-base);
    background: var(--chalk-yellow);
    padding: 4px 16px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* 畫布區域：嚴格零黑色原則 */
  .stage-container {
    width: 100%;
    border: 2px solid var(--rule-color);
    border-radius: 12px;
    overflow: hidden;
    background: #0d201a;
    position: relative;
    margin-bottom: 18px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .controls {
    background: rgba(255, 255, 255, 0.04);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--rule-color);
    margin-bottom: 18px;
  }

  .control-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
  }

  .control-group:last-child {
    margin-bottom: 0;
  }

  label {
    font-weight: 700;
    color: var(--chalk-teal);
  }

  input[type=range] {
    flex: 1;
    height: 10px;
    accent-color: var(--chalk-yellow);
    cursor: pointer;
  }

  .readout-badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--bg-base);
    background: var(--chalk-yellow);
    padding: 4px 14px;
    border-radius: 8px;
    min-width: 95px;
    text-align: center;
    font-size: 18px;
  }

  .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--chalk-white);
    background: rgba(255, 255, 255, 0.04);
    padding: 20px;
    border-radius: 12px;
    border: 1px dashed var(--rule-color);
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stats b {
    color: var(--chalk-yellow);
  }

  .note {
    font-size: 20px;
    color: var(--chalk-white);
    line-height: 1.75;
    background: rgba(255, 255, 255, 0.05);
    padding: 22px;
    border-radius: 12px;
    border-left: 6px solid var(--chalk-yellow);
  }

  .note ul {
    margin: 8px 0 0 0;
    padding-left: 24px;
  }

  .note li {
    margin-bottom: 8px;
  }

  /* 理化專用標準上下垂直分式規範 */
  .fraction {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .fraction .numerator {
    border-bottom: 2px solid var(--chalk-white);
    padding-bottom: 2px;
    font-size: 0.9em;
  }

  .fraction .denominator {
    padding-top: 2px;
    font-size: 0.9em;
  }

  .formula-box {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255, 255, 255, 0.06);
    padding: 14px 20px;
    border-radius: 10px;
    border: 1px solid var(--rule-color);
    margin: 14px 0;
    text-align: center;
    font-size: 22px;
    color: var(--chalk-teal);
  }

  .btn-switch {
    padding: 10px 18px;
    border: 2px solid var(--chalk-teal);
    background: transparent;
    color: var(--chalk-teal);
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-switch:hover, .btn-switch.active {
    background: var(--chalk-teal);
    color: var(--bg-base);
  }

  .prop-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    overflow: hidden;
  }
  .prop-table th, .prop-table td {
    padding: 12px;
    text-align: center;
    border: 1px solid var(--rule-color);
    font-size: 19px;
  }
  .prop-table th {
    background: rgba(77, 210, 255, 0.15);
    color: var(--chalk-teal);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>簡單機械與功的原理</h1>
    <p>國中自然科核心單元：功的黃金鐵律、槓桿拔釘演練、輪軸滑輪與斜面螺旋</p>
  </header>

  <!-- 嚴格分頁規範：乾淨命名直擊概念，嚴禁數字前綴 -->
  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('tab1')">簡單機械與功</div>
    <div class="tab-btn" onclick="switchTab('tab2')">槓桿與拔釘演練</div>
    <div class="tab-btn" onclick="switchTab('tab3')">輪軸與滑輪系統</div>
    <div class="tab-btn" onclick="switchTab('tab4')">斜面與螺旋原理</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">簡單機械之目的與功的黃金鐵律</h2>
      <span id="panel-badge" class="sub-tag">能量守恆</span>
    </div>

    <!-- 嚴格雙欄排版 Grid -->
    <div class="grid-container">
      <!-- 左欄：互動畫布與控制 -->
      <div>
        <div class="stage-container">
          <canvas id="stage" width="600" height="360"></canvas>
        </div>
        <div class="controls" id="dynamic-controls">
          <!-- 內容由 JS 動態生成 -->
        </div>
      </div>

      <!-- 右欄：即時物理數據與授課重點 -->
      <div>
        <div class="stats" id="dynamic-stats">
          <!-- 數據由 JS 動態生成 -->
        </div>
        <div class="note" id="note-text">
          <!-- 授課筆記由 JS 動態生成 -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  let currentTab = 'tab1';
  let animationFrame;
  let animTime = 0;

  // 互動操作與物理參數狀態
  let t1_f = 50, t1_s = 4;
  let t2_arm_eff = 30, t2_arm_res = 5, t2_res_force = 600;
  let t3_mode = 'pulley'; // 'pulley' or 'wheel'
  let t4_mode = 'inclined', t4_len = 6, t4_h = 2;

  const dynamicControls = document.getElementById('dynamic-controls');
  const dynamicStats = document.getElementById('dynamic-stats');

  function switchTab(tab) {
    currentTab = tab;
    cancelAnimationFrame(animationFrame);
    animTime = 0;

    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');

    const title = document.getElementById('panel-title');
    const badge = document.getElementById('panel-badge');
    const note = document.getElementById('note-text');

    if (tab === 'tab1') {
      title.textContent = '簡單機械之目的與功的黃金鐵律';
      badge.textContent = '能量守恆';
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>施力大小 (<span style="white-space: nowrap;">F</span>)：</label>
          <input id="rng-t1-f" type="range" min="20" max="100" step="10" value="${t1_f}">
          <span id="val-t1-f" class="readout-badge">${t1_f} N</span>
        </div>
        <div class="control-group">
          <label>施力位移 (<span style="white-space: nowrap;">S</span>)：</label>
          <input id="rng-t1-s" type="range" min="1" max="10" step="1" value="${t1_s}">
          <span id="val-t1-s" class="readout-badge">${t1_s} m</span>
        </div>
        <div style="text-align:center; color:var(--chalk-teal); font-size:18px; margin-top:8px;">
          👉 觀察「省力必費距離」：功的總量 <span style="white-space: nowrap;">W = F × S</span> 恆定不變！
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>何謂簡單機械：</b>能協助人類作功的單純工具，如槓桿、輪軸、滑輪、齒輪、斜面與螺旋。</li>
          <li><b>使用目的三大核心：</b>
            <br>① <span style="white-space: nowrap;"><b>省力</b></span>：施力小於物重，但必定<span style="white-space: nowrap;"><b>費距離（費時）</b></span>。
            <br>② <span style="white-space: nowrap;"><b>省時</b></span>：施力距離小於物體移動距離，但必定<span style="white-space: nowrap;"><b>費力</b></span>。
            <br>③ <span style="white-space: nowrap;"><b>操作方便</b></span>：僅改變施力方向（如定滑輪），不省力亦不費力。
          </li>
          <li><b>功的原理 (黃金鐵律)：</b>任何簡單機械<span style="white-space: nowrap;"><b>絕對無法省功！</b></span> 在無摩擦力之理想狀態下，操作者輸入之總功，必等於機械對物體輸出之功。
            <div class="formula-box">
              <span style="white-space: nowrap;">W施 = W抗 \implies F施 × S施 = F抗 × S抗</span>
            </div>
          </li>
        </ul>
      `;

      document.getElementById('rng-t1-f').addEventListener('input', e => { t1_f = parseFloat(e.target.value); document.getElementById('val-t1-f').textContent = t1_f + ' N'; updateTab1(); });
      document.getElementById('rng-t1-s').addEventListener('input', e => { t1_s = parseFloat(e.target.value); document.getElementById('val-t1-s').textContent = t1_s + ' m'; updateTab1(); });

      updateTab1();
      animateTab1();
    }
    else if (tab === 'tab2') {
      title.textContent = '槓桿分類與羊角鎚拔釘演練';
      badge.textContent = '實戰試題';
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>握柄施力臂 (<span style="white-space: nowrap;">L施</span>)：</label>
          <input id="rng-eff" type="range" min="15" max="45" step="5" value="${t2_arm_eff}">
          <span id="val-eff" class="readout-badge">${t2_arm_eff} cm</span>
        </div>
        <div class="control-group">
          <label>拔釘抗力臂 (<span style="white-space: nowrap;">L抗</span>)：</label>
          <input id="rng-res" type="range" min="3" max="10" step="1" value="${t2_arm_res}">
          <span id="val-res" class="readout-badge">${t2_arm_res} cm</span>
        </div>
        <div class="control-group">
          <label>鐵釘阻力 (<span style="white-space: nowrap;">F抗</span>)：</label>
          <input id="rng-res-f" type="range" min="300" max="900" step="50" value="${t2_res_force}">
          <span id="val-res-f" class="readout-badge">${t2_res_force} N</span>
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>經典拔釘試題解析：</b>利用羊角鎚拔釘時，支點為<span style="white-space: nowrap;"><b>鎚頭與木板之接觸點</b></span>。</li>
          <li><b>力臂配置：</b>由支點到握柄施力處為<span style="white-space: nowrap;"><b>施力臂 (L施)</b></span>；由支點到鐵釘扣住處為<span style="white-space: nowrap;"><b>抗力臂 (L抗)</b></span>。
            <div class="formula-box">
              <span style="white-space: nowrap;">F施 = <div class="fraction"><span class="numerator">F抗 × L抗</span><span class="denominator">L施</span></div></span>
            </div>
          </li>
          <li><b>機械特性：</b>因為 <span style="white-space: nowrap;">L施 > L抗</span>，故羊角鎚拔釘屬於<span style="white-space: nowrap;"><b>省力費時</b></span>的槓桿應用！握柄愈長，拔釘愈輕鬆。</li>
        </ul>
      `;

      document.getElementById('rng-eff').addEventListener('input', e => { t2_arm_eff = parseFloat(e.target.value); document.getElementById('val-eff').textContent = t2_arm_eff + ' cm'; updateTab2(); });
      document.getElementById('rng-res').addEventListener('input', e => { t2_arm_res = parseFloat(e.target.value); document.getElementById('val-res').textContent = t2_arm_res + ' cm'; updateTab2(); });
      document.getElementById('rng-res-f').addEventListener('input', e => { t2_res_force = parseFloat(e.target.value); document.getElementById('val-res-f').textContent = t2_res_force + ' N'; updateTab2(); });

      updateTab2();
      animateTab2();
    }
    else if (tab === 'tab3') {
      title.textContent = '輪軸結構與滑輪系統比較';
      badge.textContent = '轉動機械';
      
      dynamicControls.innerHTML = `
        <div style="display:flex; justify-content:center; gap:14px; margin-bottom:14px;">
          <button class="btn-switch ${t3_mode==='pulley'?'active':''}" onclick="setTab3Mode('pulley', this)">定滑輪 vs 動滑輪</button>
          <button class="btn-switch ${t3_mode==='wheel'?'active':''}" onclick="setTab3Mode('wheel', this)">輪軸結構與應用</button>
        </div>
        <div style="text-align:center; color:var(--chalk-teal); font-size:18px;">
          ${t3_mode==='pulley' ? '👉 定滑輪不省力僅改方向；動滑輪省一半力但繩長需拉 2 倍距離！' : '👉 輪走一圈軸也走一圈。施力在輪 (半徑大) 恆省力；施力在軸恆費力！'}
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>定滑輪：</b>轉動軸心固定。視為等臂槓桿（<span style="white-space: nowrap;">R = r</span>），故施力 <span style="white-space: nowrap;">F = W</span>。<b>不省力亦不費力，目的在改變施力方向</b>（如升旗）。</li>
          <li><b>動滑輪：</b>滑輪隨重物一同升降。支點在一側切線，施力臂為半徑 2 倍（<span style="white-space: nowrap;">2R</span>），抗力臂為半徑（<span style="white-space: nowrap;">R</span>）。
            <div class="formula-box">
              <span style="white-space: nowrap;">F施 = <div class="fraction"><span class="numerator">W</span><span class="denominator">2</span></div></span> （省一半力，但拉繩距離 <span style="white-space: nowrap;">S = 2h</span>）
            </div>
          </li>
          <li><b>輪軸原理：</b>同軸心旋轉之大輪與小軸。喇叭鎖、螺絲起子、方向盤皆為<span style="white-space: nowrap;"><b>施力於輪之省力機械</b></span>；竹蜻蜓、擀面棍則為<span style="white-space: nowrap;"><b>施力於軸之省時機械</b></span>。</li>
        </ul>
      `;

      updateTab3();
      animateTab3();
    }
    else if (tab === 'tab4') {
      title.textContent = '斜面省力推析與螺旋螺距';
      badge.textContent = '連續位移';
      
      dynamicControls.innerHTML = `
        <div style="display:flex; justify-content:center; gap:14px; margin-bottom:14px;">
          <button class="btn-switch ${t4_mode==='inclined'?'active':''}" onclick="setTab4Mode('inclined', this)">斜面推力計算</button>
          <button class="btn-switch ${t4_mode==='screw'?'active':''}" onclick="setTab4Mode('screw', this)">螺旋與螺距 (d)</button>
        </div>
        <div id="inc-sub-controls" style="display:${t4_mode==='inclined'?'block':'none'};">
          <div class="control-group">
            <label>斜面長度 (<span style="white-space: nowrap;">L</span>)：</label>
            <input id="rng-inc-l" type="range" min="3" max="10" step="1" value="${t4_len}">
            <span id="val-inc-l" class="readout-badge">${t4_len} m</span>
          </div>
          <div class="control-group">
            <label>斜面高度 (<span style="white-space: nowrap;">h</span>)：</label>
            <input id="rng-inc-h" type="range" min="1" max="4" step="0.5" value="${t4_h}">
            <span id="val-inc-h" class="readout-badge">${t4_h} m</span>
          </div>
        </div>
      `;

      note.innerHTML = `
        💡 <b>黑板重點：</b>
        <ul>
          <li><b>斜面原理：</b>將重物沿斜面等速推升至高處，所作之功等於垂直直接抬升至同高度之功。
            <div class="formula-box">
              <span style="white-space: nowrap;">F × L = W × h \implies F = <div class="fraction"><span class="numerator">W × h</span><span class="denominator">L</span></div></span>
            </div>
            斜面愈平緩（長度 <span style="white-space: nowrap;">L</span> 愈大或高度 <span style="white-space: nowrap;">h</span> 愈小），所需推力愈小！
          </li>
          <li><b>螺旋 (<span style="white-space: nowrap;">Screw</span>)：</b>纏繞於圓柱體上之連續斜面應用。</li>
          <li><b>螺距 (<span style="white-space: nowrap;">d</span>)：</b>相鄰兩螺紋間之距離。
            <br>👉 <span style="white-space: nowrap;"><b>螺距愈小（螺紋愈密）</b></span>：代表展開後之斜面愈平緩，旋入時<span style="white-space: nowrap;"><b>愈省力，但費圈數（費時）</b></span>！
            <br>👉 常見應用：螺絲釘、千斤頂、瓶蓋螺紋、螺旋樓梯。
          </li>
        </ul>
      `;

      if (t4_mode === 'inclined') {
        document.getElementById('rng-inc-l').addEventListener('input', e => { t4_len = parseFloat(e.target.value); document.getElementById('val-inc-l').textContent = t4_len + ' m'; updateTab4(); });
        document.getElementById('rng-inc-h').addEventListener('input', e => { t4_h = parseFloat(e.target.value); document.getElementById('val-inc-h').textContent = t4_h + ' m'; updateTab4(); });
      }

      updateTab4();
      animateTab4();
    }
  }

  // ============== 分頁一：簡單機械與功 ==============
  function updateTab1() {
    let work = t1_f * t1_s;
    dynamicStats.innerHTML = `
      <span>施力大小 <span style="white-space: nowrap;">F = <b>${t1_f} N</b></span></span>
      <span>作用距離 <span style="white-space: nowrap;">S = <b>${t1_s} m</b></span></span>
      <span>輸入總功 <span style="white-space: nowrap;">W = F × S = <b style="color:var(--chalk-yellow);">${work} J</b></span></span>
      <span style="font-size:18px; color:var(--chalk-green);">✨ 功的原理：若用機械省下 50% 作用力，距離必暴增為 2 倍，作功總量永遠等值！</span>
    `;
  }

  function animateTab1() {
    if (currentTab !== 'tab1') return;
    ctx.clearRect(0, 0, 600, 360);
    animTime += 0.02;

    let prog = (animTime % 2) / 2;
    let bx = 100 + prog * 340;

    // 地面與標示線 (嚴格零黑色)
    ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(60, 260); ctx.lineTo(540, 260); ctx.stroke();

    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(100, 290); ctx.lineTo(440, 290); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffe066'; ctx.font = 'bold 18px JetBrains Mono';
    ctx.fillText(`位移 S = ${t1_s} m`, 230, 315);

    // 木箱
    ctx.fillStyle = '#4dd2ff'; ctx.fillRect(bx, 180, 80, 80);
    ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(bx, 180, 80, 80);
    ctx.fillStyle = '#11261f'; ctx.font = 'bold 20px Noto Sans TC'; ctx.fillText('重物', bx + 18, 226);

    // 推力箭頭
    ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(bx - 70, 220); ctx.lineTo(bx - 10, 220); ctx.stroke();
    ctx.fillStyle = '#ff8040';
    ctx.beginPath(); ctx.moveTo(bx - 10, 212); ctx.lineTo(bx + 6, 220); ctx.lineTo(bx - 10, 228); ctx.fill();
    ctx.font = 'bold 20px JetBrains Mono'; ctx.fillText(`F = ${t1_f} N`, bx - 70, 200);

    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
    ctx.fillText('機械作功模擬：施力 × 位移 = 恆定功總量', 90, 45);

    animationFrame = requestAnimationFrame(animateTab1);
  }

  // ============== 分頁二：槓桿與拔釘演練 ==============
  function updateTab2() {
    let f_eff = (t2_res_force * t2_arm_res) / t2_arm_eff;
    let adv = t2_arm_eff / t2_arm_res;

    dynamicStats.innerHTML = `
      <span>鐵釘阻力 <span style="white-space: nowrap;">F抗 = <b>${t2_res_force} N</b></span></span>
      <span>握柄施力臂 <span style="white-space: nowrap;">L施 = <b>${t2_arm_eff} cm</b></span> ， 拔釘抗力臂 <span style="white-space: nowrap;">L抗 = <b>${t2_arm_res} cm</b></span></span>
      <span>所需省力拔除 <span style="white-space: nowrap;">F施 = <div class="fraction"><span class="numerator">${t2_res_force} × ${t2_arm_res}</span><span class="denominator">${t2_arm_eff}</span></div> = <b style="color:var(--chalk-yellow);">${f_eff.toFixed(1)} N</b></span></span>
      <span style="font-size:18px; color:var(--chalk-teal);">👉 省力倍率：施力僅需抗力的 <span style="white-space: nowrap;">1 / ${adv.toFixed(1)}</span> ！握柄愈長愈輕鬆。</span>
    `;
  }

  function animateTab2() {
    if (currentTab !== 'tab2') return;
    ctx.clearRect(0, 0, 600, 360);
    animTime += 0.03;

    // 繪製拔釘木板地面
    ctx.fillStyle = '#a3b8b0'; ctx.fillRect(100, 260, 400, 40);
    ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(100, 260, 400, 40);

    // 繪製鐵釘
    ctx.fillStyle = '#f6f3ea'; ctx.fillRect(235, 230, 10, 40);
    ctx.beginPath(); ctx.arc(240, 230, 10, 0, Math.PI*2); ctx.fill();

    // 支點位置
    let cx = 280, cy = 260;
    ctx.fillStyle = '#33cc99'; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillText('▲ 支點', cx - 20, cy + 30);

    // 羊角鎚運動模擬 (繞支點小幅旋轉)
    let tilt = Math.sin(animTime) * 0.1 - 0.2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(tilt);

    // 鎚柄 (施力臂)
    ctx.fillStyle = '#ff8040'; ctx.fillRect(0, -15, 220, 24);
    ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(0, -15, 220, 24);
    ctx.fillStyle = '#11261f'; ctx.font = 'bold 16px Noto Sans TC'; ctx.fillText('羊角鎚握柄 (施力臂 L施)', 20, 3);

    // 鎚頭與羊角 (抗力臂)
    ctx.fillStyle = '#4dd2ff';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-45, -30); ctx.lineTo(-45, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f6f3ea'; ctx.stroke();
    
    // 施力箭頭
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(200, -15); ctx.lineTo(200, -60); ctx.stroke();
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.moveTo(200, -60); ctx.lineTo(192, -45); ctx.lineTo(208, -45); ctx.fill();
    ctx.font = 'bold 18px JetBrains Mono'; ctx.fillText('F施', 185, -70);

    ctx.restore();

    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
    ctx.fillText('羊角鎚拔釘力學：利用支點置中之省力槓桿', 80, 40);

    animationFrame = requestAnimationFrame(animateTab2);
  }

  // ============== 分頁三：輪軸與滑輪 ==============
  function setTab3Mode(mode, btn) {
    t3_mode = mode;
    document.querySelectorAll('.btn-switch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateTab3();
  }

  function updateTab3() {
    if (t3_mode === 'pulley') {
      dynamicStats.innerHTML = `
        <span><b>定滑輪：</b>等臂槓桿（<span style="white-space: nowrap;">L施 = L抗 = R</span>），施力 <span style="white-space: nowrap;">F = W</span>。<b>不省力、僅改方向</b>。</span>
        <span><b>動滑輪：</b>力臂倍增（<span style="white-space: nowrap;">L施 = 2R</span> ， <span style="white-space: nowrap;">L抗 = R</span>），施力 <span style="white-space: nowrap;">F = <div class="fraction"><span class="numerator">W</span><span class="denominator">2</span></div></span>。<b>省一半力、費一倍距離</b>。</span>
        <span style="color:var(--chalk-yellow);">⚠️ 功的原理驗證：動滑輪省一半力，但拉繩長度是物體上升高度的 2 倍，作功總量完全相同！</span>
      `;
    } else {
      dynamicStats.innerHTML = `
        <span><b>輪軸物理結構：</b>大輪半徑 (<span style="white-space: nowrap;">R</span>) 與小軸半徑 (<span style="white-space: nowrap;">r</span>) 同軸心同步轉動。</span>
        <span><b>力矩平衡公式：</b> <span style="white-space: nowrap;">F輪 × R = W軸 × r \implies F輪 = <div class="fraction"><span class="numerator">r</span><span class="denominator">R</span></div> × W</span></span>
        <span style="color:var(--chalk-teal);">✨ 省力判定：半徑愈大愈省力。方向盤、門把施力在輪必省力；竹蜻蜓施力在軸必費力省時！</span>
      `;
    }
  }

  function animateTab3() {
    if (currentTab !== 'tab3') return;
    ctx.clearRect(0, 0, 600, 360);
    animTime += 0.03;

    if (t3_mode === 'pulley') {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
      ctx.fillText('滑輪力學比較：定滑輪 (左) vs 動滑輪 (右)', 90, 40);

      // 定滑輪
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(170, 110, 35, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#ff8040'; ctx.fillRect(120, 200, 35, 40);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(135, 110); ctx.lineTo(135, 200); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(205, 110); ctx.lineTo(205, 210 + Math.sin(animTime)*25); ctx.stroke();
      ctx.fillStyle = '#ffe066'; ctx.font = '18px Noto Sans TC'; ctx.fillText('定滑輪：F = W', 110, 280);

      // 動滑輪
      let py = 160 - Math.sin(animTime)*25;
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(430, py, 35, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#ff8040'; ctx.fillRect(412, py + 40, 35, 40);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(395, 70); ctx.lineTo(395, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(465, py); ctx.lineTo(465, 70 - Math.sin(animTime)*50); ctx.stroke();
      ctx.fillStyle = '#33cc99'; ctx.fillText('動滑輪：F = W/2', 360, 280);
    } else {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
      ctx.fillText('輪軸結構：連續旋轉之連續槓桿變形', 110, 40);

      let cx = 300, cy = 190;
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 110, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 50, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#f6f3ea'; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();

      let r_ang = animTime;
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 110 * Math.cos(r_ang), cy + 110 * Math.sin(r_ang)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 50 * Math.cos(r_ang + 2), cy + 50 * Math.sin(r_ang + 2)); ctx.stroke();

      ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 20px Noto Sans TC'; ctx.fillText('大輪 (半徑 R)', 420, 190);
      ctx.fillStyle = '#ff8040'; ctx.fillText('小軸 (半徑 r)', 360, 230);
    }

    animationFrame = requestAnimationFrame(animateTab3);
  }

  // ============== 分頁四：斜面與螺旋 ==============
  function setTab4Mode(mode, btn) {
    t4_mode = mode;
    document.querySelectorAll('.btn-switch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('inc-sub-controls').style.display = (mode === 'inclined') ? 'block' : 'none';
    updateTab4();
  }

  function updateTab4() {
    if (t4_mode === 'inclined') {
      let w_val = 120;
      let f_inc = (w_val * t4_h) / t4_len;
      dynamicStats.innerHTML = `
        <span>物體重量 <span style="white-space: nowrap;">W = 120 N</span> ， 斜面長度 <span style="white-space: nowrap;">L = ${t4_len} m</span> ， 高度 <span style="white-space: nowrap;">h = ${t4_h} m</span></span>
        <span>沿斜面平衡推力 <span style="white-space: nowrap;">F = <div class="fraction"><span class="numerator">W × h</span><span class="denominator">L</span></div> = <b style="color:var(--chalk-teal);">${f_inc.toFixed(1)} N</b></span></span>
        <span style="color:var(--chalk-coral);">👉 機械利益：斜面長度 <span style="white-space: nowrap;">L</span> 愈長或高度 <span style="white-space: nowrap;">h</span> 愈低，坡度愈緩愈省力！</span>
      `;
    } else {
      dynamicStats.innerHTML = `
        <span><b>螺旋 (<span style="white-space: nowrap;">Screw</span>)：</b>斜面捲繞於圓柱上之變形應用（螺絲釘、千斤頂）。</span>
        <span><b>螺距 (<span style="white-space: nowrap;">d</span>)：</b>相鄰兩螺紋間之垂直距離。</span>
        <span style="color:var(--chalk-yellow);">✨ 核心規律：螺距 <span style="white-space: nowrap;">d</span> 愈小、螺紋愈密集，代表斜面愈平緩，旋入時<b>愈省力，但旋轉圈數愈多（費時）</b>！</span>
      `;
    }
  }

  function animateTab4() {
    if (currentTab !== 'tab4') return;
    ctx.clearRect(0, 0, 600, 360);
    animTime += 0.03;

    if (t4_mode === 'inclined') {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
      ctx.fillText('斜面省力原理：以長度換取輕鬆推力', 110, 40);

      let bx = 100, by = 290;
      let sw = 380, sh = (t4_h / 4) * 180;

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + sw, by); ctx.lineTo(bx + sw, by - sh); ctx.closePath(); ctx.stroke();

      let prog = (Math.sin(animTime) + 1) / 2;
      let cx = bx + prog * sw, cy = by - prog * sh;

      ctx.save();
      ctx.translate(cx, cy);
      let inc_angle = Math.atan2(-sh, sw);
      ctx.rotate(inc_angle);
      ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-35, -40, 45, 40);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-35, -40, 45, 40);
      ctx.restore();

      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 18px JetBrains Mono';
      ctx.fillText(`h = ${t4_h}m`, bx + sw + 15, by - sh/2);
      ctx.fillText(`L = ${t4_len}m`, bx + sw/2 - 40, by - sh/2 - 20);
    } else {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px Noto Sans TC';
      ctx.fillText('螺旋原理：螺距 (d) 對照與斜面捲繞', 110, 40);

      // 左螺絲：螺距大 (疏)
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(180, 80); ctx.lineTo(180, 280); ctx.stroke();
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
      for(let y=100; y<=260; y+=40) {
        ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(210, y+20); ctx.stroke();
      }
      ctx.fillStyle = '#f6f3ea'; ctx.font = '18px Noto Sans TC'; ctx.fillText('螺距大 (螺紋疏) : 費力', 90, 310);

      // 右螺絲：螺距小 (密)
      ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(420, 80); ctx.lineTo(420, 280); ctx.stroke();
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 4;
      for(let y=90; y<=270; y+=18) {
        ctx.beginPath(); ctx.moveTo(390, y); ctx.lineTo(450, y+9); ctx.stroke();
      }
      ctx.fillStyle = '#f6f3ea'; ctx.fillText('螺距小 (螺紋密) : 省力', 330, 310);
    }

    animationFrame = requestAnimationFrame(animateTab4);
  }

  // 初始化啟動
  switchTab('tab1');
</script>
</body>
</html>
