      crate4(g, cx + r - 38, 292, 76, 56, G, '400 N');

      label4(g, tr('轉同一圈：', 'One full turn:'), 560, 150, '#f6f3ea', 20);
      label4(g, tr('手走 2πR，水桶只升 2πr', 'hand 2πR, bucket only 2πr'), 560, 184, '#f6f3ea', 20);
    }
  }

  function drawChalkPerson(ctx, x, y, angle, pose, color, scale) {
    if (scale === undefined) scale = 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    ctx.strokeStyle = color || '#33cc99';
    ctx.fillStyle = color || '#33cc99';
    ctx.lineWidth = scale < 0.5 ? 6 : 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 1. 頭部
    ctx.beginPath();
    ctx.arc(0, -52, 11, 0, Math.PI * 2);
    ctx.fill();

    // 2. 軀幹
    ctx.beginPath();
    ctx.moveTo(0, -41);
    ctx.lineTo(0, -14);
    ctx.stroke();

    // 3. 雙腿
    ctx.beginPath();
    if (pose === 'push') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-14, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 14);
    } else if (pose === 'lift') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-10, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 14);
    } else if (pose === 'climb') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-12, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(14, 2);
      ctx.lineTo(14, 14);
    } else if (pose === 'hike') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-12, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(12, 12);
    } else {
      ctx.moveTo(0, -14);
      ctx.lineTo(-10, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 14);
    }
    ctx.stroke();

    // 4. 手臂
    ctx.beginPath();
    if (pose === 'push') {
      ctx.moveTo(0, -32);
      ctx.lineTo(18, -25);
      ctx.lineTo(34, -20);
      ctx.moveTo(0, -32);
      ctx.lineTo(14, -18);
      ctx.lineTo(34, -14);
    } else if (pose === 'lift') {
      ctx.moveTo(0, -32);
      ctx.lineTo(16, -18);
      ctx.lineTo(28, -8);
      ctx.moveTo(0, -32);
      ctx.lineTo(20, -24);
      ctx.lineTo(32, -14);
    } else if (pose === 'climb') {
      ctx.moveTo(0, -32);
      ctx.lineTo(-14, -14);
      ctx.lineTo(-18, 0);
      ctx.moveTo(0, -32);
      ctx.lineTo(14, -22);
      ctx.lineTo(22, -10);
    } else if (pose === 'hike') {
      ctx.moveTo(0, -32);
      ctx.lineTo(-12, -16);
      ctx.lineTo(-16, -2);
      ctx.moveTo(0, -32);
      ctx.lineTo(14, -20);
      ctx.lineTo(18, -2);
      ctx.moveTo(18, -20);
      ctx.lineTo(22, 14);
    } else {
      ctx.moveTo(0, -32);
      ctx.lineTo(-10, -10);
      ctx.moveTo(0, -32);
      ctx.lineTo(10, -10);
    }
    ctx.stroke();

    ctx.restore();
  }

  /* ══════════════════════════════════════════════════════════════
     分頁四：斜面、螺旋、生活應用
       物理沿用原本的：重物固定 120 N，斜面推力 = 120 × h ÷ L。
       三個模式（inclined / screw / apps）與所有控制變數都沒動，
       改的只有畫法。
     ══════════════════════════════════════════════════════════════ */
  function renderTab4() {
    ctx.clearRect(0, 0, 960, 440);
    pen4(ctx);
    animTime += 0.03;

    const W_VAL = 120;
    const fInc = (W_VAL * t4_h) / t4_len;

    if (t4_mode === 'inclined') { drawIncline(W_VAL, fInc); return; }
    if (t4_mode === 'screw')    { drawScrew(); return; }
    drawApps();
  }

  /* ── 斜面推升 vs 直接抬升 ── */
  function drawIncline(W_VAL, fInc) {
    if (t4_incline_state === 'pushing' || t4_incline_state === 'lifting') {
      t4_incline_prog += 0.012;
      if (t4_incline_prog >= 1) {
        t4_incline_prog = 1;
        t4_incline_state = (t4_incline_state === 'pushing') ? 'pushed' : 'lifted';
      }
    }
    const pP = (t4_incline_state === 'pushing' || t4_incline_state === 'pushed') ? t4_incline_prog : 0;
    const lP = (t4_incline_state === 'lifting' || t4_incline_state === 'lifted') ? t4_incline_prog : 0;

    txt4(ctx, tr('同一個箱子、同一個高度：斜面推上去比較輕鬆，但路要走比較長',
                 'Same crate, same height: the ramp is easier — but the path is longer'),
         24, 34, '#f6f3ea', 23);

    const GY = 356, BX = 80, SW = 360;
    const SH = (t4_h / 4) * 150;                    // 高 1～4 m → 37.5～150 px
    line4(ctx, 40, GY, 920, GY, '#a3b8b0', 4);
    hatch4(ctx, 40, GY, 880, 12, 'rgba(163,184,176,0.4)', 14, 1.3);
    dash4(ctx, 470, 72, 470, 400, 'rgba(255,255,255,0.22)', 2, [6, 8]);

    /* ══ 左：斜面 ══ */
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(BX, GY); ctx.lineTo(BX + SW, GY); ctx.lineTo(BX + SW, GY - SH); ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,224,102,0.08)'; ctx.fill();

    const ang = Math.atan2(SH, SW);
    const cxp = BX + SW * pP, cyp = GY - SH * pP;
    ctx.save(); ctx.translate(cxp, cyp); ctx.rotate(-ang);
    crate4(ctx, -30, -54, 60, 54, '#4dd2ff', '120 N');
    ctx.restore();
    /* 推力：沿斜面往上，箭頭長度跟著算出來的力走 */
    const fl = 26 + fInc * 0.5;
    arrow4(ctx, cxp - fl * Math.cos(ang), cyp + fl * Math.sin(ang),
                cxp - 12 * Math.cos(ang), cyp + 12 * Math.sin(ang), '#33cc99', 6, 17);
    label4(ctx, `F${tr('推', 'push')} = ${fInc.toFixed(0)} N`,
           cxp - fl * Math.cos(ang) - 12, cyp + fl * Math.sin(ang) + 26, '#33cc99', 20, 'right');

    /* 量尺：斜面長沿著斜面量，高在右側量 */
    const L = Math.hypot(SW, SH), ox = -SH / L * 30, oy = -SW / L * 30;
    dim4(ctx, BX + ox, GY + oy, BX + SW + ox, GY - SH + oy, '#ffe066');
    label4(ctx, `L = ${t4_len} m`, BX + SW * 0.26 + ox * 2.4, GY - SH * 0.26 + oy * 2.4 + 6,
           '#ffe066', 19, 'center');
    dim4(ctx, BX + SW + 34, GY, BX + SW + 34, GY - SH, '#4dd2ff');
    label4(ctx, `h = ${t4_h} m`, BX + SW + 46, GY - SH / 2 + 6, '#4dd2ff', 19);

    /* ══ 右：直接抬 ══ */
    const PX = 700;
    line4(ctx, PX - 70, GY, PX + 70, GY, '#a3b8b0', 4);
    dash4(ctx, PX - 60, GY - SH, PX + 118, GY - SH, 'rgba(77,210,255,0.5)', 1.8, [5, 5]);
    const ly = GY - SH * lP;
    crate4(ctx, PX - 30, ly - 54, 60, 54, '#ff8040', '120 N');
    arrow4(ctx, PX, ly - 66, PX, ly - 66 - (26 + W_VAL * 0.5), '#ff8040', 6, 17);
    label4(ctx, `F${tr('抬', 'lift')} = ${W_VAL} N`, PX + 18, ly - 66 - (26 + W_VAL * 0.5) + 10, '#ff8040', 20);
    dim4(ctx, PX + 104, GY, PX + 104, GY - SH, '#4dd2ff');
    label4(ctx, `h = ${t4_h} m`, PX + 116, GY - SH / 2 + 6, '#4dd2ff', 19);

    /* ══ 兩邊的功一模一樣 ══ */
    const work = W_VAL * t4_h;
    label4(ctx, tr(`兩邊做的功都是 ${work} J —— 省下來的力，用長度補回去了`,
                   `Both do ${work} J of work — the force you save is paid back in length`),
           24, 424, '#33cc99', 20);
  }

  /* ── 螺旋：把直角三角形捲到圓柱上，斜邊就變成螺紋 ──
     按鈕寫的是「雙斜面」，原檔的說明也分上下兩列（緩斜面 vs 陡斜面），
     只畫一個三角形就沒得比了。這一版兩個一起捲：
       上列 緩斜面：底長 → 捲 6 圈 → 螺距小 → 省力、但要轉很多圈
       下列 陡斜面：底短 → 捲 2 圈 → 螺距大 → 費力、但幾圈就到頂
     兩個三角形的「高」一樣（都爬完同一根柱子），差別只在斜邊的緩陡。 */
  function drawScrew() {
    if (t4_screw_state === 'winding') {
      t4_screw_time += 0.02;
      if (t4_screw_time >= 4) { t4_screw_time = 4; t4_screw_state = 'wound'; }
    }
    const prog = (t4_screw_state === 'idle') ? 0 : t4_screw_time / 4;

    txt4(ctx, tr('螺旋就是「捲起來的斜面」：同樣爬完一根柱子，斜面愈緩、螺紋就愈密',
                 'A screw is a rolled-up incline: the gentler the slope, the finer the thread'),
         24, 30, '#f6f3ea', 22);

    /* 一列 = 一個三角形 ＋ 一根捲好的螺桿 */
    const row = (o) => {
      const { by, tx, tw, th, turns, col, name, tag } = o;
      const left = 1 - prog;

      /* 原始三角形留一圈虛線，不然捲完之後那一區只剩空白 */
      const tri = (c) => {
        c.beginPath(); c.moveTo(tx, by); c.lineTo(tx + tw, by); c.lineTo(tx + tw, by - th); c.closePath();
      };
      ctx.save(); ctx.setLineDash([6, 7]);
      ctx.strokeStyle = 'rgba(255,224,102,0.30)'; ctx.lineWidth = 2;
      tri(ctx); ctx.stroke(); ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.rect(tx, by - th - 10, tw * left, th + 20); ctx.clip();
      ctx.fillStyle = 'rgba(255,224,102,0.14)'; tri(ctx); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 4; tri(ctx); ctx.stroke();
      ctx.restore();
      if (prog > 0.02 && prog < 0.99) {
        line4(ctx, tx + tw * left, by + 8, tx + tw * left, by - th - 8, col, 2.5);
      }
      /* 斜面長度 */
      dim4(ctx, tx, by + 20, tx + tw, by + 20, '#4dd2ff');

      /* ── 捲上去的螺桿 ── */
      const CX = 700, CR = 38, CTOP = by - th - 14, CH = th + 28;
      const gg = ctx.createLinearGradient(CX - CR, 0, CX + CR, 0);
      gg.addColorStop(0, 'rgba(0,0,0,0.35)');
      gg.addColorStop(0.4, '#5c6b64');
      gg.addColorStop(1, 'rgba(0,0,0,0.35)');
      ctx.fillStyle = gg; ctx.fillRect(CX - CR, CTOP, CR * 2, CH);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 2.5;
      ctx.strokeRect(CX - CR, CTOP, CR * 2, CH);
      ctx.fillStyle = '#1e2f27';
      ctx.beginPath(); ctx.ellipse(CX, CTOP, CR, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      const pitch = (CH - 20) / turns;
      const total = turns * 2 * Math.PI * prog;
      const thread = (wantFront) => {
        ctx.beginPath(); let pen = false;
        for (let a = 0; a <= total; a += 0.07) {
          const y = CTOP + 10 + (a / (2 * Math.PI)) * pitch;
          const xx = CX + CR * Math.sin(a);
          const isFront = Math.cos(a) > 0;
          if (isFront === wantFront) { if (pen) ctx.lineTo(xx, y); else { ctx.moveTo(xx, y); pen = true; } }
          else pen = false;
        }
        ctx.stroke();
      };
      ctx.save(); ctx.setLineDash([5, 6]);
      ctx.strokeStyle = 'rgba(255,224,102,0.33)'; ctx.lineWidth = 2.5; thread(false);
      ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 4; thread(true);

      /* 螺距 */
      if (prog > 0.3) {
        dash4(ctx, CX + CR + 4, CTOP + 10, CX + CR + 56, CTOP + 10, 'rgba(255,128,64,0.5)', 1.5, [4, 5]);
        dash4(ctx, CX + CR + 4, CTOP + 10 + pitch, CX + CR + 56, CTOP + 10 + pitch, 'rgba(255,128,64,0.5)', 1.5, [4, 5]);
        dim4(ctx, CX + CR + 46, CTOP + 10, CX + CR + 46, CTOP + 10 + pitch, '#ff8040');
        label4(ctx, tr('螺距 d', 'pitch d'), CX + CR + 60, CTOP + 10 + pitch / 2 + 6, '#ff8040', 18);
      }

      label4(ctx, name, 24, by - th - 22, col, 20);
      label4(ctx, tag, CX, CTOP - 12, col, 19, 'center');
    };

    /* 上列：緩斜面 —— 底長，捲六圈，螺紋密 */
    row({ by: 196, tx: 60, tw: 372, th: 84, turns: 6, col: '#ffe066',
          name: tr('緩斜面：斜邊長', 'Gentle: long slope'),
          tag:  tr('捲 6 圈 → 螺距小 → 省力', '6 turns → fine pitch → less force') });
    /* 下列：陡斜面 —— 底短，捲兩圈，螺紋疏 */
    row({ by: 392, tx: 60, tw: 124, th: 84, turns: 2, col: '#ff8040',
          name: tr('陡斜面：斜邊短', 'Steep: short slope'),
          tag:  tr('捲 2 圈 → 螺距大 → 費力', '2 turns → coarse pitch → more force') });

    /* 兩列之間的空白拿來寫結論，不必擠到畫布最底下 */
    label4(ctx, prog < 0.99
      ? tr('捲動中……', 'winding…')
      : tr('兩根柱子一樣高 —— 爬完的高度相同', 'Same cylinder, same height climbed'),
      214, 290, '#d8e6e0', 19);
    label4(ctx, tr('斜邊愈長愈緩 → 圈數愈多、螺距愈小 → 愈省力，但要轉愈多圈',
                   'A longer, gentler slope: more turns, finer pitch, less force'),
           214, 330, '#33cc99', 19, 'left', true, 420);
  }

  /* ── 生活應用：樓梯（階梯化的斜面）與盤山公路（攤平的螺旋）── */
  function drawApps() {
    txt4(ctx, tr('樓梯是切成一階一階的斜面；盤山公路是攤在山上的螺旋',
                 'Stairs are a chopped-up incline; a mountain road is a screw laid on a hill'),
         24, 34, '#f6f3ea', 23);
    dash4(ctx, 478, 72, 478, 404, 'rgba(255,255,255,0.22)', 2, [6, 8]);

    /* ══ 左：樓梯 ══ */
    const sx = 66, sy = 356, steps = 6, sw = 54, sh = 38;
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i < steps; i++) {
      ctx.lineTo(sx + i * sw, sy - (i + 1) * sh);
      ctx.lineTo(sx + (i + 1) * sw, sy - (i + 1) * sh);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,224,102,0.08)';
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i < steps; i++) {
      ctx.lineTo(sx + i * sw, sy - (i + 1) * sh);
      ctx.lineTo(sx + (i + 1) * sw, sy - (i + 1) * sh);
    }
    ctx.lineTo(sx + steps * sw, sy); ctx.closePath(); ctx.fill();

    dash4(ctx, sx, sy, sx + steps * sw, sy - steps * sh, '#33cc99', 3, [7, 6]);

    const climb = (animTime * 0.30) % (steps + 1.4);
    const ci = Math.min(steps - 0.02, climb);
    drawChalkPerson(ctx, sx + (Math.floor(ci) + 0.5) * sw, sy - (Math.floor(ci) + 1) * sh,
                    0, 'climb', '#ffe066', 0.8);

    label4(ctx, tr('🪜 樓梯 = 斜面切成一階一階', '🪜 Stairs = a chopped-up incline'), 60, 92, '#ffe066', 20);
    label4(ctx, tr('虛線就是它等效的斜坡', 'the dashed line is the equivalent ramp'), 60, 122, '#33cc99', 19);
    dim4(ctx, sx - 26, sy, sx - 26, sy - steps * sh, '#4dd2ff');
    ctx.save(); ctx.translate(sx - 44, sy - steps * sh / 2); ctx.rotate(-Math.PI / 2);
    label4(ctx, tr('同樣的高度', 'same height'), 0, 0, '#4dd2ff', 19, 'center');
    ctx.restore();

    /* ══ 右：盤山公路 ══
       之字形的來回折返不是螺旋，是「切成好幾段的直斜坡」。
       真正的山路是繞著山轉——一條盤在圓錐上的螺線，
       轉到山的另一面時看不見（畫成淡虛線），轉回正面才看得到。
       這樣它才真的是「攤在山上的螺旋」，和左邊的螺桿是同一件事。 */
    const M = { x: 706, base: 376, top: 146, R: 152, sq: 0.30 };
    /* 山體：兩條稜線 ＋ 山腳的前半個橢圓 */
    ctx.fillStyle = 'rgba(163,184,176,0.13)';
    ctx.beginPath();
    ctx.moveTo(M.x - M.R, M.base); ctx.lineTo(M.x, M.top); ctx.lineTo(M.x + M.R, M.base);
    ctx.ellipse(M.x, M.base, M.R, M.R * M.sq, 0, 0, Math.PI);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(M.x - M.R, M.base); ctx.lineTo(M.x, M.top); ctx.lineTo(M.x + M.R, M.base);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(163,184,176,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(M.x, M.base, M.R, M.R * M.sq, 0, 0, Math.PI); ctx.stroke();

    /* 山路：一條繞著山轉的螺線。s = 0 山腳 → 1 山頂 */
    const LAPS = 4;
    const road = (s) => {
      const th = s * LAPS * Math.PI * 2 + Math.PI * 0.5;
      const rr = M.R * (1 - s) * 0.93;
      const yc = M.base - (M.base - M.top - 10) * s;
      return { x: M.x + rr * Math.cos(th), y: yc + rr * M.sq * Math.sin(th), front: Math.sin(th) > 0 };
    };
    const drawRoad = (wantFront) => {
      ctx.beginPath(); let pen = false;
      for (let s = 0; s <= 1.0001; s += 0.002) {
        const p = road(s);
        if (p.front === wantFront) { if (pen) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); pen = true; } }
        else pen = false;
      }
      ctx.stroke();
    };
    ctx.save(); ctx.lineCap = 'round'; ctx.setLineDash([5, 7]);
    ctx.strokeStyle = 'rgba(255,224,102,0.30)'; ctx.lineWidth = 2.5; drawRoad(false);
    ctx.restore();
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5; drawRoad(true);
    ctx.restore();

    /* 山頂的小屋 */
    ctx.fillStyle = '#a3b8b0';
    rr4(ctx, M.x - 13, M.top + 2, 26, 18, 3); ctx.fill();
    ctx.fillStyle = '#ff8040';
    ctx.beginPath();
    ctx.moveTo(M.x - 17, M.top + 3); ctx.lineTo(M.x, M.top - 9); ctx.lineTo(M.x + 17, M.top + 3);
    ctx.closePath(); ctx.fill();

    /* 幾棵樹，讓學生認得出這是一座山 */
    for (const [ts, tt] of [[0.10, 0.62], [0.30, 0.40], [0.52, 0.72], [0.22, 0.18], [0.66, 0.30]]) {
      const th2 = tt * Math.PI * 2;
      const rr2 = M.R * (1 - ts) * 0.70;
      const yc2 = M.base - (M.base - M.top - 10) * ts;
      const txp = M.x + rr2 * Math.cos(th2), typ = yc2 + rr2 * M.sq * Math.sin(th2);
      if (Math.sin(th2) <= 0) continue;                 // 轉到山背面的就別畫了
      ctx.fillStyle = 'rgba(51,204,153,0.55)';
      ctx.beginPath();
      ctx.moveTo(txp, typ - 22); ctx.lineTo(txp + 8, typ); ctx.lineTo(txp - 8, typ);
      ctx.closePath(); ctx.fill();
    }

    /* 一台車沿著山路往上爬；繞到山背面就跟著看不見 */
    const cs = (animTime * 0.035) % 1;
    const car = road(cs);
    ctx.globalAlpha = car.front ? 1 : 0.28;
    glow4(ctx, '#ff8040', car.front ? 12 : 0);
    ctx.fillStyle = '#ff8040';
    rr4(ctx, car.x - 12, car.y - 9, 24, 13, 4); ctx.fill();
    noglow4(ctx);
    ctx.fillStyle = '#11261f';
    ctx.beginPath(); ctx.arc(car.x - 6, car.y + 4, 3.6, 0, Math.PI * 2);
    ctx.arc(car.x + 6, car.y + 4, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    label4(ctx, tr('🏔️ 盤山公路 = 繞在山上的螺旋', '🏔️ Mountain road = a screw on a hill'), 508, 92, '#ffe066', 20);
    label4(ctx, tr('繞到山的另一面就看不見了（淡虛線）', 'the far side of each lap is hidden'),
           508, 122, '#33cc99', 19);
    dim4(ctx, M.x + M.R + 20, M.base, M.x + M.R + 20, M.top, '#4dd2ff');
    ctx.save(); ctx.translate(M.x + M.R + 40, (M.base + M.top) / 2); ctx.rotate(-Math.PI / 2);
    label4(ctx, tr('爬上同樣的山頂', 'same summit'), 0, 0, '#4dd2ff', 19, 'center');
    ctx.restore();

    label4(ctx, tr('兩個都在做同一件事：把陡的高度，換成長一點但好走的路',
                   'Both do the same thing: trade a steep climb for a longer, easier path'),
           24, 424, '#33cc99', 20);
  }

  // --- 全域單一主動畫迴圈 (徹底杜絕競態與凍結) ---
  function mainLoop() {
    if (currentTab === 'tab5') { requestAnimationFrame(mainLoop); return; }
    if (currentTab === 'tab1') renderTab1();
    else if (currentTab === 'tab2') renderTab2();
    else if (currentTab === 'tab3') renderTab3();
    else if (currentTab === 'tab4') renderTab4();
    requestAnimationFrame(mainLoop);
  }

  // 初始化啟動
  applyTranslations();
  switchTab('tab1', null);
  applyTab5(currentTab);
  requestAnimationFrame(mainLoop);
</script>
