<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<style>
  :root {
    --bg-base: #11261f;
    --bg-panel: #17332a;
    --bg-panel-hover: #1f4236;
    --chalk-white: #f6f3ea;
    --chalk-muted: #a3b8b0;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-purple: #d4a5a5;
    --rule-color: rgba(246, 243, 234, 0.22);
    --shadow-dark: rgba(9, 20, 16, 0.9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
      radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
    background-size: 24px 24px, 16px 16px;
    background-position: 0 0, 8px 8px;
    color: var(--chalk-white);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    line-height: 1.65;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; padding-top: 40px; padding-bottom: 16px; border-bottom: 3px solid var(--chalk-green); }
  h1 { font-size: 36px; margin: 0 0 8px 0; color: var(--chalk-yellow); letter-spacing: 2px; font-weight: 700; }
  .subtitle { margin: 0; color: var(--chalk-teal); font-size: 22px; font-weight: 700; }

  .language-switch {
    position: fixed; z-index: 3000;
    top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border: 2px solid var(--chalk-teal); border-radius: 12px;
    background: rgba(17, 38, 31, 0.96); box-shadow: 0 8px 24px var(--shadow-dark), 0 0 16px rgba(77, 210, 255, 0.2);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .language-label { color: var(--chalk-teal); font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .lang-btn {
    min-width: 58px; min-height: 48px; padding: 8px 12px;
    border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 9px;
    background: var(--bg-base); color: var(--chalk-white);
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .lang-btn.active { background: var(--chalk-teal); color: var(--bg-base); border-color: var(--chalk-teal); }
  .lang-btn:focus-visible { outline: 3px solid rgba(255, 224, 102, 0.75); outline-offset: 3px; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .tab-btn {
    padding: 14px 10px; font-size: 20px; font-weight: 700; background: rgba(255, 255, 255, 0.05);
    color: var(--chalk-muted); border: 2px dashed var(--rule-color); border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease; text-align: center; min-height: 60px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    white-space: normal; display: flex; align-items: center; justify-content: center; line-height: 1.2;
  }
  .tab-btn:hover { background: var(--bg-panel-hover); color: var(--chalk-white); border-color: var(--chalk-white); }
  .tab-btn.active { background: var(--bg-panel); color: var(--chalk-yellow); border: 2px solid var(--chalk-yellow); box-shadow: 0 0 16px rgba(255, 224, 102, 0.25); }

  .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .panel { background: var(--bg-panel); border: 2px solid var(--rule-color); border-radius: 16px; padding: 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px dashed var(--rule-color); padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  h2 { margin: 0; font-size: 28px; color: var(--chalk-teal); }
  .sub-tag { font-size: 19px; color: var(--bg-base); background: var(--chalk-green); padding: 6px 18px; border-radius: 999px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

  .stage-container { width: 100%; border: 2px solid var(--chalk-yellow); border-radius: 12px; overflow: hidden; background: #0d201a; position: relative; margin-bottom: 20px; box-shadow: 0 4px 15px var(--shadow-dark); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 960 / 440; }

  .controls { background: rgba(0, 0, 0, 0.35); padding: 20px; border-radius: 12px; border: 2px dashed var(--chalk-teal); margin-bottom: 20px; }
  .control-group { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .control-group:last-child { margin-bottom: 0; }
  label { font-weight: 700; color: var(--chalk-teal); font-size: 20px; }
  input[type=range] { flex: 1; height: 10px; accent-color: var(--chalk-yellow); cursor: pointer; min-height: 48px; }
  .readout-badge { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--bg-base); background: var(--chalk-yellow); padding: 6px 16px; border-radius: 8px; min-width: 110px; text-align: center; font-size: 20px; }

  .stats { background: transparent; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
  .stat-row { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; flex-wrap: wrap; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--rule-color); border-radius: 12px; padding: 14px 20px; font-size: 20px; font-weight: 700; }
  .val-badge { background: #11261f; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; color: var(--chalk-white); display: inline-flex; align-items: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }

  .hl-yellow { color: var(--chalk-yellow) !important; } .hl-teal { color: var(--chalk-teal) !important; } .hl-coral { color: var(--chalk-coral) !important; } .hl-green { color: var(--chalk-green) !important; }

  .math-fraction { display: inline-flex; flex-direction: column; justify-content: center; align-items: center; vertical-align: middle; margin: 0 8px; line-height: 1.2; font-family: 'JetBrains Mono', monospace; }
  .math-fraction .num { border-bottom: 2px solid var(--chalk-white); padding: 0 6px 2px; }
  .math-fraction .den { padding: 2px 6px 0; }

  .note { font-size: 20px; color: var(--chalk-white); line-height: 1.8; background: var(--bg-panel); padding: 22px; border-radius: 12px; border: 2px solid var(--chalk-white); }
  .note ul { margin: 10px 0 0 0; padding-left: 26px; }
  .note li { margin-bottom: 10px; }
  .formula-box { font-family: 'JetBrains Mono', monospace; background: rgba(0, 0, 0, 0.35); padding: 16px 24px; border-radius: 10px; border: 1px dashed var(--chalk-white); margin: 16px 0; text-align: center; font-size: 22px; color: var(--chalk-teal); display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }

  .btn-switch { padding: 10px 18px; border: 2px solid var(--chalk-teal); background: transparent; color: var(--chalk-teal); border-radius: 8px; font-size: 19px; font-weight: 700; cursor: pointer; transition: 0.2s; min-height: 48px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .btn-switch:hover, .btn-switch.active { background: var(--chalk-teal); color: var(--bg-base); }

  .btn-action-group { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .btn-action { padding: 10px 20px; font-size: 19px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.2s; min-height: 48px; border: 2px solid var(--chalk-yellow); background: var(--bg-base); color: var(--chalk-yellow); touch-action: manipulation; }
  .btn-action:hover, .btn-action.active { background: var(--chalk-yellow); color: var(--bg-base); }
  .btn-action.btn-green { border-color: var(--chalk-green); color: var(--chalk-green); }
  .btn-action.btn-green:hover, .btn-action.btn-green.active { background: var(--chalk-green); color: var(--bg-base); }
  .btn-action.btn-coral { border-color: var(--chalk-coral); color: var(--chalk-coral); }
  .btn-action.btn-coral:hover, .btn-action.btn-coral.active { background: var(--chalk-coral); color: var(--bg-base); }
  .btn-action.btn-teal { border-color: var(--chalk-teal); color: var(--chalk-teal); }
  .btn-action.btn-teal:hover, .btn-action.btn-teal.active { background: var(--chalk-teal); color: var(--bg-base); }

  .prop-table { width: 100%; border-collapse: collapse; margin-top: 14px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; overflow: hidden; }
  .prop-table th, .prop-table td { padding: 12px 14px; text-align: center; border: 1px solid var(--rule-color); font-size: 19px; }
  .prop-table th { background: rgba(77, 210, 255, 0.15); color: var(--chalk-teal); font-weight: 700; }

  .nw { white-space: nowrap; }

  @media (max-width: 1023px) { body { font-size: 20px; } .tabs { grid-template-columns: 1fr 1fr; } .stat-row { font-size: 19px; } }
  @media (max-width: 520px) { .language-label { display: none; } .language-switch { top: 8px; right: 8px; padding: 6px; } .tabs { grid-template-columns: 1fr; } .panel { padding: 16px; } .control-group { flex-direction: column; align-items: stretch; gap: 8px; } }

  /* ==================================================================
     V5 升級層（work_4 簡單機械）
     ================================================================== */

  /* ── 2.3 字級拉回 V5 標準 ── */
  body { font-size: 22px; }
  h1 { font-size: 48px; }
  h2 { font-size: 32px; }
  .sub-tag { font-size: 22px; padding: 7px 20px; }
  .note { font-size: 22px; line-height: 1.85; }
  .btn-action, .btn-switch { font-size: 21px; min-height: 52px; }
  .control-group label { font-size: 21px; }
  .readout-badge, .val-badge { font-size: 21px; }
  .stat-row { font-size: 21px; }

  /* ── 分頁鈕：牛頓力學同款雙行主副標題，五格一整排 ── */
  .tabs { grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tab-btn {
    font-size: 22px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; min-height: 136px; padding: 20px 12px; line-height: 1.4;
  }
  .tab-hook { font-size: 22px; font-weight: 700; line-height: 1.38; }
  .tab-sub  { font-size: 17px; font-weight: 700; line-height: 1.3; opacity: 0.82; }
  .tab-btn.active {
    background: var(--chalk-yellow);
    color: var(--bg-base);
    border: 3px solid var(--chalk-yellow);
    box-shadow: 0 0 20px rgba(255, 224, 102, 0.5);
  }
  .tab-btn.active .tab-hook,
  .tab-btn.active .tab-sub { color: var(--bg-base); }
  .tab-btn.active .tab-sub { opacity: 0.78; }

  /* ── 第五定律：曉臻老師 Hook ── */
  .hook-box {
    display: flex; align-items: flex-start; gap: 18px;
    background: rgba(77, 210, 255, 0.08);
    border: 2px solid rgba(77, 210, 255, 0.4);
    border-left: 6px solid var(--chalk-teal);
    border-radius: 12px; padding: 18px 22px; margin-bottom: 22px;
  }
  .xiaozhen-logo {
    width: 88px; height: 88px; flex: 0 0 88px;
    overflow: hidden; border: 4px solid #55e9ff; border-radius: 50%;
    background: rgba(11, 26, 21, 0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .xiaozhen-logo img { width: 100%; height: 100%; object-fit: cover; }
  .hook-content { flex: 1 1 auto; min-width: 0; }
  .hook-title { font-size: 26px; font-weight: 700; color: var(--chalk-teal); margin-bottom: 6px; }
  .hook-text { font-size: 22px; line-height: 1.75; color: var(--chalk-white); }
  .hook-text b { color: var(--chalk-yellow); }

  /* ── 段考挑戰 ── */
  #quiz-panel { display: none; }
  .quiz-item {
    background: rgba(255, 255, 255, 0.04); border: 2px solid var(--rule-color);
    border-radius: 12px; padding: 22px; margin-bottom: 20px;
  }
  .quiz-q { font-size: 22px; line-height: 1.8; margin-bottom: 6px; }
  .quiz-q .qno {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    color: var(--bg-base); background: var(--chalk-yellow);
    border-radius: 6px; padding: 1px 10px; margin-right: 10px;
  }
  .q-fig { margin: 14px 0 4px; }
  .q-fig canvas {
    background: rgba(11, 26, 21, 0.45); border: 2px solid var(--rule-color);
    border-radius: 10px; width: 100%; height: auto; aspect-ratio: 900 / 360;
  }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opts label {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 21px; line-height: 1.6;
    background: rgba(11, 26, 21, 0.5); border: 2px solid var(--rule-color);
    border-radius: 8px; padding: 12px 14px; cursor: pointer; min-height: 48px; transition: all 0.15s;
  }
  .opts label:hover { border-color: var(--chalk-white); background: rgba(255, 255, 255, 0.08); }
  .opts input[type="radio"] { width: 22px; height: 22px; margin-top: 4px; flex: 0 0 22px; accent-color: #4dd2ff; }
  .quiz-fb {
    margin-top: 12px; font-size: 21px; line-height: 1.75;
    border-radius: 0 8px 8px 0; padding: 0 18px; max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
  }
  .quiz-fb.show { max-height: 620px; padding: 14px 18px; }
  .quiz-fb.ok { background: rgba(51, 204, 153, 0.14); border-left: 6px solid var(--chalk-green); }
  .quiz-fb.ng { background: rgba(255, 128, 64, 0.14); border-left: 6px solid var(--chalk-coral); }
  .quiz-fb b { color: var(--chalk-yellow); }
  .score-box {
    text-align: center; font-size: 26px; font-weight: 700; color: var(--chalk-yellow);
    background: rgba(11, 26, 21, 0.6); border: 2px dashed var(--chalk-yellow);
    border-radius: 12px; padding: 18px; margin-top: 10px;
  }

  /* ── 第六定律：電影式封面（點一下播放，有聲）── */
  .intro-screen {
    position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
    overflow: hidden; background: #11261f; cursor: pointer; isolation: isolate;
    transition: opacity .7s ease, visibility .7s ease;
  }
  .intro-screen::before {
    content: ""; position: absolute; inset: -3%; z-index: -4;
    background: #11261f url("assets/covers/work_4_cover_v1.png") center/cover no-repeat;
    animation: introZoom 14s ease-out both;
  }
  .intro-video {
    position: absolute; inset: 0; z-index: -3;
    width: 100%; height: 100%; object-fit: cover;
    pointer-events: none; background: #11261f;
    opacity: 0; transition: opacity .4s ease;
  }
  .intro-screen.playing .intro-video { opacity: 1; }
  .intro-screen.playing::before { animation: none; }
  .intro-screen::after {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background: linear-gradient(180deg, rgba(1,11,11,.02) 34%, rgba(1,12,10,.22) 65%, rgba(1,12,10,.88) 100%),
                radial-gradient(circle at 48% 34%, rgba(255,224,102,.08), transparent 32%);
  }
  .intro-screen.exiting { opacity: 0; visibility: hidden; pointer-events: none; }
  @keyframes introZoom { from { transform: scale(1); } to { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .intro-screen::before { animation: none; } }
  /* 直式螢幕（iPad 直拿、手機）用 cover 會把畫面左右各切掉七成——
     槓桿和人全被裁掉，只剩沙。窄一點就改成整張塞進去。 */
  @media (max-aspect-ratio: 5/4) {
    .intro-screen::before { inset: 0; background-size: contain; background-position: center; }
    .intro-video { object-fit: contain; }
  }

  /* ── 第七定律：窄螢幕 ── */
  @media (max-width: 1000px) { .tabs { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) {
    .tabs { grid-template-columns: 1fr 1fr; }
    .tab-btn { min-height: 118px; padding: 16px 12px; }
  }
  @media (max-width: 640px) {
    .opts { grid-template-columns: 1fr; }
    .hook-box { gap: 14px; padding: 16px; }
    .xiaozhen-logo { width: 72px; height: 72px; flex: 0 0 72px; }
    .note, .stat-row, .quiz-q { overflow-x: auto; }
  }
  @media (max-width: 520px) { .tabs { grid-template-columns: 1fr; } }


    /* 🏠 首頁懸浮按鈕（V5：全站導覽，2026-09-25 新增） */
    .home-fab {
      position: fixed; top: 16px; left: 20px; z-index: 9999;
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; text-decoration: none;
      background: rgba(17, 38, 31, 0.92); border: 2px solid #ffe066; color: #f6f3ea;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 14px rgba(255, 224, 102, 0.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;

    .home-fab svg { width: 24px; height: 24px; display: block; }
    .home-fab:hover, .home-fab:focus-visible {
      background: #ffe066; color: #11261f;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 224, 102, 0.55);
      transform: translateY(-2px);

    .home-fab:active { transform: translateY(0); }
    @media (max-width: 520px) {
      .home-fab { top: 8px; left: 8px; width: 42px; height: 42px; }
      .home-fab svg { width: 20px; height: 20px; }
    }
  </style>
</head>

            <br>👉 <span class="nw"><b>${tr('盤山公路 (Winding Road)', 'Winding Mountain Road')}</b></span>：${tr('車輛無法直衝垂直山頂，沿山腰蜿蜒盤旋將路徑大幅拉長（<span class="nw mono">L ↑</span>），引擎所需推力大幅減小（<span class="nw mono">F ↓</span>）。', 'Spirals around the mountain to maximize length L, minimizing required engine climbing force F.')}

     分頁一：功的黃金鐵律
       左：人推重物走一段距離（F 的箭頭長度跟著滑桿變）
       右：把 W = F × S 畫成一塊「面積」，兩根滑桿一動，面積就跟著變
     ══════════════════════════════════════════════════════════════ */
  function renderTab1() {
    ctx.clearRect(0, 0, 960, 440);
    pen4(ctx);
    animTime += 0.02;

    const GY = 330;                       // 地面
    const START = 120;
    const travel = 24 * t1_s;             // 位移 1～10 m → 24～240 px
    const prog = (animTime % 2.4) / 2.4;
    const bx = START + travel * prog;

    txt4(ctx, tr('功的黃金鐵律：施力 × 距離 = 功，機械只能換，不能省',
                 'The Golden Rule: Work = Force × Distance. Machines trade, never save'),
         24, 34, '#f6f3ea', 23);

    /* ── 地面與位移標尺 ── */
    line4(ctx, 60, GY, 620, GY, '#a3b8b0', 4);
    hatch4(ctx, 60, GY, 560, 12, 'rgba(163,184,176,0.45)', 14, 1.4);

    dash4(ctx, START, GY + 34, START + travel, GY + 34, '#ffe066', 2);
    line4(ctx, START, GY + 24, START, GY + 44, '#ffe066', 2);
    line4(ctx, START + travel, GY + 24, START + travel, GY + 44, '#ffe066', 2);
    dim4(ctx, START + 2, GY + 34, START + travel - 2, GY + 34, '#ffe066');
    label4(ctx, `${tr('位移', 'Distance')}  S = ${t1_s} m`, START + travel / 2, GY + 70, '#ffe066', 20, 'center');

    /* ── 重物 ── */
    crate4(ctx, bx, GY - 82, 82, 82, '#4dd2ff', tr('重物', 'Load'));

    /* ── 推的人 ── */
    drawChalkPerson(ctx, bx - 46, GY, 0, 'push', '#33cc99', 1);

    /* ── 施力箭頭：長度跟著 F 走（20 N → 37 px，100 N → 82 px）──
       畫在箱子「上方」，不是人跟箱子中間——那裡只有 46 px，
       箭頭一長就會壓到人的頭。 */
    const aLen = 26 + t1_f * 0.56;
    const ay = GY - 104;
    arrow4(ctx, bx - 4 - aLen, ay, bx + 30, ay, '#ff8040', 7, 17);
    label4(ctx, `F = ${t1_f} N`, bx - 4 - aLen, ay - 20, '#ff8040', 20);

    /* ── 分隔 ── */
    dash4(ctx, 632, 70, 632, 400, 'rgba(255,255,255,0.22)', 2, [6, 8]);

    /* ══ 右側：把功畫成一塊面積 ══ */
    const OX = 700, OY = 356;             // 座標原點
    const bw = 22 * t1_s;                 // 寬 ∝ 位移
    const bh = 1.5 * t1_f;                // 高 ∝ 施力
    const work = t1_f * t1_s;

    txt4(ctx, tr('功 = 這塊面積', 'Work = this area'), 700, 74, '#33cc99', 21);

    /* 座標軸 */
    arrow4(ctx, OX, OY, OX, 116, '#a3b8b0', 2.5, 11);
    arrow4(ctx, OX, OY, 940, OY, '#a3b8b0', 2.5, 11);
    txt4(ctx, 'F (N)', OX + 10, 108, '#a3b8b0', 18);
    txt4(ctx, 'S (m)', 940, OY + 24, '#a3b8b0', 18, 'right');

    /* 面積本體 */
    const g = ctx.createLinearGradient(OX, OY - bh, OX, OY);
    g.addColorStop(0, 'rgba(255, 224, 102, 0.85)');
    g.addColorStop(1, 'rgba(255, 128, 64, 0.55)');
    glow4(ctx, '#ffe066', 14);
    ctx.fillStyle = g; ctx.fillRect(OX, OY - bh, bw, bh);
    noglow4(ctx);
    hatch4(ctx, OX, OY - bh, bw, bh, 'rgba(17,38,31,0.35)', 11, 1.4);
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2.5;
    ctx.strokeRect(OX, OY - bh, bw, bh);

    /* 兩邊的刻度線 */
    dash4(ctx, OX - 12, OY - bh, OX + bw, OY - bh, '#ff8040', 1.8, [5, 5]);
    dash4(ctx, OX + bw, OY - bh, OX + bw, OY + 12, '#4dd2ff', 1.8, [5, 5]);
    label4(ctx, `${t1_f} N`, OX - 16, OY - bh + 7, '#ff8040', 18, 'right');
    label4(ctx, `${t1_s} m`, OX + bw, OY + 32, '#4dd2ff', 18, 'center');

    /* 數字 */
    /* 面積上方的數字：靠左寫，但量過寬度、必要時往左收，絕不出界 */
    const wtxt = `W = F × S = ${work} J`;
    let wx = OX + 4;
    if (wx + w4(ctx, wtxt, 22) > 946) wx = 946 - w4(ctx, wtxt, 22);
    label4(ctx, wtxt, wx, Math.min(OY - bh - 22, 300), '#ffe066', 22);
  }

  /* ══════════════════════════════════════════════════════════════
     分頁二：鐵撬拔釘（第二類槓桿）
       支點 丁 在鐵撬觸木的尖端，抗力點 丙（鐵釘）夾在中間，
       施力點 甲 在長柄末端 —— 三者在同一側，往上抬就把釘子帶起來。
       這一版讓「畫出來的兩隻力臂長度」真的跟著滑桿走。
     ══════════════════════════════════════════════════════════════ */
  function renderTab2() {
    ctx.clearRect(0, 0, 960, 440);
    pen4(ctx);
    animTime += 0.03;

    txt4(ctx, tr('鐵撬拔釘：支點在彎角、鐵釘夾在中間 → 第二類槓桿',
                 'Pry bar: fulcrum at the tip, nail in between'),
         24, 34, '#f6f3ea', 23);

    const fe = (t2_res_force * t2_arm_res) / t2_arm_eff;

    /* ══ 左半：把它抽象成一根棍子，三個點的順序一眼看完
           兩隻力臂的量尺也放在這裡——實體鐵撬那邊擠不下，
           硬塞只會變成上一版那種互相壓字。 ══ */
    (function schematic() {
      const y = 180, x0 = 48, x1 = 372;
      txt4(ctx, tr('先看骨架：支點 → 抗力 → 施力', 'The skeleton: fulcrum → load → effort'),
           x0, 84, '#33cc99', 20);

      const fx = x0 + 10;
      const ex = x1 - 12;
      const ratio = t2_arm_res / t2_arm_eff;
      const lx = fx + (ex - fx) * ratio;

      bar4(ctx, x0, y - 7, x1 - x0, 14, '#ff8040', 7);

      /* 支點 */
      ctx.fillStyle = '#33cc99';
      ctx.beginPath();
      ctx.moveTo(fx, y + 9); ctx.lineTo(fx - 16, y + 38); ctx.lineTo(fx + 16, y + 38);
      ctx.closePath(); ctx.fill();
      label4(ctx, tr('丁 支點', 'D fulcrum'), fx - 22, y + 62, '#33cc99', 19, 'center');

      /* 抗力：向上（鐵釘被往上拔） */
      arrow4(ctx, lx, y - 14, lx, y - 54, '#4dd2ff', 5, 15);
      label4(ctx, tr('丙 抗力', 'C load'), lx, y - 64, '#4dd2ff', 19, 'center');

      /* 施力：也向上 */
      arrow4(ctx, ex, y - 14, ex, y - 54, '#ffe066', 5, 15);
      label4(ctx, tr('甲 施力', 'A effort'), ex, y - 64, '#ffe066', 19, 'center');

      /* 兩隻力臂的量尺 */
      const d1 = y + 96, d2 = y + 134;
      dash4(ctx, fx, y + 12, fx, d2 + 8, 'rgba(255,255,255,0.3)', 1.5, [4, 5]);
      dash4(ctx, lx, y + 12, lx, d1 + 8, 'rgba(77,210,255,0.5)', 1.5, [4, 5]);
      dash4(ctx, ex, y + 12, ex, d2 + 8, 'rgba(255,224,102,0.5)', 1.5, [4, 5]);
      dim4(ctx, fx, d1, lx, d1, '#4dd2ff');
      dim4(ctx, fx, d2, ex, d2, '#ffe066');
      label4(ctx, `L${tr('抗', 'r')} = ${t2_arm_res} cm`, (fx + lx) / 2, d1 - 12, '#4dd2ff', 19, 'center');
      label4(ctx, `L${tr('施', 'e')} = ${t2_arm_eff} cm`, (fx + ex) / 2, d2 + 30, '#ffe066', 19, 'center');

      /* 這行到 x=470 就會撞上木頭（木頭是後畫的，會蓋掉尾巴）→ 量過再寫 */
      label4(ctx, tr('抗力夾在中間 ＝ 第二類槓桿（一定省力）',
                     'Load in the middle = second class'),
             x0, 396, '#f6f3ea', 19, 'left', true, 470 - x0 - 12);
    })();

    /* ══ 左下：力矩平衡的數字 ══ */
    ctx.font = 'bold 21px "JetBrains Mono", "Noto Sans TC"';
    label4(ctx, `F${tr('施', 'e')} × L${tr('施', 'e')} = F${tr('抗', 'r')} × L${tr('抗', 'r')}`,
           430, 372, '#33cc99', 21);
    label4(ctx, `${fe.toFixed(0)} N × ${t2_arm_eff} cm = ${t2_res_force} N × ${t2_arm_res} cm`,
           430, 402, '#f6f3ea', 20);
    label4(ctx, tr(`省力 ${(t2_arm_eff / t2_arm_res).toFixed(1)} 倍`,
                   `${(t2_arm_eff / t2_arm_res).toFixed(1)}× advantage`),
           430, 430, '#ffe066', 21);

    /* ══ 右側：真正的鐵撬 ══
       老師說的：一個「倒過來的大寫 A、中間那一橫不要」——就是一個 V，
       一長一短，短的那隻勾著鐵釘。沒別的了。
         · 短腳（爪）貼在木面上，末端勾住釘頭 → 抗力點 丙
         · 彎角頂在木頭上 → 支點 丁
         · 長腳（柄）翹起 44°，末端是施力點 甲（太平就使不上力）
       抬長腳 → 整支繞彎角轉 → 短腳翹起來 → 釘子被帶出來。
       柄走一大段、釘子只上來一點點，這就是「省力、費距離」。 */
    const DEG_E = 44;                      // 長腳（柄）和木頭的夾角
    /* 兩隻腳照「工具原本的樣子」畫，不再按滑桿縮放：
       L抗 5 cm 對 L施 30 cm 是 1:6，短腳只剩三十幾 px，
       V 就消失了、爪也看不出來。左邊那張骨架圖本來就是照比例畫的，
       兩隻力臂的量尺、數字都在那裡；右邊這張負責的是「這工具長什麼樣」。 */
    const LEG_E = 250, LEG_R = 96;         // 長腳、短腳（畫面長度）
    const WY = 312;                        // 木頭表面
    const O = { x: 850, y: WY };           // 支點 ＝ 彎角觸木的那一點
    const FT = 6;                          // 短腳中心線離木面的高度（＝半厚）
                                           // 爪要薄，太粗就塞不進釘頭底下
    const AE = -(180 - DEG_E) * Math.PI / 180;
    const ex_ = Math.cos(AE), ey_ = Math.sin(AE);
    const nx = -ey_, ny = ex_;             // 垂直長腳，指向右上（施力方向）

    /* 抬起來的角度。上一版寫成 rotate(-tilt)，整支鐵撬其實是「往下壓」——
       釘子當然拔不出來。往上抬是 +tilt。 */
    const tilt = (1 - Math.cos(animTime)) * 0.065;
    const co = Math.cos(tilt), si = Math.sin(tilt);
    const RT = q => ({ x: O.x + q.x * co - q.y * si, y: O.y + q.x * si + q.y * co });
    const E = { x: 0, y: -FT };                              // 彎角
    const A = { x: E.x + LEG_E * ex_, y: E.y + LEG_E * ey_ }; // 施力點 甲
    const C = { x: -LEG_R, y: -FT };                          // 抗力點 丙（爪尖）
    const Ap = RT(A), Cp = RT(C);

    const NX = Cp.x;                       // 釘身：鉛直，通過抗力點
    const headH = 7, headTop = Cp.y - 9;
    const jawY = Cp.y + 2;                 // 兩根爪尖：頂在釘頭底下

    const clawPath = (c) => { rr4(c, C.x - 19, C.y - 11, 34, 22, 8); };

    /* ── 整支 V ── */
    ctx.save();
    ctx.translate(O.x, O.y);
    ctx.rotate(tilt);
    glow4(ctx, '#ff8040', 12);
    ctx.strokeStyle = '#ff8040'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 12;                                      // 短腳（爪）貼著木面
    ctx.beginPath(); ctx.moveTo(E.x, E.y); ctx.lineTo(C.x, C.y); ctx.stroke();
    ctx.lineWidth = 14;                                      // 長腳（柄）
    ctx.beginPath(); ctx.moveTo(E.x, E.y);
    ctx.lineTo(E.x + A.x * 0 + (A.x - E.x) * 0.55, E.y + (A.y - E.y) * 0.55); ctx.stroke();
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(E.x + (A.x - E.x) * 0.55, E.y + (A.y - E.y) * 0.55);
    ctx.lineTo(A.x, A.y); ctx.stroke();
    noglow4(ctx);
    clawPath(ctx);                                           // 爪頭
    const bg = ctx.createLinearGradient(0, C.y - 11, 0, C.y + 11);
    bg.addColorStop(0, '#c85c28'); bg.addColorStop(0.5, '#ff8040'); bg.addColorStop(1, '#ffac83');
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = '#ffd0b8'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(17,38,31,0.5)'; ctx.lineWidth = 3;   // 握柄防滑紋
    for (let i = 0; i < 5; i++) {
      const t = 0.80 + i * 0.045;
      const hx = E.x + (A.x - E.x) * t, hy = E.y + (A.y - E.y) * t;
      ctx.beginPath();
      ctx.moveTo(hx - 5 * nx, hy - 5 * ny);
      ctx.lineTo(hx + 5 * nx, hy + 5 * ny);
      ctx.stroke();
    }
    ctx.restore();

    wood4(ctx, 470, WY, 460, 44);          // 木頭後畫，彎角自然「坐」在木面上

    /* ── 鐵釘：鉛直、由上往下插進木頭，被爪尖從釘頭底下勾著往上帶 ── */
    const tipY = Math.min(jawY + 60, WY + 38);
    ctx.save();                            // 還埋在木頭裡的那一段，畫淡一點
    ctx.beginPath(); ctx.rect(470, WY, 460, 44); ctx.clip();
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#e6f0ea';
    ctx.beginPath();
    ctx.moveTo(NX - 4, jawY); ctx.lineTo(NX + 4, jawY);
    ctx.lineTo(NX + 2.6, tipY - 8); ctx.lineTo(NX, tipY); ctx.lineTo(NX - 2.6, tipY - 8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();                            // 已經被拔出來的那一段
    ctx.beginPath(); ctx.rect(470, 120, 460, WY - 118); ctx.clip();
    ctx.fillStyle = '#e6f0ea'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(NX - 4, jawY - 2); ctx.lineTo(NX + 4, jawY - 2);
    ctx.lineTo(NX + 4, WY + 2); ctx.lineTo(NX - 4, WY + 2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();

    /* ── 爪尖勾住釘頭 ──
       口袋和爪尖要對齊鉛直的釘子，所以用畫布座標畫；
       爪是斜的，先把爪的外形設成剪裁區，才不會凸到爪外面去。 */
    ctx.save();
    ctx.translate(O.x, O.y); ctx.rotate(tilt);
    clawPath(ctx); ctx.clip();
    ctx.rotate(-tilt); ctx.translate(-O.x, -O.y);
    ctx.fillStyle = 'rgba(11,26,21,0.95)';
    rr4(ctx, NX - 13, headTop - 2, 26, headH + 8, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(200,92,40,0.9)'; ctx.lineWidth = 1.8;
    rr4(ctx, NX - 13, headTop - 2, 26, headH + 8, 3); ctx.stroke();
    ctx.strokeStyle = '#e6f0ea'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(NX - 11, jawY); ctx.lineTo(NX - 5.5, jawY);
    ctx.moveTo(NX + 5.5, jawY); ctx.lineTo(NX + 11, jawY);
    ctx.stroke();
    ctx.restore();

    /* 釘頭：比爪縫寬，所以勾得住 */
    ctx.fillStyle = '#f6f3ea'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    rr4(ctx, NX - 10, headTop, 20, headH, 2.5); ctx.fill(); ctx.stroke();
    arrow4(ctx, NX, headTop - 12, NX, headTop - 46, '#4dd2ff', 4, 13);

    /* 施力箭頭：垂直於長腳往右上 */
    ctx.save();
    ctx.translate(O.x, O.y); ctx.rotate(tilt);
    arrow4(ctx, A.x, A.y, A.x + 58 * nx, A.y + 58 * ny, '#ffe066', 6, 17);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineJoin = 'miter';
    ctx.beginPath();
    ctx.moveTo(A.x - 19 * ex_, A.y - 19 * ey_);
    ctx.lineTo(A.x - 19 * ex_ + 19 * nx, A.y - 19 * ey_ + 19 * ny);
    ctx.lineTo(A.x + 19 * nx, A.y + 19 * ny);
    ctx.stroke();
    pen4(ctx);
    ctx.restore();

    /* ── 標籤：算回未旋轉的畫布座標再寫，字才不會歪 ── */
    const exL = Ap.x + 58 * nx, eyL = Ap.y + 58 * ny;
    const sA = tr('甲 施力點', 'A effort'), sF = `F${tr('施', 'e')} = ${fe.toFixed(0)} N`;
    const wA = Math.max(w4(ctx, sA, 20), w4(ctx, sF, 20));
    let lx = exL + 24, ly = Math.max(eyL + 4, 96);
    if (lx + wA > 944) lx = 944 - wA;      // 量過再寫，絕不出界
    label4(ctx, sA, lx, ly, '#ffe066', 20);
    label4(ctx, sF, lx, ly + 30, '#ffe066', 20);

    /* 丙：用引線拉到左邊的空白處，不要疊在鐵撬上 */
    const cLab = { x: Cp.x - 214, y: Cp.y - 150 };
    line4(ctx, cLab.x + 58, cLab.y + 8, NX - 15, headTop + 2, '#4dd2ff', 2);
    label4(ctx, tr('丙 抗力點（鐵釘）', 'C load (nail)'), cLab.x, cLab.y, '#4dd2ff', 20, 'center');
    label4(ctx, `F${tr('抗', 'r')} = ${t2_res_force} N`, cLab.x, cLab.y + 28, '#4dd2ff', 20, 'center');

    ctx.fillStyle = '#33cc99';
    ctx.beginPath(); ctx.arc(O.x, O.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    label4(ctx, tr('丁 支點（彎角）', 'D fulcrum'), O.x + 20, O.y + 58, '#33cc99', 20, 'right');
  }

  /* ══════════════════════════════════════════════════════════════
     分頁三之一：輪軸
       原版是一張完全不會動的「靜態結構解剖」。
       輪軸的重點不是它長什麼樣，是「大輪跟小軸鎖在同一根軸上、
       轉同一個角度，所以手走的路比重物長」——不轉就看不出來。

       這一版轉「整整一圈」。上課講的是「輪轉一圈、軸也轉一圈」，
       只轉 60 度學生根本數不出圈數，也就對不上 2πR 和 2πr。
       一圈之後重物升 2πr = 176 px，這段是真的照比例畫出來的；
       手走的 2πR = 465 px 畫布塞不下，所以手改成「握著輪緣繞一圈」
       ——那一圈的長度就是圓周，再用下面同一把尺的長條做對照。
     ══════════════════════════════════════════════════════════════ */
  const WHEEL_ITEMS = {
    copter:      { zh: '竹蜻蜓 / 擀麵棍', en: 'Bamboo-copter / rolling pin' },
    pencil:      { zh: '削鉛筆機',       en: 'Pencil sharpener' },
    faucet:      { zh: '水龍頭',         en: 'Faucet' },
    doorknob:    { zh: '喇叭門把',       en: 'Doorknob' },
    screwdriver: { zh: '螺絲起子',       en: 'Screwdriver' },
    wheel:       { zh: '方向盤',         en: 'Steering wheel' },
  };
  function renderTab3() {
    ctx.clearRect(0, 0, 960, 440);
    pen4(ctx);
    animTime += 0.03;
    if (t3_mode === 'pulley') { drawPulleys(); return; }

    const AY = 150;                       // 軸心高度
    const WX = 176, R = 74;               // 大輪：手握的地方
    const DX = 380, r = 28;               // 小軸：捲繩的捲筒
    const TURN = Math.PI * 2;
    const th = (animTime * 0.9) % (TURN * 1.22);
    const ang = Math.min(th, TURN);       // 轉滿一圈就停一下，再從頭轉
    const lift = r * ang;                 // 重物升 r×θ：一圈 = 2πr = 176 px

    txt4(ctx, tr('輪軸：大輪和小軸鎖在同一根軸上，輪轉一圈，軸也轉一圈',
                 'Wheel & axle: locked on one shaft — one turn of the wheel is one turn of the axle'),
         24, 30, '#f6f3ea', 23);
    label4(ctx, tr('手握輪緣繞一圈走 2πR，重物只升 2πr —— 省下來的力，全部由距離補回去',
                   'Hand walks 2πR around the rim; the load rises only 2πr'),
           24, 62, '#d8e6e0', 19);

    /* 軸承座 */
    bearing25(ctx, 116, AY, 11);
    bearing25(ctx, 462, AY, 11);
    /* 貫穿的軸心 */
    cyl25(ctx, 108, 476, AY, 10, '#8d9c95', ang, 0);

    /* 小軸（捲筒）先畫，大輪在它前面 */
    cyl25(ctx, DX - 58, DX + 10, AY, r, '#ff8040', ang, 4);
    helix25(ctx, DX - 46, AY, r, 15, 2.0, '#d8e6e0', ang, -1);

    /* ── 手握在輪緣上，跟著輪子繞 ──
       轉到「後面」那半圈的時候，手是被輪子擋住的。
       不分前後一律畫在最上面，等於又犯了同時看到兩個面的毛病。 */
    const rx = R * SQ, RG = R + 9, P2 = Math.PI / 2;
    const handFront = Math.cos(ang) > 0;
    const grip = (front) => {
      ctx.save(); ctx.lineCap = 'round';
      ctx.strokeStyle = front ? '#ffe066' : 'rgba(255,224,102,0.3)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      if (front) ctx.ellipse(WX, AY, RG * SQ, RG, 0, -P2, P2);
      else ctx.ellipse(WX, AY, RG * SQ, RG, 0, P2, P2 * 3);
      ctx.stroke(); ctx.restore();
    };
    const hand = (front) => {
      const hx = WX + RG * SQ * Math.cos(ang), hy = AY + RG * Math.sin(ang);
      if (front) { glow4(ctx, '#ffe066', 14); ctx.fillStyle = '#ffe066'; }
      else ctx.fillStyle = 'rgba(255,224,102,0.32)';
      ctx.beginPath(); ctx.ellipse(hx, hy, 12, 15, 0, 0, Math.PI * 2); ctx.fill();
      noglow4(ctx);
      ctx.strokeStyle = front ? '#11261f' : 'rgba(17,38,31,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    };
    grip(false);
    if (!handFront) hand(false);
    disc25(ctx, WX, AY, R, 15, '#4dd2ff', ang, 8);
    grip(true);
    if (handFront) hand(true);

    /* 轉向箭頭：擺在輪和捲筒中間的空檔 */
    ctx.save();
    ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(282, AY, 24, 50, 0, -2.5, 1.4); ctx.stroke();
    const ea = 1.4;
    arrow4(ctx, 282 + 24 * Math.cos(ea - 0.22), AY + 50 * Math.sin(ea - 0.22),
                282 + 24 * Math.cos(ea), AY + 50 * Math.sin(ea), '#33cc99', 4, 13);
    ctx.restore();

    /* 半徑標示：畫在圓盤外面，不然會被輪輻蓋掉 */
    dim4(ctx, WX - 62, AY, WX - 62, AY - R, '#4dd2ff');
    dash4(ctx, WX - 68, AY - R, WX - 20, AY - R, 'rgba(77,210,255,0.45)', 1.5, [4, 5]);
    label4(ctx, tr('大輪 R', 'Wheel R'), WX - 74, AY - R / 2 + 6, '#4dd2ff', 19, 'right');
    dim4(ctx, DX + 46, AY, DX + 46, AY - r, '#ff8040');
    dash4(ctx, DX + 12, AY - r, DX + 52, AY - r, 'rgba(255,128,64,0.45)', 1.5, [4, 5]);
    label4(ctx, tr('小軸 r', 'Axle r'), DX + 58, AY - r / 2 + 6, '#ff8040', 19);

    /* ── 小軸上的繩：重物升 r×θ，這一段是照真實比例畫的 ── */
    const wx = DX - 24, wTop = 372 - lift;
    line4(ctx, wx, AY + r, wx, wTop, '#d8e6e0', 3);
    crate4(ctx, wx - 23, wTop, 46, 46, '#33cc99', 'W');
    dash4(ctx, wx + 26, 372, wx + 66, 372, 'rgba(51,204,153,0.5)', 1.5, [4, 5]);
    dash4(ctx, wx + 26, wTop, wx + 66, wTop, 'rgba(51,204,153,0.5)', 1.5, [4, 5]);
    dim4(ctx, wx + 54, 372, wx + 54, wTop, '#33cc99');
    label4(ctx, tr('重物升 2πr', 'load rises 2πr'), wx + 70, 300, '#33cc99', 19);

    /* ── 轉了幾圈：數字寫出來，學生才對得上「一圈」 ── */
    label4(ctx, tr(`已轉 ${(ang / TURN).toFixed(2)} 圈`, `${(ang / TURN).toFixed(2)} turns`),
           236, 250, '#ffe066', 21);

    /* ── 同一把尺：手走的一圈 vs 重物升的一圈 ── */
    const BX = 24, BW = 262;                     // BW 代表 2πR
    label4(ctx, tr('轉一圈，兩邊走的距離', 'One turn, one scale'), BX, 282, '#f6f3ea', 19);
    const frac = Math.min(ang / TURN, 1);
    ctx.fillStyle = 'rgba(255,224,102,0.22)';
    rr4(ctx, BX, 296, BW, 20, 5); ctx.fill();
    ctx.fillStyle = '#ffe066'; rr4(ctx, BX, 296, BW * frac, 20, 5); ctx.fill();
    label4(ctx, tr('手走 2πR', 'hand: 2πR'), BX + 4, 338, '#ffe066', 19);
    const bw2 = BW * r / R;
    ctx.fillStyle = 'rgba(51,204,153,0.22)';
    rr4(ctx, BX, 352, bw2, 20, 5); ctx.fill();
    ctx.fillStyle = '#33cc99'; rr4(ctx, BX, 352, bw2 * frac, 20, 5); ctx.fill();
    label4(ctx, tr('重物升 2πr', 'load: 2πr'), BX + 4, 394, '#33cc99', 19);
    const adv = (R / r).toFixed(1);
    label4(ctx, tr(`手走 ${adv} 倍遠 → 力只要 ${adv} 分之一`,
                   `${adv}× the path → ${adv}× less force`),
           BX, 428, '#33cc99', 20, 'left', true, 380);

    drawWheelItem(t3_wheel_item, 770, 206, ang);
  }

  /* 六個生活實例，全部用同一套 2.5D 骨架：
     一根水平軸，上面串著一個「大輪 R」和一個「小軸 r」。
     外觀各不相同，但骨架一模一樣——這正是要讓學生看見的事。 */
  function drawWheelItem(item, cx, cy, ang) {
    const it = WHEEL_ITEMS[item] || WHEEL_ITEMS.pencil;
    label4(ctx, tr(it.zh, it.en), cx, 92, '#f6f3ea', 21, 'center');

    const BIG = '#4dd2ff', SML = '#ff8040';
    ctx.save();

    if (item === 'screwdriver') {
      /* 粗握把 = 大輪，細刀桿 = 小軸，同一根軸 */
      cyl25(ctx, cx - 92, cx - 16, cy, 44, BIG, ang, 6);
      cyl25(ctx, cx - 16, cx + 84, cy, 12, SML, ang, 3);
      ctx.fillStyle = '#d8e6e0';
      ctx.beginPath();
      ctx.moveTo(cx + 84, cy - 12); ctx.lineTo(cx + 106, cy - 5);
      ctx.lineTo(cx + 106, cy + 5); ctx.lineTo(cx + 84, cy + 12);
      ctx.closePath(); ctx.fill();

    } else if (item === 'wheel') {
      /* 方向盤：盤面朝駕駛，轉向柱往後 */
      cyl25(ctx, cx - 108, cx + 10, cy, 22, SML, ang, 4);   // 轉向柱 = 小軸
      disc25(ctx, cx + 34, cy, 80, 15, BIG, ang, 3);

    } else if (item === 'faucet') {
      /* 水龍頭：轉軸是鉛直的，整組轉 90° 再畫。
         把手本來就是「四根」——手抓哪一根，那一點繞出來的圓就是 R。
         改成實心圓盤是把這件事藏起來，不能這樣偷懶。 */
      ctx.translate(cx, cy + 16); ctx.rotate(-Math.PI / 2);
      cyl25(ctx, -92, 16, 0, 13, SML, ang, 3);      // 閥桿 = 小軸
      spokes25(ctx, 40, 0, 62, BIG, ang, 4, 10);    // 十字把手 = 大輪 R
      ctx.rotate(Math.PI / 2);
      /* 出水口 */
      ctx.fillStyle = '#8d9c95';
      rr4(ctx, -14, 34, 28, 58, 8); ctx.fill();
      rr4(ctx, -14, 84, 82, 24, 10); ctx.fill();
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(62, 98); ctx.lineTo(62, 114); ctx.stroke();

    } else if (item === 'doorknob') {
      /* 喇叭鎖：門在後面，轉軸穿過門 */
      ctx.fillStyle = 'rgba(163,184,176,0.16)';
      rr4(ctx, cx - 142, cy - 118, 62, 240, 6); ctx.fill();
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3;
      rr4(ctx, cx - 142, cy - 118, 62, 240, 6); ctx.stroke();
      cyl25(ctx, cx - 108, cx + 2, cy, 13, SML, ang, 3);
      disc25(ctx, cx + 40, cy, 58, 32, BIG, ang, 0);
      ctx.fillStyle = 'rgba(17,38,31,0.55)';
      ctx.beginPath(); ctx.ellipse(cx + 40, cy, 58 * SQ * 0.3, 58 * 0.3, 0, 0, Math.PI * 2); ctx.fill();

    } else if (item === 'copter') {
      /* 擀麵棍：中間粗的是大輪，兩端細握把是小軸 */
      cyl25(ctx, cx - 146, cx - 84, cy, 14, SML, ang, 3);
      cyl25(ctx, cx - 84, cx + 70, cy, 54, BIG, ang, 6);
      cyl25(ctx, cx + 70, cx + 134, cy, 14, SML, ang, 3);

    } else {
      /* 削鉛筆機：機身是 2.5D 的盒子，右側伸出軸，
         手搖把的「迴轉半徑」才是大輪 R，中心的刀輪是小軸 r。 */
      const bx = cx - 132, bw = 144, bh = 146, dep = 28;
      ctx.fillStyle = 'rgba(163,184,176,0.13)';
      ctx.beginPath();
      ctx.moveTo(bx, cy - bh / 2); ctx.lineTo(bx + dep, cy - bh / 2 - dep);
      ctx.lineTo(bx + bw + dep, cy - bh / 2 - dep); ctx.lineTo(bx + bw, cy - bh / 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(163,184,176,0.2)';
      ctx.beginPath();
      ctx.moveTo(bx + bw, cy - bh / 2); ctx.lineTo(bx + bw + dep, cy - bh / 2 - dep);
      ctx.lineTo(bx + bw + dep, cy + bh / 2 - dep); ctx.lineTo(bx + bw, cy + bh / 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(17,38,31,0.5)';
      rr4(ctx, bx, cy - bh / 2, bw, bh, 8); ctx.fill();
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3;
      rr4(ctx, bx, cy - bh / 2, bw, bh, 8); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx, cy - bh / 2); ctx.lineTo(bx + dep, cy - bh / 2 - dep);
      ctx.lineTo(bx + bw + dep, cy - bh / 2 - dep); ctx.lineTo(bx + bw, cy - bh / 2);
      ctx.moveTo(bx + bw + dep, cy - bh / 2 - dep); ctx.lineTo(bx + bw + dep, cy + bh / 2 - dep);
      ctx.lineTo(bx + bw, cy + bh / 2);
      ctx.stroke();
      /* 前面開一個窗，看得到裡面的刀輪 */
      ctx.save();
      ctx.beginPath(); ctx.ellipse(bx + bw / 2, cy, 38, 42, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = 'rgba(11,26,21,0.85)'; ctx.fillRect(bx, cy - bh, bw, bh * 2);
      cyl25(ctx, bx + bw / 2 - 24, bx + bw / 2, cy, 28, SML, ang * 1.6, 4);
      ctx.restore();
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(bx + bw / 2, cy, 38, 42, 0, 0, Math.PI * 2); ctx.stroke();
      /* 鉛筆插孔 */
      ctx.fillStyle = '#ffe066';
      rr4(ctx, bx - 34, cy - 9, 40, 18, 4); ctx.fill();
      /* 右側伸出的軸 + 手搖把 */
      const sx = bx + bw + dep + 24;
      cyl25(ctx, sx - 32, sx, cy - dep, 10, SML, ang * 1.6, 3);
      const CR = 80, a = ang * 1.6;
      ctx.save(); ctx.setLineDash([5, 6]);
      ctx.strokeStyle = 'rgba(77,210,255,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(sx, cy - dep, CR * SQ, CR, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      const hxp = sx + CR * SQ * Math.cos(a), hyp = cy - dep + CR * Math.sin(a);
      ctx.strokeStyle = BIG; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(sx, cy - dep); ctx.lineTo(hxp, hyp); ctx.stroke();
      ctx.fillStyle = BIG;
      ctx.beginPath(); ctx.ellipse(hxp, hyp, 12, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = lighten4(BIG, 0.3); ctx.lineWidth = 2; ctx.stroke();
      label4(ctx, tr('手搖的迴轉半徑 = R', 'crank radius = R'), sx - 20, cy - dep + CR + 30, BIG, 18, 'center');
    }
    ctx.restore();

    label4(ctx, tr('藍色 = 手碰到的大輪 R', 'Blue = the big wheel R you touch'),
           cx, 352, '#4dd2ff', 19, 'center', true, 352);
    label4(ctx, tr('橘色 = 真正做事的小軸 r', 'Orange = the small axle r doing the work'),
           cx, 382, '#ff8040', 19, 'center', true, 352);
  }

  /* ══════════════════════════════════════════════════════════════
     分頁三之二：定滑輪 vs 動滑輪
       原版是兩張圖擺在一起。這一版讓兩邊「同時動」，
       而且把「繩子被拉走多少」跟「重物升多少」兩個距離都畫出來對照。

       動滑輪的手是「往上拉」的：繩子一端綁在天花板，繞過動滑輪，
       另一端往上回到手裡。手在滑輪的上方，不是下方——
       原檔本來就畫對了（hand_y_mov = 150 - offset*2，箭頭朝上）。
     ══════════════════════════════════════════════════════════════ */
  function drawPulleys() {
    txt4(ctx, tr('定滑輪只轉方向，動滑輪才省力 —— 但省下來的力，全部由繩長補回去',
                 'A fixed pulley only turns the direction; a movable one halves the force but doubles the rope'),
         24, 34, '#f6f3ea', 23);

    const D = 40;                                            // 整個行程
    const d = (Math.sin(animTime * 0.8) * 0.5 + 0.5) * D;    // 重物升降 0～40

    /* ══ 左：定滑輪 —— 手往下拉 ══ */
    (function fixed() {
      const px = 230, py = 148, R = 46;
      ctx.fillStyle = '#a3b8b0'; ctx.fillRect(px - 62, 84, 124, 12);
      line4(ctx, px, 96, px, py - R, '#d8e6e0', 4);

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#f6f3ea';
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(77,210,255,0.5)'; ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const a = animTime * 0.9 + i * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(px + 10 * Math.cos(a), py + 10 * Math.sin(a));
        ctx.lineTo(px + (R - 6) * Math.cos(a), py + (R - 6) * Math.sin(a)); ctx.stroke();
      }

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px, py, R, Math.PI, 0); ctx.stroke();   // 繩繞過輪頂
      const boxTop = 300 - d;
      line4(ctx, px - R, py, px - R, boxTop, '#ffe066', 3);
      crate4(ctx, px - R - 26, boxTop, 52, 52, '#33cc99', 'W');

      const handY = 244 + d;                      // 重物升多少，手就往下走多少
      line4(ctx, px + R, py, px + R, handY, '#ffe066', 3);
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(px + R, handY, 11, 0, Math.PI * 2); ctx.fill();
      arrow4(ctx, px + R, handY + 16, px + R, handY + 46, '#ffe066', 5, 14);
      label4(ctx, 'F = W', px + R + 18, handY + 40, '#ffe066', 20);

      /* 量尺固定量「整個行程」（0～40），不是當下那一格，
         否則 d 擺盪到 0 的瞬間箭頭會縮成一個點，兩邊也就沒得比。 */
      dash4(ctx, px - R - 76, 300, px - R - 20, 300, 'rgba(51,204,153,0.45)', 1.5, [4, 5]);
      dash4(ctx, px - R - 76, 300 - D, px - R - 20, 300 - D, 'rgba(51,204,153,0.45)', 1.5, [4, 5]);
      dim4(ctx, px - R - 64, 300, px - R - 64, 300 - D, '#33cc99');
      label4(ctx, tr('升 d', 'rise d'), px - R - 76, 300 - D / 2 + 6, '#33cc99', 19, 'right');
      dash4(ctx, px + R + 20, 244, px + R + 100, 244, 'rgba(77,210,255,0.45)', 1.5, [4, 5]);
      dash4(ctx, px + R + 20, 244 + D, px + R + 100, 244 + D, 'rgba(77,210,255,0.45)', 1.5, [4, 5]);
      dim4(ctx, px + R + 88, 244, px + R + 88, 244 + D, '#4dd2ff');
      label4(ctx, tr('拉 d', 'pull d'), px + R + 100, 244 + D / 2 + 6, '#4dd2ff', 19);

      label4(ctx, tr('定滑輪：力不變、距離也不變', 'Fixed: same force, same distance'),
             px, 416, '#4dd2ff', 20, 'center');
    })();

    dash4(ctx, 480, 70, 480, 400, 'rgba(255,255,255,0.22)', 2, [6, 8]);

    /* ══ 右：動滑輪 —— 手往上拉 ══ */
    (function movable() {
      const px = 690, R = 40;
      const py = 308 - d;                          // 滑輪本身跟著重物一起上下
      ctx.fillStyle = '#a3b8b0'; ctx.fillRect(px - 92, 84, 190, 12);

      /* 左股繩：一端綁死在天花板 */
      line4(ctx, px - R, 96, px - R, py, '#ffe066', 3);
      /* 右股繩：繞過滑輪之後往上回到手裡，手在滑輪上方 */
      const handY = 232 - d * 2;
      line4(ctx, px + R, py, px + R, handY, '#ffe066', 3);

      ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#f6f3ea';
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(51,204,153,0.5)'; ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const a = -animTime * 0.9 + i * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(px + 10 * Math.cos(a), py + 10 * Math.sin(a));
        ctx.lineTo(px + (R - 6) * Math.cos(a), py + (R - 6) * Math.sin(a)); ctx.stroke();
      }

      /* 繩子從底下繞過動滑輪（畫在輪圈之後，才看得到繩在槽裡） */
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI); ctx.stroke();
      /* 重物吊在滑輪的軸上，不是吊在繩子上 */
      line4(ctx, px, py, px, py + R + 8, '#d8e6e0', 4);
      crate4(ctx, px - 24, py + R + 8, 48, 48, '#33cc99', 'W');

      /* 手：在滑輪上方，施力箭頭朝上 */
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(px + R, handY, 11, 0, Math.PI * 2); ctx.fill();
      arrow4(ctx, px + R, handY - 16, px + R, handY - 46, '#ffe066', 5, 14);
      label4(ctx, 'F = W / 2', px + R + 18, handY - 30, '#ffe066', 20);

      /* 同樣量整個行程：升 40，拉 80 —— 兩條擺在一起才看得出「剛好兩倍」 */
      dash4(ctx, px - 104, 356, px - 44, 356, 'rgba(51,204,153,0.45)', 1.5, [4, 5]);
      dash4(ctx, px - 104, 356 - D, px - 44, 356 - D, 'rgba(51,204,153,0.45)', 1.5, [4, 5]);
      dim4(ctx, px - 92, 356, px - 92, 356 - D, '#33cc99');
      label4(ctx, tr('升 d', 'rise d'), px - 104, 356 - D / 2 + 6, '#33cc99', 19, 'right');
      dash4(ctx, px + R + 20, 232, px + R + 112, 232, 'rgba(77,210,255,0.45)', 1.5, [4, 5]);
      dash4(ctx, px + R + 20, 232 - D * 2, px + R + 112, 232 - D * 2, 'rgba(77,210,255,0.45)', 1.5, [4, 5]);
      dim4(ctx, px + R + 100, 232, px + R + 100, 232 - D * 2, '#4dd2ff');
      label4(ctx, tr('拉 2d', 'pull 2d'), px + R + 114, 232 - D + 6, '#4dd2ff', 19);

      label4(ctx, tr('動滑輪：力減半、繩長加倍', 'Movable: half the force, twice the rope'),
             px, 430, '#33cc99', 20, 'center');
    })();
  }

  // ============== 分頁四：斜面推拉、螺旋自轉與生活手繪應用 ==============
  function setTab4Mode(mode, btn) {
    t4_mode = mode;
    document.querySelectorAll('.btn-switch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    document.getElementById('inc-sub-controls').style.display = (mode === 'inclined') ? 'block' : 'none';
    document.getElementById('screw-sub-controls').style.display = (mode === 'screw') ? 'block' : 'none';
    document.getElementById('apps-sub-controls').style.display = (mode === 'apps') ? 'block' : 'none';

    if (mode === 'inclined') startInclineAction('reset');
    if (mode === 'screw') resetScrewWinding();

    updateTab4();
  }

  function startInclineAction(action) {
    if (action === 'reset') {
      t4_incline_state = 'idle';
      t4_incline_prog = 0;
    } else if (action === 'push') {
      t4_incline_state = 'pushing';
      t4_incline_prog = 0;
    } else if (action === 'lift') {
      t4_incline_state = 'lifting';
      t4_incline_prog = 0;
    }
    updateTab4();
  }

  function startScrewWinding() {
    t4_screw_state = 'winding';
    t4_screw_time = 0;
  }

  function resetScrewWinding() {
    t4_screw_state = 'idle';
    t4_screw_time = 0;
  }

          <span style="margin-top:8px;">👉 <b>${tr('下列 (陡斜面)：', 'Bottom (Steep):')}</b>${tr('捲動圈數少，螺紋稀疏（<b>螺距 d 大</b>）➔ <b class="hl-coral">較為費力，但省距離！</b>', 'Fewer turns, sparse threads (<b>large pitch d</b>) ➔ <b class="hl-coral">Requires more force, fewer turns!</b>')}</span>

  // --- 手繪火柴人 ---
  /* ==================================================================
     V5 手繪工具層（work_4 簡單機械）
     畫布固定 960 × 440，全部座標以此為準。
     ================================================================== */

  function pen4(c) { c.lineJoin = 'round'; c.lineCap = 'round'; }

  function rr4(c, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.lineTo(x + w - rr, y); c.quadraticCurveTo(x + w, y, x + w, y + rr);
    c.lineTo(x + w, y + h - rr); c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    c.lineTo(x + rr, y + h); c.quadraticCurveTo(x, y + h, x, y + h - rr);
    c.lineTo(x, y + rr); c.quadraticCurveTo(x, y, x + rr, y);
    c.closePath();
  }

  function glow4(c, color, blur) { c.shadowColor = color; c.shadowBlur = blur || 16; }
  function noglow4(c) { c.shadowBlur = 0; c.shadowColor = 'rgba(0,0,0,0)'; }

  function line4(c, x1, y1, x2, y2, color, w) {
    c.strokeStyle = color; c.lineWidth = w || 3;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  }
  function dash4(c, x1, y1, x2, y2, color, w, pat) {
    c.save(); c.setLineDash(pat || [9, 7]);
    line4(c, x1, y1, x2, y2, color, w || 2);
    c.restore();
  }
  function arrow4(c, x1, y1, x2, y2, color, w, head) {
    const s = head || 14;
    const a = Math.atan2(y2 - y1, x2 - x1);
    line4(c, x1, y1, x2 - s * 0.6 * Math.cos(a), y2 - s * 0.6 * Math.sin(a), color, w || 4);
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(x2, y2);
    c.lineTo(x2 - s * Math.cos(a - 0.42), y2 - s * Math.sin(a - 0.42));
    c.lineTo(x2 - s * Math.cos(a + 0.42), y2 - s * Math.sin(a + 0.42));
    c.closePath(); c.fill();
  }
  /* 雙箭頭尺寸線 */
  function dim4(c, x1, y1, x2, y2, color) {
    arrow4(c, x1, y1, x2, y2, color, 2.5, 11);
    arrow4(c, x2, y2, x1, y1, color, 2.5, 11);
  }

  function txt4(c, s, x, y, color, size, align, maxW) {
    c.fillStyle = color;
    c.font = `bold ${size || 20}px "Noto Sans TC", "JetBrains Mono"`;
    if (maxW) fit4(c, s, maxW, 13);
    c.textAlign = align || 'left';
    c.fillText(s, x, y);
    c.textAlign = 'left';
  }
  /* 第一定律 1.1：寫在色塊裡或有邊界的字，先量再寫 */
  function fit4(c, s, maxW, floor) {
    const m = /([\d.]+)px/.exec(c.font); if (!m) return;
    let size = parseFloat(m[1]); const fl = floor || 12;
    while (size > fl && c.measureText(s).width > maxW) {
      size = Math.max(fl, size - 0.5);
      c.font = c.font.replace(/[\d.]+px/, size + 'px');
    }
  }
  /* 量一段文字有多寬（沿用目前的 font） */
  function w4(c, s, size) {
    const old = c.font;
    if (size) c.font = `bold ${size}px "Noto Sans TC", "JetBrains Mono"`;
    const r = c.measureText(s).width;
    c.font = old;
    return r;
  }

  /* 文字底襯：畫在深色底上、又剛好壓到線條時，先鋪一塊底再寫，
     避免第十定律 10.4 說的「畫了卻看不到」。 */
  function plate4(c, s, x, y, size, align, pad) {
    const p = pad === undefined ? 6 : pad;
    const wd = w4(c, s, size), h = size * 1.15;
    let lx = x;
    if (align === 'center') lx = x - wd / 2; else if (align === 'right') lx = x - wd;
    c.fillStyle = 'rgba(17, 38, 31, 0.82)';
    rr4(c, lx - p, y - size * 0.86 - p * 0.5, wd + p * 2, h + p, 6); c.fill();
  }
  /* maxW：這行字最多只能佔多寬。中文通常塞得下，英文常常塞不下——
     量過再寫，底襯也跟著縮到同一個字級，才不會底襯一個大小、字一個大小。 */
  function label4(c, s, x, y, color, size, align, plate, maxW) {
    let sz = size || 20;
    if (maxW) {
      c.font = `bold ${sz}px "Noto Sans TC", "JetBrains Mono"`;
      fit4(c, s, maxW, 13);
      sz = parseFloat(/([\d.]+)px/.exec(c.font)[1]);
    }
    if (plate !== false) plate4(c, s, x, y, sz, align);
    txt4(c, s, x, y, color, sz, align);
  }

  /* 斜線填充（木頭、地面、剖面） */
  function hatch4(c, x, y, w, h, color, gap, lw) {
    c.save();
    c.beginPath(); c.rect(x, y, w, h); c.clip();
    c.strokeStyle = color; c.lineWidth = lw || 1.5;
    c.beginPath();
    for (let i = -h; i < w + h; i += (gap || 12)) { c.moveTo(x + i, y + h); c.lineTo(x + i + h, y); }
    c.stroke();
    c.restore();
  }

  /* 木頭：底色 + 木紋 */
  function wood4(c, x, y, w, h) {
    c.fillStyle = '#3a3126';
    rr4(c, x, y, w, h, 5); c.fill();
    c.strokeStyle = '#8b7355'; c.lineWidth = 2.5;
    rr4(c, x, y, w, h, 5); c.stroke();
    c.save();
    c.beginPath(); rr4(c, x, y, w, h, 5); c.clip();
    c.strokeStyle = 'rgba(139, 115, 85, 0.55)'; c.lineWidth = 1.6;
    for (let i = 1; i <= 3; i++) {
      const yy = y + h * i / 4;
      c.beginPath(); c.moveTo(x, yy);
      for (let xx = x; xx <= x + w; xx += 24) c.lineTo(xx, yy + Math.sin(xx * 0.05 + i) * 2.5);
      c.stroke();
    }
    c.restore();
  }

  /* 金屬圓桿／橫樑 */
  function bar4(c, x, y, w, h, color, r) {
    const g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, 'rgba(255,255,255,0.35)');
    g.addColorStop(0.45, color);
    g.addColorStop(1, 'rgba(0,0,0,0.32)');
    c.fillStyle = g; rr4(c, x, y, w, h, r === undefined ? h / 2 : r); c.fill();
    c.strokeStyle = color; c.lineWidth = 2;
    rr4(c, x, y, w, h, r === undefined ? h / 2 : r); c.stroke();
  }

  /* 重物箱：漸層 + 圓角 + 高光 */
  function crate4(c, x, y, w, h, color, text) {
    glow4(c, color, 14);
    const g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, 'rgba(255,255,255,0.32)');
    g.addColorStop(0.4, color);
    g.addColorStop(1, 'rgba(0,0,0,0.28)');
    c.fillStyle = g; rr4(c, x, y, w, h, 8); c.fill();
    noglow4(c);
    c.strokeStyle = '#ffffff'; c.lineWidth = 2.5;
    rr4(c, x, y, w, h, 8); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.28)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x + 7, y + 7); c.lineTo(x + w - 7, y + h - 7);
    c.moveTo(x + w - 7, y + 7); c.lineTo(x + 7, y + h - 7); c.stroke();
    if (text) {
      c.font = 'bold 21px "Noto Sans TC"';
      fit4(c, text, w - 14, 13);
      txt4(c, text, x + w / 2, y + h / 2 + 8, '#11261f', parseFloat(/([\d.]+)px/.exec(c.font)[1]), 'center');
    }
  }

  /* 繩索：兩點之間帶一點下垂 */
  function rope4(c, x1, y1, x2, y2, color, sag) {
    c.strokeStyle = color || '#ffe066'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(x1, y1);
    c.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + (sag || 0), x2, y2);
    c.stroke();
  }

  /* ==================================================================
     2.5D 基本件
     輪軸畫成同心圓是錯的教法：轉起來輪和軸互相重疊，
     學生只看得到其中一個，反而看不出「兩個一起轉」。
     改成「同一根水平軸上、前後兩個位置」的立體畫法——
     圓盤的平面垂直於軸，從斜前方看就是一個「窄的橢圓」，
     輪輻掃過去一目了然，而且輪和軸永遠不會疊在一起。
     ================================================================== */

  const SQ = 0.40;                        // 側視壓扁比例：畫面寬 = 真實半徑 × SQ

  /* 一段水平圓柱：xL（後端）→ xR（前端），半徑 r
     ── 實心的東西只看得到「一個端面」。
     後端面是背對我們的，它唯一露出來的只有「最遠的那半圈輪廓」；
     靠我們的那半圈被柱身自己擋住了。
     把後端整顆畫成一個深色橢圓，畫面上就會同時出現前、後兩個圓——
     學生會看成「兩個輪子」，這是第十定律 10.4 的老問題：畫了，
     可是畫出來的東西不是真的看得到的東西。
     所以輪廓一次畫完：上緣 → 前端右半 → 下緣 → 後端左半。 */
  function cyl25(c, xL, xR, cy, r, color, ang, marks) {
    const rx = r * SQ, P2 = Math.PI / 2;
    c.beginPath();
    c.moveTo(xL, cy - r);
    c.lineTo(xR, cy - r);
    c.ellipse(xR, cy, rx, r, 0, -P2, P2);            // 前端面：右半圈
    c.lineTo(xL, cy + r);
    c.ellipse(xL, cy, rx, r, 0, P2, P2 * 3);         // 後端面：只有左半圈看得到
    c.closePath();
    const g = c.createLinearGradient(0, cy - r, 0, cy + r);
    g.addColorStop(0, 'rgba(0,0,0,0.38)');
    g.addColorStop(0.32, color);
    g.addColorStop(0.62, color);
    g.addColorStop(1, 'rgba(0,0,0,0.45)');
    c.fillStyle = g; c.fill();
    /* 越往後越暗：立體感靠這個，不是靠多畫一個圓 */
    c.save(); c.clip();
    const dg = c.createLinearGradient(xL - rx, 0, xR - rx * 0.2, 0);
    dg.addColorStop(0, 'rgba(0,0,0,0.34)');
    dg.addColorStop(0.5, 'rgba(0,0,0,0)');
    dg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = dg;
    c.fillRect(xL - rx - 2, cy - r - 2, (xR - xL) + rx * 2 + 6, r * 2 + 4);
    c.restore();
    /* 後端輪廓線：厚度靠它才看得出來 */
    c.strokeStyle = 'rgba(255,255,255,0.3)'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(xL, cy, rx, r, 0, P2, P2 * 3); c.stroke();
    /* 前端面 */
    const gg = c.createRadialGradient(xR - rx * 0.3, cy - r * 0.3, 2, xR, cy, r);
    gg.addColorStop(0, lighten4(color, 0.42));
    gg.addColorStop(1, color);
    c.fillStyle = gg;
    c.beginPath(); c.ellipse(xR, cy, rx, r, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = lighten4(color, 0.25); c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(xR, cy, rx, r, 0, 0, Math.PI * 2); c.stroke();
    /* 端面上的記號：看得出它在轉 */
    if (marks !== 0) {
      c.strokeStyle = 'rgba(17,38,31,0.62)'; c.lineWidth = 3;
      for (let i = 0; i < (marks || 4); i++) {
        const a = ang + i * Math.PI * 2 / (marks || 4);
        c.beginPath(); c.moveTo(xR, cy);
        c.lineTo(xR + rx * Math.cos(a) * 0.82, cy + r * Math.sin(a) * 0.82);
        c.stroke();
      }
    }
  }

  /* 大輪：薄圓盤 + 輪輻，平面垂直於水平軸 */
  function disc25(c, x, cy, R, thick, color, ang, spokes) {
    const rx = R * SQ, hub = R * 0.2;
    const NS = spokes === undefined ? 8 : spokes;
    /* 盤身的厚度 */
    cyl25(c, x - thick, x, cy, R, color, ang, 0);
    /* 輪輻 */
    c.strokeStyle = 'rgba(17,38,31,0.5)'; c.lineWidth = 5;
    for (let i = 0; NS > 0 && i < NS; i++) {
      const a = ang + i * Math.PI * 2 / NS;
      c.beginPath();
      c.moveTo(x + rx * Math.cos(a) * 0.22, cy + R * Math.sin(a) * 0.22);
      c.lineTo(x + rx * Math.cos(a) * 0.9, cy + R * Math.sin(a) * 0.9);
      c.stroke();
    }
    /* 輪轂 */
    c.fillStyle = lighten4(color, 0.3);
    c.beginPath(); c.ellipse(x, cy, hub * SQ, hub, 0, 0, Math.PI * 2); c.fill();
  }

  /* 只有輻條、沒有盤面的輪：水龍頭的十字把手、絞盤的手柄。
     老師說得對——「只要軌跡是圓的就可以了」：
     輪的半徑 R 是由「手握的那一點繞出來的圓」定義的，
     直接畫成一塊實心圓盤，就把這件事藏起來了。
     轉到後面去的那幾根要畫淡、而且先畫，才會被軸心擋住。 */
  function spokes25(c, x, cy, R, color, ang, n, armW) {
    const rx = R * SQ, N = n || 4, aw = armW || 9;
    /* 手走的軌跡 */
    c.save(); c.setLineDash([5, 6]);
    c.strokeStyle = 'rgba(255,255,255,0.3)'; c.lineWidth = 1.8;
    c.beginPath(); c.ellipse(x, cy, rx, R, 0, 0, Math.PI * 2); c.stroke();
    c.restore();
    const arms = [];
    for (let i = 0; i < N; i++) arms.push(ang + i * Math.PI * 2 / N);
    arms.sort((a, b) => Math.cos(a) - Math.cos(b));      // 後面的先畫
    for (const a of arms) {
      const front = Math.cos(a) > 0;
      const tx = x + rx * Math.cos(a), ty = cy + R * Math.sin(a);
      c.lineCap = 'round';
      c.strokeStyle = front ? color : 'rgba(216,230,224,0.28)';
      c.lineWidth = aw;
      c.beginPath(); c.moveTo(x, cy); c.lineTo(tx, ty); c.stroke();
      c.fillStyle = front ? lighten4(color, 0.28) : 'rgba(216,230,224,0.28)';
      c.beginPath(); c.ellipse(tx, ty, aw * 0.8, aw * 1.15, 0, 0, Math.PI * 2); c.fill();
    }
    /* 輪轂：壓在所有輻條上，後面那幾根就被擋掉了 */
    c.fillStyle = lighten4(color, 0.15);
    c.beginPath(); c.ellipse(x, cy, R * 0.16 * SQ + 5, R * 0.16 + 6, 0, 0, Math.PI * 2); c.fill();
  }

  function lighten4(hex, amt) {
    if (hex[0] !== '#') return hex;
    const n = parseInt(hex.slice(1), 16);
    const m = v => Math.round(v + (255 - v) * amt);
    return `rgb(${m((n >> 16) & 255)}, ${m((n >> 8) & 255)}, ${m(n & 255)})`;
  }

  /* 軸承座（三角形支架） */
  function bearing25(c, x, cy, r, color) {
    c.fillStyle = color || '#5c6b64';
    c.beginPath();
    c.moveTo(x - 22, cy + 96); c.lineTo(x + 22, cy + 96);
    c.lineTo(x + 9, cy + r + 4); c.lineTo(x - 9, cy + r + 4);
    c.closePath(); c.fill();
    c.strokeStyle = '#a3b8b0'; c.lineWidth = 2; c.stroke();
  }

  /* 纏在水平圓柱上的繩：dir = +1 / -1 決定繞的方向。
     正面（cos φ > 0）畫實線，背面畫淡線，才看得出是繞過去的。 */
  function helix25(c, x0, cy, r, pitch, turns, color, phase, dir) {
    const rx = r * SQ, d = dir || 1;
    const draw = (front) => {
      c.beginPath();
      let pen = false;
      for (let f = 0; f <= turns * Math.PI * 2; f += 0.06) {
        const ph = f * d + phase * d;
        const ax = x0 + (pitch / (Math.PI * 2)) * f;
        const x = ax + rx * Math.cos(ph), y = cy + r * Math.sin(ph);
        const isFront = Math.cos(ph) > 0;
        if (isFront === front) { if (pen) c.lineTo(x, y); else { c.moveTo(x, y); pen = true; } }
        else pen = false;
      }
      c.stroke();
    };
    c.save();
    c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 2.5; draw(false);
    c.strokeStyle = color; c.lineWidth = 4; draw(true);
    c.restore();
  }

    if (!c) return null;
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    pen4(g);
    return g;
  }

  function drawQuizFigs4() {
    const Y = '#ffe066', O = '#ff8040', C = '#4dd2ff', G = '#33cc99', W = '#a3b8b0';

    /* Q1 三類槓桿一次看完。
       支點的標籤放在三角形「旁邊」不是下面——放下面會直接撞到下一列的箭頭標籤。 */
    let g = fig4('q1fig');
    if (g) {
      const rows = [
        { y: 78,  zh: '第一類：支點在中間', en: 'First: fulcrum in middle',  order: ['E', 'F', 'L'] },
        { y: 190, zh: '第二類：抗力在中間', en: 'Second: load in middle',    order: ['F', 'L', 'E'] },
        { y: 302, zh: '第三類：施力在中間', en: 'Third: effort in middle',   order: ['F', 'E', 'L'] },
      ];
      rows.forEach(rw => {
        const x0 = 258, x1 = 632;
        bar4(g, x0, rw.y - 7, x1 - x0, 14, O, 7);
        label4(g, tr(rw.zh, rw.en), 26, rw.y + 7, '#f6f3ea', 20);
        rw.order.forEach((k, i) => {
          const x = x0 + 20 + (x1 - x0 - 40) * i / 2;
          if (k === 'F') {

            g.beginPath(); g.moveTo(x, rw.y + 9); g.lineTo(x - 14, rw.y + 34); g.lineTo(x + 14, rw.y + 34);
            g.closePath(); g.fill();
            label4(g, tr('支點', 'fulcrum'), x + 22, rw.y + 32, G, 18);
          } else if (k === 'L') {
            arrow4(g, x, rw.y - 14, x, rw.y - 46, C, 4, 13);
            label4(g, tr('抗力', 'load'), x, rw.y - 54, C, 18, 'center');
          } else {
            arrow4(g, x, rw.y - 14, x, rw.y - 46, Y, 4, 13);
            label4(g, tr('施力', 'effort'), x, rw.y - 54, Y, 18, 'center');
          }
        });
      });
      label4(g, tr('看「中間是誰」', 'Look at what is'), 872, 176, '#f6f3ea', 19, 'right');
      label4(g, tr('就分得出來', 'in the middle'), 872, 206, '#f6f3ea', 19, 'right');
    }

    /* Q2 鐵撬：畫成「一根水平的桿子」，兩隻力臂才量得清楚。
       上一版畫成斜的實體鐵撬，結果 600 N 的字直接壓在桿身上。 */

    if (g) {
      wood4(g, 60, 262, 800, 60);
      const by = 170, Fx = 760, Ax = 220;
      const Cx = Fx - (Fx - Ax) * (5 / 30);
      bar4(g, Ax - 14, by - 11, Fx - Ax + 28, 22, O, 11);

      /* 支點 */
      g.fillStyle = G;
      g.beginPath(); g.moveTo(Fx, by + 13); g.lineTo(Fx - 17, by + 46); g.lineTo(Fx + 17, by + 46);
      g.closePath(); g.fill();
      label4(g, tr('支點', 'fulcrum'), Fx + 26, by + 42, G, 19);

      g.beginPath(); g.moveTo(Cx - 5, by + 12); g.lineTo(Cx + 5, by + 12);
      g.lineTo(Cx + 3, by + 62); g.lineTo(Cx, by + 76); g.lineTo(Cx - 3, by + 62);

      line4(g, 624, fy, fx + R + 6, fy, 'rgba(77,210,255,0.5)', 2);

      line4(g, 624, my + 40, mx + R + 8, my + 40, 'rgba(51,204,153,0.5)', 2);

    }

    /* Q4 斜面：量尺要沿著「斜面」量，不是量底邊 —— 題目問的是斜面長 6 m */

    if (g) {
      const bx = 150, by = 300, sw = 560, sh = 186;

      g.strokeStyle = Y; g.lineWidth = 5;

      g.fillStyle = 'rgba(255,224,102,0.09)'; g.fill();

      const t = 0.54, cxp = bx + sw * t, cyp = by - sh * t;

      label4(g, tr('推力 = ?', 'push = ?'), cxp - 158, cyp + 60, G, 20);

    /* Q5 輪軸：水桶掛在輪子「外面」，標籤也全部移到輪圈外 */

    if (g) {
      const cx = 300, cy = 168, R = 112, r = 40;

      const ar = -2.34;                     // 往左上拉，避開左邊垂下來的手拉繩

      /* 水桶：掛在小軸上，拉到輪圈外面才畫得下 */
