<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-zh="簡單機械與功的原理：HTML5 互動黑板教學" data-en="Simple Machines & Principle of Work: Interactive Blackboard">簡單機械與功的原理：HTML5 互動黑板教學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #11261f;
    --bg-panel: #17332a;
    --bg-panel-hover: #1f4236;
    --chalk-white: #f6f3ea;
    --chalk-muted: #a3b8b0;
    --chalk-yellow: #ffe066;
    --chalk-teal: #4dd2ff;
    --chalk-coral: #ff8040;
    --chalk-green: #33cc99;
    --chalk-purple: #d4a5a5;
    --rule-color: rgba(246, 243, 234, 0.22);
    --shadow-dark: rgba(9, 20, 16, 0.9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
      radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
    background-size: 24px 24px, 16px 16px;
    background-position: 0 0, 8px 8px;
    color: var(--chalk-white);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    line-height: 1.65;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; padding-top: 40px; padding-bottom: 16px; border-bottom: 3px solid var(--chalk-green); }
  h1 { font-size: 36px; margin: 0 0 8px 0; color: var(--chalk-yellow); letter-spacing: 2px; font-weight: 700; }
  .subtitle { margin: 0; color: var(--chalk-teal); font-size: 22px; font-weight: 700; }

  .language-switch {
    position: fixed; z-index: 3000;
    top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border: 2px solid var(--chalk-teal); border-radius: 12px;
    background: rgba(17, 38, 31, 0.96); box-shadow: 0 8px 24px var(--shadow-dark), 0 0 16px rgba(77, 210, 255, 0.2);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .language-label { color: var(--chalk-teal); font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .lang-btn {
    min-width: 58px; min-height: 48px; padding: 8px 12px;
    border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 9px;
    background: var(--bg-base); color: var(--chalk-white);
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .lang-btn.active { background: var(--chalk-teal); color: var(--bg-base); border-color: var(--chalk-teal); }
  .lang-btn:focus-visible { outline: 3px solid rgba(255, 224, 102, 0.75); outline-offset: 3px; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .tab-btn {
    padding: 14px 10px; font-size: 20px; font-weight: 700; background: rgba(255, 255, 255, 0.05);
    color: var(--chalk-muted); border: 2px dashed var(--rule-color); border-radius: 10px;
    cursor: pointer; transition: all 0.2s ease; text-align: center; min-height: 60px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    white-space: normal; display: flex; align-items: center; justify-content: center; line-height: 1.2;
  }
  .tab-btn:hover { background: var(--bg-panel-hover); color: var(--chalk-white); border-color: var(--chalk-white); }
  .tab-btn.active { background: var(--bg-panel); color: var(--chalk-yellow); border: 2px solid var(--chalk-yellow); box-shadow: 0 0 16px rgba(255, 224, 102, 0.25); }

  .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .panel { background: var(--bg-panel); border: 2px solid var(--rule-color); border-radius: 16px; padding: 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px dashed var(--rule-color); padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  h2 { margin: 0; font-size: 28px; color: var(--chalk-teal); }
  .sub-tag { font-size: 19px; color: var(--bg-base); background: var(--chalk-green); padding: 6px 18px; border-radius: 999px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

  .stage-container { width: 100%; border: 2px solid var(--chalk-yellow); border-radius: 12px; overflow: hidden; background: #0d201a; position: relative; margin-bottom: 20px; box-shadow: 0 4px 15px var(--shadow-dark); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 960 / 440; }

  .controls { background: rgba(0, 0, 0, 0.35); padding: 20px; border-radius: 12px; border: 2px dashed var(--chalk-teal); margin-bottom: 20px; }
  .control-group { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .control-group:last-child { margin-bottom: 0; }
  label { font-weight: 700; color: var(--chalk-teal); font-size: 20px; }
  input[type=range] { flex: 1; height: 10px; accent-color: var(--chalk-yellow); cursor: pointer; min-height: 48px; }
  .readout-badge { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--bg-base); background: var(--chalk-yellow); padding: 6px 16px; border-radius: 8px; min-width: 110px; text-align: center; font-size: 20px; }

  .stats { background: transparent; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
  .stat-row { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; flex-wrap: wrap; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--rule-color); border-radius: 12px; padding: 14px 20px; font-size: 20px; font-weight: 700; }
  .val-badge { background: #11261f; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; color: var(--chalk-white); display: inline-flex; align-items: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }

  .hl-yellow { color: var(--chalk-yellow) !important; } .hl-teal { color: var(--chalk-teal) !important; } .hl-coral { color: var(--chalk-coral) !important; } .hl-green { color: var(--chalk-green) !important; }

  .math-fraction { display: inline-flex; flex-direction: column; justify-content: center; align-items: center; vertical-align: middle; margin: 0 8px; line-height: 1.2; font-family: 'JetBrains Mono', monospace; }
  .math-fraction .num { border-bottom: 2px solid var(--chalk-white); padding: 0 6px 2px; }
  .math-fraction .den { padding: 2px 6px 0; }

  .note { font-size: 20px; color: var(--chalk-white); line-height: 1.8; background: var(--bg-panel); padding: 22px; border-radius: 12px; border: 2px solid var(--chalk-white); }
  .note ul { margin: 10px 0 0 0; padding-left: 26px; }
  .note li { margin-bottom: 10px; }
  .formula-box { font-family: 'JetBrains Mono', monospace; background: rgba(0, 0, 0, 0.35); padding: 16px 24px; border-radius: 10px; border: 1px dashed var(--chalk-white); margin: 16px 0; text-align: center; font-size: 22px; color: var(--chalk-teal); display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }

  .btn-switch { padding: 10px 18px; border: 2px solid var(--chalk-teal); background: transparent; color: var(--chalk-teal); border-radius: 8px; font-size: 19px; font-weight: 700; cursor: pointer; transition: 0.2s; min-height: 48px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .btn-switch:hover, .btn-switch.active { background: var(--chalk-teal); color: var(--bg-base); }

  .btn-action-group { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .btn-action { padding: 10px 20px; font-size: 19px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.2s; min-height: 48px; border: 2px solid var(--chalk-yellow); background: var(--bg-base); color: var(--chalk-yellow); touch-action: manipulation; }
  .btn-action:hover, .btn-action.active { background: var(--chalk-yellow); color: var(--bg-base); }
  .btn-action.btn-green { border-color: var(--chalk-green); color: var(--chalk-green); }
  .btn-action.btn-green:hover, .btn-action.btn-green.active { background: var(--chalk-green); color: var(--bg-base); }
  .btn-action.btn-coral { border-color: var(--chalk-coral); color: var(--chalk-coral); }
  .btn-action.btn-coral:hover, .btn-action.btn-coral.active { background: var(--chalk-coral); color: var(--bg-base); }
  .btn-action.btn-teal { border-color: var(--chalk-teal); color: var(--chalk-teal); }
  .btn-action.btn-teal:hover, .btn-action.btn-teal.active { background: var(--chalk-teal); color: var(--bg-base); }

  .prop-table { width: 100%; border-collapse: collapse; margin-top: 14px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; overflow: hidden; }
  .prop-table th, .prop-table td { padding: 12px 14px; text-align: center; border: 1px solid var(--rule-color); font-size: 19px; }
  .prop-table th { background: rgba(77, 210, 255, 0.15); color: var(--chalk-teal); font-weight: 700; }

  .nw { white-space: nowrap; }

  @media (max-width: 1023px) { body { font-size: 20px; } .tabs { grid-template-columns: 1fr 1fr; } .stat-row { font-size: 19px; } }
  @media (max-width: 520px) { .language-label { display: none; } .language-switch { top: 8px; right: 8px; padding: 6px; } .tabs { grid-template-columns: 1fr; } .panel { padding: 16px; } .control-group { flex-direction: column; align-items: stretch; gap: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- 懸浮雙語切換 -->
  <div class="language-switch" role="group" aria-label="語言切換">
    <span class="language-label" data-zh="Language" data-en="Language">Language</span>
    <button class="lang-btn active" type="button" data-lang="zh" aria-pressed="true">中文</button>
    <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <header>
    <h1 data-zh="⚙️ 簡單機械與功的原理" data-en="⚙️ Simple Machines & Principle of Work">⚙️ 簡單機械與功的原理</h1>
    <div class="subtitle" data-zh="國中自然科核心單元：功的黃金鐵律、銳角拔釘演練、輪軸實例解剖與斜面螺旋" data-en="Core Physics Unit: Golden Rule of Work, Levers, Wheel & Axle, and Inclined Planes">國中自然科核心單元：功的黃金鐵律、銳角拔釘演練、輪軸實例解剖與斜面螺旋</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab1', this)" data-zh="簡單機械與功" data-en="Work & Machines">簡單機械與功</button>
    <button class="tab-btn" onclick="switchTab('tab2', this)" data-zh="槓桿與拔釘演練" data-en="Levers & Claw Hammer">槓桿與拔釘演練</button>
    <button class="tab-btn" onclick="switchTab('tab3', this)" data-zh="輪軸與滑輪系統" data-en="Wheel, Axle & Pulleys">輪軸與滑輪系統</button>
    <button class="tab-btn" onclick="switchTab('tab4', this)" data-zh="斜面與螺旋原理" data-en="Inclined Planes & Screws">斜面與螺旋原理</button>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 id="panel-title">簡單機械之目的與功的黃金鐵律</h2>
      <span id="panel-badge" class="sub-tag">能量守恆</span>
    </div>

    <div class="grid-container">
      <div class="stage-container">
        <canvas id="stage" width="960" height="440"></canvas>
      </div>

      <div>
        <div class="controls" id="dynamic-controls"></div>
        <div class="stats" id="dynamic-stats"></div>
      </div>

      <div class="note" id="note-text"></div>
    </div>
  </div>
</div>

<script>
  let LANG = 'zh';

  function tr(zhText, enText) { return LANG === 'en' ? enText : zhText; }

  function applyTranslations() {
    document.querySelectorAll('[data-zh][data-en]').forEach(el => {
      if (el.tagName === 'INPUT' && el.type === 'button') {
        el.value = el.getAttribute(`data-${LANG}`);
      } else {
        el.innerHTML = el.getAttribute(`data-${LANG}`);
      }
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
      const isActive = b.dataset.lang === LANG;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-pressed', String(isActive));
    });
  }

  function setLanguage(lang) {
    LANG = lang;
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
    applyTranslations();
    renderCurrentTabUI();
  }

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.addEventListener('click', () => setLanguage(b.dataset.lang));
  });

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  let currentTab = 'tab1';
  let animTime = 0;

  // 物理互動操作變數
  let t1_f = 50, t1_s = 4;
  let t2_arm_eff = 30, t2_arm_res = 5, t2_res_force = 600;
  let t3_mode = 'wheel';
  let t3_wheel_item = 'pencil';

  // 分頁四互動控制變數
  let t4_mode = 'inclined';
  let t4_len = 6, t4_h = 2;
  let t4_incline_state = 'idle'; 
  let t4_incline_prog = 0;
  let t4_screw_state = 'idle';   
  let t4_screw_time = 0;

  const dynamicControls = document.getElementById('dynamic-controls');
  const dynamicStats = document.getElementById('dynamic-stats');

  function switchTab(tab, btn) {
    currentTab = tab;
    animTime = 0;
    if (btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    renderCurrentTabUI();
  }

  function renderCurrentTabUI() {
    const title = document.getElementById('panel-title');
    const badge = document.getElementById('panel-badge');
    const note = document.getElementById('note-text');

    if (currentTab === 'tab1') {
      title.textContent = tr('簡單機械之目的與功的黃金鐵律', 'Purpose of Machines & Golden Rule of Work');
      badge.textContent = tr('能量守恆', 'Energy Conservation');
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>${tr('施力大小', 'Effort Force')} (<span class="nw mono">F</span>)：</label>
          <input id="rng-t1-f" type="range" min="20" max="100" step="10" value="${t1_f}" oninput="t1_f=parseFloat(this.value); document.getElementById('val-t1-f').textContent=t1_f+' N'; updateTab1();">
          <span id="val-t1-f" class="readout-badge">${t1_f} N</span>
        </div>
        <div class="control-group">
          <label>${tr('施力位移', 'Effort Distance')} (<span class="nw mono">S</span>)：</label>
          <input id="rng-t1-s" type="range" min="1" max="10" step="1" value="${t1_s}" oninput="t1_s=parseFloat(this.value); document.getElementById('val-t1-s').textContent=t1_s+' m'; updateTab1();">
          <span id="val-t1-s" class="readout-badge">${t1_s} m</span>
        </div>
        <div style="text-align:center; color:var(--chalk-teal); font-size:19px; margin-top:10px;">
          ${tr('👉 觀察「省力必費距離」：輸入功的總量 <span class="nw mono">W = F × S</span> 恆定不變！', '👉 Force vs. Distance Trade-off: Total input work <span class="nw mono">W = F × S</span> is invariant!')}
        </div>
      `;

      note.innerHTML = `
        💡 <b>${tr('黑板重點：', 'Key Concepts:')}</b>
        <ul>
          <li><b>${tr('何謂簡單機械：', 'Simple Machines:')}</b>${tr('能協助人類作功的單純工具，如槓桿、輪軸、滑輪、齒輪、斜面與螺旋。', 'Basic devices aiding mechanical work: levers, wheel & axle, pulleys, gears, inclined planes, and screws.')}</li>
          <li><b>${tr('使用目的三大核心：', 'Three Main Purposes:')}</b>
            <br>① <span class="nw"><b>${tr('省力', 'Save Force')}</b></span>：${tr('施力小於物重，但必定<span class="nw"><b>費距離（費時）</b></span>。', 'Effort is less than load, but requires <span class="nw"><b>greater distance</b></span>.')}
            <br>② <span class="nw"><b>${tr('省時', 'Save Distance/Time')}</b></span>：${tr('施力距離小於物體移動距離，但必定<span class="nw"><b>費力</b></span>。', 'Effort distance is smaller than load displacement, but requires <span class="nw"><b>greater force</b></span>.')}
            <br>③ <span class="nw"><b>${tr('操作方便', 'Convenience')}</b></span>：${tr('僅改變施力方向（如定滑輪），不省力亦不費力。', 'Only changes the direction of force (e.g., fixed pulley), without changing force magnitude.')}
          </li>
          <li><b>${tr('功的原理 (黃金鐵律)：', 'Principle of Work (Golden Rule):')}</b>${tr('任何簡單機械<span class="nw"><b>絕對無法省功！</b></span> 在無摩擦力之理想狀態下，操作者輸入之總功，必等於機械對物體輸出之功。', 'No machine can ever save work! In frictionless conditions, Work Input equals Work Output.')}
            <div class="formula-box">
              <span class="nw">W<sub>${tr('施', 'in')}</sub> = W<sub>${tr('抗', 'out')}</sub> 👉 F<sub>${tr('施', 'in')}</sub> × S<sub>${tr('施', 'in')}</sub> = F<sub>${tr('抗', 'out')}</sub> × S<sub>${tr('抗', 'out')}</sub></span>
            </div>
          </li>
        </ul>
      `;
      updateTab1();
    }
    else if (currentTab === 'tab2') {
      title.textContent = tr('槓桿分類與銳角鐵撬拔釘演練', 'Lever Classes & Claw Hammer Practice');
      badge.textContent = tr('實戰試題', 'Exam Practice');
      
      dynamicControls.innerHTML = `
        <div class="control-group">
          <label>${tr('握柄施力臂', 'Effort Arm')} (<span class="nw mono">L<sub>${tr('施', 'e')}</sub></span>)：</label>
          <input id="rng-eff" type="range" min="15" max="45" step="5" value="${t2_arm_eff}" oninput="t2_arm_eff=parseFloat(this.value); document.getElementById('val-eff').textContent=t2_arm_eff+' cm'; updateTab2();">
          <span id="val-eff" class="readout-badge">${t2_arm_eff} cm</span>
        </div>
        <div class="control-group">
          <label>${tr('拔釘抗力臂', 'Resistance Arm')} (<span class="nw mono">L<sub>${tr('抗', 'r')}</sub></span>)：</label>
          <input id="rng-res" type="range" min="3" max="10" step="1" value="${t2_arm_res}" oninput="t2_arm_res=parseFloat(this.value); document.getElementById('val-res').textContent=t2_arm_res+' cm'; updateTab2();">
          <span id="val-res" class="readout-badge">${t2_arm_res} cm</span>
        </div>
        <div class="control-group">
          <label>${tr('鐵釘阻力', 'Nail Resistance')} (<span class="nw mono">F<sub>${tr('抗', 'r')}</sub></span>)：</label>
          <input id="rng-res-f" type="range" min="300" max="900" step="50" value="${t2_res_force}" oninput="t2_res_force=parseFloat(this.value); document.getElementById('val-res-f').textContent=t2_res_force+' N'; updateTab2();">
          <span id="val-res-f" class="readout-badge">${t2_res_force} N</span>
        </div>
      `;

      note.innerHTML = `
        💡 <b>${tr('黑板重點：', 'Key Concepts:')}</b>
        <ul>
          <li><b>${tr('槓桿分類與必考生活實例大彙整：', 'Lever Classes & Common Examples:')}</b>
            <table class="prop-table">
              <tr><th>${tr('類別', 'Class')}</th><th>${tr('結構特徵', 'Structure')}</th><th>${tr('機械特性', 'Property')}</th><th>${tr('常見實例', 'Examples')}</th></tr>

              <tr><td><b>${tr('第二類', '2nd Class')}</b></td><td>${tr('抗力在中間', 'Load in middle')}</td><td><b class="hl-yellow">${tr('恆省力費時', 'Always saves force')}</b></td><td>🛒 ${tr('手推車', 'Wheelbarrow')}, 🍾 ${tr('開瓶器', 'Bottle Opener')}, 🔪 ${tr('裁紙刀', 'Paper Cutter')}, 🥜 ${tr('胡桃鉗', 'Nutcracker')}</td></tr>

  function renderTab2() {
    ctx.clearRect(0, 0, 960, 440);
    animTime += 0.03;

    ctx.fillStyle = '#a3b8b0'; ctx.fillRect(180, 320, 600, 60);
    ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(180, 320, 600, 60);
    for(let i=338; i<=365; i+=15) {
      ctx.beginPath(); ctx.moveTo(195, i); ctx.lineTo(765, i); ctx.stroke();
    }

    let cx = 520, cy = 320;
    ctx.fillStyle = '#33cc99'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 22px "Noto Sans TC"';
    ctx.fillText(tr('丁 (支點)', 'D (Fulcrum)'), cx - 45, cy + 35);

    let tilt = (1 - Math.cos(animTime)) * 0.06; 
    ctx.save();
    ctx.translate(cx, cy); 
    ctx.rotate(tilt);

    let handleAng = -140 * Math.PI / 180;
    let hx = 230 * Math.cos(handleAng);
    let hy = 230 * Math.sin(handleAng);
    
    let cx_tip = 85 * Math.cos(-175 * Math.PI / 180);
    let cy_tip = 85 * Math.sin(-175 * Math.PI / 180);

    ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(0, 0);
    ctx.lineTo(cx_tip, cy_tip);
    ctx.stroke();

    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 20px "Noto Sans TC"';
    ctx.fillText(tr('乙 (施力臂 L施)', 'B (Effort Arm L_e)'), -180, -25);
    ctx.fillStyle = '#ffe066'; ctx.font = 'bold 22px "Noto Sans TC"';
    ctx.fillText(tr('甲 (施力點)', 'A (Effort Pt)'), -300, -150);
    ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 20px "Noto Sans TC"';
    ctx.fillText(tr('丙 (抗力點)', 'C (Load Pt)'), -115, -30);

    ctx.save();
    ctx.translate(cx_tip, cy_tip);
    ctx.rotate(-tilt); 
    
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#00E5FF';
    ctx.lineWidth = 3;
    ctx.fillRect(-25, -12, 50, 12);
    ctx.strokeRect(-25, -12, 50, 12);

    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(9, 0);
    ctx.lineTo(9, 50);
    ctx.lineTo(0, 75);
    ctx.lineTo(-9, 50);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    let fAng = handleAng + Math.PI / 2;
    let fLen = 90;
    let fx1 = hx, fy1 = hy;
    let fx2 = hx + fLen * Math.cos(fAng);
    let fy2 = hy + fLen * Math.sin(fAng);
    
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx1, fy1); ctx.lineTo(fx2, fy2); ctx.stroke();
    
    let headLen = 22;
    ctx.fillStyle = '#ffe066'; 
    ctx.beginPath(); 
    ctx.moveTo(fx2, fy2); 
    ctx.lineTo(fx2 - headLen * Math.cos(fAng - Math.PI/6), fy2 - headLen * Math.sin(fAng - Math.PI/6)); 
    ctx.lineTo(fx2 - headLen * Math.cos(fAng + Math.PI/6), fy2 - headLen * Math.sin(fAng + Math.PI/6)); 
    ctx.closePath(); 
    ctx.fill();
    
    ctx.font = 'bold 22px "JetBrains Mono", "Noto Sans TC"'; 
    ctx.fillText(tr('F施 (往上拉)', 'Effort F (Pull)'), fx2 + 15, fy2 - 5);

    let cornerSize = 25;
    let ux1 = Math.cos(handleAng + Math.PI);
    let uy1 = Math.sin(handleAng + Math.PI);
    let ux2 = Math.cos(fAng);
    let uy2 = Math.sin(fAng);
    
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.lineJoin = 'miter';
    ctx.beginPath();
    ctx.moveTo(hx + cornerSize*ux1, hy + cornerSize*uy1);
    ctx.lineTo(hx + cornerSize*ux1 + cornerSize*ux2, hy + cornerSize*uy1 + cornerSize*uy2);
    ctx.lineTo(hx + cornerSize*ux2, hy + cornerSize*uy2);
    ctx.stroke();

    ctx.restore();

    ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 24px "Noto Sans TC"';
    ctx.fillText(tr('銳角鐵撬拔釘幾何還原：往「右上角」施力上拉產生順時針力矩拔出鐵釘', 'Claw Hammer Geometry: Pulling towards upper-right generates torque'), 80, 45);
  }

  // ============== 分頁四：斜面推拉、螺旋自轉與生活手繪應用 ==============
  function setTab4Mode(mode, btn) {
    t4_mode = mode;
    document.querySelectorAll('.btn-switch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    document.getElementById('inc-sub-controls').style.display = (mode === 'inclined') ? 'block' : 'none';
    document.getElementById('screw-sub-controls').style.display = (mode === 'screw') ? 'block' : 'none';
    document.getElementById('apps-sub-controls').style.display = (mode === 'apps') ? 'block' : 'none';

    if (mode === 'inclined') startInclineAction('reset');
    if (mode === 'screw') resetScrewWinding();

    updateTab4();
  }

  function startInclineAction(action) {
    if (action === 'reset') {
      t4_incline_state = 'idle';
      t4_incline_prog = 0;
    } else if (action === 'push') {
      t4_incline_state = 'pushing';
      t4_incline_prog = 0;
    } else if (action === 'lift') {
      t4_incline_state = 'lifting';
      t4_incline_prog = 0;
    }
    updateTab4();
  }

  function startScrewWinding() {
    t4_screw_state = 'winding';
    t4_screw_time = 0;
  }

  function resetScrewWinding() {
    t4_screw_state = 'idle';
    t4_screw_time = 0;
  }

    let w_val = 120;

    if (t4_mode === 'inclined') {
      dynamicStats.innerHTML = `

    } else if (t4_mode === 'screw') {
      dynamicStats.innerHTML = `
        <div class="stat-row" style="flex-direction:column; align-items:flex-start; font-size:19px;">
          <span>👉 <b>${tr('上列 (緩斜面)：', 'Top (Gentle):')}</b>${tr('捲動圈數多，螺紋密集（<b>螺距 d 小</b>）➔ <b class="hl-yellow">極致省力，但費距離！</b>', 'More turns, dense threads (<b>small pitch d</b>) ➔ <b class="hl-yellow">Saves force, more turns!</b>')}</span>
          <span style="margin-top:8px;">👉 <b>${tr('下列 (陡斜面)：', 'Bottom (Steep):')}</b>${tr('捲動圈數少，螺紋稀疏（<b>螺距 d 大</b>）➔ <b class="hl-coral">較為費力，但省距離！</b>', 'Fewer turns, sparse threads (<b>large pitch d</b>) ➔ <b class="hl-coral">Requires more force, fewer turns!</b>')}</span>
        </div>
      `;
    } else {
      dynamicStats.innerHTML = `
        <div class="stat-row" style="flex-direction:column; align-items:flex-start; font-size:19px;">
          <span>🪜 <b>${tr('樓梯（階梯化斜面）：', 'Stairs (Stepped Incline):')}</b>${tr('將直角斷崖高度 h 轉化為平緩斜坡梯級，克服重力更輕鬆。', 'Converts steep vertical cliff h into stepped incline for safe and easy ascent.')}</span>
          <span style="margin-top:8px;">🛣️ <b>${tr('盤山公路（連續螺旋斜面）：', 'Winding Mountain Road (Helical Incline):')}</b>${tr('汽車與行人沿山壁環繞盤旋，以極長蜿蜒距離 L 換取微小推力 F，直達高聳山頂！', 'Vehicles and hikers spiral around the mountain, trading distance L for minimal engine climbing force F.')}</span>
        </div>
      `;
    }
  }

  // --- 手繪火柴人 ---
  function drawChalkPerson(ctx, x, y, angle, pose, color, scale) {
    if (scale === undefined) scale = 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    ctx.strokeStyle = color || '#33cc99';
    ctx.fillStyle = color || '#33cc99';
    ctx.lineWidth = scale < 0.5 ? 6 : 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 1. 頭部
    ctx.beginPath();
    ctx.arc(0, -52, 11, 0, Math.PI * 2);
    ctx.fill();

    // 2. 軀幹
    ctx.beginPath();
    ctx.moveTo(0, -41);
    ctx.lineTo(0, -14);
    ctx.stroke();

    // 3. 雙腿
    ctx.beginPath();
    if (pose === 'push') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-14, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 14);
    } else if (pose === 'lift') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-10, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 14);
    } else if (pose === 'climb') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-12, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(14, 2);
      ctx.lineTo(14, 14);
    } else if (pose === 'hike') {
      ctx.moveTo(0, -14);
      ctx.lineTo(-12, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(12, 12);
    } else {
      ctx.moveTo(0, -14);
      ctx.lineTo(-10, 14);
      ctx.moveTo(0, -14);
      ctx.lineTo(10, 14);
    }
    ctx.stroke();

    // 4. 手臂
    ctx.beginPath();
    if (pose === 'push') {
      ctx.moveTo(0, -32);
      ctx.lineTo(18, -25);
      ctx.lineTo(34, -20);
      ctx.moveTo(0, -32);
      ctx.lineTo(14, -18);
      ctx.lineTo(34, -14);
    } else if (pose === 'lift') {
      ctx.moveTo(0, -32);
      ctx.lineTo(16, -18);
      ctx.lineTo(28, -8);
      ctx.moveTo(0, -32);
      ctx.lineTo(20, -24);
      ctx.lineTo(32, -14);
    } else if (pose === 'climb') {
      ctx.moveTo(0, -32);
      ctx.lineTo(-14, -14);
      ctx.lineTo(-18, 0);
      ctx.moveTo(0, -32);
      ctx.lineTo(14, -22);
      ctx.lineTo(22, -10);
    } else if (pose === 'hike') {
      ctx.moveTo(0, -32);
      ctx.lineTo(-12, -16);
      ctx.lineTo(-16, -2);
      ctx.moveTo(0, -32);
      ctx.lineTo(14, -20);
      ctx.lineTo(18, -2);
      ctx.moveTo(18, -20);
      ctx.lineTo(22, 14);
    } else {
      ctx.moveTo(0, -32);
      ctx.lineTo(-10, -10);
      ctx.moveTo(0, -32);
      ctx.lineTo(10, -10);
    }
    ctx.stroke();

    ctx.restore();
  }

  function renderTab4() {
    ctx.clearRect(0, 0, 960, 440);

    let w_val = 120;
    let f_inc = (w_val * t4_h) / t4_len;

    if (t4_mode === 'inclined') {
      if (t4_incline_state === 'pushing') {
        t4_incline_prog += 0.012;
        if (t4_incline_prog >= 1) {
          t4_incline_prog = 1;
          t4_incline_state = 'pushed';
        }
      } else if (t4_incline_state === 'lifting') {
        t4_incline_prog += 0.012;
        if (t4_incline_prog >= 1) {
          t4_incline_prog = 1;
          t4_incline_state = 'lifted';
        }
      }

      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 24px "Noto Sans TC"';
      ctx.fillText(tr('斜面推升 (左) vs 鉛直直接抬升 (右) 施力與作功對照', 'Incline Push vs Vertical Lift: Force & Work'), 60, 40);

      let bx = 100, by = 360;
      let sw = 420, sh = (t4_h / 4) * 190;
      let inc_angle = Math.atan2(-sh, sw);

      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(40, by); ctx.lineTo(920, by); ctx.stroke();

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + sw, by); ctx.lineTo(bx + sw, by - sh); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = 'rgba(255, 224, 102, 0.08)'; ctx.fill();

      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 20px "JetBrains Mono"';
      ctx.fillText(`L = ${t4_len} m`, bx + sw/2 - 50, by - sh/2 - 25);
      
      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(bx + sw, by - sh); ctx.lineTo(bx + sw + 50, by - sh); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff8040';
      ctx.fillText(`h = ${t4_h} m`, bx + sw + 15, by - sh/2);

      let p_prog = (t4_incline_state === 'pushing' || t4_incline_state === 'pushed') ? t4_incline_prog : 0;
      let cx_box = bx + p_prog * sw;
      let cy_box = by - p_prog * sh;

      ctx.save();
      ctx.translate(cx_box, cy_box);
      ctx.rotate(inc_angle);
      
      ctx.fillStyle = '#4dd2ff'; ctx.fillRect(-25, -45, 55, 45);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(-25, -45, 55, 45);
      ctx.fillStyle = '#11261f'; ctx.font = 'bold 18px "JetBrains Mono"'; ctx.fillText('120N', -20, -17);

      drawChalkPerson(ctx, -56, -14, 0, 'push', '#33cc99', 1.0);

      ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(30, -22); ctx.lineTo(105, -22); ctx.stroke();
      ctx.fillStyle = '#33cc99';
      ctx.beginPath(); ctx.moveTo(105, -22); ctx.lineTo(90, -30); ctx.lineTo(90, -14); ctx.fill();
      ctx.font = 'bold 18px "JetBrains Mono"'; ctx.fillText(`F推=${f_inc.toFixed(1)}N`, 40, -32);

      ctx.restore();

      let l_prog = (t4_incline_state === 'lifting' || t4_incline_state === 'lifted') ? t4_incline_prog : 0;
      let rx_pos = 680;
      let ry_pos = by - l_prog * sh;

      ctx.strokeStyle = 'rgba(255, 128, 64, 0.4)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.strokeRect(rx_pos + 28, by - sh - 45, 55, 45);
      ctx.setLineDash([]);

      ctx.fillStyle = '#ff8040'; ctx.fillRect(rx_pos + 28, ry_pos - 45, 55, 45);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2; ctx.strokeRect(rx_pos + 28, ry_pos - 45, 55, 45);
      ctx.fillStyle = '#11261f'; ctx.font = 'bold 18px "JetBrains Mono"'; ctx.fillText('120N', rx_pos + 33, ry_pos - 17);

      drawChalkPerson(ctx, rx_pos, ry_pos - 14, 0, 'lift', '#ff8040', 1.0);

      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(rx_pos + 55, ry_pos - 45); ctx.lineTo(rx_pos + 55, ry_pos - 110); ctx.stroke();
      ctx.fillStyle = '#ff8040';
      ctx.beginPath(); ctx.moveTo(rx_pos + 55, ry_pos - 110); ctx.lineTo(rx_pos + 47, ry_pos - 95); ctx.lineTo(rx_pos + 63, ry_pos - 95); ctx.fill();
      ctx.font = 'bold 18px "JetBrains Mono"'; ctx.fillText('F抬=120N', rx_pos + 68, ry_pos - 80);

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(rx_pos + 120, by); ctx.lineTo(rx_pos + 120, by - sh); ctx.stroke();
      ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 18px "Noto Sans TC"';
      ctx.fillText(tr(`抬升高度 h = ${t4_h}m`, `Lift Height h = ${t4_h}m`), rx_pos + 130, by - sh/2 + 5);

    } else if (t4_mode === 'screw') {
      if (t4_screw_state === 'winding') {
        t4_screw_time += 0.02;
        if (t4_screw_time >= 4) {
          t4_screw_time = 4;
          t4_screw_state = 'wound';
        }
      }

      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 23px "Noto Sans TC"';
      ctx.fillText(tr('雙斜面自轉捲動模擬：按鈕開始捲動，4 秒後展示螺距 d', 'Screw Winding: Click Start, halts at 4s to show pitch d'), 60, 38);

      let roll_prog = (t4_screw_state === 'idle') ? 0 : (t4_screw_time / 4);
      let isSpinning = (t4_screw_state === 'winding');

      // ✅ 將這兩個位置基準點往下移動，以確保上方文字有充足空間
      let r_y = 200;
      let cyl_r_x = 760, cyl_w = 45, cyl_h = 100;
      
      ctx.fillStyle = '#1e2f27'; ctx.fillRect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h);
      
      ctx.save();
      ctx.beginPath(); ctx.rect(cyl_r_x, r_y - cyl_h, cyl_w, cyl_h); ctx.clip();
      ctx.strokeStyle = 'rgba(163, 184, 176, 0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        let angle = roll_prog * Math.PI * 2 * 4 + (i * Math.PI * 2 / 3);
        let gx = cyl_r_x + cyl_w/2 + (cyl_w/2 - 5) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(gx, r_y - cyl_h); ctx.lineTo(gx, r_y); ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      let topAng1 = roll_prog * Math.PI * 2 * 4;
      ctx.beginPath(); ctx.arc(cyl_r_x + cyl_w/2, r_y - cyl_h - 12, 16, topAng1, topAng1 + Math.PI * 1.3); ctx.stroke();

      let max_len2 = 540;
      let cur_len2 = max_len2 * (1 - roll_prog); 
      if (cur_len2 > 0) {
        let slope2 = cyl_h / max_len2; 
        let cur_h2 = cur_len2 * slope2; 
        let base_l2_x = cyl_r_x - cur_len2;
        ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(base_l2_x, r_y); ctx.lineTo(cyl_r_x, r_y); ctx.lineTo(cyl_r_x, r_y - cur_h2); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 224, 102, 0.15)'; ctx.fill();
      }

      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 5;
      let count2 = Math.floor(roll_prog * 6) + 1;
      for(let i = 0; i < count2; i++) {
        let y_top = (r_y - cyl_h) + 6 + i * 16;
        if (y_top <= r_y - 6) {
          ctx.beginPath(); ctx.moveTo(cyl_r_x + cyl_w, y_top); ctx.lineTo(cyl_r_x, y_top + 10); ctx.stroke();
        }
      }
      
      // ✅ 修正點：將文字統一拉到形狀之上（y 軸再減去 10），並設定起始 X 在左側安全區
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 21px "Noto Sans TC"';
      if (t4_screw_state === 'wound') {
        ctx.fillText(tr('✨ 捲繞完成！螺紋密、螺距 d 小 (極省力)', '✨ Winding Complete! Dense Threads, Small Pitch d (Saves Force)'), 60, r_y - cyl_h - 10);
      } else if (isSpinning) {
        ctx.fillText(tr('緩斜面捲動中... ➔ 螺紋密、螺距 d 小', 'Gentle Incline Winding... ➔ Small Pitch d'), 60, r_y - cyl_h - 10);
      } else {
        ctx.fillText(tr('點擊按鈕開始捲動緩斜面紙條', 'Click button to start winding gentle incline'), 60, r_y - cyl_h - 10);
      }

      // ✅ 將下列基準點也往下移動
      let l_y = 400;
      
      ctx.fillStyle = '#1e2f27'; ctx.fillRect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h);
      ctx.strokeStyle = '#a3b8b0'; ctx.lineWidth = 3; ctx.strokeRect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h);
      
      ctx.save();
      ctx.beginPath(); ctx.rect(cyl_r_x, l_y - cyl_h, cyl_w, cyl_h); ctx.clip();
      ctx.strokeStyle = 'rgba(163, 184, 176, 0.45)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        let angle = roll_prog * Math.PI * 2 * 2 + (i * Math.PI * 2 / 3);
        let gx = cyl_r_x + cyl_w/2 + (cyl_w/2 - 5) * Math.sin(angle);
        ctx.beginPath(); ctx.moveTo(gx, l_y - cyl_h); ctx.lineTo(gx, l_y); ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 3;
      let topAng2 = roll_prog * Math.PI * 2 * 2;
      ctx.beginPath(); ctx.arc(cyl_r_x + cyl_w/2, l_y - cyl_h - 12, 16, topAng2, topAng2 + Math.PI * 1.3); ctx.stroke();

      let max_len1 = 240;
      let cur_len1 = max_len1 * (1 - roll_prog); 
      if (cur_len1 > 0) {
        let slope1 = cyl_h / max_len1; 
        let cur_h1 = cur_len1 * slope1; 
        let base_l1_x = cyl_r_x - cur_len1;
        ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(base_l1_x, l_y); ctx.lineTo(cyl_r_x, l_y); ctx.lineTo(cyl_r_x, l_y - cur_h1); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 128, 64, 0.15)'; ctx.fill();
      }

      ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 5;
      let count1 = Math.floor(roll_prog * 2.5) + 1;
      for(let i = 0; i < count1; i++) {
        let y_top = (l_y - cyl_h) + 10 + i * 36;
        if (y_top <= l_y - 6) {
          ctx.beginPath(); ctx.moveTo(cyl_r_x + cyl_w, y_top); ctx.lineTo(cyl_r_x, y_top + 20); ctx.stroke();
        }
      }
      
      // ✅ 修正點：將文字統一拉到形狀之上（y 軸再減去 10），並設定起始 X 在左側安全區
      ctx.fillStyle = '#ff8040'; ctx.font = 'bold 21px "Noto Sans TC"';
      if (t4_screw_state === 'wound') {
        ctx.fillText(tr('✨ 捲繞完成！螺紋疏、螺距 d 大 (費力省時)', '✨ Winding Complete! Sparse Threads, Large Pitch d'), 60, l_y - cyl_h - 10);
      } else if (isSpinning) {
        ctx.fillText(tr('陡斜面捲動中... ➔ 螺紋疏、螺距 d 大', 'Steep Incline Winding... ➔ Large Pitch d'), 60, l_y - cyl_h - 10);
      } else {
        ctx.fillText(tr('點擊按鈕開始捲動陡斜面紙條', 'Click button to start winding steep incline'), 60, l_y - cyl_h - 10);
      }

    } else if (t4_mode === 'apps') {
      ctx.fillStyle = '#f6f3ea'; ctx.font = 'bold 24px "Noto Sans TC"';
      ctx.fillText(tr('手繪物理生活實例：樓梯 (階梯化斜面) 與 盤山公路 (螺旋)', 'Real-World Apps: Stairs (Incline) & Mountain Road (Screw)'), 40, 40);

      // 分隔線
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(480, 70); ctx.lineTo(480, 410); ctx.stroke();
      ctx.setLineDash([]);

      // === 左側：樓梯手繪圖 ===
      let sx = 60, sy = 360, steps = 6, stepW = 55, stepH = 40;
      
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      for(let i = 0; i < steps; i++) {
        ctx.lineTo(sx + i * stepW, sy - (i + 1) * stepH);
        ctx.lineTo(sx + (i + 1) * stepW, sy - (i + 1) * stepH);
      }
      ctx.stroke();

      // 斜坡等效虛線
      ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + steps * stepW, sy - steps * stepH);
      ctx.stroke();
      ctx.setLineDash([]);

      // 爬樓梯的人物 (0.85x 比例，動作協調自然)
      drawChalkPerson(ctx, sx + 2.5 * stepW, sy - 3 * stepH - 5, 0, 'climb', '#ffe066', 0.85);

      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 20px "Noto Sans TC"';
      ctx.fillText(tr('🪜 樓梯：斜面的階梯化', '🪜 Stairs: Stepped Incline'), 110, 80);
      ctx.fillStyle = '#33cc99'; ctx.font = '18px "Noto Sans TC"';
      ctx.fillText(tr('▲ 綠色虛線為等效平緩斜面 (L)', '▲ Green line: Equivalent Incline (L)'), 70, 395);
      ctx.fillText(tr('將高度 h 拆分為多段小台階，輕鬆拾級而上！', 'Divides vertical height h into easy steps!'), 70, 420);

      // === 右側：盤山公路手繪圖 ===
      let mx = 720, my = 370;

      // 綠色山丘輪廓
      ctx.fillStyle = 'rgba(51, 204, 153, 0.12)';
      ctx.strokeStyle = '#33cc99'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(mx - 200, my);
      ctx.quadraticCurveTo(mx - 150, my - 240, mx, my - 260);
      ctx.quadraticCurveTo(mx + 150, my - 240, mx + 200, my);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 盤山蜿蜒道路
      ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.moveTo(mx - 170, my - 30);
      ctx.quadraticCurveTo(mx, my - 70, mx + 160, my - 60);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(mx + 140, my - 100);
      ctx.quadraticCurveTo(mx, my - 140, mx - 130, my - 130);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(mx - 110, my - 170);
      ctx.quadraticCurveTo(mx, my - 200, mx + 100, my - 190);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(mx + 80, my - 220);
      ctx.quadraticCurveTo(mx, my - 245, mx, my - 260);
      ctx.stroke();

      // 行駛小車 (長 34px, 高 16px)
      let carX = mx - 20, carY = my - 137;
      ctx.fillStyle = '#ff8040';
      ctx.fillRect(carX, carY - 14, 34, 16);
      ctx.strokeStyle = '#f6f3ea'; ctx.lineWidth = 2;
      ctx.strokeRect(carX, carY - 14, 34, 16);
      // 車輪
      ctx.fillStyle = '#11261f';
      ctx.beginPath(); ctx.arc(carX + 7, carY + 3, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(carX + 27, carY + 3, 4.5, 0, Math.PI*2); ctx.fill();

      // 健行登山客 (縮小至 0.35x)
      drawChalkPerson(ctx, mx - 80, my - 45, 0, 'hike', '#ffe066', 0.35);

      ctx.fillStyle = '#4dd2ff'; ctx.font = 'bold 20px "Noto Sans TC"';
      ctx.fillText(tr('🛣️ 盤山公路：纏繞山體的螺旋', '🛣️ Winding Road: Helical Spiral'), 500, 80);
      ctx.fillStyle = '#f6f3ea'; ctx.font = '18px "Noto Sans TC"';
      ctx.fillText(tr('蜿蜒盤旋拉長前進路徑 (L ↑)', 'Lengthens travel path (L ↑)'), 500, 395);
      ctx.fillText(tr('車輛與行人爬坡推力大幅減小 (F ↓)', 'Reduces required climbing force (F ↓)'), 500, 420);
    }
  }

  // --- 全域單一主動畫迴圈 (徹底杜絕競態與凍結) ---
  function mainLoop() {
    if (currentTab === 'tab1') renderTab1();
    else if (currentTab === 'tab2') renderTab2();
    else if (currentTab === 'tab3') renderTab3();
    else if (currentTab === 'tab4') renderTab4();
    requestAnimationFrame(mainLoop);
  }

  // 初始化啟動
  applyTranslations();
  switchTab('tab1', null);
  requestAnimationFrame(mainLoop);
</script>
</body>
</html>
